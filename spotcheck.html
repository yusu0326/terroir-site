所も置いた。\n\n2019年7月、経済振興公社は運営をこのために作られた団体に引き渡した。2022年の時点で、およそ60店が参加している。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"dk-0001","name":"郊外の駅前に共用の家つきの町を1つ作った","name_local":"Nærheden","country":"デンマーク","region":"シェラン島","municipality":"Høje-Taastrup 自治体（Hedehusene）","population_current":59059,"population_scale":"5万〜25万","purpose":"住む人を増やす・戻す","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2013,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"Høje-Taastrup 自治体と Realdania By & Byg のパートナーシップ","component_types":"hard","components":["駅前の土地に新しい住宅地を作った","共用の集会所を3棟置く計画にした","緑の帯ループを町の背骨にした","学校と保育所と体操施設を備えた"],"sources":[{"url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/ny-bydel-i-hedehusene-abner-det-forste-af-flere-modesteder/","title":"Ny bydel i Hedehusene åbner det første af flere mødesteder","outlet":"Dagens Byggeri","published":"2022-02-07","language":"da","from_operator":false},{"url":"https://bygtek.dk/artikel/byggeri/tilflyttere-flokkes-om-nrheden","title":"Tilflyttere flokkes om Nærheden","outlet":"BygTek","published":"2023-09-26","language":"da","from_operator":false},{"url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/beboerhus-er-indviet-til-ny-bydel-i-hedehusene/","title":"Beboerhus er indviet til ny bydel i Hedehusene","outlet":"Dagens Byggeri","published":"2026-01-12","language":"da","from_operator":false}],"context_sources":[{"url":"https://www.htk.dk/om-kommunen/by-og-boligudvikling/befolkningsprognose","title":"Høje-Taastrup Kommune 人口推計（2025年1月1日現在 59,059人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2026,"elapsed_years":13,"follow_up":"濃い","follow_up_note":"2018年に最初の住民が入居し、2022年にはHøje-Taastrup自治体の純転入4.2%の半分をこの地区が占めた。2023年9月に約半数が入居、2026年1月時点で約6,000人が暮らす。","timeline":[{"year":2013,"event":"Høje-Taastrup 自治体と Realdania By & Byg のパートナーシップとして事業が立ち上がった","source_url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/ny-bydel-i-hedehusene-abner-det-forste-af-flere-modesteder/"},{"year":2018,"event":"最初の住民が入居した","source_url":"https://bygtek.dk/artikel/byggeri/tilflyttere-flokkes-om-nrheden"},{"year":2022,"event":"3棟計画のうち1棟目の「街区の家」（250m²）が開いた。同年の自治体の純転入4.2%の半分をこの地区が占めた","source_url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/ny-bydel-i-hedehusene-abner-det-forste-af-flere-modesteder/"},{"year":2026,"event":"1月、駅の真向かいに木造の「街区の家」が開いた。地区の人口は約6,000人","source_url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/beboerhus-er-indviet-til-ny-bydel-i-hedehusene/"}],"last_verified":"2026-08-17","image":{"url":"https://dagensbyggeri.dk/wp-content/uploads/2024/04/117731_1_xl.jpg","type":"photo","relevance_confirmed":true,"credit":"Dagens Byggeri","source_url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/ny-bydel-i-hedehusene-abner-det-forste-af-flere-modesteder/"},"sections":{"何をしたか":"コペンハーゲン西郊、ヘズフーセネ（Hedehusene）の駅前の土地につくられている新しい市街地。2013年に Høje-Taastrup 自治体と Realdania By & Byg のパートナーシップとして立ち上げられた事業で、Dagens Byggeri 2022年2月7日の記事によれば、立ち上げ当初から「共同体と社会的な持続可能性」が中心に置かれ、地区に3棟の「街区の家（kvarterhus）」を配する計画が組まれた。1棟目の250m²の共用棟は2022年2月に開いている。地区の背骨には「ループ（Loopet）」と呼ぶ緑の帯が通り、学校・保育所・体操施設も置かれた。2018年に最初の住民が入居し、2023年9月時点で約3,700人、つまり想定される7,000人強の住民のうち約半分が入居しており、2026年1月時点で約6,000人が暮らす。同月、駅の真向かいに木造の街区の家がもう1棟開いた。","誰が始めたか":"**先に組んだのは自治体と財団の2者である。** BygTek 2023年9月26日と Dagens Byggeri 2022年2月7日は、いずれもこの都市開発が**2013年に Høje-Taastrup 自治体と Realdania By & Byg のパートナーシップとして立ち上げられた**と書いている。**土地の所有者や建設会社ではなく、自治体と建築・都市開発の財団が最初の当事者である。**\n\n**次に置かれたのが事業を回す会社である。** 出典に「NærHeden のプロジェクト部長」として繰り返し出てくるのが Ole Møller で、2023年時点で地区の東西の進み方を説明しているのはこの人物である。財団側の窓口は Realdania By & Byg の代表 Peter Cederfeld で、2022年と2026年の両方の記事で発言している。\n\n**建物を建てるのは民間である。** BygTek によれば、鉄道沿いの北東の角には FB Gruppen が最初の2棟の賃貸集合住宅（Birken と Bøgen）を建て、同じ事業主が Kastanje Rækkerne を建てた。西側に残っていた住宅の区画は Home.Earth が担う。**つまり、区画を用意する主体と建物を建てる主体が分かれている。**\n\n**住民組織は早い段階から運営の側に入っている。** 2022年2月の1棟目の共用棟（kvarterhus）の開所には、自治体の市長 Michael Ziegler、Realdania By & Byg の Peter Cederfeld、NærHeden の Ole Møller と並んで、**地区協会（Bydelsforeningen Nærheden）の理事**が立っている。\n\n**設計と施工の分担も出典に書かれている。** 1棟目（Urtehaven の共用棟）は Arkitema Architects の構想案にもとづいて Panum & Kappel が設計し、KBS Byg が一括請負で建てた。","いくらかかったか":"**金額は確認できなかった。** 出典3本はいずれも共用棟の開所と入居の進み方を扱っており、事業費・負担割合・区画の売却額のいずれも書いていない。代わりに、**費用がどこから出る構造になっているか**は読み取れる。\n\n- **土地と基盤の側は、自治体と財団のパートナーシップが担っている。** 2013年に立ち上がったのはこの2者の組み合わせであり、2026年1月の記事でも同じ2者の名前が出ている\n- **建物の側は民間が出している。** BygTek 2023年9月26日は、**全区画が投資家に売れている**と書いている。住宅を建てているのは FB Gruppen や Home.Earth であって、財団や自治体ではない\n- **共用棟は単独の建物ではなく、集合住宅の一部として建てられている。** 2026年1月に開いた2棟目は、6階建ての集合住宅の中に組み込まれた形である。**共用施設だけを別に建てるより、住宅の事業に抱き合わせている**\n- **公共施設は自治体の側にある。** 学校・保育所・体操施設（springcenter）は自治体の設備として説明されており、2026年1月の記事で市長代理 Kurt Scheelsbeck はこれらを含む提供が移住先としての魅力をつくっていると述べている\n\n`funding_scale` は `unknown_fields` のままとした。**出典に総額が無く、財団と自治体の負担割合も書かれていない**ためである。\n\nなお2026年1月の記事の同じ画面には Realdania の他の助成（別の事業）についての関連記事が並んでいるが、**それらは Nærheden の費用ではない**ので採らなかった。","真似するなら最低何が必要か":"1. **駅の徒歩圏にまとまった土地があること。** 2026年1月に開いた2棟目の共用棟は**ヘズフーセネ駅の真向かい**に立ち、緑の帯「Loopet」に面している。地区の骨格が駅と緑地から引かれている\n2. **自治体と、長く付き合える資金の出し手が組むこと。** 2013年に組んだ Høje-Taastrup 自治体と Realdania By & Byg の2者が、2026年の記事でも同じ立場で出てくる。**入居が半分を超えるまでに10年以上かかる事業なので、途中で降りない相手が要る**\n3. **共用の家を、住宅より先に開けること。** 計画は3棟の「街区の家」で、1棟目は250m²・木造で2022年2月に開いた。カフェ室と小さめの住民室が直接つながって開放でき、大小の厨房と木のテラスを備える。**建物の中身が決まっている**\n4. **住民が使い方を決める器。** 地区協会が開所時から運営に入っており、1棟目は2026年時点でゲームの夜・ハロウィーン・クリスマスの集まりから200人が集まる夏祭りまでに使われている\n5. **区画を投資家に売って建物は民間に建てさせる形。** 全区画が売れており、地区を用意する主体と建てる主体が分かれている\n6. **環境の数値を出せる建て方。** 2026年1月の記事は、2棟目の建設が1m²あたり4.7kgのCO2排出で、**関係者によればこれは大規模な集合住宅としてデンマークの記録であり、建築規則の要求より60%以上低い**と書いている（数値の出所は事業に関わる当事者である）\n\n**確認できないもの**は、事業費の総額、財団と自治体の負担割合、共用棟1棟あたりの建設費、区画の売却額、3棟目の共用棟の時期、想定される7,000人強に達する時期である。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、2026年1月12日の Dagens Byggeri の記事である。**\n\n同記事によれば、150人が立ち会うなかでテープが切られ、**約6,000人が暮らす地区に2棟目の「街区の家」が加わった。** 場所はヘズフーセネ駅の真向かいで、緑の帯 Loopet に面している。木造で、6階建ての集合住宅の一部として建てられた。**1棟目（2022年開業・同じく木造）は、住民がゲームの夜・ハロウィーン・クリスマスの集まり・200人が集まる夏祭りに使っている**と同記事は書いている。\n\n**人口は3本の出典で追える。** 2022年2月時点で市長 Michael Ziegler は約2,000人としたうえで、**1年ほどで倍になった**と述べている。2023年9月時点では約3,700人で、想定される7,000人強のうち半分が入居し、その年さらに800人が入った。**同年の記事は、2022年に Nærheden が Høje-Taastrup 自治体の記録的な純流入4.2%の半分を占めたと書いている。** 2026年1月時点では約6,000人である。\n\n**完成時期の見通しは1本にしかない。** BygTek 2023年9月26日は、全区画が投資家に売れており、**地区は3〜4年後に完成すると見込まれている**と書いている。同時点で西側にはまだ Home.Earth の住宅と、教会の集会室・自治体のクラブ棟が入る空地が残っていた。2026年1月の記事に完成時期の記述はない。\n\n**出典の性格について明記しておく。** **3本はいずれも建設業界紙であり、発言しているのは自治体の市長・財団の代表・事業のプロジェクト部長、つまり事業の当事者である。** 記事に PR・Sponsored の表示は見当たらないが、独立した第三者による検証や、否定的な報道は、**今回探した範囲では見つからなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"dk-0003","name":"住民60か国分の物を集めて1本の細長い広場に並べた","name_local":"Superkilen","country":"デンマーク","region":"首都地域","municipality":"コペンハーゲン（ノアブロ）","population_current":667124,"population_scale":"25万超","purpose":"誇りをつくる","theme":"文化・アート・祭り","start_year":2012,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"コペンハーゲン市（ミーマスゲーゼ地区の都市更新事業の一部。美術家集団 Superflex が関与）","component_types":"hard","components":["3つの広場と公園を750mに並べた","60ほどの国の物や什器を置いた","赤・黒・緑の3区画に塗り分けた","地区の都市更新事業の一部にした"],"funding_scale":"事業費 5,880万クローネ。コペンハーゲン市と Realdania の協働で負担した（Magasinet KBH 2012年6月21日）。2018年の赤の広場の改修は総額1,350万クローネで、うち Realdania が680万クローネ、市は設計者 BIG から220万クローネの賠償を受けた","spotcheck_note":"**2026-08-17：self_reported を外した。** 独立した一次情報が5本そろったため\n（Magasinet KBH 2本 / DR 1本 / 査読誌1本 / 学術書1章）。§4 の発動条件\n「独立した一次報道が3本に満たない」に当たらなくなった。\n\n**UrbanDanmark（https://urbandanmark.dk/superkilen/）を sources から外した。**\n地域別の名所一覧サイトで「Indsend forslag（提案を送る）」を備えており、\n§3「一覧記事・既存DB・Wikipedia はシードとしてのみ使う。sources に入れない」に当たる。\n加えてナビゲーションにアダルトサイトへのリンクが並んでおり、媒体としての独立性も疑わしい。\n**この除外の当否は人が確認すること**（reference/pending.md に積んだ）。\n同記事が担っていた記述は Magasinet KBH 2012年6月21日に置き換えた。\n\n学術2本は**抄録のみを読んでいる**（abstract_only: true）。\nIntellect の章は OA 表示があり PDF があるが、本文は読んでいないので抄録の範囲でしか書いていない。\ntandfonline の掲載日は**オンライン公開が2019年6月26日、収録号が2020年第1号**で割れる。\nここではオンライン公開日を published に採った。\n","sources":[{"url":"https://www.magasinetkbh.dk/indhold/superkilen","title":"Superkilen er (næsten) fuldbragt","outlet":"Magasinet KBH","published":"2012-06-21","language":"da","from_operator":false},{"url":"https://www.kk.dk/dagsordener-og-referater/Teknik-%20og%20Milj%C3%B8udvalget/m%C3%B8de-23112015/referat/punkt-6","title":"Nye belægninger på den røde plads i Superkilen, Nørrebro","outlet":"Københavns Kommune（技術・環境委員会）","published":"2015-11-23","language":"da","from_operator":true},{"url":"https://www.magasinetkbh.dk/indhold/den-rode-plads-er-blevet-rod-igen","title":"Den Røde Plads er blevet rød igen","outlet":"Magasinet KBH","published":"2018-11-30","language":"da","from_operator":false},{"url":"https://www.tandfonline.com/doi/abs/10.1080/13574809.2019.1622409","title":"Superkilen: exploring the human–nonhuman relations of intercultural encounter","outlet":"Journal of Urban Design（Jonathan Daly）","published":"2019-06-26","language":"en","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://intellectdiscover.com/content/books/9781789389616.c08","title":"Atmospheres of Designed Diversity? The Spatial Politics of Superkilen in Copenhagen","outlet":"Entangled Histories of Art and Migration（Intellect・Mareike Schwarz）","published":"2024-09-27","language":"en","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://www.kk.dk/dagsordener-og-referater/N%C3%B8rrebro%20Lokaludvalg/m%C3%B8de-20112025/referat/punkt-8","title":"Henvendelse om tilstanden på Superkilen","outlet":"Københavns Kommune（ノアブロ地区委員会）","published":"2025-11-20","language":"da","from_operator":true},{"url":"https://www.dr.dk/nyheder/kultur/her-er-fire-danske-byparker-du-boer-besoege-og-en-der-slet-ikke-giver-mening","title":"Her er fire danske byparker, du bør besøge – og én, der 'slet ikke giver mening'","outlet":"DR","published":"2026-04-26","language":"da","from_operator":false}],"discrepancies":[{"field":"収録した国の数","values":[{"value":57,"source_url":"https://www.magasinetkbh.dk/indhold/superkilen","published":"2012-06-21"},{"value":"約60","source_url":"https://www.dr.dk/nyheder/kultur/her-er-fire-danske-byparker-du-boer-besoege-og-en-der-slet-ikke-giver-mening","published":"2026-04-26"}]}],"context_sources":[{"url":"https://www.kk.dk/sites/default/files/2025-08/Status%20p%C3%A5%20K%C3%B8benhavn%202025%20UA.pdf","title":"Status på København 2025（コペンハーゲン市の人口 667,124人・2025年1月1日現在）"}],"unknown_fields":[],"latest_source_year":2026,"elapsed_years":14,"follow_up":"濃い","follow_up_note":"2012年の完成直後から赤の広場の舗装が雨天に滑ると指摘され、2015年11月に舗装をやり直す議案が市の委員会にかかり、2018年に総額1,350万クローネで張り替えられた。2025年11月、地区委員会は設立から13年で複数の要素が壊れ、交換や撤去されたものがあり落書きも多いとして市に申し入れた。","timeline":[{"year":2012,"event":"6月に正式に完成した。事業費5,880万クローネはコペンハーゲン市と Realdania の協働で負担","source_url":"https://www.magasinetkbh.dk/indhold/superkilen"},{"year":2015,"event":"11月23日、赤の広場の舗装をやり直す議案が市の技術・環境委員会にかかった","source_url":"https://www.kk.dk/dagsordener-og-referater/Teknik-%20og%20Milj%C3%B8udvalget/m%C3%B8de-23112015/referat/punkt-6"},{"year":2018,"event":"赤の広場の舗装を段階的に張り替えた。総額1,350万クローネ。市は設計者 BIG から220万クローネの賠償を受けた","source_url":"https://www.magasinetkbh.dk/indhold/den-rode-plads-er-blevet-rod-igen"},{"year":2019,"event":"都市デザインの査読誌に、設計思想が空間の実践より表象を優先したとする批判的な論文が出た","source_url":"https://www.tandfonline.com/doi/abs/10.1080/13574809.2019.1622409"},{"year":2025,"event":"11月20日、ノアブロ地区委員会が Superkilen の状態について市の技術・環境委員会に申し入れることを決めた","source_url":"https://www.kk.dk/dagsordener-og-referater/N%C3%B8rrebro%20Lokaludvalg/m%C3%B8de-20112025/referat/punkt-8"},{"year":2026,"event":"4月、DR の企画でデンマークの見るべき都市公園4件の1つに挙げられた","source_url":"https://www.dr.dk/nyheder/kultur/her-er-fire-danske-byparker-du-boer-besoege-og-en-der-slet-ikke-giver-mening"}],"last_verified":"2026-08-17","image":{"url":"https://www.magasinetkbh.dk/sites/default/files/public/migrated/artikel/field_artikler_stort_billede/dsc_0906_.jpg","type":"photo","relevance_confirmed":true,"credit":"Magasinet KBH","source_url":"https://www.magasinetkbh.dk/indhold/superkilen"},"sections":{"何をしたか":"コペンハーゲン外ノアブロにある細長い都市公園。ミーマスゲーゼ地区の都市更新事業の一部として2012年6月に完成した。ノアブロゲーゼからターエンスヴァイまで750mにわたり、赤の広場・黒の広場・緑の公園の3区画からなる。**この地区の住民の出身国を、それぞれの国から選んだ物や什器で表す**という考えでできており、日本の滑り台、アイルランドのマンホールの蓋、モロッコの噴水などが置かれている。**国の数は出典で割れており**、Magasinet KBH は2012年6月21日に57か国から100点あまりと書き、DR は2026年4月26日に約60か国と書いている（`discrepancies` に並置した）。事業費は5,880万クローネで、コペンハーゲン市と Realdania の協働で負担した。蚤の市や音楽の催しにも使われる。2025年11月、ノアブロ地区委員会は、美術家集団 Superflex から状態について連絡を受けたとして、**赤の広場と黒の広場が市内外から多くの人を集めて絶えず大きく傷んでおり、設立から13年で複数の要素が壊れ、交換や撤去されたものがあり、落書きも多い**と市の技術・環境委員会に申し入れることを決めている。","誰が始めたか":"**事業主体はコペンハーゲン市で、ミーマスゲーゼ地区の都市更新事業の一部として行われた。** 費用は市と民間財団 Realdania の協働で負担している（Magasinet KBH 2012年6月21日）。設計は BIG（Bjarke Ingels Group）、Topotek 1、美術家集団 Superflex の3者が組んだ。\n\n**「誰が物を選んだか」がこの事業の要点である。** 各国から集めた100点あまりの什器は、設計者が選んだのではなく、**この地区に住む人たちの出身国に対応させて集められた。** Magasinet KBH は2012年6月21日に、地区住民の57の文化的背景に対応させて57か国から集めたと書いている。DR は2026年4月26日に約60か国と書いており、**数は出典で割れている**（`discrepancies` に並置した）。\n\n維持管理は市が担う。2025年11月にノアブロ地区委員会が市の技術・環境委員会に申し入れを行ったのは、**美術家集団 Superflex から状態について連絡を受けたため**である。つくった側が十数年後に管理者へ働きかける形になっている。","いくらかかったか":"**事業費は5,880万クローネで、コペンハーゲン市と Realdania の協働で負担した**（Magasinet KBH 2012年6月21日）。\n\n**その後の改修費が別にかかっている。** 赤の広場の舗装は雨天に滑ることなどから2018年に段階的に張り替えられ、**総額1,350万クローネ**を要した。内訳は、Realdania が680万クローネを拠出し、**市は設計者 BIG から220万クローネの賠償を受けている**（その大半はドイツの下請けが負担するとされる）。BIG と Realdania は、Superkilen が受けた国際的な建築賞の賞金50万クローネも拠出した（Magasinet KBH 2018年11月30日）。\n\n**つまり、完成から6年で事業費の約23%にあたる額を舗装のやり直しに使っている。**","真似するなら最低何が必要か":"この事例で真似できる単位は、細長い公園そのものではなく**物の集め方と、その後の負担の決め方**である。\n\n第一に、**住民の出身国に物を対応させる**こと。日本の滑り台、アイルランドのマンホールの蓋、モロッコの噴水といった具合に、地区に住む人の背景に一つずつ物を割り当てている。**抽象的な多文化の表現ではなく、対応関係が具体的である。**\n\n第二に、**都市更新事業の一部として立てる**こと。単独の公園整備ではなく、ミーマスゲーゼ地区の更新の中に置かれている。\n\n第三に、**目立つ素材を使うなら、直す費用と責任を先に決めておく**こと。赤い舗装は雨天に滑り、輸入した運動器具は早くに壊れた。2018年の張り替えは1,350万クローネかかり、費用は財団の追加拠出と設計者からの賠償で埋められた。**つくるときに決めていなければ、直すときに誰が払うかで交渉になる。**\n\n第四に、**人が集まりすぎることを傷みの原因として見込む**こと。2025年11月の地区委員会の申し入れは、市内外から多くの人を集めるがゆえに絶えず大きく傷んでいるという趣旨である。**成功が損耗を生む構造になっている。**\n\n第五に、**評価が割れることを前提にする**こと。DR が2026年に見るべき都市公園の1つに挙げる一方で、査読論文は社会的結束への寄与が実証されていないと述べ、学術書の章は地元の都市研究者によるプレイス・マーケティング批判を出発点に置いている。**同じ場所について、称賛と検証が並行して積み上がる。**","今どうなっているか":"2026年8月時点で確認できたのは、2026年4月26日の DR の記事までである。\n\n**痛みと評価の両方が同時に記録されている。**\n\n痛みの側。完成から1年ほどの2012年6月、Magasinet KBH は、赤の広場の赤いアスファルトが雨のとき自転車で走るには滑りやすく、輸入した運動器具のいくつかが早くも壊れたと書いている。2015年11月には舗装をやり直す議案が市の技術・環境委員会にかかり、2018年に段階的に張り替えられた。**改修は総額1,350万クローネで、Realdania が680万クローネを出し、市は設計者 BIG から220万クローネの賠償を受けた**（その大半はドイツの下請けが負担するとされる）。2025年11月には、ノアブロ地区委員会が、13年で複数の要素が壊れ落書きも多いとして市に申し入れている。\n\n評価の側。2026年4月26日、DR はデンマークで見るべき都市公園4件の1つに Superkilen を挙げた。デザイン評論家の Ane Cortzen は、赤の広場から始まってノアブロを横断する構成を挙げ、地区の住民と観光客の両方に使われていると述べている。\n\n**学術の側からは、称賛そのものを検討し直す論文が出ている。** Jonathan Daly は2019年の論文の抄録で、Superkilen は多文化地区の社会的結束を高めるために設計されたにもかかわらず、その建築の形がその目的にどれだけ寄与しているかはほとんど研究されていないと述べ、設計思想が空間の実践より表象を優先したと批判している。Mareike Schwarz は2024年の章の抄録で、地元の都市研究者がプレイス・マーケティングだと批判したことを出発点に置き、国別の representation にもとづく構想と、移民ではない者が大半を占める設計陣が、移民の当事者的な知の反映に乏しかったとしている。**ただし同じ抄録は、現地調査では民族間の肯定的な接触が確認され、来訪者が自分の出身に結びつく物を気に入りのものとして挙げたとも書いている。**\n\n**2025年11月の申し入れに対する市や設計者の回答は確認できなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"5,880万クローネ","currency":"DKK","value":58800000,"jpy":1459833833},{"raw":"1,350万クローネ","currency":"DKK","value":13500000,"jpy":335165931},{"raw":"680万クローネ","currency":"DKK","value":6800000,"jpy":168824321},{"raw":"220万クローネ","currency":"DKK","value":2200000,"jpy":54619633},{"raw":"50万クローネ","currency":"DKK","value":500000,"jpy":12413553}],"sample":false},{"id":"dk-0004","name":"小さな村どうしが束を作り、施設と活動を分け合う仕組みを広げた","name_local":"Landsbyklynger","name_variants":["landsbyklynge","landsbyklyngen"],"country":"デンマーク","region":"全土","municipality":"複数の自治体（束ごとに異なる）","population_current":null,"population_scale":"不明","purpose":"住む人を増やす・戻す","theme":"学校・公共施設","start_year":2015,"end_year":null,"status_current":"判定不能","actor_type":"財団・助成機関","lead_actor":"Realdania・DGI・Lokale og Anlægsfonden と複数の自治体","component_types":"soft","components":["近隣の村どうしで束 allelsamfund の一覧から外れるための住民構成の入れ替え**として書いている。 そのため `components` には「老朽した」と書かず、出典[2]の「低層の7棟」に寄せた。 人口はオーフス市単位の値を取れる入口を確認できなかった。 **2025年5月の時点で、改修が始まったのは5棟のうち1棟目だけで、完了は2029年末の見込みである。** 出典[4]は「住民の転居をめぐる訴訟のため、ほぼ空になった2棟がまだ壊せていない」とも書いている。 そのため `components` には**棟数・戸数の総量を書かなかった**（住戸の組み替え方など、出典に直接の裏づけがある数値は残した）。 **「壊した材の95%を再び使う」も `components` から外した**——これは出典[1]の2015年の3棟の解体についての 実績値で、事業全体の方針として書いた出典が無いためである（本文と `timeline` には年つきで残した）。 **団地の建った年は出典で振れている**——出典[2][3]は1968〜72年、出典[1]は「70年代の初め」と書いている。","unknown_fields":["population_current","population_scale"],"latest_source_year":2025,"elapsed_years":10,"follow_up":"濃い","follow_up_note":"Dagens Byggeri は2025年5月27日に、住宅組合と施工会社のあいだで見直した協定により、Karen Blixen Kvarteret の第1期に着手できるようになったと伝えている。同記事によれば、この街区は52,000平方メートルで578戸と3,000平方メートルの事業用の床を含み、年金基金と組んで進められる。","timeline":[{"year":2015,"event":"3棟のコンクリートの住棟の解体がまもなく終わり、材のおよそ95%が再び使われると報じられた","source_url":"https://dagensbyggeri.dk/erhverv-og-politik/gellerup-nedrivning-naesten-tilendebragt/"},{"year":2024,"event":"新しい全体計画が7棟の解体と残りの棟の作り替えを含み、予算はおよそ13億クローネだと報じられた","source_url":"https://dagensbyggeri.dk/renovering/budget-13-mia-kr-omdanner-600-gellerup-boliger-til-750/"},{"year":2025,"event":"5棟のうち最初の1棟の改修が始まり、各階3戸だったところを4戸にすると報じられた","source_url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/starter-nu-600-lejligheder-omdannes-til-750-i-gellerupparken/"},{"year":2025,"event":"住民の転居をめぐる訴訟のため、ほぼ空になった2棟がまだ壊せていないと報じられた","source_url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/aftale-sikrer-opstart-paa-foerste-etape-af-karen-blixen-kvarteret-i-gellerup/"}],"last_verified":"2026-08-19","image":{"url":"https://dagensbyggeri.dk/wp-content/uploads/2025/05/gellerup-1-Foto-Brabrand-Boligforening.jpg","type":"photo","relevance_confirmed":true,"credit":"Dagens Byggeri","source_url":"https://dagensbyggeri.dk/byggeri-og-anlaeg/starter-nu-600-lejligheder-omdannes-til-750-i-gellerupparken/"},"sections":{"何をしたか":"オーフスの西にある大きな公営住宅団地を、壊しながら作り替えている。Dagens Byggeri は2015年2月14日に、3棟のコンクリートの住棟の解体がまもなく終わること、壊した材のおよそ95%が再び使われることを報じている。同紙は2024年6月28日に、新しい全体計画が7棟の解体と残りの棟の作り替えを含むこと、5棟の7階建ての600戸を750戸に組み替える工事の予算がおよそ13億クローネで、2029年末に終わる見込みだと伝えている。同紙は2025年5月21日に、5棟のうち最初の1棟の改修が始まること、各階3戸だったところを4戸にし、1階に天井の高い住戸を入れることを書いている。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"ec-0001","name":"市が住民に菜園のつくり方を教え続け、余った分を売る有機農産物の直売市をひらいた","name_local":"Proyecto de Agricultura Urbana Participativa","name_variants":["AGRUPAR","Agrupar"],"country":"エクアドル","region":"ピチンチャ県","municipality":"キト首都特別区","population_scale":"25万超","purpose":"お金を地域で回す","theme":"農林水産・食","start_year":2002,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"キト首都特別区自治体（経済振興公社 ConQuito の事業として実施）","component_types":"hybrid","components":["住居のパティオと屋上に菜園をつくる","技術者が菜園を訪ねて講習する","余った分を売る有機農産物の直売市をひらく","木箱やタイヤを栽培の容器に使う","学校や老人ホームにも菜園を広げる"],"single_outlet":false,"self_reported":true,"sources":[{"url":"https://habitat.aq.upm.es/dubai/14/bp0022.html","title":"Quito y su agricultura urbana: AGRUPAR (Ecuador)","outlet":"Ciudades para un Futuro más Sostenible（マドリード工科大学建築学校）","published":"2016-10-30","language":"es","from_operator":true},{"url":"https://www.elcomercio.com/actualidad/quito/quitenos-huertos-hogares/","title":"Más quiteños tienen huertos en sus hogares - El Comercio","outlet":"El Comercio","published":"2017-04-22","language":"es","from_operator":false},{"url":"https://www.futurepolicy.org/global/quito-agrupar/","title":"Quito's Participatory Urban Agriculture Programme - futurepolicy.org","outlet":"World Future Council","published":"2018-11-22","language":"en","from_operator":true},{"url":"https://www.elcomercio.com/tendencias/huerto-urbano-departamento-quito-agricultura/","title":"¿Un huerto urbano en un departamento? Conozca cinco cosas clave para tener uno en Quito - El Comercio","outlet":"El Comercio","published":"2020-08-13","language":"es","from_operator":false},{"url":"https://www.expreso.ec/actualidad/huertos-urbanos-toman-capital-93682.html","title":"Quito | Los huertos urbanos se toman la capital","outlet":"Expreso","published":"2020-11-17","language":"es","from_operator":false},{"url":"https://www.quitoinforma.gob.ec/2022/06/27/agricultura-urbana-un-proyecto-que-tiene-20-anos-de-vida-y-buenos-resultados/","title":"Agricultura Urbana un proyecto que tiene 20 años de vida y buenos resultados – Quito Informa","outlet":"Quito Informa（キト首都特別区自治体）","published":"2022-06-27","language":"es","from_operator":true},{"url":"https://www.quitoinforma.gob.ec/2025/05/03/huertos-urbanos-en-quito-agrupar-lleva-mas-de-147-mil-beneficiarios/","title":"Huertos urbanos en Quito: AGRUPAR lleva más de 147 mil beneficiarios – Quito Informa","outlet":"Quito Informa（キト首都特別区自治体）","published":"2025-05-03","language":"es","from_operator":true}],"context_sources":[],"editor_notes":"**出典7本のうち、独立しているのは3本である。**El Comercio の2本（2017年・2020年）と Expreso（2020年）だけが 独立した取材で、残る4本は事業者の側にある。 出典[1]はマドリード工科大学の図書館が載せている頁だが、**器で判断してはいけない**—— 「Contacto Principal」がキト首都特別区自治体・ConQuito・AGRUPAR 自身であり、 **応募者が誰かは頁に書かれていない**が、記述の中身は目的・戦略・財務・「学んだこと」まで当事者の側から書かれている。よって from_operator を true にした。 出典[3]は賞を出した World Future Council が受賞事例について書いた頁で、写真の出所も ConQuito である。 運営者そのものではないが独立とは言えないので、こちらも true 側に倒した。**この線引きは編者に見てほしい。** 出典[6][7]は自治体の広報である。 **`self_reported: true` とした理由。** 受益者147,000人・菜園5,271・年間1,350,000キロといった 大きな数字は、いずれも自治体の広報にしか出てこない。 **ただし、独立した3本も事業の規模を独自に確かめてはいない**——2017年の菜園の数と面積は「Agrupar の数字によれば」、 行政区の例外の理由と作物の種類は事業の技術者の発言、2020年の活動中の菜園の数は ConQuito の数字として書かれている。 **独立しているのは取材と記述であって、数字の検証ではない。媒体の数でいえば2社である**（El Comercio と Expreso）。 **数の数え方が2通りある。** 出典[2]は2002年の306から3,312に増えたと書き、出典[5]は活動中の菜園を1,500、 出典[7]は23年で実施した菜園を5,271・いま生産している菜園をおよそ2,215としている。 **「これまでに実施した数」と「いま動いている数」は別の数え方であり、出典は両者を突き合わせていない。** 本文でも並べず、それぞれどちらの数え方かを明記した。**`discrepancies` には入れていない**—— 同じラベルの下に数える範囲の違う数を並べることになるためである（lessons W・BB）。 **一般参加者の実名は書いていない。** 出典[2]と出典[5]は菜園を営む個人を実名と年齢つきで複数挙げているが、 いずれも公的立場にない住民なので本文に持ち込まなかった（CLAUDE.md 絶対禁止9）。 組織を代表する人物（ConQuito の事務局長）だけを名前で書いた。 **purpose について。** 出典が事業の目的として繰り返し書いているのは 「食の安全保障と食料主権」であり、これは purpose 8種のどれにも当たらない。**同じ型はこれで7件目である。** 8種の中では、余った分を生産者が直接売る有機農産物の直売市・生産者どうしの物々交換・世帯の支出の節約を根拠に `お金を地域で回す` を当てた。`商いを起こす`（467の起業）も当たりうる。pending.md の同日の項に書き足した。 **エクアドルの人口の入口は測っていない。** `population_scale` は出典[3]がキトの人口を 1980年の78万人から2000年に140万人へと書いていることから25万超とした。 現在の人口は取っていないので `unknown_fields` に申告した。 **取れなかった媒体**：eluniverso.com・revistas.flacsoandes.edu.ec・repositorio.flacsoandes.edu.ec・ dspace.ups.edu.ec は robots.txt が claudebot を拒否、lahora.com.ec は `*` を拒否している。 キト中央大学の評価論文（dspace.uce.edu.ec）はボット判定の関門が出るので取りに行っていない。 DOAJ は「AGRUPAR」が「まとめる」という一般動詞なので使えなかった（無関係の農学論文が返る）。","unknown_fields":["population_current"],"latest_source_year":2025,"elapsed_years":23,"follow_up":"濃い","follow_up_note":"キト首都特別区自治体は2025年5月3日に、23年間で5,271の菜園と3,170の生産設備をつくり、147,000人を超える人が直接の受益者になったと書いている。同じ広報によれば、いま活動している受益者は5,500人で、生産している菜園はおよそ2,215である。","timeline":[{"year":2002,"event":"5月2日に始まり、この年の菜園は306だったと報じられた","source_url":"https://www.elcomercio.com/actualidad/quito/quitenos-huertos-hogares/"},{"year":2006,"event":"生産者が直接売る有機農産物の直売市（ビオフェリア）が始まったとされる","source_url":"https://www.quitoinforma.gob.ec/2025/05/03/huertos-urbanos-en-quito-agrupar-lleva-mas-de-147-mil-beneficiarios/"},{"year":2018,"event":"世界未来評議会が国連食糧農業機関などと組んで出す銀賞に、この事業を選んだ","source_url":"https://www.futurepolicy.org/global/quito-agrupar/"},{"year":2020,"event":"感染症の流行のあいだに菜園が増え、活動中の1,500のうち300はこの期間に始まったと報じられた","source_url":"https://www.expreso.ec/actualidad/huertos-urbanos-toman-capital-93682.html"},{"year":2025,"event":"23年間で5,271の菜園をつくり147,000人を超える受益者を得たと自治体が書いた","source_url":"https://www.quitoinforma.gob.ec/2025/05/03/huertos-urbanos-en-quito-agrupar-lleva-mas-de-147-mil-beneficiarios/"}],"last_verified":"2026-08-20","image":{"url":"https://www.quitoinforma.gob.ec/wp-content/uploads/2025/05/agruparcumple-23-aos.jpeg","type":"photo","relevance_confirmed":true,"credit":"Quito Informa（キト首都特別区自治体）","source_url":"https://www.quitoinforma.gob.ec/2025/05/03/huertos-urbanos-en-quito-agrupar-lleva-mas-de-147-mil-beneficiarios/"},"sections":{"何をしたか":"キトの自治体が、住民に菜園のつくり方を教える事業を2002年から続けている。エル・コメルシオは2017年4月22日に、事業の技術者が菜園を訪ねて回り、ConQuito で講習を行っていることを報じている。同紙が **Agrupar の数字として**伝えるところでは、2002年に306だった菜園が3,312に増え、市の29ヘクタールに及んでいる。同紙によれば、菜園はキトの65の行政区（parroquias）のうち63にある。同紙が **Agrupar の技術者の言葉として**伝えるところでは、無いのは空間の足りない中心部と、遠いプエジャロの2つだけである。栽培には木箱・タイヤ・煉瓦・大瓶が容器として使われる。","誰が始めたか":"キト首都特別区自治体が、経済振興の公社 ConQuito を通じて実施している。自治体の広報は2022年6月27日に、2002年から自治体がこの事業を実施していること、目的がアグロエコロジーによる生産、社会と性の公正、責任ある消費、都市と周辺の農村とのつながり、そしてキトのレジリエンスであることを書いている。\n\n世界未来評議会は2018年11月22日の頁で、この事業が始まった背景を次のように書いている。1980年から2000年のあいだに国内の他の地域からの移住でキトの人口は78万人から140万人へとほぼ倍増し、1999年には市の人口の48%が貧困線を下回っていた。2000年にキトで中南米とカリブの自治体の代表が集まり、そこで出された宣言が、この地域の都市に都市農業を取り入れるよう呼びかけた最初のものだった。\n\nマドリード工科大学の図書館が載せている記述——**連絡先として自治体・ConQuito・AGRUPAR 自身が挙げられている**——によれば、この事業は市の社会的包摂の政策の中の代表的な事業と位置づけられ、2014年のドバイのベストプラクティス選考で BEST に選ばれている。同じ記述は、米州開発銀行と多数国間投資基金、社会開発調整省と技能訓練庁を提携先として挙げている。","いくらかかったか":"マドリード工科大学の図書館が載せている記述——**連絡先として自治体・ConQuito・AGRUPAR 自身が挙げられている**——には、2009年から2013年までの財務の表がある。それによれば、5年間の予算の合計は1,447,277ドルで、うちキト市が1,210,377ドル、米州開発銀行と多数国間投資基金が125,000ドル、技能訓練庁が40,400ドル、社会開発調整省が21,500ドル、非政府組織のトリプレ・サルトが50,000ドルである。\n\n世界未来評議会は2018年11月22日の頁で、2010年から AGRUPAR が ConQuito の年次の事業計画の中に自前の予算を持つようになったこと、2018年の予算が283,336ドルで、その大半にあたるおよそ255,842ドルをキト首都特別区が出し、およそ27,495ドルが役務の販売による自主財源であることを書いている。同頁によれば、予算の90%は技術陣にあてられ、残りが有機認証、キトの食料政策づくり、都市農業の解説施設、広報、技術支援に使われる。\n\n同頁は、参加する側の負担についても書いている。それによれば、温室や家畜用の小屋のような生産設備への投資のうちおよそ25%から33%を参加する農家が負担し、参加者は講習1回につき1ドル、技術者の訪問1回につき2ドルという名目的な額を払う。年金生活者・子ども・障害のある人などは免除される。\n\n住民の側から見たお金の出入りもある。エル・コメルシオは2017年4月22日に、南部の地区で菜園を営む人が、発芽させた苗を1株0.05ドルから0.17ドルで農家に売っていることを報じている。同紙が Agrupar の技術者の言葉として伝えるところでは、キトでは45種の野菜と10種の果物、15種の薬草がつくれる。同紙によれば、菜園からは年におよそ500トンが収穫される。\n\n自治体の広報は2025年5月3日に、23年のあいだに467の起業が生まれ、10,900回を超える有機農産物の直売市（ビオフェリア）が開かれ、そこで170万キロを超える生産物が売られて、340万ドルを超える収入になったと書いている。**これらの数字は自治体の広報にしか出てこない。**","真似するなら最低何が必要か":"**教える人が菜園まで出向く。** エル・コメルシオは2017年4月22日に、事業の技術者が菜園を訪問し、ConQuito で講習を行っていることを報じている。同紙によれば、種をまく前の段階から技術が使われ、場所と作物に応じて温室を建てたり、専用の覆いをかけたりする。\n\n**容器は買わなくてよい。** 同紙によれば、栽培に最低限の広さは要らず、再生した木箱・タイヤ・煉瓦・大瓶が容器になる。エル・コメルシオは2020年8月13日にも、集合住宅の一室でも菜園はつくれるとして、ConQuito の技術者の助言を伝えている。\n\n**売り先は1つではない。** 自治体の広報は2025年5月3日に、生産者が直接売る直売市が2006年から続いていること、販売が菜園そのものからの手渡しや個別の配達、生産者どうしの物々交換でも行われていることを書いている。同広報は2022年6月27日に、活動中の直売市を13としている。\n\n**参加するのは誰かを見ておく。** 自治体の広報は2022年6月27日に、毎年4,500人を超える耕作者が参加し、その多くが世帯主である女性（84%）だと書いている。同広報によれば、事業はキトの中でも最も弱い立場の地域に的を絞りつつ、他の地域も排除していない。","今どうなっているか":"エクスプレソは2020年11月17日に、感染症の流行のあいだに菜園が増えたと報じている。同紙によれば、市には1,500の活動中の菜園があり、そのうち300は衛生上の緊急事態のあいだに始まった。経済振興公社 ConQuito の事務局長 Wilson Merino は同紙に、食料を手に入れることが難しくなったために菜園が選択肢になったと述べている。同氏は同紙に、キト首都特別区の飢餓の指標を3.6%として、菜園がその解決策ではないという趣旨のことも述べている。\n\n自治体の広報は2025年5月3日に、23年間で5,271の菜園と3,170の生産設備をつくり、147,000人を超える人が直接の受益者になったと書いている。同広報によれば、いま活動している受益者は5,500人で、生産している菜園はおよそ2,215である。同広報は2022年6月27日には、活動中の菜園を2,200、菜園が年に生む食料を1,350,000キロ（57%が自家消費、43%が販売）としていた。**受益者については、同広報は13万人超という数を、活動中の菜園2,200・直売市13と同じ一文に「推計される」として並べており、数え方を書き分けていない。**\n\n**菜園の数には2通りの数え方がある。** 出典が挙げるのは「これまでに実施した数」（2017年に3,312、2025年に5,271）と「いま動いている数」（2020年に1,500、2022年に2,200、2025年におよそ2,215）で、**どの出典も両者を突き合わせていない。**この記録でも並べていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"1,447,277ドル","currency":"USD","value":1447277,"jpy":230293734},{"raw":"1,210,377ドル","currency":"USD","value":1210377,"jpy":192597712},{"raw":"125,000ドル","currency":"USD","value":125000,"jpy":19890261},{"raw":"40,400ドル","currency":"USD","value":40400,"jpy":6428532},{"raw":"21,500ドル","currency":"USD","value":21500,"jpy":3421125},{"raw":"50,000ドル","currency":"USD","value":50000,"jpy":7956104},{"raw":"283,336ドル","currency":"USD","value":283336,"jpy":45085015},{"raw":"255,842ドル","currency":"USD","value":255842,"jpy":40710112},{"raw":"27,495ドル","currency":"USD","value":27495,"jpy":4375062},{"raw":"1ドル","currency":"USD","value":1,"jpy":159},{"raw":"2ドル","currency":"USD","value":2,"jpy":318},{"raw":"0.05ドル","currency":"USD","value":0.05,"jpy":8},{"raw":"0.17ドル","currency":"USD","value":0.17,"jpy":27},{"raw":"340万ドル","currency":"USD","value":3400000,"jpy":541015089}],"sample":false},{"id":"es-0001","name":"43年の住民運動の末に旧繊維工場を受け取り、住民が自分たちで運営している","name_local":"Can Batlló","country":"スペイン","region":"カタルーニャ州","municipality":"バルセロナ（サンツ=ムンジュイック区ラ・ボルデタ地区）","population_current":1732066,"population_scale":"25万超","purpose":"住民が決める","theme":"空き家・空き店舗・遊休不動産","start_year":2011,"end_year":null,"status_current":"継続中","actor_type":"住民組織","lead_actor":"Plataforma Recuperem Can Batlló ／ Assemblea de Can Batlló（ラ・ボルデタの住民組織）","component_types":"hybrid","components":["旧繊維工場の建物を住民に開いた","一か月後に住民運営の図書館を開いた","市の委員会が長期の譲渡を議決した","敷地に協同組合の拠点を置いた"],"sources":[{"url":"https://beteve.cat/societat/can-batllo-aniversari-autogestio-veins-sants/","title":"Can Batlló celebra tres anys de gestió veïnal","outlet":"betevé","published":"2014-06-11","language":"ca","from_operator":false},{"url":"https://www.publico.es/sociedad/gestion-comunitaria-echa-fuertes-raices-barcelona.html","title":"La gestión comunitaria echa fuertes raíces en Barcelona","outlet":"Público","published":"2017-02-04","language":"es","from_operator":false},{"url":"https://beteve.cat/societat/can-batllo-gestio-entitats-veinals-cessio-ajuntament-50-anys/","title":"Els veïns s'asseguren la gestió de Can Batlló per als propers 50 anys","outlet":"betevé","published":"2019-03-20","language":"ca","from_operator":false},{"url":"https://www.publico.es/public/coronavirus-apaga-flama-can-batllo.html","title":"El coronavirus no apaga la flama de Can Batlló","outlet":"Públic","published":"2020-06-17","language":"ca","from_operator":false},{"url":"https://beteve.cat/economia/bloc4bcn-celebra-primer-any-cooperacio-can-batllo/","title":"El Bloc4BCN celebra el primer any de cooperació a Can Batlló amb bona salut","outlet":"betevé","published":"2025-03-31","language":"ca","from_operator":false}],"context_sources":[{"url":"https://www.elnacional.cat/ca/barcelona/barcelona-te-1732066-habitants-cada-cop-mes-prop-seu-maxim-historic_1426087_102.html","title":"ElNacional.cat「Barcelona té 1.732.066 habitants」（2025年1月1日現在の住民登録にもとづく市の人口 1,732,066人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":14,"follow_up":"濃い","follow_up_note":"2011年6月に住民が敷地に入り、2014年には3年目が報じられた。2019年3月に市の経済委員会が30年（最長50年）の譲渡を承認し、2069年までの管理が住民側に渡った。2025年には敷地内の協同組合拠点が1年目を迎えている。","timeline":[{"year":2011,"event":"プラットフォーム Recuperem Can Batlló が期限とした6月11日に住民が敷地に入り、一か月後に最初の自主管理施設 Biblioteca Popular Josep Pons が開いた","source_url":"https://beteve.cat/societat/can-batllo-aniversari-autogestio-veins-sants/"},{"year":2019,"event":"市の経済委員会が30年（20年延長可・最長50年）の譲渡を承認し、2069年までの管理が住民組織に渡った","source_url":"https://beteve.cat/societat/can-batllo-gestio-entitats-veinals-cessio-ajuntament-50-anys/"},{"year":2020,"event":"感染症対策で施設が閉じ、9周年の催しはオンラインで行われた","source_url":"https://www.publico.es/public/coronavirus-apaga-flama-can-batllo.html"},{"year":2025,"event":"敷地内の Bloc4BCN が1年目を迎え、39の協同組合が入っていると報じられた","source_url":"https://beteve.cat/economia/bloc4bcn-celebra-primer-any-cooperacio-can-batllo/"}],"last_verified":"2026-08-17","image":{"url":"https://img.beteve.cat/wp-content/uploads/2014/06/110614brindisR.jpg","type":"photo","relevance_confirmed":true,"credit":"betevé","source_url":"https://beteve.cat/societat/can-batllo-aniversari-autogestio-veins-sants/"},"sections":{"何をしたか":"バルセロナ市ラ・ボルデタ地区にある9ヘクタールの旧繊維工場 Can Batlló を、住民が受け取って自分たちで運営している。地区に施設と緑地が足りないとして住民が市に開放を求め続け、プラットフォーム Recuperem Can Batlló は6月11日という期限を切った。その日、住民は敷地に入った。市が最初に譲ったのは Bloc Onze という1棟だけで、のちに他の建物が加わった。入ってから一か月後、最初の自主管理施設として図書館 Biblioteca Popular Josep Pons が開いた。betevé は2019年3月、市の経済委員会が30年（20年延長可・最長50年）の譲渡を承認し、管理が2069年まで住民組織の手に渡ったと報じている。同記事は、これが43年におよぶ住民運動のあとに来たものだと書いている。","誰が始めたか":"**地区の住民組織である。** ただし2011年に始まった話ではない。プブリコの2017年の記事によれば、この工場の敷地を地区のために使えという要求は**40年前にさかのぼり**、その背景にはラ・ボルデタにおける施設の歴史的な不足がある。敷地は19世紀に2,000人以上が働く大きな繊維工場を抱えていたが、次第に力を失った。1990年代の終わり、地区の住民協会は改めて強く要求する好機だと考えた。\n\n倉庫群を所有する会社は、市が住宅を建てられる土地を代わりに提供することを条件に、住民へ用地を譲ると約束した。**しかしその取り決めは実現せず、地区は苛立ちを募らせる。** 転機は2005年、サン・マディー教会の占拠だった。サンツ社会センターの代表 Josep Maria Domingo は、フランコ時代以来行われていなかった異例のことで、報道と野党の関心を引いたと同記事に語っている。これで合意は進んだが、市は動かないまま時間が過ぎ、住民は街頭での行動、社会センターでの籠城、デモへと圧力を強めた。\n\n**2011年に鍵が渡った背景には、住民側の力だけでない事情もある。** プブリコの2020年の記事は、この日が市政の歴史的な交代と重なったことを挙げている。社会党が32年ぶりに市長の座を失い、同じ日に新市長が就任した。加えて不動産バブルの終わりと、15Mの運動の誕生という2つの要因が住民に有利に働いた。","いくらかかったか":"**事業費は確認できなかった**が、**運営の収支の作り方は出典に書かれている。**\n\nプブリコの2020年の記事によれば、住民が担う部分は主に**バーの収入**で支えられ、加えて一部の会員が払う会費が助けになっている。**彼らは一貫して公的な補助金なしで動くことを望んできた**——市が建物の改修に投じる分を除いて。\n\n会費は任意で、**300人の会員のうち払っているのは25%にとどまる。** バー以外の活動はすべて無料である。この構造のため、感染症対策でバーを閉じたことは経営に直接響いた。同記事は、自分たちの空間でも、敷地内の協同組合の側でも打撃があり、一部は一時帰休の手続きを取らざるをえなかったと伝えている。\n\n**つまりこの事業の財源は「補助金を取らないこと」を前提に組まれており、その代わりに1軒のバーへの依存が生じている。**","真似するなら最低何が必要か":"出典から読み取れる条件は5つある。\n\n1. **要求を数十年続けられる住民組織。** 2017年の記事は要求の起点を40年前に置き、2019年の記事は43年の闘いと書く。**どちらの数え方でも、世代をまたぐ長さである**\n2. **期限を自分たちで切ること。** プラットフォームは6月11日という日付を区切った。**相手が動かないときに、こちらが日付を決めている**\n3. **法を越える行動と、その後の交渉の両方。** 2005年の教会占拠は報道と野党の関心を引き、合意を進めた。ただしそれだけでは足りず、そのあとも街頭行動と籠城が続いている\n4. **入ってすぐ何かを開けること。** 敷地に入った一か月後に図書館が開いた。**「勝ち取った」ことを目に見える形にするまでの時間が短い**\n5. **補助金なしで回す前提なら、収入源を1つに頼らないこと。** バーの収入が止まったときに何が起きるかは、2020年の記事が示している\n\n**確認できない**のは、市が建物の改修に投じた額、譲渡契約の詳細な条件、そして参加する住民の総数である。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2025年3月31日のベテベーの記事である。敷地内の Bloc4BCN が1年目を迎え、**39の協同組合**が入っている。社会的連帯経済に充てられたこの空間について、運営団体の責任者 Guillem Llorens は、壁を壊して世界中から人が集まる場の拠点になることを狙いとして語っている。\n\n**管理の期限は2069年まで決まっている。** 2019年3月に市の経済委員会が30年（20年延長可・最長50年）の譲渡を承認しており、ベテベーはこれをバルセロナでこれほど重要な資産が自主管理の団体にこれほど長い期間で与えられた最初の例だと書いた。議決では BComú・PDeCAT・PSC・CUP と1人の市会議員が賛成し、Cs が反対、ERC と PP が棄権している。\n\n2020年の時点で敷地には、図書館（蔵書およそ25,000冊）、講堂、クライミングウォール、ダンス・ヨガ・英語・造形・ビールなど20ほどの工房、日曜大工の場、印刷の場があり、そこから都市菜園、住宅協同組合 La Borda、協同組合を支援する Coòpolis などが生まれている。\n\n**否定的な報道は、今回探した範囲では見つからなかった。** ただし2020年の記事が伝えた財政の弱さ（バー依存と会費を払う会員の少なさ）が、その後どうなったかは確認できていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"es-0002","name":"市営屠畜場だった建物群を、棟ごとに文化施設へ変えていった","name_local":"Matadero Madrid","country":"スペイン","region":"マドリード州","municipality":"マドリード（アルガンスエラ区）","population_current":3527924,"population_scale":"25万超","purpose":"空間をひらく","theme":"空き家・空き店舗・遊休不動産","start_year":2006,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"マドリード市（Ayuntamiento de Madrid）。運営は市の文化事業会社 Madrid Destino","component_types":"hybrid","components":["市営屠畜場の建物を文化施設に変えた","棟ごとに段階的に改修して開いた","運営を市の文化事業会社に委ねた","一棟を10年の事業権で民間に貸した"],"sources":[{"url":"https://www.eldiario.es/madrid/matadero-abre-cultura-pago_1_8854659.html","title":"Matadero se abre a la cultura de pago","outlet":"elDiario.es","published":"2022-03-23","language":"es","from_operator":false},{"url":"https://www.eldiario.es/guia-ocio/matadero-madrid-celebra-centenario-20-actividades-gratuitas-experiencia-inmersiva_1_11759686.html","title":"Matadero Madrid celebra su centenario con más de 20 actividades gratuitas y una experiencia inmersiva","outlet":"elDiario.es","published":"2024-10-25","language":"es","from_operator":false},{"url":"https://www.eldiario.es/madrid/somos/arganzuela/vecinos-academicos-artistas-recuperan-memoria-matadero-espacio-represion-murieron-838-mendigos_1_12909210.html","title":"Vecinos, académicos y artistas recuperan la memoria de Matadero como espacio de represión","outlet":"elDiario.es","published":"2026-01-15","language":"es","from_operator":false}],"context_sources":[{"url":"https://www.madrid.es/portales/munimadrid/es/Inicio/Actualidad/Noticias/La-poblacion-de-la-ciudad-de-Madrid-supera-por-primera-vez-los-3-5-millones-de-habitantes-la-cifra-mas-alta-de-su-historia/?vgnextfmt=default&vgnextoid=4c2657aa3bdc6910VgnVCM1000001d4a900aRCRD&vgnextchannel=a12149fa40ec9410VgnVCM100000171f5a0aRCRD","title":"マドリード市「La población de la ciudad de Madrid supera por primera vez los 3,5 millones de habitantes」（住民登録にもとづく市の人口 3,527,924人）"}],"single_outlet":true,"unknown_fields":["funding_scale"],"latest_source_year":2026,"elapsed_years":20,"follow_up":"濃い","follow_up_note":"敷地は2006年に文化施設として開いた。2022年に一棟が有料の常設展示に貸し出されて運営方針の変化が報じられ、2024年には建物の完成から100年の催しが行われた。2026年には敷地の過去をめぐる記録の掘り起こしが報じられている。","timeline":[{"year":2006,"event":"旧市営屠畜場の敷地が、当時のガジャルドン市長のもとで文化施設として開いた","source_url":"https://www.eldiario.es/madrid/matadero-abre-cultura-pago_1_8854659.html"},{"year":2022,"event":"Nave 16 が10年の事業権で有料の没入型展示施設に貸し出され、120を超えるマドリードの文化団体が市の文化担当に不満を表明したと報じられた","source_url":"https://www.eldiario.es/madrid/matadero-abre-cultura-pago_1_8854659.html"},{"year":2024,"event":"建物の完成から100年を記念する催しが10月24日から11月17日まで行われた","source_url":"https://www.eldiario.es/guia-ocio/matadero-madrid-celebra-centenario-20-actividades-gratuitas-experiencia-inmersiva_1_11759686.html"},{"year":2026,"event":"住民・研究者・芸術家が、この場所にあった収容施設の記録を掘り起こしていると報じられた","source_url":"https://www.eldiario.es/madrid/somos/arganzuela/vecinos-academicos-artistas-recuperan-memoria-matadero-espacio-represion-murieron-838-mendigos_1_12909210.html"}],"last_verified":"2026-08-17","image":{"url":"https://static.eldiario.es/clip/d553f365-4fd8-4542-9911-c7acae9034d1_facebook-watermarked-aspect-ratio-1200-675_default_0.jpg","type":"photo","relevance_confirmed":true,"credit":"elDiario.es","source_url":"https://www.eldiario.es/guia-ocio/matadero-madrid-celebra-centenario-20-actividades-gratuitas-experiencia-inmersiva_1_11759686.html"},"sections":{"何をしたか":"マドリード市アルガンスエラ区にある旧市営屠畜場の建物群を、市が棟ごとに文化施設へ変えていった。建物は Luis Bellido の設計で1924年10月に完成し、市営の屠畜場と家畜市場として開いたものである。elDiario.es は、この敷地が2006年に当時のガジャルドン市長のもとで文化施設として開かれたと書いている。2022年には Nave 16 が10年の事業権で有料の没入型展示施設に貸し出された。市の文化事業会社 Madrid Destino の Ángel Martín Vizcaíno は市議会の委員会で、最初の週末に6,000人が訪れたと述べている。同じ記事は、120を超えるマドリードの文化団体が市の文化担当に不満を表明したとも書いている。","誰が始めたか":"マドリード市である。elDiario.es は、この敷地が2006年に当時のガジャルドン市長のもとで文化施設として開かれたと書いている。運営は市の文化事業会社 Madrid Destino が担い、2022年の記事では同社の Ángel Martín Vizcaíno が市議会の委員会で新しい施設について説明している。**建物そのものは市のもので、運営は市の会社、個々の空間の一部は民間の事業権**という三層になっている。\n\n**方針は市の文化行政の担当者によって変わる。** 2022年の記事は、市の文化担当だった Andrea Levy が Medialab Prado を立ち退かせてマタデロへ移し、その跡地に「現代創造」の拠点を開いた経緯に触れ、この時期に施設の位置づけが動いたと書いている。","いくらかかったか":"**施設全体の整備費は確認できなかった**（`funding_scale` は `unknown_fields`）。一方で、**個別の空間がどういう条件で貸されているかは分かる。**\n\n2022年の elDiario.es によれば、Nave 16 に入った没入型展示施設は**10年の事業権**で、事業者は市に**年間42万6,000ユーロの賃料**を払い、**年に少なくとも3本の没入型作品を出す**義務を負う。月あたりにすると3万5,000ユーロを超える。\n\n入場料は一般14.90ユーロ、65歳以上は窓口で12.90ユーロ、子どもも9.90ユーロを取る。同紙は、4人家族がクリムトの絵を投影する催しを見ると50ユーロ近くになると書いた。開業から最初の週末の来場は6,000人だった。**公有の空間で、来場者が払う入場料によって短期に採算が立つ構図**を、同紙は問題として提示している。","真似するなら最低何が必要か":"1. **建物が公有であること。** 44棟ではなく1つの敷地に十数棟が集まる規模の建物群を、市が持っている\n2. **運営を担う専門の主体。** 市の直営ではなく文化事業会社が運営している\n3. **空間ごとに条件を変えられる仕組み。** 無料の展示と、10年の事業権で貸す有料の施設が同じ敷地に併存している\n4. **その配分を決める責任者がいること。** 上の配分は文化行政の担当者が決めており、**担当者が代われば配分も動く。** 2022年に120を超える文化団体が不満を表明したのはこの点である\n5. **敷地の過去を扱う用意。** 下記のとおり、100年の建物には市が語ってこなかった歴史がある\n\n**確認できない**のは、施設全体の年間予算、無料と有料の比率、そして市が事業権の条件をどう決めたかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年1月15日の elDiario.es の記事である。**内容は催しの案内ではなく、敷地の過去の掘り起こしである。**\n\n同紙によれば、今日「高級文化」の場となっているこの敷地は、戦後に「マタデロの乞食公園（Parque de Mendigos de Matadero）」と呼ばれる収容の場を抱えており、**838人が死んだ**とされるその存在は数十年にわたって知られてこなかった。人類学者 Martínez Aranda が記憶の一部を掘り起こしたのち、芸術家とアルガンスエラ地区の住民組織が、犠牲者を記憶するための催しを組んだ。関連記事の見出しは、ひと冬で800人以上が死んだと伝えている。\n\n同記事はまた、**週末にマタデロの棟のあいだを歩いても、かつて家畜市場であり屠畜の場であったことを想像させるものはほとんどない**と書き、この場所を労働者階級の舞台として掘り下げた取り組みはあるものの、いま支配的なのは中産階級の作法だと指摘している。\n\n**Terroir はこの評価を判定しない。** ただし、2024年10月の100周年の催しが建物の歴史を扱う展示や建築の円卓会議を並べたのに対し、その1年余りあとに住民と研究者と芸術家の側から**別の歴史**が提示された、という順序は記録しておく価値がある。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"42万6,000ユーロ","currency":"EUR","value":426000,"jpy":79065600},{"raw":"3万5,000ユーロ","currency":"EUR","value":35000,"jpy":6496000},{"raw":"14.90ユーロ","currency":"EUR","value":14.9,"jpy":2765},{"raw":"12.90ユーロ","currency":"EUR","value":12.9,"jpy":2394},{"raw":"9.90ユーロ","currency":"EUR","value":9.9,"jpy":1837},{"raw":"50ユーロ","currency":"EUR","value":50,"jpy":9280}],"sample":false},{"id":"es-0003","name":"市の計画づくりを、対面の会合とネット上の場を組み合わせて住民に開いた","name_local":"decidim.barcelona","name_variants":["Decidim Barcelona","Decidim.Barcelona"],"country":"スペイン","region":"カタルーニャ州","municipality":"バルセロナ","population_current":1732066,"population_scale":"25万超","purpose":"住民が決める","theme":"デジタル・情報発信","start_year":2016,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"バルセロナ市（Ajuntament de Barcelona）","component_types":"soft","components":["市の計画案をネット上に公開した","対面の会合を約300回組んだ","提案への賛同を数えて示した","参加型予算の投票に使った"],"sources":[{"url":"https://www.publico.es/espana/web-facilita-proceso-participativo-planes.html","title":"Una web facilita el \"proceso participativo\" en los planes municipales de Barcelona","outlet":"Público","published":"2016-02-01","language":"es","from_operator":false},{"url":"https://beteve.cat/politica/proces-participatiu-decidim-barcelona-tanca-22-600-usuaris-plataforma-digital-pam-pad/","title":"El procés participatiu Decidim.Barcelona es tanca amb més de 22.600 usuaris","outlet":"betevé","published":"2016-04-09","language":"ca","from_operator":false},{"url":"https://www.vilaweb.cat/noticies/barcelona-inclou-nous-canvis-en-la-plataforma-participativa-decidim-barcelona/","title":"Barcelona inclou nous canvis en la plataforma participativa 'decidim.barcelona'","outlet":"VilaWeb","published":"2017-07-04","language":"ca","from_operator":false},{"url":"https://www.eldiario.es/tecnologia/clicktivismo-radicalidad-democratica_1_1756851.html","title":"Del 'clicktivismo' a la democracia directa: en qué punto está la participación digital","outlet":"elDiario.es","published":"2019-01-08","language":"es","from_operator":false},{"url":"https://www.elnacional.cat/es/barcelona/barcelona-destinara-30-millones-euros-segunda-edicion-presupuestos-participativos_1295409_102.html","title":"Barcelona destinará 30 millones de euros a la segunda edición de los presupuestos participativos","outlet":"ElNacional.cat","published":"2024-10-07","language":"es","from_operator":false}],"context_sources":[{"url":"https://www.elnacional.cat/ca/barcelona/barcelona-te-1732066-habitants-cada-cop-mes-prop-seu-maxim-historic_1426087_102.html","title":"ElNacional.cat「Barcelona té 1.732.066 habitants」（2025年1月1日現在の住民登録にもとづく市の人口 1,732,066人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2024,"elapsed_years":8,"follow_up":"濃い","follow_up_note":"2016年2月に市の計画づくりの場として始まり、同年4月には登録2万2,600人・提案1万300件と報じられた。2017年に機能が加えられ、2024年には参加型予算の2回目に使われている。1回目は約7万人が加わって76事業が採択されたと報じられた。","timeline":[{"year":2016,"event":"2月1日、市が計画（PAM・PAD）づくりに住民参加を組み込み、約300回の対面の会合と新しいデジタル基盤 decidim.barcelona を併用すると発表した","source_url":"https://www.publico.es/espana/web-facilita-proceso-participativo-planes.html"},{"year":2016,"event":"4月、最初の過程が閉じ、登録者2万2,600人以上・提案1万300件（うち9,000件が市民から）・賛同15万6,000件と報じられた","source_url":"https://beteve.cat/politica/proces-participatiu-decidim-barcelona-tanca-22-600-usuaris-plataforma-digital-pam-pad/"},{"year":2017,"event":"基盤に新しい機能が加えられた","source_url":"https://www.vilaweb.cat/noticies/barcelona-inclou-nous-canvis-en-la-plataforma-participativa-decidim-barcelona/"},{"year":2019,"event":"参加・地区担当市会議員の Gala Pin は、基盤の利用者が街頭の議論の場に出ていくことを狙いとして語っている","source_url":"https://www.eldiario.es/tecnologia/clicktivismo-radicalidad-democratica_1_1756851.html"},{"year":2024,"event":"参加型予算の2回目が始まり、任期中に3,000万ユーロを10区に配分すると発表された。1回目は約7万人が加わり76事業が採択され、うち72が実施済みか実施中だと市会議員の Lluís Rabell が述べた","source_url":"https://www.elnacional.cat/es/barcelona/barcelona-destinara-30-millones-euros-segunda-edicion-presupuestos-participativos_1295409_102.html"}],"last_verified":"2026-08-17","image":{"url":"https://static.eldiario.es/clip/c5a434d2-9c05-485b-9941-b42c1b05dbb5_facebook-watermarked-aspect-ratio-1200-675_default_0.jpg","type":"photo","relevance_confirmed":true,"credit":"elDiario.es","source_url":"https://www.eldiario.es/tecnologia/clicktivismo-radicalidad-democratica_1_1756851.html"},"sections":{"何をしたか":"バルセロナ市が、市の計画づくり（PAM＝市の行動計画、PAD＝区の行動計画）を住民に開いた。2016年2月1日、市は計画を決める前の段階に住民参加を組み込み、約300回の対面の会合と、新しいデジタル基盤 decidim.barcelona を併用すると発表した。プブリコは、この基盤がこのドメインを初めて使うものだと書いている。会合は分野別に50回、区ごとに200回以上が予定され、対面から出た提案も画面から出た提案も同じ場に集める形をとった。同年4月に最初の過程が閉じたとき、ベテベーは、登録者が2万2,600人を超え、提案が1万300件、うち9,000件が市民からのもので、賛同が15万6,000件集まったと伝えている。","誰が始めたか":"バルセロナ市である。2016年の立ち上げ時から、参加を担当する市会議員が前面に出て説明している。ベテベーの2016年4月の記事で、参加担当の Gala Pin は、政策を市民とともに作ったほうが民主的で、うまくいき、日々の暮らしの必要に沿うという確信があると述べている。\n\n**この事業の性格は、担当者の言葉に表れている。** elDiario.es の2019年の記事で同氏は、この基盤を普遍的なものにして市政の議題に働きかける場を作りたいと語り、同時に、**利用者が画面の中にとどまらず街頭の議論の場に出ていくこと**を狙いとして挙げている。同記事は、マドリードが最初からデジタルの側を優先したのに対し、**バルセロナは対面と既存の団体のつながりの側に力を置いた**と対比している。","いくらかかったか":"**確認できなかった。** 基盤の開発費も運用費も、今回の出典には金額として書かれていないため `funding_scale` は `unknown_fields` に挙げている。\n\n**ただし、この基盤を使って配分される金額は分かる。** ElNacional.cat の2024年の記事によれば、参加型予算の2回目は任期中に**3,000万ユーロ**を市内10区に配分する。区ごとの配分には差があり、レス・コルツの最低200万ユーロから、シウタ・ベリャ／サンツ＝ムンジュイック／ノウ・バリス／サン・マルティの最高360万ユーロまで、人口などを加味して重みづけされている。使い道は3つの分野に限られる——公共空間の改善、市の施設の改善、そして資産の取得と改修である。","真似するなら最低何が必要か":"1. **対面の場を同時に用意すること。** 2016年の立ち上げは約300回の会合（分野別50回、区ごとに200回以上）と同時だった。**画面だけでは始まっていない**\n2. **対面と画面の提案を同じ場所に集めること。** 出典は、両方から出た提案を1つの場に集める設計だったと書いている\n3. **賛同を数えて見せること。** 最初の過程で提案1万300件に対して賛同15万6,000件が集まった。**提案の数より、賛同の数のほうが桁が大きい**\n4. **決定に接続すること。** 2024年の参加型予算では、市民の提案にもとづいて実際に予算費目が割り当てられる。**意見を集めるだけの仕組みとはここで分かれる**\n5. **街頭に戻す意識。** 2019年の記事が伝える担当者の狙いは、利用者を画面から議論の場へ移すことだった\n\n**確認できない**のは、開発費・運用費、提案がどの割合で実際の政策になったか、そして参加者の属性の偏りである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2024年10月7日の ElNacional.cat の記事である。参加型予算の2回目が始まり、市会議員の Lluís Rabell は、目的の1つは参加を促し市民のあいだに参加の文化を生むことだと述べた。\n\n**1回目の結果も同じ記事にある。** およそ7万人が参加し、**76の事業が採択され、そのうち72が実施済みか実施中**だという。実際に行われたものとしてはエスパーニャ・インドゥストリアル公園の改修が挙げられ、一方でカタルーニャ広場の自転車道は、よくてもランブラスの改修待ちの状態で残されている。\n\n**採択された事業の95%が実施済みか実施中という数字は、参加の仕組みとしては強い部類に入る。** ただしこれは市の側が発表した数字であり、独立した検証を今回の出典は含んでいない。また1回目は感染症の流行の影響を受けたと同記事は書いている。\n\n否定的な報道は、今回探した範囲では見つからなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"3,000万ユーロ","currency":"EUR","value":30000000,"jpy":5568000000},{"raw":"200万ユーロ","currency":"EUR","value":2000000,"jpy":371200000},{"raw":"360万ユーロ","currency":"EUR","value":3600000,"jpy":668160000}],"sample":false},{"id":"es-0004","name":"学校の校庭を、授業のない時間と休暇のあいだ、まちに開けた","name_local":"Patis Escolars Oberts al Barri","name_variants":["Patis escolars oberts al barri"],"country":"スペイン","region":"カタルーニャ州","municipality":"バルセロナ","population_current":1732066,"population_scale":"25万超","purpose":"空間をひらく","theme":"学校・公共施設","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"バルセロナ市（Ajuntament de Barcelona）","component_types":"soft","components":["学校の校庭を授業外に開けた","見守りの担当をつけて開閉した","市立保育所の園庭も加えた","休暇期間にも開けるようにした"],"sources":[{"url":"https://beteve.cat/societat/patis-oberts-barri-escoles/","title":"Festa dels invents i la creativitat als Patis Escolars Oberts al Barri","outlet":"betevé","published":"2013-01-11","language":"ca","from_operator":false},{"url":"https://beteve.cat/societat/barcelona-torna-obrir-patis-caps-setmana/","title":"Barcelona torna a obrir patis els caps de setmana","outlet":"betevé","published":"2021-05-29","language":"ca","from_operator":false},{"url":"https://beteve.cat/societat/quatre-escoles-bressol-incorporen-patis-oberts-escolars/","title":"Quatre escoles bressol municipals se sumen als patis oberts","outlet":"betevé","published":"2021-11-05","language":"ca","from_operator":false},{"url":"https://beteve.cat/politica/obren-patis-12-escoles-barcelona-setmana-santa-2023/","title":"Obren els patis de 12 escoles durant la Setmana Santa","outlet":"betevé","published":"2023-04-01","language":"ca","from_operator":false}],"context_sources":[{"url":"https://www.elnacional.cat/ca/barcelona/barcelona-te-1732066-habitants-cada-cop-mes-prop-seu-maxim-historic_1426087_102.html","title":"ElNacional.cat「Barcelona té 1.732.066 habitants」（2025年1月1日現在の住民登録にもとづく市の人口 1,732,066人）"}],"single_outlet":true,"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2023,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、報道は2013年から2023年にわたる。2021年に感染症対策の中断から再開し、同年から夏休み中も開くようになった。同年11月に市立保育所4か所が加わり、2023年のイースター休暇には37か所が開いた。","timeline":[{"year":2013,"event":"「Patis Escolars Oberts al Barri」の枠内で、発明と創作の催しが開かれた","source_url":"https://beteve.cat/societat/patis-oberts-barri-escoles/"},{"year":2021,"event":"感染症対策の制限で中断していた公立校の校庭の開放が再開し、この年から夏休み中も開くことになった。6月27日までは12校が土日に開けた","source_url":"https://beteve.cat/societat/barcelona-torna-obrir-patis-caps-setmana/"},{"year":2021,"event":"11月6日から市立保育所4か所が加わり、6歳未満の子どもとその家族が入れるようになった","source_url":"https://beteve.cat/societat/quatre-escoles-bressol-incorporen-patis-oberts-escolars/"},{"year":2023,"event":"イースター休暇に学校・中等学校・保育所あわせて37か所の校庭が開いた","source_url":"https://beteve.cat/politica/obren-patis-12-escoles-barcelona-setmana-santa-2023/"}],"last_verified":"2026-08-17","image":{"url":"https://img.beteve.cat/wp-content/uploads/2021/05/IMG_1703-1.jpg","type":"photo","relevance_confirmed":true,"credit":"betevé","source_url":"https://beteve.cat/societat/barcelona-torna-obrir-patis-caps-setmana/"},"sections":{"何をしたか":"バルセロナ市が、学校の校庭を授業のない時間と休暇のあいだ、まちに開けている。ベテベーは、この取り組みの目的を、授業時間外や休暇期間に遊べる場所を用意することだと書いている。開けた校庭にはそれぞれ見守りの担当がつき、決められた時間に開閉して使われ方を見る。市は、施設の使い方を無駄なくし、教育と社会の面を強めるためだとしている。2021年には、感染症対策で止まっていた公立校の校庭の開放が再開し、この年から夏休み中も開くようになった。同年11月には市立保育所4か所が加わり、6歳未満の子どもとその家族が入れるようになった。2023年のイースター休暇には、学校・中等学校・保育所あわせて37か所が開いた。","誰が始めたか":"バルセロナ市である。ベテベーの記事はいずれも市の事業として書いており、学校側や住民組織が始めたという記述はない。**開始年は今回の4本のどれにも4桁の西暦として出てこない**ため、`start_year` は空欄にして `unknown_fields` に申告した。記録として確認できるのは2013年から2023年までである。\n\n市が挙げている目的は2つある。ひとつは、授業時間外や休暇の期間に遊べる場所を用意すること。もうひとつは2023年の記事にある言い方で、**施設の使い方を無駄なくし、そこが持つ教育と社会の面を強めること**である。開けた校庭は家族・子ども・若者に、安全な環境での共同の利用と活動の場として提供される。","いくらかかったか":"**確認できなかった。** 今回の出典に予算の記載はない。\n\nただし**費用がどこに発生するかは分かる。** 開けた校庭にはそれぞれ**見守りの担当者**がつき、決められた時間に開閉し、使われ方を見る。2021年の記事は、夏休み中の開放にあたって、教育的な活動を行う指導員が付くと書いている。**この人件費がこの事業の実質的な費用である。** 建物は既にあり、新しく作るものはない。","真似するなら最低何が必要か":"1. **すでにある施設であること。** 校庭は建設済みで、閉じている時間帯があるだけである。**作らずに増やせる**\n2. **開閉と見守りをする人。** これが唯一にして最大の必要条件である。鍵を開けて閉めるだけでなく、使われ方を見る役が要る\n3. **年齢で場所を分ける発想。** 2021年11月に加わった市立保育所の園庭は、6歳未満とその家族に限り、土曜のみの開放という別の条件で運用されている\n4. **時間帯を割り振ること。** 2023年のイースター休暇では、7か所が午前11〜14時、5か所が午後16時30分〜19時30分と分かれていた\n5. **段階的に広げる前提。** 2021年の再開は「今後数か月かけて順次」という形で、一斉ではなかった\n\n**確認できない**のは、予算、見守りの担当者の雇用の形、そして学校側の同意をどう取り付けたかである。**他人の敷地ではなく市の施設であるとはいえ、日常的に使っているのは学校である。** この調整の記述が出典にない。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2023年4月1日のベテベーの記事である。イースター休暇に、学校・中等学校・保育所あわせて**37か所**の校庭が開いた。\n\n**規模は増えてきている。** 2021年5月の再開時は12校が土日に開ける状態だった。同年11月に市立保育所4か所が加わり、2023年には37か所になっている。\n\n一方で、この事業は**一度止まっている。** 2021年5月の記事は、公立校の校庭の開放が感染症対策の制限で中断していたものが再開したと伝えており、同時にこの年から夏休み中も開けるようになったと書いている。**中断を挟んで、以前より広い形で戻ってきた**という経過である。\n\n**2023年以降の状況は確認できていない。** 最新の出典が3年前であり、開放されている校庭の数がその後どうなったかは分からない。否定的な報道も、今回探した範囲では見つからなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"es-0005","name":"旧工業・港湾・鉄道の用地を、州と国が半分ずつ出資する会社が30年かけて街に変えた","name_local":"Bilbao Ría 2000","name_variants":["Ría 2000"],"country":"スペイン","region":"バスク州ビスカヤ県","municipality":"ビルバオ（および隣接するバラカルド）","population_current":346903,"population_scale":"25万超","purpose":"空間をひらく","theme":"空き家・空き店舗・遊休不動産","start_year":1992,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"Bilbao Ría 2000（バスク州側の機関とスペイン国の機関が50%ずつ出資する公共会社）","component_types":"hard","components":["旧工業・港湾・鉄道用地を転換した","州と国が半分ずつ出資する会社を作った","用地売却の益を次の事業に回した","30年で10億ユーロ超を投じた"],"funding_scale":"総投資10億2,000万ユーロ超（2023年5月時点）","sources":[{"url":"https://www.deia.eus/bizkaia/2013/03/22/bilbao-ria-2000-plantea-disolucion/285957.html","title":"Bilbao Ría 2000 plantea su disolución","outlet":"Deia","published":"2013-03-22","language":"es","from_operator":false},{"url":"https://www.deia.eus/bizkaia/2017/11/20/bilbao-ria-2000-conmemora-25-4905811.html","title":"Bilbao Ría 2000 conmemora 25 años de éxito en la transformación urbana","outlet":"Deia","published":"2017-11-20","language":"es","from_operator":false},{"url":"https://www.elsaltodiario.com/bilbao/bilbao-la-fabula-posmoderna-estrategia-frente-espejismo-zorrotzaurre","title":"Bilbao, la fábula posmoderna (III): La estrategia frente al espejismo de Zorrotzaurre","outlet":"El Salto","published":"2018-05-23","language":"es","from_operator":false},{"url":"https://www.deia.eus/bilbao/2023/05/10/bilbao-ria-2000-cumple-30-6784775.html","title":"Bilbao Ría 2000 cumple 30 años aún con una década de proyectos por delante","outlet":"Deia","published":"2023-05-10","language":"es","from_operator":false},{"url":"https://www.deia.eus/bilbao/2024/07/22/ria-2000-licitara-master-plan-8511325.html","title":"Ría 2000 licitará el master plan de la nueva Olabeaga después del verano","outlet":"Deia","published":"2024-07-22","language":"es","from_operator":false}],"context_sources":[{"url":"https://www.deia.eus/bilbao/2024/01/31/radiografia-bilbao-ocho-distrito-7808069.html","title":"Deia「Radiografía de Bilbao y los 346.903 bilbainos de sus 8 distritos」（ビルバオ市の人口 346,903人）"}],"unknown_fields":[],"latest_source_year":2024,"elapsed_years":32,"follow_up":"濃い","follow_up_note":"1992年に設立され、2013年3月には取締役会が秩序ある閉鎖の計画づくりを指示した。2017年には25年、2023年には30年が報じられ、総投資は10億2,000万ユーロを超えた。2024年にはオラベアガのマスタープランの入札が伝えられている。","timeline":[{"year":1992,"event":"バスク州側の機関とスペイン国の機関が50%ずつ出資する会社として設立された","source_url":"https://www.deia.eus/bilbao/2023/05/10/bilbao-ria-2000-cumple-30-6784775.html"},{"year":2013,"event":"取締役会が支配人に「秩序ある閉鎖」の計画づくりを指示した。設立目的は達したとの判断と、建設不況で用地売却益という主財源を失った経営難が理由とされた","source_url":"https://www.deia.eus/bizkaia/2013/03/22/bilbao-ria-2000-plantea-disolucion/285957.html"},{"year":2017,"event":"設立25年を都市の変革の成果として記念したと報じられた","source_url":"https://www.deia.eus/bizkaia/2017/11/20/bilbao-ria-2000-conmemora-25-4905811.html"},{"year":2018,"event":"エル・サルトが、ソロツァウレの枠組みはこの会社の手法を引き継ぐ投機的な都市計画だと批判した","source_url":"https://www.elsaltodiario.com/bilbao/bilbao-la-fabula-posmoderna-estrategia-frente-espejismo-zorrotzaurre"},{"year":2023,"event":"設立30年。総投資は10億2,000万ユーロを超え、なお10年分の事業が残るとされた","source_url":"https://www.deia.eus/bilbao/2023/05/10/bilbao-ria-2000-cumple-30-6784775.html"},{"year":2024,"event":"オラベアガのマスタープランを夏以降に入札すると報じられた","source_url":"https://www.deia.eus/bilbao/2024/07/22/ria-2000-licitara-master-plan-8511325.html"}],"last_verified":"2026-08-17","image":{"url":"https://estaticosgn-cdn.deia.eus/clip/aa04cb1b-13ce-40ac-a12b-803090039613_16-9-aspect-ratio_default_0.jpg","type":"photo","relevance_confirmed":true,"credit":"Deia","source_url":"https://www.deia.eus/bilbao/2023/05/10/bilbao-ria-2000-cumple-30-6784775.html"},"sections":{"何をしたか":"ビルバオと隣のバラカルドで、使われなくなった工業・港湾・鉄道の用地を都市の空間に作り替えてきた。担い手は1992年に作られた Bilbao Ría 2000 という会社で、デイアによれば**バスク州側の機関とスペイン国の機関が50%ずつ出資する公共会社**である。手をつけた場所は、アバンドイバラ、アメツォラ公園、ガレジャノ、ビルバオ・ラ・ビエハ、そしてバラカルドのウルバン＝ガリンドなど。2023年5月の時点で総投資は10億2,000万ユーロを超えた。資金の作り方に特徴があり、**整備した用地を売って得た差益を次の事業に回す**形をとってきた。この仕組みは2008年以降の建設不況で行き詰まり、2013年には会社を畳む計画が検討されている。","誰が始めたか":"デイアは、この会社をバスク州側の機関とスペイン国の機関が半分ずつ出資して作った「vasco estatal（バスク・国）」の会社だと繰り返し書いている。つまり**市が単独で作ったものではなく、国と地域が同じ持ち分で並ぶ形**である。2013年の記事では、取締役会が支配人の Ángel Nieva に閉鎖計画の作成を委ねたと報じられており、意思決定は取締役会にある。\n\nエル・サルトは2018年、ソロツァウレの再生を担う管理委員会をこの会社の「直接の後継」と位置づけている。**同じ手法が別の器で引き継がれているという見方**であり、担い手が誰かという問いは今も論点になっている。","いくらかかったか":"**総投資10億2,000万ユーロ超**（2023年5月・デイア）。Terroir の収録件のなかでは金額が明示されている数少ない例である。\n\nより重要なのは金の出どころで、デイアの2013年の記事によれば、この会社の資金は歴史的に**整備した用地を売って得る差益**に基づいていた。建設不況はその主要な財源を絶ち、会社は4年にわたる経営難に陥った。2013年に閉鎖が検討された理由は、目的を達したという判断と、この財源の消失の2つである。\n\nつまり**この方式は地価が上がり続けることを前提にしている**。真似する側が最初に確かめるべきはここである。","真似するなら最低何が必要か":"出典から読み取れる条件は4つある。\n\n1. **まとまった量の公有地。** 旧港湾・旧鉄道・旧工場という、行政の側が動かせる大きな土地がなければこの方式は成立しない\n2. **国と地域が同じ持ち分で入る器。** 50%ずつという構成は、どちらか一方の財政事情や政権交代で事業が止まりにくい形になっている\n3. **用地売却益を次に回す資金の循環。** ただし上記のとおり、これは地価上昇を前提とする。**不況が来ると財源そのものが消える**\n4. **数十年の時間。** 1992年に始まり、2023年時点でなお10年分の事業が残るとされている。10年で終わる話ではない\n\n**確認できない**のは、住民の関与の仕組みである。出典には合意形成の手続きが出てこない。エル・サルトの批判は、まさにその不在（開かれた議論の欠如）に向けられている。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2024年7月22日のデイアの記事で、オラベアガのマスタープランを夏以降に入札するとしている。2023年5月の30周年の記事は、バラカルドの川沿い公園の工事が前月に始まったこと、オラベアガの再生ではレンフェの線路を地下化して新しい街路と住宅を作る計画であることを伝えている。**事業は続いており、2013年に検討された閉鎖は実行されていない。**\n\n評価は割れている。デイアは2017年の見出しで25年を「都市の変革の成功」と書いた。一方エル・サルトは2018年、この会社が開発利益の最大化と地価上昇の取り込みを軸にした「機会主義的で投機的な都市計画」であり、アバンドイバラの戦略の破綻が教訓になっていない、成功をうたう語りが実質的な議論を封じている、と論じている。**Terroir はどちらが正しいかを判定しない。両方が同じ事業について書かれたものとして並べる。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"10億2,000万ユーロ","currency":"EUR","value":1020000000,"jpy":189312000000}],"sample":false},{"id":"es-0006","name":"碁盤の目の一角で車を締め出し、8年かけて仮設から本設に切り替えた","name_local":"superilla de Sant Antoni","name_variants":["Superilla de Sant Antoni"],"country":"スペイン","region":"カタルーニャ州","municipality":"バルセロナ（エシャンプラ区サン・アントニ）","population_current":1732066,"population_scale":"25万超","purpose":"歩けるようにする","theme":"交通・道路・駅","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"バルセロナ市（Ajuntament de Barcelona）","component_types":"hybrid","components":["通りから車を締め出した","仮設の什器で先に作って試した","効果を数値で測って公表した","8年後に本設の舗装に切り替えた"],"funding_scale":"本設化の工事費は1,150万ユーロ（うちコンテ・ボレイ通り670万、新しい広場140万、別区間300万。2025年5月時点の見積もり）","sources":[{"url":"https://beteve.cat/medi-ambient/6000-vehicles-reduccio-contaminacio-superilla-sant-antoni/","title":"La superilla de Sant Antoni redueix la contaminació","outlet":"betevé","published":"2019-12-14","language":"ca","from_operator":false},{"url":"https://beteve.cat/politica/sant-antoni-encapcala-recuperacio-economica-barcelona-gracies-superilla/","title":"Sant Antoni encapçala la recuperació econòmica gràcies a la superilla","outlet":"betevé","published":"2021-09-15","language":"ca","from_operator":false},{"url":"https://www.elnacional.cat/ca/barcelona/superilla-sant-antoni-diu-adeu-urbanisme-tactic-urbanitzacio-definitiva_1414897_102.html","title":"La superilla de Sant Antoni diu adeu a l'urbanisme tàctic amb una urbanització definitiva","outlet":"ElNacional.cat","published":"2025-05-13","language":"ca","from_operator":false},{"url":"https://beteve.cat/societat/inici-obres-consolidacio-superilla-sant-antoni-dubtes-comerciants/","title":"Superilla de Sant Antoni: de l'urbanisme tàctic a la consolidació","outlet":"betevé","published":"2026-06-27","language":"ca","from_operator":false}],"context_sources":[{"url":"https://www.elnacional.cat/ca/barcelona/barcelona-te-1732066-habitants-cada-cop-mes-prop-seu-maxim-historic_1426087_102.html","title":"ElNacional.cat「Barcelona té 1.732.066 habitants」（2025年1月1日現在の住民登録にもとづく市の人口 1,732,066人）"}],"discrepancies":[{"field":"start_year","values":[{"value":"2021年9月の記事は「サン・アントニのスーペリリャとともに3年半近く」と書いている","source_url":"https://beteve.cat/politica/sant-antoni-encapcala-recuperacio-economica-barcelona-gracies-superilla/","published":"2021-09-15"},{"value":"2026年6月の記事は「10年前から仮設の形で歩行者化されていた」と書いている","source_url":"https://beteve.cat/societat/inici-obres-consolidacio-superilla-sant-antoni-dubtes-comerciants/","published":"2026-06-27"}]}],"unknown_fields":["start_year","elapsed_years"],"latest_source_year":2026,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典間で食い違い、報道は2019年から2026年にわたる。2019年に市が最初の総括を出し、2021年には商店への調査が公表された。2025年に仮設をやめて本設にする方針が示され、2026年6月に工事が始まった。","timeline":[{"year":2019,"event":"市が最初の総括を公表した。交差点で二酸化窒素33%減・粒子状物質4%減、騒音は昼4.1デシベル減、車は82%減で1日約6,000台を締め出し、歩行者は28%増。歩行者優先の公共空間を23,709m²得たとした","source_url":"https://beteve.cat/medi-ambient/6000-vehicles-reduccio-contaminacio-superilla-sant-antoni/"},{"year":2021,"event":"市が48店舗に聞き取り、49%が見えやすくなって良い影響があったと答え、69%が人通りが増えた、83%が歩きやすくなったと答えた","source_url":"https://beteve.cat/politica/sant-antoni-encapcala-recuperacio-economica-barcelona-gracies-superilla/"},{"year":2025,"event":"5月、市が仮設をやめて本設に切り替える方針を示した。費用の見積もりは1,150万ユーロ","source_url":"https://www.elnacional.cat/ca/barcelona/superilla-sant-antoni-diu-adeu-urbanisme-tactic-urbanitzacio-definitiva_1414897_102.html"},{"year":2026,"event":"6月、本設化の工事が始まった。完成は翌年6月の予定で、商店主からは1年の工事期間を心配する声が出た","source_url":"https://beteve.cat/societat/inici-obres-consolidacio-superilla-sant-antoni-dubtes-comerciants/"}],"last_verified":"2026-08-17","image":{"url":"https://img.beteve.cat/wp-content/uploads/2021/09/nen-superilla-santantoni-150921.jpg","type":"photo","relevance_confirmed":true,"credit":"betevé","source_url":"https://beteve.cat/politica/sant-antoni-encapcala-recuperacio-economica-barcelona-gracies-superilla/"},"sections":{"何をしたか":"バルセロナのエシャンプラ区サン・アントニで、碁盤の目状の街区のうち数本の通りから車を締め出し、歩く人の側に明け渡した。最初は塗装と可動の什器による仮設（urbanisme tàctic）で作り、**効果を測ってから本設に切り替える**という順序をとった。2019年12月に市が公表した最初の総括では、コンテ・ボレイ通りとタマリット通りの交差点で二酸化窒素が33%、粒子状物質が4%減り、騒音は昼で4.1デシベル下がった。同じ交差点で車は82%減り、1日およそ6,000台が入らなくなった一方、歩行者は28%増えた。歩行者を優先する公共空間は23,709m²増えたとされる。2026年6月、仮設のまま8年前後を過ごしたこの区域で、本設の工事が始まった。","誰が始めたか":"バルセロナ市である。2025年5月の発表では、市の筆頭助役 Laia Bonet が、この工事によって暫定の状態を終わらせると説明している。\n\n**始まった年は出典で食い違う。** 2021年9月の記事は「スーペリリャとともに3年半近く」と書き、2026年6月の記事は「10年前から仮設の形で歩行者化されていた」と書いている。**逆算すると2つの年に分かれるため、どちらか一方に丸めず `discrepancies` に並べ、`start_year` は空欄にした。** 市場の周りの歩行者化が先に行われ、そのあとコンテ・ボレイ・タマリット・パルラメントの各通りの改造が続いたと2019年の記事が書いているので、**どこを起点と数えるかで年が変わる事業である。**","いくらかかったか":"**本設化の工事費は1,150万ユーロ**（2025年5月時点の見積もり）。内訳はコンテ・ボレイ通りの区域に670万ユーロ、新しい広場に140万ユーロ、別の区間に300万ユーロである。\n\n**仮設の段階でいくらかかったかは、今回の出典には書かれていない。** ただしこの事例の要点は金額そのものより順序にある。**先に安い仮設で作り、8年ほど使って効果を測り、そのうえで本設に1,150万ユーロを投じている。**","真似するなら最低何が必要か":"1. **仮設で先に作れること。** 塗装と可動の什器なら、合意が完全に固まる前に着手できる。この事業はそこから始まっている\n2. **効果を数値で測って公表すること。** 二酸化窒素、粒子状物質、騒音、通行台数、歩行者数、店舗への聞き取り。**数値があるから8年後に本設へ進む判断ができている**\n3. **隣の通りを見ること。** 2019年の記事は、住民から「車は消えたのか、隣に移っただけなのか」という問いが出たと書いている。実際ビラドマット通りやウルジェイ通りでは交通が増えた。**締め出した車がどこへ行くかを測らない限り、この問いには答えられない**\n4. **仮設のまま置きすぎないこと。** 下記のとおり、暫定の状態が長引いたこと自体が批判の的になっている\n5. **工事期間中の商店への手当て。** 2026年の記事では、近隣の商店主から1年の工事期間を心配する声が出ている","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年6月27日のベテベーの記事である。本設化の工事が始まり、作業員が什器を撤去して樹木を養生した。完成は翌年6月の予定で、樹木を増やして日陰を広げ、灌漑と照明を更新し、遊び場と什器を置く。コンテ・ボレイ通りとパルラメント通りのあいだには中央の滞留空間となる広場ができる。\n\n**評価は割れている。** 2021年9月の市の調査では、48店舗のうち49%が公共空間の改造で見えやすくなって良い影響があったと答え、69%が人通りが増えた、83%が歩きやすくなったと答えた。消費額も月およそ300万ユーロ増え、市の政府は市全体の伸びを上回ったとしている。\n\n一方 ElNacional.cat は2025年5月、このスーペリリャがセルダの街区における最初期の歩行者化の1つでありながら**「最も古びた」ものになったと書いている。** 他の地区ではコンセイ・ダ・セン通りのような「緑の軸（eixos verds）」の方式に進んだのに、ここは仮設の段階に留め置かれた、という指摘である。\n\n商店主の受け止めも一様ではない。2019年の記事は、改造が客を増やさなかったと嘆く商店主がいたことを書いている。2026年の記事では、工事そのものはおおむね歓迎されているが、1年間の売上への影響を不安に思う声が並んでいる。**Terroir はどちらが正しいかを判定せず、同じ事業について書かれたものとして並べる。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"1,150万ユーロ","currency":"EUR","value":11500000,"jpy":2134400000},{"raw":"670万ユーロ","currency":"EUR","value":6700000,"jpy":1243520000},{"raw":"140万ユーロ","currency":"EUR","value":1400000,"jpy":259840000},{"raw":"300万ユーロ","currency":"EUR","value":3000000,"jpy":556800000}],"sample":false},{"id":"es-0007","name":"回線が来ない農村で住民が自分たちの通信網を敷き、共有物として開いた","name_local":"guifi.net","name_variants":["Guifinet"],"country":"スペイン","region":"カタルーニャ州（起点はオソナ郡）","municipality":"オソナ郡（起点）。以後カタルーニャ州の各地へ広がった","population_scale":"不明","purpose":"住民が決める","theme":"デジタル・情報発信","start_year":2004,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"Fundació guifi.net（財団）と、ノードを建てる住民・地元の事業者・協同組合・団体","component_types":"hybrid","components":["住民がノードを建てて網を延ばした","光ファイバーを自前で敷設した","基盤を集団の所有物として開いた","開かれた相互接続の規則を定めた","地元事業者が共有基盤で商売できる"],"sources":[{"url":"https://www.vilaweb.cat/noticia/2122151/20061105/xarxa-sense-fils-guifinet-supera-mil-nodes-funcionament.html","title":"La xarxa sense fils Guifi.net supera els mil nodes en funcionament","outlet":"VilaWeb","published":"2006-11-05","language":"ca","from_operator":false},{"url":"https://www.publico.es/ciencias/guifi-net-demanda-cmt-frenar-redes-abiertas.html","title":"Guifi.net demanda a la CMT por frenar las redes abiertas","outlet":"Público","published":"2011-03-01","language":"es","from_operator":false},{"url":"https://www.eldiario.es/alternativaseconomicas/guifinet-wifi-fibra-optica-libre_132_3739176.html","title":"Guifinet: wifi y fibra óptica libre","outlet":"elDiario.es（Alternativas Económicas）","published":"2016-11-10","language":"es","from_operator":false},{"url":"https://www.elsaltodiario.com/derechos-digitales/comunes-digitales-soberania-tecnologica-alternativas-funcionan e":"photo","relevance_confirmed":true,"credit":"elDiario.es","source_url":"https://www.eldiario.es/castilla-la-mancha/democracia-energetica-toledo-som-energia_1_4122223.html"},"sections":{"何をしたか":"2010年にカタルーニャ州ジローナで発足した、再生可能エネルギーの電気を売る協同組合。**買う人が組合員になり、その出資で発電所を建てる**という形をとる。elDiario.es は2019年12月2日、**組合員1,600人の出資による太陽光発電所が開かれた**と報じ、同年5月12日には**その年の売上を6,400万ユーロ超と見込み、1日あたり37人が加入している**と報じている。組合員の地域班は各地に置かれ、2016年3月にはトレドにできた。**戦略の決定は総会で組合員が議決する形になっている**と、運営側の理事は2026年5月の寄稿で述べている（同記事は当事者による寄稿であり、出典として独立していない）。同じ寄稿によれば、2026年時点で売る電気の2割超を自前で発電している。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"es-0009","name":"協同組合が建物を持ち、組合員が使用権を買って住み続ける住宅を各地で建てている","name_local":"Sostre Cívic","name_variants":[],"country":"スペイン","region":"カタルーニャ州","municipality":"バルセロナ市に本部。事業は州内の複数の自治体にある（出典に出るのはバルセロナ、マンレザ、リェイダ、タラサ、グラノリェルス、サン・クガット・ダル・バリェス、ビラフランカ、パラモス）","population_scale":"不明","purpose":"お金を地域で回す","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2004,"end_year":null,"status_current":"継続中","actor_type":"NPO","lead_actor":"Sostre Cívic（2004年に協会として、2010年に協同組合として設立）。土地は自治体が長期の権利で貸し、資金は組合員の出資と欧州評議会開発銀行の融資による","component_types":"hybrid","components":["協同組合が建物の所有を持つ","組合員が使用権を買って住む","市の土地を長期で借りて建てる","入居予定者の出資で費用を賄う","共用の台所や屋上を住民が決める","高齢者や障害のある人の住戸を混ぜる"],"sources":[{"url":"https://sostrecivic.coop/faq/on-i-quan-va-neixer/","title":"On i quan va néixer?","outlet":"Sostre Cívic","published":"2019-07-04","language":"ca","from_operator":true},{"url":"https://beteve.cat/economia/habitatge-cooperatiu-la-balma-poblenou/","title":"Comença la construcció de La Balma, d'habitatge cooperatiu, al Poblenou","outlet":"betevé","published":"2019-09-26","language":"ca","from_operator":false},{"url":"https://beteve.cat/la-familia-barris/pisos-la-balma-cooperativa-sostre-civic/","title":"Ni comprar ni llogar: viure en un habitatge cooperatiu","outlet":"betevé","published":"2021-04-28","language":"ca","from_operator": encial.html","published":"2026-04-12"}]}],"unknown_fields":["population_current","population_scale"],"latest_source_year":2026,"elapsed_years":22,"follow_up":"濃い","follow_up_note":"2019年に La Balma が着工し2021年に完成が近づいた。2023年に高齢者向けの Can 70 が公表され、2025年には62戸の Ca l'Ordit が工事に入った。2026年4月時点で、この協同組合が州内で持つ25件のうち14件が入居済みと伝えられている。","timeline":[{"year":2019,"event":"9月、ポブレノウ地区で La Balma の起工が伝えられた。記事は、工期を18か月、予算を300万ユーロとし、費用を入居予定者の出資と参加型の証券で賄うこと、5階建て20戸のうち1戸を社会住宅にすること、敷地を市が公募で割り当てたことを書いている","source_url":"https://beteve.cat/economia/habitatge-cooperatiu-la-balma-poblenou/"},{"year":2021,"event":"4月、La Balma の完成が近づいたことが伝えられた。記事は、市が公有地を75年の期限で貸していること、木でつくられていること、20世帯が入ることを書いている。入居予定の組合員は、共用の空間の決め方を20世帯で行ない、2階（planta baixa の上の階）に共同の台所をつくると述べている","source_url":"https://beteve.cat/la-familia-barris/pisos-la-balma-cooperativa-sostre-civic/"},{"year":2023,"event":"3月、50歳以上を対象とする Can 70 がサリア地区の市有地に建つことが伝えられた。記事は、バルセロナで最初の高齢者向けの協同組合住宅であり、カタルーニャとスペインで初めて公有地に建つものだと書いている。組合員は2015年から住まい方を話し合ってきたとされ、20人ほどの多くが女性で55歳から70歳である","source_url":"https://beteve.cat/economia/can-70-primer-habitatge-cooperatiu-senior-barcelona/"},{"year":2025,"event":"11月12日、サン・タンドレウ地区の Ca l'Ordit が工事に入ったことが伝えられた。62戸のうち9戸を知的障害のある人に充て、Grup Cooperatiu TEB と組む。理事会の一員は、住戸の名義は組合が持ち組合員は生涯の使用権を持つこと、組合費で借入金を返すことを述べている。入居は2027年前半の予定である","source_url":"https://beteve.cat/economia/bloc-cooperatiu-inclusiu-mes-gran-espanya-sant-andreu/"},{"year":2025,"event":"11月18日、欧州評議会開発銀行の融資で9つの事業に350戸の社会住宅を建てることが伝えられた。記事は、Ca l'Ordit の敷地を市が99年の期限で貸したこと、11月15日に入居予定者が現場を訪れたこと、工事現場の掲示に「この工事は商売ではない、住まいは権利だから」と書かれていることを伝えている","source_url":"https://www.3cat.cat/3catinfo/les-cooperatives-dhabitatge-fan-un-salt-gracies-al-financament-del-banc-del-consell-deuropa/noticia/3380628/"},{"year":2026,"event":"4月12日、カタルーニャの協同組合住宅を見渡す記事が出た。市はSostre Cívicを州内で最大の使用権譲渡型の住宅協同組合だとしており、記事は州内25件のうち14件が入居済みで500戸を超えると書いている。Can 70 は2025年9月に着工し、2027年半ばの完成を見込むとされる","source_url":"https://www.diaripublic.cat/societat/cooperativisme-habitatge-guanya-terreny-catalunya-experiencies-quallen-enmig-crisi-residencial.html"}],"last_verified":"2026-08-19","image":{"url":"https://img.beteve.cat/wp-content/uploads/2025/11/habitatge-cooperatiu-inclusiu-sant-andreu111125.jpg","type":"photo","relevance_confirmed":true,"credit":"betevé","source_url":"https://beteve.cat/economia/bloc-cooperatiu-inclusiu-mes-gran-espanya-sant-andreu/"},"sections":{"何をしたか":"Sostre Cívic が、**建物の所有を協同組合が持ち、組合員が使用権を買って住み続ける**やり方で住宅をつくっている。団体自身は、2004年にバルセロナで協会として生まれ、2010年に協同組合としても設立したと書いている（設立年はこの当事者の発信にしかない）。\n\n自治体が長期の期限で貸した土地に建て、費用は入居予定者の出資と参加型の証券、それに欧州評議会開発銀行の融資で賄う。2019年に着工した La Balma は20戸で予算300万ユーロだった。50歳以上向けの Can 70 は2023年に公表され2025年9月に着工した。知的障害のある人の住戸を含む Ca l'Ordit は2025年に工事に入っている。\n\n2026年4月時点で、市はカタルーニャ最大の使用権譲渡型の住宅協同組合だとしている。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"es-0010","name":"貧困の集まる10地区で、現金の給付と就労支援を組み合わせてためした","name_local":"B-MINCOME","name_variants":["B-Mincome"],"country":"スペイン","region":"カタルーニャ州","municipality":"バルセロナ市（Eix Besòs の10地区）","population_current":1732066,"population_scale":"25万超","purpose":"お金を地域で回す","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2017,"end_year":null,"status_current":"判定不能","actor_type":"行政","lead_actor":"バルセロナ市。欧州連合の Urban Innovative Actions の資金を受け、Ivàlua・Novact・IGOP・The Young Foundation・ICTA・UPC と組んだ。科学的な評価は Universitat Pompeu Fabra、IESE、Centro para la Innovación Social Nova が担う","component_types":"soft","components":["選ばれた世帯に毎月現金を配る","条件つきと条件なしを並べて試す","対照群を置いて効果を比べる","就労と職業訓練の枠を用意する","空き部屋を貸すための改修を助ける","地域の活動への参加を枠に入れる"],"sources":[{"url":"http://www.eldiario.es/catalunya/barcelona/Union-Europea-Barcelona-Renda-Basica_0_649535288.html","title":"La Unión Europea elige Barcelona para testar cuatro modelos de Renta Básica con 1.000 vecinos","outlet":"elDiario.es","published":"2017-05-31","language":"es","from_operator":false},{"url":"https://revistes.ub.edu/index.php/clivatge/article/view/21986","title":"Proyecto B-MINCOME","outlet":"Clivatge","published":"2018-04-28","language":"es","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://eldiario.es/alternativaseconomicas/Barcelona-luchar-exclusion-social_6_805679437.html","title":"Barcelona innova en la lucha contra la exclusión social","outlet":"elDiario.es","published":"2018-08-20","language":"es","from_operator":true},{"url":"https://journals.polito.it/index.php/EJSD/article/view/369","title":"Place-based Guaranteed Minimum Income in Barcelona: (un)intended inclusionary policy for migrants","outlet":"European Journal of Spatial Development","published":"2023-09-01","language":"en","from_operator":false,"source_type":"academic","abstract_only":true}],"context_sources":[{"url":"https://www.elnacional.cat/ca/barcelona/barcelona-te-1732066-habitants-cada-cop-mes-prop-seu-maxim-historic_1426087_102.html","title":"ElNacional.cat（2025年1月1日現在の住民登録にもとづく市の人口 1,732,066人）"}],"unknown_fields":["end_year"],"latest_source_year":2023,"elapsed_years":6,"follow_up":"濃い","follow_up_note":"2017年5月に欧州の事業として発表された。当事者の寄稿は、同年12月から給付が始まり2019年12月に終えると書いているが、終了を報じた出典は確認できていない。","timeline":[{"year":2017,"event":"5月31日、欧州の事業としてバルセロナが選ばれたことが伝えられた。記事は、ベゾス地区の1,000人が9月から2年間参加すること、この欧州の事業が1,300万ユーロを持ちユトレヒトとヘルシンキでも行なわれること、給付額を市が400〜525ユーロと見込んでいること、科学的な評価を Universitat Pompeu Fabra・IESE・Centro para la Innovación Social Nova が担うことを書いている。欧州側の担当者は「都市の貧困との戦いを根本から変える」と述べている","source_url":"http://www.eldiario.es/catalunya/barcelona/Union-Europea-Barcelona-Renda-Basica_0_649535288.html"},{"year":2018,"event":"4月28日、バルセロナ大学の雑誌に短い報告が載った。抄録は、Eix Besòs の1,000世帯の弱い立場を和らげ、社会経済の状況と就労の力を高めることが目的だと書いている（本文は取得しておらず、抄録の範囲で書いている）","source_url":"https://revistes.ub.edu/index.php/clivatge/article/view/21986"},{"year":2018,"event":"8月20日、市の社会権局の企画部門の担当者が寄稿した。同氏は、950世帯が2017年12月から世帯の規模・収入・住居費に応じて月100〜1,600ユーロを受け取っていること、条件のある要件を満たした4,300世帯のうち2,400世帯が申し込み1,000世帯が抽選で選ばれたこと、11の処遇群と最大500世帯の対照群を置いたこと、2019年12月に終えてから効果を評価すると書いている（当事者の発信である）","source_url":"https://eldiario.es/alternativaseconomicas/Barcelona-luchar-exclusion-social_6_805679437.html"},{"year":2023,"event":"9月、European Journal of Spatial Development に Laura Colini の論文が載った。抄録は、この仕組みが移民に意図しない利益をもたらしたこと、部局をまたぐ協力によって性別の不平等に影響し、在留資格のない移民の正規化を間接的に助けたこと、欧州と市の資金の組み合わせが制度の設計の試みを後押ししたことを書いている（本文は取得しておらず、抄録の範囲で書いている）","source_url":"https://journals.polito.it/index.php/EJSD/article/view/369"}],"last_verified":"2026-08-19","image":{"url":"https://static.eldiario.es/clip/fd378e24-8fdb-4cc1-b619-1c80a39b5a09_facebook-aspect-ratio-1200-675_default_0.jpg","type":"photo","relevance_confirmed":true,"credit":"elDiario.es","source_url":"https://eldiario.es/alternativaseconomicas/Barcelona-luchar-exclusion-social_6_805679437.html"},"sections":{"何をしたか":"バルセロナ市が、貧困の集まる Eix Besòs の10地区で、**現金の給付と就労・社会参加の政策を組み合わせる実験**を2017年から行なった。欧州連合の Urban Innovative Actions の資金を受けている。\n\n市の担当者は2018年の寄稿で、抽選で選ばれた世帯を、条件をつける／つけない、他の収入で減らす／減らさないを組み合わせた11の群に分け、最大500世帯の対照群も置いたと書いている。同じ寄稿は、950世帯が2017年12月から世帯の規模・収入・住居費に応じて月100〜1,600ユーロを受け取っていると書いている。\n\n同じ寄稿は2019年12月に終えると書いているが、終わったことを報じた出典は確認できていない。2023年の論文は、この仕組みが移民に意図しない利益をもたらしたと述べている。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"es-0011","name":"福祉の窓口から直接つないで、仕事に就きにくい人と企業を橋渡しする仕組みを10年続けている","name_local":"Làbora","name_variants":["Programa Làbora"],"country":"スペイン","region":"カタルーニャ州","municipality":"バルセロナ市","population_current":1732066,"population_scale":"25万超","purpose":"商いを起こす","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2014,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"バルセロナ市の社会権の部門と Barcelona Activa が、第三セクターの3つの連合体（ECAS・FEICAT・カタルーニャ赤十字）と組んで運営する","component_types":"soft","components":["福祉の窓口から直接つなぐ","就労の相談員が計画を立てる","企業に人を紹介して橋渡しする","学び直しの講座を用意する","市と3つの連合体で運営する"],"sources":[{"url":"https://beteve.cat/societat/labora-ajuntament-tercer-sector/","title":"Més de 1.500 persones en risc d'exclusió social troben feina a partir del programa Làbora","outlet":"betevé","published":"2016-05-09","language":"ca","from_operator":false},{"url":"https://diaritreball.cat/el-programa-labora-dinsercio-laboral-de-persones-ateses-per-serveis-socials-augmenta-a-la-ciutat/","title":"Cada any més persones ateses per serveis socials acudeixen al programa d'inserció laboral Làbora","outlet":"Diari del Treball","published":"2021-10-22","language":"ca","from_operator":false},{"url":"https://www.social.cat/noticia/23027/nou-projecte-barcelona-promoura-insercio-laboral-persones-situacio-administrativa-irregular","title":"Un nou projecte a Barcelona promourà la inserció laboral de les persones en situació administrativa irregular","outlet":"Social.cat","published":"2025-04-23","language":"ca","from_operator":false}],"context_sources":[{"url":"https://www.elnacional.cat/ca/barcelona/barcelona-te-1732066-habitants-cada-cop-mes-prop-seu-maxim-historic_1426087_102.html","title":"ElNacional.cat（2025年1月1日現在の住民登録にもとづく市の人口 1,732,066人）"}],"editor_notes":"2025年4月の LABase の立ち上げは、同じ発表にもとづく記事が betevé にもある（2025-04-18）。§4「同一発表に由来する記事は何本あっても1本」に従い、代表として Social.cat の1本だけを sources に置いた。","unknown_fields":[],"latest_source_year":2025,"elapsed_years":11,"follow_up":"濃い","follow_up_note":"2014年末に始まった。2016年の報道では前年に1,500人が契約に至り、2021年には7年目と伝えられた。2025年には在留資格のない人を対象にした試行 LABase が別に始まっている。","timeline":[{"year":2016,"event":"5月9日、前の年に1,500人が契約に至り、これが対象となった人の22%にあたることが伝えられた。記事は、契約の3件に1件が3か月未満だったこと、約1,000社が参加していること、予算がほぼ倍の320万ユーロになったこと、対象の多くが45歳を超えた長期失業の女性で失業率の高い地区に住んでいることを書いている。市の社会権担当の副市長は、就労までの道筋が労働条件の尊厳を含まなければ人の尊厳は保たれないと述べている。記事は、事業が2014年の終わりに前の市政期に始まったとも書いている","source_url":"https://beteve.cat/societat/labora-ajuntament-tercer-sector/"},{"year":2021,"event":"10月22日、労働の専門紙が7年目の事業として取り上げた。記事は、参加する人が福祉の窓口から直接つながれる点をこの事業の値打ちとして挙げ、市の社会権の部門と Barcelona Activa が ECAS・FEICAT・カタルーニャ赤十字と組んで進めていることを書いている。ECAS の代表（directora general）は、福祉の窓口の見立てから就労の事業へつなぐ市の事業はこれが最初だと述べている","source_url":"https://diaritreball.cat/el-programa-labora-dinsercio-laboral-de-pers め出して、その道を人に返す日**をつくった取り組み。\n\nThe Journal of Public Space（2022年）に載った論文によれば、**「መንገድ ለሰው － Menged Le Sew」はアムハラ語で、人のための道を意味する。** 同論文によれば、この運動は**2018年12月9日に、アディスアベバ交通管理庁（TMA）・区の長・保健局・青年スポーツ局などの協働で始まった。**\n\n**その日、道路で何が行われるかは1つではない。** 同論文の抄録によれば、住民は開いた街路をさまざまな運動、体を動かすこと、保健の催し、自転車や徒歩での移動に使い、**子どもの遊び場にもなっている。**\n\n**分散して置いている。** BYCS（2020年11月25日）に載った対談で、共同で立ち上げた1人であるセブレ・サミュエル氏は、**どこに住んでいても近くに1か所あるようにという考えで分散型の型を採り、合わせて市内でおよそ15キロになった**と述べている。**同氏によれば、そのうち1か所は、住民が自分たちで街路を塞ぎ始めたために加わった。**","誰が始めたか":"**行政と、市民の側の団体の両方が関わっている。** The Journal of Public Space（2022年）の論文は、始めた主体として交通管理庁と区の長・保健局・青年スポーツ局などを挙げている。\n\n**市民の側の経過は、共同で立ち上げた人物の対談に残っている。** BYCS（2020年11月25日）の対談で、サミュエル氏は、**2018年12月に前の保健大臣が国の車を止める日を告知したことで、自分たちの試みが用意していた以上の規模になった**と述べている。 同氏は、**2019年2月の3回目から本格的に入った**と述べている。\n\n**始めた場所の数は出典で違う。** BYCS（2020年11月25日）の対談は7か所、CityChangers.org（2021年4月20日）の対談は6か所、Local South（2024年12月6日）は当初6か所としている。**前の2本はどちらも同じ人物への取材にもとづく。**`discrepancies` に並置した。\n\n**手引きが作られている。** The Journal of Public Space（2022年）の論文によれば、**同じ催しを開く関係者の手引きとして、交通管理庁と世界資源研究所アフリカが手引きを作って公表した。**","いくらかかったか":"**金額は、参照した6本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**元手は道路そのものである。** 新しい構造物をつくったという記述は、参照した6本のどこにも無い。行われているのは、既にある街路を時間を区切って閉じることである。\n\n**出典には、計画の優先順位を数字で述べた箇所がある。** BYCS（2020年11月25日）の対談で、サミュエル氏は**自分たちの都市の文脈ではと断ったうえで、およそ54%が歩き、さらに30%が公共交通を使うとし、自家用車を持つ都市の15%のために計画を優先するのは筋が通らないと述べている。** 同氏によれば、**より小さな都市では、徒歩や自転車での移動が分担率の90%まで上がることがある。**","真似するなら最低何が必要か":"第一に、**場所を1か所に集めず、市内に散らす**こと。同氏によれば、これは「どこに住んでいても近くに1か所ある」ようにという考えによる。\n\n第二に、**運動と保健の催しを重ねる**こと。The Journal of Public Space（2022年）の論文の抄録によれば、開いた街路では運動・体を動かすこと・保健の催しが行われている。\n\n第三に、**手引きを作る**こと。同論文によれば、交通管理庁と世界資源研究所アフリカが、同じ催しを開く関係者向けの手引きを作った。BYCS（2020年11月25日）の対談で、サミュエル氏は**他の都市に広がり始めた**と述べており、**論文が挙げる手引きは2021年のものである。** Local South（2024年12月6日）は**アディスアベバの市に触発されて**ハラール市などが毎月これを行っていると書いている。\n\n第四に、**住民が自分で street を塞ぎ始めることを、排除せずに受け止める**こと。同氏によれば、**場所の1つは住民が自分たちで塞ぎ始めたために加わった。**\n\n第五に、**効果を測る仕組みを最初から入れておく**こと。**この事業では、そこが4年目の論文の指摘になっている**（次節）。\n\n第六に、**一時的な催しのままにしない道筋を考えておく**こと。The Journal of Public Space（2022年）の論文は、**この運動を「一時的な状態（impermanent state）」から転換させるための具体的な行動を論じるものだと自らを位置づけている。**","今どうなっているか":"**2026年8月時点で確認できたのは、2024年12月6日の記事までである。**\n\n**場所は増えている。** Local South（2024年12月6日）によれば、**当初は6か所で始まり、のちに23か所に広がった。** 同記事によれば、**長さの違う23本の街路が、週ごとまたは月ごとに閉じられている。** 同記事は、この取り組みが複数の政府機関に支えられていると書いている。\n\n**他の都市にも広がっている。** 同記事によれば、**アディスアベバの市に触発されて、ハラール市などが毎月これを行っている。**\n\n**効果を測った長期の研究はまだ無い、と論文が指摘している。** The Journal of Public Space（2022年）の論文は、**エチオピアではこの催しの影響について長期にわたる研究がこれまで一つも行われていないと書いている。** 同論文によれば、交通管理庁の手引きが挙げる目的は、徒歩・自転車・公共交通の利用を促すこと、交通安全への関心を高めること、汚れを減らすこと、空間を皆が公平に使うことの4つである。\n\n**当事者の側からも、続けることの難しさが語られている。** BYCS（2020年11月25日）の対談で、サミュエル氏は、**公的な関係者の一部がこれを娯楽と見て優先度を下げたこと、初期に日程の齟齬などで何度か中止したこと、車の侵入を止められなかったこと**を挙げている。同じ対談で同氏は、いまでは国じゅうで親しまれているとも述べている。\n\n**感染症で全国の回が止まった年がある。** Fare City（2020年7月30日）は、**2020年に Menged Le Sew が初めての全国規模の車を止める日を開いていたはずだったが、感染症がそれを妨げたと書いている。**\n\n**この取り組みは国際の場でも語られている。** Women in Urbanism Canada（2022年6月21日）は、Urban Futures 22 の基調講演でサミュエル氏がこの立ち上げの経緯を語ったことを伝えている。\n\n**論文の指摘に対する当事者の直接の応答は、参照した6本の中には無い。**\n\n**この記録の出典の性質について。** 2020年から2022年の4本（Fare City・BYCS・CityChangers.org・Women in Urbanism Canada）は、**媒体はそれぞれ独立しているが、事実の出所はいずれも共同で立ち上げた同じ人物の話である。** 独立した別系統は The Journal of Public Space（2022年）と Local South（2024年12月6日）の2本になる。**なお Local South の記事に載る写真の出所は、7点が個人の撮影者、11点がアディスアベバ交通管理庁と記されている。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"fi-0001","name":"市民が出した提案を市民の投票で選び、市がその予算で実施する仕組みを4回続けている","name_local":"OmaStadi","name_variants":["OmaStadin","OmaStadissa"],"country":"フィンランド","region":"ウーシマー（Uusimaa）","municipality":"ヘルシンキ市","population_current":694392,"population_scale":"25万超","purpose":"住民が決める","theme":"デジタル・情報発信","start_year":2018,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"ヘルシンキ市。提案の費用の見積もりと当選案の実施の詰めを市の専門家が担う","component_types":"soft","components":["ネット上で市民が改善案を出す","市の専門家が費用を見積もる","市民の投票で実施する案を選ぶ","予算の8割を地区へ人口割で配る","学校でも児童生徒が投票す
