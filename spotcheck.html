、市が2006年に137エーカーの採石場を採石会社からおよそ4,000万ドルで買ったこと、第1期に4,400万ドルがかかったこと、全体で280エーカーになり市で最大の緑地になることを報じている。同記事によれば、開園の式典は15年がかりのものだった。Atlanta Magazine は2021年10月27日に、深さ350フィートの貯水池が24億ガロンの非常用の水をたくわえていること、園路が2〜3マイルの緑道につながっていることを書いている。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"vn-0001","name":"湖のまわりの通りを週末だけ歩行者にひらいた","name_local":"phố đi bộ hồ Hoàn Kiếm","country":"ベトナム","region":"ハノイ市","municipality":"Hoàn Kiếm（ハノイ市ホアンキエム区）","population_current":8400000,"population_scale":"25万超","purpose":"歩けるようにする","theme":"交通・道路・駅","start_year":2016,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"UBND quận Hoàn Kiếm（ホアンキエム区人民委員会）","component_types":"soft","components":["週末だけ車を止めて通りを開ける","区の人民委員会が試行として始めた","飲食店の営業を深夜2時まで延ばした","文化行事の会場として貸し出した"],"sources":[{"url":"https://tuoitre.vn/toi-19-thi-diem-pho-di-bo-quanh-ho-hoan-kiem-1163428.htm","title":"Tối 1-9, thí điểm phố đi bộ quanh hồ Hoàn Kiếm","outlet":"Tuổi Trẻ","published":"2016-08-30","language":"vi"},{"url":"https://tuoitre.vn/toi-19-khai-mac-pho-di-bo-quanh-ho-hoan-kiem-1163569.htm","title":"Tối 1-9, khai mạc phố đi bộ quanh hồ Hoàn Kiếm","outlet":"Tuổi Trẻ","published":"2016-08-31","language":"vi"},{"url":"https://nhandan.vn/phat-huy-khong-gian-pho-di-bo-post472923.html","title":"Phát huy không gian phố đi bộ","outlet":"Nhân Dân","published":"2020-01-06","language":"vi"},{"url":"https://vietnamnet.vn/pho-di-bo-ho-hoan-kiem-mo-lien-tuc-6-ngay-dip-le-30-4-va-1-5-2274270.html","title":"Phố đi bộ hồ Hoàn Kiếm mở liên tục 6 ngày dịp lễ 30/4 và 1/5","outlet":"VietNamNet","published":"2024-04-24","language":"vi"},{"url":"https://nhandan.vn/dieu-chinh-thoi-gian-hoat-dong-khong-gian-di-bo-khu-vuc-ho-hoan-kiem-post863652.html","title":"Điều chỉnh thời gian hoạt động không gian đi bộ khu vực hồ Hoàn Kiếm","outlet":"Nhân Dân","published":"2025-03","language":"vi"}],"context_sources":[{"url":"https://nhandan.vn/ha-noi-chiem-gan-84-dan-so-ca-nuoc-post729588.html","title":"Nhân Dân「Hà Nội chiếm gần 8,4% dân số cả nước」（2022年末時点のハノイ市人口 約840万人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":9,"follow_up":"濃い","follow_up_note":"2016年9月に年末までの試行として始まり、2017年にホアンキエム区が暫定の運営規則を定めた。区における国家予算収入は2016年の5,387十億ドンから2019年の推計9,749十億ドンへ増えたと2020年1月に報じられている。2025年3月時点でも運営時間の調整が続く。","timeline":[{"year":2016,"event":"8月24日付のハノイ市人民委員会計画第159号にもとづき、9月1日から年末までの試行として始まった","source_url":"https://tuoitre.vn/toi-19-thi-diem-pho-di-bo-quanh-ho-hoan-kiem-1163428.htm"},{"year":2017,"event":"ホアンキエム区が、歩行者空間で商う事業者と住民に向けた暫定の運営規則を出した","source_url":"https://nhandan.vn/phat-huy-khong-gian-pho-di-bo-post472923.html"},{"year":2020,"event":"1月、試行3年の報道。観光サービスに業種を変えた店が594店増え、区内に旅行会社176社・宿泊585軒（12,404室）があり、3年余りで大規模な文化行事が410件開かれたとされた","source_url":"https://nhandan.vn/phat-huy-khong-gian-pho-di-bo-post472923.html"},{"year":2024,"event":"4月、4月30日と5月1日の連休に合わせて6日続けて開かれた","source_url":"https://vietnamnet.vn/pho-di-bo-ho-hoan-kiem-mo-lien-tuc-6-ngay-dip-le-30-4-va-1-5-2274270.html"},{"year":2025,"event":"3月7日から9日にかけて、旧市街の各通りを含む歩行者空間の運営時間が調整された","source_url":"https://nhandan.vn/dieu-chinh-thoi-gian-hoat-dong-khong-gian-di-bo-khu-vuc-ho-hoan-kiem-post863652.html"}],"last_verified":"2026-08-16","sections":{"何をしたか":"ハノイ市ホアンキエム区は2016年9月1日から、ホアンキエム湖（ホアンキエム湖）の周囲とその周辺の通りを、週末だけ車を通さない歩行者空間にした。金曜19時から日曜24時までで、2016年末までの試行として始まった。同時に、区内の飲食店・ホテル・バーについて週末の営業を深夜2時まで認めた。歩行者空間は文化行事の会場としても使われるようになり、試行のまま定着して現在も続いている。","誰が始めたか":"決めたのはホアンキエム区人民委員会（UBND quận Hoàn Kiếm）で、2016年8月30日に区人民委員会主席のズオン・ドゥック・トゥアン（Dương Đức Tuấn）が記者向けの説明会で内容を公表した。実施区間はディン・ティエン・ホアン通りをはじめ湖の周囲の複数の通りにおよび、周辺のリー・タイ・トー、ゴー・クエン、リー・トゥオン・キエット、チャン・フン・ダオ、ハイ・バー・チュン、クアン・チュンの各通りに駐車場が置かれた。\n\n住民組織が始めたものではなく、**行政が区の単位で決めて実行した施策である。**","いくらかかったか":"**確認できなかった。** 参照した5本の出典に、この歩行者空間そのものにかかった費用の記載がない。`unknown_fields` に `funding_scale` を挙げている。\n\n出典が伝えているのは費用ではなく区の歳入である。人民日報（Nhân Dân）2020年1月6日の記事は、ホアンキエム区の予算歳入を2016年 5,387十億ドン、2017年 7,020十億ドン、2018年 8,840十億ドン、2019年は見込みで 9,749十億ドンと並べている。ただし**これは区全体の歳入であって、歩行者空間による増加分として示された数字ではない。**","真似するなら最低何が必要か":"この事例で真似できるのは、**車を止める範囲と時間の決め方**である。\n\n第一に、**恒久化せず試行として始めている**こと。2016年9月1日から同年末まで、という期限つきで始めた。制度を作り込まずに始められるので、合意形成の負荷が小さい。結果として試行のまま続いているが、**始めるときに「いつまで」を決めたことが着手を軽くしている。**\n\n第二に、**週末だけに絞っている**こと。金曜19時から日曜24時まで。平日の交通を変えないので、生活と物流への影響が限定される。歩行者空間の面積ではなく、時間で区切るという設計である。\n\n第三に、**沿道の商売に見返りを同時に用意している**こと。歩行者化と同じタイミングで、飲食店・ホテル・バーの週末営業を深夜2時まで認めている。車を止めることは沿道にとって不利益になりうるが、営業時間の緩和がその埋め合わせになっている。**規制と緩和を同時に出したこと**が、P3の規模でも移せる部分だと思われる。\n\n第四に、**駐車場を外周に配置している**こと。歩行者空間の外側の6本の通りに駐車場を置いている。車を締め出すだけでなく、行き先を用意している。\n\nなお、この事例の担い手は区の行政であって住民組織ではない。P3（専従1人・年予算200万円）がそのまま再現できるのは打ち手の設計であって、実施の主体ではない。","今どうなっているか":"`status_current: 継続中`。2025年3月の人民日報の記事が、ホアンキエム湖周辺の歩行者空間の**運用時間の調整**を報じており、開始から8年半を経て運用が続いていることが確認できる。2024年4月24日の VietNamNet の記事も、4月30日・5月1日の連休に合わせて6日連続で開けたことを伝えている。\n\n規模の広がりについて、人民日報2020年1月6日の記事は、試行3年の時点でホアンキエム区内に旅行会社176社、ホテル585軒（12,404室）があり、594の事業所が観光関連のサービスに転換したと書いている。あわせて大規模な文化行事が410回開かれ、20の省・市、26の大使館と3つの国際機関が参加したとしている。同記事は旧市街の南側への拡張計画にも触れている。\n\n**ただしこれらの数字は、党機関紙が成果として提示したものである。** 歩行者空間がこれらの変化を引き起こしたという因果は、出典では示されていない。また出典のうち3本は行政の発表や決定を伝えるもので、独立した検証を経た数字ではない。\n\n問題を伝える報道もある。露天商や子ども用電動車の無許可営業が続いていることが繰り返し報じられており、区は取り締まりを行っている。ただしこれらの記事は「phố đi bộ hồ Hoàn Kiếm」という固有名詞を含まず「hồ Gươm（ホアンキエム湖の別称）」と書いているため、第1層を通らず `sources` には入れていない。**縮小や失敗の側の記述が、固有名詞の表記の違いによって落ちやすいことは記録しておく。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"vn-0002","name":"洪水に沈む集落を洪水ごと見せる観光地にした","name_local":"Tân Hóa","country":"ベトナム","region":"クアンビン省","municipality":"Tân Hóa（ミンホア県タンホア社）","population_current":3075,"population_scale":"5万人未満","purpose":"人を呼ぶ","theme":"自然・緑地・水辺","start_year":2011,"end_year":null,"status_current":"継続中","actor_type":"民間（その他）","lead_actor":"Công ty Oxalis","component_types":"soft","components":["洞窟の探検ツアーを外部企業が始めた","住民が食事と宿泊を受け持った","観光客を浮く家に泊まらせた"],"sources":[{"url":"https://thanhnien.vn/tan-hoa-ron-lu-quang-binh-co-gi-ma-thanh-lang-du-lich-tot-nhat-the-gioi-185231019184624329.htm","title":"Tân Hóa - 'rốn lũ' Quảng Bình có gì mà thành làng du lịch tốt nhất thế giới?","outlet":"Thanh Niên","published":"2023-10-19","language":"vi"},{"url":"https://nhandan.vn/tan-hoa-quang-binh-duoc-vinh-danh-la-lang-du-lich-tot-nhat-the-gioi-post778477.html","title":"Tân Hóa (Quảng Bình) được vinh danh là Làng du lịch tốt nhất thế giới","outlet":"Nhân Dân","published":"2023-10-19","language":"vi"},{"url":"https://baochinhphu.vn/tan-hoa-quang-binh-mot-trong-nhung-lang-du-lich-tot-nhat-the-gioi-10223101917111112.htm","title":"Tân Hóa – Một trong những làng du lịch tốt nhất thế giới","outlet":"Báo Chính phủ","published":"2023-10-19","language":"vi"},{"url":"https://danviet.vn/du-khach-cheo-sup-o-nha-phao-trai-nghiem-vung-ron-lu-quang-binh-20240923132454727.htm","title":"Du khách chèo sup, ở nhà phao, trải nghiệm vùng \"rốn lũ\" Quảng Bình","outlet":"Dân Việt","published":"2024-09-23","language":"vi"}],"unknown_fields":["funding_scale"],"latest_source_year":2024,"elapsed_years":13,"follow_up":"薄い","follow_up_note":"2011年にオクサリス社が洞窟ツアーの調査と試験運行の許可を得て観光が始まり、2014年からクアンビン省が事業者と組んで段階的な戦略をつくった。2022年末に国の観光当局が応募を勧め、2023年10月19日にUNWTOの世界最良の観光村に選ばれた。","timeline":[{"year":2011,"event":"オクサリス社がトゥーラン洞窟群で探検ツアーの調査と試験運行の許可を初めて受けた","source_url":"https://thanhnien.vn/tan-hoa-ron-lu-quang-binh-co-gi-ma-thanh-lang-du-lich-tot-nhat-the-gioi-185231019184624329.htm"},{"year":2014,"event":"クアンビン省が観光事業者と組み、住民を事業に参加させる形で段階的な発展戦略をつくり始めた","source_url":"https://baochinhphu.vn/tan-hoa-quang-binh-mot-trong-nhung-lang-du-lich-tot-nhat-the-gioi-10223101917111112.htm"},{"year":2022,"event":"年末、国の観光当局の代表が現地を見たうえで、Best Tourism Villages への応募をタンホアに勧めた","source_url":"https://nhandan.vn/tan-hoa-quang-binh-duoc-vinh-danh-la-lang-du-lich-tot-nhat-the-gioi-post778477.html"},{"year":2023,"event":"10月19日、60か国260村の候補からUNWTOの世界最良の観光村に選ばれた。ベトナムからの選出はこの1村のみ","source_url":"https://baochinhphu.vn/tan-hoa-quang-binh-mot-trong-nhung-lang-du-lich-tot-nhat-the-gioi-10223101917111112.htm"},{"year":2024,"event":"9月、SUPで漕ぎ、浮く家に泊まる、天候に合わせた観光の形として紹介された","source_url":"https://danviet.vn/du-khach-cheo-sup-o-nha-phao-trai-nghiem-vung-ron-lu-quang-binh-20240923132454727.htm"}],"last_verified":"2026-08-16","sections":{"何をしたか":"クアンビン省ミンホア県タンホア社（人口3,075人）は、中部ベトナムでも有数の「洪水の受け皿」と呼ばれる土地で、旧暦6〜9月に毎年冠水する。2010年には記録的な洪水に見舞われた。2011年、オクサリス社（Công ty Oxalis）がこの地のトゥーラン（Tú Làn）洞窟群で探検ツアーの調査と試験運行の許可を初めて受け、そこから観光が始まった。住民は食事の提供や宿泊の受け入れを担い、洪水時に水位とともに浮き上がる「浮く家（nhà phao）」に観光客を泊める形もできた。2023年10月19日、国連世界観光機関（UNWTO）はウズベキスタンのサマルカンドで、タンホアを「世界最良の観光村」に選んだ。ベトナムからの選出はこの1村のみだった。","誰が始めたか":"**住民組織ではなく、外部の民間企業が入口をつくった。** 2011年、オクサリス社（Công ty Du lịch Chua Me Đất / Oxalis）がトゥーラン洞窟群での探検ツアーの調査と試験運行の許可を初めて受けた。同社はその後、住民宅での夕食、ホームステイ、宿泊施設トゥーラン・ロッジ、タンホアのリム（鉄木）の森を走るATVツアーなどを組み立てている。\n\n人民日報（Nhân Dân）2023年10月19日の記事によれば、この展開はオクサリス社と**タンホア社（村）の行政、ミンホア県、クアンビン省観光局が共同で組み立てた段階的な戦略**とされ、その設計は「住民を観光の活動に参加させることから、住民が自分の提供するサービスの主になっていくところまで」と説明されている。住民は浮く家（nhà phao）でホームステイを開く手ほどきを受けた、とも書かれている。\n\n**つまり最初から「外部企業が始めて、所有を住民に移していく」という順序が置かれていた。** UNWTO の賞のカップを受け取ったのはタンホア社人民委員会主席のチュオン・タイン・ズアン（Trương Thanh Duẫn）である。","いくらかかったか":"**確認できなかった。** 参照した4本の出典のどこにも、投資額・事業費・補助金額といった金額の記載がない。`unknown_fields` に `funding_scale` を挙げている。\n\n人民日報の記事は、国内外の報道を通じた宣伝に「体系的に投資された」と書き、トゥーランやタンホアを舞台にした大作映画（『Kong: Skull Island』など）の撮影に触れているが、**いずれも金額は示されていない。** 住民の収入や雇用数についても、この4本には数字がない。","真似するなら最低何が必要か":"この事例で真似できるのは、洞窟でも映画でもなく、**弱点の扱い方と、所有を移す順序**である。\n\n第一に、**毎年沈むという弱点を、隠さず売り物の中心に据えた**こと。タンホアは旧暦6〜9月に冠水する「水を溜める谷」で、2010年には記録的な洪水に遭っている。ここで採られたのは治水でも移転でもなく、「気象に適応する観光村（làng du lịch thích ứng với thời tiết）」という位置づけだった。**克服する対象だったものを、そのまま来てもらう理由に変えている。**\n\n第二に、**住民がすでに持っていた道具を商品にした**こと。浮く家は観光のために作られたものではなく、洪水を生き延びるための住民の既存の備えである。それをホームステイとして使えるように手ほどきした。**新しく建てたのではなく、あるものの用途を増やしている。** P3の規模で移せるのは、ここだと思われる。\n\n第三に、**所有を移す順序が最初から設計に入っていた**こと。外部企業が2011年に入り、住民は当初は参加者として、のちにサービスの主体として位置づけられている。**外部の事業者が入ることと、住民が主導権を持つことを、対立ではなく前後関係として扱っている。**\n\n第四に、**行政の3つの層が同じ設計に乗った**こと。村（社）・県・省の観光局が同じ戦略を共有している。単一の自治体だけでは、許認可と宣伝の両方は動かない。\n\nなお、トゥーラン洞窟群という資源そのものは再現できない。**移せるのは順序と姿勢であって、資源ではない。** また、この事例の担い手は民間企業であり、住民組織が立ち上げたものではない。","今どうなっているか":"`status_current: 継続中`。開始（2011年）から13年後にあたる2024年9月23日の Dân Việt の記事が、現在の様子を伝えている。同記事によれば、大雨のたびに谷に水が集まり村全体が水に囲まれること、各家庭が舟を持ち、洪水の日には浮く家に移って普段どおり生活していること、そして**近年は水に囲まれることが日常になるにつれて観光を含む生活全体がそれに合わせて動くようになった**ことが書かれている。同記事は、まさにその増水の日に「ベトナム初の気象適応型観光」を体験しに来る観光客が多いとしている。\n\n**ただし出典の性格には注意が要る。** 4本のうち3本（Thanh Niên・Nhân Dân・Báo Chính phủ）は2023年10月19日という同じ日の、UNWTO 表彰を受けた報道である。うち2本は党機関紙と政府系媒体であり、STATE §4 が言う成功報道バイアスがかかりやすい位置にある。**開始から3年以上あとの独立した継続報道と言えるのは、実質的に Dân Việt の1本である。**\n\n課題を述べた発言も記録されている。クアンビン省人民委員会副主席のホー・アン・フォン（Hồ An Phong）は2023年10月19日の記者会見で、**観光を伸ばすことと、ベトナムの農村らしさを保つことの両方について、地方・企業・住民にはこれからやるべきことがまだ多くある**と述べている。縮小や撤退を伝える報道は、確認した範囲では見当たらなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"vn-0004","name":"海沿いの村の家の壁に絵を描いて、村ごと壁画の村にした","name_local":"làng bích họa Tam Thanh","name_variants":["Làng bích họa Tam Thanh"],"country":"ベトナム","region":"クアンナム省","municipality":"タムキー市タムタン社（xã Tam Thanh, TP Tam Kỳ）","population_current":6067,"population_scale":"5万人未満","purpose":"人を呼ぶ","theme":"文化・アート・祭り","start_year":2016,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"UBND TP Tam Kỳ（タムキー市人民委員会）と Quỹ giao lưu quốc tế Hàn Quốc（Korea Foundation）","component_types":"hybrid","components":["住民の家の壁に100枚超の絵を描いた","毎年の絵画キャンプを制度にした","韓国の財団と市が組んで始めた","色あせた絵を描き足しに戻った"],"sources":[{"url":"https://tuoitre.vn/dap-bo-xay-moi-o-lang-bich-hoa-tam-thanh-20191212092538173.htm","title":"Đập bỏ, xây mới ở làng bích họa Tam Thanh","outlet":"Tuổi Trẻ","published":"2019-12-15","language":"vi","from_operator":false},{"url":"https://nhandan.vn/bi-an-ngo-nghinh-lang-bich-hoa-tam-thanh-post461164.html","title":"Bí ẩn, ngộ nghĩnh \"Làng bích họa Tam Thanh\"","outlet":"Nhân Dân","published":"2020-06-10","language":"vi","from_operator":false},{"url":"https://thanhnien.vn/tranh-lang-bich-hoa-gay-tranh-cai-buc-nao-chua-phu-hop-se-xin-dieu-chinh-185230425082455041.htm","title":"Tranh làng bích họa gây tranh cãi: Bức nào chưa phù hợp sẽ điều chỉnh","outlet":"Thanh Niên","published":"2023-04-25","language":"vi","from_operator":false},{"url":"https://tuoitre.vn/hoa-si-ve-lang-bich-hoa-tam-thanh-ve-them-tranh-tuong-20240523122956751.htm","title":"Họa sĩ về làng bích họa Tam Thanh vẽ thêm tranh tường nhà dân","outlet":"Tuổi Trẻ","published":"2024-05-23","language":"vi","from_operator":false}],"context_sources":[],"unknown_fields":["funding_scale"],"latest_source_year":2024,"elapsed_years":8,"follow_up":"濃い","follow_up_note":"2016年6月に始まり、2018年に描き足された。2019年には色あせや落書き、壁画のある家の取り壊しが報じられ、2023年には一部の絵が論争になった。2024年にも画家が入って描き足している。","timeline":[{"year":2016,"event":"6月、韓国の若者が住民の家の壁に100枚を超える絵を描いた。ベトナムで最初の壁画村とされる","source_url":"https://tuoitre.vn/dap-bo-xay-moi-o-lang-bich-hoa-tam-thanh-20191212092538173.htm"},{"year":2017,"event":"毎年の壁画キャンプを正式に始め、北部の画家・建築家を招くようになった","source_url":"https://nhandan.vn/bi-an-ngo-nghinh-lang-bich-hoa-tam-thanh-post461164.html"},{"year":2018,"event":"韓国の画家が戻って30枚を描き足し、50軒を塗り直した","source_url":"https://tuoitre.vn/dap-bo-xay-moi-o-lang-bich-hoa-tam-thanh-20191212092538173.htm"},{"year":2019,"event":"絵の色あせと落書きが報じられ、壁画のある家5軒が取り壊されたか取り壊しを控えていると伝えられた","source_url":"https://tuoitre.vn/dap-bo-xay-moi-o-lang-bich-hoa-tam-thanh-20191212092538173.htm"},{"year":2023,"event":"一部の絵が論争になり、ふさわしくないものは調整すると当局側が述べたと報じられた","source_url":"https://thanhnien.vn/tranh-lang-bich-hoa-gay-tranh-cai-buc-nao-chua-phu-hop-se-xin-dieu-chinh-185230425082455041.htm"},{"year":2024,"event":"画家が戻り、住民の家の壁に絵を描き足した","source_url":"https://tuoitre.vn/hoa-si-ve-lang-bich-hoa-tam-thanh-ve-them-tranh-tuong-20240523122956751.htm"}],"last_verified":"2026-08-17","sections":{"何をしたか":"クアンナム省タムキー市タムタン社という海沿いの村で、住民の家の壁に絵を描き、村ごと壁画の村にした。2016年6月、タムキー市人民委員会と韓国国際交流財団（Korea Foundation）の事業として、韓国の若者が100枚を超える絵を住民の家の壁に描いた。トゥオイチェーはこれをベトナムで最初の壁画村と書いている。ニャンザンによれば、事業は「Art for a better community」という名で、村の観光と経済・文化を伸ばすことを目的に掲げていた。2017年からは毎年の壁画キャンプを正式に始め、北部の画家や建築家を招くようになった。2018年には韓国の画家が戻り、30枚を描き足して50軒を塗り直した。","誰が始めたか":"**タムキー市人民委員会と韓国国際交流財団（Korea Foundation）の共同事業である。** トゥオイチェーは、これを「ベト・韓の地域美術交流事業」と書いている。2016年6月に描いたのは韓国の若いボランティアたちで、2018年には韓国の画家が戻って30枚を描き足し、50軒を塗り直した。\n\n**ただし2017年からは担い手が変わっている。** ニャンザンによれば、この年から事業は毎年の壁画キャンプを正式に組むようになり、**北部から専門の画家や建築家を招く**形になった。外国の財団の一回きりの事業ではなく、地元の行政が続ける枠組みに移されたことになる。\n\nタムタン社は、タムキー市の13の坊・社のうち唯一、直接海に面している。ニャンザンは、長さおよそ8km・幅2km足らずの細長い土地で、前は海、背は70km余りのチュオンザン川に接すると書いている。2020年時点で1,623世帯・6,067人である。","いくらかかったか":"**確認できなかった。** 塗料代も画家への謝礼も、毎年のキャンプの費用も、今回の出典には金額が出てこない。`funding_scale` は `unknown_fields` に挙げている。\n\n分かるのは**費用の担い手が動いていること**である。最初の100枚超は韓国国際交流財団の事業として描かれ、2017年以降は地元の行政が毎年のキャンプを組んでいる。**始めるための金と、続けるための金は別の主体から出ている。**","真似するなら最低何が必要か":"1. **住民の家の壁を貸してもらえること。** 描く対象は公共物ではなく個人の家である。**壁は住民のものだという前提が、あとで効いてくる**（下記）\n2. **毎年描き足す仕組み。** 2017年から毎年の壁画キャンプが制度化されている。**一度描いて終わりにしない**という設計が、この事例と他の壁画事業を分ける\n3. **描き手を外から呼ぶ経路。** 最初は韓国の画家、のちに北部の専門家。地元だけでは続かない\n4. **貧しさを前提にした目的の置き方。** ニャンザンは、貧しいが可能性のある村の観光と経済・文化を伸ばすことが目的だったと書いている\n5. **絵の内容をめぐる調整の窓口。** 2023年に一部の絵が論争になったとき、当局側は「ふさわしくないものは調整する」と応じている\n\n**確認できない**のは、費用、住民が壁を提供する際の取り決め、そして絵の著作権の扱いである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2024年5月23日のトゥオイチェーの記事で、画家が村に戻って住民の家の壁に絵を描き足したと伝えている。**毎年描き足す仕組みは働いている。**\n\nただし**途中には明確な劣化がある。** 2019年12月のトゥオイチェーは、来訪者がまばらで、住民の家の壁に描かれた絵の多くが色あせ、苔に覆われ、上から塗料で書かれたものもあると伝えた。海沿いのある家は屋根を外され、住人がおらず、建て替えのために取り壊される見込みだと書かれている。**壁が住民のものである以上、家を建て替えれば絵は消える。** 社の当局は、これまでに壁画のある家5軒がそうした状態になったと説明している。\n\n2023年4月には別の問題が出た。一部の絵が論争を呼び、タインニエンは「ふさわしくない絵は調整する」という当局側の応答を見出しに掲げた。同紙は、画家が真心で村に来ている以上その作品を受け入れない理由はない、という趣旨の発言と、絵は屋根を飾るだけでなく来訪者に向けたものであるべきだという趣旨の発言を並べて伝えている。\n\n**この事例の「その後」は、成功でも失敗でもなく、描き足しと消失が同時に進む状態である。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"vn-0005","name":"車の少ない短い通りを、常設の書店街に作り替えた","name_local":"Đường sách TP.HCM","name_variants":["Đường Sách Thành phố Hồ Chí Minh"],"country":"ベトナム","region":"ホーチミン市","municipality":"ホーチミン市1区（Nguyễn Văn Bình 通り）","population_current":9521886,"population_scale":"25万超","purpose":"商いを起こす","theme":"商店街・市場","start_year":2016,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"Công ty Đường sách TP.HCM（運営会社）。市党委・市人民委員会の指導と、ベトナム出版協会（Hội Xuất bản Việt Nam）の協力による","component_types":"hard","components":["車の少ない通りを書店街にした","出版社ごとに常設の売り場を置いた","出店者に催しの開催を求めた","売上と来場を毎年公表した"],"sources":[{"url":"https://thanhnien.vn/van-hoa/tphcm-phu-song-duong-sach-921777.html","title":"TP.HCM 'phủ sóng' đường sách","outlet":"Thanh Niên","published":"2018-01-09","language":"vi","from_operator":false},{"url":"https://tuoitre.vn/thanh-cong-cua-duong-sach-tp-hcm-truyen-cam-hung-muon-noi-20180111083955177.htm","title":"Thành công của Đường sách TP.HCM truyền cảm hứng muôn nơi","outlet":"Tuổi Trẻ","published":"2018-01-11","language":"vi","from_operator":false},{"url":"https://tuoitre.vn/moi-ngay-duong-sach-tp-hcm-don-hon-8-000-luot-khach-20230223134220797.htm","title":"Mỗi ngày Đường sách TP.HCM đón hơn 8.000 lượt khách","outlet":"Tuổi Trẻ","published":"2023-02-23","language":"vi","from_operator":false},{"url":"https://tuoitre.vn/sau-hon-8-nam-duong-sach-tp-hcm-ban-gan-6-trieu-cuon-sach-20240911145543023.htm","title":"Sau hơn 8 năm, Đường sách TP.HCM bán gần 6 triệu cuốn sách","outlet":"Tuổi Trẻ","published":"2024-09-11","language":"vi","from_operator":false},{"url":"https://tuoitre.vn/10-nam-hoat-dong-duong-sach-tp-hcm-thu-tren-433-ti-dong-20260108141811215.htm","title":"10 năm hoạt động, Đường sách TP.HCM thu trên 433 tỉ đồng","outlet":"Tuổi Trẻ","published":"2026-01-08","language":"vi","from_operator":false}],"context_sources":[{"url":"https://tuoitre.vn/ti-trong-dan-so-trong-do-tuoi-lao-dong-tai-tp-hcm-chiem-74-2-20250428142427487.htm","title":"Tuổi Trẻ（市保健局による。2024年末のホーチミン市の人口 9,521,886人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2026,"elapsed_years":10,"follow_up":"濃い","follow_up_note":"2016年1月9日に開業し、2018年には各地が同じ方式に注目していると報じられた。2023年には1日8,000人を超える来場、2024年には開業から2024年6月までの売上3,450億ドン・販売570万冊が公表され、2026年1月の10周年では10年間の売上が4,330億ドンを超えたとされた。","timeline":[{"year":2016,"event":"1月9日に開業した。当初は14の出版社・書籍会社による19の売り場だった","source_url":"https://tuoitre.vn/10-nam-hoat-dong-duong-sach-tp-hcm-thu-tren-433-ti-dong-20260108141811215.htm"},{"year":2016,"event":"年末に市人民委員会が、市の際立った10か所の1つに挙げた","source_url":"https://tuoitre.vn/sau-hon-8-nam-duong-sach-tp-hcm-ban-gan-6-trieu-cuon-sach-20240911145543023.htm"},{"year":2018,"event":"開業2年の時点で、この方式が各地で注目されていると報じられた","source_url":"https://tuoitre.vn/thanh-cong-cua-duong-sach-tp-hcm-truyen-cam-hung-muon-noi-20180111083955177.htm"},{"year":2023,"event":"1日あたり8,000人を超える来場があると報じられた","source_url":"https://tuoitre.vn/moi-ngay-duong-sach-tp-hcm-don-hon-8-000-luot-khach-20230223134220797.htm"},{"year":2024,"event":"開業から2024年6月までの売上が3,450億ドン超、販売が570万冊と公表された","source_url":"https://tuoitre.vn/sau-hon-8-nam-duong-sach-tp-hcm-ban-gan-6-trieu-cuon-sach-20240911145543023.htm"},{"year":2026,"event":"1月8日に10周年の式典が開かれ、10年間の売上は4,330億ドンを超えたとされた","source_url":"https://tuoitre.vn/10-nam-hoat-dong-duong-sach-tp-hcm-thu-tren-433-ti-dong-20260108141811215.htm"}],"last_verified":"2026-08-17","sections":{"何をしたか":"ホーチミン市1区の Nguyễn Văn Bình 通りを、常設の書店街に作り替えた。2016年1月9日に開業し、当初は14の出版社・書籍会社が19の売り場を出した。トゥオイチェーによれば、運営会社の Lê Hoàng は、車の通行が少ない短い道から読書のための施設が開かれたと述べている。売り場を並べただけではなく、**出店者には本を売るだけでなく催しを開くことが求められた**。同紙は2018年、それぞれの出店者が催しの主催者になることで、通りが職業の場であると同時に市民や家族、学校の行き先にもなったと書いている。開業した年の末には、市人民委員会が市の際立った10か所の1つに挙げた。","誰が始めたか":"運営しているのは Công ty Đường sách TP.HCM である。2026年の10周年の記事で、同社の Lê Hoàng は、市党委員会と市人民委員会の指導、各部局の連携、そしてベトナム出版協会（Hội Xuất bản Việt Nam）の協力によってこの通りが作られたと述べている。2018年の記事は、Lê Hoàng が設立を働きかけた当初からの狙いとして「交通のための道を文化の空間に変えること」を挙げていたと書いている。つまり**行政・業界団体・運営会社の3者が組んだ形**であり、どれか1つが欠けた形では出典に現れない。","いくらかかったか":"**確認できなかった。** 整備にかかった費用も、出店者が払う場所代も、今回の出典には書かれていないため `funding_scale` は `unknown_fields` に挙げている。\n\n金額として出典が書いているのは、かかった額ではなく**入ってきた額**である。開業から2024年6月までの全出店者の売上が3,450億ドンを超え、販売冊数は570万冊だった（2024年9月）。2026年1月の10周年の時点では、10年間の売上が4,330億ドンを超えたとされている。","真似するなら最低何が必要か":"出典から読み取れる最低条件は5つある。\n\n1. **車の通行が少ない短い通り。** 2026年の記事は、もともと交通量の少ない短い道だったことを出発点として挙げている。広い幹線ではこの形にならない\n2. **並べられるだけの数の書店。** 開業時で14社・19区画。1〜2店では「街」にならない\n3. **出店者に催しの開催を求める運営の決め。** これが2018年の記事で繰り返し語られている核心で、**本を売る場所と催しの場所を兼ねさせたことが人を呼び続けている**\n4. **専任の運営会社。** 個々の書店の集まりではなく、通り全体を運営する会社がある\n5. **行政の指導と業界団体の協力。** 道路を書店街にするには市の側の関与が要る\n\n逆に**確認できない**のは、整備費、出店料、道路の通行を止めるための手続きである。真似する側はここを自分で埋める必要がある。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年1月8日のトゥオイチェーの記事である。同日に10周年の式典が開かれ、10年間の売上は4,330億ドンを超えたとされた。来場は2023年2月の時点で1日8,000人を超えると報じられ、同じ2023年には市民の投票で「市の面白い100か所」の1つにも選ばれている。\n\nただし**この記録の読み方には留保が要る。** 出典はいずれもベトナムの中央紙であり、STATE §4 が指摘するとおり、この環境では開始と成果は報じられても縮小や失敗は報じられにくい。**今回探した範囲では、否定的な報道も、当事者への批判も見つからなかった。** それは問題がないことの証明ではなく、確認できなかったという観測結果である。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"vn-0006","name":"鉄道高架の19のアーチに絵を描き、5年で色が落ちて駐車場になった","name_local":"phố bích họa Phùng Hưng","name_variants":["Phố bích họa Phùng Hưng","bích họa Phùng Hưng","bích họa gầm cầu Phùng Hưng"],"country":"ベトナム","region":"ハノイ市","municipality":"ハノイ市ホアンキエム区フンフン通り","population_current":8400000,"population_scale":"25万超","purpose":"空間をひらく","theme":"文化・アート・祭り","start_year":2017,"end_year":null,"status_current":"縮小","actor_type":"混合","lead_actor":"ホアンキエム区人民委員会、国連ハビタット（UN-Habitat）、韓国国際交流財団（Korea Foundation）、ハノイ旧市街管理委員会と画家グループ","component_types":"hybrid","components":["高架のアーチ19面に絵を描いた","韓国と越の画家が共同で描いた","高架下の歩道を石張りにした","歩行者専用の通りにつないだ"],"sources":[{"url":"https://tuoitre.vn/trien-khai-du-an-bich-hoa-gam-cau-phung-hung-20171104180959473.htm","title":"Triển khai dự án bích họa gầm cầu Phùng Hưng","outlet":"Tuổi Trẻ","published":"2017-11-05","language":"vi","from_operator":false},{"url":"https://tuoitre.vn/pho-bich-hoa-phung-hung-co-lam-bien-dang-hon-pho-co-20181021172201996.htm","title":"Phố bích họa Phùng Hưng có làm 'biến dạng' hồn phố cổ?","outlet":"Tuổi Trẻ","published":"2018-10-22","language":"vi","from_operator":false},{"url":"https://danviet.vn/hang-loat-khong-gian-van-hoa-nghe-thuat-tai-ha-noi-bi-boi-ban-xuong-cap-khien-nhieu-nguoi-xot-xa-20220815123155621-d1037457.html","title":"Hàng loạt không gian văn hóa nghệ thuật tại Hà Nội bị bôi bẩn, xuống cấp khiến nhiều người xót xa","outlet":"Dân Việt","published":"2022-08-17","language":"vi","from_operator":false},{"url":"https://tuoitre.vn/plo/pho-bich-hoa-phung-hung-o-ha-noi-xuong-cap-post709676.html","title":"Phố bích họa Phùng Hưng ở Hà Nội xuống cấp","outlet":"Pháp Luật TP.HCM（Tuổi Trẻ Online 転載面）","published":"2022-11-28","language":"vi","from_operator":false}],"context_sources":[{"url":"https://nhandan.vn/ha-noi-chiem-gan-84-dan-so-ca-nuoc-post729588.html","title":"Nhân Dân「Hà Nội chiếm gần 8,4% dân số cả nước」（2022年末時点のハノイ市人口 約840万人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2022,"elapsed_years":5,"follow_up":"濃い","follow_up_note":"2017年11月に韓国の画家が描き始め、2018年2月に開通した。同じ2018年には旧市街の趣を損なうのではという問いが報じられ、2022年には絵の一部が消え、残りも劣化し、高架下は駐車に使われていると伝えられた。","timeline":[{"year":2017,"event":"11月、韓国の画家がアーチ56・58・59番から描き始めた。ホアンキエム区人民委員会が韓国国際交流財団と国連ハビタットと組み、18面のアーチに絵を置く計画だった。高架脇の歩道の石張りも同時に進められた","source_url":"https://tuoitre.vn/trien-khai-du-an-bich-hoa-gam-cau-phung-hung-20171104180959473.htm"},{"year":2018,"event":"2月に開通し、全長1km余りの歩行者の通りとしてドンスアン市場の空間などとつながった。19面に19点。同じ年、旧市街の趣を損なうのではないかという問いが報じられた","source_url":"https://tuoitre.vn/pho-bich-hoa-phung-hung-co-lam-bien-dang-hon-pho-co-20181021172201996.htm"},{"year":2022,"event":"8月、事業の監督者である画家が、色が落ち一部が剥がれていると述べ、5年のあいだ地元による補修の動きを見ていないと語った。監視カメラの前で赤い塗料をかけられた箇所もあった","source_url":"https://danviet.vn/hang-loat-khong-gian-van-hoa-nghe-thuat-tai-ha-noi-bi-boi-ban-xuong-cap-khien-nhieu-nguoi-xot-xa-20220815123155621-d1037457.html"},{"year":2022,"event":"11月、多くの絵がすでに無くなり、残りも著しく劣化していると報じられた。外側には車が長く連なって絵を隠し、以前は週末に人が集まった空間が閑散としている。住民の一部はネットを張って運動の場に使っている","source_url":"https://tuoitre.vn/plo/pho-bich-hoa-phung-hung-o-ha-noi-xuong-cap-post709676.html"}],"last_verified":"2026-08-17","sections":{"何をしたか":"ハノイ旧市街のフンフン通りで、地方からハノイ駅へ向かう**鉄道高架のアーチの面に絵を描いた。** トゥオイチェーによれば、2017年11月にホアンキエム区人民委員会が韓国国際交流財団および国連ハビタット（UN-Habitat）と組んで着工し、韓国の画家がアーチ56・58・59番から描き始めた。「芸術を暮らしの空間に持ち込む」という枠組みの事業で、高架脇の歩道の石張りも同時に進められている。2018年2月に開通し、**全長1km余り、19面のアーチに19点**が置かれた。通りは歩行者の空間となり、ドンスアン市場の空間などとつながった。描いたのはハノイ旧市街管理委員会、ベトナム側の画家グループ、そして韓国の公共美術の研究機関である。","誰が始めたか":"区の人民委員会である。ただし単独ではなく、**国連ハビタットと韓国国際交流財団という2つの外部の主体が並んでいる。** 制作もベトナムと韓国の画家の共同で、韓国側の公共美術研究機関が加わった。\n\n**この構成が、あとで効いてくる。** 作るところまでは外部の資金と人が入ったが、下記のとおり、**5年のあいだ補修の動きが見られなかったと事業の監督者が述べており、区が維持補修を委ねた先が報じられたのは2022年11月である。**","いくらかかったか":"**確認できなかった。** 事業費も、韓国国際交流財団や国連ハビタットの負担割合も、今回の出典には出てこない。`funding_scale` は `unknown_fields` に挙げている。\n\n**ただし維持費については、出典が間接的に答えている。** 2022年8月、事業の監督者である画家は、5年のあいだ地元の側に補修の動きが見られないと述べている。**維持の費用は、誰の予算にも入っていなかったことになる。**","真似するなら最低何が必要か":"この事例から取り出せるのは、作り方ではなく**続け方の欠落**である。\n\n1. **維持の担い手を最初に決めること。** 作るときは区・国連機関・外国の財団・画家が並んだが、5年のあいだ補修の動きは見られなかったと監督者が述べており、区が旧市街管理委員会に維持補修を委ねたと報じられたのは2022年11月である。**外部資金で作った公共のアートは、ここで落ちる**\n2. **屋外の塗装は経年で落ちるという前提。** 2022年の時点で色は褪せ、一部は剥がれ、絵そのものが消えた面もある\n3. **高架下の空間の使われ方を決めておくこと。** 絵の前には車が長く並び、絵を隠している。**空間を開けただけでは、駐車に取られる**\n4. **賛否が出ることを織り込むこと。** 2018年の時点で「旧市街の趣を損なうのではないか」という問いが報じられている\n\n**確認できない**のは、事業費と、維持の責任がどこにあると定められていたかである。","今どうなっているか":"**縮小している**（`status_current: 縮小`）。2026年8月時点で確認できた最も新しい記録は2022年11月28日の記事で、**多くの絵がすでにアーチから無くなり、残るものも著しく劣化している**と伝えている。外側には自動車が長く連なって絵を隠し、かつて週末に人が集まった空間は閑散としている。住民の一部はネットを張って運動の場として使っている。\n\n同じ2022年の8月、ダンヴィエトの記事で、事業の監督者である画家のグエン・テー・ソンは、当初と比べて色が落ち一部が剥がれていると述べたうえで、**5年のあいだ地元による補修・保守の動きを見ていないため、事業は次第に劣化していると語っている。** 監視カメラの前で赤い塗料をかけられた箇所もあった。\n\n**行政側の応答は、同じ2022年11月28日の記事に載っている。** Pháp Luật TP.HCM の取材に対し、ハノイ旧市街管理委員会（Ban quản lý phố cổ Hà Nội）の担当者は、**ホアンキエム区人民委員会が同委員会にフンフン通りの壁画の維持補修を委ねたと述べている。** 今後については「画家たちを招いて検討し、合意しなければならない」とし、国の規定による価格にも関わるからだと語っている。**これは補修が行われたという報告ではなく、この時点での方針の表明である。** また**最新の出典が2022年**であり、それ以降にアーチが補修されたのか、さらに失われたのかは確認できていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"vn-0007","name":"ゴミ捨て場と空き地を、住民が持ち主になる遊び場に変え続けた","name_local":"Think Playgrounds","name_variants":["Nghĩ về sân chơi trong phố","Nghĩ về sân chơi"],"country":"ベトナム","region":"全国（ハノイが起点）","municipality":"ハノイ（起点）。ホーチミン市ビンタン区、ハノイ市ドンアイン県などへ広がった","population_scale":"不明","purpose":"住民が決める","theme":"学校・公共施設","start_year":2014,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"Think Playgrounds（有志の集まりから社会的企業になった設計組織）。共同設立者のグエン・ティエウ・クオック・ダット氏。据え付けは企業の社員と地域の青年団、その後の手入れは住民の団体が担う","funding_scale":"参照した4本のどこにも総額が書かれていない。遊び場は地域にとって「0ドン（無料）」と報じられており、2023年の1か所は化学企業ベトナム法人との連携で開いた","component_types":"hard","components":["ゴミ捨て場と空き地を遊び場に変えた","古タイヤと廃材で遊具をつくる","住民が持ち主になる形をとる","企業と青年団が据え付けを担う","障害のある子ども向けの遊び場も作る"],"sources":[{"url":"https://www.sggp.org.vn/basf-viet-nam-va-think-playgrounds-ra-mat-san-choi-cong-dong-thu-7-post693462.html","title":"BASF Việt Nam và Think Playgrounds ra mắt sân chơi cộng đồng thứ 7","outlet":"Sài Gòn Giải Phóng","published":"2023-06-13","language":"vi","from_operator":false},{"url":"https://nhandan.vn/nhung-cong-vien-0-dong-post812285.html","title":"Những công viên \"0 đồng\"","outlet":"Nhân Dân","published":"2024-06-02","language":"vi","from_operator":false},{"url":"https://tuoitre.vn/cuoc-thi-tai-tao-xanh-bien-nhung-bai-dat-trong-thanh-san-choi-cho-tre-em-2024070117255003.htm","title":"Cuộc thi Tái tạo xanh: Biến những bãi đất trống thành sân chơi cho trẻ em","outlet":"Tuổi Trẻ","published":"2024-07-02","language":"vi","from_operator":false},{"url":"https://hanoigrapevine.com/2025/05/finest-organisers-2024-2025-think-playgrounds/","title":"Finest Organisers 2024-2025: Think Playgrounds","outlet":"Hanoi Grapevine","published":"2025-05-13","language":"en","from_operator":false}],"context_sources":[],"unknown_fields":["population_scale","population_current","funding_scale"],"discrepancies":[{"field":"これまでに作った箇所数（2024年前後）","values":[{"value":"240か所（「0ドンの遊び場」として。10年で）","source_url":"https://nhandan.vn/nhung-cong-vien-0-dong-post812285.html","published":"2024-06-02"},{"value":"243か所（ゴミ捨て場・空き地を変えたものとして。10年で）","source_url":"https://tuoitre.vn/cuoc-thi-tai-tao-xanh-bien-nhung-bai-dat-trong-thanh-san-choi-cho-tre-em-2024070117255003.htm","published":"2024-07-02"},{"value":"270か所超（2024年時点の「公共空間と遊び場」として）","source_url":"https://hanoigrapevine.com/2025/05/finest-organisers-2024-2025-think-playgrounds/","published":"2025-05-13"}]}],"latest_source_year":2025,"elapsed_years":11,"follow_up":"濃い","follow_up_note":"2014年に有志の集まりとして始まり、社会的企業になった。2024年6月には10年で240か所と報じられ、2025年5月には2024年時点で公共空間と遊び場が270か所を超え、うち20か所以上が障害のある人も使えるものだと伝えられている。","timeline":[{"year":2014,"event":"ハノイに子どもの遊び場がほとんど無いことに気づいた設計者らが、有志の集まりとして始めた。のちに社会的企業になった","source_url":"https://hanoigrapevine.com/2025/05/finest-organisers-2024-2025-think-playgrounds/"},{"year":2023,"event":"6月3日、ホーチミン市ビンタン区タンタオの文化スポーツセンターで、化学企業のベトナム法人および区の青年団と組んだ7か所目の共同遊び場が開いた","source_url":"https://www.sggp.org.vn/basf-viet-nam-va-think-playgrounds-ra-mat-san-choi-cong-dong-thu-7-post693462.html"},{"year":2024,"event":"6月、10年で240か所になったと報じられた。ロンビエン橋の下のゴミ捨て場が、半年余りで森の公園に変わっている","source_url":"https://nhandan.vn/nhung-cong-vien-0-dong-post812285.html"},{"year":2024,"event":"7月、ハノイ市ドンアイン県ナムホン社タンミー集落に243か所目が開いた","source_url":"https://tuoitre.vn/cuoc-thi-tai-tao-xanh-bien-nhung-bai-dat-trong-thanh-san-choi-cho-tre-em-2024070117255003.htm"},{"year":2025,"event":"5月、2024年に公共空間と遊び場が270か所を超え、うち20か所以上が障害のある人も使えるものになったと伝えられた","source_url":"https://hanoigrapevine.com/2025/05/finest-organisers-2024-2025-think-playgrounds/"}],"last_verified":"2026-08-19","sections":{"何をしたか":"ベトナム・ハノイで、**ゴミ捨て場や空き地を、子どもの遊び場に変え続けている**取り組み。Tuổi Trẻ（2024年7月2日）によれば、社会的企業 Think Playgrounds（Nghĩ về sân chơi trong phố）は**10年で243か所のゴミ捨て場・空き地を遊び場に変え、すべて無料である。**\n\n**遊具は廃材でつくる。** Sài Gòn Giải Phóng（2023年6月13日）は、責任ある供給元のユーカリ材・古タイヤ・再生プラスチック板といった環境に負荷の少ない材料を使うと書いている。**据え付けと飾り付けは、企業の社員と地域の青年団が行う。**\n\n**手渡す側にならない形をとっている。** Tuổi Trẻ（2024年7月2日）によれば、Think Playgrounds は自らを遊び場を贈る側とは置かず、**住民と子どもが遊び場の持ち主になり、贈り物を受け取る側にはならない**という進め方を選んでいる。共同設立者のグエン・ティエウ・クオック・ダット氏は「まだ遊び場と定義されていない空間に小さな遊具を1つ置くだけで、その空間についての人の認識が変わる」という趣旨を述べている。\n\nHanoi Grapevine（2025年5月13日）によれば、**2024年時点で公共空間と遊び場は270か所を超え、そのうち20か所以上は障害のある人も使えるものである。**","誰が始めたか":"**始めたのは、街に遊び場が無いことに気づいた個人である。** Tuổi Trẻ（2024年7月2日）によれば、共同設立者のグエン・ティエウ・クオック・ダット氏は、ある人から「ハノイで子どもの遊び場を見に行きたい」と言われたときに、**探すのがひどく難しいことに気づいた。** ハノイには子どもの遊び場が少ないうえ、露天商・商売・駐車場に占められていた。同氏はそこから有志の集まりを立ち上げ、それが社会的企業になった。\n\n**動機は自分の育ちにある。** 同氏は Tuổi Trẻ に、田舎で生まれたが5歳で都市に移り、帰省のたびに従兄弟たちが木に易々と登るのに自分は怖くて高く登れず引け目を感じたこと、**もし昔もっと田舎で遊べていたら体はいまより良く、恐れも少なかっただろう**と述べている。\n\n**設立は2014年である。** Hanoi Grapevine（2025年5月13日）は、Think Playgrounds を2014年にハノイで設立された社会的企業かつ設計組織とし、**子どもの遊ぶ権利を広げることを使命に掲げていると書いている。**\n\n**作るのも手入れするのも1者ではない。** Nhân Dân（2024年6月2日）によれば、ロンビエン橋の下の森の公園は、Think Playgrounds の「産物」であると同時に、ホアンキエム区とフックタン坊の行政、社会団体、地域の住民の支えによるものである。**同記事によれば、坊の女性会の分会長と坊の青年団が一緒に花壇と樹木の世話をしており、地域の活動の情報は毎日 Zalo のグループに上がる。**","いくらかかったか":"**総額は、参照した4本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**地域にとっては「0ドン」である。** Nhân Dân（2024年6月2日）はこれらを「0ドンの公園」と呼んでいる。Tuổi Trẻ（2024年7月2日）も、243か所すべてが完全に無料だと書いている。\n\n**費用の出どころは案件ごとに違う。** Nhân Dân（2024年6月2日）は、夏になると遊び場の建設・改修の提案が社会的企業に集まるが、設計と施工の解を見つけるだけでなく、**いちばん大事なこととして資金源を見つけなければならないと書いている。** 2023年の1か所は、化学企業のベトナム法人と区の青年団との連携で開いた（Sài Gòn Giải Phóng 2023年6月13日）。\n\n**箇所数は出典間で食い違っている。** 2024年6月の Nhân Dân は240か所、翌月の Tuổi Trẻ は243か所、2025年5月の Hanoi Grapevine は2024年時点で270か所超としている。**数えている対象が「0ドンの遊び場」「ゴミ捨て場・空き地を変えたもの」「公共空間と遊び場」と異なる。** `discrepancies` に並置した。","真似するなら最低何が必要か":"第一に、**贈る側に立たない**こと。Think Playgrounds は遊び場を贈る側とは自らを置かず、住民と子どもが持ち主になる形をとっている（Tuổi Trẻ 2024年7月2日）。**受け取る側をつくらない。**\n\n第二に、**小さく1つ置いて空間の意味を変える**こと。共同設立者は、まだ遊び場と定義されていない空間に小さな遊具を1つ置くだけで、その空間についての人の認識が変わるという趣旨を述べている（同）。**全部を作り替えてから開くのではない。**\n\n第三に、**材料を廃材にそろえる**こと。古タイヤ、再生プラスチック板、責任ある供給元のユーカリ材が使われている（Sài Gòn Giải Phóng 2023年6月13日）。**同記事は、これが古い材料の再使用と再生の生きた実例にもなると書いている。**\n\n第四に、**据え付けを外部の手で担う**こと。2023年の1か所では、企業の社員と地域の青年団が遊具を据え付け、飾り付けた（同）。**設計する側と、体を動かす側を分けている。**\n\n第五に、**手入れをする人を先に決めておく**こと。ロンビエン橋の下の公園では、坊の女性会の分会と青年団が花壇と樹木の世話をし、日々の情報を Zalo のグループで共有している（Nhân Dân 2024年6月2日）。**同記事によれば、以前は誰もこの区域に近づこうとしなかったが、公園に変える方針が出てから住民が世話と保全に加わるようになったと、女性会の分会長が述べている。**\n\n第六に、**障害のある子どもを後回しにしない**こと。2024年時点で270か所を超える公共空間と遊び場のうち、20か所以上は障害のある人も使えるものである（Hanoi Grapevine 2025年5月13日）。","今どうなっているか":"**2026年8月時点で確認できたのは、2025年5月13日の記事までである。**\n\n**11年目に入り、範囲が広がっている。** Hanoi Grapevine（2025年5月13日）によれば、2024年に完成した公共空間と遊び場は全国で270か所を超えた。**ハノイの紅河の河岸とホイアンのクアダイ海岸にある3か所は森の公園として設計され、自然の再生を助けることと、その土地の生態系への関心を高めることを狙っている。** 同記事は、2024年の活動として「共同の庭：廃棄物を芸術に変える」の共同開催、文廟でのユニセフの子どもの遊びの日への参加、「ディエム・フン・ティに着想した遊び場」の設計、および「誰もが使える公共空間の設計」の会議への参加を挙げている。\n\n**ハノイ以外にも出ている。** 2023年6月3日には、ホーチミン市ビンタン区タンタオの文化スポーツセンターで、7か所目の共同遊び場が開いた（Sài Gòn Giải Phóng 2023年6月13日）。同記事によれば、この区域は住民のおよそ半分が移住してきた労働者で、**1万8,000人を超える子どもが対象になるとされる。**\n\n**ゴミ捨て場が公園に変わった例が具体的に報じられている。** Nhân Dân（2024年6月2日）によれば、ロンビエン橋の下の川べりは半年余り前まで巨大なゴミの山で、誰も足を踏み入れたがらない場所だった。**いまは森の公園になり、長さ22メートルの龍の形をした木の遊具が置かれている。** ブランコ・シーソー・滑り台のほか、運動器具と若者向けのバスケットボールの場もある。\n\n**縮小や中断を伝える記述は、参照した4本の中には無い。** ただし4本のうち3本はベトナムの新聞であり、**成功報道バイアス（STATE §4）が働く条件に当たる。** `status_current` を `継続中` としたのは、開始から11年あとの2025年5月の記事に稼働の記述があることによる。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false}]}</script>
<script>
(function () {
  "use strict";
  var DB = JSON.parse(document.getElementById("terroir-data").textContent);
  var KEY = "terroir-spotcheck-v1";
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
  var showAll = false;
  var current = null;

  var CHECKS = [
    ["sources", "出典が実在し、開ける", "各 [n] を開いて、その記事が本当にこの取り組みを扱っているか"],
    ["literal", "本文の数値・年・固有名詞が出典にある", "機械は西暦しか見ていない。金額・戸数・人数・地名は人が見る"],
    ["modality", "断定・引用・推測の区別が出典と一致する", "「〜と述べた」を「〜した」にしていないか"],
    ["neutral", "地の文で評価していない", "評価は帰属つきの引用として出ているか（Values①）"],
    ["blanks", "埋まらない項目が unknown_fields に出ている", "推測で埋めた値が混じっていないか（§4）"],
    ["disc", "食い違いが1つに丸められていない", "discrepancies に並べてあるか。無い場合は本当に食い違いが無いか"]
  ];

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function md(s) {
    return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function para(s) {
    if (!s || !String(s).trim()) return '<p class="empty">（この節は空。stub として置かれている）</p>';
    return String(s).trim().split(/\n\s*\n/).map(function (p) {
      return "<p>" + md(p.replace(/\n/g, " ")) + "</p>";
    }).join("");
  }
  function visible() { return DB.records.filter(function (r) { return showAll || r.sample; }); }

  function tally() {
    var v = visible(), n = { 通った: 0, 直しが要る: 0, 保留: 0 };
    v.forEach(function (r) { var s = state[r.id]; if (s && s.verdict) n[s.verdict]++; });
    document.getElementById("n-ok").textContent = n["通った"];
    document.getElementById("n-warn").textContent = n["直しが要る"];
    document.getElementById("n-hold").textContent = n["保留"];
    document.getElementById("n-left").textContent = v.length - n["通った"] - n["直しが要る"] - n["保留"];
  }

  function dotClass(id) {
    var s = state[id];
    if (!s || !s.verdict) return "";
    return s.verdict === "通った" ? "ok" : s.verdict === "直しが要る" ? "warn" : "hold";
  }

  function drawRail() {
    var rows = visible(), groups = {}, order = [];
    rows.forEach(function (r) {
      var t = r.theme || "（未記入）";
      if (!groups[t]) { groups[t] = []; order.push(t); }
      groups[t].push(r);
    });
    order.sort();
    var html = order.map(function (t) {
      var done = groups[t].filter(function (r) { return state[r.id] && state[r.id].verdict; }).length;
      return '<div class="rail-group"><h2>' + esc(t) + "<span>" + done + "/" + groups[t].length + "</span></h2></div>" +
        groups[t].map(function (r) {
          return '<button class="item" data-id="' + esc(r.id) + '" aria-current="' + (r.id === current) + '">' +
            '<span class="dot ' + dotClass(r.id) + '"></span>' +
            '<span><span class="id">' + esc(r.id) + (r.sample ? "" : " ・標本外") + "</span><br>" +
            '<span class="nm">' + esc(r.name || r.name_local) + "</span></span></button>";
        }).join("");
    }).join("");
    document.getElementById("rail").innerHTML = html;
  }

  function srcFlags(s) {
    var out = [];
    if (s.from_operator) out.push('<span class="flag">運営主体の発信</span>');
    if (s.sponsored) out.push('<span class="flag">記事広告</span>');
    if (s.abstract_only) out.push('<span class="flag">抄録のみ</span>');
    if (s.source_type) out.push('<span class="flag neutral">' + esc(s.source_type) + "</span>");
    return out.join("");
  }

  function drawSheet() {
    var r = DB.records.filter(function (x) { return x.id === current; })[0];
    if (!r) { document.getElementById("sheet").innerHTML = ""; return; }
    var st = state[r.id] || { checks: {}, verdict: "", note: "" };
    var secOrder = ["何をしたか", "誰が始めたか", "いくらかかったか", "真似するなら最低何が必要か", "今どうなっているか"];

    var meta = [
      ["場所", esc([r.country, r.region, r.municipality].filter(Boolean).join(" / "))],
      ["人口", (r.population_current ? r.population_current.toLocaleString("ja-JP") + "人 / " : "") + esc(r.population_scale || "—")],
      ["年", esc(r.start_year || "—") + " → " + esc(r.latest_source_year || "—") + "（" + esc(r.elapsed_years == null ? "—" : r.elapsed_years) + "年）"],
      ["いま", esc(r.status_current || "—") + " ・ 追跡 " + esc(r.follow_up || "—")],
      ["主体", esc(r.actor_type || "—")],
      ["担い手", esc(r.lead_actor || "—")],
      ["お金", esc(r.funding_scale || "—")],
      ["打ち手", (r.components || []).length ? "<ul>" + r.components.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul>" : "—"],
      ["空欄の申告", (r.unknown_fields || []).length ? "<span class='mono'>" + r.unknown_fields.map(esc).join(", ") + "</span>" : "（無し）"],
      ["最終確認", "<span class='mono'>" + esc(r.last_verified || "—") + "</span>"]
    ];

    var html = "";
    html += '<div class="head">';
    html += '<div class="kicker"><span>' + esc(r.id) + "</span><span>" + esc(r.completeness) + "</span>" +
      (r.sample ? "<span>標本</span>" : "<span>標本外</span>") + "</div>";
    html += "<h2>" + esc(r.name || "（無題）") + "</h2>";
    html += '<div class="local">' + esc(r.name_local || "") +
      ((r.name_variants || []).length ? "　/　" + r.name_variants.map(esc).join("　/　") : "") + "</div>";
    html += '<div class="chips">' +
      '<span class="chip key">' + esc(r.purpose || "—") + "</span>" +
      '<span class="chip key">' + esc(r.theme || "—") + "</span>" +
      '<span class="chip">' + esc(r.component_types || "—") + "</span>" +
      '<span class="chip">' + esc(r.population_scale || "—") + "</span>" +
      (r.single_outlet ? '<span class="chip">単一媒体</span>' : "") +
      (r.self_reported ? '<span class="chip">事業者の発信にもとづく</span>' : "") +
      "</div></div>";

    html += '<div class="cols"><div>';

    html += '<section class="block prose"><h3>本文</h3>';
    secOrder.forEach(function (h) {
      html += "<h4>" + esc(h) + "</h4>" + para((r.sections || {})[h]);
    });
    html += "</section>";

    if ((r.timeline || []).length) {
      html += '<section class="block"><h3>年表</h3><div class="scroll-x"><table class="tl"><thead><tr><th>年</th><th>できごと</th><th>出典</th></tr></thead><tbody>';
      r.timeline.forEach(function (t) {
        var idx = (r.sources || []).map(function (s) { return s.url; }).indexOf(t.source_url);
        html += '<tr><td class="y">' + esc(t.year) + "</td><td>" + esc(t.event) + "</td><td>" +
          (t.source_url ? '<a href="' + esc(t.source_url) + '" target="_blank" rel="noopener">' + (idx >= 0 ? "[" + (idx + 1) + "]" : "↗") + "</a>" : "—") +
          "</td></tr>";
      });
      html += "</tbody></table></div></section>";
    }

    if ((r.discrepancies || []).length) {
      html += '<section class="block"><h3>出典間の食い違い</h3>';
      r.discrepancies.forEach(function (d) {
        html += '<div class="disc"><h4>' + esc(d.field) + "</h4><ul>";
        (d.values || []).forEach(function (v) {
          var idx = (r.sources || []).map(function (s) { return s.url; }).indexOf(v.source_url);
          html += "<li>" + esc(v.value) + ' <span class="src-ref">' +
            (idx >= 0 ? "[" + (idx + 1) + "]" : "") + " " + esc(v.published || "") + "</span></li>";
        });
        html += "</ul></div>";
      });
      html += "</section>";
    }

    html += "</div><div>";

    html += '<section class="block"><h3>出典 ' + (r.sources || []).length + "本</h3><ol class='src'>";
    (r.sources || []).forEach(function (s) {
      html += '<li><div><div class="t"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title || s.url) + "</a></div>" +
        '<div class="m"><span>' + esc(s.outlet || "—") + "</span><span>" + esc(s.published || "—") + "</span><span>" + esc(s.language || "") + "</span>" +
        srcFlags(s) + "</div></div></li>";
    });
    html += "</ol>";
    if ((r.context_sources || []).length) {
      html += "<h3 style='margin-top:20px;'>裏取り（本数に数えない）</h3><ol class='src'>";
      r.context_sources.forEach(function (s) {
        html += '<li><div class="t"><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title || s.url) + "</a></div></li>";
      });
      html += "</ol>";
    }
    html += "</section>";

    html += '<section class="block"><h3>frontmatter</h3><dl class="meta">';
    meta.forEach(function (m) { html += "<dt>" + m[0] + "</dt><dd>" + m[1] + "</dd>"; });
    html += "</dl>";
    if (r.follow_up_note) html += '<p style="margin-top:14px;font-size:13.5px;color:var(--ink-2);line-height:1.8;">' + esc(r.follow_up_note) + "</p>";
    html += "</section>";

    html += '<section class="block"><h3>点検</h3><div class="verdict"><div class="check">';
    CHECKS.forEach(function (c) {
      html += '<label><input type="checkbox" data-check="' + c[0] + '"' + (st.checks && st.checks[c[0]] ? " checked" : "") + ">" +
        "<span>" + esc(c[1]) + "<small>" + esc(c[2]) + "</small></span></label>";
    });
    html += "</div>";
    html += '<div class="pick">' +
      ["通った", "直しが要る", "保留"].map(function (v, i) {
        var cls = ["v-ok", "v-warn", "v-hold"][i];
        return '<label><input type="radio" name="verdict" value="' + v + '"' + (st.verdict === v ? " checked" : "") + '><span class="' + cls + '">' + v + "</span></label>";
      }).join("") + "</div>";
    html += '<textarea id="note" placeholder="どの一文が、どの出典と、どう食い違うか。直すべき箇所を具体的に。">' + esc(st.note || "") + "</textarea>";
    html += '<div class="foot"><button class="btn" id="next">次の記録へ</button><span class="saved" id="saved"></span></div>';
    html += "</div></section>";

    html += "</div></div>";
    document.getElementById("sheet").innerHTML = html;
    bindSheet(r);
  }

  function touch(id) {
    if (!state[id]) state[id] = { checks: {}, verdict: "", note: "" };
    return state[id];
  }
  function flashSaved() {
    var el = document.getElementById("saved");
    if (!el) return;
    el.textContent = "保存した";
    setTimeout(function () { if (el) el.textContent = ""; }, 1400);
  }

  function bindSheet(r) {
    document.querySelectorAll("[data-check]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var s = touch(r.id);
        s.checks[cb.getAttribute("data-check")] = cb.checked;
        save(); flashSaved();
      });
    });
    document.querySelectorAll('input[name="verdict"]').forEach(function (rb) {
      rb.addEventListener("change", function () {
        touch(r.id).verdict = rb.value;
        save(); flashSaved(); drawRail(); tally();
      });
    });
    var note = document.getElementById("note");
    if (note) {
      var t;
      note.addEventListener("input", function () {
        clearTimeout(t);
        t = setTimeout(function () { touch(r.id).note = note.value; save(); flashSaved(); }, 400);
      });
    }
    var nx = document.getElementById("next");
    if (nx) nx.addEventListener("click", function () {
      var v = visible(), i = v.map(function (x) { return x.id; }).indexOf(r.id);
      var n = v[(i + 1) % v.length];
      if (n) { current = n.id; drawRail(); drawSheet(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    });
  }

  document.getElementById("rail").addEventListener("click", function (e) {
    var b = e.target.closest(".item");
    if (!b) return;
    current = b.getAttribute("data-id");
    drawRail(); drawSheet();
    if (window.matchMedia("(max-width: 940px)").matches) {
      document.getElementById("sheet").scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });

  document.getElementById("toggle-all").addEventListener("click", function () {
    showAll = !showAll;
    this.setAttribute("aria-pressed", String(showAll));
    this.textContent = showAll ? "標本だけ出す" : "全件を出す";
    var v = visible();
    if (!v.some(function (x) { return x.id === current; })) current = v.length ? v[0].id : null;
    drawRail(); drawSheet(); tally();
  });

  document.getElementById("export").addEventListener("click", function () {
    var lines = ["# 第3層 スポットチェックの結果", "",
      "生成 " + DB.generated_at + " / 全 " + DB.total + "件のうち標本 " + DB.sample_size + "件（" + Math.round(DB.rate * 100) + "%・テーマで層化）", ""];
    var byV = { "直しが要る": [], "保留": [], "通った": [], "": [] };
    DB.records.forEach(function (r) {
      if (!r.sample && !showAll) return;
      var s = state[r.id] || {};
      byV[s.verdict || ""].push([r, s]);
    });
    ["直しが要る", "保留", "通った"].forEach(function (v) {
      if (!byV[v].length) return;
      lines.push("## " + v + "（" + byV[v].length + "件）", "");
      byV[v].forEach(function (p) {
        var r = p[0], s = p[1];
        var missed = CHECKS.filter(function (c) { return !(s.checks || {})[c[0]]; }).map(function (c) { return c[1]; });
        lines.push("### " + r.id + "　" + (r.name || r.name_local));
        lines.push("- テーマ: " + r.theme + " / purpose: " + r.purpose + " / 出典 " + (r.sources || []).length + "本");
        if (missed.length) lines.push("- 確認できなかった項目: " + missed.join(" / "));
        lines.push("- メモ: " + (s.note ? s.note.replace(/\n/g, "\n  ") : "（無し）"));
        lines.push("");
      });
    });
    if (byV[""].length) {
      lines.push("## 未着手（" + byV[""].length + "件）", "");
      lines.push(byV[""].map(function (p) { return "- " + p[0].id + "　" + (p[0].name || p[0].name_local); }).join("\n"), "");
    }
    document.getElementById("dlg-text").value = lines.join("\n");
    document.getElementById("dlg").showModal();
  });

  document.getElementById("copy").addEventListener("click", function () {
    var ta = document.getElementById("dlg-text");
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () {
        document.getElementById("copied").textContent = "写した";
      }, function () {
        document.getElementById("copied").textContent = ok ? "写した" : "手で選んで写してください";
      });
    } else {
      document.getElementById("copied").textContent = ok ? "写した" : "手で選んで写してください";
    }
    setTimeout(function () { document.getElementById("copied").textContent = ""; }, 1800);
  });

  document.getElementById("dlg").addEventListener("click", function (e) {
    if (e.target === this) this.close();
  });

  var first = visible()[0];
  current = first ? first.id : null;
  drawRail(); drawSheet(); tally();
})();
</script>
</body>
</html>
