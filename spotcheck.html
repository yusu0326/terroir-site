idio-rural-en-biobio.html"},{"year":2022,"event":"政府が緊急住宅計画を発表し、26万戸を2025年12月までにつくる目標を置いた。本プログラムはその一部に位置づけられた","source_url":"https://www.cnnchile.com/pais/world-habitat-awards-programa-minvu-premio-internacional_20240104/"},{"year":2024,"event":"1月、World Habitat Awards 2024 で2位（銀）に選ばれた。世界のおよそ200の公共政策からの選出と報じられている","source_url":"https://colegioarquitectos.com/?p=31362"},{"year":2025,"event":"10月、8,659戸を引き渡しまたは完了したと発表された。当初目標8,215戸の105%にあたり、6,307戸が建設中とされる","source_url":"https://www.diarioconcepcion.cl/economia/2025/10/26/minvu-cumple-meta-del-programa-de-habitabilidad-rural-y-la-supera-en-5.html"}],"last_verified":"2026-08-19","image":{"url":"https://assets.diarioconcepcion.cl/2025/10/Minvu-cumple-meta-del-Programa-de-Habitabilidad-Rural-y-la-supera-en-5-1.jpeg","type":"photo","relevance_confirmed":true,"credit":"Diario Concepción","source_url":"https://www.diarioconcepcion.cl/economia/2025/10/26/minvu-cumple-meta-del-programa-de-habitabilidad-rural-y-la-supera-en-5.html"},"sections":{"何をしたか":"チリの住宅都市計画省（MINVU）が、**人口5,000人以上の都市集落を対象から外した住宅補助**を、2015年の政令第10号（D.S. N°10）で定めた制度。対象は農村、および人口5,000人までの都市集落に住む世帯である（INVItro 2018年9月26日）。\n\n**新築だけでなく、いま建っている家の改修・増築が同じ制度に入っている。** 新築か既存住宅の改善かを選べることは CNN Chile（2024年1月4日）が書いている。改修の側で対象に挙がっているのは、屋根・床・塗装といった住宅一般の補修、基礎的な生活インフラ、断熱、省エネ・節水である（INVItro 2018年9月26日）。寝室の増築や屋内面積の拡張、住宅が建つ敷地の状態を改善する工事、共同設備の建設・改修も対象である（Diario Concepción 2020年10月22日）。\n\n申請は個人でも共同でもでき、**農村管理事業体（Entidad de Gestión Rural）の助言を通して行う。** 最低自己貯蓄は1.5 UF（4万3,000ペソ）からで、60歳以上には貯蓄を求めない（同）。\n\n2024年1月、World Habitat Awards 2024 で2位に選ばれた。","誰が始めたか":"**制度をつくったのは住宅都市計画省である。** 2015年の政令第10号が、この制度を「国内のいかなる場所に居住する世帯の居住条件を改善する（人口5,000人以上の都市集落を除く）」ものとして定めている（MINVU 2015、INVItro 2018年9月26日が引用）。\n\n**実務は複数の主体に分かれている。** 公募の開始を告げるのは省で、設計済みで申請する場合はその案件が地方の住宅都市計画公社（SERVIU）の承認を得ている必要がある。世帯の側に立って申請を助言するのは農村管理事業体で、その地域で認定された事業体は地方の SERVIU または SEREMI に問い合わせて知る手順になっている（Diario Concepción 2020年10月22日）。\n\n**2022年に位置づけが変わっている。** CNN Chile（2024年1月4日）は World Habitat のサイトを引いて、2022年にチリ政府が緊急住宅計画を発表し、2025年12月までに26万戸をつくる目標を置いたこと、本プログラムがその一部に置かれたことを伝えている。Colegio de Arquitectos de Chile（2024年1月4日）も、本プログラムを緊急住宅計画の行動線の一つと書いている。\n\n**なお2020年10月22日の Diario Concepción の記事は、署名欄に「Comunicado de Prensa（報道発表）」と記されている。** 発表そのものに由来する記事である。","いくらかかったか":"**世帯の側の負担**：最低自己貯蓄は1.5 UF（4万3,000ペソ）からで、工事の規模によって変わる。60歳以上には貯蓄を求めない（Diario Concepción 2020年10月22日）。\n\n**公費の側**：Colegio de Arquitectos de Chile（2024年1月4日）は、2024年予算法で本プログラムに2億9,000万ドルを充てる見込みだと書いている。地方単位では、2020年の公募でビオビオ州に43億ペソを充てると発表された（Diario Concepción 2020年10月22日）。\n\n**この2020年の記事は、見出しと本文で額が食い違っている。** 見出しは「40億ペソ」、本文は「43億ペソ」である。出典の記述の不整合としてそのまま並べておく。\n\n**1戸あたりの単価は、参照した5本のどこにも書かれていない。** 総額と戸数から割り戻すことはしない。","真似するなら最低何が必要か":"この制度で真似できる単位は、農村の家そのものではなく、**誰を対象に入れ、誰に申請を代行させ、何に加点するかの決め方**である。\n\n第一に、**対象を人口で線引きし、その根拠となる統計を指定する**こと。本制度は人口5,000人以上の都市集落を外している。2020年の公募では、この判定に2002年の人口・住宅センサスの人口データを使うと明記されていた（Diario Concepción 2020年10月22日）。**どの年のどの統計で線を引くかまで書かないと、対象は決まらない。**\n\n第二に、**申請を代行する中間組織を制度の中に置く**こと。本制度では農村管理事業体が助言を担い、世帯は個人でも共同でも申請できる。**認定された事業体の一覧を、地方の窓口が持っている。**\n\n第三に、**新築と改修を同じ制度に入れる**こと。INVItro（2018年9月26日）は、農村の住宅が屋外の菜園・納屋・厩舎・井戸・薪を使う広い台所などを日常的に使う点を挙げ、別制度である家族資産保護プログラム（政令第255号）では増築の対象が浴室・台所・居間・食堂・洗い場に限られるため農村の使い方と合わない、と書いている。**改修を別制度に切り出すと、対象になる部屋の種類で落ちる。**\n\n第四に、**対象者ごとに要件を外す枠を用意する**こと。60歳以上には自己貯蓄を求めない扱いが置かれている。\n\n第五に、**加点で誘導する**こと。2020年の公募では、設計済みで申請する場合に加点があり、上水・下水・電気の基礎工事、および太陽熱・太陽光・風力などの省エネ・節水設備の工事にも加点があった。\n\n第六に、**加点方式の副作用を見ておく**こと。INVItro（2018年9月26日）は、マウレ州を国内で2番目に農村人口比の高い州（2017年の統計で32.05%）として取り上げたうえで、都市や幹線道路に近い農村コミューンが加点で不利になる例にサンラファエルを挙げている。行政区の54.63%が農村（2002年センサス）でありながら、州の水準では本制度への申請を勧められなかったと書いている。**線引きの外にいるのではなく、線引きの内側にいながら順位で落ちる世帯が出る。**","今どうなっているか":"**2026年8月時点で確認できたのは、2025年10月26日の記事までである。**\n\n**目標戸数の達成が2025年10月に発表された。** Diario Concepción（2025年10月26日）によれば、住宅都市計画大臣カルロス・モンテスは、この政権期に本プログラムで8,659戸を引き渡しまたは完了したと述べた。当初目標は8,215戸で、その105%にあたる。**さらに6,307戸が建設中で、2026年3月までに約1万戸を終える見込みだとされる。** 同じ日、モンテス大臣は2025年の先住民特別公募の補助219件を世帯に手渡している。モンテス大臣は「この制度の目標は100%達成された」と述べたうえで、この制度は進めるのに苦労してきたとも述べている。\n\n**受賞時に示されていた規模は2万人超である。** CNN Chile（2024年1月4日）は MINVU 自身の発信を引いて、制度の開始以来2万人を超える人の暮らしが改善したとしている。Colegio de Arquitectos de Chile（同日）は、その時点までに2万人を超える人が住宅の建設または改修で対象になったと書いている。**この2本は同じ受賞を扱っており、独立した一次情報の本数としては1本に数えた。** ただし Colegio de Arquitectos の記事には、World Habitat の最高経営責任者デビッド・アイルランドの発言や、同会会長ベアトリス・ブッチカルディが大臣に祝いの書簡を送ったことなど、CNN Chile に無い記述がある。\n\n**2018年の指摘に対する当事者の反論は確認できなかった。** INVItro（2018年9月26日）は本制度について、中央からの提案であり「都市の目で見られたもの」だと書き、参加型で地域ごとに差をつけた政策への転換が要ると続けている。参照した5本の中に、MINVU がこの指摘に応じた記述は無い。**ただし2024年以降の記事では、制度の説明が変わっている。** CNN Chile（2024年1月4日）は領域的・先住民的な適合性の基準と、収入を生む生産用の区画をつくることに触れ、Diario Concepción（2025年10月26日）は孤立の度合い・生業・文化的な帰属・太陽光パネルや太陽熱集熱器といった設備を制度が考慮すると書いている。**これが2018年の指摘への応答なのかどうかは、参照した出典からは判断できない。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"2億9,000万ドル","currency":"USD","value":290000000,"jpy":46145404650}],"sample":false},{"id":"cl-0002","name":"荒れた地区と国が「地区の契約」を結び、住民が決めた事業を国が実行する形にした","name_local":"Programa Quiero Mi Barrio","name_variants":["Programa de Recuperación de Barrios","PQMB"],"country":"チリ","region":"全国（チリ全土）","municipality":"全国の地区（出典に出る例はサンティアゴのウニダ・ベシナル・ポルターレス、サンタ・アドリアナ、ラス・ビニータスと、バルパライソのプエルタス・ネグラス）","population_current":null,"population_scale":"不明","purpose":"住民が決める","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2006,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"住宅都市計画省（MINVU）。Bitácora Urbano Territorial（2021年）によれば、MINVU が2006年から全国570地区に入っている。規則は2007年の政令第14号で定められた（同）","component_types":"hybrid","components":["荒れた地区を国が選んで入る","地区の契約を住民と結ぶ","物理と社会の両方を同時にやる","3つの段階に分けて進める","公募で対象の市町村を選ぶ"],"sources":[{"url":"http://revistas.unne.edu.ar/index.php/crn/article/view/935","title":"Unidad vecinal portales, población Santa Adriana, barrio las Viñitas. Tres miradas de intervención urbana: estrategias comparadas de recuperación urbana en tres barrios críticos de Santiago de Chile","outlet":"Cuaderno Urbano","published":"2009-11-17","language":"es","from_operator":true,"source_type":"academic","abstract_only":true},{"url":"http://revistainvi.uchile.cl/index.php/INVI/article/view/1520","title":"Genealogía del primer programa chileno de recuperación de barrios vulnerables \"Quiero mi Barrio\" en su primera generación 2006-2010","outlet":"Revista INVI","published":"2019-08-12","language":"es","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://www.revistareder.com/ojs/index.php/reder/article/view/35","title":"Participación y Gestión del Riesgo de Desastre: Experiencia de Puertas Negras en Valparaíso, Chile","outlet":"Revista REDER","published":"2019-08-13","language":"es","source_type":"academic","abstract_only":true},{"url":"http://revistainvi.uchile.cl/index.php/INVI/article/view/1766","title":"Regeneración urbana y gestión del riesgo en Chile: análisis comparativo de casos","outlet":"Revista INVI","published":"2020-11-10","language":"es","from_operator":true,"source_type":"academic","abstract_only":true},{"url":"http://www.scielo.org.co/scielo.php?script=sci_arttext&pid=S0124-79132021000200283","title":"Programa Quiero mi Barrio IM como dispositivo de afectación sensible","outlet":"Bitácora Urbano Territorial 31(2)","published":"2021-09-27","language":"es","from_operator":false,"source_type":"academic"},{"url":"https://www.diarioconcepcion.cl/ciudad/2025/04/04/cinco-comunas-del-biobio-podran-adjudicarse-el-programa-quiero-mi-barrio-2025-conoce-quienes-pueden-postular.html","title":"Cinco comunas del Biobío podrán adjudicarse el programa Quiero Mi Barrio 2025: conoce quiénes pueden postular","outlet":"Diario Concepción","published":"2025-04-04","language":"es","from_operator":false}],"context_sources":[],"unknown_fields":["population_current","population_scale","funding_scale"],"discrepancies":[{"field":"制度の始まりの年と、規則が定められた年","values":[{"value":"2006年からチリで実施されている事業だと書いている","source_url":"http://revistas.unne.edu.ar/index.php/crn/article/view/935","published":"2009-11-17"},{"value":"2006年から全国570地区に入っているとしつつ、目的の規定は2007年の政令第14号から引いている","source_url":"http://www.scielo.org.co/scielo.php?script=sci_arttext&pid=S0124-79132021000200283","published":"2021-09-27"}]}],"latest_source_year":2025,"elapsed_years":19,"follow_up":"濃い","follow_up_note":"2006年に始まり、2007年の政令第14号で規則化された。2021年の論文は全国570地区に入ったとし、2025年4月にはビオビオ州で5つの市町村を選ぶ公募が開かれている。","timeline":[{"year":2006,"event":"チリ全土で始まったと、2009年の論文が書いている","source_url":"http://revistas.unne.edu.ar/index.php/crn/article/view/935"},{"year":2007,"event":"4月12日の政令第14号で規則が定められたと、2021年の論文が引いている","source_url":"http://www.scielo.org.co/scielo.php?script=sci_arttext&pid=S0124-79132021000200283"},{"year":2009,"event":"11月、サンティアゴの3地区を比べた論文が、同じ型で入ったが地区ごとに柔軟にせざるを得なかったと述べた","source_url":"http://revistas.unne.edu.ar/index.php/crn/article/view/935"},{"year":2019,"event":"8月、制度の成り立ちを追った論文が、その組み立ては合理的な計画によるものではないと述べた","source_url":"http://revistainvi.uchile.cl/index.php/INVI/article/view/1520"},{"year":2019,"event":"8月、バルパライソのプエルタス・ネグラスを見た論文が、実行の遅れが住民との信頼との間に溝を生むと述べた","source_url":"https://www.revistareder.com/ojs/index.php/reder/article/view/35"},{"year":2021,"event":"9月、事業は既にある共同体に働きかけているのではなく共同体そのものを形づくっていると述べる論文が出た","source_url":"http://www.scielo.org.co/scielo.php?script=sci_arttext&pid=S0124-79132021000200283"},{"year":2025,"event":"4月、ビオビオ州で条件を満たす12の市町村から5つを選ぶ公募が開かれたと報じられた","source_url":"https://www.diarioconcepcion.cl/ciudad/2025/04/04/cinco-comunas-del-biobio-podran-adjudicarse-el-programa-quiero-mi-barrio-2025-conoce-quienes-pueden-postular.html"}],"last_verified":"2026-08-19","image":{"url":"https://assets.diarioconcepcion.cl/2025/04/Quiero-Mi-Barrio.jpeg","type":"photo","relevance_confirmed":true,"credit":"Diario Concepción","source_url":"https://www.diarioconcepcion.cl/ciudad/2025/04/04/cinco-comunas-del-biobio-podran-adjudicarse-el-programa-quiero-mi-barrio-2025-conoce-quienes-pueden-postular.html"},"sections":{"何をしたか":"チリで、**物理的な傷みと社会的な分断の両方を抱えるとされた地区を国が選び、そこに入って住民と「地区の契約（contrato de barrio）」を結ぶ**仕組み。\n\nCuaderno Urbano（2009年11月17日）に載った論文の抄録によれば、この事業は**物理と社会という二重の次元から、包括性・参加・持続性に重きを置く介入の型**を持ち、**3つの段階**に分けて進められる。\n\nBitácora Urbano Territorial（2021年9月27日）に載った論文によれば、MINVU は2006年から**全国570地区**に入っており、いずれも**物理的な劣化と社会的な分断を示す**地区とされている。同論文は、事業の目的の規定を2007年の政令第14号から引いており、具体的な目標は3つあると書いている。","誰が始めたか":"**住宅都市計画省（MINVU）である。** Bitácora Urbano Territorial（2021年9月27日）は、これを MINVU の事業として記述している。\n\n**始まりの年と規則の年がずれている。** Cuaderno Urbano（2009年11月17日）は「2006年からチリで実施されている」と書き、Diario Concepción（2025年4月4日）も「2006年の創設以来」と書いている。一方で Bitácora（2021年9月27日）が目的の規定を引くのは**2007年の政令第14号**である。`discrepancies` に並置した。\n\n**制度の作られ方そのものを主題にした論文がある。** Revista INVI（2019年8月12日）に載った論文の抄録は、政治的な胚胎・社会的統合という考えの形成・地区の契約という型の採用という3つの出来事を扱い、**この事業の組み立ては合理的な計画によるものではなく、利害・価値・表象に影響された集合的な行動の過程だと述べている。** 同抄録は、先行研究には影響評価・満足度調査・制度分析・参加の分析が多い一方で、**その成立と組み立てを掘り下げた研究は無いとも述べている。**\n\n**当事者が書いた出典が2本ある。** Revista INVI（2020年11月10日）の共著者の一人は、著者略歴によれば **MINVU で「地区再生プログラム」の都市分野の全国担当者**である。Cuaderno Urbano（2009年11月17日）の著者は、著者略歴によれば**執筆の時点で首都圏の Barrios Críticos 3地区（抄録では alta criticidad と書かれている）の取りまとめ役**である。**どちらも `from_operator: true` として扱った。**","いくらかかったか":"**金額は、取得できた6本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**分かるのは選び方である。** Diario Concepción（2025年4月4日）によれば、2025年の公募で応募できる市町村の条件は、**人口9,000人超であること、社会家庭登録で下位40%に入る世帯が45%以上あること、多次元貧困指数が16%以上であること**の3つである。同記事によれば、ビオビオ州で条件を満たすのは12の市町村で、**そのうち5つが選ばれる。** 受付は2025年3月27日から5月12日までで、確定は同年7月18日とされている。","真似するなら最低何が必要か":"第一に、**入る地区を数字で選ぶ**こと。Diario Concepción（2025年4月4日）が挙げる3つの条件は、人口・世帯の脆弱さ・多次元貧困指数のいずれも既存の統計から機械的に判定できる。**選定の理由を後から説明できる形になっている。**\n\n第二に、**物理と社会を同時に扱う**こと。Cuaderno Urbano（2009年11月17日）の抄録は、この事業の型を**物理と社会の二重の次元**から包括性・参加・持続性に重きを置くものだと書いている。\n\n第三に、**段階を分ける**こと。同抄録によれば、進め方は3つの段階に分かれている。\n\n第四に、**同じ型のままでは回らないことを見込んでおく**こと。同論文はサンティアゴの3地区を比べ、**それぞれの成り立ちの違いが、介入の型を柔軟にし個別化する必要を決めていると述べている。**\n\n第五に、**実行の速さを、住民との信頼と同じ問題として扱う**こと。Revista REDER（2019年8月13日）の抄録は、**国の側の制度の動きが介入の実行に遅れを生みやすく、それが住民との間に築いた信頼と、実際に形になる時期との間に溝を作ると述べている。**\n\n第六に、**「地区」という単位を自分たちが作っていることを自覚する**こと。Bitácora（2021年9月27日）の論文は、この事業が**既にある共同体に働きかけているのではなく、多様で再帰的な介入を通じて共同体そのものを形づくっていると述べている。**","今どうなっているか":"**2026年8月時点で確認できたのは、2025年4月4日の記事までである。**\n\n**続いている。** Diario Concepción（2025年4月4日）によれば、MINVU は2025年の公募を開き、ビオビオ州では条件を満たす12の市町村から5つが選ばれる。同記事は、この事業を2006年の創設以来チリ各地の都市部の再生の手立てになってきたものとして紹介している。**この記事は掲載日より後の日程（5月12日の締切、7月18日の確定）を伝えており、その部分は予定として書かれている。**\n\n**取得できたのは、6本のうち5本が抄録までである。** 全文が取れたのは Bitácora（2021年9月27日）の1本だけで、Revista INVI と Cuaderno Urbano は掲載ページに抄録・著者略歴・参考文献しか無く、Revista REDER には著者略歴の節も無い。**そのため、批判の中身も抄録の範囲でしか確かめられていない。**\n\n**指摘は3本から出ている。** 実行の遅れと信頼の溝（Revista REDER 2019年8月13日）、組み立てが合理的な計画によるものではないこと（Revista INVI 2019年8月12日）、共同体を形づくってしまっていること（Bitácora 2021年9月27日）である。\n\n**これらに正面から答えた記述は、参照した6本の中には無い。** 当事者側の出典である Revista INVI（2020年11月10日）の抄録は、**この事業が地区と共同体の安全に効果的かつ効率的に寄与したとし、住民参加と統治の過程の強化を促したと結論している**が、**これは実行の遅れや組み立ての批判に答えたものではない。** 論点が別である。\n\n**REDER の論文は、著者の所属を確かめられなかった。** 掲載ページに著者略歴の節が無く、本文PDFも取得できなかったため、`from_operator` を判定せずに空欄のままにした。**同論文の抄録は、その地域の事業の担当者たちと共同体の経験にもとづく研究だと書いている。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"co-0001","name":"斜面の集落に、地下鉄と同じ運賃でつながるロープウェイを通した","name_local":"Metrocable de Medellín","name_variants":["Metrocable"],"country":"コロンビア","region":"アンティオキア県","municipality":"メデジン（北東部コムーナ1ほか）","population_current":2370000,"population_scale":"25万超","purpose":"歩けるようにする","theme":"交通・道路・駅","start_year":2004,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"Metro de Medellín（市などが出資する公共交通事業者）","component_types":"hard","components":["斜面の集落に索道を通した","既存の地下鉄と乗り継げるようにした","同じ運賃カードで乗れるようにした","路線を段階的に5本まで増やした"],"single_outlet":true,"sources":[{"url":"https://www.elcolombiano.com/antioquia/en-medellin-ya-opera-la-quinta-linea-de-metrocable-MC10308747","title":"En Medellín ya opera la quinta línea de metrocable","outlet":"El Colombiano","published":"2019-03-01","language":"es","from_operator":false},{"url":"https://www.elcolombiano.com/medellin/accidente-metrocable-medellin-hipotesis-causas-que-paso-metrocable-NI24863385","title":"¿Qué fue lo que provocó la tragedia del metrocable en la nororienta mage":{"url":"https://estaticos.elcolombiano.com/binrepository/1280x871/0c76/1280d720/none/11101/MWQN/comuna-nororiental-de-medellin-m_49046045_20251020101155.jpg","type":"photo","relevance_confirmed":true,"credit":"El Colombiano","source_url":"https://www.elcolombiano.com/medellin/metrocable-santo-domingo-mantenimiento-octubre-2025-GD30116167"},"sections":{"何をしたか":"メデジン北東部の斜面に広がる集落へ、既存の地下鉄とつながるロープウェイを通した。エル・コロンビアーノによれば、最初の K線（サント・ドミンゴ）が動き始めたのは2004年で、2019年に5本目の路線が開業した時点で、市の索道全体が2004年以来1億4,450万人を運んでいる。2019年に開いた新線は、両方向あわせて毎時5,000人を運べるとされた。**特徴は、観光用の乗り物ではなく地下鉄と地続きの日常の足として作られていること**で、2024年の記事は、利用者が給料をシビカ（Cívica）カードに積んで通勤に使っていることに触れ、事故時の振替輸送でも追加の負担を生じさせないと事業者が説明したと書いている。","誰が始めたか":"運行しているのは Metro de Medellín である。2024年の事故の報道では、同社の総支配人 Tomás Elejalde が事故の説明を行っており、意思決定と説明の主体がこの事業者にあることが分かる。**行政が作って公共交通事業者が運ぶ形**であり、住民組織や民間事業者が前面に出る事例ではない。\n\n出典からは、計画の立案者、路線の選定理由、住民との合意形成の経緯は確認できない。","いくらかかったか":"**路線ごとの建設費は確認できなかった。** 出典に出てくる金額は1つで、エル・コロンビアーノ（2019年3月1日）が、フランス開発庁（AFD）の都市開発事業責任者 Natalia Cárdenas 氏の言葉として、**2012年に調印された2億5,000万ドルの融資**を伝えている。ただしこれは**アヤクーチョのトラムと索道H線・M線をまとめた額**であり、路線ごとの内訳は書かれていない。運賃収入に触れた記述も無い。したがって `funding_scale` は `unknown_fields` に挙げている。\n\n金額の代わりに分かるのは運賃の扱いである。2024年の記事は、事故による振替輸送について、Metro de Medellín が**利用者に追加の費用を生じさせないと明言した**と伝えている。同じシビカカードで乗り継げること自体が、この仕組みの設計の一部になっている。","真似するなら最低何が必要か":"出典から読み取れる条件は4つある。\n\n1. **つなぐ先の幹線があること。** メデジンの索道は単独の乗り物ではなく、既存の地下鉄に接続する支線として作られている。つなぐ先がなければ「日常の足」にならない\n2. **運賃を一体にすること。** 同じカードで乗り継げる設計になっている。乗り換えのたびに払う形では通勤には使われない\n3. **段階的に増やす前提。** 2004年の1本から2019年に5本へと、15年かけて増えている\n4. **定期保守を止めて行う体制。** 2025年10月の記事は、支曳索への作業のために路線を数日止めると伝えている。**止められる前提で路線網を組む必要がある**\n\n**確認できない**のは、建設費、用地の扱い、路線の選定と住民合意の経緯である。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2025年10月20日のエル・コロンビアーノの記事で、サント・ドミンゴのロープウェイが定期保守のため運休すると伝えている。同記事は、その保守で支曳索への作業が行われるとし、これを運行の安全と継続を支える技術的な保守の要だと書いている。**事業は続いている。**\n\nただし2024年6月27日には重大な事故が起きている。午前4時半ごろ、サント・ドミンゴから下ってきた車両がポプラル駅を発車中の車両に衝突し、索から外れて駅前広場に落下、1人が死亡した。K線は2週間ほど止まると報じられた。同紙は、この索道について、**20年の運行のあいだ事故を一度も記録していなかった県内で唯一の交通機関**だったと書いている。\n\n**当事者の説明も報じられている。** 総支配人の Tomás Elejalde は、原因についてどの仮説も排除できないとしたうえで、ポプラル駅の2台の車両に限って起きた個別の事象であり、システム全体の故障ではないと述べ、専門家の一団が解明にあたるとした。事故の原因についてその後の結論を報じた記事は、今回探した範囲では見つからなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"2億5,000万ドル","currency":"USD","value":250000000,"jpy":39780521250}],"sample":false},{"id":"co-0002","name":"丘の斜面の貧しい地区に図書館と広場をまとめた施設を建て、市の図書館網につないだ","name_local":"Parques Biblioteca","name_variants":["parques biblioteca de Medellín"],"country":"コロンビア","region":"アンティオキア県","municipality":"メデジン市","population_current":2370000,"population_scale":"25万超","purpose":"誇りをつくる","theme":"学校・公共施設","start_year":2006,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"メデジン市。最初の1館は2006年12月31日に当時の市長セルヒオ・ファハルドが開いた","component_types":"hard","components":["丘の斜面の地区に建てた","図書館と広場を1つにした","市の図書館網に組み入れた","講座や上映を常時開いた","相談の窓口を後から足した"],"single_outlet":true,"sources":[{"url":"https://www.elcolombiano.com/cultura/10-anos-de-cultura-en-cada-rincon-de-medellin-BA5736157","title":"10 años de los parques biblioteca","outlet":"El Colombiano","published":"2017-01-11","language":"es","from_operator":false},{"url":"https://www.elcolombiano.com/antioquia/parques-biblioteca-en-medellin-mas-cultura-que-edificios-AA6938673","title":"Parques biblioteca en Medellín, más cultura que edificios","outlet":"El Colombiano","published":"2017-07-19","language":"es","from_operator":false},{"url":"https://www.elcolombiano.com/cultura/26-bibliotecas-publicas-de-medellin-abren-al-publico-GN13786426","title":"26 bibliotecas públicas de Medellín abren al público","outlet":"El Colombiano","published":"2020-10-06","language":"es","from_operator":false},{"url":"https://www.elcolombiano.com/generacion/edicion-del-mes/bibliotecas-de-medellin-una-red-de-cultura-a-piel-de-barrio-AA24246251","title":"Bibliotecas de Medellín: una red de cultura a piel de barrio","outlet":"El Colombiano","published":"2024-04-14","language":"es","from_operator":false},{"url":"h
