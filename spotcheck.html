方","values":[{"value":"bi-monthly の大衆スポーツの運動だと書いている。回数を数える形では書いていない","source_url":"https://www.newtimes.co.rw/news/hundreds-throng-kigali-streets-car-free-day-returns","published":"2020-09-20"},{"value":"同じ記事の中に3つの書き方がある。2016年にキガリで始まった bi-monthly の催しだとする箇所、毎月第1・第3日曜だとする箇所、そしてある専門家の研究の紹介として年に26回だとする箇所","source_url":"https://www.ktpress.rw/2024/11/car-free-day-rwandans-urged-to-embrace-healthy-active-lifestyles/","published":"2024-11-03"},{"value":"月に1回の催しだと書いている","source_url":"https://www.ktpress.rw/2024/11/the-beauty-of-kigali-car-free-day-and-room-for-improvement/","published":"2024-11-04"},{"value":"2016年に月1回として始まり2018年に隔週になったとし、いまは毎月第1・第3日曜だと書いている","source_url":"https://www.frontiersin.org/journals/future-transportation/articles/10.3389/ffutr.2026.1857164/full","published":"2026-05-28"}]},{"field":"車を止める時間帯","values":[{"value":"記事の地の文で、毎月第1・第3日曜の7時から10時までとしている","source_url":"https://www.ktpress.rw/2024/11/car-free-day-rwandans-urged-to-embrace-healthy-active-lifestyles/","published":"2024-11-03"},{"value":"参加を呼びかける携帯電話の案内も7時から10時までとしている","source_url":"https://www.ktpress.rw/2024/11/the-beauty-of-kigali-car-free-day-and-room-for-improvement/","published":"2024-11-04"},{"value":"毎月第1・第3日曜の朝7時から11時まで、一部の道路で自動車が制限されると書いている","source_url":"https://www.frontiersin.org/journals/future-transportation/articles/10.3389/ffutr.2026.1857164/full","published":"2026-05-28"}]}],"latest_source_year":2026,"elapsed_years":10,"follow_up":"濃い","follow_up_note":"2016年にキガリで月1回として始まり、2018年に隔週になったと2026年の論文が書いている。2020年3月に感染症で止まり、同年9月20日に再開した。同論文は2022年から2024年の連続測定でPM2.5が下がったと報告している。","timeline":[{"year":2016,"event":"キガリで始まったと、2024年の記事が書いている","source_url":"https://www.ktpress.rw/2024/11/car-free-day-rwandans-urged-to-embrace-healthy-active-lifestyles/"},{"year":2018,"event":"月1回から隔週になったと、2026年の論文が書いている","source_url":"https://www.frontiersin.org/journals/future-transportation/articles/10.3389/ffutr.2026.1857164/full"},{"year":2020,"event":"3月に感染症の広がりを抑えるため止まり、9月20日に再開したと報じられた。集まりと自由参加の検診はこの回では禁じられた","source_url":"https://www.newtimes.co.rw/news/hundreds-throng-kigali-streets-car-free-day-returns"},{"year":2024,"event":"11月3日の回に保健大臣が出て、運動の習慣を呼びかけたと報じられた","source_url":"https://www.ktpress.rw/2024/11/car-free-day-rwandans-urged-to-embrace-healthy-active-lifestyles/"},{"year":2024,"event":"11月4日、走った記者が、経路に公衆便所が無いことを改善点として挙げた","source_url":"https://www.ktpress.rw/2024/11/the-beauty-of-kigali-car-free-day-and-room-for-improvement/"},{"year":2026,"event":"5月28日、2022年から2024年の2地点の連続測定にもとづく論文が出て、実施日の午前のPM2.5がふつうの日曜より14.8%低く、午後も低いままだったと報告した","source_url":"https://www.frontiersin.org/journals/future-transportation/articles/10.3389/ffutr.2026.1857164/full"}],"last_verified":"2026-08-19","sections":{"何をしたか":"ルワンダの首都キガリで、**日曜の朝の数時間だけ主要な道路から車を締め出し、その道をそのまま歩く・走る・自転車に乗るための場にする**取り組み。\n\nFrontiers in Future Transportation（2026年5月28日）に載った論文によれば、**毎月第1・第3日曜に、一部の道路で自動車の通行が制限される。** 狙いは体を動かすことを促すことと、大気の汚れを減らすことだと同論文は書いている。**時間帯は同論文が7時から11時、KT Press（2024年11月3日）が7時から10時と書いており、食い違っている**（`discrepancies`）。\n\n**出典はこの催しを単に「Car Free Day」と呼ぶ。** The New Times（2020年9月20日）も KT Press（2024年11月3日）も固有名詞として大文字で書き、Frontiers の論文は「Car-Free Days」と綴る。**「Kigali Car Free Day」という続けた形は、参照した4本の本文には無い**（KT Press 2024年11月4日は「Kigali's Car Free Day」と書いている）。\n\n**新しい道をつくっていない。** KT Press（2024年11月4日）に載った記事によれば、参加を呼びかける携帯電話の案内には**ふだんの道路を使う**と書かれている。同記事によれば、その日の街路では太鼓に合わせた踊りが行われ、何百人もが体操に加わっていた。\n\n**健康の検診と組み合わせている。** The New Times（2020年9月20日）は、ふだんは行われている**自由参加の医療検査**が、感染症の対策のためこの回では禁じられたと書いている。","誰が始めたか":"**市と国の省庁である。** KT Press（2024年11月3日）は、この催しが**2016年にキガリで始まり、国内の他の地域にも広がった**と書いている。Frontiers in Future Transportation（2026年5月28日）の論文は、**2016年に月1回の催しとして始まり、うまくいったため2018年に隔週になった**と書いている。KT Press の同記事によれば、2024年11月3日の回には保健大臣サビン・ンサンジマナ氏のほか、内閣担当大臣イネス・ムパンバラ氏、緊急事態管理担当大臣アルベール・ムラシラ氏、キガリ市助言評議会議長クリスチャン・カジェネリ氏、市長サミュエル・ドゥセンギユンバ氏が出ている。\n\n**運営に関わる省庁は1つではない。** The New Times（2020年9月20日）によれば、2020年の再開は**スポーツ省の告知**にもとづくもので、その回にはスポーツ大臣オーロール・ミモザ・ムニャンガジュ氏と当時の市長プルデンス・ルビンギサ氏が参加した。**KT Press が伝える2024年の回では、呼びかけているのは保健大臣である。**\n\n**目的として名指しされているのは非感染性疾患である。** KT Press（2024年11月3日）は、この呼びかけが、多くの人に影響し国の医療の負担になっている非感染性疾患（NCDs）を受けてのものだと書いている。同記事によれば、ンサンジマナ氏は交流サイトの X で、週3回以上・1回30分を超える運動と、1日2リットル以上の水を勧めている。","いくらかかったか":"**金額は、参照した4本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**費用の形は、書かれている中身から読み取れる。** Frontiers in Future Transportation（2026年5月28日）の論文は、この仕組みを**費用の安い（low-cost）持続可能な方策**と位置づけ、**大気の汚れを減らすための高価な手立てが不足している地域で意味を持ちうる**と述べている。KT Press（2024年11月4日）の記事によれば、使うのはふだんの道路である。","真似するなら最低何が必要か":"第一に、**新しい道路をつくらずに始める**こと。KT Press（2024年11月4日）によれば、案内は「ふだんの道路を使う」と伝えている。**用意するのは通行の制限と、その周知である。**\n\n第二に、**日を決めて繰り返す**こと。KT Press（2024年11月3日）によれば、この催しは2016年に始まり、国内の他の地域にも広がった。**ただし頻度の書かれ方は出典で割れている**（`discrepancies`）。\n\n第三に、**健康の検診と組み合わせる**こと。The New Times（2020年9月20日）は、ふだんは自由参加の医療検査が行われていることを、それが禁じられた回の記述として書いている。KT Press（2024年11月3日）によれば、呼びかけの理由として名指しされているのは非感染性疾患である。\n\n第四に、**大臣と市長が自分で参加する**こと。上の2本は、いずれも大臣と市長が参加者の中にいたことを伝えている。\n\n第五に、**経路に沿った設備を先に考えておく**こと。**この事業では、そこが2024年に指摘として出た**（次節）。\n\n第六に、**効果を測る仕組みを持っておく**こと。Frontiers in Future Transportation（2026年5月28日）の論文によれば、それまでキガリの効果を測った研究は**1地点での短期間の安価なPM2.5の測定に頼っており、実施後の揺り戻しを見ていなかった。**","今どうなっているか":"**2026年8月時点で確認できたのは、2026年5月28日の論文までである。**\n\n**感染症で一度止まり、再開している。** The New Times（2020年9月20日）は、この催しが2020年3月に感染症の広がりを抑えるために止められ、**6か月の間をおいて9月20日に再開した**と報じている。同記事によれば、その回では人と人との1メートルの距離が守られ、**各所に人が集まることと自由参加の医療検査は禁じられていた。** 同記事によれば、**参加者の一部は**アマホロ国立競技場からルワンダ歳入庁の本部へ向かい、ギシュシュ、キガリ・ビジネス・センター、オンブズマン事務所を通った。\n\n**改善点が当事者以外から挙がっている。** KT Press（2024年11月4日）の記事は、その日に30キロを走った書き手が書いたもので、**経路に公衆便所が無いことを大きな課題として挙げている。** **この記事は「Voices」の欄に載っており、書き手自身の見方が入る。**\n\n**効果の測定は2026年に一段進んだ。** Frontiers in Future Transportation（2026年5月28日）の論文は、**2022年から2024年に2地点で集めた連続的な大気の質のデータ**を使い、実施日の日曜とふつうの日曜を比べている。同論文によれば、**PM2.5 は実施時間中（7時から11時）にふつうの日曜より14.8%低く、実施後の時間帯（11時から21時）も低いままで、揺り戻しは見られなかった。** ただし**2つの数字は数える範囲が違う。** 同論文の表によれば、14.8%は「実施日の午前」対「ふつうの日曜の午前」、抄録が挙げる34.7%は**同じ実施日の中での「午前」対「午後」**である。ふつうの日曜の午後との比較は別の数（26.81 対 33.28 μg/m³）として示されている。 一方でオゾンは**実施時間中に有意な差が無く**（同論文の表では実施日のほうが4.6%高いが p は0.4439である）、午後に上がっており、**これは車の排出そのものではなく光化学的な生成と整合すると同論文は述べている。**\n\n**回数の呼び方と時間帯は、出典によって書かれ方が違う。** KT Press（2024年11月3日）と Frontiers（2026年5月28日）は、どちらも**毎月第1・第3日曜**と書いている。一方で KT Press（2024年11月4日）は月に1回の催しだと書き、The New Times（2020年9月20日）と KT Press（2024年11月3日）は `bi-monthly` という語を使っている。**この英語は「月2回」とも「2か月に1回」とも読めるので、訳さずに並置した。** さらに KT Press（2024年11月3日）は、同じ記事の中である専門家の研究の紹介として「年に26回」とも書いている。時間帯も7時から10時（KT Press の2本）と7時から11時（Frontiers）で割れている。**いずれも `discrepancies` に並置した。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"si-0001","name":"製糖工場の廃水池の所有者になった鳥の団体が、そこを自然保護区にした。使い終えた船のコンテナが観察小屋で、水牛が草を食べて管理する","name_local":"Naravni rezervat Ormoške lagune","name_variants":["Ormoške lagune","Ormoških lagun","Naravnega rezervata Ormoške lagune"],"country":"スロベニア","region":"ポドラウスカ統計地域（podravska statistična regija）","municipality":"オルモジュ自治体（Občina Ormož）","population_current":11840,"population_scale":"5万人未満","purpose":"空間をひらく","theme":"自然・緑地・水辺","start_year":2010,"end_year":null,"status_current":"継続中","actor_type":"NPO","lead_actor":"DOPPS（Društvo za opazovanje in proučevanje ptic Slovenije。スロベニアの鳥を観察し研究する団体）。自治体ではなくこの団体が区域の所有者になり、生息地の管理を行っている。2017年9月の式には、環境総局の総局長 Tanja Bolte、オルモジュ自治体の首長（župan）Alojz Sok、Tovarna sladkorja（TSO）の監督委員会の長 Hans Hogeweg、DOPPS の会長 Rudolf Tekavčič が出て、オランダ王国の大使 Bart Twaalfhoven も来たと Ptujinfo が書いている。2023年の Siol.net には、DOPPS の保護区の管理担当 Ana Vaupotič が出てくる","component_types":"hybrid","components":["廃水池に鳥の営巣島を掘ってつくる","ドラヴァ川から水を引き入れ水位を調節する","水牛を放して草と水草を食べさせる","使い終えた船のコンテナを観察小屋にする","10人を超える団体には案内を必須にする"],"sources":[{"url":"https://ptujinfo.com/novica/slovenija/naravni-rezervat-ormoske-lagune-uradno-odprt/56286","title":"Naravni rezervat Ormoške lagune uradno odprt","outlet":"Ptujinfo","published":"2017-09-13","language":"sl","from_operator":false},{"url":"https://spodnjepodravje.si/odprt-naravni-rezervat-ormoske-lagune/","title":"Odprt naravni rezervat Ormoške lagune","outlet":"Spodnje Podravje","published":"2017-09-12","language":"sl","from_operator":false},{"url":"https://siol.net/trendi/potovanja/ormoske-lagune-od-industrijskega-obmocja-do-zanimive-izletniske-tocke-613269","title":"Ormoške lagune: od industrijskega območja do zanimive izletniške točke","outlet":"Siol.net","published":"2023-08-13","language":"sl","from_operator":false},{"url":"https://www.zurnal24.si/popotnik/naravni-rezervat-ki-ocara-410829","title":"Ormoške lagune – naravni rezervat, ki očara","outlet":"Žurnal24","published":"2023-09-16","language":"sl","from_operator":false},{"url":"https://ptujinfo.com/novica/lokalno/naravni-rezervat-ormoske-lagune-se-zapira/316162","title":"Naravni rezervat Ormoške lagune se zapira","outlet":"Ptujinfo","published":"2025-10-30","language":"sl","from_operator":false}],"context_sources":[{"url":"https://www.stat.si/obcine/sl/Municip/Index/116","title":"スロベニア統計局（SURS）「Ormož - Slovenske regije in občine v številkah」（自治体の統計。本文に、2024年半ばのオルモジュ自治体の人口はおよそ11,840人で全自治体中47位、面積142平方キロ、61の集落からなる、と書いてある。掲載日は構造化された箇所にも本文にも無い）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":15,"follow_up":"濃い","follow_up_note":"2023年、保護区の管理担当は Siol.net に、個人の客の入場は無料で、10人を超える団体には案内を付けると述べている。2025年10月、Ptujinfo は、保護区が11月3日から2026年3月31日まで工事のため閉まると報じた。","timeline":[{"year":2010,"event":"2017年9月12日の Spodnje Podravje によれば、DOPPS は2010年にこの区域の所有者となり、オルモジュ製糖工場の廃水池だった区域を、自然保護・研究・教育の役割をもつ自然保護区に変えると約束した。同じ記事は、ここが55ヘクタールの人の手による湿地で、ドラヴァ川の生態系のうちオルモジュ湖のそばにあり、浅い池に葦とガマが茂り、周りを氾濫原の森が囲んでいると書いている","source_url":"https://spodnjepodravje.si/odprt-naravni-rezervat-ormoske-lagune/"},{"year":2011,"event":"2017年9月13日の Ptujinfo によれば、DOPPS は2011年に EU の LIFE+ の自然保護の資金に通り、2012年にスロベニアで最も大きい LIFE の事業の一つ「スロベニアのドラヴァ川下流部の河川生態系の再生」（略称 LIVEDRAVA）に着手した。オルモジュの廃水池の再生はその一部である","source_url":"https://ptujinfo.com/novica/slovenija/naravni-rezervat-ormoske-lagune-uradno-odprt/56286"},{"year":2017,"event":"2017年9月13日の Ptujinfo は、再生の中身をこう書いている。ドラヴァ川からの新しい流入をつくり、鳥の生息地を整えた。合わせて1万平方メートルを超える大きな営巣島を6つと、小さな島を30つくり、溝を掘った。生息地の管理は池の水位の調節と放牧からなり、13キロの牧柵を張って、記事の時点では14頭の水牛が茂りすぎを抑えている。畜舎とサービス棟を建て、森と水辺を通る1.5キロの学習路を設け、使い終えた船のコンテナ4つを鳥の観察所に変えた。うち一つには目の見えない人・見えにくい人のための触る模型がある。廃水処理施設の元の機械室は、小さな講義室を持つ保護区の事務所になった。記事は、掲載の年の5月に政府令で自然保護区に指定されたこと、9月8日の金曜に関係者が新しい時期の始まりを告げたことも書いている","source_url":"https://ptujinfo.com/novica/slovenija/naravni-rezervat-ormoske-lagune-uradno-odprt/56286"},{"year":2017,"event":"2017年9月12日の Spodnje Podravje は、先週の終わりにオルモジュでこの保護区が式とともに開かれたと書いた。テープを切って新しい時期の始まりを告げ、あわせて保護区の案内書を示した。同じ記事は、ここで水鳥の営巣が29種確認され、渡りの時期には30種が定期的に現れて、その数は数万羽に達することがあると書いている","source_url":"https://spodnjepodravje.si/odprt-naravni-rezervat-ormoske-lagune/"},{"year":2023,"event":"2023年8月13日、Siol.net（STA 配信）が、保護区が7つの池と大小の営巣島・泥地・葦原・開けた水面からなり、来る人にとっての場所にもなっていると書いた。DOPPS の保護区の管理担当 Ana Vaupotič は、池のふちに置いた使い終えた船のコンテナについて「かつての工業地帯の気配を残したかった」と述べ、水牛は管理のために入れたもので、草と水草を食べるので刈る機械が要らないと説明している。Vaupotič は、この区域に大量の観光は受け入れられないので個人の客を先に取ると述べている。記事は、入場は無料で、10人を超える団体には案内が要ると書いている","source_url":"https://siol.net/trendi/potovanja/ormoske-lagune-od-industrijskega-obmocja-do-zanimive-izletniske-tocke-613269"},{"year":2023,"event":"2023年9月16日、Žurnal24 が、この保護区をオルモジュの見どころとして取り上げた。同じ記事は、森の学習路がふたたび開いていること、地面がまだ濡れて泥が多いので長靴か適した履き物を勧めていることを書いている","source_url":"https://www.zurnal24.si/popotnik/naravni-rezervat-ki-ocara-410829"},{"year":2025,"event":"2025年10月30日、Ptujinfo が、保護区の Facebook の投稿として、11月3日から2026年3月31日まで保護区を閉めると報じた。記事によれば、閉鎖の間は再生と自然保護のための土の工事を行い、その多くは学習路の上でも進む。工事と来る人の安全のために閉鎖は避けられないとされ、2026年4月に新しくなったところを見に来てほしいと呼びかけている","source_url":"https://ptujinfo.com/novica/lokalno/naravni-rezervat-ormoske-lagune-se-zapira/316162"}],"editor_notes":"出典は4媒体5本で、掲載年は2017・2023・2025の3通りである。**ただし、独立した発表は3つしかない。** ①2017年の2本は同じ DOPPS の発表に由来する。spodnjepodravje.si は本文の締めに「Vir in foto：DOPPS」と書き、種数の段落を「so ob otvoritvi sporočili iz Društva za opazovanje in proučevanje ptic Slovenije」（開所にあたって DOPPS が伝えた）としている。ptujinfo.com との最長共通部分文字列を測ると、記号と空白を落として**207字**が一致した（「velik nacionalni in mednarodni pomen…」に始まる段落がまるごと共通）。②2023年の2本も同じ STA 配信に由来する。siol.net の署名は「N. V., Matic Prevc/STA」で写真も「Matic Prevc/STA」である。同じ2023年8月13日に net-tv.si（著者は「Net TV, uredništvo」）が同じ本文を出しているのをキャッシュで確かめたので、net-tv.si は sources に入れていない（STATE §3「同一発表に由来する記事は何本あっても1本」）。**zurnal24.si（2023年9月16日）も同じ配信の書き直しで、siol.net との最長共通部分文字列は304字あった。** 残したのは、zurnal24.si が配信に無い一文（森の学習路がふたたび開いたこと、長靴を勧めること）を足しているためだが、独立した取材ではない。③2025年の1本は、保護区の Facebook の投稿を ptujinfo.com が伝えたものである。**§3 で本数を数えるときは、2017年の2本で1本、2023年の2本で1本として数えること。** なお §3 は「代表として1本を sources に残し」と定めており、5本すべてを残したのは条文どおりではない。2本ずつが互いに持たない事実を含むため（ptujinfo にしかない工事の中身・31種・60種、spodnjepodravje にしかない55haと29種、zurnal24 にしかない学習路の再開と長靴）残したが、条文との差として記しておく。**加えて、2017年と2023年も完全には独立していない。** spodnjepodravje×siol の最長共通部分文字列は294字、spodnjepodravje×zurnal24 は296字あり、2023年の STA 配信は2017年の DOPPS 発表の種数の段落をそのまま引き継いでいる。2023年に独自取材（Vaupotič の発言）がある以上3発表と数えるが、種数の記述は1つの発表に由来する。 ／**出典自身の不整合がある。** ptujinfo.com（2025年10月30日）は小見出しで「bo zaprt do 31. marca 2025」（2025年3月31日まで閉じる）と書きながら、本文では「ob 3. novembra 2025 do 31. marca 2026 zaprt」と書いている。小見出しの側は掲載日より前の日付になるので、timeline と follow_up_note には本文の側を採った。出典間の食い違いではなく1本の中の不整合なので discrepancies には入れていない（lessons G）。／**食い違いに見えて食い違いでないものが2組ある。** 営巣の種数は ptujinfo.com が「Gnezdilk vodnih in obvodnih habitatov je 31」（水域と水辺の生息地の営巣種が31）、他の3本が「29 gnezdečih vrst vodnih ptic」（水鳥の営巣種が29）で、**数える範囲が違う。** 渡りも同じで、ptujinfo.com の「60 vrst vodnih ptic」は中継地として使う水鳥の種、他の3本の「30 vrst」は渡りの時期に定期的に現れる種である。どちらも discrepancies に並べていない（lessons BB）。**ただし確度に差がある。** 渡りは spodnjepodravje.si が「30 vrst」と「60 vrst」の**両方を1本の中に**書いており、同一記事内に併存する以上まちがいなく別の量である。営巣の31と29は、31が ptujinfo、29が他3本という分かれ方で、しかも両者は同じ2017年の DOPPS 発表に由来するため、単一出典に両方が並ぶ形にはなっていない。／**西暦の出どころ。** 2010年は spodnjepodravje.si の「DOPPS je postal lastnik območja leta 2010」から採った。ptujinfo.com は同じ事実を「leta 20010」と誤って書いており、4桁として「2010」を含まない。2011年と2012年は ptujinfo.com にある。自然保護区の指定について、ptujinfo.com は「maja letos」（今年5月＝掲載年の5月）、siol.net は「leta 2017」と書いている。**「2017年5月」は月と年を別の出典から合わせたものである。** ／溝の長さは書かなかった。ptujinfo.com の表記は「izkopanih je bilo za več 100 metrov jarkov」で、「100メートル超」とも「数百メートル」とも読めるため、境界を決めずに落とした（lessons AB-2）。／`from_operator` はすべて false にした。5本とも書き手は媒体の側であり、運営主体そのものの発信ではない（DOPPS 自身の ptice.si と lifeforseeds.si は使っていない。ptice.si が DOPPS の発信であることは、ptujinfo.com が案内書の在処として ptice.si を挙げていることで分かる）。ptujinfo.com の発行元は Moji Mediji d.o.o.、zurnal24.si は Styria Media、siol.net は TSmedia である。／`component_types` は hybrid にした。土を動かした部分（営巣島・溝・牧柵・畜舎・サービス棟・学習路・観察所）が大きい一方、生息地の管理は水位の調節と放牧という運用であり、10人を超える団体に案内を必須にする決めごとも出典にある。どちらか一方には寄せられない。／`funding_scale` は unknown_fields に入れた。5本を「evrov」「milijon」「sredstev」で grep したが、事業に関わる額は1つも出てこない。分かるのは EU の LIFE+ の資金であること（2017年の2本）と、工場の閉鎖後に EU の資金で再生を行ったこと（2023年の2本）だけである。／人口は stat.si から採った。`npm run probe -- --robots-only stat.si pxweb.stat.si` を先に回し、stat.si は robots に名指しが無く許可、pxweb.stat.si は robots.txt が503で取れなかったので取りに行っていない。","last_verified":"2026-08-20","sections":{"何をしたか":"オルモジュ製糖工場が、かつて森だった区域に掘った廃水池である。スロベニアの鳥の団体 DOPPS が2010年に所有者となり、自然保護区に変えると約束した。2011年に EU の LIFE+ に通り、2012年からドラヴァ川下流の再生事業 LIVEDRAVA の一部として工事に入った。川から水を引き入れ、合わせて1万平方メートルを超える営巣島を6つと小さな島を30つくり、13キロの牧柵を張って水牛を放した。使い終えた船のコンテナ4つを観察小屋に、廃水処理施設の機械室を事務所に変え、1.5キロの学習路を通した。55ヘクタールのこの湿地は2017年5月の政府令で自然保護区となり、同年9月に式が行われた。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"sl-0001","name":"植えた木を1本ずつ地図に登録して育て、その記録を売って次の植樹の元手にした","name_local":"#FreetownTheTreetown","name_variants":["FreetownTheTreeTown","Freetown the Treetown","Freetown the Tree Town"],"country":"シエラレオネ","region":"西部地域","municipality":"フリータウン","population_current":null,"population_scale":"不明","purpose":"お金を地域で回す","theme":"自然・緑地・水辺","start_year":2020,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"フリータウン市（Freetown City Council）。The Sierra Leone Telegraph（2021年11月14日）に転載された市長イボンヌ・アキ＝サワイヤー氏の文章によれば、この取り組みは Transform Freetown の一部として2020年1月に始まった","component_types":"hybrid","components":["斜面と海岸に苗木を植える","1本ずつ位置を記録して追う","育てた人に携帯で払う","記録を売って次の元手にする","追跡の担い手を地区に置く"],"sources":[{"url":"https://www.hvsl.org/post/from-freetown-to-treetown-can-urban-reforestation-build-environmental-resilience-in-sierra-leone","title":"From Freetown to “Treetown”: Can urban reforestation build environmental resilience in Sierra Leone?","outlet":"Hidden Voices Salone Magazine","published":"2020-08-06","language":"en","from_operator":false},{"url":"https://www.shiftcities.org/post/freetown-treetown-campaign-using-digital-tools-encourage-tree-cultivation-cities","title":"Freetown the TreeTown campaign: Using digital tools to encourage tree cultivation in cities","outlet":"UrbanShift","published":"2021-07-20","language":"en","from_operator":false},{"url":"https://www.thesierraleonetelegraph.com/mayor-aki-sawyerr-visits-freetownthetreetown-planting-locations/","title":"Mayor Aki-Sawyerr visits FreetownTheTreeTown planting locations","outlet":"The Sierra Leone Telegraph","published":"2021-11-14","language":"en","from_operator":true},{"url":"https://www.re-tv.org/articles/freetownthetreetown","title":"Freetown the Treetown","outlet":"RE:TV","published":"2024-02-14","language":"en","from_operator":false},{"url":"https://www.thesierraleonetelegraph.com/sierra-leone-parliamentarians-inspect-freetown-reforestation-efforts","title":"Sierra Leone Parliamentarians inspect Freetown reforestation efforts","outlet":"The Sierra Leone Telegraph","published":"2025-10-15","language":"en","from_operator":false}],"context_sources":[],"unknown_fields":["population_current","population_scale","funding_scale"],"discrepancies":[{"field":"100万本を植える期限","values":[{"value":"2022年までに100万本を植えて育てる計画だと書いている","source_url":"https://www.shiftcities.org/post/freetown-treetown-campaign-using-digital-tools-encourage-tree-cultivation-cities","published":"2021-07-20"},{"value":"3年かけて100万本を植え、追い、育てることを目指すと書いている","source_url":"https://www.thesierraleonetelegraph.com/mayor-aki-sawyerr-visits-freetownthetreetown-planting-locations/","published":"2021-11-14"}]}],"latest_source_year":2025,"elapsed_years":5,"follow_up":"濃い","follow_up_note":"2020年1月に Transform Freetown の一部として始まり、2020年に25万本を植えた。2021年に最初の5,000本分の記録が売れている。2025年10月には5年前に植えた木の行方を国会議員が見に行ったと報じられ、市長は回復させた区域を守り続ける必要を述べている。","timeline":[{"year":2020,"event":"1月、Transform Freetown の一部として始まったと、2021年に市長の文章が書いている","source_url":"https://www.thesierraleonetelegraph.com/mayor-aki-sawyerr-visits-freetownthetreetown-planting-locations/"},{"year":2020,"event":"8月、フリータウンの独立誌が、市の主張について研究者の留保つきの見方を載せた","source_url":"https://www.hvsl.org/post/from-freetown-to-treetown-can-urban-reforestation-build-environmental-resilience-in-sierra-leone"},{"year":2021,"event":"7月、最初の5,000本分の記録が売れ、その収入が次の5,000本の元手になると報じられた","source_url":"https://www.shiftcities.org/post/freetown-treetown-campaign-using-digital-tools-encourage-tree-cultivation-cities"},{"year":2021,"event":"11月、市長が62か所の植樹地のうち3か所を回ったと書いている","source_url":"https://www.thesierraleonetelegraph.com/mayor-aki-sawyerr-visits-freetownthetreetown-planting-locations/"},{"year":2024,"event":"2月、記録は国際的な炭素の市場を通じて資金になっていると番組の解説が書いた","source_url":"https://www.re-tv.org/articles/freetownthetreetown"},{"year":2025,"event":"10月、国会議員が5年前に植えた木の行方を見に行ったと報じられた。同記事に載った市長の談話は、回復させた区域を守り続ける必要を述べている","source_url":"https://www.thesierraleonetelegraph.com/sierra-leone-parliamentarians-inspect-freetown-reforestation-efforts"}],"last_verified":"2026-08-19","sections":{"何をしたか":"シエラレオネの首都フリータウンで、**植えた苗木を1本ずつ位置つきで記録し、育った分だけ育てた人に携帯電話で金を払い、その記録そのものを売って次の植樹の元手にする**取り組み。\n\nUrbanShift（2021年7月20日）によれば、**2022年までに100万本を植えて育て、市の緑の被覆を50%増やす計画**が置かれた。同記事によれば、**最初の段階（2020〜2021年）で25万本を植えて追跡した。**\n\n**記録が売れる形になっている。** 同記事によれば、**この事業は最初の5,000本分の「インパクト・トークン」を売り、その収入が次の段階で新たに5,000本を植えて育てる資金になる。** RE:TV（2024年2月14日）は、**この支払いが最終的には国際的な炭素の市場によってまかなわれ、生まれたトークンが気候の目標を満たそうとする企業や機関に売られると書いている。**","誰が始めたか":"**市である。** The Sierra Leone Telegraph（2021年11月14日）に転載された市長イボンヌ・アキ＝サワイヤー氏の文章によれば、この取り組みは **Transform Freetown の一部として2020年1月に始まり、3年かけて100万本を植え、追い、育てることを目指す**とされた。**この記事は市長の一人称で書かれた文章の転載であり、`from_operator: true` として扱った。**\n\n**前史がある。** Hidden Voices Salone Magazine（2020年8月6日）によれば、Transform Freetown 自体は2019年1月24日に始まっており、その1年で市内に**23,000本**が植えられた。同記事によれば、**2020年にはさらに100万本を植える計画**があった。\n\n**期限の書かれ方が出典で違う。** UrbanShift（2021年7月20日）は「2022年までに100万本」とし、市長の文章（2021年11月14日）は「3年かけて」としている。`discrepancies` に並置した。","いくらかかったか":"**事業全体の金額は、参照した5本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**分かるのは、資金の入り方と、仕事の数である。**\n\nUrbanShift（2021年7月20日）によれば、**最初の5,000本分のトークンが売れており、その収入が次の5,000本の元手になる。** 同記事は、**550を超える短期の仕事**が生まれたと書いている。The Sierra Leone Telegraph（2021年11月14日）に転載された市長の文章は、**600人の若者に緑の仕事を作っている**としている。\n\n**外部の出資者がいる。** UrbanShift（2021年7月20日）は、この取り組みが関わる事業（RUSLP）が**世界銀行と地球環境ファシリティの共同出資**であると書いている。**同記事の末尾には出所として世界銀行の名が置かれており、出資する側に近い発信である。**","真似するなら最低何が必要か":"第一に、**1本ずつ記録する道具を先に用意する**こと。UrbanShift（2021年7月20日）によれば、この事業は最初の段階で25万本を**植えたうえで追跡した。** 追跡ができていることが、その先の支払いと売却の前提になっている。\n\n第二に、**育てた人に直接払う**こと。UrbanShift（2021年7月20日）によれば、育てた人は携帯電話の送金で少額の支払いを受け取る。RE:TV（2024年2月14日）によれば、その支払いは最終的に国際的な炭素の市場によってまかなわれる。\n\n第三に、**生き残る割合の目標を先に決める**こと。The Sierra Leone Telegraph（2021年11月14日）に転載された市長の文章によれば、**この取り組みは80%という生存率の目標を置いている。**\n\n第四に、**追跡の担い手を置く**こと。UrbanShift（2021年7月20日）によれば、550を超える短期の仕事が生まれている。\n\n第五に、**植えたあとに守り続ける体制を決めておく**こと。**この事業では、5年目に市長自身が、回復させた区域を守り続ける必要を述べている**（次節）。\n\n第六に、**資金の出どころが外にあることを見込んでおく**こと。RE:TV（2024年2月14日）によれば、支払いの原資は国際的な炭素の市場である。**同記事は、近年の炭素市場をめぐる紛糾に触れたうえで、この取り組みの記録が追跡できることをその文脈に置いている。**","今どうなっているか":"**2026年8月時点で確認できたのは、2025年10月15日の記事までである。**\n\n**植えた本数は年ごとに報じられている。** The Sierra Leone Telegraph（2021年11月14日）に転載された市長の文章によれば、**2020年に25万本、2021年に24万本の樹木と低木に加えてマングローブ6万本**が植えられた。同文章によれば、**2020年の植樹の周期では95%が生き残った**とされる。**これは市長自身が書いた数字である。** UrbanShift（2021年7月20日）が書いているのは**80%という目標の側**であり、実績ではない。\n\n**5年後に国会議員が見に行っている。** The Sierra Leone Telegraph（2025年10月15日）によれば、議員が**5年前に植えた木の長い期間の影響**を見に行き、タワーヒルでは2020年から2024年の間に**5,000本**、オジュクでは**マングローブ10万本**が植えられたと伝えられた。**ただし、この訪問が取り組みの課題を浮き彫りにし、回復させた区域を守り続ける必要を際立たせたとするのは、同記事に載った市長アキ＝サワイヤー氏の談話である。** 課題の中身は同記事に書かれていない。**議員の側が課題を指摘したとは、同記事は書いていない。**\n\n**市の主張への留保が、開始の年に地元の媒体から出ている。** Hidden Voices Salone Magazine（2020年8月6日）によれば、クルーベイが2018年に浸水しなかったのは市の施策によるとする市の見方について、シエラレオネ都市研究センターの研究者は**それを断じるには様子を見るしかないという趣旨を述べている。** 同記事によれば、同センターと連合体の側は、資金の面での**「深刻な制約」**が取り組みの一部の妨げになりうるとも述べている。**ただしこの留保の対象は Transform Freetown 全体であり、記録を売る仕組みそのものではない。**\n\n**懐疑的な報道は、取得できなかった。** 2025年に出た The Conversation の記事は robots.txt が我々を拒否しており、その転載先も取得できなかった。**したがって、生存率と資金の実際の入り方について批判があるかどうかは確かめられていない。**（炭素市場そのものをめぐる紛糾には RE:TV が触れている。） `fetch-status.md` に記録した。\n\n**フリータウンの人口は取れなかった。** シエラレオネ統計局の robots.txt が取得できず、他の入口も開かなかった。`unknown_fields` に申告した。**RE:TV（2024年2月14日）にある「2028年までに200万人になると見込まれる」は予測なので使っていない。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"sn-0001","name":"現地の土を固めた煉瓦で丸天井の教室棟を建て、地域の職人と一緒に中等学校をつくった","name_local":"CEM Kamanar","name_variants":["Kamanar Secondary School"],"country":"セネガル","region":"ジガンショール州","municipality":"チョンク・エシル","population_current":9064,"population_scale":"5万人未満","purpose":"誇りをつくる","theme":"学校・公共施設","start_year":2014,"end_year":null,"status_current":"継続中","actor_type":"設計事務所・建築家","lead_actor":"建築設計事務所 dawoffice（David García・Aina Tugores）と、同事務所がつくった財団 Foundawtion","component_types":"hard","components":["敷地の土を固めた煉瓦で丸天井を組む","教室棟を格子状に並べ、あとから足せるようにする","もとからあった木を囲んで広場をつくる","木の格子で風を通し、機械の冷房を使わない","掘った跡地を運動場と菜園にする"],"single_outlet":false,"sources":[{"url":"https://foundawtion.org/en/archivos/4604","title":"CEM School Kamanar - Foundawtion","outlet":"Foundawtion","published":"2021-06-16","language":"en","from_operator":true},{"url":"https://www.metalocus.es/en/news/sustainable-vaults-cem-kamanar-secondary-school-daw-office","title":"Sustainable vaults. CEM Kamanar Secondary School by daw office | METALOCUS","outlet":"METALOCUS","published":"2022-05-18","language":"en","from_operator":false},{"url":"https://worldarchitecture.org/architecture-news/eneph/winners-announced-for-aga-khan-award-for-architecture-2022.html","title":"Winners announced for Aga Khan Award for Architecture 2022","outlet":"World Architecture Community","published":"2022-09-23","language":"en","from_operator":false},{"url":"https://www.archdaily.com/1033933/architecture-is-cooperation-collective-projects-that-build-with-communities-and-professionals","title":"\"Architecture Is Cooperation\": Collective Projects that Build with Communities and Professionals | ArchDaily","outlet":"ArchDaily","published":"2025-09-09","language":"en","from_operator":false}],"context_sources":[{"url":"https://www.ansd.sn/sites/default/files/2022-12/SES_Ziguinchor_2005.pdf","title":"セネガル国家統計人口局（ANSD）ジガンショール州の経済社会状況・チョンク・エシル市の人口 9,064人（2005年時点）"}],"editor_notes":"**出典の数え方。** アガ・カーン建築賞の2022年の発表に由来する記事が他に複数ある。 そのうち e-architect（2022年6月29日）の本文は、賞の主催者側のページ（the.akdn）の文章と語句がそのまま同じだったので 出典に入れなかった。parametric-architecture（2022年9月25日）も同じ発表に由来するので、 代表として World Architecture Community の1本だけを残した（STATE §3「同一発表に由来する記事の数え方」）。 賞の主催者側のページ（the.akdn）は、構造化された箇所に更新日（2024年12月1日）しか無く掲載日が取れないので 出典に入れていない。写真の説明の裏取りだけに使った。 **出典[2] METALOCUS の扱い。** 署名は媒体の編集者（ÁNGELA MARTÍNEZ）だが、 記事の後半は「Description of project by daw office」と断ったうえで設計事務所自身の説明文を載せている。 そのため `from_operator: false` としたうえで、この記事から採った内容は 本文でも「設計事務所の説明」と「媒体の記述」を分けて帰属させた。 面積1,900平方メートル・設計2014〜2016年・工事2016〜2021年は、 記事末尾の媒体側のデータ欄にあるものである。 **出典[1] は事業者自身の発信**（`from_operator: true`）なので、費用と人数はそこにしか無いことを本文に明記した。 **完成年が食い違う。** 出典[1]は同じページの中で、見出しに「2016-2021」と書きながら本文で 「began in 2016 and finished in 2020」と書いている。出典[2]の媒体側データ欄と出典[4]は工事期間を2016〜2021年としている。 `discrepancies` に並置し、1つに丸めていない。 **セネガルの媒体は測れなかった。** seneweb.com は robots.txt が claudebot を拒否、 nation.africa と theeastafrican.co.ke と world-architects.com と arquitecturaviva.com も同じ。 aps.sn・lesoleil.sn・sudquotidien.sn は robots が許可しているが、この事業を扱った記事を見つけられなかった。 DOAJ は「Kamanar」「Thionck Essyl」とも0件だった。**取得できないことを採否の理由にしていない**（STATE §3）。 **人口。** ANSD の2023年の国勢調査（RGPH-5）は、公開されている章と州別報告のどちらにも市町村別の人口が無かった。 そのため市の人口は ANSD の2005年の州別報告の値であり、20年前のものである。 `population_scale` の区分はこの値で判定した。 **スローガンの書き方が出典で割れる。** 出典[4]は「Let’s make school」、出典[1]は「‘Let’s Build a School!’」と書いている。 本文では出典[4]の表記をそのまま用い、原語のまま置いた。 **purpose について。** 出典が繰り返し主題にしているのは、敷地の土と地域の職人でつくった建物の形と そのまわりの木や広場であるため `誇りをつくる` を当てた。 ただし出典[1][4]が事業の出発点として書いているのは「町に1つしかない中等学校が定員を超えていたこと」であり、 これは purpose 8種のどれにも当たらない。`pending.md` に積んだ。","unknown_fields":["population_current の年次（2005年の値しか取れなかった）"],"latest_source_year":2025,"elapsed_years":11,"follow_up":"濃い","follow_up_note":"ArchDaily は2025年9月9日に、マドリードのカサ・デ・ラ・アルキテクトゥーラで開かれている展覧会がこの学校を取り上げたと伝えている。同記事は工事に地域の164人が加わったことと、2020〜2022年の周期のアガ・カーン建築賞を受けたことを併記している。","timeline":[{"year":2014,"event":"dawoffice の建築家がチョンク・エシルの当局と会い、新しい中等学校を建てることを決めたとされる","source_url":"https://foundawtion.org/en/archivos/4604"},{"year":2016,"event":"工事が始まり、6月には丸天井の試作教室を1つ建てたとされる","source_url":"https://foundawtion.org/en/archivos/4604"},{"year":2019,"event":"10月10日に半分の状態で落成式を行い、学校をセネガルの教育当局へ引き渡したとされる","source_url":"https://foundawtion.org/en/archivos/4604"},{"year":2020,"event":"3月に新型コロナウイルスの流行で授業が止まり工事も中断、11月に再開したとされる","source_url":"https://foundawtion.org/en/archivos/4604"},{"year":2022,"event":"463件の候補から選ばれた6件のうちの1つとして、アガ・カーン建築賞を受けたと報じられた","source_url":"https://worldarchitecture.org/architecture-news/eneph/winners-announced-for-aga-khan-award-for-architecture-2022.html"},{"year":2025,"event":"マドリードで開かれている協働をめぐる建築展が、この学校を取り上げたと伝えられた","source_url":"https://www.archdaily.com/1033933/architecture-is-cooperation-collective-projects-that-build-with-communities-and-professionals"}],"discrepancies":[{"field":"工事が終わった年","values":[{"value":"2016年に始まり2020年に終わった","source_url":"https://foundawtion.org/en/archivos/4604","published":"2021-06-16"},{"value":"工事期間は2016〜2021年","source_url":"https://www.metalocus.es/en/news/sustainable-vaults-cem-kamanar-secondary-school-daw-office","published":"2022-05-18"},{"value":"工事期間は2016〜2021年","source_url":"https://www.archdaily.com/1033933/architecture-is-cooperation-collective-projects-that-build-with-communities-and-professionals","published":"2025-09-09"}]}],"last_verified":"2026-08-20","sections":{"何をしたか":"セネガル南部チョンク・エシルに、生徒500人の中等学校を建てた。バルセロナの設計事務所 dawoffice の説明として METALOCUS が載せた文章によれば、この地域でいちばん多い材料である粘土を主な建材とし、敷地でつくった圧縮土煉瓦を積んで、カテナリー曲線の丸天井を教室の屋根にした。同じ説明によれば、粘土は圧縮の力の下で働く材料であり、この形はそこから選ばれている。教室棟は格子状の位置に置かれ、必要になれば同じ形の棟を足して学校を大きくできる。ArchDaily は2025年9月9日に、工事に地域の164人が加わったこと、2020〜2022年の周期のアガ・カーン建築賞を受けたことを伝えている。","誰が始めたか":"事業を進めたのは、バルセロナの設計事務所 dawoffice と、同事務所がつくった財団 Foundawtion である。ArchDaily は2025年9月9日に、着想が2014年ごろのバルセロナで生まれたこと、dawoffice の David García と Aina Tugores がチョンク・エシルの当局と会い、町に1つしかなかった中等学校が定員を超えていることへの答えを示したことを伝えている。同記事によれば、事業は「Let’s make school」という言い方のもとで、石工・大工・電気工・配管工などの職人にとっての学校にもなるように組み立てられた。\n\nFoundawtion 自身は2021年6月16日の記事で、2014年に David García と Aina Tugores がチョンク・エシルの当局と会って新しい中等学校を建てることを決めたと書いている。同財団によれば、この事業は dawoffice が計画し、事業の運営は同財団が担った。同財団は、工事の4年間に地域の164人が加わったこと、現地の労働への報酬と、地元の家族経営の商店から買った道具や資材を通じて、地域の世帯に直接お金が渡ったと書いている。家具は Marc Morro が設計し、地元の大工がつくったとしている。\n\n同財団によれば、学校は公立であり、2019年10月10日の落成式でセネガルの教育当局へ引き渡された。この式にはチョンク・エシルとジガンショールの当局、財団の理事、dawoffice の代表、工事に加わった志願者と職人が出たとしている。","いくらかかったか":"Foundawtion は2021年6月16日の記事で、工事の実行費用が最終的に40万ユーロになったと書いている。同財団によれば、資金は多数の個人と団体の寄付でまかなわれ、自動車の会社 Teknia の名を挙げている。**費用と資金の出どころを書いているのは事業者自身の発信だけで、独立した出典では確認できなかった。**\n\n規模について、METALOCUS は記事末尾のデータ欄で面積を1,900平方メートル、設計を2014〜2016年、工事を2016〜2021年としている。Foundawtion は敷地が約2ヘクタールで、周囲を柵で囲ったと書いている。同財団は、工事でできたものとして、単独の教室21、図書室にあてた2つ分の教室1、課外活動にあてた2つ分の教室1、更衣室つきの便所を挙げ、これに管理棟が加わるとしている。**この並びが1,900平方メートルの内訳にあたるとは、どの出典も書いていない。**","真似するなら最低何が必要か":"**材料を敷地から出すと、掘った跡が別のものになる。** Foundawtion は2021年6月16日の記事で、丸天井の主な材料が現地の土であり、その採取跡がサッカー・バスケットボール・陸上の運動場と、生徒が使える菜園になったと書いている。METALOCUS が載せた設計事務所の説明も、粘土がこの地域でいちばん多い材料であることを、それを選んだ理由として挙げている。\n\n**粘土は圧縮の力の下で働くので、形がそこから決まる。** 同じ説明によれば、粘土で屋根のある空間をつくることが難題で、その答えとして選ばれたのがカテナリー曲線の丸天井だった。丸天井には雨と日射から粘土を守るために波形の鉄板をかぶせている。教室の両側は木の格子で閉じられ、北から南へ風が通る。同説明は、この通風と粘土の多孔質によって蒸発による冷却が働き、機械の空調に頼る必要が無いとしている。\n\n**建てること自体を職人の学びの場にできる。** ArchDaily は2025年9月9日に、この事業が石工・大工・電気工・配管工などの職人にも向けた学校として構想され、知識を伝えて分け合うことを目的にしたと伝えている。Foundawtion は、工事の4年間に地域の164人が加わり、運営と現場の指揮にあたって現地に移った志願者は地元の家庭に受け入れられたと書いている。\n\n**あとから足せる形にしておく。** METALOCUS が載せた設計事務所の説明によれば、学校は時間とともに変えられる仕組みとして考えられており、格子の上に並べた棟を足していくことで大きくできる。同じ説明によれば、木は事業を組み立てる要素になり、学年ごとの広場に伴っている。Foundawtion は、学年ごとの教室が、もとから木が立っていた位置と重なる広場のまわりでつながっていると書いている。","今どうなっているか":"World Architecture Community は2022年9月23日に、この学校が2020〜2022年の周期に候補となった463件から選ばれた6件の1つとしてアガ・カーン建築賞を受けたと報じている。同記事によれば、20件の最終候補は16か国から9人の審査団が選び、6件が100万ドルを分け合う。同記事は審査団の評を載せており、そこでは都市計画・造園・建築・建設技術のいずれの尺度についてもこの学校が取り組んでいるとされ、敷地の起伏と植生がこの事業の出発点に置かれた条件だとされている。\n\nArchDaily は2025年9月9日に、マドリードのカサ・デ・ラ・アルキテクトゥーラで開かれている展覧会「Architecture is Cooperation」がこの学校を取り上げたと伝えている。同記事は、この展覧会が2025年9月30日まで開かれる予定だと書いている。同記事は、この展覧会がスペインから進められた協働の事業を集めたものであり、キュレーターが Josep Ferrando であること、展示そのものが土と木でつくられていることを書いている。同記事はこの学校について、施主と資金の出し手が Foundawtion であること、設計が2014〜2016年、工事が2016〜2021年であることを併記している。\n\n**学校が引き渡されたあと、生徒数や校舎の使われ方を現地で追った報道は見つけられなかった。** 手に入った出典は、設計事務所と財団の発信、建築の賞の発表に基づく記事、スペインの展覧会を伝えた記事であり、いずれもセネガルの媒体ではない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"40万ユーロ","currency":"EUR","value":400000,"jpy":74240000}],"sample":false},{"id":"th-0001","name":"排水路の上に遊歩道を架けて公園にしたが、水のにおいの手当てが後回しになった","name_local":"สวนสาธารณะคลองช่องนนทรี","name_variants":["โครงการปรับปรุงภูมิทัศน์คลองช่องนนทรี","Chong Nonsi Canal Park"],"country":"タイ","region":"バンコク都","municipality":"バンコク都（バーンラック区・サートーン区・ヤーンナーワー区）","population_scale":"不明","purpose":"歩けるようにする","theme":"自然・緑地・水辺","start_year":2021,"end_year":null,"status_current":"縮小","actor_type":"行政","lead_actor":"バンコク都（กทม.）。土木局（สำนักการโยธา）が所管する。着手は当時のアッサウィン・クワンムアン都知事のもとで行われた","funding_scale":"事業全体で9億8,000万バーツと報じられた。2024年8月時点で完成した2区間の合計は1億5,600万バーツ超、第1区間は78,958,604.77バーツ。第3区間の見込みは約3億1,500万バーツ。第4区間2億5,000万バーツと第5区間2億バーツは入札が取り消された","component_types":"hard","components":["排水路の上に遊歩道を架けた","活動用の広場を並べた","処理した水で滝をつくった","汚水を運河の下の管に分けた","5区間に分けて順に発注した"],"sources":[{"url":"https://www.bangkokbiznews.com/news/966201","title":"เผยโฉมสวนสาธารณะ \"คลองช่องนนทรี\" พื้นที่สีเขียวแห่งใหม่ เปิดเฟสแรก 25 ธ.ค.","outlet":"กรุงเทพธุรกิจ（Bangkok Biz News）","published":"2021-10-16","language":"th","from_operator":false},{"u の進捗が42%と伝えられ、最初の区間を同年12月25日に開けるとされた","source_url":"https://www.thansettakij.com/property/503590"},{"year":2022,"event":"1月3日、9億8,000万バーツを投じる価値があるかを問う記事が出た。開いた部分は5区間のうち第2区間だけで、そこに使われたのは8,000万バーツである","source_url":"https://www.bangkokbiznews.com/social/980575"},{"year":2022,"event":"11月7日、最後の第4・第5区間（合計4億5,000万バーツ）の入札が、応札1者のみを理由に取り消された","source_url":"https://www.bangkokbiznews.com/politics/1036350"},{"year":2024,"event":"7月20日、元副都知事が現地の映像を公開し、水が黒くにおい、樹木や地被植物が広い範囲で傷んでいると述べた","source_url":"https://www.thairath.co.th/scoop/theissue/2801701"},{"year":2024,"event":"7月26日、都の広報担当が、においを減らす手当てと、当初5区間を4区間に減らしたことを説明した","source_url":"https://www.thairath.co.th/scoop/theissue/2803222"},{"year":2024,"event":"7月31日、1週間後の再取材で水位が上がり、においが減り、運河に残されていた木杭の撤去が進んでいた","source_url":"https://www.thairath.co.th/scoop/theissue/2804309"},{"year":2024,"event":"8月3日、完成した2区間の事業費が合計1億5,600万バーツ超、第3区間の見込みが約3億1,500万バーツと伝えられた","source_url":"https://www.thairath.co.th/scoop/theissue/2805083"}],"last_verified":"2026-08-19","sections":{"何をしたか":"バンコク都心を流れる排水路チョンノンシー運河の上に遊歩道と広場を架け、公園にした事業。**タイで最初の運河公園とされる**（ไทยรัฐ 2024年8月3日）。運河はバーンラック・サートーン・ヤーンナーワーの3区にあり、幅はおよそ15〜17メートル、スラウォン通りに始まりシーロム・サートーン・チャン・ラチャダーピセーク・ラマ3世の各通りを抜けてチャオプラヤー川に至る、およそ4.5キロメートルの排水路である（同）。\n\n**遊歩道は運河の上に架かり、活動用の広場と、処理した運河の水を使う滝が置かれた。汚水は運河の下の管に分けられている**（กรุงเทพธุรกิจ 2021年10月16日）。完成時は両岸で合わせて9キロメートルになる計画で、工事は5区間に分けられた（同）。\n\n**2021年11月17日の ฐานเศรษฐกิจ は、工事の進み具合を42%と伝え、最初の区間を同年12月25日に開けると書いている。**（タイの出典は年を仏暦で書いている。ここでは、記事の掲載年から一意に決まる場合にかぎって西暦で示した。）","誰が始めたか":"**始めたのはバンコク都で、着手は当時のアッサウィン・クワンムアン都知事のもとで行われた**（ไทยรัฐ 2024年8月3日）。所管は都の土木局である。\n\n**都知事本人の言葉が出典に残っている。** アッサウィン都知事は2021年10月16日にフェイスブックで、バンコクは運河の都市で、かつては移動と排水に使われ人の暮らしが運河とともにあったが、都市が発展して運河は排水だけの場所になったと書き、都は運河を排水以外にも使えるように公園にして緑地を増やすと述べた（กรุงเทพธุรกิจ 2021年10月16日が引用）。同じ投稿は กรุงเทพธุรกิจ の2022年1月3日の記事でも引かれている。\n\n**事業の位置づけは「2つ目のランドマーク」だった。** ฐานเศรษฐกิจ（2021年11月17日）は、政府と都が先に手をつけたオンアン運河の改修が世界に知られて新しい観光地になり収入を生んだのを受けて、この事業をランドマークの2件目と書いている。同記事では都の広報担当ポンサコーン・クワンムアン氏が進捗を明らかにしている。\n\n**運河そのものは排水施設である。** 都の広報担当エーカワランユー・アムラパーン氏は2024年7月26日に、もともとこの運河は排水のためのもので、前の都知事が運河を美しくする事業を始めたと説明している（ไทยรัฐ 2024年7月26日）。","いくらかかったか":"**事業全体は9億8,000万バーツと報じられた**（กรุงเทพธุรกิจ 2022年1月3日）。区間ごとの内訳は出典に出ている。\n\n- **第1区間**（スラウォン通り〜サートーン通り・800メートル）：78,958,604.77バーツ。工事は完了し、2年間の工事保証の期間中である。出典は保証の終期を仏暦2569年2月20日と書いている。枯れた樹木は契約により受注者が植え替える義務があり、保証期間の満了後は都の部署が維持管理を行う（ไทยรัฐ 2024年8月3日）\n- **第4区間**（チャン通り〜ラチャダーピセーク通り）2億5,000万バーツ、**第5区間**（ラチャダーピセーク通り〜ラマ3世通り）2億バーツ：**2022年11月7日、応札が1者のみだったことを理由に入札が取り消された**（กรุงเทพธุรกิจ 2022年11月7日）\n- **完成した2区間の合計**：1億5,600万バーツ超。**第3区間の見込みは約3億1,500万バーツ**（ไทยรัฐ 2024年8月3日）\n\n**開業の直後から費用が問われている。** กรุงเทพธุรกิจ（2022年1月3日）は、9億8,000万バーツを投じる価値があるかという問いを立て、2021年12月25日に開いたのは5区間のうち第2区間だけで、そこに使われたのは8,000万バーツだと書いている。同記事は都の土木局長タイウット・カンケーオ氏の説明として、事業がスラウォン通りからラマ3世通りまでおよそ4.5キロメートル・幅およそ15メートルで、5区間に分けられていることを伝えている。\n\n**第1区間の入札は2回行われている。** กรุงเทพธุรกิจ（2022年11月7日）によれば、仏暦2564年12月3日に入札書類を買った事業者は6者いたが誰も応札せず、同年12月12日に公告が取り消された。都は仏暦2565年3月11日に再度公告し、同年4月5日に落札者を発表した。落札したのはウィワットポン・エンジニアリング社1者で、金額は7,900万バーツだった。","真似するなら最低何が必要か":"第一に、**その水路が何のためにあるかを先に確かめる**こと。この運河は排水施設である。都の広報担当エーカワランユー氏は2024年7月26日、バンコクの運河の要は排水であり、したがってもともとさまざまなにおいのする水を含んでいると述べている（ไทยรัฐ 2024年7月26日）。\n\n第二に、**きれいにしたあとの「におい」を設計に入れる**こと。同氏は、運河を美しくすることを考えるとき、美しくしたあとどうやってにおいを出さないようにするかについては、最初から細かく話されていなかったかもしれないと述べている（同）。**以前は運河が道路に沿っていて住宅に接していなかったため、においは話題にならなかった。事業によって人が歩くようになって、においがあると感じられるようになった**というのが同氏の説明である。\n\n第三に、**洪水対策とにおいが逆を向くことを知っておく**こと。同氏によれば、事業の開始後にまず見たのは洪水の防止で、そのためには水をできるだけ減らす必要があった。**ところが水を減らすとにおいが出た**（同）。\n\n第四に、**落ち葉と工事の残置物を管理の対象に入れる**こと。同氏は、運河に落ちた葉が有機物と同じ反応を起こして硫化水素を生じ、においと黒い色のもとになると説明している（同）。2024年7月31日の再取材では、運河に打ち込まれたまま残っていた数百本の木杭が撤去されつつあった。これは工事で余った資材で、水の流れと土砂をさえぎって堆積を生み、においのもとになっていた（ไทยรัฐ 2024年7月31日）。\n\n第五に、**工事保証が切れたあとに誰が手入れするかを決めておく**こと。第1区間は2年間の工事保証の期間中で、枯れた樹木の植え替えは受注者の義務、保証の満了後は都の部署が維持管理を行うと整理されている（ไทยรัฐ 2024年8月3日）。**維持管理の主体が切り替わる日付が決まっている。**\n\n第六に、**区間を分けて発注すると、途中で止まりうる**こと。5区間のうち最後の2区間は、2022年11月7日に応札が1者のみで入札が取り消された（กรุงเทพธุรกิจ 2022年11月7日）。","今どうなっているか":"**2026年8月時点で確認できたのは、2024年8月3日の記事までである。**\n\n**劣化が2024年7月に報じられた。** ไทยรัฐ（2024年7月20日）によれば、รวมไทยสร้างชาติ 党の比例代表議員で元バンコク副都知事のクリアンヨット・スットラーパー氏が現地を歩いた映像を公開した。同氏は、水が黒くほぼ全区間でにおい、泡が浮いていたと述べ、大きな木・小さな木・地被植物のいずれも傷んでおり、傷んでいるのは面積のおよそ90%に及ぶと述べている。立ち枯れた大木はまだ無いが枝が乾き始めて折れる恐れがあるとも述べている。同氏によれば、近隣の事業者と住民から見に来てほしいという訴えがあり、現地で話した人たちは職員が手入れに来るのを見たことがないと述べたという。\n\n**当事者の側の説明が同じ媒体に載っている。** ไทยรัฐ（2024年7月26日）は、都の広報担当エーカワランユー・アムラパーン氏に読者の疑問をまとめて尋ねている。同氏は、においの原因と対処、そして**当初5区間だった計画をいまは4区間に減らし、過去に第2区間を最初に作り、いまは第1区間に取りかかっていること**を説明している。\n\n**1週間後の再取材では状態が変わっている。** ไทยรัฐ（2024年7月31日）によれば、取材班が最初に現地を見たとき、第2区間の水はやや緑がかっており一部でわずかにおい、第1区間の水は黒みがかった緑で明らかに不快なにおいがした。その後、都が「雨の弱いうちに良質な水を運河へ引き入れ、においを減らす」と発信し、再訪時には水位が上がってにおいが減り、十数人の作業員が木杭の撤去にあたっていた。\n\n**第3区間の計画は残っている。** ไทยรัฐ（2024年8月3日）は、完成した2区間の合計が1億5,600万バーツ超で、第3区間の見込みが約3億1,500万バーツだと伝えている。**2024年8月より後の記録には到達していない。** `status_current` を `縮小` としたのは、5区間から4区間に減ったという2024年7月26日の説明と、最後の2区間の入札が取り消されたという2022年11月7日の報道にもとづく。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"9億8,000万バーツ","currency":"THB","value":980000000,"jpy":4770957520},{"raw":"78,958,604.77バーツ","currency":"THB","value":78958604.77,"jpy":384396071},{"raw":"2億5,000万バーツ","currency":"THB","value":250000000,"jpy":1217081000},{"raw":"2億バーツ","currency":"THB","value":200000000,"jpy":973664800},{"raw":"1億5,600万バーツ","currency":"THB","value":156000000,"jpy":759458544},{"raw":"3億1,500万バーツ","currency":"THB","value":315000000,"jpy":1533522060},{"raw":"8,000万バーツ","currency":"THB","value":80000000,"jpy":389465920},{"raw":"7,900万バーツ","currency":"THB","value":79000000,"jpy":384597596}],"sample":false},{"id":"th-0002","name":"運河を覆っていた市場を撤去して歩行者天国にしたが、開いた数か月後に市場が閉じた","name_local":"คลองโอ่งอ่าง","name_variants":[],"country":"タイ","region":"バンコク都","municipality":"バンコク都（プラナコーン区とサンパンタウォン区にまたがる）","population_scale":"不明","purpose":"人を呼ぶ","theme":"商店街・市場","start_year":2020,"end_year":null,"status_current":"縮小","actor_type":"行政","lead_actor":"バンコク都（กทม.）。現地はプラナコーン区とサンパンタウォン区の2区にまたがり、護岸と運河にかかる工事は都の排水局（สนน.）が所管する","funding_scale":"The Momentum（2021年3月25日）は、仏暦2559年以降、都がオンアン運河の景観整備に4億バーツを下らない予算を使ってきたと書いている。区が観光の振興に使えるのは都議会議員が回してくる予算だけだとされる","component_types":"hard","components":["運河を覆っていた市場を撤去した","両岸に歩ける道をつくった","壁に地域を描く壁画を入れた","週末の夕方だけ市を開いた","カヤックの発着場を置いた"],"sources":[{"url":"https://www.thairath.co.th/news/local/bangkok/1963110","title":"ถือกล้องชมวิว \"Street Art คลองโอ่งอ่าง\" สะท้อนภาพชุมชนเก่าแก่ผ่านงานศิลปะ","outlet":"ไทยรัฐ（Thairath）","published":"2020-10-28","language":"th","from_operator":false,"sponsored":true},{"url":"https://themomentum.co/citycalling-asiantownscapeawards/","title":"ความน่ายินร้ายของ ‘คลองโอ่งอ่าง’ กับรางวัล ‘ต้นแบบ’ การพัฒนาเมืองที่เต็มไปด้วยคำถาม","outlet":"The Momentum","published":"2021-03-25","language":"th","from_operator":false},{"url":"https://www.thairath.co.th/news/sustainable/2769604","title":"กทม. ลงพื้นที่คลองโอ่งอ่าง ขับเคลื่อนแผนฟื้นฟู 3 ระยะ แก้ปัญหาสิ่งแวดล้อม","outlet":"ไทยรัฐ（Thairath）","published":"2024-03-11","language":"th","from_operator":true},{"url":"https://www.thairath.co.th/scoop/theissue/2795732","title":"คลองโอ่งอ่าง' ไร้ต่อยอด กับปัจจุบันที่เหมือนไปเริ่มต้นใหม่","outlet":"ไทยรัฐ（Thairath）","published":"2024-06-25","language":"th","from_operator":false},{"url":"https://www.thairath.co.th/scoop/theissue/2796467","title":"คลองโอ่งอ่าง' ต้องยืนด้วยตัวเอง จะช่วยตลอดไม่ได้","outlet":"ไทยรัฐ（Thairath）","published":"2024-06-27","language":"th","from_operator":false},{"url":"https://www.thairath.co.th/scoop/theissue/2810629","title":"\"คลองโอ่งอ่าง\" แม้เวลาอาจหยุดนิ่ง แต่ขอบคุณที่พยายาม","outlet":"ไทยรัฐ（Thairath）","published":"2024-08-27","language":"th","from_operator":false}],"context_sources":[],"unknown_fields":["population_scale","population_current"],"latest_source_year":2024,"elapsed_years":4,"follow_up":"濃い","follow_up_note":"2020年に歩行者天国として開いたが、数か月で新型コロナにより市場が閉じた。2021年に UN-Habitat の賞を受けた一方、住民の参加が無かったとする検証も出た。2024年時点で人出は戻っていないと報じられている。","timeline":[{"year":2020,"event":"10月、運河沿いの壁画が古い地域の姿を映すものとして紹介された","source_url":"https://www.thairath.co.th/news/local/bangkok/1963110"},{"year":2021,"event":"3月、UN-Habitat の 2020 Asian Townscape Awards の受賞に対し、観光を主目的とし住民の参加が無かったとする検証が出た","source_url":"https://themomentum.co/citycalling-asiantownscapeawards/"},{"year":2024,"event":"3月、都が3段階の再生計画を進めるために現地に入ったと伝えられた","source_url":"https://www.thairath.co.th/news/sustainable/2769604"},{"year":2024,"event":"6月、現地取材で、カヤックの発着場が空になり両岸に人がほとんどいないことが伝えられた","source_url":"https://www.thairath.co.th/scoop/theissue/2795732"},{"year":2024,"event":"6月、サンパンタウォン区長が、責任が複数の部署に分かれていることと、事業者が自力で立つべきだという考えを述べた","source_url":"https://www.thairath.co.th/scoop/theissue/2796467"},{"year":2024,"event":"8月、8〜12日に催しが開かれたが、出店者は人が多かったのは1日だけだったと述べた","source_url":"https://www.thairath.co.th/scoop/theissue/2810629"}],"last_verified":"2026-08-19","sections":{"何をしたか":"バンコク旧市街を囲む運河の一部であるオンアン運河（คลองโอ่งอ่าง）で、**運河を覆っていた半ば恒久的な市場の構造物を撤去し、両岸を歩ける道にして週末の市を開いた**取り組み。\n\n**運河は240年以上の歴史があるとされ、サンペン・パーフラット・サパーンレックといった商いの中心の間を流れている**（ไทยรัฐ 2024年6月25日）。The Momentum（2021年3月25日）によれば、この運河は20年以上にわたってサパーンレック市場という半ば恒久的な構造物に覆われ、水は腐っていた。整備の後は水の澄んだ運河になり、都市の中では得がたい夕方の過ごし方ができる場所になった、というのが同記事の見立てである。\n\n**現地は2つの区にまたがる。** プラナコーン区とサンパンタウォン区で、面積の大半はプラナコーン区にある（ไทยรัฐ 2024年6月27日）。\n\n**2021年、UN-Habitat の 2020 Asian Townscape Awards を「景観改善の手本（Landscape Improvement Project）」として受けた。** その年に受賞したのは6か国だけだった（ไทยรัฐ 2024年6月25日）。\n\n**開始の年は、出典が仏暦で書いているため西暦で確定できる範囲が限られる。** The Momentum（2021年3月25日）は景観の整備の始まりを仏暦2561年としている。西暦で出典に出てくるのは賞の名称（2020 Asian Townscape Awards）と、2020年10月28日のタイ・ラットの記事だけである。`start_year` には、歩ける場所として記事が出た2020年を採った。","誰が始めたか":"**始めたのはバンコク都である。** The Momentum（2021年3月25日）によれば、都は仏暦2558年に、当時の国家平和秩序維持評議会（คสช.）政権の支持のもと憲法暫定条項第44条を用いて、この区域の返還を求めた。**同記事は、20年以上にわたって運河の上と両岸の通路が占用されるのを放置してきたことについて、常勤の職員も区長も知事も誰ひとり責任を問われていないと書いている。**\n\n**整備の進め方への批判が、受賞と同じ年に出ている。** 同記事は、景観整備の全過程が上からの考えによるもので、**地域の住民が関わる機会は一度も無かった**とし、観光を主目的とする都市の整備が人を置き去りにすることを問うている。同記事はまた、同じ賞をバンコクの旧市街が仏暦2554年に「The Living Bangkok Heritage」として受けたのち、旧市街から地域の共同体が立ち退かされてきたと書いている。\n\n**責任は複数の部署に分かれている。** サンパンタウォン区長ワンラップ・キアッティウォラシークン氏は2024年6月27日、運河が2区にまたがること、護岸や運河に関わる事業は都の排水局（สนน.）が所管して予算も持つことを説明し、**「区は場所の持ち主にすぎない」**と述べている（ไทยรัฐ 2024年6月27日）。同氏によれば、街灯が消えたままの箇所があるのは、最初の時期に据えられた器具が外国から入れたもので、いまは同じ部材を調達できないためである。","いくらかかったか":"**額を示した出典が1本ある。** The Momentum（2021年3月25日）は、**仏暦2559年以降、都がオンアン運河の景観整備に4億バーツを下らない予算を使ってきた**と書き、その目的が観光にあることは明白だとしている。同記事は、その予算で用意されたものとして、壁画・生演奏・独自性のない露店の市、そしてカヤックを挙げている。\n\n**もう1本は額を示さずに「高い」と書いている。** ไทยรัฐ（2024年6月25日）は、この水準まで整備したことが「かなり高い国費」と引き換えだったとし、そのため多くの人がこの場所は継続して手入れと支援を受けると見ていた、と書いている。\n\n**区が使える予算の出どころは説明されている。** サンパンタウォン区長は2024年6月27日、観光の振興について、区が使えるのは都議会議員が回してくる予算だけで他からは無いと述べ、前年はその予算でロイクラトンの催しを開き、多くの人が集まったとしている（ไทยรัฐ 2024年6月27日）。","真似するなら最低何が必要か":"第一に、**占用を解いたあと、誰がその場所を続けるのかを決めておく**こと。The Momentum（2021年3月25日）によれば、この場所は20年以上占用されたのち、法の強い手段で返還が求められた。**返す作業と、返したあとに人が来続ける作業は別である。**\n\n第二に、**整備の過程に地域を入れる**こと。同記事は、全過程が上からの考えで、地域の住民が関わる機会が一度も無かったと書いている。**2024年に人出が戻らないとき、地域の側に事業を立て直す持ち分が残っていない。**\n\n第三に、**開く曜日と時間を、出店する側が決められるようにする**こと。ไทยรัฐ（2024年8月27日）によれば、市はもともと金・土・日の16時から20時に開いていたが、出店者からは土日の13時から19時に前倒ししてはどうかという声が出ている。\n\n第四に、**呼び込みを誰が続けるのかを決めておく**こと。ไทยรัฐ（2024年6月25日）によれば、地域の自治会の代表は、以前は都と区が広報を助け店を集め、行政と地域が助け合っていたので形が整っていたと述べている。**その体制は長くは続かなかった。**\n\n第五に、**設備の部材を国内で替えられるようにしておく**こと。サンパンタウォン区長は2024年6月27日、最初の時期に据えた街灯の器具が外国から入れたもので、時間が経つと同じ部材を調達できなくなったと説明している（ไทยรัฐ 2024年6月27日）。**直さないのではなく、部材が手に入らない。**\n\n第六に、**責任の分かれ方を先に地図にしておく**こと。運河は2区にまたがり、護岸と運河の工事は排水局、街灯は別の部署、区は「場所の持ち主」という分かれ方になっている（同）。","今どうなっているか":"**2026年8月時点で確認できたのは、2024年8月27日の記事までである。**\n\n**人出は戻っていない。** ไทยรัฐ（2024年6月25日）の取材班は2024年6月21日に現地を歩き、かつて人が列をなして順番を待ったカヤックの発着場が桟橋だけを残して空になり、両岸はほとんど人がいなかったと伝えている。**床は清潔で、壁には壁画が点々と残っていた。**\n\n**閉じた理由として新型コロナが挙げられている。** 同記事によれば、地域の自治会の代表は、開いてから数か月で新型コロナの流行が来て人が減り、市場は閉じ、再開してからまた2度目の閉鎖になり、出店していた店は他所へ散った、**3度目の再開のときプラナコーン区の側は市場を開かなかった**と述べている。\n\n**都は再生の計画を動かしている。** ไทยรัฐ（2024年3月11日）は、都が3段階の再生計画を進めるために現地に入ったと伝えている。**この記事は都のフェイスブックの情報にもとづくと明記されているため、当事者の発信として扱う。**\n\n**行政の側は「自力で立つ」ことを求めている。** サンパンタウォン区長は2024年6月27日、地域には持続してほしく、事業者には自分の足で立ってほしいという考えを述べている（ไทยรัฐ 2024年6月27日）。\n\n**催しは開かれたが、効果は限られたと出店者が述べている。** ไทยรัฐ（2024年8月27日）によれば、2024年8月8日から12日にかけて、サパーンハンからサパーンボピットピムックの間で観光振興の催しが開かれた。取材班が8月23日に再訪したところ、飲み物の店を営む出店者は、店の数はそれなりに並んだが人出は程々で、**人が多かったのは歌手が来た1日だけだった**と述べ、景気が悪く物価も上がっていることを理由に挙げている。別の出店者は、いまの状態を集中治療室に入ったようだと表している。**同記事の題は「時は止まっているかもしれないが、努力してくれてありがとう」である。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"4億バーツ","currency":"THB","value":400000000,"jpy":1947329600}],"sample":false},{"id":"tr-0001","name":"川と岸辺を市の顔につくり替え、路面電車と公園を四半世紀かけて足した","name_local":"Porsuk Çayı","name_variants":["Porsuk"],"country":"トルコ","region":"エスキシェヒル県","municipality":"エスキシェヒル大都市自治体","population_current":921630,"population_scale":"25万超","purpose":"誇りをつくる","theme":"自然・緑地・水辺","start_year":1999,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"エスキシェヒル大都市自治体。1999年から2024年まで Yılmaz Büyükerşen が市長を務めた。Porsuk-1 の一部は Türkiye İş Bankası と組んで進めている","component_types":"hard","components":["川を改修して使えるようにする","川沿いを公園と緑地にする","路面電車の路線を敷く","川沿いを再開発の区域に定める","古い町並みの家屋を修復する","川岸の土地を公有に移す"],"sources":[{"url":"https://dergipark.org.tr/tr/pub/idealkent/article/1126927","title":"Eskişehir'de Kentsel Dönüşüm Uygulamaları: Porsuk 1-2 Kentsel Dönüşüm ve Gelişim Projeleri Örneği","outlet":"İDEALKENT","published":"2022-11-14","language":"tr","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://www.eskisehir.net/eskisehir-bes-ayri-alanda-yeniden-donusuyor","title":"Eskişehir, beş ayrı alanda yeniden dönüşüyor","outlet":"Eskişehir.net","published":"2024-12-28","language":"tr","from_operator":false},{"url":"https://www.eskisehir.net/eskisehirin-simgesi-porsukta-ikinci-buyuk-donusum-basliyor","title":"Eskişehir'in simgesi Porsuk'ta ikinci büyük dönüşüm başlıyor","outlet":"Eskişehir.net","published":"2025-03-20","language":"tr","from_operator":false},{"url":"https://dergipark.org.tr/en/pub/kared/article/1695237","title":"Çeyrek Asırlık Dönüşüm: Eskişehir İli Yılmaz Büyükerşen Dönemi","outlet":"Karadeniz Journal of Economic Research","published":"2025-07-31","language":"tr","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://www.eskisehir.net/eskisehirde-yeni-kentsel-donusum-projesi-binlerce-bina-yenilenecek","title":"Eskişehir'de yeni kentsel dönüşüm projesi: Binlerce bina yenilenecek","outlet":"Eskişehir.net","published":"2026-02-13","language":"tr","from_operator":false}],"context_sources":[{"url":"https://www.eskisehir.net/eskisehirin-2025-nufusu-aciklandi","title":"Eskişehir.net（トルコ統計機構の2025年の値。エスキシェヒル県 921,630人）"}],"unknown_fields":[],"latest_source_year":2026,"elapsed_years":27,"follow_up":"濃い","follow_up_note":"1999年から2024年までの市長の在任中に川の改修・公園・路面電車が進んだ。2019年に川沿いを2つの再開発区域に指定し、2025年に旧公会堂の解体が始まった。2026年には次の市長が、指定した区域の多くで目立った進展が無かったとする一方、Porsuk-1・2 と Gündoğdu は続いていると述べている。","timeline":[{"year":2022,"event":"11月、İDEALKENT に Porsuk-1・Porsuk-2 の再開発を扱う論文が載った。抄録は、これらの事業が、中心部が失った価値を取り戻すこと、荒れた区域の力を引き出すこと、川を公園と庭と緑地とともに市民が使えるようにすること、中心部を広げること、歩行者化を進めること、区域の改修によって安全を高めることを目指すと書いている。**あわせて、ジェントリフィケーション、社会的な記憶と場所の関係、消費の空間、地代、転換の担い手という切り口から検討すると書かれている**（本文は取得しておらず、抄録の範囲で書いている）","source_url":"https://dergipark.org.tr/tr/pub/idealkent/article/1126927"},{"year":2024,"event":"12月28日、市が5つの区域で新しい再開発を進めることが伝えられた。市長は、Gündoğdu について約143,000平方メートルの緑地、学校用地2、文化施設用地2、自治体の施設用地1と新しい通りをつくること、川岸の建物を取り払って9kmを超える歩く道にすること、川岸の土地をすべて公有に移すことができたと述べている","source_url":"https://www.eskisehir.net/eskisehir-bes-ayri-alanda-yeniden-donusuyor"},{"year":2025,"event":"3月20日、川沿いで2度目の大きな作り替えが始まることが伝えられた。記事は、市が2019年に Köprübaşı から Vatan 通りまでの区域を「Porsuk-1・Porsuk-2 再開発区域」と定めたこと、Porsuk-1 で共和国期の文化と教育の建物である旧公会堂を建て直すための解体が始まったこと、834平方メートルの区域で İş Bankası と8区画の所有者と市の間で合意ができたことを書いている","source_url":"https://www.eskisehir.net/eskisehirin-simgesi-porsukta-ikinci-buyuk-donusum-basliyor"},{"year":2025,"event":"7月31日、Karadeniz Journal of Economic Research に1999年から2024年までの25年を扱う論文が載った。抄録は、自治体の刊行物・戦略計画・事業報告と関連文献を分析したとしたうえで、この間に Porsuk Nehri Projesi、Kent Park、Sazova の科学文化芸術公園、Odunpazarı の家屋の修復、Haller 青少年センター、EsTram といった事業によって市の姿が変わったこと、物理的な姿だけでなく社会・文化・経済の構造も変わったと述べている（本文は取得しておらず、抄録の範囲で書いている）","source_url":"https://dergipark.org.tr/en/pub/kared/article/1695237"},{"year":2026,"event":"2月13日、市と市民評議会が地震への備えと再開発を話し合う会合を開いた。**市長は、Gündoğdu でも Küçük Sanayi でも省庁が定めた区域でも「kayda değer bir değişim」は得られなかったとし、大都市自治体が定めた8地区の広い区域でも具体的な前進は起きていないと述べている。**一方で Porsuk-1 と Porsuk-2 は続いており手続きは進んでいるとし、Gündoğdu についても都市計画をつくり111戸の住宅と4つの店舗と保育所の入札を終えて着工したと述べている。同氏は、約5,000棟を速やかに建て替える必要があり、さらに1万棟にも緊急の必要があると述べた","source_url":"https://www.eskisehir.net/eskisehirde-yeni-kentsel-donusum-projesi-binlerce-bina-yenilenecek"}],"last_verified":"2026-08-19","sections":{"何をしたか":"トルコのエスキシェヒル大都市自治体が、**市の中心を流れるポルスク川とその岸辺を軸に、市の姿を作り替えてきた。**1999年から2024年まで同じ市長が在任している。\n\n2025年の論文の抄録は、この25年に川の事業、公園、科学文化芸術公園、オドゥンパザルの家屋の修復、青少年センター、路面電車 EsTram といった事業が行なわれ、市の物理的な姿だけでなく社会・文化・経済の構造も変わったと述べている。\n\n市は2019年に川沿いを2つの再開発区域に定め、2025年には旧公会堂を建て直すための解体が始まった。2022年の論文は、この再開発をジェントリフィケーションや地代の観点からも検討すると書いている。**2026年2月には次の市長が、Gündoğdu と Küçük Sanayi、省庁が定めた区域、市が定めた8地区では目立った変化が得られなかったと述べている。同氏は Porsuk-1 と Porsuk-2 については続いているとしている。**","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"tw-0001","name":"村ぜんぶを美術館と呼び、豚舎を集会所に、空き家や倉庫を展示場にした。デング熱の流行で1年余り止まった","name_local":"土溝農村美術館","name_variants":["土溝美術館"],"country":"台湾","region":"台南市","municipality":"台南市後壁區土溝里","population_current":1269,"population_scale":"5万人未満","purpose":"誇りをつくる","theme":"文化・アート・祭り","start_year":2012,"end_year":null,"status_current":"判定不能","actor_type":"混合","lead_actor":"台南市土溝農村文化營造協會と、台南藝術大學の大学院を出て土溝に住みついた若者たち。展示の企画は「優雅農夫藝術工廠」が担った。2013年時点の協會理事長は吳冠霖、2017年時点の理事長は黃鼎堯である","funding_scale":"美術館の計画は準備に1年近くをかけ、経費は行政の補助によらず民間の募金で集めたと光華雜誌は2013年2月に書いている。同誌は資金の出し手として台南企業文化藝術基金會と立賢教育基金會を挙げている。2013年11月の宴会は門票の所得が約150万台湾元だった。いっぽう藝術家雜誌は2017年8月に、協會の草創期の経費の多くは行政の補助であったと書き、2012年に協會が、農村美術館は民間から募金するという考えを出したとしている。総額は参照した7本のどこにも書かれていない","component_types":"hybrid","components":["村ぜんぶを展示場と呼ぶ","豚舎を改修して集会所にする","住民が絵を習い自宅を展示場にする","民間の募金で運営費を集める","芸術家に村へ住んでもらう","千人規模の宴会で資金を募る"],"sources":[{"url":"https://www.newsmarket.com.tw/blog/11719/","title":"村是美術館，美術館是村─土溝農村美術館開張囉！","outlet":"上下游新聞","published":"2012-07-11","language":"zh-TW","from_operator":true},{"url":"https://www.taiwan-panorama.com/Articles/Details?Guid=67f5bb2a-c2f9-4de7-8ede-4fb982393626&CatId=7","title":"土溝農村美術館，開啟新生活美學","outlet":"台灣光華雜誌","published":"2013-02","language":"zh-TW","from_operator":false},{"url":"https://www.newsmarket.com.tw/blog/41970/","title":"史上第一！土溝農村美術館千人辦桌，本土小農相挺","outlet":"上下游新聞","published":"2013-11-10","language":"zh-TW","from_operator":false},{"url":"https://www.newsmarket.com.tw/blog/42004/","title":"十年水牛精神，土溝打造台灣版瀨戶內藝術祭","outlet":"上下游新聞","published":"2013-11-11","language":"zh-TW","from_operator":false},{"url":"https://ourisland.pts.org.tw/content/2427","title":"【農村再造】農村是座美術館｜土溝農村美術館的故事","outlet":"公視 我們的島","published":"2015-12-21","language":"zh-TW","from_operator":false},{"url":"https://www.artist-magazine.com/edcontent_d.php?lang=tw&tb=8&id=621","title":"具水牛精神的藝術介入──土溝農村美術館","outlet":"藝術家雜誌","published":"2017-08","language":"zh-TW","from_operator":false},{"url":"https://canopi.tw/culture-and-lifestyle/togoartmuseum/","title":"十六年地方永續的實踐與反思：土溝農村美術館","outlet":"樹冠 Canopi","published":"2019-12-27","language":"zh-TW","from_operator":false}],"context_sources":[{"url":"https://web.tainan.gov.tw/baiheagr/News_population.aspx?n=17963&sms=18343","title":"臺南市白河戶政事務所「里鄰人口數(按里/月)」（後壁區115年7月里鄰人口數。土溝里 1,269人、後壁區の總計 20,626人）"}],"discrepancies":[{"field":"土溝里の人口","values":[{"value":"1,000人未満（うち3割以上が高齢者）","source_url":"https://www.taiwan-panorama.com/Articles/Details?Guid=67f5bb2a-c2f9-4de7-8ede-4fb982393626&CatId=7","published":"2013-02"},{"value":"1,700人","source_url":"https://www.newsmarket.com.tw/blog/42004/","published":"2013-11-11"}]}],"unknown_fields":[],"latest_source_year":2019,"elapsed_years":7,"follow_up":"濃い","follow_up_note":"2013年11月の宴会は門票の所得が約150万台湾元だった。2017年8月の記事は、デング熱の流行で入場料の収入が足りず店がみな一時休業し、美術館に関わる動きが1年余り止まったのち、その年の夏に再び始まったと書いている。","timeline":[{"year":2012,"event":"7月11日、協會の側が、村ぜんぶを展示場とする「土溝農村美術館」を年末に開くとして民間からの募金を呼びかけた。建物を建てるのではなく村を美術館とする、と書かれている。同じ文章は、土溝農村文化營造協會が2001年4月7日に登記されたとしている","source_url":"https://www.newsmarket.com.tw/blog/11719/"},{"year":2013,"event":"2月、光華雜誌が、前年12月中旬に「農村美術館」が揭幕したと報じた。企画された展示場は17か所で、ほかに十数か所の美術装置が住民の生活の場に置かれている。集会所「鄉情客廳」は長く使われていなかった豚舎を改めたものだと書かれている。2002年に曾旭正が台南藝術大學の学生を連れて土溝へ実習に来たこと、2005年に村に残っていた1頭の水牛のために住民と学生が土角厝を直したことも記されている","source_url":"https://www.taiwan-panorama.com/Articles/Details?Guid=67f5bb2a-c2f9-4de7-8ede-4fb982393626&CatId=7"},{"year":2013,"event":"11月10日、前日に2年目の展示が開き、あわせて「農們囍宴音樂會」が開かれたと報じられた。記事は、千人規模の宴会に17人の農家が食材を出したこと、門票が2千元で売り切れ、所得が約150万元になったこと、費用を引いた残りを美術館の運営に充てるとしていることを書いている","source_url":"https://www.newsmarket.com.tw/blog/41970/"},{"year":2013,"event":"11月11日、同じ記者が展示の側を書いた。12人の芸術家が稲田・農舎・空き家で制作し、住民が自宅の三合院の前で市を開いたこと、豚舎を改めて図書室にしたこと、住民が「昔から学生がたくさん入ってくるので慣れている」と話したことが記されている。土溝農村美術館執行長の呂耀中は、運営はなお外部からの募金に頼っており、人手が無いため土日しか開けられないと述べている","source_url":"https://www.newsmarket.com.tw/blog/42004/"},{"year":2015,"event":"12月21日、公視「我們的島」が第837集で取り上げた。80歳の住民が型を彫って空き家の壁に絵を噴き付ける様子、芸術家に村へ住んでもらって制作の場と売る場を用意する試み、近くの小学校と版画で組む取り組みが伝えられている。番組は、芸術の側の経費が早い時期の行政の補助から募金へ移り、入場券の仕組みで財源を独立させることを考えていると書いている。人が増えて店が開く一方、老街の夜市のようにはしたくないという考えも記されている","source_url":"https://ourisland.pts.org.tw/content/2427"},{"year":2017,"event":"8月、藝術家雜誌が、デング熱の流行で入場料の収入が足りず店がみな一時休業し、美術館に関わる動きが1年余り止まったのち、その年の夏に再び始まったと書いた。記事は、この経験から協會が考え直したとして、催しの期間が50日あまりしかなく、それを頼りに起業した若者が食べていけないため、展示を生活のなかに置き直す必要があると書いている。作品を常設のものにすることは、その例として挙げられている。黃鼎堯は、経験をどう受け継ぐか、人材が途切れることが目下の困りごとだと述べている","source_url":"https://www.artist-magazine.com/edcontent_d.php?lang=tw&tb=8&id=621"},{"year":2019,"event":"12月27日、樹冠が黃鼎堯への取材を載せた。黃鼎堯は、藝術季を開くことは地方への宣言ではあるが、終わったあとはどうするのかと問うている。美術館の展示の期間が終わったあと、若者がその土地でどう生きるか、たまった力をどう続けるかが本当の試練の始まりだとも述べている。行政の資源については「毒薬ではないが、どう飲むかを知らなければならない」と述べ、次は同じ輪の外へ出て市場の側の仕事に自分を置くことにした、と樹冠は書いている","source_url":"https://canopi.tw/culture-and-lifestyle/togoartmuseum/"}],"editor_notes":"上下游新聞の2013年11月10日と11日の2本は、同じ記者が同じ開幕の週末を書いたものであり、独立した一次報道の本数としては1本として数えた。社企流（seinsights.asia）にも記事があるが、本文末に「2013/10/24 聯合報」とあり他紙の転載で、構造化された掲載日も無いため sources に入れていない。社區力點線面（ms-community.azurewebsites.net、2019年5月16日）は本文に「土溝」と「美術館」を分けて書いており、固有名詞の文字列としては第1層を通らなかった。同記事は南藝大の学生が入った年を2004年としており、光華雜誌・上下游新聞の2002年と食い違うが、出典に採れないため discrepancies には並べていない。──`status_current` を判定不能とした理由：藝術家雜誌（2017年8月）は「2012年から営運して5年」「近ごろ開いている展覧」と書いており、STATE §4 の「継続中」の条件（開始から3年以上あとの出典に現在も稼働している記述があること）は文字どおり満たしている。それでも判定不能を採ったのは、最新の出典である樹冠（2019年12月）が稼働を現在形では書かず、黃鼎堯が次は市場の側の仕事に自分を置くと語る回顧の枠になっているためで、そこから last_verified までを埋める出典が無い。2017年の時点で動いていたことは timeline に残した","last_verified":"2026-08-19","sections":{"何をしたか":"台南市後壁區の土溝里で、**村ぜんぶを美術館と呼ぶ**取り組みが2012年12月に始まった。2002年に台南藝術大學の学生が村へ入り、地元の土溝農村文化營造協會と一緒に、村に残った水牛の小屋を直し、大きな木の下の空間や塀に手を入れることを重ねてきた。\n\nその延長として「村は美術館、美術館は村」を掲げ、三合院の前庭・空き地・路傍の塀・個人の倉庫・家屋など17か所を企画の展示場にした。開幕の日の主展示場は、刈り取りの済んだ稲田だった。80歳を過ぎてから絵を習った住民の家の客間も展示場になり、使われなくなった豚舎は集会所や図書室に改められた。\n\n美術館の計画の経費は、行政の補助によらず民間の募金で集めたと光華雜誌は2013年2月に書いている。2013年11月には千人規模の宴会を開いて資金を募った。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"us-0001","name":"廃止された高架貨物線を、そのまま2.4kmの公園にした","name_local":"High Line","country":"アメリカ合衆国","region":"ニューヨーク州","municipality":"ニューヨーク市（マンハッタン）","population_current":8585000,"population_scale":"25万超","purpose":"空間をひらく","theme":"交通・道路・駅","start_year":2009,"funding_scale":"建設費はおよそ1億8,700万ドルで、うち1億2,300万ドルを市が出した（Spur 区間を除く。ARCHITECT 2019年9月10日）。運営費の約9割は Friends of the High Line が調達している（Gothamist 2024年7月24日）","end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"ニューヨーク市と Friends of the High Line（501(c)3）","component_types":"hard","components":["廃止された高架貨物線を公園にした","非営利団体が運営を引き受けた","2.4kmの遊歩道として通した","沿線に美術館と大規模開発が付いた"],"sources":[{"url":"https://nonprofitquarterly.org/2014/09/25/controversial-nyc-high-line-completed-to-fanfare-and-debate","title":"NYC High Line Completed：Is it a Net Positive for NYC?","outlet":"Nonprofit Quarterly","published":"2014-09-25","language":"en","from_operator":false},{"url":"https://globalnews.ca/news/5371763/new-york-high-line-park-10-years/","title":"10 years later, New York's High Line park brought big change — and gentrification","outlet":"Global News（AP 配信）","published":"2019-06-09","language":"en","from_operator":false},{"url":"https://www.architectmagazine.com/design/urbanism-planning/the-high-line-at-10_o","title":"The High Line at 10","outlet":"ARCHITECT（Karrie Jacobs）","published":"2019-09-10","language":"en","from_operator":false},{"url":"https://gothamist.com/arts-entertainment/how-the-high-line-changed-nyc-a-poster-child-for-gentrification-and-adaptive-reuse","title":"How the High Line changed NYC: A 'poster child' for gentrification and adaptive reuse","outlet":"Gothamist（WNYC）","published":"2024-07-24","language":"en","from_operator":false}],"context_sources":[{"url":"https://s-media.nyc.gov/agencies/dcp/assets/files/pdf/data-tools/population/population-estimates/new-york-city-population-estimates-and-trends-july-2026.pdf","title":"New York City's Population Estimates and Trends 2026 July Release（8,585,000人・2025年7月時点）"}],"unknown_fields":[],"latest_source_year":2024,"elapsed_years":15,"follow_up":"濃い","follow_up_note":"2009年6月に開園し、2014年9月にレールヤード区間、2019年6月に最後の Spur 区間が加わった。2019年6月の報道は年間約800万人が訪れる一方でジェントリフィケーションの原因だとする批判があると伝え、2024年7月の15年目の検証では、運営団体がその影響を認めて他都市に助言する High Line Network を立ち上げたことが語られている。","timeline":[{"year":2009,"event":"6月に開園した。建設費はおよそ1億8,700万ドルで、うち1億2,300万ドルを市が出した","source_url":"https://www.architectmagazine.com/design/urbanism-planning/the-high-line-at-10_o"},{"year":2014,"event":"9月20日、レールヤード区間の公式開園。Friends of the High Line が式典を主導した","source_url":"https://nonprofitquarterly.org/2014/09/25/controversial-nyc-high-line-completed-to-fanfare-and-debate"},{"year":2019,"event":"年間推定800万人が訪れる。沿線に高層の高級コンドミニアムが並び、批判も出ている","source_url":"https://globalnews.ca/news/5371763/new-york-high-line-park-10-years/"},{"year":2019,"event":"6月、最後の区間 Spur が開園し全区間がそろった","source_url":"https://www.architectmagazine.com/design/urbanism-planning/the-high-line-at-10_o"},{"year":2024,"event":"7月、開園15年の検証で、エレベーターの長期停止という利用上の問題と、運営団体が他都市に助言する High Line Network を始めたことが語られた","source_url":"https://gothamist.com/arts-entertainment/how-the-high-line-changed-nyc-a-poster-child-for-gentrification-and-adaptive-reuse"}],"last_verified":"2026-08-17","sections":{"何をしたか":"マンハッタン西側に放置されていた高架貨物線を、そのまま高い位置を通る2.4kmの遊歩道型の公園に変えたもの。所有はニューヨーク市で、運営は非営利団体 Friends of the High Line が担っている。**開園は2009年6月である**（ARCHITECT 2019年9月10日・Gothamist 2024年7月24日）。2014年9月20日には最後のレールヤード区間が公式に開園し、同団体が地域住民・ボランティア・事業者の行進を先導した（Nonprofit Quarterly 2014年9月25日）。**さらに2019年6月に Spur 区間が加わって全区間がそろった**ため、「開園年」は区間ごとに2009年・2014年・2019年と分かれる。ここでは最初の開園である2009年を `start_year` に採った。建設費は Spur を除いておよそ1億8,700万ドルで、うち1億2,300万ドルを市が出している。2019年6月9日のAP配信記事によれば、かつて工場・駐車場・自動車修理業の並ぶ一帯だった沿線は、一方の端にホイットニー美術館、もう一方の端に250億ドル規模の複合開発ハドソンヤードを抱える区域に変わり、年間推定800万人が訪れている。**同記事は同時に、公園が高層の高級コンドミニアムに挟まれるようになったこと、市外からの来訪者で混み合うこと、そして一部の批判者が急激なジェントリフィケーションの原因を High Line に帰していることを伝えている。**","誰が始めたか":"**壊す側と残す側が争ったところから始まっている。** 1980年に最後の列車が走ったあと、高架は20年ほど放置された。Gothamist（2024年7月24日）に出た歴史家 Annik LaFarge の説明では、取り壊しを求めたのは高架の下の土地を持つ人たちで、撤去後に上へ建てられれば大きな利益になるからだった。ARCHITECT（2019年9月10日）で共同創設者の Robert Hammond は、1990年代のジュリアーニ市長が10番街を高層住宅の並ぶ通りにしたがっており、高架をその障害と見ていたと語っている。\n\n**残す側は住民2人から始まった。** Robert Hammond と Joshua David は**1999年のコミュニティ委員会の会合で出会い**、取り壊しをめぐる議論の場で知り合った。2人は実際に高架に上がり、これを見て「もっと良く、もっと面白いことができる」と考えたと LaFarge は述べている。2人がつくった Friends of the High Line が、いまも運営を担う。\n\n**所有と運営は分かれている。** 高架はもともとの鉄道会社の後継である CSX から市に寄贈され、**所有はニューヨーク市、管轄はニューヨーク市公園レクリエーション局**にある。そのうえで Friends of the High Line が公園の管理者（steward）となる形で、当時としては新しい官民連携の形だったと LaFarge は説明している。","いくらかかったか":"**建設費はおよそ1億8,700万ドルで、うち1億2,300万ドルを市が出した**（ARCHITECT 2019年9月10日）。これは最後の Spur 区間を除く額である。\n\n**この投資は税収を前提に組まれていた。** 同記事によれば、公園沿いの開発の多くは**2005年の用途地域変更**の結果であり、**追加の固定資産税収が建設費を上回るという想定**のもとで進められた。当初の見込みは市の固定資産税収を2億5,000万ドル増やすというもので、その後**2038年までに9億ドル**へ引き上げられた。\n\n**運営費は市が出していない。** Friends of the High Line が**運営に必要な資金のおよそ9割を自ら調達している**（Gothamist 2024年7月24日）。個人や団体からの寄付が中心である。","真似するなら最低何が必要か":"この事例で真似できる単位は、高架の公園そのものではなく**所有・運営・資金の分け方**である。\n\n第一に、**壊す前に上がってみる**こと。Hammond と David は取り壊しの議論の場で出会い、実際に高架に上がって残す側に回った。**残す判断は、上に立ってからされている。**\n\n第二に、**所有と運営を分ける**こと。所有は市、管轄は公園局、管理は非営利団体という形で、**運営費の9割を市の外から調達する構造**になっている。行政の予算だけでは維持できない規模の公園を、行政の所有のまま持てる。\n\n第三に、**用途地域の変更と一体で立てる**こと。建設費は追加の固定資産税収で回収する想定で、実際に2005年の用途地域変更が沿線の開発を呼んだ。**公園単体の事業として立てると、この回収の道筋が無い。**\n\n第四に、**開くのを区間ごとに分ける**こと。2009年6月に最初の区間、2014年9月にレールヤード区間、2019年6月に Spur 区間と、**10年かけて順に開いている。** 全体が仕上がるのを待っていない。\n\n第五に、**ジェントリフィケーションを起きたあとに扱わない**こと。運営団体はその影響が著しくなったことを早い段階で認識し、他都市に助言する High Line Network を立ち上げた（Gothamist 2024年7月24日）。**同記事によれば、伝えている内容は地域住民を意思決定に入れることや、資金調達の実務である。** 逆に言えば、この事例では**最初の設計にそれが入っていなかった。**\n\n第六に、**エレベーターを運営の中心に置く**こと。2024年の番組では、車椅子を使う視聴者が、エレベーターが数週間から1年単位で止まることがあると述べている。**高い位置の公園は、昇降機が止まると入口そのものが消える。**","今どうなっているか":"2026年8月時点で確認できたのは、2024年7月24日の Gothamist（WNYC）の記事までである。\n\n**ジェントリフィケーション批判に対して、運営団体は否定ではなく対応で応じている。** 2024年7月、開園15年にあたって WNYC の番組に出た歴史家 Annik LaFarge は、Friends of the High Line が**ジェントリフィケーションの影響が著しくなったことを早い段階で認識した**うえで、そこで得た教訓——地域住民を意思決定に入れること、地方政治の扱い方、資金調達の実務——を他都市に伝えるために High Line Network を立ち上げた、と述べている。同氏によれば、この公園はジェントリフィケーションの代表例であると同時に、産業遺構の転用の代表例にもなった。**運営団体が批判そのものを否定した発言は確認できなかった。**\n\n同じ LaFarge は、自身が15年間この地区に住んだ立場から、**街区がより白人的で裕福な場所に感じられるようになったこと**、工事の騒音や粉塵が続いたこと、そして**年6,000ドル程度の学費で地元の子が通えていた Church of the Guardian Angel School が閉校したこと**を挙げている。数ブロック北には学費が4万〜6万ドル規模の学校があるという。\n\n**利用上の問題も同じ番組で出ている。** 車椅子を使う視聴者が、エレベーターが数週間から1年単位で止まることがあり、16丁目のものが停止していると述べた。これに対し LaFarge は、エレベーターは当初から問題であり、運営団体は復旧に強く取り組んでいる、14丁目のものは稼働していると答えている。**市または Friends of the High Line 自身による説明は確認できなかった。**\n\n**「High Line が地区を変えた」という因果そのものに留保をつける見方もある。** ARCHITECT の10年目の検証（2019年9月10日）で Karrie Jacobs は、公園沿いの開発の多くは**2005年の用途地域変更**の結果であり、追加の固定資産税収が建設費を上回るという想定のもとで進められたと書いたうえで、**High Line が無くてもマンハッタン西側の再開発は起きただろう**と述べている。
