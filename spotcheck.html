try":"ギリシャ","region":"アッティカ地方","municipality":"アテネ市キプセリ地区（フォキオノス・ネグリ通り）","population_current":637798,"population_scale":"25万超","purpose":"空間をひらく","theme":"商店街・市場","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"アテネ市と、建物を使い続けた地区の住民。運営者は公募で選ばれた","component_types":"hybrid","components":["住民が取り壊しを止めた","住民が自主管理で使い続けた","市が改修して屋上を緑化した","運営者を公募で選び5年の計画を課した"],"sources":[{"url":"https://www.tovima.gr/2012/08/23/society/i-dimotiki-agora-kypselis-ksana-stin-eythyni-toy-dimoy-athinaiwn/","title":"Η Δημοτική Αγορά Κυψέλης ξανά στην ευθύνη του Δήμου Αθηναίων","outlet":"Το Βήμα","published":"2012-08-23","language":"el","from_operator":false},{"url":"https://www.naftemporiki.gr/society/906799/ton-oktovrio-i-anadeixi-tou-neou-diacheiristi-tis-dimotikis-agoras-kypselis/","title":"Τον Οκτώβριο η ανάδειξη του νέου διαχειριστή της Δημοτικής Αγοράς Κυψέλης","outlet":"Ναυτεμπορική","published":"2016-09-21","language":"el","from_operator":false},{"url":"https://www.tovima.gr/2018/10/04/society/i-dimotiki-agora-tis-kypselis-anoikse-tis-portes-tis-sto-koino/","title":"Η Δημοτική Αγορά της Κυψέλης άνοιξε τις πόρτες της στο κοινό","outlet":"Το Βήμα","published":"2018-10-04","language":"el","from_operator":false}],"context_sources":[{"url":"https://www.naftemporiki.gr/society/1355155/apografi-2021-pou-afxithike-pou-meiothike-o-plithysmos-tis-choras/","title":"Ναυτεμπορική（2021年センサス。アテネ市の人口 637,798人）"}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2018,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、記録は2012年から2018年にわたる。2012年に市が改修に乗り出す一方で住民の自主管理との関係が問われ、2016年には17件の応募から4組が絞られ、2018年10月に改修を終えて開いた。","timeline":[{"year":2012,"event":"8月、市が改修工事・内部の手入れ・屋上の緑化を打ち出した。記事は、放置されていた市場が住民の手で得た社会的な性格と、これらが両立するのかを論点として挙げている","source_url":"https://www.tovima.gr/2012/08/23/society/i-dimotiki-agora-kypselis-ksana-stin-eythyni-toy-dimoy-athinaiwn/"},{"year":2016,"event":"9月、運営者を選ぶ手続きが第2段階に入った。17件の応募のうち4組が第1段階を通過しており、5年間の運営計画とあわせて最終提案を出すよう求められた","source_url":"https://www.naftemporiki.gr/society/906799/ton-oktovrio-i-anadeixi-tou-neou-diacheiristi-tis-dimotikis-agoras-kypselis/"},{"year":2018,"event":"10月4日、全面改修を終えた市場が正式に開いた。8つの新しい店舗のほか、展示と文化活動の場が入り、既存の市民窓口とあわせて地区の新しい拠点になったと報じられた","source_url":"https://www.tovima.gr/2018/10/04/society/i-dimotiki-agora-tis-kypselis-anoikse-tis-portes-tis-sto-koino/"}],"last_verified":"2026-08-17","image":{"url":"https://www.tovima.gr/wp-content/uploads/2008/10/08/12417520_h0891398.jpg","type":"photo","relevance_confirmed":true,"credit":"Το Βήμα","source_url":"https://www.tovima.gr/2012/08/23/society/i-dimotiki-agora-kypselis-ksana-stin-eythyni-toy-dimoy-athinaiwn/"},"sections":{"何をしたか":"アテネ市キプセリ地区の歩行者道フォキオノス・ネグリ通りにある市営市場の建物を、**住民が取り壊しから守り、そのあと市が改修して、運営者を公募で選んだ。**\n\nトゥ・ヴィマの2012年の記事によれば、この市場はかつて放置されていた。それを地区の住民が使い続け、**創作と連帯の自主管理の場として6年にわたって「生きた」状態に保った。** 記事は、**建物を取り壊してもう1つの商業施設を建てる案から、この市場を救ったのは地区の住民である**と明記している。\n\n2012年、市は改修工事、内部の手入れ、屋上の緑化を打ち出した。2018年10月4日、全面改修を終えた市場が正式に開き、8つの新しい店舗と、展示および文化活動の場が入った。","誰が始めたか":"**住民である。** ただし現在の姿を作ったのは市である。2012年の記事は、この二重性をそのまま論点として書いている——市の改修が、**住民が作ってきた社会的な性格および地区の運営への関与と両立するのか**、という問いである。\n\n運営者の選び方には手続きがある。2016年の記事によれば、市は運営者を公募し、**17件の応募**を受けた。市が設けた助言の作業部会——都市計画家、作家、元大臣、企業グループの会長、市民社会担当の副市長で構成される——が全会一致で4組に絞り、その4組が**5年間の運営計画**を含む最終提案を出すよう求められた。","いくらかかったか":"**確認できなかった。** 改修費も運営者への支払いも、今回の出典には金額として出てこない。`funding_scale` は `unknown_fields` に挙げている。","真似するなら最低何が必要か":"1. **取り壊しを止める側がいること。** この建物が残ったのは、住民が別の商業施設への建て替えを止めたからである。**改修の話はそのあとに来ている**\n2. **空白期間を「使い続ける」こと。** 放置された6年ではなく、自主管理で使われた6年だった。使われている建物は壊しにくい\n3. **運営者を公募で選ぶ仕組み。** 17件から4組に絞り、5年の運営計画を課している。**改修して終わりにせず、誰がどう回すかを先に決めている**\n4. **選ぶ側の作業部会を組むこと。** 都市計画・文学・行政・経済・市民社会という異なる立場を混ぜている\n\n**確認できない**のは、改修費、最終的に選ばれた運営者、そして**住民の自主管理が改修後の運営にどう引き継がれたのか**である。2012年に提起された問いに対する答えを、今回の出典は持っていない。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2018年10月4日のトゥ・ヴィマの記事である。夕方から人が詰めかけ、訪れたのは主に地区の住民だった。8つの新しい店舗と、展示・文化活動の場を見て回ることができ、同じ建物に入っている市民窓口とあわせて、**地区の新しい拠点になり、商業と文化の面から地区を動かしている**と同紙は書いている。\n\n**最新の出典が8年前である。** 2018年以降にこの市場がどう運営されてきたか、5年の運営計画がどう履行されたかは、今回の探索範囲では確認できていない。\n\n否定的な報道は、今回探した範囲では見つからなかった。ただし2012年の記事が投げかけた「市の改修と住民の自主管理は両立するのか」という問いに、**その後どう答えが出たのかを確かめられていない。** これは評価ではなく、記録の空白である。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"gr-0002","name":"財団が国立図書館と国立オペラの新しい建物と公園をつくり、完成後に国へ引き渡した","name_local":"Κέντρο Πολιτισμού Ίδρυμα Σταύρος Νιάρχος","name_variants":["Κέντρου Πολιτισμού Ίδρυμα Σταύρος Νιάρχος","Κέντρο Πολιτισμού Ιδρυμα Σταύρος Νιάρχος","Κέντρου Πολιτισμού Ιδρυμα Σταύρος Νιάρχος"],"country":"ギリシャ","region":"アッティカ地方","municipality":"カリシア市（ファリロ湾）","population_current":74351,"population_scale":"5万〜25万","purpose":"誇りをつくる","theme":"学校・公共施設","start_year":2017,"end_year":null,"status_current":"継続中","actor_type":"財団・助成機関","lead_actor":"イドリマ・スタヴロス・ニアルフォス（ΙΣΝ）。設計はレンゾ・ピアノ。完成後の所有はギリシャ国家","component_types":"hard","components":["国立図書館と国立オペラを1か所に移した","人工の丘を盛り建物をその下に収めた","隣接して公園をつくった","工事中から来訪者センターを開いた","引き渡し後も財団が運営費を寄付する"],"sources":[{"url":"https://www.tovima.gr/2016/02/22/culture/i-prwti-xrisi-twn-ktiriwn-toy-kentroy-politismoy-idryma-stayros-niarxos/","title":"Η πρώτη χρήση των κτιρίων του Κέντρου Πολιτισμού Ιδρυμα Σταύρος Νιάρχος","outlet":"Το Βήμα","published":"2016-02-22","language":"el","from_operator":false},{"url":"https://www.naftemporiki.gr/culture/1455349/to-idryma-stayros-niarchos-ananeonei-tin-ypostirixi-toy-pros-to-kentro-politismoy-idryma-stayros-niarchos/","title":"Το Ίδρυμα Σταύρος Νιάρχος ανανεώνει την υποστήριξή του προς το Κέντρο Πολιτισμού Ίδρυμα Σταύρος Νιάρχος","outlet":"Ναυτεμπορική","published":"2023-03-28","language":"el","from_operator":false},{"url":"https://www.tovima.gr/2025/02/23/market/okto-xronia-kpisn-gia-mia-pio-isotimi-viosimi-kai-synektiki-koinonia/","title":"Οκτώ Χρόνια ΚΠΙΣΝ: για μία πιο ισότιμη, βιώσιμη και συνεκτική κοινωνία","outlet":"Το Βήμα","published":"2025-02-23","language":"el","from_operator":false},{"url":"https://www.naftemporiki.gr/culture/ekdilos lifo.gr/now/greece/adrianeio-ydragogeio-tha-prosferei-kai-pali-nero-toy-ston-dimo-halandrioy-meta-apo-19"},{"year":2023,"event":"12月9日、中国の広州で行なわれた都市の革新の国際的な賞を受けたことが伝えられた。記事は、54か国193自治体の274件の中から選ばれたこと、水道が溜める水が捨てられずに飲まない水として住民に渡ること、水道から遠い地区には給水車で配ることを書いている","source_url":"https://www.ertnews.gr/eidiseis/epistimi/diethnis-diakrisi-gia-to-adrianeio-ydragogeio-sto-xalandri/"},{"year":2024,"event":"10月11日、事業の担当者がテレビの番組で話した。同氏は、水道が半径10kmに及ぶこと、年に15,000立方メートルを超える水を使えるようにするために貯水槽をつくっていること、2024年の終わりから2025年の初めに最初の試験的な通水を行なう見込みだと述べている","source_url":"https://www.megatv.com/2024/10/11/adrianeio-ydragogeio-emvlimatiko-ergo-eksoikonomisis-nerou-gia-tous-dimotes-xalandriou/"},{"year":2024,"event":"12月16日、アテネ上下水道公社が2025年3月から、申し込んで配管につないだ住民への試験的な供給を始めると伝えられた。記事は、当初の想定が約70件だったのに対し申し込みが3倍を超え、公社が追加の設備を補強したことを書いている","source_url":"https://www.protothema.gr/stories/article/1576170/adrianeio-udragogeio-romaiki-lusi-1863-eton-gia-to-provlima-tis-leipsudrias-stin-athina/"},{"year":2025,"event":"3月、市長が取材に答えた。同氏は、事業が2019年に申請され2020年に欧州委員会に承認されたこと、23か国223件の提案から選ばれ45百万ユーロを分け合う11市に入ったこと、7者が参加し市が主導すること、事業の実施が1年半前に始まったことを述べている。記事は費用が6百万ユーロを超える見通しだと書いている（応募件数は Πρώτο Θέμα が222件と書いており食い違う。discrepancies に並置した）","source_url":"https://www.mononews.gr/politics/adrianeio-ydragogeio-ependyseis-ano-ton-6-ekatommyrion-evro-sto-dimo-chalandriou"}],"last_verified":"2026-08-19","image":{"url":"https://www.ertnews.gr/wp-content/uploads/2023/12/ydraaogeio-el-alamein.webp","type":"photo","relevance_confirmed":true,"credit":"ΕΡΤ","source_url":"https://www.ertnews.gr/eidiseis/epistimi/diethnis-diakrisi-gia-to-adrianeio-ydragogeio-sto-xalandri/"},"sections":{"何をしたか":"アテネ北部のハランドリ市が、**ローマ時代につくられた地下水道に水を通し直し、飲まない水を配る配管網を市内に引いた。**\n\n事業の担当者は、水道の水がそれまで使われずに海へ流れていたと述べている。市とアテネ上下水道公社が全長4kmの配管と貯水槽をつくり、庭の水やりや洗い場に使える水として住民に渡す。配管から遠い地区には給水車で配る。mononews は、事業に広場の手直しと植栽、地下の配管網、共同体の設立、文化の催しが含まれると書いている。\n\nΠρώτο Θέμα は、市が2019年に提案をまとめ、欧州連合の担当機関が選んだ11件のうちの1つになったと書いている。事業の費用は6百万ユーロを超える見通しである。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"hu-0001","name":"100歳の家を祝う催しとして2011年に始まり、住んでいる人と有志が1週末だけ家を開ける。主題は年ごとに変わってきた","name_local":"Budapest100","name_variants":["Budapest 100"],"country":"ハンガリー","region":"ブダペスト","municipality":"ブダペスト市","population_scale":"25万超","purpose":"誇りをつくる","theme":"文化・アート・祭り","start_year":2011,"end_year":null,"status_current":"継続中","actor_type":"NPO","lead_actor":"Kortárs Építészeti Központ（KÉK）。2020年9月の回について PestBuda は「Kortárs Építészeti Központ と OSA Archívum の主催」と書いている。2026年の回は5月8日に Blinken OSA Archivum で開幕すると告知された。参加する家の側では、家の住民と、有志（önkéntesek）および地元好きの人たち（lokálpatrióták）が催しを用意する","component_types":"soft","components":["100歳になる家を住民が開ける","有志が家の歴史を調べて展示する","案内は家の住民と有志が担う","主題を年ごとに変えて家を募る","催しをすべて無料にする"],"sources":[{"url":"https://pestbuda.hu/cikk/20200923_nyitott_hazak_tart_udvarok_kulonleges_vilaga_ilyen_volt_a_tizedik_budapest100","title":"Nyitott házak, tárt udvarok különleges világa – Ilyen volt a tizedik Budapest100","outlet":"PestBuda","published":"2020-09-23","language":"hu","from_operator":false},{"url":"https://kultura.hu/szazotven-eves-epuletek-nyilnak-meg-az-idei-budapest100-program-reszekent-majusban/","title":"Százötven éves épületek nyílnak meg az idei Budapest100 program részeként májusban","outlet":"kultura.hu","published":"2023-04-05","language":"hu","from_operator":false},{"url":"https://pestbuda.hu/cikk/20230412_szazotven_eves_epuletek_nyilnak_meg_majusban","title":"Százötven éves épületek nyílnak meg májusban","outlet":"PestBuda","published":"2023-04-12","language":"hu","from_operator":false},{"url":"https://pestbuda.hu/cikk/20250513_szamos_haz_es_kozossegi_kert_nyitja_meg_a_kapuit_majusban","title":"Számos ház és közösségi kert nyitja meg a kapuit májusban","outlet":"PestBuda","published":"2025-05-13","language":"hu","from_operator":false},{"url":"https://hvg.hu/kultura/20260422_budapest100-majus-9-10-nyitott-hazak-hetvegeje-programajanlo-orban-viktor-mes ":"濃い","follow_up_note":"2020年9月に10回目が行われ、14の区で50軒を超える家が門を開いた。2025年5月には80近い家と共同菜園、2026年5月には16回目が告知されており、主題は年ごとに変わっている。","timeline":[{"year":2011,"event":"2011年に始まった取り組みで、その年に100歳になる家を祝い、そのうち何軒かを見せることを目的にしていると HVG は2026年4月22日の記事で書いている。同じ記事は、100年前は、戦争で傷んだ首都に家がわずかしか建たなかったため、2016年から主題を変えたとも書いている","source_url":"https://hvg.hu/kultura/20260422_budapest100-majus-9-10-nyitott-hazak-hetvegeje-programajanlo-orban-viktor-mester-utca-lakas-tisztviselotelep-al-habtoor-hotel"},{"year":2020,"event":"9月19〜20日の週末に10回目が行われた。PestBuda は Kortárs Építészeti Központ と OSA Archívum の主催と書いている。標語は「Minden ház érdekes!」で、10回目にあたるこの年はどの家でも参加でき、ブダペストの14の区で50軒を超える家が門を開いた。記者は住民と話し、家の歴史の展示や図面・写真を見たと書いている。この年は通例の春の週末から秋にずれた","source_url":"https://pestbuda.hu/cikk/20200923_nyitott_hazak_tart_udvarok_kulonleges_vilaga_ilyen_volt_a_tizedik_budapest100"},{"year":2023,"event":"4月5日、kultura.hu が、KÉK の建築と文化の催しは2011年から毎年、家の住民たちと街の住民たちを結び合わせてきたと書いた。1873年の市の合併150年にちなみ、この年は150歳の建物に声をかけ、そのうち50軒が5月の催しに加わると伝えている。4日間の日程で、5月11日に3つの市域での共同の作品づくりから始まり、12日は散歩の日、13〜14日が nyitott házak hétvégéje になるとされ、Városvariációk という共同の作品の公募も告知された。すべての催しは無料だと書いている","source_url":"https://kultura.hu/szazotven-eves-epuletek-nyilnak-meg-az-idei-budapest100-program-reszekent-majusban/"},{"year":2023,"event":"4月12日、PestBuda が、5月13〜14日に150歳の建物が開くと伝えた。50か所が加わるとされる。主催する Kortárs Építészeti Központ（KÉK）は、1872〜73年に全部または一部が建ち今も立つ首都の建物を200以上集め、サイトで公開したと書かれている","source_url":"https://pestbuda.hu/cikk/20230412_szazotven_eves_epuletek_nyilnak_meg_majusban"},{"year":2025,"event":"5月13日、PestBuda が、KÉK が MTI に伝えたところとして、5月24〜25日の Nyitott Házak Hétvégéje に記録的な、80近い家と共同菜園が門を開くと書いた。42の建物の住民、19の施設で働く人、16の菜園の世話をする人が加わるとされる。ブダペストの14の区にわたり、この年は住宅・職場・共同の場・菜園の緑地に焦点を置くと書かれている。4日間の無料の日程は5月22日の専門家の日から始まるとされた","source_url":"https://pestbuda.hu/cikk/20250513_szamos_haz_es_kozossegi_kert_nyitja_meg_a_kapuit_majusban"},{"year":2026,"event":"4月22日、HVG が、5月9〜10日に Kortárs Építészeti Központ（KÉK）が16回目の nyitott házak hétvégéje を開くと書き、40の建物を回れるようになると伝えた。この年は100年を広く取って1916〜1926年に建った家から見せるとされる。主催者は火曜日に報道向けの散歩でこの年開く家のうち4軒を見せたと書かれている。前年は都市の緑地に焦点を置いたとも書いている","source_url":"https://hvg.hu/kultura/20260422_budapest100-majus-9-10-nyitott-hazak-hetvegeje-programajanlo-orban-viktor-mester-utca-lakas-tisztviselotelep-al-habtoor-hotel"},{"year":2026,"event":"4月29日、PestBuda が、KÉK から届いた報道向けの発表として、この年は41の住宅と施設が門を開くと伝えた。5月8日に Blinken OSA Archivum での催しで開幕するとされ、これまでに開いた家の経験と、1916〜1926年に建った家の移り変わりを知る場になると書かれている。無料の催しは有志と地元好きの人たちが、家の住民や参加する施設の代表の助けを借りて用意するとされる","source_url":"https://pestbuda.hu/cikk/20260429_szazeves_epuletek_nyilnak_meg_majusban"}],"editor_notes":"出典は3つの発行元（PestBuda・kultura.hu・HVG）にまたがる。**7本のうち6本は掲載日より後の日付を本文に持つ告知である**（2023年4月5日／4月12日は5月13〜14日、2025年5月13日は5月24〜25日、2026年4月22日・4月29日は5月8〜10日、2026年5月4日は5月9〜10日）。実際に行われた回を報じているのは2020年9月23日の PestBuda（9月19〜20日の回の見聞記）だけである。**2023年の2本の関係については、当初「記事全体が同じ発表に由来する」と書いたが、重なるのは一段と日程だけだと分かったので範囲を狭めた。** kultura.hu 2023年4月5日は本文に KÉK の közlemény を明示している（`mutatnak rá a közleményben`）が、PestBuda 2023年4月12日には közlemény 系の語が1度も出ず、末尾の出所は「Forrás：budapest100.hu, Pestbuda」で、本文の大半は自前の調べもの（1872〜73年の建設戸数を区ごとに並べた内訳、Batthyány 廟や Rumbach 通りのシナゴーグの解説）である。**両者の逐語一致は25字以上が複数ある**——前後の空白を含めて最長62字（`a városegyesítés korának társadalmi, gazdasági és kulturális`）、55字（`Az 1873-as városegyesítés 150. évfordulója alkalmából`）、見出しどうしも37字（いずれも前後の空白を含む長さで、文字列そのものは60字・53字・35字）。**62字の箇所は、両紙とも主催者に帰属を明記した同じ一文の中にある**——kultura.hu は `mutatnak rá a közleményben`（発表でそう指摘している）、PestBuda は `A szervezők azt ígérik`（主催者はこう約束している）と書く。したがって「誰でも書く句」ではない。**由来について書ける範囲はここまでである**——催しの趣旨を述べた一段と日程は、主催者が出した文（発表か budapest100.hu か、記事からは特定できない）に由来する。**見出しの由来は判定しない。** 37字が一致するのは2紙どうしの関係を示すだけで、どちらの記事も見出しの出所を書いていないからである。／**§3 で本数を数えるときは、記事を丸ごと外すのではなく主張の単位で見ること。** 催しの趣旨を述べた一段・日程・見出しについては、2023年の2本を1本として数える。それ以外の記述（PestBuda の建設戸数の内訳など）は別々に数えてよい。／**KÉK の発表の書き直しである3本を区別しておく**——2023年4月5日（közlemény を明示）、2025年5月13日（`közölte ... az MTI-vel`。末尾が「Forrás：MTI」）、2026年4月29日（`a lapunkhoz is eljuttatott sajtóközleményében`。末尾が「Forrás：KÉK - Kortárs Építészeti Központ」）。**発表の書き直しでない3本**は、PestBuda 2020年9月23日（署名 Andrássy Dorottya。9月19〜20日の回の見聞記）、HVG 2026年4月22日（署名 Szentirmai Áron。報道向けの散歩に同行）、kultura.hu 2026年5月4日（署名 Drávucz Zsolt。**ただし現地取材ではなく自前の調べもので、Bethlen-udvar と Puskin mozi の記述は本文で Pestbuda.hu に、Corvin は budapest100.hu に出所を明示している**）である。／**引用中の全角コロン `：` は、原文の半角コロン `:` を YAML の破れを避けるために置き換えたものである。** **ジョブ表の「Újbuda（第11区）」という限定は出典で裏が取れなかった**——PestBuda は2020年と2025年について「Budapest tizennégy kerületében」（14の区）と書いており、区を限った催しではない。第11区は2020年の記事で回った区の1つとして出てくるだけである。発行元の所有について——PestBuda の末尾は「© 2026 Látóhatár Kiadó Lap-és Könyvkiadó Kft.」、HVG は「HVG Kiadó Zrt. © 2026」で、いずれも運営主体の KÉK とは別である（kultura.hu の末尾には社名の表示が無い）。**費用は7本のどこにも出ていない**（kultura.hu 2023年4月5日は「A Budapest100 minden programja ingyenes」と、来場者にとって無料であることだけを書いている）ので funding_scale は行ごと消して申告した。stub のため「何をしたか」以外の4節は空のまま置いている。","last_verified":"2026-08-20","image":{"url":"https://img.hvg.hu/Img/8133bb77-3fc3-490f-b374-cb198a0455cc/f3d1382d-dcb8-499b-81c7-7b80e7f0f26f.jpg","type":"photo","relevance_confirmed":true,"credit":"HVG","source_url":"https://hvg.hu/kultura/20260422_budapest100-majus-9-10-nyitott-hazak-hetvegeje-programajanlo-orban-viktor-mester-utca-lakas-tisztviselotelep-al-habtoor-hotel"},"sections":{"何をしたか":"ブダペストで、住んでいる人と有志が1週末だけ家を開ける催しである。もともとはその年に100歳になる家を祝うものとして作られたと2026年の記事は書いている。運営は Kortárs Építészeti Központ（KÉK）で、2011年に始まったと2023年と2026年の記事は書いている。家ごとに住民と有志が来訪者を迎え、家の歴史を調べて展示や案内を用意する。主題の取り方は途中で変わっている。100年前は、戦争で傷んだ首都に家がわずかしか建たなかったことを理由に2016年から主題を変えたと HVG は書いている。2023年は市の合併150年にちなんで150歳の建物、2025年は緑地、2026年は1916〜1926年に建った家が主題だと告知された。参加する数は年で違い、2020年の10回目は14の区で50軒を超えた。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"ie-0001","name":"町なかの旧修道院を、高齢者が独りで暮らせる住まいと文化の場に変えた","name_local":"McAuley Place","country":"アイルランド","region":"キルデア県","municipality":"ナース","population_current":26180,"population_scale":"5万人未満","purpose":"住む人を増やす・戻す","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2000,"end_year":null,"stat -stop-the-use-of-chemicals-in-farms-succeed"},{"year":2023,"event":"4月、州の6郡28農場・3作期の比較試験で落花生の子実収量が30〜40%高かったとする論文が報じられた。当時63万戸が対象だった","source_url":"https://www.downtoearth.org.in/agriculture/not-just-green-natural-farming-in-andhra-yielded-more-produce-than-conventional-methods-shows-study-88713"},{"year":2024,"event":"8月、Gulbenkian Prize for Humanity の共同受賞として紹介された。100万戸超・50万ヘクタールに達したとされる","source_url":"https://gulbenkian.pt/en/read-watch-listen/andhra-pradesh-community-managed-natural-farming/"}],"last_verified":"2026-08-19","sections":{"何をしたか":"インド・アーンドラ・プラデーシュ州で、**買ってくる資材をやめ、手元の牛の糞と尿とマルチで作る農法へ、小農を州ぐるみで移していった**取り組み。Fundação Calouste Gulbenkian（2024年8月2日）によれば、これは**女性が大半を占める小農**を、化学資材に頼る農業から「自然農法」へ移すための州全域の事業で、**2016年に州政府が、農業の経済的な苦境と気候変動による農家の困窮への対応として立ち上げた。**\n\n**やり方は資材の置き換えである。** Down To Earth（2023年4月11日）によれば、この農法は化学の肥料も農薬も使わず、**在来牛の糞と尿を使った手作りの資材とマルチだけを用い、資材の購入を伴わない。** 有機農法との違いもそこにあり、有機農法は化学資材を使わないものの、厩肥やミミズ堆肥といった買ってくる有機資材を用いる（同）。\n\n**規模は州の農家全体を狙っている。** Scroll.in（2019年2月13日）によれば、州は12,494のグラム・パンチャーヤト（村落自治体）にまたがる600万戸の、大半が小農・零細農である農家に働きかける必要がある。**州の耕地800万ヘクタールすべてを対象にするという目標が置かれていた。**\n\n**2024年8月時点で100万戸超・50万ヘクタールに達し、インドの他州と他の南側の国へも広がっているとされる**（Fundação Calouste Gulbenkian 2024年8月2日）。","誰が始めたか":"**立ち上げたのは州政府である**（Fundação Calouste Gulbenkian 2024年8月2日）。**実施を担うのは Rythu Sadhikara Samstha（農民エンパワメント公社）**で、Down To Earth（2023年4月11日）はこれを**州政府が2014年に設けた非営利組織**と書いている。\n\n**名称が途中で変わっている。** Scroll.in（2019年2月13日）が扱っているのは Andhra Pradesh Climate Resilient Zero Budget Natural Farming という名の事業で、**3年・700村の試行を経て2018年6月に始まったとされる。** 一方 Down To Earth（2023年4月11日）と Fundação Calouste Gulbenkian（2024年8月2日）は、Andhra Pradesh Community Managed Natural Farming が2016年に始まったと書いている。**開始年が出典間で食い違うので `discrepancies` に並置した。**\n\n**事業を率いる側の言葉が出典に残っている。** Scroll.in（2019年2月13日）は、この事業を率いる州政府の農業顧問 T・ヴィジャイ・クマール氏が、**農家の福祉・消費者の健康・環境の保護という、社会への戻りがとても大きい事業だと述べたと伝えている。**\n\n**背景に農薬の使用量がある。** 同記事によれば、テランガーナ州が分かれる前の2011〜12年、アーンドラ・プラデーシュは**量で見てインドで最も農薬を使う州だった。**","いくらかかったか":"**総事業費は、参照した4本のどこにも書かれていない。**\n\n**州全体に広げる費用の見積もりは出ている。** Scroll.in（2019年2月13日）は、この事業を州全域に広げるには**1,700億ルピー（出典の表記は Rs 17,000 crore）が要ると書いている。**\n\n**農家の側の費用は下がるとされている。** 同記事は、カダパ郡で4年にわたりこの農法を続けている農家の例として、伝統的な種を使い、化学肥料と農薬を家畜の排せつ物や地元で手に入る材料から作ったものに置き換えたことで、**市場への依存が減り、栽培にかかる費用が下がったと伝えている。** 同じ農家によれば、菊の収量は1エーカーあたり4〜4.5トンから6〜7トンに上がり、花の日持ちは1日から3日になり、重量が増えたぶん手取りも上がった。**この農家の名は、一般の参加者にあたるため記さない。**","真似するなら最低何が必要か":"第一に、**買う資材をやめることを制度の芯に置く**こと。この農法は在来牛の糞と尿を使った手作りの資材とマルチだけを用い、**資材の購入を伴わない**（Down To Earth 2023年4月11日）。**有機農法との違いは「化学かどうか」ではなく「買うかどうか」である。**\n\n第二に、**先に小さく長く試す**こと。Scroll.in（2019年2月13日）によれば、州の事業として始まる前に**3年・700村の試行**が置かれていた。\n\n第三に、**実施する組織を別に立てる**こと。実施は州が2014年に設けた非営利組織 Rythu Sadhikara Samstha が担っている（Down To Earth 2023年4月11日）。**州の部局がそのまま実施するのではない。**\n\n第四に、**比べる試験を外部と組んで回す**こと。Down To Earth（2023年4月11日）によれば、英国レディング大学と Rythu Sadhikara Samstha の研究者が、**州内6郡・28農場・3作期にわたる圃場試験**で、この農法・有機農法・慣行農法を収量、土壌の pH、地温、含水率、養分、ミミズの数で比べた。**自分の事業を、外部の大学と一緒に測る形にしている。**\n\n第五に、**単位当たりの規模を先に見積もる**こと。Scroll.in（2019年2月13日）は、州の12,494のグラム・パンチャーヤトにまたがる600万戸に働きかける必要があり、州全体では1,700億ルピーが要ると書いている。**対象の数と金額が最初から示されている。**","今どうなっているか":"**2026年8月時点で確認できたのは、2024年8月2日の記事までである。**\n\n**広がりは段階的に報じられている。** Scroll.in（2019年2月13日）は、政府文書として**2018年9月時点で3,015村の35万戸**が実践していたと書いている。Down To Earth（2023年4月11日）は、州のおよそ600万戸のうち**63万戸**と働いてきたとする。Fundação Calouste Gulbenkian（2024年8月2日）は**100万戸超・50万ヘクタール**としている。\n\n**収量については比較試験の結果が報じられている。** Down To Earth（2023年4月11日）によれば、2023年3月23日に Agronomy for Sustainable Development 誌に載った論文は、慣行農法と比べたとき有機農法では収量が保たれ、この農法では上がったとし、**落花生の子実収量はこの農法で30〜40%高かった**と報告している。同記事は、化学肥料を使う慣行農法の方が抽出可能な養分の濃度が高くなるという主張があったが、**この農法でも養分の利用可能性は損なわれていなかった**とも書いている。試験は2019年6月から2020年にかけて、800キロメートルにわたる6郡の28農場で行われた。\n\n**規模の拡大そのものには当初から問いが向けられていた。** Scroll.in の2019年2月13日の記事は見出しで、**費用を下げ収量を上げているが「規模を広げられるのか」**と問うている。同記事は、州が農薬を最も使う州だったこと、農業の大半がいまも化学資材に頼っていること、そして600万戸の一つひとつを説得し移行を助けなければならないことを、事業が現場で抱える大きな困難として挙げている。**参照した4本の中に、この問いに事業者側が答えた記述は無い。** ただし2024年8月時点の100万戸超という数字は、2018年9月の35万戸から増えている。\n\n**外へ出ている。** Fundação Calouste Gulbenkian（2024年8月2日）は、この事業がインドの他州と他の南側の国々へより広く展開されつつあると書き、**2024年の Gulbenkian Prize for Humanity の共同受賞者の一つ**として紹介している。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"1,700億ルピー","currency":"INR","value":170000000000,"jpy":282502600000}],"sample":false},{"id":"in-0002","name":"電気の来ない家に太陽光の設備を売り、銀行の融資を組んで買えるようにした","name_local":"SELCO","name_variants":["Solar Electric Light Company","Solar Electric Lighting Company","SELCO India","SELCO Foundation"],"country":"インド","region":"カルナータカ州（出典に出る他州はケララ・グジャラート・オディシャ・メガラヤ）","municipality":"ベンガルール（バンガロール）に本拠。設置先は各州の農村","population_current":null,"population_scale":"不明","purpose":"商いを起こす","theme":"エネルギー・資源循環","start_year":1995,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"ハリシュ・ハンデ氏とネビル・ウィリアムズ氏が1995年にバンガロールで立ち上げた営利の社会的企業（Harvard Business School のブログ 2024年3月14日）。Business Today（2012年7月31日）によれば、2012年時点の持ち分は3つの外国の非営利団体（Lemelson Foundation / Good Energies Foundation / E+Co）にあり、同社には非営利の腕として SELCO Foundation がある","component_types":"hybrid","components":["家に太陽光の設備を据え付ける","銀行の融資を組んで買えるようにする","頭金と分割の条件を作る","修理と保守の人を土地に置く","保健所と冷蔵にも広げた"],"sources":[{"url":"https://knowledge.wharton.upenn.edu/article/harish-hande-of-selco-india-shedding-light-on-indias-underserved-markets/","title":"Harish Hande of SELCO India: Shedding Light on India's Underserved Markets","outlet":"Knowledge at Wharton","published":"2010-03-25","language":"en","from_operator":false},{"url":"https://www.businesstoday.in/magazine/special/story/innovation-energy-selco-solar-lamps-33834-2012-07-31","title":"How SELCO is lighting up rural houses with solar power","outlet":"Business Today","published":"2012-07-31","language":"en","from_operator":false},{"url":"https://www.downtoearth.org.in/environment/let-solar-shine-39684","title":"Let solar shine","outlet":"Down To Earth","published":"2012-11-29","language":"en","from_operator":false},{"url":"https://www.hbs.edu/environment/blog/post/IFC-India-2024-SELCO","title":"IFC India: SELCO - Last Mile Sola ce_year":2026,"elapsed_years":31,"follow_up":"濃い","follow_up_note":"1995年にバンガロールで始まり、2012年には10万台を超える設備を入れた。2024年以降は保健施設と冷蔵に広がっている。2026年8月には、2017年に入れた設備が止まっていたオディシャの集落が報じられた。","timeline":[{"year":1995,"event":"バンガロールで15,000ルピーを元手に設立されたと、2010年の記事が書いている","source_url":"https://knowledge.wharton.upenn.edu/article/harish-hande-of-selco-india-shedding-light-on-indias-underserved-markets/"},{"year":2005,"event":"ドイツの補助制度でインドの部材の供給先が変わり、価格が46%上がり納期が15〜20日から3〜6か月になったと報じられた","source_url":"https://knowledge.wharton.upenn.edu/article/harish-hande-of-selco-india-shedding-light-on-indias-underserved-markets/"},{"year":2012,"event":"7月、非営利の腕として SELCO Foundation があり、ウジレとアーメダバードに2つの「ラボ」を置いたと報じられた","source_url":"https://www.businesstoday.in/magazine/special/story/innovation-energy-selco-solar-lamps-33834-2012-07-31"},{"year":2017,"event":"オディシャ州トゥアムル・ランプルで銀行融資の型により約500台の家庭用照明を入れたと、元の技術取りまとめ役が2026年の記事に語っている","source_url":"https://www.downtoearth.org.in/energy/odisha-says-all-revenue-villages-electrified-but-nunareshs-failed-dre-shows-how-energy-poverty-persists-beyond-official-coverage"},{"year":2020,"event":"農民生産者団体が SELCO Foundation の助けでカルナータカ州シンダヌールに冷蔵の施設を設けたと、その理事が述べたと2025年の記事が伝えている","source_url":"https://india.mongabay.com/2025/11/solar-powered-cold-storage-empowers-smallholder-farmers/"},{"year":2024,"event":"3月、SELCO Foundation が12州の25,000の保健施設に2026年までに設備を入れる事業を進めていると、大学のブログが書いた","source_url":"https://www.hbs.edu/environment/blog/post/IFC-India-2024-SELCO"},{"year":2025,"event":"5月、保健所の太陽光は政策の不備のため慈善の取り組みにとどまっていると報じられた","source_url":"https://scroll.in/article/1081555/there-is-no-darkness-now-solar-power-helps-indias-health-centres-bridge-infrastructure-gap"},{"year":2026,"event":"8月、2017年に入れた設備が止まったあと2021年に別の機関の設備が配られ、それも数か月で壊れたとオディシャの集落から報じられた","source_url":"https://www.downtoearth.org.in/energy/odisha-says-all-revenue-villages-electrified-but-nunareshs-failed-dre-shows-how-energy-poverty-persists-beyond-official-coverage"}],"last_verified":"2026-08-19","sections":{"何をしたか":"インドで、**電気の来ない家や小商いに太陽光の設備を売り、それを買うための銀行の融資を組んだ**取り組み。\n\nKnowledge at Wharton（2010年3月25日）によれば、SELCO は**1995年にカルナータカ州バンガロールで15,000ルピーを元手に設立**された。同記事によれば、これは営利の企業で、記事の時点で経営陣が1.5%を持っていた。\n\n**売るだけでなく、買える形を作っている。** Down To Earth（2012年11月29日）によれば、SELCO は**頭金10〜15%、最長5年、金利12%**という条件を用意した。Business Today（2012年7月31日）によれば、ハンデ氏は、前の年に取引した世帯の月収は3,000〜4,000ルピーで、買った設備の価格は8,000〜20,000ルピーだったと述べている。\n\n**扱う対象は途中で広がっている。** Harvard Business School のブログ（2024年3月14日）と Scroll.in（2025年5月19日）は保健施設への設置を、Mongabay India（2025年11月14日）は農家の太陽光の冷蔵を扱っている。","誰が始めたか":"**2人の創業者である。** Harvard Business School のブログ（2024年3月14日）によれば、SELCO はハリシュ・ハンデ氏とネビル・ウィリアムズ氏によって**1995年に営利の社会的企業として**設立された。Business Today（2012年7月31日）によれば、ハンデ氏は自分の太陽光の照明が最初の客を得たあと、ウィリアムズ氏とともにこれを立ち上げた。\n\n**始まりは1994年の1つの村にある。** 同記事によれば、1994年の時点でケララ州カサラゴド県のムラリア村にはまだ電気が来ていなかった。\n\n**持ち分は創業者にない。** 同記事によれば、2012年時点の持ち分は**3つの外国の非営利団体**（Lemelson Foundation / Good Energies Foundation / E+Co）にあり、**ハンデ氏を含む全員が従業員である。**\n\n**会社と財団の2つがある。** 同記事は、**この会社には非営利の腕として SELCO Foundation があり、カルナータカ州ウジレとグジャラート州アーメダバードに2つの「ラボ」を置いた**と書いている。**2010年から2012年の出典は会社を、2024年から2026年の出典は財団を主題にしている。** 本記録は、この2つを1つの系譜として1件にまとめた。**出典によって呼び分けが揺れる**ことは下の各節に書いた。\n\n**社名の綴りが出典間で違う。** Harvard Business School のブログは `Solar Electric Light Company`、Down To Earth（2012年11月29日）は `Solar Electric Lighting Company` と書いている。`discrepancies` に並置した。","いくらかかったか":"**外から入った資金と、事業の規模の両方が書かれている。**\n\nKnowledge at Wharton（2010年3月25日）によれば、**2008年に140万米ドルの資金**を得ており、**2009年3月31日に終わった年度の売上は1億2,000万ルピー（Rs. 12 crore）で、2014年までに約4億ルピー（Rs. 40 crore）に増やす目標**を置いていた。\n\nBusiness Today（2012年7月31日）によれば、**2011/12年度の売上は1億8,500万ルピー（Rs 18.50 crore）、税引後利益は720万ルピー（Rs 72 lakh）**である。同記事によれば、ハンデ氏は、利幅を22〜24%に保っていると述べ、**8%ほどが返済に行き詰まるが、その多くは作物の不作のような真っ当な理由によるものだ**とも述べている。\n\n**買う側の値段も書かれている。** Knowledge at Wharton（2010年3月25日）によれば、2010年時点で照明4灯・40ワットの一組は約15,000ルピー（350米ドル）だった。Business Today（2012年7月31日）によれば、最も安い1灯の一組は7,500ルピーである。\n\n**補助は無い。** 同記事は、SELCO の製品はいかなる形でも補助を受けておらず、国からの支援も一切無いと書いている。同記事によれば、ハンデ氏は、政府が SELCO に30%の税を課す一方で IT 企業には税の優遇を与えていると述べている。","真似するなら最低何が必要か":"第一に、**設備を売る前に融資を作る**こと。Down To Earth（2012年11月29日）が書く条件は、頭金10〜15%・最長5年・金利12%である。**Knowledge at Wharton（2010年3月25日）によれば、ハンデ氏は、手が届くとは安いことではなくふさわしい融資があることだ、と述べている。**\n\n第二に、**顧客の所得を先に見て、値段の段を用意する**こと。Business Today（2012年7月31日）によれば、ハンデ氏は前の年に取引した世帯の月収を3,000〜4,000ルピー、買った設備を8,000〜20,000ルピーとしている。最安の1灯の一組は7,500ルピーである。\n\n第三に、**返済に行き詰まる割合を織り込んでおく**こと。同記事によれば、**ハンデ氏は8%ほどが返済に行き詰まると述べている。**\n\n第四に、**部材の値段が外の事情で動くことを見込む**こと。Knowledge at Wharton（2010年3月25日）によれば、**2005年にドイツで新しい補助制度が始まってインドの部材メーカーが向きを変えた結果、SELCO の価格は46%上がり、15〜20日で届いていた板が3〜6か月かかるようになった。** 同記事によれば、ハンデ氏はこれを「二重の打撃」と述べ、記事の時点では黒字に戻ったとしている。\n\n第五に、**入れたあと動き続けるかを、入れる計画と同じ重さで扱う**こと。**この事業では、そこが最も強い指摘になっている**（次節）。\n\n第六に、**急に大きくしない**こと。同記事によれば、ハンデ氏は、**経営学の教室で教わるやり方で規模を追えばこの会社は自滅すると述べている。**","今どうなっているか":"**2026年8月時点で確認できたのは、2026年8月13日の記事までである。**\n\n**保健施設と冷蔵に広がっている。** Harvard Business School のブログ（2024年3月14日）によれば、SELCO Foundation は IKEA Foundation と保健家族福祉省とともに、**気候の影響を受けやすい資源の乏しい地域の25,000の保健施設に2026年までに設備を入れる**事業を進めている。同ブログによれば、訪ねた1施設では**月の電気代が約10,000ルピーから約400ルピーに下がり**、2日分まで蓄えられる。**この記事は学生の小論である。** 同ブログには図版の出所として SELCO の訪問用資料と記された箇所があるが、上の2つの数字にはその表示は付いていない。\n\nScroll.in（2025年5月19日）によれば、SELCO Foundation の長フーダ・ジャファー氏は、取材した施設がカルナータカ州で太陽光を入れる予定の2,500の公的保健施設の1つだと述べている。Mongabay India（2025年11月14日）によれば、農民生産者団体 Dhaanya FPO の理事ウマカント・シャルマ氏は、カルナータカ州シンダヌールに2020年、SELCO Foundation の助けで冷蔵の施設を設けたと述べている。同氏によれば、**最初の7〜8か月は無料で預けられ、そのあと1箱（50キロ）あたり10ルピーを取るようになり、いまは農民から買い取って値が上がったときに売り、利益を分けている。**\n\n**制度になっていないという指摘がある。** Scroll.in（2025年5月19日）は、**保健所の太陽光が、政策の不備のために慈善の取り組みにとどまっていると書いている。** 参照した7本の中に、これに答えた記述は無い。\n\n**入れたあと止まった例が報じられている。** Down To Earth（2026年8月13日）によれば、オディシャ州の集落ヌナレシュでは、**2017年に18世帯が SELCO Foundation から1台8,350ルピーの設備を受け取り、2,500ルピーの補助（費用の約3割）を得たうえで、シンジケート銀行から金利9.65%で5,300ルピーを借りた。利息を含む返済総額は1世帯あたり約6,277ルピーである。** 同記事によれば、**その設備が動かなくなったあと、2021年に部族開発の機関から別の設備が無償で配られたが、それも数か月で壊れた。**\n\n**当事者側の説明も同じ記事に載っている。** 同記事によれば、上の融資の条件を説明したのは、カラハンディで働く SELCO Foundation の現地の取りまとめ役ビリシン・マジ氏である。**元の技術取りまとめ役ビジャイ・クマール・ナンダ氏は、場合によっては返済と保守の難しさが設備の長い期間の動作に影響した可能性がある、と述べている。** 同記事は、SELCO Foundation は自ら貸すのではなく、金融機関との連携や慈善の資金・リスク保証といった仕組みを通じて**融資を仲立ちするのが常だ**とも書いている。\n\n**同記事は、この集落の失敗を SELCO だけの問題としては書いていない。** 記事の主題は、オディシャ州が全ての税収村の電化を宣言したあとも電力の貧困が残っているという点であり、**部族開発の機関が配った設備も数か月で壊れたと住民が述べている。**\n\n**2012年の設備の数は出典間で食い違う。** Business Today（2012年7月31日）は3州で約145,000台、Down To Earth（2012年11月29日）はカルナータカ州で135,000世帯としている。**数える範囲が違う可能性が高いので、`discrepancies` に並置した。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"140万米ドル","currency":"USD","value":1400000,"jpy":222770919},{"raw":"1億2,000万ルピー","currency":"INR","value":120000000,"jpy":199413600},{"raw":"4億ルピー","currency":"INR","value":400000000,"jpy":664712000},{"raw":"1億8,500万ルピー","currency":"INR","value":185000000,"jpy":307429300},{"raw":"720万ルピー","currency":"INR","value":7200000,"jpy":11964816},{"raw":"15,000ルピー","currency":"INR","value":15000,"jpy":24927},{"raw":"350米ドル","currency":"USD","value":350,"jpy":55693},{"raw":"7,500ルピー","currency":"INR","value":7500,"jpy":12463}],"sample":false},{"id":"is-0001","name":"地区ごとの小さな工事を住民の電子投票で決めている","name_local":"Hverfið mitt","name_variants":[],"country":"アイスランド","region":"首都地域（höfuðborgarsvæðið）","municipality":"レイキャビク","population_current":139804,"population_scale":"5万〜25万","purpose":"住民が決める","theme":"デジタル・情報発信","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"レイキャビク市（Reykjavíkurborg）","component_types":"hybrid","components":["住民が地区ごとに案を出す","市の仕組みの中で案を検討して絞る","地区協議会と協力して投票にかける","15歳以上の市民が電子的に投票する","選ばれた案を市が入札にかけて施工する"],"sources":[{"url":"https://www.visir.is/g/2018180309296/hverfid-mitt-i-reykjavik-2018","title":"Hverfið mitt í Reykjavík 2018","outlet":"Vísir","published":"2018-03-06","language":"is","from_operator":true},{"url":"https://www.dv.is/eyjan/2019/11/06/sex-milljonir-kostar-ad-nefna-og-merkja-tvo-gongustiga-hja-reykjavikurborg-thetta-endar-svo-12-mills","title":"Sex milljónir kostar að nefna og merkja tvo göngustíga hjá Reykjavíkurborg", 9296/hverfid-mitt-i-reykjavik-2018"},{"year":2019,"event":"見直しのための作業部会が置かれたと、市の担当者が述べている","source_url":"https://www.visir.is/g/20191699656d"},{"year":2019,"event":"前年の実施費用が予算を超えたと報じられた","source_url":"https://www.ruv.is/frett/hverfid-mitt-for-50-milljonir-fram-ur-aaetlun"},{"year":2021,"event":"名簿112,306人に対し18,389人が投票し、277案のうち111案が選ばれた","source_url":"https://www.visir.is/g/20212169534d/aldrei-fleiri-tekid-thatt-og-stor-verkefni-framundan"},{"year":2024,"event":"62件について市議会が入札を許可し、施工は2025年12月までと見込まれた","source_url":"https://reykjavik.is/frettir/2024/hverfid-mitt-fjolbreytt-og-skemmtileg-verkefni-til-framkvaemda"}],"last_verified":"2026-08-18","sections":{"何をしたか":"レイキャビク市が、地区ごとの小さな新設・改修工事の優先順位を、住民の電子投票で決めている仕組み。市の担当議長は2018年に、まず住民から案を集め、市の仕組みの中で検討したうえで、各地区の地区協議会と協力して投票にかける3段階だと書いている。投票できるのは15歳以上の市民で、投票は Íslykill か電子証明書で確定する。2021年の投票では、名簿112,306人に対し18,389人が投票し、277案のうち111案が選ばれた。2023年9月の投票で選ばれた62件については、2024年に市議会が入札にかけることを許可し、施工は2025年12月までと見込まれている。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"it-0001","name":"出ていった人の空き家に、着いた人を住まわせた","name_local":"Riace","name_variants":["modello Riace"],"country":"イタリア","region":"カラブリア州レッジョ・カラブリア県","municipality":"リアーチェ","population_current":1600,"population_scale":"5万人未満","purpose":"住む人を増やす・戻す","theme":"空き家・空き店舗・遊休不動産","start_year":1998,"end_year":null,"status_current":"判定不能","actor_type":"混合","lead_actor":"協会 Città Futura と リアーチェ町（当時の町長 Domenico「Mimmo」Lucano）","funding_scale":"確認できなかった。参照した5本のどこにも事業費の総額が書かれていない。国の庇護希望者受入制度（SPRAR）と県への精算が刑事事件の争点になった","component_types":"hybrid","components":["移住で空いた住宅に新しく来た人を入れた","学校を開けて子どもの数を保った","小さな工房と店に資金を回した","戸別収集のごみ分別を始めた"],"sources":[{"url":"https://www.internazionale.it/opinione/ida-dominijanni/2016/04/04/riace-migranti-sindaco","title":"La restituzione di Riace","outlet":"Internazionale（Ida Dominijanni）","published":"2016-04-04","language":"it","from_operator":false},{"url":"https://www.ansa 5d377c-1f01-4dd4-b34b-b2b9bc2a333d.html"},{"year":2016,"event":"11月、17年で20か国以上から6千人以上を受け入れ、人口が1,600人を超えたと報じられた。同年 Fortune 誌は Lucano を世界の影響力のある50人の40位に挙げた","source_url":"https://www.ansa.it/canale_lifestyle/notizie/societa_diritti/2016/11/06/italia-che-accoglie-riace-come-il-borgo-fantasma-e-diventato-paese-modello-di-integrazione_3c882479-d4de-11e7-8470-00505695d1bc.html"},{"year":2017,"event":"8月、資金の遅れなどから受入の仕組みが危ういとする論説が出た","source_url":"https://www.vita.it/il-modello-di-accoglienza-di-riace-e-a-rischio-salviamolo/"},{"year":2018,"event":"10月2日、ロクリ検察の捜査により町長が自宅軟禁となった。容疑は受入事業の運営に関するもの","source_url":"https://www.ansa.it/sito/notizie/cronaca/2021/09/30/mimmo-lucano-e-la-parabola-del-modello-riace_835d377c-1f01-4dd4-b34b-b2b9bc2a333d.html"},{"year":2021,"event":"9月、ロクリ地裁が犯罪結社・詐欺・横領・文書偽造・職権濫用で懲役13年2か月を言い渡した","source_url":"https://www.ansa.it/sito/notizie/cronaca/2021/09/30/mimmo-lucano-e-la-parabola-del-modello-riace_835d377c-1f01-4dd4-b34b-b2b9bc2a333d.html"},{"year":2023,"event":"10月、レッジョ・カラブリア控訴院が7時間の評議のうえ、2017年の決裁1件の文書偽造を除くすべての罪を退け、執行猶予つき1年6か月とした。他の被告人17人は全員無罪","source_url":"https://www.ansa.it/calabria/notizie/2023/10/11/lucano-condannato-in-appello-a-un-anno-e-sei-mesi_f4a5fd53-25f0-4f56-b010-c96750ced5d8.html"},{"year":2025,"event":"2月、破棄院が上告を退け、文書偽造1件による18か月（執行猶予つき）が確定し、他のすべての罪の無罪も確定した","source_url":"https://www.ansa.it/sito/notizie/cronaca/2025/02/12/definitiva-la-condanna-di-mimmo-lucano-a-18-mesi-per-falso_a4159e1e-cf46-4e9a-876c-4c9a34802ac7.html"}],"last_verified":"2026-08-17","sections":{"何をしたか":"カラブリア州の小さな町リアーチェで、**人が出ていって空いたままだった住宅に、船で着いた人を住まわせた**取り組み。**1998年、リアーチェ・マリーナにクルド人の避難民約200人が上陸したことがきっかけだった。** 協会 Città Futura と、のちに町長となる Domenico「Mimmo」Lucano は、移住で空いていた家々の扉を開けることを決めた（ANSA 2021年9月30日）。\n\nリアーチェは1998年には若者も希望もなく、消えていく運命にあったとされる。**2016年11月の報道では、17年で20か国以上から6千人以上の庇護希望者を受け入れ、人口は1,600人を超えた。** 学校を開け、小さな工房や店に資金を回し、戸別収集のごみ分別まで行政の全体を統合に向けたと同記事は書いている。同じ2016年、Fortune 誌は Lucano を世界で影響力のある50人の40位に挙げた。\n\n**この取り組みは、刑事事件によって中断した。** 2018年10月2日、ロクリ検察の捜査で Lucano は自宅軟禁となる。2021年9月、ロクリ地裁は犯罪結社・詐欺・横領・文書偽造・職権濫用で**懲役13年2か月**を言い渡した。\n\n**しかし判決はその後ほぼ覆っている。** 2023年10月、レッジョ・カラブリア控訴院は7時間の評議のうえ、**2017年の決裁1件の文書偽造を除くすべての罪を退け**、執行猶予つき1年6か月とした。他の被告人17人は全員無罪となっている。**2025年2月、破棄院が上告を退け、文書偽造1件による18か月と、その他すべての罪の無罪がともに確定した。** 2025年2月時点の ANSA は Lucano を「リアーチェ町長・欧州議会議員」と書いている。\n\n**受入の仕組みが現在どう動いているかは、参照した6本からは判定できなかった**ため `status_current` は `判定不能` とした。刑事事件の帰趨は追えるが、いま何人が住み、何人を受け入れているかを書いた出典に到達していない。","誰が始めたか":"**協会 Città Futura と、のちに町長となる Domenico「Mimmo」Lucano である。** ANSA（2021年9月30日）は、この話が**1998年にほとんど偶然に始まった**と書いている。リアーチェ・マリーナにクルド人の避難民約200人が上陸したとき、Lucano と協会は何かをしなければならないと考え、**移住で空いていた家々の扉を開けることを決めた。**\n\n**行政の全体を統合に向けた。** Lucano は町長として3期近くを務め、ANSA（2016年11月6日）によれば、学校を開け、小さな事業に資金を回し、工房・バール・パン屋をつくり、戸別収集のごみ分別まで行った。\n\n**批判は当初からあった。** ANSA（2021年9月30日）は、**とりわけ中道右派の側から批判の声が絶えなかった**が Lucano は自分の道を進んだ、と書いている。","いくらかかったか":"**事業費の総額は、参照した6本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**代わりに、金の流れそのものが刑事事件の対象になった。** 2021年9月のロクリ地裁の判決は、**国の庇護希望者受入制度（SPRAR）の中央機関と県への「不当な精算」**を認定するものだった（ANSA 2025年2月12日）。**つまり、いくらどう使ったかが争点そのものである。**\n\n**その認定は覆っている。** 2023年10月の控訴審は、2017年の決裁1件の文書偽造を除くすべての罪を退けた。2025年2月、破棄院は文書偽造1件による18か月（執行猶予つき）を確定させ、**同時にその他すべての罪の無罪も確定させた。**","真似するなら最低何が必要か":"この事例で真似できる単位は、受入そのものではなく**空き家と人の結びつけ方、そしてその後に来るもの**である。\n\n第一に、**すでに空いている家を使う**こと。建てるのではなく、移住で人が出ていって空いたままの家を開けた。**過疎と受入という2つの問題を、1つの資源で受けている。**\n\n第二に、**学校を開け続ける**こと。ANSA（2016年11月6日）は、Lucano が学校を開けたことを統合の中身として挙げている。**子どもの数が戻らなければ、村の機能は戻らない。**\n\n第三に、**小さな仕事を同時につくる**こと。工房・バール・パン屋、そして戸別収集のごみ分別。**住むところだけを用意しても、生活は成立しない。**\n\n第四に、**制度の資金を使うなら、精算の記録を厳格に持つ**こと。この事例で刑事事件になったのは受入そのものではなく、**国の制度への精算のしかた**である。13年2か月の判決は控訴審でほぼ崩れ、最終的に残ったのは決裁1件の文書偽造だが、**確定までには、2018年10月2日の自宅軟禁から2025年2月の破棄院判決までを要している。**\n\n第五に、**制度が止まったときに何が残るかを考えておく**こと。2018年10月の捜査以降、受入の仕組みは中断した。**制度の資金に依存した部分は、制度が止まれば止まる。**","今どうなっているか":"2026年8月時点で確認できたのは、2025年2月12日の ANSA の記事までである。\n\n**刑事事件は決着した。** 2025年2月、破棄院は上告を退け、**2017年の決裁1件の文書偽造による18か月（執行猶予つき）が確定**した。同時に、**2023年10月の控訴審が認めたその他すべての罪の無罪も確定した。** 控訴審では他の被告人17人も全員無罪となっている。2023年10月の判決のあと、Lucano はこの数年が自分を打ちのめし辱めるものだったとして、悪夢の終わりだと述べたと ANSA は伝えている。\n\n**Lucano は公職に戻っている。** 2025年2月時点の ANSA は、Lucano を**「リアーチェ町長・欧州議会議員」**と書いている。\n\n**受入の仕組みが現在どう動いているかは、参照した6本からは判定できなかった。** そのため `status_current` は `判定不能` とした。**刑事事件の帰趨は年単位で追えるが、近年に何人が住み、何人を受け入れているかを書いた出典には到達していない。** 規模について確認できるうち最も新しいのは Vita（2017年8月29日）で、同記事は**当時の住民を1,700人とし、うち少なくとも500人が数十の国から来た移民で、Sprar（庇護希望者・難民の保護制度）でも受け入れていた**と書いている。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"it-0002","name":"違法建築の町の空いた中庭を、現代美術の場に変えた","name_local":"Farm Cultural Park","country":"イタリア","region":"シチリア州アグリジェント県","municipality":"ファヴァーラ","population_current":31315,"population_scale":"5万人未満","purpose":"誇りをつくる","theme":"空き家・空き店舗・遊休不動産","start_year":2010,"end_year":null,"status_current":"継続中","actor_type":"民間（その他）","lead_actor":"Andrea Bartoli（公証人）と Florinda Saieva（弁護士）夫妻","funding_scale":"2017年時点で、開設からの7年で2,000万ユーロを超える投資があったとする最初の経済影響調査が報じられている。内訳と出所は確認できなかった","component_types":"hybrid","components":["旧市街の空いた中庭を買って直した","現代美術の展示と催しを常設にした","子ども向けの建築の学校を置いた","住民70人で社会的企業をつくった"],"sources":[{"url":"https://www.ansa.it/sicilia/notizie/2017/06/22/ansa-farm-cultural-park-cosi-rinasce-paese-dellagrigentino_3095bd5a-6597-466b-96fe-ca86fe345891.html","title":"Farm Cultural Park, così rinasce paese dell'agrigentino","outlet":"ANSA","published":"2017-06-22","language":"it","from_operator":false},{"url":"https://www.ilsole24ore.com/art/burocrazia-e-permessi-rischiano-bloccare-farm-cultural-park-favara-AEPE5NAC","title":"Burocrazia e permessi rischiano di bloccare il Farm Cultural Park di Favara","outlet":"Il Sole 24 Ore","published":"2017-08-08","language":"it","from_operator":false},{"url":"https://www.ilsole24ore.com/art/a-favara-nasce-societa-azioni-buone-AEoP2fK","title":"A Favara nasce una Società per azioni buone","outlet":"Il Sole 24 Ore","published":"2021-05-31","language":"it","from_operator":false},{"url":"https://www.vita.it/storie-e-persone/a-favara-larte-di-farm-cultural-park-ha-reinventato-la-citta/","title":"A Favara l'arte di Farm Cultural Park ha reinventato la città","outlet":"Vita","published":"2022-09-06","language":"it","from_operator":false}],"context_sources":[{"url":"https://demo.istat.it/data/posas/POSAS_2025_it_Comuni.zip","title":"ISTAT「Popolazione residente per età, sesso e stato civile al 1° gennaio 2025」（ファヴァーラ・自治体コード084017・31,315人）"}],"unknown_fields":[],"latest_source_year":2022,"elapsed_years":12,"follow_up":"濃い","follow_up_note":"2010年に旧市街の違法建築が崩れて姉妹2人が亡くなったことを受けて、予定を早めて開設された。2017年6月には7年で2,000万ユーロ超の投資、年12万人の来訪、常勤150人と報じられた。同年8月には無許可の土地占有として2つの木造施設が封印され、2021年5月には住民70人が社会的企業をつくっている。","timeline":[{"year":2010,"event":"旧市街で違法に建てられた建物が崩れ、14歳と4歳の姉妹が亡くなった。2012年の開設を予定していた夫妻は、その5か月後に前倒しで開いた","source_url":"https://www.vita.it/storie-e-persone/a-favara-larte-di-farm-cultural-park-ha-reinventato-la-citta/"},{"year":2017,"event":"6月、最初の経済影響調査として、7年で2,000万ユーロを超える投資、年12万人の来訪、常勤150人が報じられた。EUも都市再生の例として認めたとされる","source_url":"https://www.ansa.it/sicilia/notizie/2017/06/22/ansa-farm-cultural-park-cosi-rinasce-paese-dellagrigentino_3095bd5a-6597-466b-96fe-ca86fe345891.html"},{"year":2017,"event":"8月、市の警察が無許可の土地占有にあたるとして木造の施設2棟を封印し、活動が妨げられていると報じられた","source_url":"https://www.ilsole24ore.com/art/burocrazia-e-permessi-rischiano-bloccare-farm-cultural-park-favara-AEPE5NAC"},{"year":2021,"event":"5月、ファヴァーラの住民70人が公証人の前で社会的企業「Società per azioni buone」を設立した。準備は2019年に始まり、感染症の流行で遅れていた","source_url":"https://www.ilsole24ore.com/art/a-favara-nasce-societa-azioni-buone-AEoP2fK"},{"year":2022,"event":"9月、開設12年として、毎年数百人の芸術家・建築家・写真家と数千人の来訪者が集まると報じられた","source_url":"https://www.vita.it/storie-e-persone/a-favara-larte-di-farm-cultural-park-ha-reinventato-la-citta/"}],"last_verified":"2026-08-17","sections":{"何をしたか":"シチリア島アグリジェント県ファヴァーラで、**旧市街に空いたまま残っていた中庭と建物を買って直し、現代美術の場にした**取り組み。公証人の Andrea Bartoli と弁護士の Florinda Saieva の夫妻が、パリではなく妻の出身地であるファヴァーラを選んで始めた。\n\n**始まりは事故である。** 夫妻は2012年の開設を目指していたが、**2010年に旧市街で違法に建てられた建物が崩れ、14歳と4歳の姉妹が亡くなった。** 町全体の痛みを受けて、夫妻は計画を前倒しし、その5か月後に開いた（Vita 2022年9月6日）。ファヴァーラは違法建築が広がる町として知られていた。\n\n**2017年6月22日、ANSA は最初の経済影響調査として、7年で2,000万ユーロを超える投資、年間12万人の来訪、常勤150人の雇用を報じた。** EUも都市再生の例として認めたとされる。子ども向けの建築の学校も置かれている。\n\n**同じ2017年、行政手続きの側から止められかけている。** 8月8日の Il Sole 24 Ore は、市の警察が**無許可の土地占有にあたるとして木造の施設2棟を封印した**と報じた。同紙は、一連の官僚的な問題が活動を損なっていると書いている。**この件のその後を書いた出典には到達できなかった。**\n\n2021年5月31日には、**ファヴァーラの住民70人が公証人の前で社会的企業「Società per azioni buone（善い行いの株式会社）」を設立した。** 準備は2019年に始まり、感染症の流行で遅れていた。個人として、あるいは団体を代表しての参加である。","誰が始めたか":"**先に動いたのは夫妻2人だけである。** 公証人の Andrea Bartoli と弁護士の Florinda Saieva が、旧市街に空いたまま残っていた「7つの中庭（Sette Cortili）」——Cortile Bentivegna を構成する中庭群——を直し、そこを中心の場にした。Vita 2022年9月6日の記事で Saieva は、この事業は個人的な必要から始まったもので、シチリアに住みながら息をするために逃げ出す必要を感じずにいたかった、と語っている。**「こういう事業を始めるときには、何をすべきか教えてくれる説明書は無い」**（同記事）。夫妻は住む場所としてもファヴァーラを選び、2人の娘をここで育てている。\n\n**町の側の反応は後から変わった。** ANSA 2017年6月22日の記事で Bartoli は、最初は自分たちが「宇宙人」のように見られて警戒があり、そのあとに最初の反応が返ってきた、と述べている。同記事は、アグリジェントに住む人が少し前までは間違ってでも行かなかった場所だった、という同氏の言葉も伝えている。\n\n**制度・団体が加わったのは、行政手続きで止められた2017年である。** Il Sole 24 Ore 2017年8月8日によれば、木造施設2棟の封印に対して大学・団体・文化施設・知識人のグループ（Trans Europe Halles、Federculture、Fondazione Matera-Basilicata 2019、Base Milano）が撤回を求める請願を出し、下院の第7委員会（文化）もこの件を取り上げた。\n\n**住民が事業主体の側に入ったのは2021年である。** Il Sole 24 Ore 2021年5月31日によれば、ファヴァーラの住民70人が公証人の前で社会的企業「Società per azioni buone（Spab）」を設立した。準備は2019年に始まり、感染症の流行で遅れていた。Saieva はその狙いを、開発に必要な不動産を持つ人・資金を出せる人・変化を進める能力を持つ人を同じ卓に座らせることだと説明している。**つまり順序は、夫妻 → 来訪者と作家 → 全国の文化団体と国会の委員会 → 地元住民、である。**","いくらかかったか":"**事業費の総額は確認できなかった。** 出典にあるのは投資の推計額であり、誰がいくら出したかの内訳ではない。\n\n- **2017年6月、ANSA は最初の経済影響調査として、7年間で2,000万ユーロを超える投資があったと報じた。** ただし調査の主体・内訳・その投資に誰の資金が含まれるかは、この記事に書かれていない\n- **始まりは自己負担と借入である。** Vita 2022年9月6日で Saieva は、これらすべてを苦労しながら、**借金をしながら**実現したと述べている\n- **2022年時点の回り方は、有料の来訪者と公募助成である。** 同記事は、多数の有料来訪者と各種事業で獲得した公募助成（bandi）によって収益が生まれ、それを文化・社会の事業の拡張に再投資できる状態になったと書いている\n- **行政に払う側の取り決めも交渉されている。** Il Sole 24 Ore 2017年8月8日によれば、7つの中庭の管理協定を結び、入場料の徴収を認めるかわりに収入の一定割合を市に納める、という形が市との協議で示された。ただし同記事は、その直後に施設が改めて封印されたとも書いている\n- **住民出資の器の側は、規模の目標だけが示されている。** Il Sole 24 Ore 2021年5月31日によれば、Spab の発起人はファヴァーラの銀行預金を5億ユーロ近くと見積もり、その1割を投資に回せば5,000万ユーロを使えると説明した。**これは達成額ではなく試算である。** 設立後の最初の行為は、市に70本の樹木を寄贈することだった\n\n`funding_scale` には2017年の2,000万ユーロという推計だけを入れ、内訳と出所は確認できなかったと明記した。","真似するなら最低何が必要か":"1. **買って直せる空き家が、離れずに固まって残っていること。** ここで手をつけたのは1棟ではなく、Cortile Bentivegna を構成する7つの中庭である。旧市街の一区画がまとまって空いていたことが前提になっている\n2. **始める人がその町に住むこと。** 夫妻はパリに住む選択肢を捨ててファヴァーラに住み、子どもをここで育てている。Vita はこれを、逃げずに暮らせる場所を自分たちのために作る必要があったという Saieva の言葉として書いている\n3. **自己負担と借入で始められること。** 2017年の推計は2,000万ユーロ超だが、Saieva が語っているのは補助金ではなく借金である。**最初の資金は外から来ていない**\n4. **有料化と公募助成に切り替える段取り。** 2022年時点の収入は有料来訪者と bandi であり、入場料の徴収そのものが2017年には市との争点になっていた。**無料で開けたまま続ける形にはなっていない**\n5. **行政手続きに耐える体制。** 土地占有の届け出、入場料徴収の可否、管理協定、Tosap（公共用地占用税）の規則への適合。2017年に木造施設2棟が封印されたのはここである。市長の Anna Alba（M5S）は、公務員は現行の法と規則を完全に守って職務を行なったと市のサイトで表明し、Bartoli は同じ件を妨害的な官僚制の行使だと反論している（Il Sole 24 Ore 2017年8月8日）\n6. **住民が後から資金と不動産を持ち込める器。** 2021年の Spab は、個人としてでも団体の代表としてでも参加できる社会的企業として作られた\n\n**確認できないもの**は、2,000万ユーロの内訳と調査の主体、夫妻の自己資金と借入の額、封印が最終的に解かれたかどうか、常勤150人を雇っている主体と雇用の形、Spab が実際に集めた出資額である。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、2022年9月6日の Vita の記事である。最新の出典が4年前であり、それ以降の状況は確認できていない。**\n\n2022年9月時点で Vita が報じているのは次のとおりである。来訪は年12万人で、Saieva は**自分たちだけで150人を安定した形で雇っていると述べている**。Palazzo Miccichè には「Human Forest」という常設のインスタレーションが置かれ、50年間放置されていた建物の内部を植物で埋めたもので、3年間で6万人が通ったとされる。子ども向けの建築の学校 SOU（藤本壮介の名にちなむ）はイタリア国内に12の「支部」を持ち、受講は無料である。2018年にファヴァーラの子どもたちがパリで同建築家に会い、2019年には保護者を含む83人がロンドンで Norman Foster に迎えられた、と Saieva は語っている。\n\n**2017年8月の封印について、その後を書いた出典には到達できなかった。** Il Sole 24 Ore は、市の窓口が必要書類の提出を条件に原状回復命令の撤回に応じる意向を示し、Farm を公共の関心のある場所として認定する市参事会の措置が予告されたと書いたうえで、**予告された認定は延期され、市の警察が警察・カラビニエリとともに戻って改めて封印した**と伝えている。同紙が市長に電話で取材した際、市長は回答しなかったとも書かれている。**認定がその後行なわれたのか、命令が撤回されたのかは、今回の出典の範囲では確認できない。**\n\n**出典の性格について明記しておく。** Il Sole 24 Ore の2本は購読制の媒体の記事であり、ここに書いたのは取得できた範囲に限られる。ANSA・Il Sole 24 Ore・Vita はいずれも Claude による取得を robots.txt で拒否しているドメインで、本文は以前に取得したものを使っている（再取得はしていない）。**2022年以降の否定的な報道は、今回探した範囲では見つからなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"2,000万ユーロ","currency":"EUR","value":20000000,"jpy":3712000000},{"raw":"5億ユーロ","currency":"EUR","value":500000000,"jpy":92800000000},{"raw":"5,000万ユーロ","currency":"EUR","value":50000000,"jpy":9280000000}],"sample":false},{"id":"it-0003","name":"最後の店と最後の酒場が閉じたので、住民が会社をつくって開け直した","name_local":"Succiso","name_variants":["Cooperativa Valle dei Cavalieri"],"country":"イタリア","region":"エミリア＝ロマーニャ州レッジョ・エミリア県","municipality":"ヴェンタッソ（スッチーゾ地区）","population_current":65,"population_scale":"5万人未満","purpose":"商いを起こす","theme":"商店街・市場","start_year":1991,"end_year":null,"status_current":"継続中","actor_type":"住民組織","lead_actor":"Cooperativa Valle dei Cavalieri（2016年時点の代表 Dario Torri）","funding_scale":"Vita（2016年5月23日）は、25年間の活動を通じた投資総額が150万ユーロ、組合の年商がおよそ70万ユーロだと書いている。同記事によれば2016年時点で常勤7人、平均月給はおよそ1,000ユーロ。設立時の出資額は参照した3本に書かれていない","component_types":"hybrid","components":["閉まった酒場と食料品店を開け直した","住民の半分が組合員になった","宿と食堂を足して観光客を入れた","送迎車を買って通学と買物を担った"],"sources":[{"url":"https://www.redattoresociale.it/article/notiziario/ali_e_stefano_il_tour_di_due_chef_alla_ricerca_della_coesione_sociale","title":"Ali e Stefano, il tour di due chef alla ricerca della coesione sociale","outlet":"Redattore Sociale","published":"2015-05-15","language":"it","from_operator":false},{"url":"https://www.vita.it/succiso-il-paese-cooperativa-dove-ogni-giorno-si-cambia-lavoro/","title":"Succiso, il paese-cooperativa dove ogni giorno si cambia lavoro","outlet":"Vita","published":"2016-05-23","language":"it","from_operator":false},{"url":"https://www.ilsole24ore.com/art/effetto-pandemia-e-politiche-luoghi-spingono-cooperative-comunita-AEeoesAB","title":"Effetto pandemia e politiche dei luoghi spingono le cooperative di comunità","outlet":"Il Sole 24 Ore","published":"2022-02-01","language":"it","from_operator":false}],"unknown_fields":[],"latest_source_year":2022,"elapsed_years":31,"follow_up":"濃い","follow_up_note":"1991年に村で唯一の酒場が閉じ、その少し前に最後の店も閉じたことから、住民9人が協同組合をつくった。2016年時点で組合員33人・常勤7人、宿と食堂を合わせて年に最大1万4千人を受け入れている。2022年2月の報道は、これをイタリアで最初のコミュニティ協同組合と位置づけている。","timeline":[{"year":1991,"event":"村で唯一の酒場が閉じた。その少し前に最後の食料品店も閉じており、地元の文化協会の仲間9人が協同組合 Valle dei Cavalieri をつくった","source_url":"https://www.vita.it/succiso-il-paese-cooperativa-dove-ogni-giorno-si-cambia-lavoro/"},{"year":2015,"event":"5月、社会的結束の事例をたどる企画の4か所のうちの1つに選ばれた","source_url":"https://www.redattoresociale.it/article/notiziario/ali_e_stefano_il_tour_di_due_chef_alla_ricerca_della_coesione_sociale"},{"year":2016,"event":"5月、25年目。組合員33人はすべて無償の役員で、常勤7人（うち2人は外国出身、2人は障害のある人）と季節雇用5〜6人がいる。冬の住民65人が夏には500〜600人になる","source_url":"https://www.vita.it/succiso-il-paese-cooperativa-dove-ogni-giorno-si-cambia-lavoro/"},{"year":2022,"event":"2月、イタリアで最初のコミュニティ協同組合と位置づけられた。住民の半分が組合員で、宿・食堂・羊の飼育と DOP チーズの販売を行い、州立公園の最初の来訪者センターも運営している","source_url":"https://www.ilsole24ore.com/art/effetto-pandemia-e-politiche-luoghi-spingono-cooperative-comunita-AEeoesAB"}],"last_verified":"2026-08-17","sections":{"何をしたか":"トスカーナ＝エミリア・アペニン山中の集落スッチーゾで、**閉まってしまった酒場と食料品店を、住民が自分たちの会社をつくって開け直した**取り組み。**1991年、村で唯一の酒場が閉じた。その少し前には最後の食料品店も閉じていた。** 代表の Dario Torri は2016年に、村から酒場も店もなくなればその村は死ぬ運命にある、と説明している（Vita 2016年5月23日）。地元の文化協会の仲間9人が協同組合 Valle dei Cavalieri をつくった。\n\n**開け直したのは店だけではない。** 崩れかけた建物に酒場と食料品店を開き、いちばん近い店が20キロ先であることから近隣の村からも客が来るようになった。**パンは自分たちで焼いており、冬は日に20キロ、夏は80キロ。** そこから220席の食堂、6室・20床の宿を足し、2016年時点で年に最大1万4千人を受け入れている。送迎車を買って通学の輸送と高齢者の用足しも引き受けた。羊の飼育という土地の仕事も復活させている。\n\n**規模は小さいままである。** 2016年時点の組合員は33人ですべて無償の役員、常勤は7人（うち2人は外国出身、2人は障害のある人）、季節雇用が5〜6人。平均の月給はおよそ1,000ユーロとされる。冬の住民は65人で、夏には500〜600人になる。\n\n**2022年2月1日、Il Sole 24 Ore はこれをイタリアで最初のコミュニティ協同組合と位置づけた。** 同記事は、この形が**古い集落（borghi）を対象にした多くの不動産事業と違い、その土地の住民から始まり、生まれた富がその土地に残る**点を挙げている。同記事によればコミュニティ協同組合の57%は2018年から2020年のあいだに生まれ、3分の2が内陸部にある。スッチーゾには日本・韓国・ミャンマー・米国・カナダ・エスワティニから研究者が訪れているという。","誰が始めたか":"**地元の文化協会の仲間9人である。** 1991年に村で唯一の酒場が閉じ、その少し前に最後の食料品店も閉じた。代表の Dario Torri は2016年に、村から酒場も店もなくなればその村は死ぬ運命にあると説明している（Vita 2016年5月23日）。9人が協同組合 Valle dei Cavalieri をつくった。名前は、この一帯の地理的な呼び名から取られている。\n\n**組合員は住民そのものである。** 2016年時点の組合員は33人で、全員が無償の役員だった。Il Sole 24 Ore（2022年2月1日）は、**住民の半分が組合員だ**と書いている。冬の住民は65人で、夏には500〜600人になる。\n\n**Il Sole 24 Ore は、この形が古い集落を対象にした多くの不動産事業と違う点として、その土地の住民から始まり、生まれた富がその土地に残ることを挙げている。**","いくらかかったか":"**Vita（2016年5月23日）は、25年間の活動を通じた投資総額が150万ユーロ、組合の年商がおよそ70万ユーロだと書いている。** 設立時の出資額は、参照した3本のどこにも書かれていない。\n\n**分かっているのは働く側の数字である。** 2016年時点で常勤7人（うち2人は外国出身、2人は障害のある人）と季節雇用5〜6人がおり、**平均の月給はおよそ1,000ユーロ**とされる（Vita 2016年5月23日）。\n\n**規模の目安になる数字もいくつかある。** パンは冬に日20キロ、夏に日80キロ。食堂は220席、宿は6室・20床で、年に最大1万4千人を受け入れている。","真似するなら最低何が必要か":"この事例で真似できる単位は、協同組合という器そのものではなく**開ける順番と、一人が複数の仕事を持つ形**である。\n\n第一に、**閉じた店を開け直すところから始める**こと。新しい施設ではなく、崩れかけた建物に酒場と食料品店を開いた。**村から消えた機能を、消えた順に戻している。**\n\n第二に、**近隣から客が来る距離を確かめる**こと。いちばん近い店が20キロ先だったため、近隣の村からも客が来るようになった。**周囲に店がないことが、そのまま商圏になっている。**\n\n第三に、**足していく**こと。酒場と店のあとに、パンを焼き、220席の食堂を開き、6室の宿をつくり、最近では小さな保養施設を足した。羊の飼育という土地の仕事も復活させている。**最初から観光を狙った施設ではない。**\n\n第四に、**店以外の仕事も引き受ける**こと。送迎車を買って通学の輸送を担い、同じ車で高齢者の用足しもしている。**採算に乗らない仕事を、乗る仕事と同じ組織の中に入れている。**\n\n第五に、**小さいままで成り立たせる**こと。組合員33人・常勤7人・月給およそ1,000ユーロという規模である。**この形が要求するのは規模ではなく、村に残ると決めた人の数である。**","今どうなっているか":"2026年8月時点で確認できたのは、2022年2月1日の Il Sole 24 Ore の記事までである。\n\n同記事は、**スッチーゾの協同組合をイタリアで最初のコミュニティ協同組合と位置づけ**、31年前に最後の酒場の閉店に屈しなかったところから始まったと書いている。2022年時点で、住民の半分が組合員であり、宿・食堂・羊の飼育と DOP チーズの販売を行い、**州立公園「Il Gigante」の最初の来訪者センターも運営している。** 通学の送迎車も持っている。\n\n同記事によれば、コミュニティ協同組合という形はイタリア全体で増えており、**57%が2018年から2020年のあいだに生まれ、3分の2が内陸部にある。** スッチーゾはその最初の例として参照される位置にある。\n\n**組合の現在の規模（組合員数・雇用・売上）を2022年より後に書いた出典には到達できなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"150万ユーロ","currency":"EUR","value":1500000,"jpy":278400000},{"raw":"70万ユーロ","currency":"EUR","value":700000,"jpy":129920000},{"raw":"1,000ユーロ","currency":"EUR","value":1000,"jpy":185600}],"sample":false},{"id":"it-0004","name":"量販店の売れ残りを地区ごとの拠点に集め、非営利団体が世帯に配る。拠点は8つに増え、2025年は1,057トンを回収した","name_local":"Hub di Quartiere contro lo spreco alimentare","name_variants":["Hub Aiuto Alimentare","Hub di Aiuto Alimentare"],"country":"イタリア","region":"ロンバルディア州ミラノ県","municipality":"ミラノ","population_current":1365698,"population_scale":"25万超","purpose":"お金を地域で回す","theme":"農林水産・食","start_year":2019,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"ミラノ市の Food Policy 部門。Percorsi di Secondo Welfare（2021年10月20日）は、この事業がミラノ市・ミラノ工科大学・Assolombarda・Fondazione Cariplo の2017年の連携から生まれ、最初の拠点の実現に Banco alimentare della Lombardia が加わったと書いている（ミラノ市に Fondazione Cariplo・Programma QuBì・Assolombarda・ミラノ工科大学が加わって2019年に始まったと書くのは、裏取り出典の LifeGate 2024年2月7日である）。拠点ごとの運営は民間の団体が担う——Lambrate は Banco alimentare della Lombardia が AVIS Milano の空間で、Gallaratese は Terre des hommes が担う（Percorsi di Secondo Welfare 2021年10月20日）。Hub del Centro は Associazione IBVA の空間に置かれ（Gazzetta di Milano 2022年9月21日）、Selinunte は Coopi（Cooperazione Internazionale）が担い（MiTomorrow 2024年6月24日）、Cuccagna は Cascina Cuccagna が幹事となって EMERGENCY・Associazione Economia e Sostenibilità・Fondazione Acra・Associazione Comunità Il Gabbiano・Associazione Recup APS が加わる（ECO dalle Città 2024年10月16日）。回収量の集計は、Isola・Lambrate・Gallaratese についてはミラノ工科大学の Osservatorio Food Sustainability と Assolombarda が、Foody についてはミラノ大学（Università Statale di Milano）が担うと Gazzetta di Milano（2022年9月21日）が書いている","funding_scale":"金額が付いている事業資金は Earthshot Prize の賞金だけである。Percorsi di Secondo Welfare（2021年10月20日）は、ミラノ市が第1回 Earthshot Prize を受け、賞金100万ポンド（約120万ユーロ）を既存の拠点の強化と新設に投じるとしていると書いている（受賞が2021年であることは ECO dalle Città と MiTomorrow が書いている）。裏取り出典の LifeGate（2024年2月7日）は同じ100万ポンドを70万ユーロと換算しており、ポンド額は一致するがユーロ額が食い違う。同紙で副市長 Anna Scavuzzo は、その一部を既存の網の強化に、残りを拠点を8つにするために使うと述べている。MiTomorrow（2024年6月24日）でも Scavuzzo が多額の資金を投じたと述べるが、金額は書かれていない。ECO dalle Città（2024年10月16日）は、Cuccagna の拠点がこの資金で作られた3つ目で、Fondazione Azimut の拠出も受けたと書いている。**ほかの拠出は名前だけが出て金額が無い**——Hub del Centro（Gazzetta di Milano 2022年9月21日）と Lambrate に Banca di Credito Cooperativo di Milano、Gallaratese に Fondazione Milan、当時設計中とされた Corvetto に Fondazione SNAM（いずれも Percorsi di Secondo Welfare 2021年10月20日）。**拠点1つあたりの費用も、網全体の年間費用も、ど  Zero Sprechi は2020年（Ladysilvia。Gazzetta di Milano も2020年のロックダウン中に作られた Hub Ortofrutta の発展だと書く）、ECO dalle Città が引く副市長の「2018年から」は拠点ではなく食品ロスと食の貧困への取り組み全体を指している。start_year は拠点が動いていたと sources 側で確かめられる最も古い年である2019年を採り、discrepancies は立てていない。**回収量も範囲が違う。** 1,057トンは2025年の市内の網の合計（Quindicinews）、730トン超は同じ2025年の Foody Zero Sprechi 単体（Ladysilvia）で、後者は前者のおよそ69%として書かれている。同じラベルで並べていない。**Ladysilvia の数値（730トン・69%・389トン・119の寄贈者・263トン）は6本のうちこの1本にしか無い。** 2026年6月24日に示された発表値であり、裏取りは1本のみである。末尾に自動生成らしき「Domande frequenti」欄を持つので、記事が明示している数字だけを採った。**出典自身の不整合が1つある。** 裏取り出典の LifeGate は Hub Centro を Municipio 19 に置くが、Gazzetta di Milano は Hub del Centro の主体に Municipio 1 を挙げ、ECO dalle Città も Centro を Municipio 1 に置く。同じ2024年2月の発表に由来する Riciblog も Hub Centro を Municipio 1 と書いており、Municipio 19 は誤植と読める。**計画と実現の対応は2件たどれない。** LifeGate（2024年2月7日）が Municipio 2 に開くとした hub diffuso と、ECO dalle Città（2024年10月16日）が Municipio 2 に置く Loreto が同じものかは、どちらの出典にも書かれていない。また Percorsi di Secondo Welfare（2021年10月20日）が設計中とした Corvetto の拠点は、2024年以降の出典が挙げる拠点の一覧（Isola・Lambrate・Gallaratese・Centro・Selinunte・Loreto・Cuccagna・Foody）に出てこない。どうなったかは出典に書かれていない。**運営主体は sources に入れていない**（comune.milano.it、foodpolicymilano.org、Fondazione Cariplo、Fondazione Milan、Assolombarda、Politecnico di Milano）。**分類は提案である。** purpose は8種のどれにも正面から当たらない。STATE §3 の「お金を地域で回す」は地域通貨・共同出資・地元調達であり、この事業は無償の余剰食品の回収と再配分で、通貨も共同出資も地元調達も出てこない（第2層の審査でも同じ指摘があった）。分類軸は実装側で決められないので今のままにしてある。theme は手を動かした物理的対象が食品なので「農林水産・食」とした（「エネルギー・資源循環」と読む余地がある）","last_verified":"2026-08-20","sections":{"何をしたか":"ミラノ市が、量販店などの売れ残りを引き取って地区ごとに集め、地元の非営利団体を通じて生活の苦しい世帯に配る拠点を置き始めた。Percorsi di Secondo Welfare は、この事業が2017年のミラノ市・ミラノ工科大学・Assolombarda・Fondazione Cariplo の連携から生まれ、最初の拠点 Isola が2019年に102トンを集めたと書いている。\n\n拠点は増え、2022年9月に5つ目の Hub del Centro が、2024年10月には8つ目が開いた。2021年の第1回 Earthshot Prize の資金が、3つの拠点に充てられている。\n\n2026年2月には、2025年に市内の網が1,057トンを集め、前年より32%多かったと報じられた。2026年6月には、卸売市場の中の Foody Zero Sprechi 単体で730トンを超えたとされた。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub"
