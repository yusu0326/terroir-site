参加したリノベーションスクールの開催月","values":[{"value":"「２０１４年11月の同スクールで」","source_url":"https://www.nwn.jp/news/16010904_renov/","published":"2016-01-09"},{"value":"「2014年10月に開催した『第2回リノベーションスクール和歌山』」","source_url":"https://wakayama.keizai.biz/headline/541/","published":"2016-01-12"},{"value":"「2014年11月開催の『第2回リノベーションスクール@わかやま』」","source_url":"https://www.living-web.net/%E3%80%8C%E3%82%B2%E3%82%B9%E3%83%88%E3%83%8F%E3%82%A6%E3%82%B9rico%E3%80%8D%E3%82%92%E8%B5%B7%E7%82%B9%E3%81%AB%E3%81%AB%E3%81%8E%E3%82%8F%E3%81%86%E5%A4%A7%E6%96%B0%E3%82%A8%E3%83%AA%E3%82%A2/","published":"2023-03-22"}]}],"unknown_fields":["funding_scale"],"latest_source_year":2024,"elapsed_years":10,"follow_up":"濃い","follow_up_note":"2014年のリノベーションスクールから、記録は2024年まで続く。2016年の記事は空きビルの宿への改修を、2018年の記事は都市再生推進法人の指定と地下駐車場の管理を、2023年の記事は大新エリア全体の変化を扱っている。","timeline":[{"year":2016,"event":"ニュース和歌山が、2014年11月のリノベーションスクールで空室が目立つ古ビルの改修を提案したグループが「ワカヤマヤモリ舎」を立ち上げ、その第一歩としてゲストハウスRICOをつくったと報じた","source_url":"https://www.nwn.jp/news/16010904_renov/"},{"year":2018,"event":"県内初の都市再生推進法人として和歌山市に8団体が指定され、同社は4月から地元企業と共に大新公園の地下駐車場を管理すると報じられた","source_url":"https://www.nwn.jp/news/180120_sihorikawa/"},{"year":2023,"event":"LIVING和歌山が、大新エリアで新店が続々と開き、若者がイベントを開き外国人観光客が宿泊するようになったとし、その起点をゲストハウスRICOと同社の夫妻だと書いた","source_url":"https://www.living-web.net/%E3%80%8C%E3%82%B2%E3%82%B9%E3%83%88%E3%83%8F%E3%82%A6%E3%82%B9rico%E3%80%8D%E3%82%92%E8%B5%B7%E7%82%B9%E3%81%AB%E3%81%AB%E3%81%8E%E3%82%8F%E3%81%86%E5%A4%A7%E6%96%B0%E3%82%A8%E3%83%AA%E3%82%A2/"},{"year":2024,"event":"和歌山市が、同社の事業を「大新地下駐車場の指定管理開始に伴う大新公園の利活用、公園を地域の防災拠点として管理・運営」と記載した","source_url":"https://www.city.wakayama.wakayama.jp/kurashi/douro_kouen_machi/1007741/1017946.html"}],"last_verified":"2026-08-19","sections":{"何をしたか":"和歌山市の大新エリアで、空室が目立っていた5階建てのビルの一部を宿に改修し、そこを起点にエリアへ広げた。ニュース和歌山によれば、和歌山市が2013年度から開くリノベーションスクールの2期生だった一級建築士の宮原崇が、同紙が2014年11月とするスクールで古ビルのゲストハウスへの改修を提案し（**開催月は出典間で10月と11月に割れている。`discrepancies` に並置した**）、**グループのメンバーらで遊休不動産を再生してまちづくりにつなげる「ワカヤマヤモリ舎」を立ち上げ、その第一歩としてゲストハウスRICOをつくった。** 改修は昨年10月から床張りやペンキ塗りのワークショップを開き、**市民と自らの手で**行ったとされる。**その後、同社は公園の地下駐車場の管理まで引き受けている。**","誰が始めたか":"代表取締役は宮原崇である。LIVING和歌山の2023年の記事によれば、和歌山市出身の一級建築士で、地元での独立を考えつつ**「第2回リノベーションスクール@わかやま」に参加して**RICOを設計・運営した。同記事は宮原麻里についても、兵庫県西宮市出身で大阪・東京で商業施設のコンサルティングやプランニングを手掛けたのち和歌山市に移住し、RICOの立ち上げから関わったと書いている。\n\n**ただし出発点は市の側にある。** ニュース和歌山によれば、リノベーションスクールは**和歌山市が空き物件の活用で市街地の活性化を目指して開いた**もので、同記事は2期生がゲストハウスを、3期生が日本酒バーを開くことを並べて報じている。**同社はその制度から出てきた1つである。**\n\n対象となったビルについて、LIVING和歌山は「ユタカビル」という名で呼び、**和歌山市のリノベーションスクールで事業計画が実事業化された2例目**だと書いている。\n\n**なお、同じ人物の姓が出典間で異なる。** 2016年のニュース和歌山は「橘麻里マネジャー」と書き、2023年のLIVING和歌山は「宮原麻里さん」と書いている。**同一人物かどうかを断定できる記述は、今回の出典には無い。**","いくらかかったか":"**改修費も事業費も、今回の出典からは確認できなかった。** `funding_scale` は `unknown_fields` に挙げている。\n\n出典から分かるのは**費用を下げる作り方**のほうである。ニュース和歌山は、宮原がデザインを手がけ、床張りやペンキ塗りのワークショップを市民とともに行ったこと、**壁は既存のコンクリートを生かし、カウンターやランプは廃材を再利用**したこと、解体中の家で処分されかけていた家具を譲り受けて並べたことを書いている。同記事は橘麻里マネジャーの「建物だけでなく、物も捨てずにリノベーションしています」という言葉を伝えている。","真似するなら最低何が必要か":"出典から取り出せるのは5つである。\n\n1. **提案の場を先に用意すること。** 和歌山市はリノベーションスクールを2013年度から開いており、**同社はそこで出た提案を事業化したものである。** ニュース和歌山は、3期生が日本酒バー「水辺座」を今春オープンさせると並べて書いている（**同記事の掲載時点ではどちらも開業前である**）。**一社を育てる話ではなく、複数出てくる仕組みの話である**\n2. **1棟の中を用途で積むこと。** RICOは5階建てビルの一部で、1階が受付とカフェを兼ねたラウンジ、5階がゲストハウス（相部屋と個室、共同のシャワールーム・洗面室で最大37人）。2階はまちづくりに関心のある若者や学生が共同で暮らすアパートに改修したとされ、**同記事は1階の空き店舗だった場所に食堂やシェアオフィスを開くことを「今夏」の予定として書いている**\n3. **改修に住民を入れること。** 前節のワークショップがそれにあたる。**費用と当事者を同時に確保する手である**\n4. **公的な位置づけを取りに行くこと。** ニュース和歌山の2018年の記事によれば、県内初の都市再生推進法人が和歌山市に8団体誕生し、同社もその1つである。**指定されると市が立てる都市再生整備計画の策定や見直しに参画でき、公共空間を使った活動がしやすくなる**。市都市再生課は「行政は営利活動ができないが、公的位置づけを与えた推進法人は公共空間でできる」と述べている\n5. **稼げる公共施設を組にすること。** 同記事は、同社が**4月から地元企業と共に大新公園の地下駐車場を管理する**とし、利用促進策として地上の公園で自転車を貸し出すことや、店が入る仮設コンテナを持ち込んでのマルシェ開催を**構想している**と書いている\n\n**確認できない**のは、改修費、宿の稼働率、そして地下駐車場の管理でいくら入っているかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、和歌山市の令和6年10月2日更新のページである。市内の都市再生推進法人を**国内トップの13団体**とし、同社の事業を**「大新地下駐車場の指定管理開始に伴う大新公園の利活用、公園を地域の防災拠点として管理・運営」**と記している。**2018年の記事が「4月から…管理」と予定として書いていた地下駐車場の管理は、市の記載では指定管理として始まっている。**\n\nエリアの側については、LIVING和歌山が2023年の記事で、大新エリアを**「中心市街地の空洞化が叫ばれる和歌山市で“最も勢いがあるまち”といっても過言ではありません」**と書いている。**これは同紙の評価である。** 同記事は、江戸時代は商業の中心地、戦後は繊維関係の問屋が軒を連ねてにぎわい、高度経済成長期に入ると暴力団が事務所を構えて環境が一変したという経過を置いたうえで、いま新店が続々と開き、若者がイベントを開き、外国人観光客が宿泊していると書いている。\n\n**同社自身の展開も続いている。** 和歌山経済新聞は2019年に、RICOの1階にバー＆ダイニング「ウナラマデリコ」が開いたことを報じ、見出しに「ゲストハウス1階に交流の場」と置いた。**同記事の本文が書いているのは運営者の願い**（「止まり木」になってほしい、食を通じたコミュニケーションが生まれる場にしていければ）**であって、そうなったという記述ではない。** 交流拠点になっていると事実として書いているのは LIVING和歌山の2023年の記事で、19年に1階にカフェ・バー＆ダイニングが開業し「旅人と地元の人たちの交流拠点にもなっています」としている。\n\n否定的な報道は、今回探した範囲では見つからなかった。**今回robots を確認して取得できた和歌山県の媒体は LIVING和歌山・ニュース和歌山・和歌山経済新聞の3社で、他は当たっていない。** CiNii には同社を扱った書誌が1件も無い。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0016","name":"協議会の中に13人の少人数組織を置いて、駅前広場を貸せるようにした","name_local":"TCCM","name_variants":["一般社団法人TCCM","豊田シティセンターマネジメント"],"country":"日本","region":"愛知県","municipality":"豊田市","population_current":413489,"population_scale":"25万超","purpose":"空間をひらく","theme":"交通・道路・駅","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"一般社団法人TCCM（豊田市中心市街地活性化協議会の内部組織として発足。構成員は豊田まちづくり株式会社・豊田市商工会議所・豊田市商工観光課・建築士・タウンマネージャー）","component_types":"soft","components":["協議会の中に少人数の実行組織を置いた","行政と商工会議所を組織の内側に入れた","駅前デッキ広場の貸出制度を作った","道路や公園に事業者が出店できるようにした","広場の指定管理者になった"],"sources":[{"url":"https://machi.smrj.go.jp/machi/interview_block/170426toyota.html","title":"公共空間の活用事業を円滑に推進していくには〜豊田市中心市街地活性化協議会〜","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構）","published":"2017-04-26","language":"ja","from_operator":false},{"url":"https://www.mlit.go.jp/report/press/toshi05_hh_000293.html","title":"「第９回まちづくり法人国土交通大臣表彰」受賞者の決定","outlet":"国土交通省","published":"2020-05-29","language":"ja","from_operator":false},{"url":"https://www.mlit.go.jp/toshi/toshi_machi_mn_000005.html","title":"まちづくり法人国土交通大臣表彰（第9回・審査委員長賞の活動概要）","outlet":"国土交通省","published":"2021-05-31","language":"ja","from_operator":false},{"url":"https://www.city.toyota.aichi.jp/shisei/gyoseikeikaku/toshiseibi/1057117/index.html","title":"まちなかを使おう！遊ぼう！楽しもう！（豊田市駅西口ペデストリアンデッキ広場の貸出と指定管理者）","outlet":"豊田市","published":"2023-12-12","language":"ja","from_operator":false}],"context_sources":[{"url":"https://www.city.toyota.aichi.jp/shisei/tokei/1008302.html","title":"豊田市の今月の人口（2026年8月1日現在 413,489人）"}],"discrepancies":[{"field":"豊田市「まちなかを使おう！遊ぼう！楽しもう！」ページの時点","values":[{"value":"構造化された掲載日（JSON-LD）は2023-12-12","source_url":"https://www.city.toyota.aichi.jp/shisei/gyoseikeikaku/toshiseibi/1057117/index.html","published":"2023-12-12"},{"value":"本文は「令和8年8月3日（月曜日）～令和8年9月9日（水曜日）は、市産業振興課」「9月10日（木曜日）以降は、一般社団法人TCCM」と書いており、その後に更新されている","source_url":"https://www.city.toyota.aichi.jp/shisei/gyoseikeikaku/toshiseibi/1057117/index.html","published":"2023-12-12"}]}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2023,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、掲載日は2017年から2023年にわたる。2017年の記事は協議会・タウンマネージャー・TCCMの三層を、2020年の報道発表は国土交通大臣表彰の審査委員長賞を扱う。豊田市のページは掲載日が2023年だが本文は更新されている。","timeline":[{"year":2017,"event":"中小企業基盤整備機構が、豊田市の関係者間調整を協議会・タウンマネージャー・TCCMの三層として整理し、TCCMが平成29年2月に法人格を取得したと書いた","source_url":"https://machi.smrj.go.jp/machi/interview_block/170426toyota.html"},{"year":2020,"event":"国土交通省が第9回まちづくり法人国土交通大臣表彰の審査委員長賞3件の1つに一般社団法人TCCMを決定した。表彰式は新型コロナウイルス感染症の感染拡大防止の観点から取りやめられた","source_url":"https://www.mlit.go.jp/report/press/toshi05_hh_000293.html"},{"year":2023,"event":"豊田市のページが、豊田市駅西口ペデストリアンデッキ広場の指定管理者を一般社団法人TCCMとし、区域と利用料金を定めて貸出を行うと掲載した。掲載日は構造化された箇所で2023年12月12日だが、本文は令和8年の申込先を書いておりその後に更新されている","source_url":"https://www.city.toyota.aichi.jp/shisei/gyoseikeikaku/toshiseibi/1057117/index.html"}],"last_verified":"2026-08-19","sections":{"何をしたか":"愛知県豊田市で、豊田市駅前の公共空間を事業者や市民が使えるようにする実行組織を、**中心市街地活性化協議会の内側に置いた。** 中心市街地活性化協議会支援センター（中小企業基盤整備機構内）の2017年の記事によれば、豊田市の関係者間調整は①協議会、②タウンマネージャー、③協議会の内部組織であるTCCMの三層で動いている。TCCMの構成員は**豊田まちづくり株式会社4名、豊田市商工会議所3名、豊田市商工観光課3名、建築士2名、TM1名の計13名**（平成29年2月時点）で、**同記事は少人数であることによって責任権限の明確化と迅速な意思決定が図られるとしている。** TCCMは平成29年2月に法人格を取得した。","誰が始めたか":"**単独の主体ではなく、協議会の下に置かれた組織である。** 中心市街地活性化協議会支援センターは、TCCMが中心市街地活性化協議会の下に置かれ、**協議会の承認のもとに活動していると書いている。** 同記事によれば、その承認があることでTCCMは基本計画の推進・実行に関するマネジメントを積極的に行える。\n\n**トップは行政でも会社でもなくタウンマネージャーである。** 同記事は、協議会の会長から指名を受けたタウンマネージャーがTCCM会議で司会進行やアドバイスを行い、必要に応じて構成員を招集できるとし、**タウンマネージャーはプレイヤー（稼ぐ人・楽しむ人）ではなくマネージャー（下支え）的な存在だ**と書いている。\n\n構成員に行政と商工会議所が入っていることの効き目についても、同記事は具体的に書いている。**行政担当者が部署異動した際も、新任担当者がTCCM会議に参加することで事業の経緯や現状を知ることができ、異動による事業停滞のデメリットを減少させられる**という説明である。","いくらかかったか":"**費用は、今回の出典からは確認できなかった。** `funding_scale` は `unknown_fields` に挙げている。\n\n金額として出典にあるのは、豊田市が広場の貸出について**時間帯や用途により異なる利用料金**を定め、その額をPDFで公開しているという記載だけで、額そのものは今回取得したページ本文には現れていない。","真似するなら最低何が必要か":"出典から取り出せるのは5つである。\n\n1. **協議会と実行組織を分けること。** 協議会は年に2〜3回程度の開催で、構成員には自治会長や商店街の理事長も含まれる。それとは別に、**TCCM会議は月一回が定例で、進捗に応じて随時開催できる**。中小企業基盤整備機構は、これによってスピード感のある事業実施ができるとしている\n2. **実行組織を少人数にすること。** 前述の13名である。同記事は、少人数で構成されることで**責任権限の明確化**が図られ、迅速な意思決定や行動修正が容易になると書いている\n3. **許認可の側を組織の内側に入れること。** 同記事は、TCCMには**事業の許認可に対応する行政のメンバー**と、相談窓口や運営管理を行う商工会議所・まちづくり会社のメンバーが揃っているため、必要な機関との調整に柔軟に対応でき、**組織間の縦割りの弊害を減少させられる**としている\n4. **下支え役を1人立てること。** タウンマネージャーの役割である。同記事は、事業推進の周知・合意形成に加え、**場合によっては市長や商工会議所の会頭などの関係者に対しても理解をはかり、事業を行う人が活動しやすい環境を整える**と書いている\n5. **貸せる形にすること。** 豊田市は同じページで、広場を区域（北西・南西・南東）に分け、**2区域以上の利用から貸出**とし、申請書の様式と申込先を掲げている\n\n**確認できない**のは、費用、貸出の実績件数、そして三層の体制が始まった年である。**同センターは、豊田市が第1期基本計画時から第2期基本計画移行時に事業推進体制、すなわちTCCMの運営に関して大幅な改善を行ったと書いているが、その年は記されていない。改善を行った主体として出典が挙げているのは豊田市である。**","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、豊田市のページである。豊田市駅西口ペデストリアンデッキ広場について、**指定管理者を一般社団法人TCCMとし**、区域と利用料金を定めて貸出を行うと書いている。**このページは掲載日が構造化された箇所（JSON-LD）で2023年12月12日となっているが、本文は令和8年8月3日から9月9日までの申込先を市産業振興課、9月10日以降を一般社団法人TCCMと書いており、その後に更新されている。`discrepancies` に並置した。****協議会の内部組織として始まったものが、市の公共施設の指定管理者になっている。**\n\n**外からの評価も出ている。** 国土交通省は2020年5月29日の報道発表で、第9回まちづくり法人国土交通大臣表彰の**審査委員長賞3件の1つ**に一般社団法人TCCMを決めたと発表した。同省の一覧ページは、その活動概要を**「豊田市駅前において、再開発ビル広場や道路、都市公園、美術館の公共空間等を活用したまちなかの賑わい創出」**として紹介している。**この回は全国から16件の応募があり、大臣賞1件と審査委員長賞3件が選ばれている。**\n\n**なお同報道発表は、国土交通大臣賞の 全面開業30年（上）活気再び生まれ変わる港町","outlet":"神戸新聞","published":"2022-09-29","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/kobe/202209/0015681764.shtml","title":"神戸ハーバーランド全面開業30年（下）街つなぎ次代へ、関係者3人に聞く","outlet":"神戸新聞","published":"2022-09-30","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/economy/202507/0019239338.shtml","title":"神戸ハーバーランド「umie」18店リニューアル 「グラニフ」「ミスド」など秋にかけ出店続々","outlet":"神戸新聞","published":"2025-07-17","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/society/202606/0020510981.shtml","title":"神戸市主導の街開きから30年超 ハーバーランド民間運営に 外郭団体の全株放出方針","outlet":"神戸新聞","published":"2026-06-24","language":"ja","from_operator":false}],"unknown_fields":["population_current","funding_scale"],"latest_source_year":2026,"elapsed_years":44,"follow_up":"濃い","follow_up_note":"1982年の貨物駅の廃止から、記録は2026年まで続く。神戸新聞は2022年に全面開業30年の連載で核店舗の連続撤退と回復を、2025年に商業施設の店舗入れ替えを、2026年に市が同社を民営化する方針を固めたことを報じている。","timeline":[{"year":2022,"event":"神戸新聞が全面開業30年の連載で、同紙が「94年」と書く西武百貨店の閉店、「12年」と書く阪急百貨店の撤退、2013年4月のアンパンマンこどもミュージアム開業までの経過を並べた","source_url":"https://www.kobe-np.co.jp/news/kobe/202209/0015678231.shtml"},{"year":2025,"event":"神戸新聞が、商業施設umieが専門店18店をリニューアルし秋にかけて出店が続くと報じた","source_url":"https://www.kobe-np.co.jp/news/economy/202507/0019239338.shtml"},{"year":2026,"event":"神戸新聞が、神戸市が神戸ハーバーランド株式会社を民営化する方針を固めたと報じた。同社は市が今年2月に策定した外郭団体の改革方針で重点的見直し対象団体に挙がっていた","source_url":"https://www.kobe-np.co.jp/news/society/202606/0020510981.shtml"}],"last_verified":"2026-08-19","sections":{"何をしたか":"神戸市が、役割を終えた貨物駅の跡地に街をひとつ作った。神戸新聞の2022年の連載によれば、1982年に旧国鉄湊川貨物駅が役割を終え、**その跡地を中心とした約23ヘクタールを対象に、神戸市は総事業費約4千億円の大規模な再開発事業を計画した。** 市の都心部で三宮と並ぶ**西の拠点**と位置付けられた。1987年に市総合児童センターが先行して開館し、学校や住宅が完成、西武百貨店やデュオこうべも開いた。**1992年9月の街開きセレモニー当日には数千人が詰めかけ、同年10月に阪急百貨店やモザイクも含めて全面オープンした。**","誰が始めたか":"**計画したのは神戸市である。** 神戸新聞は前述のとおり、再開発事業を計画した主体を神戸市と書いている。同紙の2026年の記事は、**JR神戸駅近くの神戸ハーバーランド地区などのまちづくりを担う「神戸ハーバーランド株式会社」を市の外郭団体として扱っている。**\n\n事業者は多数にわたる。同じ2022年の連載に出てくるだけでも、西武百貨店、デュオこうべ、阪急百貨店、モザイク、星電社、ダイエー、ホテルニューオータニ、神戸アンパンマンこどもミュージアム＆モール、umie がある。**震災で三宮の社屋が全壊した神戸新聞社自身も、同紙が「96年」と書く年に新しくできた神戸情報文化ビルに本社機能を移転している**（同紙の記述）。\n\n**なお本レコードの出典のうち、1990年1月の『新都市』の記事は著者が「神戸ハーバーランド情報センター」であり、事業側の発信にあたる**（`from_operator: true` として申告した）。","いくらかかったか":"**総事業費は約4千億円**と神戸新聞が書いている（1982年の廃止後に神戸市が計画した再開発事業について）。\n\n**その内訳、公費と民間投資の比率、および個々の施設の事業費は、今回の出典からは確認できなかった。** `funding_scale` は `unknown_fields` に挙げている。**2026年の記事は会員限定で、無料で読める範囲は全文650文字のうち177文字である。有料部分は読んでいない。**","真似するなら最低何が必要か":"**この事例から取り出せるのは、核店舗が抜けたあとに何が起きたかである。**\n\n1. **核店舗が抜けたときの想定を持つこと。** 神戸新聞によれば、**同紙が「94年」と書く年に西武百貨店が業績不振を理由に閉店した。オープンわずか2年余りでの主力店の撤退**である。同紙は、これが衝撃を与えたと書いている\n2. **抜けたあとも抜け続ける前提で考えること。** 同紙は、星電社やダイエー、ホテルニューオータニなど核となる店舗や施設が**相次いで閉鎖**し、同紙が「12年」と書く年には阪急百貨店も撤退したと書き、ある関係者の「とどめを刺された感じ。みんな暗い顔をしていた」という言葉を伝えている\n3. **客層を変える施設を入れること。** 同紙は、雰囲気を変えたのは2013年4月の神戸アンパンマンこどもミュージアム＆モールの開業だとし、**アクセスが悪いとされた神戸駅方面から道沿いにキャラクターの像やイラストが並び、親子連れが行列を作った**と書いている。同時期に開いた umie との相乗効果も挙げている\n4. **人の流れを外から引くこと。** 2001年の市営地下鉄海岸線駅の開業、同紙が「21年4月」と書く時期に運行を始めた三宮と臨海部を周遊する連節バス「ポートループ」が挙げられている。市の担当者は同紙に、神戸臨海部の西の拠点としてハーバーランドが果たす役割は大きいと述べている\n5. **住む人を入れること。** 同紙は近年、大型・高層マンションの建設が続いたと書いている\n\n**確認できない**のは、来場者数の推移、テナントの入れ替わりの実数、そして4千億円の回収状況である。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年6月24日の神戸新聞である。**神戸市が神戸ハーバーランド株式会社を民営化する方針を固めたことが23日に関係者への取材で分かった**と報じている。同紙によれば、同社は**市が今年2月に策定した外郭団体の改革方針で「重点的見直し対象団体」に挙がり、市は民営化への動きをより進めることを決断した。**\n\n**この記事は会員限定で、無料で読める範囲は全文650文字のうち177文字である。見出しは外郭団体の全株放出方針に触れているが、その中身は有料部分にあり、確認していない。**\n\n商業施設の側は動いている。神戸新聞は2025年7月17日に、umie が専門店18店をリニューアルし、うち新店7店が秋にかけて出店すると報じた。\n\n2022年の連載（下）では、まちづくりに関わる3人が語っている。神戸アンパンマンこどもミュージアム＆モールの館長は**「ハーバーランドの関係者がまちづくりに真剣で、熱意を持って誘致してくれ」た**と述べ、神戸市都市局駅まち推進課の担当係長は、ポートループが三宮や新神戸方面から巡回しているのは**回遊性の向上を目指すため**であり、元町方面からもアクセスしやすいようハード整備を計画中で、JR神戸駅周辺一帯のリノベーションも重要だと考えていると述べている。**いずれも当事者の発言である。**\n\n否定的な報道については、**本レコードの中心的な出典である神戸新聞の連載そのものが、核店舗の連続撤退と、人出の戻りが鈍かったことを書いている。** 当事者の反論として確認できたのは、上記3人の発言と市担当者の発言である。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0018","name":"駅前ビルを持つ第三セクターが、8億円の累損と金銭支出問題を経て核テナントを入れ替えた","name_local":"三田地域振興","name_variants":["三田地域振興株式会社","キッピーモール"],"country":"日本","region":"兵庫県","municipality":"三田市","population_current":104724,"population_scale":"5万〜25万","purpose":"商いを起こす","theme":"商店街・市場","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"三田地域振興株式会社（三田市が株式の52.49%を出資する第三セクター）","component_types":"hybrid","components":["駅前再開発ビルを所有し運営した","駐車場を省力化して費用を下げた","撤退した核テナントを入れ替えた"],"single_outlet":true,"sources":[{"url":"https://www.kobe-np.co.jp/rentoku/bizplus/chiiki_news/201909/0012726653.shtml","title":"三田地域振興が累積損失を一掃へ スキャンダル契機に経営改善","outlet":"神戸新聞","published":"2019-09-07","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/odekake-plus/news/detail.shtml?url=news/odekake-plus/news/pickup/202012/13949524","title":"三田阪急、来秋までに撤退 駅前のシンボル、地域に衝撃","outlet":"神戸新聞","published":"2020-12-18","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/sanda/202204/0015222881.shtml","title":"市内2店目のスタバ、三田駅前に出店 阪急撤退後の活性化に期待","outlet":"神戸新聞","published":"2022-04-15","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/sanda/202209/0015662071.shtml","title":"キッピーモールに「無印良品」 12月に三田初出店、コーヒーマシンも設置 三田阪急の後継","outlet":"神戸新聞","published":"2022-09-23","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/sanda/202212/0015859420.shtml","title":"三田駅前商業施設に「無印良品」オープン 阪急百貨店撤退後の核テナント、衣食住の品ぞろえ充実","outlet":"神戸新聞","published":"2022-12-02","language":"ja","from_operator":false}],"context_sources":[{"url":"https://www.city.sanda.lg.jp/soshiki/16/gyomu/gaiyo/tokei/zinko_setai/35733.html","title":"三田市 人口及び世帯数（令和8年7月末現在 総人口104,724人・世帯数47,878）"}],"unknown_fields":["start_year","elapsed_years"],"latest_source_year":2022,"elapsed_years":null,"funding_scale":"一時は8億円を超える累積損失を抱え、2019年度に設立以来はじめて解消する見込みとなった（神戸新聞2019年9月7日・同2020年12月18日）。設立時の資本金と再開発事業費は今回の出典に無い","follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、記録は2019年から2022年にわたる。2019年の記事は累積損失の解消と金銭支出問題を、2020年の記事は核テナントの撤退を、2022年の記事は後継テナントの開業を報じている。","timeline":[{"year":2019,"event":"神戸新聞が、三田地域振興が2019年度に累積損失を設立以来はじめて一掃する見込みだと報じた。市政を揺るがした不明朗な金銭支出問題を機に経営を見直したとする","source_url":"https://www.kobe-np.co.jp/rentoku/bizplus/chiiki_news/201909/0012726653.shtml"},{"year":2020,"event":"神戸新聞が、阪急から11月27日に撤退の申し入れがあり、強く慰留したが覆らなかったと報じた。同モールから大型テナントが撤退するのは初めてとされる","source_url":"https://www.kobe-np.co.jp/news/odekake-plus/news/detail.shtml?url=news/odekake-plus/news/pickup/202012/13949524"},{"year":2022,"event":"神戸新聞が、阪急百貨店の後継の核テナントとして無印良品が開業したと報じた。同年4月には市内2店目のスターバックスの出店も報じている","source_url":"https://www.kobe-np.co.jp/news/sanda/202212/0015859420.shtml"}],"last_verified":"2026-08-19","sections":{"何をしたか":"兵庫県三田市で、市が過半を出資する第三セクターが**駅前の商業ビルを持ち続けながら、中身を入れ替えてきた。** 神戸新聞によれば、三田地域振興は三田駅前の再開発で整備された商業施設「キッピーモール」と駐車場を所有・運営するため**01年4月に設立**され、モールは**05年9月15日にオープン**した。市が株式の52.49%を出資している。**開業後は近隣の大型商業施設との競争が激化し、一時は8億円の累積損失を抱えた。** 2019年度にそれを設立以来はじめて解消する見込みとなり、2020年に阪急から撤退の申し入れがあった。**三田阪急が「昨年8月に閉店した」と報じられるのは2022年9月の記事で、後継の核テナントとして無印良品が入ったのは同年12月である。**","誰が始めたか":"**市が過半を持つ第三セクターである。** 神戸新聞は、三田市が株式の52.49%を出資し、副市長が取締役を務めていると書いている（2019年時点）。同紙は三田市を**筆頭株主**とも書いている。\n\n**当初の想定とは違う形で始まっている。** 同紙によれば、駅前再開発事業でできた同モールには**当初、百貨店の大丸が出店する計画があったが、バブル経済の崩壊などで撤回**された。阪神・淡路大震災を挟んで幾多の交渉が持たれ、**阪急が小型店舗を出すことで決着した。**","いくらかかったか":"**再開発事業費と設立時の資本金は、今回の出典からは確認できなかった。**\n\n出典から分かるのは損失の側である。神戸新聞は、**一時は8億円を超えた累積損失**を抱えたと書き、2019年度にそれを一掃する見込みだと報じた。**累損がゼロになるのは01年の設立以来はじめて**であり、11年度以降は単年度の黒字経営を続けてきたとしている。\n\n**この記事は会員限定で、無料で読める範囲までしか確認していない。** 具体的な収支の数字は有料部分にある可能性がある。","真似するなら最低何が必要か":"出典から取り出せるのは3つである。\n\n1. **核テナントは抜けるものとして持つこと。** 神戸新聞は、**同モールから大型テナントが撤退するのは初めて**だとしたうえで、阪急からの申し入れが11月27日にあり、**強く慰留したが覆らなかった**と書いている。同紙は1階のスーパー「阪急オアシス」は営業を続けると書き、2022年9月の記事では食品スーパーとして入っていることが確認できる\n2. **不祥事のあとに何を変えたかを具体で持つこと。** 同紙は、**市政を揺るがした不明朗な金銭支出問題を機に経営を見直し、大型テナントの誘致や駐車場の省力化を進めた**と書いている。**費用を下げる側（駐車場の省力化）と収入を上げる側（テナント誘致）の両方が挙げられている**\n3. **後継を早く決めること。** 阪急の撤退の報道から、後継テナントである無印良品の開業まで、同紙の報道では2年ほどである。同年4月には市内2店目のスターバックスの出店も報じられている\n**確認できない**のは、再開発事業費、賃料の水準、金銭支出問題の中身、そして無印良品の入居後の収支である。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2022年12月2日の神戸新聞である。**三田駅前商業施設に「無印良品」がオープンし、阪急百貨店撤退後の核テナントとして衣食住の品ぞろえを充実させた**と報じている。同紙は同年9月にも、12月の三田初出店とコーヒーマシンの設置を伝えていた。\n\n**当事者は撤退の時点でこう述べている。** 番庄孝夫社長は2020年12月の同紙に、阪急の撤退による経営への影響は分からないとしたうえで、**「前を向いて次のテナントを見つけるだけ」**と話した。三田市の森哲男市長も、阪急阪神百貨店と連携して新テナントの誘致を支援する考えを示している。\n\n否定的な報道は、**本レコードの出典そのものに含まれている。** 神戸新聞は累積損失8億円、設立以来はじめての累損解消、市政を揺るがした不明朗な金銭支出問題、そして初めての大型テナント撤退を報じている。当事者の側の言葉は前段の社長・市長のコメントとして併記した。\n\n**出典はすべて神戸新聞であり、`single_outlet: true` を申告した。** 掲載年は2019年・2020年・2022年の3つに分かれている。兵庫県で robots.txt が Claude を名指ししていないことを実測できた媒体が同紙であり、他紙は当たっていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0019","name":"大幅に縮んだ駅前再開発のあと、病院跡地2000坪に市場を建てて連鎖させた","name_local":"ふらのまちづくり","name_variants":["ふらのまちづくり株式会社","フラノマルシェ"],"country":"日本","region":"北海道","municipality":"富良野市","population_current":null,"population_scale":"5万人未満","purpose":"商いを起こす","theme":"商店街・市場","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"ふらのまちづくり株式会社（富良野市・富良野商工会議所と連携）","component_types":"hybrid","components":["病院跡地に市場型の施設を建てた","駅前に交通結節点を整備した","中心市街地の計画を段階で認定させた","3例目の市街地再開発を進めた"],"sources":[{"url":"https://www.city.furano.hokkaido.jp/life/docs/2015022100506.html","title":"フラノ・マルシェ オープン","outlet":"富良野市","published":"2010-04-30","language":"ja","from_operator":false},{"url":"https://machi.smrj.go.jp/machi/closeup/town/100521furano.html","title":"富良野の食文化と市民・観光客交流の拠点施設「フラノマルシェ」オープン","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構内）","published":"2010-05-21","language":"ja","from_operator":false},{"url":"https://cir.nii.ac.jp/crid/1524232505326948480","title":"活き活き商店街とまちづくり(64)ルーバン・フラノ構想を推進する : 富良野市「ふらのまちづくり株式会社」","outlet":"専門店（日本専門店会連盟機関誌）","published":"2011-11","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1523106605284533760","title":"まちづくり市民事業の展開と多主体による協働関係の構築 : ふらのまちづくり株式会社を事例として","outlet":"まちづくり（クッド研究所・学芸出版社）","published":"2011-12","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520290882171498240","title":"出資者の協議会等への参加歴からみたまちづくり会社の展開プロセス : ふらのまちづくり株式会社を対象として","outlet":"都市計画論文集（日本都市計画学会）","published":2013,"language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://machi.smrj.go.jp/machi/public/example/furano_rorikumi_jirei_20220415.html","title":"「ルーバンフラノ構想」に基づいて戦略的に進める“連鎖する”まちづくり ～富良野市中心市街地活性化の取組み～","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構内）","published":"2022-04-15","language":"ja","from_operator":false}],"funding_scale":"フラノマルシェは民間が主体となって出資したまちづくり会社が約2億8千万円をかけて取り組み、国の「戦略的中心市街地商業等活性化支援事業費補助金」約1億3千万円を申請した（2010年）。初期段階では代表取締役会長と社長が2億円の債務を個人保証で引き受けた。土地は市有地で、富良野市が固定資産税相当額で優先的に賃貸している（2022年）","discrepancies":[{"field":"フラノマルシェが開いた日","values":[{"value":"「2010年4月28日(水曜日)13時」","source_url":"https://www.city.furano.hokkaido.jp/life/docs/2015022100506.html","published":"2010-04-30"},{"value":"「成22年4月22日」（原文ママ。平成22年4月22日と読める）","source_url":"https://machi.smrj.go.jp/machi/closeup/town/100521furano.html","published":"2010-05-21"}]},{"field":"中心市街地から病院が移転した年","values":[{"value":"「平成19年に中心市街地の目抜き通りから駅裏へと移転」","source_url":"https://machi.smrj.go.jp/machi/public/example/furano_rorikumi_jirei_20220415.html","published":"2022-04-15"},{"value":"「平成18年に中心市街地の核であった大型病院が駅東側に移転」","source_url":"https://machi.smrj.go.jp/machi/closeup/town/100521furano.html","published":"2010-05-21"}]}],"unknown_fields":["population_current","start_year","elapsed_years"],"latest_source_year":2022,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、記録は2010年から2022年にわたる。2010年の2本はフラノマルシェの開業を、2011年から2013年の3本はまちづくり会社の展開過程を、2022年の記事は12年目の状況と3例目の再開発を扱っている。","timeline":[{"year":2010,"event":"富良野市と中心市街地活性化協議会支援センターが、フラノマルシェの開業を伝えた","source_url":"https://www.city.furano.hokkaido.jp/life/docs/2015022100506.html"},{"year":2013,"event":"都市計画論文集が「出資者の協議会等への参加歴からみたまちづくり会社の展開プロセス」としてふらのまちづくり株式会社を対象に据えた","source_url":"https://cir.nii.ac.jp/crid/1520290882171498240"},{"year":2022,"event":"中心市街地活性化協議会支援センターが、フラノマルシェが12年目を迎え、近傍の路線価が平成26年以降6年連続で上昇していること、市内3例目の市街地再開発事業が進んでいることを伝えた","source_url":"https://machi.smrj.go.jp/machi/public/example/furano_rorikumi_jirei_20220415.html"}],"last_verified":"2026-08-19","sections":{"何をしたか":"北海道富良野市の中心市街地で、**病院が移転して空いた目抜き通りの跡地に市場型の施設を建て、そこから次の事業へ連鎖させた。** 中心市街地活性化協議会支援センターの2022年の記事によれば、同センターが平成19年とする年に、市内で大きな集客力を持つ地域センター病院が中心市街地の目抜き通りから駅裏へ移転し（**同センターの2010年の記事は「平成18年」と書いており、出典間で1年ずれている。`discrepancies` に並置した**）、**病院跡地に2000坪の大規模空地が発生した。** 平成20年に第1期中心市街地活性化基本計画が認定され、平成22年に「フラノマルシェ」が開いた。**同記事は、富良野市の取り組みの特徴を、まちづくり会社を中心とした多様な公民連携事業を連鎖的に展開している点だとしている。**","誰が始めたか":"**この取り組みは、先行した再開発のあとから始まっている。同センターは、その事業効果は当初の想定より大きく後退したと書いている。**\n\n中心市街地活性化協議会支援センターによれば、富良野市は平成14年度から行政主導で富良野駅前地区の再開発事業（土地区画整理事業＋市街地再開発事業）に着手したが、既成市街地での土地区画整理事業であることから**総事業費の約6割を既存物件の移転補償費が占め**、事業費そのものも当時の財政事情により当初の構想から大幅なスケールダウンを余儀なくされた。**地区内権利者数も当初の49権利者から23権利者へと半減し**、地区内の既存店舗数も減少した。同記事は、事業効果が当初の想定より大きく後退し、一部の市民や経済界から厳しい評価を招く結果になったと書いている。\n\n**その一方で**、同記事は、この事業で富良野駅前に交通結節点が整備され、公共交通機関が全て駅前地区に集約されて市民や観光客の利便性向上に大きく寄与する形になったとしている。\n\n2022年の取材に答えているのは、**ふらのまちづくり株式会社の広報・企画担当、富良野市建設水道部都市建築課の主幹、富良野商工会議所の業務課長**の3人である。**会社・行政・商工会議所が並んでいる。**","いくらかかったか":"中心市街地活性化協議会支援センターの2010年の記事によれば、フラノマルシェは**商工会議所、商業者、市民など民間が主体となって出資したまちづくり会社が約2億8千万円をかけ**取り組んだものである。同記事は、**人口わずか2万5千人のまちでは資金面で厳しいことから、国の「戦略的中心市街地商業等活性化支援事業費補助金」約1億3千万円を申請**し、中小企業基盤整備機構のサポート事業やアドバイザー制度も活用したと書いている。\n\n**借り方にも特徴がある。** 同センターの2022年の記事によれば、まちづくり会社の役員は市内企業の経営者であり、**初期段階では代表取締役会長と社長が2億円の債務を個人保証で引き受けた**とされ、同記事はこれを自らリスクを取る姿勢として書いている。同記事は、実際には補助金を活用できたため初期費用の負担は軽減されたとしつつ、**補助金がなくても成り立つ前提で、改修まで見込んだ15年分の事業計画を組み、金融機関から融資を受けた**としている。\n\n**土地は買っていない。** 同記事によれば、フラノマルシェの土地は市有地であり、富良野市は**固定資産税相当額という低廉な価格で**まちづくり会社に優先的に賃貸することで、ランニングコストの面から継続的に支援している。\n\n先行した駅前地区再開発事業については、**総事業費の約6割を既存物件の移転補償費が占めた**と同センターが書いているが、その総額は記されていない。","真似するなら最低何が必要か":"出典から取り出せるのは4つである。\n\n1. **前の事業が縮んだ理由を引き継ぐこと。** 前節のとおり、移転補償費が総事業費の約6割を占めたことと、権利者が49から23へ半減したことが、事業効果の後退につながったと同センターは書いている。**フラノマルシェが建ったのは、病院が移転して空いた大規模空地である**（ただし出典は、移転補償を避けるためにその場所を選んだとは書いていない）\n2. **ビジョンを先に共有すること。** 同センターは、富良野市は第1期の認定計画時からまちづくりのビジョンが非常に明確で、**行政・民間問わず関係者でしっかり共有され、それに基づいて各取組みを行ってきた**とし、その結果が市街地全体へ波及するエリアマネジメントにつながったとしている\n3. **観光資源が郊外にあることを前提に置くこと。** 同センターは、富良野市は多くの観光客を惹きつける観光資源を持つが**その多くは郊外にあり、中心市街地には観光客を呼び込む魅力的なコンテンツも少なく、観光消費を取り込めていなかった**と書いている\n4. **連鎖の次を用意しておくこと。** 同センターは、市内3例目の市街地再開発事業が進んでいるとし、今後の展望として賑わい・交流機能の拡充、暮らしの充実、**都市再生推進法人指定の検討**を挙げている\n\n**確認できない**のは、フラノマルシェの売上（同センターは開業半月の時点で「各店の売り上げも好調です」と書くのみで数値が無い）、開業年以降の来場者数の推移、そして権利者が半減した先行事業の権利者がその後どうなったかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2022年4月15日の中心市街地活性化協議会支援センターの記事である。**平成22年に開いたフラノマルシェが12年目を迎えたとし、フラノマルシェ近傍の路線価が平成26年以降6年連続で上昇していることを「まさに活性化の成果」と書いている。** 同記事によれば、富良野市は現在市内3例目の市街地再開発事業を進めている。\n\n**開業直後の数字は別の出典にある。** 同センターは2010年の記事で、オープンして半月の時点で**目標年間来場者30万人を上回る、1日あたり約3,000人が来場し、4月29日から5月5日には約3万人が詰め掛けた**と書いている。**これは開業半月時点の値であり、その後の推移は今回の出典からは確認できない。**\n\n**路線価の数字は2022年の記事にある。** 同センターによれば、フラノマルシェ隣接の路線価は6年連続で上昇し、**2019年1月時点での路線価は2013年比で31%アップ**、7年間で113億円を上回る経済波及効果を生み出したとされる。\n\n**人口の目標も語られている。** 同記事は、少子高齢化時代において経済・雇用を成り立たせるためにも富良野市では**2万人の人口を維持したい考え**だとし、次の再開発で目指す方向性を、まち歩きが楽しいまちなかの居場所・環境づくりだとしている。\n\n**これらはいずれも、事業を進めている側（まちづくり会社・市・商工会議所）への取材にもとづく記述である。** 第三者による効果測定ではない。\n\n否定的な評価は、**この出典自身が先行事業について書いている**（前述のとおり、事業効果が当初の想定より後退し厳しい評価を招いたという記述）。フラノマルシェ以降の取り組みについての否定的な報道は、今回探した範囲では見つからなかった。**北海道の地方紙については robots.txt を測っておらず、報道による検証は行えていない。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"ke-0001","name":"植民地期の公共図書館を、所有を市に残したまま民間が直して運営した","name_local":"Book Bunk","name_variants":["Book Bunk Trust","The Book Bunk"],"country":"ケニア","region":"ナイロビ市郡","municipality":"ナイロビ（イーストランズ／カロレニ／マクミラン記念図書館）","population_scale":"不明","purpose":"誇りをつくる","theme":"学校・公共施設","start_year":2018,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"Book Bunk Trust（2017年に出版者アンジェラ・ワチュカ氏と作家ワンジル・コイナンゲ氏が設立）。建物はナイロビ市郡が所有し、中核の図書館職員も市郡が出す","funding_scale":"財団・個人・企業からの資金で運営する社会的企業として組まれている。2025年11月時点でマクミラン記念図書館の改修を終えるために2,500万シリングを集めている。2019年12月にはシャルジャ（UAE）が資金の支援を表明した","component_types":"hybrid","components":["建物は市郡の所有のまま残した","改修と資金集めを民間が担う","音楽と踊りの教室を入れた","利用者や志願者を職員にした","催しの支出を地元の業者に回す"],"sources":[{"url":"https://www.paukwa.or.ke/story-series/kelibraries/mcmillan-memorial-library-and-the-book-bunk/","title":"The Library That Was and Continues To Be","outlet":"Paukwa","published":"2019-04-24","language":"en","from_operator":false},{"url":"https://gulfnews.com/uae/sharjah-to-help-restore-historic-library-in-nairobi-1.68514835","title":"Sharjah to help restore historic library in Nairobi","outlet":"Gulf News","published":"2019-12-16","language":"en","from_operator":false},{"url":"https://hapakenya.com/2025/11/20/how-book-bunk-is-reimagining-kenyas-libraries/","title":"How Book Bunk is reimagining libraries in Kenya","outlet":"HapaKenya","published":"2025-11-20","language":"en","from_operator":false},{"url":"https://www.wri.org/insights/reviving-nairobis-libraries-builds-healthier-communities","title":"Reviving Nairobi's Libraries Is Building Healthier Communities","outlet":"World Resources Institute","published":"2026-03-24","language":"en","from_operator":false}],"context_sources":[],"unknown_fields":["population_scale","population_current"],"latest_source_year":2026,"elapsed_years":8,"follow_up":"濃い","follow_up_note":"2017年に設立され、2018年にナイロビ市郡と組んで図書館の改修を始めた。2026年3月の時点でイーストランズとカロレニの2館が終わり、1931年開館のマクミラン記念図書館の工事が続いている。","timeline":[{"year":2017,"event":"出版者アンジェラ・ワチュカ氏と作家ワンジル・コイナンゲ氏が Book Bunk Trust を立ち上げた","source_url":"https://www.wri.org/insights/reviving-nairobis-libraries-builds-healthier-communities"},{"year":2018,"event":"ナイロビ市郡と組み、所有と公開を市郡に残したまま歴史的な図書館の改修を始めた","source_url":"https://www.wri.org/insights/reviving-nairobis-libraries-builds-healthier-communities"},{"year":2019,"event":"12月、シャルジャ（UAE）がマクミラン記念図書館の改修に資金の支援を表明した。図書館での資金集めの催しで発表された","source_url":"https://gulfnews.com/uae/sharjah-to-help-restore-historic-library-in-nairobi-1.68514835"},{"year":2025,"event":"11月、マクミラン記念図書館の改修を終えるために2,500万シリングを集めていると報じられた","source_url":"https://hapakenya.com/2025/11/20/how-book-bunk-is-reimagining-kenyas-libraries/"},{"year":2026,"event":"3月、イーストランズとカロレニの2館の改修が終わり、93人分の仕事（うち21人が常勤）が生まれたと報じられた","source_url":"https://www.wri.org/insights/reviving-nairobis-libraries-builds-healthier-communities"}],"last_verified":"2026-08-19","sections":{"何をしたか":"ケニア・ナイロビで、**傷んだ公共図書館を、建物の所有を市郡に残したまま民間の団体が直して運営している**取り組み。World Resources Institute（2026年3月24日）によれば、**2018年に Book Bunk がナイロビ市郡と組み、公共の所有と公開を保ったまま歴史的な図書館を改修することにした。**\n\n**役割は分かれている。** 改修・資金集め・催しの企画・日々の運営を Book Bunk が担い、**建物の所有はナイロビ市郡が持ち続け、中核の図書館職員も市郡が出す**（同）。\n\n**2026年3月時点で、イーストランズとカロレニの2館の改修が終わっている。** 3館目は1931年に開いたナイロビ最古の公共図書館であるマクミラン記念図書館で、工事が続いている（同）。\n\n**直したのは建物だけではない。** 音楽・踊り・遊び・美術の教室（Music Bunk / Dance Bunk / Play Bunk / Art Bunk）が、学習支援・読書の催し・文化の行事と並んで置かれている（同）。","誰が始めたか":"**Book Bunk Trust は2017年に設立された。** 出版者アンジェラ・ワチュカ氏と作家ワンジル・コイナンゲ氏の2人による（World Resources Institute 2026年3月24日）。ワチュカ氏は同記事で、**公共図書館を市民の拠点に戻したかったと述べ、**知識・芸術教育・宿題の支援、さらに心の健康の相談といった役務に人が手を伸ばせる、尊厳のある場所をつくることが目的だったと説明している。\n\n**背景に植民地期の都市の形がある。** 同記事は、ナイロビの空間の配置——どこに図書館が建てられ、誰のために建てられたか——にいまも植民地期の跡が残っていると書く。1963年の英国からの独立ののちも投資が乏しい年月が続き、多くの建物が使われないまま傷んだ。**住民の半数以上が非公式の地区に住む都市では、公共の場所は市と同じくらい住民の手で作られ保たれている**というのが同記事の見立てである。\n\n**建物そのものは20世紀初めのものである。** Paukwa（2019年4月24日）によれば、マクミラン記念図書館は、探検家で実業家のウィリアム・ノースラップ・マクミランの死後、妻のルーシー・マクミランがナイロビ市議会に建設を提案したもので、礎石は1929年に据えられた。ルーシー・マクミランは同館をマクミラン記念図書館法で保護し、史跡・記念物に位置づけた。\n\n**外部からの資金も入っている。** Gulf News（2019年12月16日）は、シャルジャ（UAE）が同館の改修に資金の支援を表明したと伝えている。図書館で開かれた資金集めの催しで、国際出版連合（IPA）の副会長でありシャルジャ世界図書首都諮問委員会の長でもあるボドゥール・ビント・スルタン・アル・カシミ氏が発表した。同記事は、Book Bunk Trust が市内3館の改修を監督すると書いている。","いくらかかったか":"**改修の総額は、参照した4本のどこにも書かれていない。** 分かるのは断片である。\n\n- **いま集めている額**：HapaKenya（2025年11月20日）によれば、マクミラン記念図書館の改修を終えるために2,500万シリングを集めている\n- **資金の出どころ**：同記事は、Book Bunk が社会的企業として組まれ、財団・個人・企業から資金を得ていると書く。**公共図書館が創造の拠点であり不可欠な役務の担い手になりうると示す必要から、この形が選ばれている**という説明である\n- **外部からの支援**：2019年12月にシャルジャ（UAE）が資金の支援を表明した（Gulf News 2019年12月16日）\n- **利用者の負担**：Paukwa（2019年4月24日）によれば、マクミラン記念図書館は週を通して公開され、年会費1,000シリングで個人が会員になれる。小中学生は無料である","真似するなら最低何が必要か":"第一に、**所有を動かさない**こと。World Resources Institute（2026年3月24日）によれば、この取り組みは**公共の所有と公開を保ったまま**改修する形をとっている。所有は市郡、改修と運営は民間、という分け方である。**中核の図書館職員も市郡が出し続けている。**\n\n第二に、**何を残し何を変えるかを住民に聞いてから決める**こと。同記事によれば、地域の相談会・聞き取り・少人数の話し合いを通して優先順位を洗い出し、それがいまの催しの中身を決めている。**カロレニでは目の見えにくい子どもにワチュカ氏が会ったことをきっかけに、地元の団体と組んで視力の検査を始めた。**\n\n第三に、**館ごとに中身を変える**こと。Book Bunk Trust の催し担当ディレクター、マリアン・ワムユ氏は「場所が違えば来る人も違う」という趣旨を述べている（同）。**カロレニは市内で最も古い地区の一つで休暇中の活動と若者向けの芸術教育が中心、イーストランズは年長の生徒や大学に通う人の学習・デジタル技能・共同制作が中心**という違いがある。\n\n第四に、**利用者と志願者を職員にする道をつくる**こと。当初は志願者に頼っていたが、地域の人が職員になり長く場所を預かる道が用意された。**改修と運営で93人分の仕事が生まれ、うち21人が常勤で、その多くは元の志願者や利用者である**（同）。\n\n第五に、**お金を地元に落とす形を先に決める**こと。HapaKenya（2025年11月20日）によれば、Book Bunk は地域の疑いに応えるため、**催しの支出の一定の割合が地元の職人や業者に回るようにし、長期の企画では地元の講師を雇っている。**\n\n第六に、**分類の仕組みまで見直す**こと。同記事は、デューイ十進分類法のような仕組みがいまの資料に合うかを検討し、職員の技能を今日の求めに合わせて上げる作業が含まれると書いている。","今どうなっているか":"**2026年8月時点で確認できたのは、2026年3月24日の記事までである。**\n\n**2館が終わり、3館目が工事中である。** World Resources Institute（2026年3月24日）によれば、イーストランズとカロレニの改修は終わり、マクミラン記念図書館は工事が続いている。同記事は、この取り組みを WRI Ross Center Prize for Cities の最終候補を紹介する連載の一本として扱っている。\n\n**使われ方が変わったという証言が載っている。** Book Bunk Trust の広報担当シャロン・タルス氏は、住民が「図書館に来ることに安心を感じている」とし、子どもを送り出して一日預けることにも安心していると述べている（同）。カロレニ図書館の近くのマコンゲニで育ち、子どものころ同館を使っていた踊りの講師ケルビン・カムヒア・キンゴリ氏は、振り付けと踊りの指導に、自分を知ること・共に働くこと・自信をめぐる生活技能の訓練を組み合わせている（同）。\n\n**負荷と抵抗も報じられている。** HapaKenya（2025年11月20日）は、**この仕事に個人の消耗する犠牲と絶えざる政治的な押し戻しが伴ってきた**と書いている。**参照した4本の中に、押し戻した側の言い分は無い。** 同記事は、ワチュカ氏が図書館を社会の基盤かつ経済の駆動力として扱うべきだと訴え、使われていない公民館のような他の公共空間と統合して公有地を守り、地域が使える範囲を広げることを主張したと伝えている。\n\n**全国の図書館を数える作業も生まれている。** World Resources Institute（2026年3月24日）によれば、事業の早い段階でケニアの図書館制度についての情報がほとんど無いことに気づいたため、全国の図書館を地図に落とす取り組みを始め、**およそ1,200館を見つけて全体像を初めて描いた。** その調べは、改修・統治・運営の進め方をまとめた手引き（Book Bunk Blueprint）に流し込まれている。"},"completeness":"full","shelf":" 1","name":"グスタボ・A・マデロ区へロープウェイを通し、5年で3路線に増やした","name_local":"Cablebús","country":"メキシコ","region":"メキシコシティ","municipality":"メキシコシティ（グスタボ・A・マデロ区ほか）","population_current":9209944,"population_scale":"25万超","purpose":"歩けるようにする","theme":"交通・道路・駅","start_year":2021,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"メキシコシティ政府。1号線と3号線の建設は Doppelmayr が担った","component_types":"hard","components":["グスタボ・A・マデロ区に索道を通した","1号線を9.2kmで開いた","5年で3路線に増やした","次の3路線の予算を組んだ"],"funding_scale":"今後の3路線の事業費は、4号線が約46億1,688万ペソ、5号線が約78億6,815万ペソ（付加価値税込み）、6号線が約48億4,581万ペソ（2026年1月時点の計画）","sources":[{"url":"https://www.milenio.com/politica/comunidad/cablebus-cdmx-teleferico-usado-america-latina","title":"Cablebús de CdMx, segundo teleférico más usado en América Latina","outlet":"Milenio","published":"2021-07-25","language":"es","from_operator":false},{"url":"https://www.eluniversal.com.mx/metropoli/linea-1-del-cablebus-sin-casos-de-acoso-asalto-o-accidentes-a-3-anos-de-funcionamiento-transporta-65-mil-usuarios-al-dia/","title":"Línea 1 del Cablebús sin casos de acoso, asalto o accidentes a 3 años de funcionamiento; transporta 65 mil usuarios al día","outlet":"El Universal","published":"2024-11-28","language":"es","from_operator":false},{"url":"https://www.eluniversal.com.mx/metropoli/linea-3-del-cablebus-cumple-un-ano-de-operacion-y-ha-transportado-a-54-millones-de-usuarios/","title":"Línea 3 del Cablebús cumple un año de operación y ha transportado a 5.4 millones de usuarios","outlet":"El Universal","published":"2025-09-26","language":"es","from_operator":false},{"url":"https://www.eluniversal.com.mx/metropoli/linea-2-del-cablebus-lidera-afluencia-en-2025-movilizo-a-casi-23-millones-de-usuarios/","title":"Línea 2 del Cablebús lidera afluencia en 2025: movilizó a casi 23 millones de usuarios","outlet":"El Universal","published":"2026-01-08","language":"es","from_operator":false}],"context_sources":[{"url":"https://www.milenio.com/politica/elecciones-2021/elecciones-2021-cdmx-casos-covid-datos-demograficos","title":"Milenio（Inegi 2020年センサス。メキシコシティの人口 9,209,944人）"}],"unknown_fields":[],"latest_source_year":2026,"elapsed_years":5,"follow_up":"濃い","follow_up_note":"2021年7月に1号線が動き出し、2週間で1日5万6,000人を超えた。2024年11月には1号線が3年で1日6万5,000人になり、2025年9月には3号線が開業1年で540万人を運んだ。2026年1月時点で2号線が年間2,300万人近くを運んでいる。","timeline":[{"year":2021,"event":"7月、1号線（インディオス・ベルデス〜クアウテペック）が動き出し、2週間で1日5万6,000人を超えた。全長9.2km、63基の支柱、6駅。ラテンアメリカで2番目に使われる索道になったとされた","source_url":"https://www.milenio.com/politica/comunidad/cablebus-cdmx-teleferico-usado-america-latina"},{"year":2024,"event":"11月、1号線が開業3年を迎え、1日6万5,000人を運んでいると報じられた。この3年間で嫌がらせ・強盗・事故の報告はないとされた","source_url":"https://www.eluniversal.com.mx/metropoli/linea-1-del-cablebus-sin-casos-de-acoso-asalto-o-accidentes-a-3-anos-de-funcionamiento-transporta-65-mil-usuarios-al-dia/"},{"year":2025,"event":"9月、チャプルテペックの森を越える3号線が開業1年を迎え、540万人を運んだ","source_url":"https://www.eluniversal.com.mx/metropoli/linea-3-del-cablebus-cumple-un-ano-de-operacion-y-ha-transportado-a-54-millones-de-usuarios/"},{"year":2026,"event":"1月、2号線が2025年の利用で最多となり、2,300万人近くを運んだと報じられた。市政府は任期中に4・5・6号線を建設する計画を示している","source_url":"https://www.eluniversal.com.mx/metropoli/linea-2-del-cablebus-lidera-afluencia-en-2025-movilizo-a-casi-23-millones-de-usuarios/"}],"last_verified":"2026-08-17","sections":{"何をしたか":"メキシコシティがロープウェイを通した。ミレニオによれば、1号線はグスタボ・A・マデロ区のインディオス・ベルデスからクアウテペックまでを結び、**全長9.2km、63基の支柱、6駅**。2021年7月に動き出し、**わずか2週間で1日5万6,000人を超える利用**があった。同紙は、この時点でボリビア・ラパスのモラダ線（1日約5万8,000人）に次ぐ、ラテンアメリカで2番目に使われる索道になったと書いている。その後も路線は増え、2026年1月時点で3路線が動いている。","誰が始めたか":"メキシコシティ政府である。1号線と3号線の建設は索道メーカー Doppelmayr が担った。2024年の記事によれば、同社は市政府が次の路線の入札を出すのを待っている状態にあった。\n\n**利用者数の出どころは年ごとに違う。** 2021年の1日5万6,000人は市の交通局（Secretaría de Movilidad）の発表、2024年の1日6万5,000人は Doppelmayr México の CEO Konstantinos Panagiotou の発言、2026年の2号線2,300万人は電気輸送公社（Sistema de Transportes Eléctricos、STE）がエル・ウニベルサルに伝えた数字である。2025年の3号線540万人については、記事は発表主体を書いていない。同記事は、3号線の運営を1年目のDoppelmayrから STE が引き継いだと書いている。\n\n**路線の拡張は市長の任期に紐づいている。** 2026年の記事は、Clara Brugada 市長の政権が任期中に3つの新路線を建設するとしている。","いくらかかったか":"**既存3路線の建設費は今回の出典に出てこない。** 出ているのは**これから作る3路線の予算**である。\n\n- 4号線（トラルパン〜コヨアカン）：約46億1,688万ペソ\n- 5号線（アルバロ・オブレゴン〜マグダレナ・コントレラス）：約78億6,815万ペソ（付加価値税込み）\n- 6号線（ミルパ・アルタ〜トラウアック）：約48億4,581万ペソ\n\n**路線ごとに1.7倍の開きがある**ことが読み取れる。地形と延長が費用を決めるこの型の事業では、1kmあたりの単価を1つに丸められない。","真似するなら最低何が必要か":"1. **索道メーカーとの継続的な関係。** 1号線と3号線は同じメーカーが建てている。**路線を増やす前提なら、単発の入札では組み立てにくい**\n2. **治安の設計。** 2024年の記事は、3年間で嫌がらせ・強盗・事故の報告がないことを、駅の設計と結びつけて説明する関係者の言葉を伝えている。**乗り物の安全性ではなく、駅で走って逃げられない造りかどうかが語られている**\n3. **政権の任期を超える計画。** 拡張が市長の任期に紐づいているため、**任期が変わると止まりうる**\n\n**確認できない**のは、既存3路線の建設費、運賃、そして沿線の住民の暮らしがどう変わったかである。今回の出典はいずれも輸送人員の発表を軸にした記事で、**街の側の変化を書いていない。**","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年1月8日のエル・ウニベルサルの記事である。2号線が2025年の利用で最も多く、2,300万人近くを運んだ。3号線は2024年9月24日にチャプルテペックの森を越える路線として開業し、2025年9月の時点で1年間に540万人を運んでいる。1号線は2024年11月の時点で1日6万5,000人。**開業当初の1日5万6,000人から増えている。**\n\n**否定的な報道は、今回探した範囲では見つからなかった。** ただし上に書いたとおり、今回の出典はすべて輸送人員の発表を軸にした記事である。**利用者数が増えていることと、この事業が沿線にとって良かったかどうかは別の問いであり、後者を確かめられる出典を今回は得られていない。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"46億1,688万ペソ","currency":"MXN","value":4616880000,"jpy":43397748624},{"raw":"78億6,815万ペソ","currency":"MXN","value":7868150000,"jpy":73959036370},{"raw":"48億4,581万ペソ","currency":"MXN","value":4845810000,"jpy":45549644838}],"sample":false},{"id":"mx-0002","name":"月に一度、資源ごみを持ち込むと点数がつき、近郊の農産物と交換できる市を開いた","name_local":"Mercado de Trueque","name_variants":["Mercado del Trueque"],"country":"メキシコ","region":"メキシコシティ連邦区","municipality":"メキシコシティ（チャプルテペック森林公園ほか）","population_current":9209944,"population_scale":"25万超","purpose":"お金を地域で回す","theme":"エネルギー・資源循環","start_year":2012,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"メキシコシティ環境局（Sedema）。売り手は市南部とモレロス州の農業者","component_types":"soft","components":["月に一度だけ開く市にした","持ち込んだ量を計って点数にした","点数を近郊の農産物と交換した","生産者が仲買を通さず売れる","衣類と古着も後から加えた"],"sources":[{"url":"https://archivo.eluniversal.com.mx/ciudad/111881.html","title":"Morelos se une al mercado de trueque","outlet":"El Universal","published":"2012-06-04","language":"es","from_operator":false},{"url":"https://www.eluniversal.com.mx/metropoli/mercado-de-trueque-el-reto-es-su-expansion/","title":"Mercado de Trueque: el reto es su expansión","outlet":"El Universal","published":"2025-03-30","language":"es","from_operator":false},{"url":"https://www.excelsior.com.mx/comunidad/cdmx-recicla-mas-de-25-toneladas-dia-reciclatron-mercado-de-trueque/1716509","title":"CDMX recicla más de 25 toneladas en un solo día en Reciclatrón y Mercado de Trueque","outlet":"Excélsior","published":"2025-05-17","language":"es","from_operator":false},{"url":"https://www.eluniversal.com.mx/metropoli/dia-mundial-del-reciclaje-mercado-del-trueque-ya-recibe-ropa-acopian-mas-de-3-mil-kilos-de-residuos-reciclables-y-4-toneladas-de-textiles/","title":"Día Mundial del Reciclaje: Mercado del Trueque ya recibe ropa","outlet":"El Universal","published":"2025-05-17","language":"es","from_operator":false},{"url":"https://www.eluniversal.com.mx/tendencias/mercado-de-trueque-en-iztacalco-que-es-como-funciona-y-donde-estara/","title":"Mercado de Trueque en Iztacalco; ¿qué es, cómo funciona y dónde estará?","outlet":"El Universal","published":"2026-08-02","language":"es","from_operator":false}],"context_sources":[{"url":"https://www.milenio.com/politica/elecciones-2021/elecciones-2021-cdmx-casos-covid-datos-demograficos","title":"Milenio（Inegi 2020年センサス。メキシコシティの人口 9,209,944人）"}],"unknown_fields":["funding_scale"],"editor_notes":"**1本目の掲載日は構造化された箇所と本文で食い違う。** `archivo.eluniversal.com.mx` の記事は\n`meta:date` が 2015-07-20 だが、本文の署名欄は「Lunes 04 de junio de 2012」で、\n内容も「第4回」「初めてモレロス州の生産者が加わった」と2012年の回を書いている。\n**2015-07-20 は記録の移し替えの日と見て、本文の日付（2012-06-04）を採った。**\n2012年6月4日は実際に月曜日である。\n\n**2025-05-17 の2本は同じ日の同じ催しを別の媒体が書いたものである。**\n数字の出どころが同じ発表の可能性があるので、STATE §3「同一発表に由来する記事」に照らせば\n独立した本数としては1本に丸めるのが安全である。**残る独立した報道は2012年・2025-03-30・2026-08-02 の3本。**\n\n**来場が減っていることが出典に書かれている。** 2012年の記事は最初の3回で延べ2万5,000人としているのに対し、\n2025-03-30 の記事は2024年の年間来場を4,917人・回収31,018キロと書き、\n研究者が周知と開催日数の拡充を求めていると伝えている。**片側だけを書かないこと。**\n","latest_source_year":2026,"elapsed_years":14,"follow_up":"濃い","follow_up_note":"2012年の第4回では最初の3回で延べ2万5,000人が参加した。2025年3月の記事は2024年の来場が4,917人だったと書き、2025年5月には衣類の受け入れが始まり、2026年8月にも開催が告知されている。","timeline":[{"year":2012,"event":"6月、チャプルテペック森林公園で第4回が開かれ、初めてモレロス州の生産者が加わった。最初の3回で延べ2万5,000人が参加し、無機ごみ50トンが再生に回ったと報じられた。生産者側は「仲買が消えるので安く出せる」と述べている","source_url":"https://archivo.eluniversal.com.mx/ciudad/111881.html"},{"year":2025,"event":"3月、12年を経た時点の記事が出た。環境局の開示によれば2012年から2024年までに回収した紙で700万本を超える伐採を避けたとされる一方、2024年の来場は4,917人・回収31,018キロにとどまり、研究者は周知と開催日数の拡充を求めた","source_url":"https://www.eluniversal.com.mx/metropoli/mercado-de-trueque-el-reto-es-su-expansion/"},{"year":2025,"event":"5月、リサイクルの日に合わせた回で初めて衣類と繊維を受け入れた。同じ日の催しについて別の媒体は、電子機器の回収と合わせて1日で25トンを超えたと報じている","source_url":"https://www.excelsior.com.mx/comunidad/cdmx-recicla-mas-de-25-toneladas-dia-reciclatron-mercado-de-trueque/1716509"},{"year":2026,"event":"8月、イスタカルコ区での開催が告知された。受け入れるのはアルミと鉄の缶、ガラス瓶、PETとHDPE、紙と段ボール、テトラパック、使用済み食用油、電子・電気機器である","source_url":"https://www.eluniversal.com.mx/tendencias/mercado-de-trueque-en-iztacalco-que-es-como-funciona-y-donde-estara/"}],"last_verified":"2026-08-18","sections":{"何をしたか":"メキシコシティで、**市の環境局が月に一度だけ開く市をつくり、住民が持ち込んだ資源ごみを計って点数にし、その点数で近郊の農産物と交換できるようにした。**\n\nエル・ウニベルサルの2012年の記事によれば、会場はチャプルテペック森林公園の第1区画で、毎月第1日曜に開かれていた。この回から市南部だけでなくモレロス州の生産者も加わり、桃・そら豆・かぼちゃ・アボカド・じゃがいも・すももを1.5トン持ち込んで完売した。生産者の一人は「仲買が消えるので安く出せるし、人と知り合える」と述べている。\n\n受け入れる品目はのちに広がり、2025年5月には衣類と繊維も加わった。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"mx-0003","name":"放棄された船形の建物を工芸と芸術の場にし、同じ型を市内に増やした","name_local":"Faro de Oriente","name_variants":["FARO de Oriente","Fábrica de Artes y Oficios de Oriente","Fábrica de Artes y Oficios"],"country":"メキシコ","region":"メキシコ市","municipality":"イスタパラパ区","population_scale":"不明","purpose":"誇りをつくる","theme":"文化・アート・祭り","start_year":2000,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"メキシコ市の文化行政。2000年に詩人アレハンドロ・アウラ氏とエドゥアルド・バスケス氏らの集まりが設立した。文化省の試行事業として始まっている","funding_scale":"参照した5本のどこにも金額が書かれていない。2025年2月には、講座を持つ人たちが「福祉奨学金に似た契約の形で労働者としての権利が無く、支払いの遅れと未払いがある」と述べていると報じられている","component_types":"hybrid","components":["放棄された建物を使い直した","工芸と芸術の講座を開く","デジタルの講座を後から足した","同じ型の施設を市内に増やした","周縁の区に最初の1つを置いた"],"sources":[{"url":"https://www.milenio.com/cultura/faro-oriente-15-anos-iluminando-iztapalapa","title":"El Faro de Oriente, 15 años iluminando Iztapalapa","outlet":"Milenio","published":"2015-07-09","language":"es","from_operator":false},{"url":"https://heraldodemexico.com.mx/cultura/2017/6/21/el-faro-de-oriente-espacio-para-el-arte-la-cultura-12956.html","title":"El FARO de Oriente, espacio para el arte y la cultura","outlet":"El Heraldo de México","published":"2017-06-21","language":"es","from_operator":false},{"url":"https://www.eluniversal.com.mx/cultura/tras-25-anos-los-faros-de-la-ciudad-padecen-abandono-y-clima-laboral-hostil/","title":"Tras 25 años, los Faros de la ciudad padecen abandono y clima laboral hostil","outlet":"El Universal","published":"2025-02-11","language":"es","from_operator":false},{"url":"https://ntcd.mx/noticias-faro-oriente-25-aniversario-conciertos-iztapalapa","title":"FARO de Oriente celebra 25 años con conciertos, talleres y arte comunitario en Iztapalapa","outlet":"NTCD Noticias","published":"2025-06-21","language":"es","from_operator":false},{"url":"https://oncenoticias.digital/cultura/el-faro-de-oriente-late-fuerte-en-su-25-aniversario/489920/","title":"El Faro de Oriente \"Late Fuerte\" en su 25 aniversario","outlet":"Once Noticias","published":"2025-06-23","language":"es","from_operator":false}],"context_sources":[],"unknown_fields":["population_scale","population_current","funding_scale"],"discrepancies":[{"field":"設立年","values":[{"value":"2000年（6月24日に開いた。2017年の記事は「開設は2000年」と書く）","source_url":"https://heraldodemexico.com.mx/cultura/2017/6/21/el-faro-de-oriente-espacio-para-el-arte-la-cultura-12956.html","published":"2017-06-21"},{"value":"2000年（それまで放棄されていた建物で、この年に設立された）","source_url":"https://www.milenio.com/cultura/faro-oriente-15-anos-iluminando-iztapalapa","published":"2015-07-09"},{"value":"1999年（「1999年の設立以来」と書いている）","source_url":"https://oncenoticias.digital/cultura/el-faro-de-oriente-late-fuerte-en-su-25-aniversario/489920/","published":"2025-06-23"}]}],"latest_source_year":2025,"elapsed_years":25,"follow_up":"濃い","follow_up_note":"2000年に放棄されていた船形の建物で始まり、2017年には市内5か所の網に広がった。2025年2月に El Universal が施設の傷みと支払いの遅れを報じ、同年6月には25周年の催しが開かれている。","timeline":[{"year":2000,"event":"6月24日に開いた。詩人アレハンドロ・アウラ氏とエドゥアルド・バスケス氏らの集まりが、建てかけで放棄されていた船形の建物を使って設立した","source_url":"https://www.milenio.com/cultura/faro-oriente-15-anos-iluminando-iztapalapa"},{"year":2004,"event":"米国で始まった Clubhouse の一行が視察に来た。同じ年から、従来の工芸に加えてデジタルの講座が入り始めた","source_url":"https://heraldodemexico.com.mx/cultura/2017/6/21/el-faro-de-oriente-espacio-para-el-arte-la-cultura-12956.html"},{"year":2015,"event":"7月、15年目として報じられた。開設の3か月後に無償の実習生として入った人物が、10年後に館の長になっている","source_url":"https://www.milenio.com/cultura/faro-oriente-15-anos-iluminando-iztapalapa"},{"year":2017,"event":"6月、17年目。アラゴン・オリエンテ・インディオスベルデス・トラウァク・ミルパアルタの5か所の網になったと報じられた","source_url":"https://heraldodemexico.com.mx/cultura/2017/6/21/el-faro-de-oriente-espacio-para-el-arte-la-cultura-12956.html"},{"year":2019,"event":"8月、館内に経済文化基金（FCE）の書店が開いた。のちに売上不足で営業をやめたと、館で働く人が説明している","source_url":"https://www.eluniversal.com.mx/cultura/tras-25-anos-los-faros-de-la-ciudad-padecen-abandono-y-clima-laboral-hostil/"},{"year":2025,"event":"2月11日、El Universal が主棟の傾きと壁の亀裂、5年使えない図書館、書店の閉店、支払いの遅れと抗議を報じた","source_url":"https://www.eluniversal.com.mx/cultura/tras-25-anos-los-faros-de-la-ciudad-padecen-abandono-y-clima-laboral-hostil/"},{"year":2025,"event":"6月28日に25周年の催しが開かれた。標語は「25年、強く脈打つ」である","source_url":"https://oncenoticias.digital/cultura/el-faro-de-oriente-late-fuerte-en-su-25-aniversario/489920/"}],"last_verified":"2026-08-19","sections":{"何をしたか":"メキシコ市イスタパラパ区で、**建てかけのまま放棄されていた船の形の建物を、工芸と芸術の場に作り替えた**取り組み。\n\n**建物の由来が出典に残っている。** Milenio（2015年7月9日）によれば、この船形の建物は、バスコンセロス図書館も手がけた建築家アルベルト・カラチ氏の設計で、**もともとは市で最も人口が多く周縁に置かれた区の庁舎になるはずだった。** 1990年代初めのその計画は進まず、コンクリートと鉄板とガラスの棟は放棄された。**建てられた土地は「誰のものでもない土地」で、近くで興行する曲馬団が動物をつないでおく場所だった**（同）。\n\n**2000年に、詩人アレハンドロ・アウラ氏とエドゥアルド・バスケス氏らの集まりが、そこに Fábrica de Artes y Oficios de Oriente（FARO）を設立した**（同）。El Heraldo de México（2017年6月21日）によれば、これは文化省の試行事業として生まれ、**街の周縁に住む人たちに文化の表現と昔ながらの工芸を近づけることを狙っていた。**\n\n**講座の中身は途中で変わっている。** 同記事によれば、2004年にデジタルの表現が美術の場に入り始めてから、絵画・版画・彫刻・カルトネリア（張り子）・木工といった従来の講座に、デジタルの媒体を使う講座が加わった。","誰が始めたか":"**始めたのは市の文化行政である。** El Heraldo de México（2017年6月21日）は、FARO de Oriente が文化省の試行事業として生まれたと書いている。Milenio（2015年7月9日）によれば、設立したのは詩人アレハンドロ・アウラ氏（1944〜2008）とエドゥアルド・バスケス氏（記事の時点でメキシコ市文化長官）らの集まりで、**「街はみんなのもの（La calle es de todos）」という、公共空間を取り戻して文化の提案を置く事業の続きとして構想された。**\n\n**場所の選び方に意図がある。** El Heraldo de México（2017年6月21日）は、この提案が人口の多い区の一つであるイスタパラパで始まったと書いている。メキシコ市文化長官アナ・フランシス・モル氏は2025年、**「新自由主義の見方ではそこにはごみが行くのであって文化ではないと考えられていた場所に、質の高い建築と造形の賭けがあった」**という趣旨を述べている（Once Noticias 2025年6月23日）。\n\n**中で育った人が運営を継いでいる。** Milenio（2015年7月9日）によれば、開設の3か月後に美術を学ぶ学生として無償の実習に入った人物が、遊具室の助手、造形の講座を持つ人、講座の取りまとめを経て、**10年後に館の長になった。** 同じ人物は2017年の記事では副館長として登場する（El Heraldo de México 2017年6月21日）。\n\n**設立年は出典間で食い違う。** Milenio と El Heraldo de México は2000年（開設日は6月24日）とし、Once Noticias（2025年6月23日）は「1999年の設立以来」と書いている。`discrepancies` に並置した。","いくらかかったか":"**金額は、参照した5本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**元手として大きいのは建物そのものである。** 使ったのは、区の庁舎になるはずだったまま放棄されていた棟である（Milenio 2015年7月9日）。**新しく建てたのではない。**\n\n**働く側の条件については、2025年に具体的な指摘が出ている。** El Universal（2025年2月11日）は、Faro の網で講座を持つ人と取りまとめ役が、**福祉奨学金（Becas del Bienestar）に似た契約の形で労働者としての権利が無いこと、支払いの遅れと未払いがあること**に絶えず直面していると報じている。","真似するなら最低何が必要か":"第一に、**放棄された建物を探す**こと。この事業が使ったのは、庁舎の計画が進まないまま残されたコンクリートと鉄板とガラスの棟である（Milenio 2015年7月9日）。**建てる費用ではなく、使い直す費用から始まっている。**\n\n第二に、**最初の1つを周縁に置く**こと。El Heraldo de México（2017年6月21日）によれば、この試行事業は街の周縁に住む人へ文化と工芸を近づけることを狙い、人口の多い区の一つであるイスタパラパで始まった。\n\n第三に、**工芸（oficios）を芸術と並べる**こと。名前そのものが「芸術と工芸の工場」である。講座には絵画・版画・彫刻に加えて、張り子と木工が並んでいる（同）。\n\n第四に、**中で育った人に運営を渡す**こと。開設の3か月後に無償の実習生として入った人物が、10年後に館の長になっている（Milenio 2015年7月9日）。\n\n第五に、**講座の中身を時代に合わせて入れ替える**こと。2004年にデジタルの表現が入り始めてから、従来の工芸を補うかたちでデジタルの講座が加わった（El Heraldo de México 2017年6月21日）。\n\n第六に、**建物の維持を誰が担うかを先に決めておく**こと。**この事業では、そこが25年目に問題として表に出た。** El Universal（2025年2月11日）は、主棟の構造が傾き、壁に大きな亀裂があり、使える資材が古いと報じている。**建物を使い直す設計は、その建物が傷んだときに誰が直すのかを決めていないと止まる。**","今どうなっているか":"**2026年8月時点で確認できたのは、2025年6月23日の記事までである。**\n\n**25年目に、施設の傷みが報じられた。** El Universal（2025年2月11日）の記者が現地を歩いた記録によれば、主棟の構造は傾き、壁には大きな亀裂があり、主棟の裏の遊具室の前には長さ10センチほどの深い亀裂がある。**アレハンドロ・アウラ図書館は使えなくなっており、構造の被害のため5年にわたって直せていない。** 2019年8月に開いた経済文化基金（FCE）の書店は、売上が足りず前年の半ばに営業をやめたと、館で働く人が同紙に説明している。張り子の大きな像は寿命を過ぎたまま屋外に置かれている。\n\n**働く側からの抗議が続いている。** 同記事によれば、2025年1月19日にミルパアルタ＝ミアカトラン館で作業の停止があり、1月24日には文化省で抗議が行われ、コスモス館には数週間にわたって横断幕が掲げられた。**FARO de Oriente の設立に関わった美術家フランシスコ・ハビエル・サンティアゴ・レガラード（プーガ）氏との協働も終わったとされる。**\n\n**同じ年の6月に25周年が祝われている。** Once Noticias（2025年6月23日）によれば、6月28日に「25年、強く脈打つ（25 años latiendo fuerte）」を標語とする音楽と芸術の催しが開かれた。NTCD Noticias（2025年6月21日）も同じ催しを伝えている。**この2本は同じ25周年の発表に由来する。**\n\n**指摘への直接の反論は確認できなかった。** 参照した5本の中に、施設の傷みと支払いの遅れについて市の文化行政が答えた記述は無い。**あるのは、同じ時期に文化長官が事業の意義を述べた言葉だけである**（Once Noticias 2025年6月23日）。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"mx-0004","name":"アプリで呼ぶと女性が電動自転車で資源ごみを取りに来る仕組みをつくった","name_local":"Biciclando","name_variants":[],"country":"メキシコ","region":"ソノラ州","municipality":"エルモシヨ","population_current":936263,"population_scale":"25万超","purpose":"商いを起こす","theme":"エネルギー・資源循環","start_year":2022,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"エルモシヨ市役所。Milenio（2022年1月20日）の対談記事によれば、着想は市民の側から出ており、市の計画機関の元長であるルピタ・ペニュニュリ氏が、当時の市長セリダ・ロペス氏（Morena）とともに進め、次の市長アントニオ・アスティアサラン氏（PAN）に引き継いだ。2025年には団体「Caminantes del Desierto」と組んで地区に広げている（Uniradio Informa Sonora 2025年7月5日）","component_types":"hybrid","components":["アプリで戸口の回収を予約する","女性が電動自転車で集めて回る","資源の売り上げは本人の収入になる","循環経済センターを建てて拠点にした","自転車の道を4キロ敷き始めた","団体と組んで地区に広げた"],"sources":[{"url":"https://proyectopuente.com.mx/2022/01/18/gana-hermosillo-un-millon-de-dolares-con-premio-de-bloomberg-biciclando-apoyara-a-mujeres-y-reciclaje/","title":"Gana Hermosillo un millón de dólares con proyecto \"Biciclando\"; apoyará emprendimiento de mujeres y reciclaje","outlet":"Proyecto Puente","published":"2022-01-18","language":"es","from_operator":false},{"url":"https://expansion.mx/tecnologia/2022/01/18/biciclando-app-sustentabilidad-y-emplear-mujeres","title":"Biciclando, una app que apuesta por la sustentabilidad y emplear mujeres","outlet":"Expansión","published":"2022-01-18","language":"es","from_operator":false},{"url":"https://www.kjzz.org/2022-01-19/content-1748969-hermosillo-wins-1-million-toward-innovative-recycling-program","title":"Hermosillo wins $1 million toward innovative recycling program","outlet":"KJZZ","published":"2022-01-19","language":"en","from_operator":false},{"url":"https://www.milenio.com/opinion/hector-zamarron/el-manubrio/biciclando-por-hermosillo-un-ejemplo-de-economia-circular","title":"Biciclando por Hermosillo, un ejemplo de economía circular","outlet":"Milenio","published":"2022-01-20","language":"es","from_operator":false},{"url":"https://www.elimparcial.com/son/hermosillo/2024/11/20/biciclando-un-proyecto-de-reciclaje-que-busca-empoderar-a-las-mujeres-de-hermosillo/","title":"Biciclando: Un proyecto de reciclaje que busca empoderar a las mujeres de Hermosillo","outlet":"El Imparcial","published":"2024-11-20","language":"es","from_operator":false},{"url":"https://proyectopuente.com.mx/2025/06/05/biciclando-en-hermosillo-una-oportunidad-para-mujeres-de-generar-recursos-con-reciclaje-urbano-asi-puedes-conseguir-empleo/","title":"Biciclando en Hermosillo: una oportunidad para mujeres de generar recursos con reciclaje urbano: así puedes conseguir empleo","ou n-reciclaje-urbano-asi-puedes-conseguir-empleo/","published":"2025-06-05"}]},{"field":"2025年7月時点の担い手の人数","values":[{"value":"本文は、契約している女性が8人、翌週から訓練を始める人がさらに3人、電動自転車は6台だと書いている","source_url":"https://www.elimparcial.com/son/hermosillo/2025/07/04/mujeres-van-pedaleando-y-reciclando-en-hermosillo-conocias-este-programa-piloto-del-ayuntamiento/","published":"2025-07-04"},{"value":"同じ記事の写真の説明は、試行の担い手を6人としている","source_url":"https://www.elimparcial.com/son/hermosillo/2025/07/04/mujeres-van-pedaleando-y-reciclando-en-hermosillo-conocias-este-programa-piloto-del-ayuntamiento/","published":"2025-07-04"}]}],"latest_source_year":2025,"elapsed_years":3,"follow_up":"濃い","follow_up_note":"2022年1月にブルームバーグ財団の賞で100万ドルを得た。2024年11月にはモデロ地区で3人が動いていると報じられ、2025年7月には8人が契約していると報じられた。同年8月にアプリの一般公開が報じられている。","timeline":[{"year":2022,"event":"1月、ブルームバーグ財団の Desafío Global de Alcaldes の受賞15都市に選ばれ、100万ドルと3年の技術支援を受けると報じられた","source_url":"https://proyectopuente.com.mx/2022/01/18/gana-hermosillo-un-millon-de-dolares-con-premio-de-bloomberg-biciclando-apoyara-a-mujeres-y-reciclaje/"},{"year":2022,"event":"1月、アプリの発表に合わせて、市が循環経済センター（CEC）をつくると発表したと報じられた","source_url":"https://expansion.mx/tecnologia/2022/01/18/biciclando-app-sustentabilidad-y-emplear-mujeres"},{"year":2024,"event":"11月、モデロ地区で3人の担い手が動いていると報じられた。同じ記事は、翌年は24人にしたいと書いている","source_url":"https://www.elimparcial.com/son/hermosillo/2024/11/20/biciclando-un-proyecto-de-reciclaje-que-busca-empoderar-a-las-mujeres-de-hermosillo/"},{"year":2025,"event":"6月、担い手は5人で、CEC を拠点に戸口の回収と持ち込みの受け入れをしていると取りまとめ役が述べたと報じられた","source_url":"https://proyectopuente.com.mx/2025/06/05/biciclando-en-hermosillo-una-oportunidad-para-mujeres-de-generar-recursos-con-reciclaje-urbano-asi-puedes-conseguir-empleo/"},{"year":2025,"event":"7月、試行で8トンを超える資源を集め、自転車の道4キロの工事に入ったと報じられた。同じ記事は契約している女性を8人としている","source_url":"https://www.elimparcial.com/son/hermosillo/2025/07/04/mujeres-van-pedaleando-y-reciclando-en-hermosillo-conocias-este-programa-piloto-del-ayuntamiento/"},{"year":2025,"event":"7月、市役所が団体「Caminantes del Desierto」と組み、はじめて地区に持ち出したと報じられた","source_url":"https://www.uniradiosonora.com/gobierno/biciclando-llega-colonias-hermosillo-n829352"},{"year":2025,"event":"8月、住民と事業所がアプリで回収を予約できるようになったと報じられた","source_url":"https://proyectopuente.com.mx/2025/08/30/ciudadanos-de-hermosillo-ya-pueden-usar-app-biciclando-para-reciclar-desde-casa"}],"last_verified":"2026-08-19","sections":{"何をしたか":"メキシコ・ソノラ州の州都エルモシヨで、**アプリから呼ぶと女性が電動自転車で家まで資源ごみを取りに来る回収の網をつくった**取り組み。\n\nExpansión（2022年1月18日）によれば、使う側はアプリに出す資源の量を登録して回収を頼み、担い手（bicicladora）が回収の日時を組む。**出す側は種類ごとに分けて渡し、代わりに点を受け取る。** 点はアプリの協賛先で品物と交換できる。担い手は集めた資源を再生の拠点に運び、そこで金を受け取る。**このやりとりはすべてアプリに記録され、アプリの利用は無料である**（同）。\n\nMilenio（2022年1月20日）は、使う側は点と割引を受け取り、**資源が生む収入は女性の側が受け取ると書いている。**","誰が始めたか":"**着想は市民の側から出ている。** Expansión（2022年1月18日）は、このアプリを「市民の発意（iniciativa ciudadana）であり、エルモシヨ市がそれを引き受けた」と書いている。Milenio（2022年1月20日）は、直線型から循環型への移行の案を募る催しがニューヨークの大学とともに行われ、その後に市民から最初の案が出たと書いている。\n\n**2人の市長にまたがっている。** 同記事によれば、建築家でエルモシヨ市計画機関（Instituto Municipal de Planeación）の元長であるルピタ・ペニュニュリ氏が、当時の市長セリダ・ロペス氏（Morena）とともにこの事業を進め、次の市長アントニオ・アスティアサラン氏（PAN）のもとで引き継いだ。**Milenio は意見欄の記事であり、この経緯はペニュニュリ氏への対談にもとづく。**\n\n**解こうとした課題は2つだと、複数の出典が同じ形で書いている。** 女性の失業と、低い再生率である（Proyecto Puente 2022年1月18日）。Expansión（同日）は、アスティアサラン氏の説明として、**市で再生に回る廃棄物は2%に満たないこと**、**感染症の広がった時期に失われた職の60%が女性のものだったこと**を挙げている。\n\n**試行の段階では自転車の団体が入っている。** Milenio（2022年1月20日）によれば、試行には Mujer en Bici などの団体が加わり、担い手になる女性の訓練を助けた。**2025年には団体「Caminantes del Desierto」と市役所が組んでいる**（Uniradio Informa Sonora 2025年7月5日）。","いくらかかったか":"**外から入った金は100万ドルである。** Proyecto Puente（2022年1月18日）によれば、エルモシヨはブルームバーグ財団の Desafío Global de Alcaldes の受賞15都市に選ばれ、**100万ドルと、3年にわたる技術支援・訓練**を受ける。同記事によれば、受賞15都市は13か国・6大陸から選ばれ、合わせて3,000万人以上の住民を代表する。**この競争が始まったのは2021年1月で、99か国631都市の市長が案を出し、4か月かけて案を練った50都市から15都市が選ばれた**（同）。\n\n**使い道は、あとの記事に書かれている。** El Imparcial（2025年7月4日）は、この100万ドルが**循環経済センター（CEC）の建設、公共空間の改善、機材の購入、人の雇用**に充てられたと書いている。\n\n**市の側がいくら出したかは、参照した10本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**1日に集まる額は1本にだけ出ている。** El Imparcial（2024年11月20日）は、3人の担い手が動いていたモデロ地区で、**1日に集まる額は平均200〜300ペソ**だと書いている。**出典はこれを地区の額として書いており、担い手の取り分とも1人あたりとも書いていない。**","真似するなら最低何が必要か":"第一に、**資源の売り上げの行き先を決めておく**こと。Milenio（2022年1月20日）は、使う側は点と割引を受け取り、資源が生む収入は女性の側が受け取ると書いている。**ただし、あとの出典は雇用の形も書いている。** Proyecto Puente（2025年6月5日）は、担い手の取りまとめ役リリア・ノリエガ氏が「事業は女性に職を与える」と伝えたと書いており、El Imparcial（2025年7月4日）はデータ欄で8人が登録していると書いている。\n\n第二に、**拠点になる建物を1つ用意する**こと。Proyecto Puente（2025年6月5日）は、担い手の取りまとめ役ノリエガ氏が、担い手は戸口を回って集めるだけでなく **CEC で直接持ち込みを受ける**と伝えたと書いている。 El Imparcial（2025年7月4日）によれば、賞金の使い道の筆頭がこの CEC の建設である。**アプリだけでは資源の置き場が無い。**\n\n第三に、**自転車で走れる道を同時に敷く**こと。El Imparcial（2025年7月4日）は、試行と並行して**自転車の道4キロの工事に入った**と書いている。\n\n第四に、**選考の条件に「他所でも真似できること」が入っていたことを見ておく**こと。Milenio（2022年1月20日）は、選ばれる条件の一つが、その案を他所で繰り返せることだったと書いている。\n\n第五に、**市長が替わっても続く形にしておく**こと。同記事によれば、この事業は別の政権下で立ち上がりながら、党の異なる次の市長のもとで続いた。**引き継いだのは、両方の時期にいた市の計画機関の側である。**\n\n第六に、**担い手の集め方を用意する**こと。El Imparcial（2024年11月20日）によれば、応募の条件は**収入を増やす必要があること、自転車に乗れる体調であること、環境の改善を好むこと**の3つで、市はこれを女性向けの催しと説明会で伝えると述べていた。Proyecto Puente（2025年6月5日）は、経験は要らず、朝・午後・混合の時間帯が選べると書いている。","今どうなっているか":"**2026年8月時点で確認できたのは、2025年9月1日の記事までである。**\n\n**規模は小さいところから広がっている。** El Imparcial（2024年11月20日）によれば、2024年の時点で動いていたのはモデロ地区の3人で、その年に集めたのは7トン近くだった。同記事は**記事自身の言葉として、翌年は24人にしたいこと**、加えたい地区がブガンビリアス・ペリオディスタ・サンベニートなどであることを書いている。**市計画機関（Implan）の長ホセ・カリージョ・アトンド氏の発言として書かれているのは、11月29日の催しと12月2日の説明会の2件だけである。****この記事の時点では、いずれも予定として書かれている。**\n\n**2025年に入って人数と量が動いた。** Proyecto Puente（2025年6月5日）は、担い手の取りまとめ役リリア・ノリエガ氏が、正式には2か月の稼働で**担い手は5人**だと伝えたと書いている。El Imparcial（2025年7月4日）は、**試行で8トンを超える資源（アルミ・段ボール・紙・PET・テトラパック）を集めた**とし、本文では**契約している女性が8人、翌週から訓練を始める人がさらに3人、電動自転車は6台**だと書いている。**同じ記事の写真の説明は担い手を6人としており、本文と食い違う。** 2024年の記事が同じ年に7トン近くと書いていることと、2025年6月の「2か月の稼働」も食い違うので、**どちらも `discrepancies` に並置した。**\n\n**地区への持ち出しとアプリの公開は2025年である。** Uniradio Informa Sonora（2025年7月5日）は、市役所が団体「Caminantes del Desierto」と組み、**はじめて地区に持ち出した**と伝えている。同記事は、ノリエガ氏をこの団体の一員として紹介している。Proyecto Puente（2025年8月30日）は、住民と事業所が Google Play のアプリから回収を予約できるようになったと伝え、Noro（2025年9月1日）は使い方を段階ごとに説明している。**受け入れる資源は、きれいな紙と段ボール、PET、アルミ缶、すすいでつぶして蓋をしたテトラパックである**（Proyecto Puente 2025年8月30日）。\n\n**同じ発表に由来する記事がある。** 2022年1月18日から20日の4本は受賞の発表を機に出たものだが、Expansión と Milenio はそれぞれ独自の対談を載せている。**2025年8月30日と9月1日の2本はアプリ公開の発表に由来する。** Noro は写真ごとに出所を分けて記しており、エルモシヨ市役所・Freepik・El Imparcial の名がある。**同記事は末尾に、El Imparcial・Dossie Político・Proyecto Puente の情報にもとづくと書いている**（媒体名は出典の表記のまま写した）。\n\n**否定的な報道は、参照した10本の中には無い。** 2026年7月末に市が CEC の利用を呼びかけた発表は複数の媒体に載っているが、**掲載日が構造化された箇所に無いか、robots.txt を取得できないため、出典にできなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"100万ドル","currency":"USD","value":1000000,"jpy":159122085},{"raw":"300ペソ","currency":"MXN","value":300,"jpy":2820}],"sample":false},{"id":"nl-0002","name":"取り壊しを決められた集落が計画を撤回させた","name_local":"Ganzedijk blijft","country":"オランダ","region":"フローニンゲン州","municipality":"Oldambt","population_current":39746,"population_scale":"5万人未満","purpose":"住民が決める","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2008,"end_year":null,"status_current":"判定不能","actor_type":"住民組織","lead_actor":"Actiecomité Ganzedijk blijft!","component_types":"soft","components":["住民が対案を自分たちで作った","州議会に出向いて直接発言した","全戸取り壊しを一部に押し戻した"],"sources":[{"url":"https://www.rtvnoord.nl/nieuws/71832/ganzedijk-moet-van-aardbodem-verdwijnen","title":"Ganzedijk moet van aardbodem verdwijnen","outlet":"RTV Noord","published":"2008-02-26","language":"nl"},{"url":"https://www.bnnvara.nl/zembla/artikelen/ganzedijk-blijft-en-zal-blijven","title":"Ganzedijk blijft en zal blijven","outlet":"Zembla (BNNVARA)","published":"2011-01-28","language":"nl"},{"url":"https://www.socialevraagstukken.nl/ganzedijk-met-fluwelen-handschoenen-gered/","title":"Ganzedijk met fluwelen handschoenen gered","outlet":"Sociale Vraagstukken","published":"2011-08-25","language":"nl"},{"url":"https://www.rtvnoord.nl/nieuws/898643/deze-dag-ganzedijk-moest-plat","title":"Deze dag: Ganzedijk moest plat","outlet":"RTV Noord","published":"2022-02-26","language":"nl"},{"url":"https://www.rtvnoord.nl/economie/RX-357/verdwijning-moerdijk-echoot-na-in-ganzedijk-en-oudeschip-de-emoties-zijn-hetzelfde","title":"Verdwijning Moerdijk echoot na in Ganzedijk en Oudeschip: 'De emoties zijn hetzelfde'","outlet":"RTV Noord","published":"2025-11-13","language":"nl"}],"context_sources":[{"url":"https://allecijfers.nl/gemeente/oldambt/","title":"gemeente Oldambt の人口"}],"discrepancies":[{"field":"集落の戸数","values":[{"value":"57戸（うち14戸が取り壊された）","source_url":"https://www.socialevraagstukken.nl/ganzedijk-met-fluwelen-handschoenen-gered/","published":"2011-08-25"},{"value":"2008年当時およそ40軒","source_url":"https://www.rtvnoord.nl/economie/RX-357/verdwijning-moerdijk-echoot-na-in-ganzedijk-en-oudeschip-de-emoties-zijn-hetzelfde","published":"2025-11-13"}]}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":17,"follow_up":"濃い","follow_up_note":"2008年2月に自治体が全戸取り壊しの結論を示し、住民が対案を出して取り壊しは行われなかった。2011年8月の検証記事は、残った再建に200万ユーロの費用がかかったと書いている。2025年11月、近隣モエルダイクの集落消滅を伝える報道は、2008年のハンゼダイクを引き合いに出している。","timeline":[{"year":2008,"event":"2月26日、自治体レイデルラントが集落を全戸取り壊すという結論を示した","source_url":"https://www.rtvnoord.nl/nieuws/71832/ganzedijk-moet-van-aardbodem-verdwijnen"},{"year":2009,"event":"住民の対案と報道・抗議により取り壊しには至らなかった。この年の記録番組が経緯を追っている","source_url":"https://www.bnnvara.nl/zembla/artikelen/ganzedijk-blijft-en-zal-blijven"},{"year":2011,"event":"8月25日の検証記事は、集落が残った一方で200万ユーロの費用がかかったと書いている","source_url":"https://www.socialevraagstukken.nl/ganzedijk-met-fluwelen-handschoenen-gered/"},{"year":2022,"event":"2月26日、当時から14年の振り返り記事が出た","source_url":"https://www.rtvnoord.nl/nieuws/898643/deze-dag-ganzedijk-moest-plat"},{"year":2025,"event":"11月13日、近隣モエルダイクの集落が工業用地の拡大で消える件を伝える報道が、2008年のハンゼダイクを引き合いに出した","source_url":"https://www.rtvnoord.nl/economie/RX-357/verdwijning-moerdijk-echoot-na-in-ganzedijk-en-oudeschip-de-emoties-zijn-hetzelfde"}],"last_verified":"2026-08-16","sections":{"何をしたか":"2008年2月、フローニンゲン州の自治体レイデルラント（Reiderland、現オルダムト）は、フィンステルウォルデ近くの集落ハンゼダイク（Ganzedijk）を全戸取り壊すという結論を住民に示した。自治体・州・住宅法人アカントゥスの委託でフローニンゲンの設計事務所 KAW がまとめた報告書は、空き家が多く、改修しても状況は変わらないとして、この集落に将来はないとした。住民は「Ganzedijk blijft!（ハンゼダイクは残る）」という行動委員会をつくって反対し、州に出向いて発言し、自分たちで対案を示した。取り壊しは全戸には及ばず、大半の住宅は残った。","誰が始めたか":"**取り壊しを決めたのは行政の側で、始めたのは住民である。**\n\n2008年2月、自治体レイデルラント、フローニンゲン州、住宅法人アカントゥスの委託で設計事務所 KAW がまとめた報告書は、集落に将来はないと結論づけた。RTV Noord によれば、KAW が残してよいとしたのは築100年ほどの2軒だけで、残りの借家人と所有者は買い取られ、家は取り壊される。土地は自然か農業に返される。**自治体は前年には資金を投じて集落を全面的に改修する案を出していたが、この報告を受けて方針を変えた。**\n\n住民は「Ganzedijk blijft!（ハンゼダイクは残る）」という行動委員会を作った。Zembla によれば、住民は組織を作り、**抗議の歌を書き**、報道に働きかけた。ハンゼダイクは全国ニュースになり、対立は硬直した。\n\n**この対立には代償があった。** Zembla は、担当の助役が政治的な首を失い、ハンゼダイク側の中心的な活動家の1人が心臓発作で倒れて退いたと書いている。Sociale Vraagstukken も、担当助役が去り、住宅法人と州でも執行部の交代があったと記録している。\n\nなお住民の側は、空き家が増えたのは**アカントゥスが住宅を板で塞ぎ、手入れをしなかったため**だと主張していた（RTV Noord 2008）。","いくらかかったか":"**2つの金額が出典にある。**\n\n- **取り壊し案の費用：約400万ユーロ**（RTV Noord 2008）。借家人と所有者を買い取り、家を平らにするための額である\n- **実際に取られた道の費用：200万ユーロ**（Sociale Vraagstukken 2011）。同記事はこれを「値札（prijskaartje）」と呼び、成功例として紹介しつつ**額を明示している**\n\n**つまり全戸取り壊しより安く済んでいる。** ただし `funding_scale` は `unknown_fields` のままとした。200万ユーロが何に使われたかの内訳が出典にないためである。\n\nRTV Noord の2025年の記事は、2008年当時の事情をこう整理している。集落の家の多くは古びており改修が必要だったが、**住宅法人にその金がなかった。** 全部壊すほうが安い、というのが KAW の調査の結論だった。","真似するなら最低何が必要か":"Sociale Vraagstukken の2011年の記事が、**信頼をどう回復したか**を具体的に書いている。ここから条件を取り出せる。\n\n1. **決めた側の人が代わること。** 担当助役が去り、住宅法人と州でも執行部が代わった。**同じ人が同じ席にいたままでは戻れなかった**というのが同記事の見立てである\n2. **相手を「ビロードの手袋で」扱うこと。** 関係者の言葉として、行動委員会をそう扱ったと書かれている\n3. **住民が自分の案を作る金を出すこと。** 州が資金を出し、独立した助言者の支援を得て、住民は自分たちの将来像「Energiek Ganzediek」をまとめた。自主管理、新しい集会所、共同のエネルギー供給を含む野心的な案だった\n4. **その案が通らなくてもよいと考えること。** 同記事は、**この案は結局ほとんど支持を得られなかったが、関係を正常化するうえで重要な働きをした**と書いている。住民の側も意図的に多くの提案を盛り込んでおり、「たくさん出せば何かは残る」という考えだったと明かされている\n5. **全部を守ろうとしないこと。** 下記のとおり、実際には57戸のうち14戸が取り壊されている\n\n**確認できない**のは、200万ユーロの内訳と、買い取りに応じた世帯の条件である。","今どうなっているか":"**`status_current` は `判定不能` のままとした。** 最新の出典（2025年11月）はハンゼダイクを回想として扱っており、現在の集落の状態を報じたものではないためである。\n\n2011年8月の時点の姿は、Sociale Vraagstukken が具体的に書いている。**57戸のうち14戸が取り壊された**（賃貸7戸・持ち家7戸）。住宅の数は4分の1近く減り、集落は地域の縮小の課題に応分の貢献をした形になった。残る15戸の賃貸住宅は住宅法人が改修した。かつての賃貸住宅の1戸は住民が「支えの場（steunstee）」として使っている。取り壊した跡地には遊び場ができ、まもなく蝶の庭が作られる予定だった。**問題を抱えた数世帯が集落を離れたことで、暮らしにくさの問題も——少なくとも当面は——解消したとされる。**\n\nつまり**「取り壊さなかった」のではなく「全部は取り壊さなかった」。** 報道の見出しが伝えた勝敗より、実際の決着は複雑である。\n\n**戸数については出典が食い違う。** 2011年の記事は57戸とし、2025年の記事は2008年当時「およそ40軒」としている。数え方の範囲が違う可能性があるが、出典からは判別できないため `discrepancies` に並置した。\n\n2025年11月、RTV Noord は北ブラバント州モエルダイクが産業用地のために消えることになった件を受けて、ハンゼダイクとアウデスヒップの住民を訪ねている。当時運動の中心にいた住民は、モエルダイクの報道で当時の光景がよみがえったと語り、**「感情は同じだ」**と述べている。**17年たっても、この集落では自分の家を行政に消されかけた経験が現在形で語られている。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"400万ユーロ","currency":"EUR","value":4000000,"jpy":742400000},{"raw":"200万ユーロ","currency":"EUR","value":2000000,"jpy":371200000}],"sample":false},{"id":"nl-0003","name":"農地に湖を掘って住む人を呼び戻そうとした","name_local":"Blauwestad","country":"オランダ","region":"フローニンゲン州","municipality":"Oldambt","population_current":39746,"population_scale":"5万人未満","purpose":"住む人を増やす・戻す","theme":"自然・緑地・水辺","start_year":1998,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"Provincie Groningen","funding_scale":"初期投資 1億1800万ユーロ。州は3700万ユーロを償却し、2025年時点で2200万ユーロを回収","component_types":"hard","discrepancies":[{"field":"start_year","values":[{"value":1998,"source_url":"https://www.rtvnoord.nl/nieuws/920378/deze-dag-de-eerste-grond-voor-blauwestad-aangekocht","published":"2022-05-07"},{"value":2005,"source_url":"https://www.rtvnoord.nl/politiek/1300367/20-jaar-oldambtmeer-grondlegger-en-burgemeester-zijn-trots-op-blauwestad","published":"2025-05-12"}]}],"single_outlet":true,"sources":[{"url":"https://www.rtvnoord.nl/nieuws/857983/bedenkers-blauwestad-wij-hebben-nooit-aan-het-plan-getwijfeld","title":"Bedenkers Blauwestad: 'Wij hebben nooit aan het plan getwijfeld'","outlet":"RTV Noord","published":"2021-10-06","language":"nl"},{"url":"https://www.rtvnoord.nl/nieuws/920378/deze-dag-de-eerste-grond-voor-blauwestad-aangekocht","title":"Deze dag: de eerste grond voor Blauwestad aangekocht","outlet":"RTV Noord","published":"2022-05-07","language":"nl"},{"url":"https://www.rtvnoord.nl/nieuws/1091775/is-blauwestad-een-succes-of-mislukking-er-werd-een-heel-dorp-gebouwd","title":"Is Blauwestad een succes of mislukking? 'Er werd een heel dorp gebouwd!'","outlet":"RTV Noord","published":"2023-11-16","language":"nl"},{"url":"https://www.rtvnoord.nl/politiek/1300367/20-jaar-oldambtmeer-grondlegger-en-burgemeester-zijn-trots-op-blauwestad","title":"20 jaar Oldambtmeer: grondlegger en 'burgemeester' zijn trots op Blauwestad","outlet":"RTV Noord","published":"2025-05-12","language":"nl"},{"url":"https://www.rtvnoord.nl/politiek/1340089/hoe-blauwestad-na-twintig-jaar-toch-nog-een-succes-werd","title":"Hoe Blauwestad na twintig jaar toch nog een succes werd","outlet":"RTV Noord","published":"2025-09-06","language":"nl"}],"context_sources":[{"url":"https://allecijfers.nl/gemeente/oldambt/","title":"gemeente Oldambt の人口"}],"unknown_fields":[],"latest_source_year":2025,"elapsed_years":27,"follow_up":"濃い","follow_up_note":"1998年5月に最初の土地を取得し、2005年5月に湖への注水が始まって2006年12月に満水になった。2009年末の販売は180戸にとどまったが、2016年の港地区の決定から販売が伸び、2021年には154区画が売れた。2025年9月の報道は、1億1,800万ユーロの初期投資のうち2,200万ユーロを回収したと書いている。","timeline":[{"year":1998,"event":"5月7日、最初の土地取得が行われた","source_url":"https://www.rtvnoord.nl/nieuws/920378/deze-dag-de-eerste-grond-voor-blauwestad-aangekocht"},{"year":2005,"event":"5月12日、ベアトリクス女王が注水を始めた。800ヘクタールが満水になるのは2006年12月で、同月に最初の住宅が引き渡された","source_url":"https://www.rtvnoord.nl/politiek/1300367/20-jaar-oldambtmeer-grondlegger-en-burgemeester-zijn-trots-op-blauwestad"},{"year":2009,"event":"年末までに売れた住宅は180戸にとどまり、計画戸数1,480は早々に下方修正された。より安い住宅の区画も設けられた","source_url":"https://www.rtvnoord.nl/politiek/1300367/20-jaar-oldambtmeer-grondlegger-en-burgemeester-zijn-trots-op-blauwestad"},{"year":2021,"event":"記録となる154区画が売れた。発案者2人は、計画を疑ったことは一度もないと述べている","source_url":"https://www.rtvnoord.nl/nieuws/857983/bedenkers-blauwestad-wij-hebben-nooit-aan-het-plan-getwijfeld"},{"year":2023,"event":"11月16日、書籍を書いた Karin Sitalsing が、机上でつくって失敗した村とは呼べないと述べた","source_url":"https://www.rtvnoord.nl/nieuws/1091775/is-blauwestad-een-succes-of-mislukking-er-werd-een-heel-dorp-gebouwd"},{"year":2025,"event":"9月6日、住民が納めた不動産税の累計が530万ユーロに達し、初期投資1億1,800万ユーロのうち2,200万ユーロを回収したと報じられた","source_url":"https://www.rtvnoord.nl/politiek/1340089/hoe-blauwestad-na-twintig-jaar-toch-nog-een-succes-werd"}],"last_verified":"2026-08-16","sections":{"何をしたか":"人口が減り続けていた東フローニンゲンで、州が農地を買い上げて人工湖（Oldambtmeer）を掘り、その周囲に住宅地を造成して人を呼び込もうとした事業。最初の土地取得は1998年5月7日。分譲区画は全体で1,200。着工から十数年は売れず、2015年には年間の販売がゼロになった。**RTV Noord は2025年9月6日の記事で、この時期までのブラウエスタッドを失敗した住宅事業と書いている。** 一方、**この評価には当事者と書き手の双方から異論がある。** 2021年10月6日、発案者の Wim Haasken と Jan Timmer は、計画を疑ったことは一度もないと述べた。2023年11月16日、ブラウエスタッドについての本を書いた Karin Sitalsing は、これを机上でつくって失敗した村とは呼べない、それでは簡単すぎると述べている。2016年に州が Havenkwartier（港地区）の計画を承認してから流れが変わり、2021年には154区画が売れた。2025年時点で約800区画が建っている。初期投資は1億1800万ユーロで、州は3700万ユーロを償却している。","誰が始めたか":"**発案は役所の内部から、しかも個人の思いつきとして出ている。**\n\nRTV Noord によれば、農業省に勤めていた Wim Haasken は、東フローニンゲンの再編が検討されていた当時、耕種農業が苦境にあるのを見て、**広い区域を農業から外して恒久的に別の用途に変える**案を思いついた。省は当初これに乗らなかった。そこで Haasken は友人の建築家 Jan Timmer に話し、Timmer はすぐ乗った。2人は州庁に案を持ち込む。Timmer は当時をこう振り返る——これほど広い土地を水没させるというのは馬鹿げた話だが、部屋から追い出されず、相手は聞き続けた。それなら上出来だ、と。\n\n**当初の構想は実現していない。** Timmer によれば、100の小島を作り、1島に1戸ずつ高価格帯の住宅を置くという案だった。実際にできたのは、湖のまわりに1,000戸を超える計画の住宅地である。\n\n2015年以降の立て直しを担ったのは州の事業局で、局長の René Perton は州の Johan Koopmans から任された。着任時の印象を同氏は、草と雑草の丈が高すぎて、まず刈払機を注文しようと思ったと語っている。","いくらかかったか":"**初期投資は1億1,800万ユーロ。州は3,700万ユーロを償却した。**\n\nその後の回収も報じられている。RTV Noord の2025年9月の記事によれば、**償却した3,700万ユーロのうち2,200万ユーロはすでに取り戻されている。**\n\n用地の取得にも金と時間がかかった。1998年5月7日にウィンスホーテンの農家が売った2区画は合わせて25ヘクタール。価格は「交渉の戦術上の理由」で公表されていないが、安い買い物ではなかったと同紙は書く。**この1件の交渉に半年かかり、そのあとに同種の交渉と買い取りが50件以上控えていた。**","真似するなら最低何が必要か":"1. **数十年を見込むこと。** 発案から20年以上、最初の用地取得から数えても四半世紀の事業である。2015年に販売がゼロになった時点でやめていれば、失敗として終わっていた\n2. **用地交渉の量を数えておくこと。** 1件半年 × 50件以上。**湖を掘る前の作業がこれである**\n3. **売る相手を途中で変える覚悟。** 2015年以降の転換は、都市部の富裕層向けの高級住宅という当初の想定を下げ、**最も安いもので20万ユーロを切る**住宅を港地区に置く計画に切り替えたことによる\n4. **その転換が政治問題になることを織り込むこと。** 同紙は、この方針転換が東フローニンゲンの政治的な危機を招き、オルダムトとペケラの両自治体が州に激怒したと書いている\n5. **担当者を替えて権限を渡すこと。** 2015年に事業局の長が交代し、現場の裁量で立て直しが進んだ\n\n**確認できない**のは、用地取得の総額、自治体と州の対立がどう決着したか、そして最終的に何戸が建つのかである。","今どうなっているか":"**評価が定まっていないこと自体が、この事例の現在地である。**\n\n数字で見ると、2023年11月の時点で建設済みと計画中を合わせて685戸、居住者は1,100人だった。**長年にわたり居住者は400人を超えなかった**が、その大半は近年になって移り住んだ人である。2025年時点では約800区画が建っている。\n\n2025年5月、オルダムト湖の開通から20年の記事で、発案者の Haasken は、湖ができたことで住民に「この地域でも何かできる」という感覚が生まれたと語っている。以前は「何もない、何もできない、何にもならない」という考えが支配的だったという。同記事は、湖がいまや観光の呼び物になり、夏には浜が人で埋まると書いている。\n\n一方 RTV Noord は2025年9月の記事で、この事業を**20年を経てようやく成功になった**という形で扱っている。裏を返せば、それまでは失敗と見なされていたということである。\n\n**この二分法自体に異論もある。** 2023年、ブラウエスタッドについての本を書いた Karin Sitalsing は、成功か失敗かは一概に言えないとしたうえで、**机上で作って失敗した村と呼ぶのは簡単すぎる**と述べた。同氏の言い分はこうである——ブラウエスタッドは目的ではなく、東フローニンゲンを救うための**手段**だった。そして「村が丸ごと作られた。そんなことはめったに起きない。村というのは自然にできるものだ」とも語っている。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"1億1,800万ユーロ","currency":"EUR","value":118000000,"jpy":21900800000},{"raw":"3,700万ユーロ","currency":"EUR","value":37000000,"jpy":6867200000},{"raw":"2,200万ユーロ","currency":"EUR","value":22000000,"jpy":4083200000}],"sample":false},{"id":"nl-0004","name":"退屈な広場を掘って雨水の受け皿と運動場を兼ねさせた","name_local":"Benthemplein","country":"オランダ","region":"南ホラント州","municipality":"ロッテルダム（ロッテルダム北部）","population_current":673804,"population_scale":"25万超","purpose":"空間をひらく","theme":"自然・緑地・水辺","start_year":2013,"end_year":null,"status_current":"判定不能","actor_type":"混合","lead_actor":"De Urbanisten とロッテルダム市","component_types":"hard","components":["退屈なタイル張りの広場を作り替えた","雨水を集める3つの水盤を掘った","光る樋で水を広場に流した","浸水する範囲を青く塗り分けた"],"sources":[{"url":"https://nieuws.top010.nl/waterplein-benthemplein.htm","title":"Waterplein Benthemplein","outlet":"Nieuwbouw Architectuur Rotterdam（top010）","published":"2012-04-07","language":"nl","from_operator":false},{"url":"https://www.architectuur.nl/kennis/onderzoek/leren-van-het-waterplein/","title":"Leren van het Waterplein","outlet":"Architectuur.nl","published":"2016-11-03","language":"nl","from_operator":false}],"context_sources":[{"url":"https://allecijfers.nl/gemeente/rotterdam/","title":"gemeente Rotterdam の人口（673,804人・2026年）"}],"unknown_fields":["funding_scale","status_current"],"latest_source_year":2016,"elapsed_years":3,"follow_up":"薄い","follow_up_note":"2013年12月の完成後、設計したDe Urbanistenは2016年にティエルのVogelbuurtで2つ目の水広場を開いた。2016年11月の記事は、3年近く経って目標が達成されたかを問うている。","timeline":[{"year":2013,"event":"12月にロッテルダム北部のベンテム広場で完成した","source_url":"https://nieuws.top010.nl/waterplein-benthemplein.htm"},{"year":2016,"event":"De Urbanisten がティエルの Vogelbuurt で2つ目の水広場を開いた","source_url":"https://www.architectuur.nl/kennis/onderzoek/leren-van-het-waterplein/"}],"last_verified":"2026-08-17","sections":{"何をしたか":"ロッテルダム北部にあったタイル張りの広場を掘り、大雨のときに雨水を受けて下水の負荷を下げる「水広場（waterplein）」に作り替えた。2013年12月に完成。設計は De Urbanisten で、ロッテルダム市との共同による工夫として紹介されている。広場には雨水を集める3つの水盤があり、浅い2つは降ればすぐ周囲から水を受け、深い1つは降り続いたときだけ水を受ける。水は大きな光る樋を通って広場を流れ、浸水しうる範囲は青系の色で塗り分けられている。広場は Zadkine College・Grafisch Lyceum・Hofpleintheater などが入る Technikon の3棟に囲まれた場所にある。**De Urbanisten はこの案を最終形にするまでに7年近くかけた**と top010 は書いている。","誰が始めたか":"設計事務所 De Urbanisten とロッテルダム市の共同である。top010 は、これを豪雨時に下水の負荷を下げつつ同時に街を魅力的にするための、両者による工夫（innovatie）だと書いている。\n\n**特徴は、事務所が案を練るのに7年近くかけていることである。** top010 によれば、その過程で**広場を囲むすべての関係者が直接関わる**形に持っていった。広場は Technikon の3棟に囲まれており、そこには職業教育の学校が入っている。**日常の使い手が誰かがはっきりしている場所**だった。","いくらかかったか":"**総額は確認できなかった**（`funding_scale` は `unknown_fields`）。ただし**財源の内訳は分かっており、この事例の要点はそこにある。**\n\nArchitectuur.nl の2016年の記事で、De Urbanisten の都市設計者 Dirk van Peijpe は、この広場が**1年のうち10%しか雨水を受ける用途で使われていない**にもかかわらず、**費用の60%がロッテルダム市と水管理組合（Hoogheemraadschap van Schieland en de Krimpenerwaard）の「下水の金」で賄われた**と述べている。\n\n同氏はその理由も説明している。**市にとっても水管理組合にとっても、この広場は既存の下水を増強するより安上がりで良い代替になる**からである。実際、周囲の建物の雨樋は下水から切り離され、水は広場を経て地中に浸みるか、掘割へ流される。\n\n**つまり「広場の予算」ではなく「下水の予算」で広場が作られている。** これがこの方式を成り立たせている。","真似するなら最低何が必要か":"2016年の記事から取り出せる条件は、設計よりも**運用**に偏っている。\n\n1. **下水の予算で払える理屈。** 上記のとおり、費用の6割は治水の側から出た。**広場としての魅力だけでは、この規模の工事は通らない**\n2. **ポンプを操作する人がいること。** van Peijpe は、深い水盤の弁の不具合は交換で直ったとしたうえで、**中央からポンプの操作をする人がいなければ雨水は溜まったままになる**と述べている。「公共空間の良い管理はいつでも重要だが、水広場では決定的である」というのが同氏の言い方である\n3. **掃除の頻度を場所ごとに変えること。** 水広場は普通の広場より汚れに弱い。樋がごみを深い部分へ運ぶためである。同氏は、学校が多い場所はもっと頻繁に、しかも月曜の朝ではなく**金曜に**掃除すべきだと述べ、豪雨や深い水盤の使用のあとに清掃する取り決めが市の内部にあるのに実行されていないと指摘している\n4. **設計者が施工まで見ること。** ロッテルダムでは De Urbanisten が設計だけでなく施工の美的監修も担ったが、ティールの2つ目ではそうではなかったと同記事は書いている\n5. **日常の使い手を最初から巻き込むこと。** 7年かけた過程がこれにあたる","今どうなっているか":"**`status_current` は `判定不能` のままとした。** 確認できた最も新しい出典が2016年11月であり、2026年8月の時点でこの広場がどう使われているかを示す出典に到達できていないためである。\n\n2016年時点の姿は、Architectuur.nl が具体的に書いている。晴れた朝の広場では学生が歩き、座り、たむろしている。スケートボードの利用者は午後になってから来る。学生たちは以前よりずっと良くなったと満足しているが、**批判もある。** 最も大きな水盤が数日にわたって水を張ったままになることがあり、排水がうまくいっていないように見える。**この水盤はサッカー、バスケットボール、ブートキャンプ、音楽や演劇の上演、屋外の礼拝に使われている場所**であるだけに、そこが使えなくなるのは惜しい、というのが同記事の書き方である。\n\nDe Urbanisten 側は、原因である弁の不具合は交換済みだと説明しつつ、**残る問題は機械ではなく運用だ**としている。同じ記事は、De Urbanisten が世界的な注目を集めたこの広場をもとにティールで2つ目の水広場を手がけ、そこで施工体制が異なったことも記録している。\n\n**この事例の「その後」は、装置としては動き、運用としては安定しなかった、という形で残っている。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"nl-0005","name":"森の中の集合住宅を、景観の側から組み直して建て替えた","name_local":"Kerckebosch","country":"オランダ","region":"ユトレヒト州","municipality":"ザイスト","population_current":66648,"population_scale":"5万〜25万","purpose":"住む人を増やす・戻す","theme":"自然・緑地・水辺","start_year":null,"end_year":2025,"status_current":"終了","actor_type":"混合","lead_actor":"Wijkontwikkelingsmaatschappij Kerckebosch（WOM）","component_types":"hard","components":["森の中の集合住宅を建て替える","景観の側から街区の配置を決める","元の住人を同じ地区に住み直させる","分譲と賃貸と介護住宅を混ぜる","住民が緑地の管理に加わる"],"single_outlet":true,"sources":[{"url":"https://stadszaken.nl/artikel/713/kerckebosch-is-beste-plek","title":"Kerckebosch is beste plek","outlet":"Stadszaken","published":"2016-10-07","language":"nl","from_operator":false},{"url":"https://stadszaken.nl/artikel/2219/kerckebosch-oogst-succes-met-middenhuur","title":"Kerckeb
