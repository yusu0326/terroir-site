* { box-sizing: border-box; }
body {

}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

/* ── 上の帯 ─────────────────────────────────────────────────────────── */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
  padding: 14px 22px;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
}
.bar h1 {
  margin: 0; font-family: var(--serif); font-size: 20px; font-weight: 600;

}
.bar .lede { color: var(--ink-3); font-size: 12.5px; letter-spacing: .04em; }
.bar .spacer { flex: 1 1 auto; }

.desk { display: grid; grid-template-columns: 316px minmax(0,1fr); gap: 0; align-items: start; }

.rail {

.rail-group { padding: 12px 16px 2px; }

  color: var(--ink-3); text-transform: none;

}
.rail-group h2 span { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.item {

}
.item:hover { background: var(--surface-2); }
.item[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.item .dot { width: 9px; height: 9px; margin-top: 7px; border-radius: 50%; border: 1.5px solid var(--rule); }
.item .dot.ok { background: var(--ok); border-color: var(--ok); }

.item .dot.hold { background: var(--hold); border-color: var(--hold); }

.item .nm { font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.item[aria-current="true"] .nm { color: var(--ink); }

/* ── 本体 ───────────────────────────────────────────────────────────── */
.sheet { padding: 26px 30px 90px; max-width: 1120px; }
@media (max-width: 640px) { .sheet { padding: 20px 16px 70px; } }

.head { border-bottom: 1px solid var(--rule); padding-bottom: 18px; margin-bottom: 22px; }
.head .kicker {
  font-family: var(--mono); font-size: 11.5px; color: var(--ink-3);
  display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px;
}
.head h2 {

}

section.block { margin-bottom: 26px; }

}
.prose h4 {

.prose strong { font-weight: 600; background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }

.meta { display: grid; grid-template-columns: 7.5em minmax(0,1fr); gap: 5px 14px; font-size: 13.5px; }

.pick label { cursor: pointer; }

.pick span { display: inline-block; padding: 5px 14px; border-radius: 3px; border: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); }
.pick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

,"language":"pt"},{"url":"https://www.diariodepernambuco.com.br/noticia/economia/2024/04/o-ecossistema-bilionario-do-porto-digital.html","title":"O ecossistema bilionário do Porto Digital","outlet":"Diario de Pernambuco","published":"2024-04","language":"pt"},{"url":"https://agenciabrasil.ebc.com.br/economia/noticia/2025-10/porto-digital-reune-475-empresas-de-tecnologia-em-recife","title":"Porto Digital reúne 475 empresas de tecnologia no centro de Recife","outlet":"Agência Brasil","published":"2025-10","language":"pt"},{"url":"https://www.diariodepernambuco.com.br/economia/2026/01/11703517-porto-digital-recife-se-consolida-como-polo-tecnologico-no-pais.html","title":"Porto Digital: Recife se consolida como polo tecnológico no país","outlet":"Diario de Pernambuco","published":"2026-01","language":"pt"}],"context_sources":[{"url":"https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6%5B2611606%5D","title":"IBGE 2022年センサス（レシフェ市 1,488,920人）"}],"unknown_fields":[],"latest_source_year":2026,"elapsed_years":26,"follow_up":"濃い","follow_up_note":"2000年に始まり、20年目の2020年12月時点で344社・雇用1万1,600人だった。2023年の売上は54億レアル、2024年は62億レアルで、2018年から2024年で226%増えたと報じられている。2025年10月時点で475社が入り、2万1千人以上が働いている。","timeline":[{"year":2000,"event":"旧港地区の建物を修復してIT企業を入れる技術団地として始まった。2000年代に州政府から3,000万レアルの支援を受けている","source_url":"https://www.diariodepernambuco.com.br/economia/2026/01/11703517-porto-digital-recife-se-consolida-como-polo-tecnologico-no-pais.html"},{"year":2020,"event":"12月、20年目。344社が入居し雇用は1万1,600人。2019年の売上は23億5,000万レアルで前年比24%増だった","source_url":"https://www.diariodepernambuco.com.br/noticia/economia/2020/12/porto-digital-completa-20-anos-com-historia-consolidada-mas-mira-no-f.html"},{"year":2023,"event":"売上が前年比14%増、従業員は1万8千人を超えた。入居は415社","source_url":"https://www.diariodepernambuco.com.br/noticia/economia/2024/04/porto-digital-cresce-14-em-2023-e-passa-de-18-mil-colaboradores.html"},{"year":2024,"event":"売上が62億レアルに達した。2018年からの6年で226%増","source_url":"https://www.diariodepernambuco.com.br/economia/2026/01/11703517-porto-digital-recife-se-consolida-como-polo-tecnologico-no-pais.html"},{"year":2025,"event":"10月、475社が入居し2万1千人以上が働くと報じられた","source_url":"https://agenciabrasil.ebc.com.br/economia/noticia/2025-10/porto-digital-reune-475-empresas-de-tecnologia-em-recife"}],"last_verified":"2026-08-16","image":{"url":"https://midias.diariodepernambuco.com.br/static/app/noticia_127983242361/2024/04/15/950737/20240415073734845646a.png","type":"photo","relevance_confirmed":true,"credit":"Diario de Pernambuco","source_url":"https://www.diariodepernambuco.com.br/noticia/economia/2024/04/o-ecossistema-bilionario-do-porto-digital.html"},"sections":{"何をしたか":"レシフェの旧港地区バイロ・ド・レシフェ（Bairro do Recife）に残っていた古い建物を修復し、そこにIT企業を入れる形で2000年に始まった技術団地。運営はNGPD（Núcleo de Gestão do Porto Digital）で、州・市・大学と産業界が共同で担う。地区の再生と、市の雇用・所得づくりという2つの目的を同時に置いたことが特徴とされる。開始時の入居企業は2社だったが、2020年に344社、2025年10月時点で475社・雇用2万1千人超まで増えた。現在は旧港地区の全域と隣接する複数地区に広がっている。","誰が始めたか":"**3者が同時に組んだ形として説明されている。** Diario de Pernambuco 2026年1月18日の取材で、Porto Digital の代表 Pierre Lucena は、これが**政府・大学・生産部門の力を結びつけた先駆的な事業として作られた**と述べている。運営主体は NGPD（Núcleo de Gestão do Porto Digital）である。\n\n**目的は最初から2つあった。** 同取材で Lucena は、1つは旧港地区（bairro do Recife）の修復の事業であること、もう1つはレシフェ市のための雇用と所得の創出であることだと述べている。理由として同氏が挙げているのは、**90年代の終わりにペルナンブコ連邦大学（UFPE）が多くの技術者を輩出していたのに、その人たちが市外へ出ていってしまっていた**ことである。\n\n**大学側の当事者も出典に出てくる。** Agência Brasil 2025年10月18日は、Porto Digital の創設者の1人として、UFPE 名誉教授で Recife の先進システム研究センター（CESAR）を構想した Silvio Meira を挙げている。同記事には、当時の状況を語る技術者として電気工学の Eduardo Peixoto も出てくる。**同氏は、卒業した時点では何もなく人材の流出が非常に大きかったとし、自身もサンパウロ、次にジュネーブへ移ったと述べている。** 同氏は2002年、事業が紙の上から出はじめた時期にレシフェへ戻り、2022年から CESAR を率いている。\n\n**行政は途中から役割を増やしている。** 2026年1月の取材で Lucena は、企業が人手不足で案件を断っていた状態を、**大学と組んだ実務研修（residência）と、レシフェ市との「Embarque Digital」計画の到来によって解いたと述べている。** 2024年4月4日の記事にはレシフェ市長 João Campos が登場する。**つまり順序は、州政府・大学・産業界の3者による立ち上げ（2000年）→ 企業の集積 → 市の教育計画が加わる（2018年以降）→ 多国籍企業の進出、である。**","いくらかかったか":"**事業全体の投資額は確認できなかった。** 出典が書いているのは、**立ち上げの原資の種類**と、**その後の売上の規模**である。\n\n- **立ち上げの原資は税の軽減と州の資金だった。** 2026年1月の取材で Lucena は、推進力になったものとして**市の役務税（ISS）の軽減**と、**2000年代の州政府による3,000万レアルの誘導**を挙げている\n- **その税の軽減は失われる見込みだと同氏は述べている。** 同取材で同氏は、税制改革によって ISS の軽減が無くなるとし、役務部門への課税が大幅に重くなることへの懸念を述べている。**これは同氏の見通しであって、実施された事実ではない**\n- **恒常的な資金は公募で取っている。** 同氏は、国内・国際の公募（editais）に応じて資源を確保しているとし、連邦政府・州政府・レシフェ市・Finep（研究プロジェクト資金機関）・欧州の共同体と組んでいると述べている\n- **建物の修復と入居の費用の負担者は書かれていない。** 17世紀に建てられた邸宅（casarões）が空調の効いた事務室になっていると Agência Brasil 2025年10月18日は書いているが、**誰がその改修費を出したかはどの出典にも無い**\n- **回っている金額の側は毎年報じられている。** 2019年の売上は23億5,000万レアル（前年比24%増、2020年12月18日の記事）、2023年は初めて54億レアルに達し（2022年比14%増、2024年4月15日）、**2024年は62億レアルで、2018年から2024年の間に226%伸びた**（2026年1月18日）\n\n`funding_scale` には、この立ち上げの原資（ISS の軽減と州の3,000万レアル）を Lucena の発言として入れ、**事業全体の投資額は確認できていない**と明記した。","真似するなら最低何が必要か":"1. **人材を出し続ける大学が先にあること。** 立ち上げの動機は「UFPE が育てた技術者が市外に出ていく」ことであり、**人材の供給源が既にあったうえで、留まる先を作った**という順序になっている\n2. **空いている歴史的な建物が固まっていること。** 対象は旧港地区の全域と、サント・アマロ地区の一区画、サント・アントニオ・サンジョゼ両地区の一部である（2020年12月18日）。Agência Brasil はこの範囲をサッカー場42面分と書いている\n3. **税の優遇と、それが無くなった後の備え。** 推進力だった ISS の軽減は税制改革で失われる見込みだと代表は述べている。**優遇を前提に設計すると、制度が変わったときに前提が消える**\n4. **教育の側に別の計画を持つこと。** 大学と組んだ実務研修と、市との「Embarque Digital」。代表は、市内の高等教育での年間修了者が500人から1,400人に増え、**公立校出身の修了者は倍以上になった**と述べている（2026年1月18日）\n5. **誰が入るかを測ること。** 同取材で代表は、Embarque Digital のデータで学生の33%が女性であり、技術分野の全国平均14%の2倍を超えると述べている。**以前は中間層が占めていた仕事の枠を、レシフェの周縁部の人が占めるようになっているとも述べている**\n6. **稼ぎ頭が抜けても続く構成。** 2023年の売上上位はアクセンチュア、Avanade、Avantia、CESAR、デロイト、Extreme Digital、Globo、Liferay、Neurotech、Tempest の10社で、**雇用の多い企業群とは一部しか重なっていない**（2024年4月4日）\n\n**確認できないもの**は、事業全体の投資額、建物の改修費の負担者、公的資金と民間投資の比率、企業が受けた優遇の総額、入居企業の撤退の状況、税制改革の影響が実際にどうなるかである。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、2026年1月18日の Diario de Pernambuco による Porto Digital 代表への取材である。**\n\n同取材によれば、**現在は約500社に21,500人の直接雇用がある。** 2025年には Ernst & Young と Capgemini が開設し、**Capgemini は2026年までに1,200人を採用する予定**、Banco Inter は Paço Alfândega で改修中の区画に入る予定とされている。**代表は、始まりは50人規模の2社だったと述べている。**\n\n**入居企業数と雇用は4つの時点で追える。**\n\n| 時点 | 企業 | 雇用 |\n|---|---|---|\n| 2020年1月の調査（同年12月報道） | 344社 | 11,600人 |\n| 2024年4月報道（2023年の実績） | 415社 | 18,400人 |\n| 2025年10月報道 | 475社 | 21,000人超 |\n| 2026年1月の取材 | 約500社 | 21,500人 |\n\n**開始時の企業数は出典間で食い違っている。** 2020年12月の記事は「初めは2社だけだった」と書き、2024年4月15日の記事は「わずか3社という控えめな始まり」と書いている（`discrepancies` に並置した）。\n\n**外へ出る動きが2026年の取材で初めて出てくる。** 同氏は、税制改革への懸念を理由の1つに挙げながら、**内陸への展開（カルアルに所在、次はペトロリナ）と国外への展開**を述べている。ゴイアス州の革新事業の運営を受託し、ポルトガルのアヴェイロには30社を超えるブラジル企業が入るハブを持ち、ブラジリアとアラカジュでも教育の事業を持つとされる。\n\n**外部の評価は帰属つきで1つだけ確認できた。** Agência Brasil 2025年10月18日は、Silvio Meira の発言として、**雇用する人的資本の量から見た世界の情報技術の上位10事業のうち5つが現在 Porto Digital にあると伝えている。** 同記事によれば、多国籍のアクセンチュアとデロイト、新たに来た日本の NTT データとフランスの Capgemini がこの区画に住所を持つ。\n\n**出典の性格について明記しておく。** 5本のうち4本は Diario de Pernambuco、1本は Agência Brasil であり、**2媒体である。** ただし2026年1月の記事は Porto Digital 代表への取材で、2024年4月の2本も同代表と市長の発言を中心に構成されている。**数字の多くは運営主体の側から出ている。** 独立した第三者による検証や、否定的な報道は、**今回探した範囲では見つからなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"3,000万レアル","currency":"BRL","value":30000000,"jpy":926949450},{"raw":"23億5,000万レアル","currency":"BRL","value":2350000000,"jpy":72611040250},{"raw":"54億レアル","currency":"BRL","value":5400000000,"jpy":166850901000},{"raw":"62億レアル","currency":"BRL","value":6200000000,"jpy":191569553000}],"sample":true},{"id":"br-0006","name":"ファヴェーラの使われていない斜面を菜園にし、収穫の半分を地区に配る規定をつけた","name_local":"Hortas Cariocas","name_variants":["Programa Hortas Cariocas"],"country":"ブラジル","region":"リオデジャネイロ州","municipality":"リオデジャネイロ市","population_current":6211223,"population_scale":"25万超","purpose":"お金を地域で回す","theme":"農林水産・食","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"リオデジャネイロ市（Prefeitura do Rio）と各地区の住民。菜園は住民が維持し、市が支える","component_types":"hybrid","components":["使われていない土地を畑にした","収穫の半分を学校と困窮世帯に配る","残り半分の販売益を参加者で分ける","受益世帯を住民組織が指名する"],"sources":[{"url":"https://agenciabrasil.ebc.com.br/geral/noticia/2014-09/hortas-comunitarias-se-multiplicam-pelas-comunidades-do-rio-sabado","title":"Hortas comunitárias se multiplicam nas comunidades do Rio","outlet":"Agência Brasil","published":"2014-09-06","language":"pt","from_operator":false},{"url":"https://www.scielo.br/j/csc/a/wchdxTNXCzPGv67zTbFnByw/?lang=pt","title":"Efeitos e desempenho produtivo da agricultura urbana na saúde coletiva e ambiental na cidade do Rio de Janeiro, Brasil","outlet":"Ciência & Saúde Coletiva","published":2023,"language":"pt","from_operator":false,"source_type":"academic"},{"url":"https://agenciabrasil.ebc.com.br/saude/noticia/2026-03/horta-comunitaria-reune-memoria-cuidado-e-cidadania-em-favela-do-rio","title":"Horta comunitária reúne memória, cuidado e cidadania em favela do Rio","outlet":"Agência Brasil","published":"2026-03-29","language":"pt","from_operator":false}],"context_sources":[{"url":"https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6%5B3304557%5D","title":"IBGE 2022年センサス（リオデジャネイロ市 6,211,223人）"}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2026,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、報道は2014年から2026年にわたる。2014年に市内30か所と報じられ、2026年には84か所になった。2023年の論文は2007年から2019年の生産効率を測り、2012年と2016年に山があったとしている。","timeline":[{"year":2014,"event":"同じ性格の菜園が市内に30か所あり、生産の半分を地区の学校と困窮世帯に寄付する規定があると報じられた","source_url":"https://agenciabrasil.ebc.com.br/geral/noticia/2014-09/hortas-comunitarias-se-multiplicam-pelas-comunidades-do-rio-sabado"},{"year":2019,"event":"サルゲイロで住民の集まりが、地区で知られる植物と使い方の記録を始めた","source_url":"https://agenciabrasil.ebc.com.br/saude/noticia/2026-03/horta-comunitaria-reune-memoria-cuidado-e-cidadania-em-favela-do-rio"},{"year":2023,"event":"論文が2007年から2019年の生産効率を包絡分析で測り、2012年に80.21%、2016年に100.00%の山があったと報告した","source_url":"https://www.scielo.br/j/csc/a/wchdxTNXCzPGv67zTbFnByw/?lang=pt"},{"year":2026,"event":"84か所が住民の手で維持され、市の環境・気候部局によれば2025年の生産は74トン、サルゲイロの収穫は700kgと報じられた","source_url":"https://agenciabrasil.ebc.com.br/saude/noticia/2026-03/horta-comunitaria-reune-memoria-cuidado-e-cidadania-em-favela-do-rio"}],"last_verified":"2026-08-17","image":{"url":"https://imagens.ebc.com.br/UgLnbZWpmvCFyi6qFG-wfTIQyZ8=/1600x800/https://agenciabrasil.ebc.com.br/sites/default/files/thumbnails/image/2026/03/26/_rbr7289.jpg?itok=NppHXKMw","type":"photo","relevance_confirmed":true,"credit":"Agência Brasil","source_url":"https://agenciabrasil.ebc.com.br/saude/noticia/2026-03/horta-comunitaria-reune-memoria-cuidado-e-cidadania-em-favela-do-rio"},"sections":{"何をしたか":"リオデジャネイロ市が、ファヴェーラの使われていない土地を菜園にし、そこで採れたものの配り方まで規定にした。アジェンシア・ブラジルは2014年、同じ性格の菜園が市内に30か所あり、市が始めた Hortas Cariocas によるものだと書いている。目的は都市農業をうながし、質のよい食べものを手の届く値段で、とくに貧しい地区に届けることだとされる。仕組みの中心は配り方にある。**生産の半分は地区の学校と、より困っている世帯に寄付することが義務づけられ**、その世帯は住民組織が指名する。残りの半分は各組が売ってよく、利益は参加者で分ける。2026年3月時点では84か所になっている。","誰が始めたか":"2014年の記事は、事業を考え運営しているのは市の環境部局（Secretaria de Meio Ambiente）の Julio César Barros だと書いている。ただし畑を維持しているのは各地区の住民で、2026年の記事は「住民が維持し、市が支えている」形だとしている。受益世帯を選ぶのは行政ではなく住民組織（Associação dos Moradores）である。ひとつの菜園には世話役がいて、2014年に取材された菜園の世話役はその時点で6年間そこで働いていた。","いくらかかったか":"**確認できなかった。** 出典は事業費にも参加者への支払いにも触れていないため、`funding_scale` は `unknown_fields` に挙げている。\n\n金額の代わりに、出典が書いているのは収支の作り方である。生産の半分は寄付に回るため売上にならない。残る半分を各組が売り、その利益を参加者で分ける。2014年に取材された菜園の世話役は、レタス1束1レアルという値づけを挙げ、売ることより配ることの方が多いと述べている。","真似するなら最低何が必要か":"出典から読み取れる最低条件は5つある。\n\n1. **使われていない土地。** ファヴェーラの斜面など、他の用途に取られていない土地が要る\n2. **市の側に、続けて面倒を見る担当部署と担当者。** 2014年の記事は発案者が同じ人物のまま運営を続けていることを書いている\n3. **受益世帯を選ぶ経路。** ここを行政が決めず、住民組織の指名にしている点がこの事業の形を決めている\n4. **収穫の半分を地区に配るという規定。** これがあるために、菜園は売れるかどうかとは別の理由で続く\n5. **残り半分の販売益を参加者で分ける約束。** 世話をする人の手元に何が残るかが決まっていること\n\n逆に、出典から**確認できない**のは、参加者への手当の有無と額、土地の権利関係、資材の調達方法である。真似する側はここを自分で埋める必要がある。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年3月29日のアジェンシア・ブラジルの記事である。菜園は84か所あり、住民が維持して市が支えている。市の環境・気候部局によれば、2025年の生産は74トンだった。北部のサルゲイロの菜園では収穫が700kgで、2019年からは住民の集まりが、地区で知られている植物とその使い方を記録している。\n\n生産の推移については、2023年に Ciência & Saúde Coletiva に載った論文が、2007年から2019年の生産効率を包絡分析で測り、2012年に80.21%、2016年に100.00%という2つの山があったと報告している。**この論文は生産効率の測定であって、事業全体の評価ではない。**\n\n否定的な報道は、今回探した範囲では見つからなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"1レアル","currency":"BRL","value":1,"jpy":31}],"sample":true},{"id":"br-0009","name":"住民の総会で予算の使い道を決める仕組みを作り、30年後に総会が5年止まった","name_local":"Orçamento Participativo de Porto Alegre","name_variants":["Orçamento Participativo","OP"],"country":"ブラジル","region":"リオグランデ・ド・スル州","municipality":"ポルトアレグレ","population_current":1332845,"population_scale":"25万超","purpose":"住民が決める","theme":"デジタル・情報発信","start_year":1989,"end_year":null,"status_current":"縮小","actor_type":"行政","lead_actor":"ポルトアレグレ市。Brasil de Fato（2020年6月23日）によれば、1989年の最初の回を実施した班を統括したのはルシアーノ・フェドッジ氏で、当時の市政は労働者党のオリビオ・ドゥトラ氏だった","component_types":"soft","components":["地域ごとに総会を開く","住民が事業を選んで順位を付ける","評議会が投資計画に関わる","前年までの積み残しを持ち越す","地域フォーラムを常設にする"],"sources":[{"url":"http://www.scielo.br/scielo.php?script=sci_arttext&pid=S0104-62762008000100002","title":"Instituições participativas e desenho institucional: algumas considerações sobre a variação da participação no Brasil democrático","outlet":"Opinião Pública","published":"2008-06","language":"pt","from_operator":false,"source_type":"academic"},{"url":"https://www.brasildefato.com.br/2020/06/23/pandemia-pode-enterrar-de-vez-o-orcamento-participativo-em-porto-alegre/","title":"Pandemia pode enterrar de vez o Orçamento Participativo em Porto Alegre","outlet":"Brasil de Fato","published":"2020-06-23","language":"pt","from_operator":false},{"url":"http://www.scielo.br/scielo.php?script=sci_arttext&pid=S2236-99962021000100399&tlng=pt","title":"Da democracia participativa à desdemocratização na cidade: a experiência do Orçamento Participativo em Porto Alegre","outlet":"Cadernos Metrópole 23(50)","published":"2020-12","language":"pt","from_operator":false,"source_type":"academic"},{"url":"https://www.jornaldocomercio.com/_conteudo/colunas/pensar_a_cidade/2021/12/824553-atlas-mundial-ve-extincao-do-op-em-porto-alegre.html","title":"Atlas Mundial vê extinção do Orçamento Participativo em Porto Alegre","outlet":"Jornal do Comércio","published":"2021-12-14","language":"pt","from_operator":false},{"url":"https://www.brasildefato.com.br/2022/03/30/orcamento-participativo-saiu-das-maos-da-comunidade-diz-ex-prefeito-de-porto-alegre-raul-pont/","title":"Orçamento participativo saiu das mãos da comunidade, diz ex-prefeito de Porto Alegre Raul Pont","outlet":"Brasil de Fato","published":"2022-03-30","language":"pt","from_operator":false},{"url":"https://www.jornaldocomercio.com/colunas/pensar-a-cidade/2023/08/1121196-demandas-do-op-e-emendas-de-vereadores-terao-atendimento-prioritario-em-porto-alegre.html","title":"Demandas do OP e emendas de vereadores terão atendimento prioritário em Porto Alegre","outlet":"Jornal do Comércio","published":"2023-08-29","language":"pt","from_operator":false}],"context_sources":[{"url":"https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6%5B4314902%5D","title":"IBGE 2022年センサス（ポルトアレグレ市 1,332,845人）"}],"unknown_fields":[],"discrepancies":[{"field":"総会が止まっていた期間","values":[{"value":"2017年と2018年は総会が中止され、2019年に30年を記念して再開したが新規の要望の選定は行われず、2020年と2021年は感染症で再び止まり、2022年に再開したと書いている","source_url":"https://www.jornaldocomercio.com/colunas/pensar-a-cidade/2023/08/1121196-demandas-do-op-e-emendas-de-vereadores-terao-atendimento-prioritario-em-porto-alegre.html","published":"2023-08-29"},{"value":"2018年も資源の不足を理由に新規の要望が拒まれ、2019年に投票が再開したと書いている","source_url":"https://www.brasildefato.com.br/2020/06/23/pandemia-pode-enterrar-de-vez-o-orcamento-participativo-em-porto-alegre/","published":"2020-06-23"},{"value":"2017年に市政が OP の決定の停止を確立したとし、2018年に活動を再開させたのは住民の組織化と政治的な圧力だろうと述べている","source_url":"http://www.scielo.br/scielo.php?script=sci_arttext&pid=S2236-99962021000100399&tlng=pt","published":"2020-12"}]},{"field":"2017年1月時点の積み残しの件数","values":[{"value":"承認済みで未実施の要望が2,395件あり、再評価の結果731件が破棄されたと、市の説明として書いている","source_url":"https://www.brasildefato.com.br/2020/06/23/pandemia-pode-enterrar-de-vez-o-orcamento-participativo-em-porto-alegre/","published":"2020-06-23"},{"value":"2017年1月に遅れている要望が2,369件あり、そのうち672件が取り消され、1,697件が残ったと書いている","source_url":"http://www.scielo.br/scielo.php?script=sci_arttext&pid=S2236-99962021000100399&tlng=pt","published":"2020-12"}]}],"latest_source_year":2023,"elapsed_years":34,"follow_up":"濃い","follow_up_note":"1989年に始まり、2016年を最後に新規の要望の登録が止まった。2017年と2018年は総会が中止され、2020年と2021年は感染症で止まり、2022年に再開した。2021年の世界の調査は、ポルトアレグレの仕組みは事実上消滅したと評している。","timeline":[{"year":1989,"event":"ポルトアレグレで始まったと、複数の出典が書いている","source_url":"https://www.jornaldocomercio.com/_conteudo/colunas/pensar_a_cidade/2021/12/824553-atlas-mundial-ve-extincao-do-op-em-porto-alegre.html"},{"year":2016,"event":"この年を最後に、この仕組みを通じた新規の要望の登録が無くなったと報じられた","source_url":"https://www.jornaldocomercio.com/_conteudo/colunas/pensar_a_cidade/2021/12/824553-atlas-mundial-ve-extincao-do-op-em-porto-alegre.html"},{"year":2017,"event":"承認済みで未実施の要望が2,395件あるとして、市が史上初めてその年の新規の投票をしないことを提案し、評議会が受け入れたと報じられた","source_url":"https://www.brasildefato.com.br/2020/06/23/pandemia-pode-enterrar-de-vez-o-orcamento-participativo-em-porto-alegre/"},{"year":2021,"event":"12月、世界の参加型予算の調査が、ポルトアレグレの仕組みを事実上の消滅にあたると評したと報じられた","source_url":"https://www.jornaldocomercio.com/_conteudo/colunas/pensar_a_cidade/2021/12/824553-atlas-mundial-ve-extincao-do-op-em-porto-alegre.html"},{"year":2022,"event":"3月、元市長ラウル・ポント氏が、この仕組みは共同体の手を離れたと述べたと報じられた","source_url":"https://www.brasildefato.com.br/2022/03/30/orcamento-participativo-saiu-das-maos-da-comunidade-diz-ex-prefeito-de-porto-alegre-raul-pont/"},{"year":2023,"event":"7月12日の市長の政令で、実行可能とされた要望と議員の修正について、必要な資源の最低9割の解放を各局に求めることになったと報じられた","source_url":"https://www.jornaldocomercio.com/colunas/pensar-a-cidade/2023/08/1121196-demandas-do-op-e-emendas-de-vereadores-terao-atendimento-prioritario-em-porto-alegre.html"},{"year":2023,"event":"8月、7月から8月の回の総会に1万3,000人が参加したと報じられた","source_url":"https://www.jornaldocomercio.com/colunas/pensar-a-cidade/2023/08/1121196-demandas-do-op-e-emendas-de-vereadores-terao-atendimento-prioritario-em-porto-alegre.html"}],"last_verified":"2026-08-19","image":{"url":"https://www.jornaldocomercio.com/_midias/jpg/2016/11/09/pb091116_op2_04-1372373.jpg","type":"photo","relevance_confirmed":true,"credit":"Jornal do Comércio","source_url":"https://www.jornaldocomercio.com/_conteudo/colunas/pensar_a_cidade/2021/12/824553-atlas-mundial-ve-extincao-do-op-em-porto-alegre.html"},"sections":{"何をしたか":"ブラジル・ポルトアレグレで、**市の予算の一部の使い道を、地域ごとの総会に集まった住民が選んで順位を付ける**仕組み。\n\nCadernos Metrópole（2020年12月）に載った論文によれば、この仕組みは**1989年に導入された。** 同論文は、ポルトアレグレの歩みを**参加民主主義（1989〜2004年）・自由主義的な統治（2005〜2016年）・超自由主義と市場（2016年〜）**の3期に分けている。\n\nJornal do Comércio（2021年12月14日）によれば、この仕組みは**1989年にポルトアレグレで生まれた。** 同記事によれば、**この仕組みを通じた新規の要望の登録があった最後の年は2016年**である。同記事は、**それでもこの仕組みは正式には終了しておらず、参加型予算評議会（COP）と地域フォーラムは存続していると書いている。**","誰が始めたか":"**市である。** Brasil de Fato（2020年6月23日）によれば、**1989年の最初の回を実施した班を統括したのは社会学者ルシアーノ・フェドッジ氏**で、当時の市政は労働者党のオリビオ・ドゥトラ氏だった。\n\n**後退がいつ始まったかについて、元市長の見方がある。** Brasil de Fato（2022年3月30日）によれば、1997年から2001年まで市長を務めたラウル・ポント氏は、**この仕組みの放棄は2005年から2010年のフォガサ市政に始まり、2010年から2017年のフォルトゥナティ市政に続いた**と述べている。同氏は、その手順として**予算全体の透明性と情報が消えたこと、資源を段階的に減らしたこと、内部の規程を官僚的にして指導者を役職で取り込んだこと**の3つを挙げている。","いくらかかったか":"**この仕組みに割り当てられた額と、実際に実行された額の両方が報じられている。**\n\nBrasil de Fato（2020年6月23日）によれば、市の説明として、**2013年から2017年に4億9,430万レアルが予算に計上されたが、実際の執行は1%に満たなかった。** 同記事によれば、**2016年の要望の総額は8,000万レアルで、執行はその0.4%未満（30万レアル）**だったとされる。同記事によれば、市は**2018年に過年度の要望へ3,340万レアル、2019年には2,180万レアル**を充てた。\n\nJornal do Comércio（2021年12月14日）と Brasil de Fato（2022年3月30日）によれば、**2022年に向けてこの仕組みに充てられたのは1,000万レアル**で、17の地域と6つの主題の集まりに配分される。Jornal do Comércio（2023年8月29日）によれば、**2023年は1,500万レアル、2024年に向けては2,000万レアル**である。","真似するなら最低何が必要か":"第一に、**決めた事業をその年のうちに実行する**こと。**この仕組みで最初に壊れたのはここである。** Brasil de Fato（2020年6月23日）によれば、2017年の就任時点で**承認済みで未実施の要望が2,395件**あり、最も古いものは1994年のものだった。\n\n第二に、**積み残しをどう扱うかを、始める前に決めておく**こと。同記事によれば、市はこの理由で**史上初めて「その年に新規の要望を投票しない」ことを提案し、評議会がそれを受け入れた。** 再評価の結果、**731件が破棄された。**\n\n第三に、**総会が止まっても残る器を用意しておく**こと。Jornal do Comércio（2021年12月14日）によれば、この仕組みは正式には終了しておらず、**評議会と地域フォーラムは存続している。**\n\n第四に、**割り当てる額を、要望の総額と並べて示す**こと。Brasil de Fato（2020年6月23日）によれば、ある地域の委員は、2020年に向けて自分の地域に示された14万9,000レアルという額について、**雀の涙だと評している。**\n\n第五に、**議員の予算修正との関係を決めておく**こと。Jornal do Comércio（2023年8月29日）によれば、2023年7月12日の市長の政令は、実行可能とされた要望と議員の修正について**必要な資源の最低9割の解放を各局に求め、実際の予算計上はこの仕組み由来が最低5割、市議会由来が8割**とした。\n\n第六に、**予算に依らずに解ける要望を先に分ける**こと。同記事によれば、市は2022年の総会で**予算に依らず解決できる504件のピンポイントの要望を特定し、そのうち381件に対応した**と説明している。","今どうなっているか":"**2026年8月時点で確認できたのは、2023年8月29日の記事までである。**\n\n**総会は5年の空白を経て再開した。** Jornal do Comércio（2023年8月29日）によれば、総会には**5年の空白**があった。同記事によれば、**2017年と2018年は「過年度に承認済みの積み残しに充てる資源が無い」という理由で総会が中止され、2019年は30年を記念して総会が開かれたが新規の要望の選定は行われず、2020年と2021年は感染症で再び止まり、2022年に再開した。**\n\n**この空白の数え方は出典で違う。** Brasil de Fato（2020年6月23日）は2018年も資源の不足を理由に新規の要望が拒まれ2019年に投票が再開したとし、Cadernos Metrópole（2020年12月）は2017年に市政が決定の停止を確立したうえで**2018年に活動を再開させたのは住民の組織化と政治的な圧力だろう**と述べている。**この3本は「総会の開催」「新規の要望の投票」「活動」という別々のことを書いているが、それだけでは片付かない食い違いも残る。** Brasil de Fato（2020年6月23日）は2019年に投票が再開したとし、Jornal do Comércio（2023年8月29日）は2019年に総会は開かれたが**新規の要望の選定は行われなかった**としており、これは同じ対象についての正面からの食い違いである。**3つとも `discrepancies` に並置した。**\n\n**世界の調査は「事実上の消滅」と評した。** Jornal do Comércio（2021年12月14日）によれば、2021年12月10日に公開された世界の参加型予算の調査は、ポルトアレグレの仕組みを**事実上の消滅にあたる**とし、同時に**歴史的な参照としては揺るがない**とも評した。同調査によれば、2021年12月時点で稼働している参加型予算は世界で4,000で、2019年の第1版の1万の半分に満たない。感染症の前に確認できた8,800のうち約55%が停止し、24%が継続し、21%が形式を変えた。\n\n**元市長と研究者は、より強い言葉で批判している。** Brasil de Fato（2022年3月30日）によれば、ポント氏は現市政が示した1,000万レアルを**単なる大衆迎合だ**と述べ、ワールドカップの工事や湖畔の事業の予算をこの仕組みの資源と称するのは**ごまかしだ**と述べている。Brasil de Fato（2020年6月23日）によれば、社会学者ネルソン・ジアス氏は**「過程を殺す方法はいくらでもある」**と述べ、重要視しないだけで足りるとしている。同記事によれば、フェドッジ氏は、予算の減少・透明性の低下・強い党派的な道具化が重なった結果、地域間の格差を減らす道具としては機能しなくなったとし、**この仕組みが完全に消し去られないのは象徴としての力ゆえだ**と述べている。\n\n**当事者の側の応答も、同じ記事の中にある。** Brasil de Fato（2020年6月23日）によれば、市の関係機関局は、市が「架空の予算」の問題に正面から取り組み、住民を相応の敬意をもって扱うことにしたと回答した。**2013年から2017年の執行率が1%未満という数字は、市自身が挙げたものである。** Jornal do Comércio（2021年12月14日）によれば、セバスチャン・メロ市長は評議会の会合で資源は一体として見るべきだと主張し、**この仕組みは予算だけのものではないと述べた。** Jornal do Comércio（2023年8月29日）によれば、地域統治・政治調整局長カシオ・トロジウド氏は、ポルトアレグレのこの仕組みは**現実主義の時期にある**とし、議論は確保された額を超えるものだと説明している。\n\n**評議会の側にも自省がある。** Brasil de Fato（2020年6月23日）によれば、ある地域の委員は、2017年に市の提案を評議会が受け入れたことを**自分たちが犯した最大の誤りだった**と述べ、参加が減って脆くなったとしている。\n\n**参加の数と割り当ては上向いている。** Jornal do Comércio（2023年8月29日）によれば、2023年7月から8月の回の総会には**1万3,000人**が参加し、割り当ては2022年向けの1,000万レアルから2023年の1,500万レアル、2024年向けの2,000万レアルへと増えている。**ただし新規の要望の決定は、2016年を最後に戻っていない**（Jornal do Comércio 2021年12月14日）。**この記録が `status_current` を「縮小」としたのは、この一点による。**\n\n**この仕組みは、ブラジルの参加型の制度を比べる研究の対象にもなってきた。** Opinião Pública（2008年6月）に載った論文は、ブラジルの民主化のもとでの参加のばらつきを、参加型の制度とその設計から論じている。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"4億9,430万レアル","currency":"BRL","value":494300000,"jpy":15273037105},{"raw":"8,000万レアル","currency":"BRL","value":80000000,"jpy":2471865200},{"raw":"30万レアル","currency":"BRL","value":300000,"jpy":9269495},{"raw":"3,340万レアル","currency":"BRL","value":33400000,"jpy":1032003721},{"raw":"2,180万レアル","currency":"BRL","value":21800000,"jpy":673583267},{"raw":"1,000万レアル","currency":"BRL","value":10000000,"jpy":308983150},{"raw":"1,500万レアル","currency":"BRL","value":15000000,"jpy":463474725},{"raw":"2,000万レアル","currency":"BRL","value":20000000,"jpy":617966300}],"sample":true},{"id":"dk-0002","name":"ごみ焼却施設の屋根を、通年で滑れる斜面にした","name_local":"Amager Bakke","country":"デンマーク","region":"首都地域","municipality":"コペンハーゲン（アマー）","population_current":667124,"population_scale":"25万超","purpose":"空間をひらく","theme":"エネルギー・資源循環","start_year":2017,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"Amager Ressourcecenter（ARC）と Fonden Amager Bakke","component_types":"hard","components":["焼却施設の屋根を斜面にした","通年で滑れる人工の面を敷いた","屋根に緑地と歩道を通した","建築設計競技で案を選んだ"],"discrepancies":[{"field":"start_year","values":[{"value":2017,"source_url":"https://a-r-c.dk/om-arc/presse/om-amager-bakke/","published":"2020-11-30"},{"value":2019,"source_url":"https://www.dr.dk/nyheder/indland/koebenhavnere-staar-paa-ski-ned-ad-forbraendingsanlaeg","published":"2019-10-05"}]}],"sources":[{"url":"https://www.energy-supply.dk/article/view/617657/budgetrod_danmarks_storste_skibakke_lober_tor_for_penge_kort_for_abning","title":"Budgetrod：Danmarks største skibakke løber tør for penge kort før åbning","outlet":"Energy Supply DK","published":"2018-08-30","language":"da","from_operator":false},{"url":"https://ing.dk/galleri/foto-amager-bakke-aabner-endelig-her-de-tekniske-detaljer-du-skal-laegge-maerke-229248","title":"Foto：Amager Bakke åbner endelig – Her er de tekniske detaljer, du skal lægge mærke til","outlet":"Ingeniøren","published":"2019-10-04","language":"da","from_operator":false},{"url":"https://www.dr.dk/nyheder/indland/koebenhavnere-staar-paa-ski-ned-ad-forbraendingsanlaeg","title":"Københavnere står på ski ned ad forbrændingsanlæg","outlet":"DR","published":"2019-10-05","language":"da","from_operator":false},{"url":"https://a-r-c.dk/om-arc/presse/om-amager-bakke/","title":"Om Amager Bakke","outlet":"Amager Ressourcecenter（ARC）","published":"2020-11-30","language":"da","from_operator":true},{"url":"https://www.dr.dk/nyheder/seneste/copenhill-risikerer-lukning-frem-til-2024","title":"Copenhill risikerer lukning frem til 2024","outlet":"DR","published":"2021-08-14","language":"da","from_operator":false},{"url":"https://www.dezeen.com/2021/08/25/big-copenhill-ski-slope-amager-bakke-risks-closure/","title":"Amager Bakke operator has \"no plans to close down\" ski slope on roof of BIG power plant","outlet":"Dezeen","published":"2021-08-25","language":"en","from_operator":false},{"url":"https://www.dezeen.com/2025/01/24/amager-bakke-big-21st-century-architecture/","title":"BIG's Amager Bakke was the most significant building of 2018","outlet":"Dezeen","published":"2025-01-24","language":"en","from_operator":false}],"context_sources":[{"url":"https://www.kk.dk/sites/default/files/2025-08/Status%20p%C3%A5%20K%C3%B8benhavn%202025%20UA.pdf","title":"Status på København 2025（コペンハーゲン市の人口 667,124人・2025年1月1日現在）"}],"unknown_fields":[],"latest_source_year":2025,"elapsed_years":8,"follow_up":"濃い","follow_up_note":"2017年5月に発電を始め、2019年10月に完成して落成した。2021年8月、路面の摩耗による改修費950万クローネの負担をめぐる争いから閉鎖の可能性があるとDRが報じた一方、運営者は同月、開場したまま区画ごとに張り替えると述べて閉鎖を否定した。2025年1月時点で Dezeen は年間およそ1万人が滑っていると書いている。","timeline":[{"year":2013,"event":"3月に最初の鍬入れが行われた","source_url":"https://a-r-c.dk/om-arc/presse/om-amager-bakke/"},{"year":2017,"event":"5月にエネルギー生産が始まり、10月に職員が入居した","source_url":"https://a-r-c.dk/om-arc/presse/om-amager-bakke/"},{"year":2018,"event":"Dezeen は12月に初めて屋根で滑走が行われたと書いている（DR は2019年10月の正式開業を報じている）","source_url":"https://www.dezeen.com/2025/01/24/amager-bakke-big-21st-century-architecture/"},{"year":2019,"event":"10月4日にスキー場が正式開業。施設全体も同月に完成し、3日間かけて落成した","source_url":"https://www.dr.dk/nyheder/indland/koebenhavnere-staar-paa-ski-ned-ad-forbraendingsanlaeg"},{"year":2021,"event":"8月14日、路面が約2年で摩耗し、改修費950万クローネの負担をめぐる争いが仲裁に至る可能性が報じられた","source_url":"https://www.dr.dk/nyheder/seneste/copenhill-risikerer-lukning-frem-til-2024"},{"year":2021,"event":"8月25日、運営者が閉鎖の予定はないと否定した。区画ごとに張り替えるので開場時間には影響しないと述べている","source_url":"https://www.dezeen.com/2021/08/25/big-copenhill-ski-slope-amager-bakke-risks-closure/"},{"year":2025,"event":"1月、年間およそ1万人が滑る観光地になったと報じられた。一方で焼却量が足りず国外から廃棄物を輸入しているとも書かれている","source_url":"https://www.dezeen.com/2025/01/24/amager-bakke-big-21st-century-architecture/"}],"last_verified":"2026-08-17","image":{"url":"https://asset.dr.dk/drdk/drupal-images/other/2019/10/04/scanpix-20191004-191157-l.jpg?im=AspectCrop%3D%281200%2C675%29%2CxPosition%3D.5%2CyPosition%3D.5%3BResize%3D%281200%2C675%29","type":"photo","relevance_confirmed":true,"credit":"DR","source_url":"https://www.dr.dk/nyheder/indland/koebenhavnere-staar-paa-ski-ned-ad-forbraendingsanlaeg"},"sections":{"何をしたか":"コペンハーゲン・アマーのごみ焼却施設の屋根を、市民が登って滑れる斜面にした。もとの計画は「近代的なごみ焼却施設を建てるだけ」だったが、設計競技で BIG（Bjarke Ingels Group）が屋根を使う案で勝った（Ingeniøren 2019年10月4日）。運営主体 ARC の説明では、2011年1月に BIG の案「Amager Bakke」が選ばれ、2013年3月に着工、**2017年5月にエネルギー生産が始まり**、同年10月に職員が入居。**2019年10月に施設全体が完成し、3日間かけて落成した。** 高さ85mの建物の屋上には緑地と歩道があり、通年で滑れる人工の面を敷いたスキー場が置かれている。スキー場・クライミングウォール・公園・カフェの整備費は8,240万クローネと見積もられ、5つの所有自治体からの借入と4つの財団の資金で賄われた（Energy Supply DK 2018年8月30日）。**開始年は「発電開始の2017年」と「スキー場開業の2019年」で割れる**ため `discrepancies` に並置した。","誰が始めたか":"**もとの計画は「近代的なごみ焼却施設を建てるだけ」だった。** 建築設計競技で BIG（Bjarke Ingels Group）が、焼却施設の上にスキー場を敷くという案で勝ち、それが事業の性格を変えた。Ingeniøren は2019年10月4日に、この案が事業の技術者たちにとってすべてを変えたと書いている。運営主体 ARC（Amager Ressourcecenter）の説明では、2011年1月に BIG の案「Amager Bakke」が選ばれた。\n\n**主体は2つに分かれている。** 焼却施設そのものは ARC が持ち、**屋上のスキー場・クライミングウォール・公園・カフェは別法人の Fonden Amager Bakke（アマー・バッケ財団）が整備した。** ARC は5つの自治体が所有する会社である。屋上部分の設計には設計事務所 SLA が加わった（Dezeen 2025年1月24日）。\n\n競技の当時、Amagerforbraending の責任者 Ulla Röttger は、BIG の提案は有用で美しいものを市にもたらすと述べている（同）。","いくらかかったか":"**屋上部分は8,240万クローネで見積もられた。** クライミングウォール・公園・カフェを含む金額で、**5つの所有自治体からの借入と4つの財団の資金**でまかなわれている（Energy Supply DK 2018年8月30日）。\n\n**この金額は足りなかった。** 同じ記事は、正式開業の数か月前に Fonden Amager Bakke が所有自治体に**さらに890万クローネを求めた**と報じている。記事の見出しは、デンマーク最大のスキー場が開業直前に資金が尽きた、というものである。\n\n**その後さらに費用が発生している。** 2021年8月、路面が約2年で摩耗して張り替えが必要になり、**改修費950万クローネ**の負担をめぐって施設の所有者と保険会社のあいだで争いが起きた。\n\n**焼却施設本体の建設費は、参照した7本のどこにも書かれていない。** `funding_scale` に書いたのは屋上部分の額だけである。","真似するなら最低何が必要か":"この事例で真似できる単位は、屋根の斜面そのものではなく**乗せ方**である。\n\n第一に、**もともと造る必要があった施設に乗せている**こと。ごみ焼却施設は建て替えが決まっていた。屋上の遊びの部分は、その計画に後から足された。ゼロから遊び場を造る事業ではない。\n\n第二に、**主体と会計を分けている**こと。焼却施設は ARC、屋上は Fonden Amager Bakke という別法人が担い、屋上部分の8,240万クローネは自治体からの借入と財団の資金で別に立てられた。**本体の事業費と混ぜていない。** 逆に言えば、屋上部分が足りなくなったとき（890万クローネの追加要請）に、その不足が単独で表に出た。\n\n第三に、**開くまでに時間差を織り込む**こと。発電開始は2017年5月、Dezeen によれば最初の滑走は2018年12月、正式開業は2019年10月である。**設備が動き始めてから遊びの部分が開くまでに2年以上ある。**\n\n第四に、**摩耗を運営費として見込む**こと。人工の面は約2年で張り替えが要ると分かった。運営者は2021年8月、区画ごとに張り替えるので開場時間には影響しないと述べている。**張り替えの費用と手順を最初から契約に入れておかないと、誰が払うかで争いになる。**\n\n第五に、**燃やすごみの量が前提になる**こと。2025年1月の Dezeen は、分別が進んで炉を動かすごみが足りず、運営者が国外から廃棄物を輸入していると書いている。**焼却施設に乗せる形は、焼却量が減る方向の政策と衝突しうる。**","今どうなっているか":"2026年8月時点で確認できたのは、2025年1月24日の Dezeen の記事までである。\n\n**閉鎖については、報じた側と否定した側の両方がある。** 2021年8月14日、DR は、スキー場の路面が約2年で摩耗して張り替えが必要になり、改修費950万クローネを誰が負担するかをめぐって施設の所有者と保険会社のあいだで争いがあり、閉鎖の可能性があると報じた。**その11日後の2021年8月25日、Dezeen は運営者が閉鎖を否定したと報じている。** 運営者は、急な区間の路面が想定より早く摩耗して張り替えが要ることは認めたうえで、張り替えは一度に狭い範囲ずつ行うため開場時間には影響せず、作業していない区画では滑り続けられると述べた。**Terroir はどちらが正しいかを判定しない。**\n\nその後については、2025年1月の Dezeen が、この建物は市街を見渡す観光地になり、**年間およそ1万人が滑っている**と書いている。2021年に報じられた閉鎖は起きなかったことになるが、争いがどう決着したかを書いた出典は確認できなかった。\n\n**同じ2025年の記事は、別の問題も挙げている。** コペンハーゲンの分別が進んだ結果、燃やせるごみが炉を動かすのに足りなくなり、**運営者はデンマーク国外から廃棄物を輸入している**という。この点についての運営者側の説明は確認できなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"8,240万クローネ","currency":"DKK","value":82400000,"jpy":2045753534},{"raw":"890万クローネ","currency":"DKK","value":8900000,"jpy":220961243},{"raw":"950万クローネ","currency":"DKK","value":9500000,"jpy":235857507}],"sample":true},{"id":"id-0001","name":"大学生の課題から始まり、川べりの集落の家を塗り分けて観光地にした","name_local":"Kampung Warna Warni Jodipan","name_variants":["Kampung Warna-Warni Jodipan","Kampung Warna-warni Jodipan"],"country":"インドネシア","region":"東ジャワ州","municipality":"マラン市ブリンビン郡ジョディパン町","population_current":847182,"population_scale":"25万超","purpose":"人を呼ぶ","theme":"文化・アート・祭り","start_year":2016,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"ムハマディヤ・マラン大学（UMM）の学生チーム GuysPro、住民、マラン市、塗料会社 PT Inti Daya Guna Aneka Warna（Indana）","component_types":"hybrid","components":["川べりの家々を塗り分けた","塗料会社の資金で塗装した","住民が集落の中に売店を開いた","対岸の集落と橋でつないだ"],"sources":[{"url":"https://www.detik.com/jatim/wisata/d-5986200/sepi-wisatawan-ekonomi-warga-kampung-warna-warni-jodipan-malang-lumpuh","title":"Sepi Wisatawan, Ekonomi Warga Kampung Warna-warni Jodipan Malang Lumpuh","outlet":"detik.com","published":"2022-03-16","language":"id","from_operator":false},{"url":"https://www.detik.com/jatim/berita/d-7005795/nasib-jembatan-kaca-pertama-indonesia-di-jodipan-malang-yang-kini-retak","title":"Nasib Jembatan Kaca Pertama Indonesia di Jodipan Malang yang Kini Retak","outlet":"detik.com","published":"2023-10-27","language":"id","from_operator":false},{"url":"https://www.detik.com/jatim/pilkada/d-7648516/diklaim-legacy-paslon-ini-sejarah-kampung-warna-warni-jodipan-kota-malang","title":"Diklaim Legacy Paslon, Ini Sejarah Kampung Warna-warni Jodipan Kota Malang","outlet":"detik.com","published":"2024-11-20","language":"id","from_operator":false},{"url":"https://travel.detik.com/domestic-destination/d-8005027/tempat-ini-dulu-kumuh-sekarang-jadi-desa-wisata-tercantik","title":"Tempat Ini Dulu Kumuh, Sekarang Jadi Desa Wisata Tercantik","outlet":"detik.com","published":"2025-07-10","language":"id","from_operator":false}],"context_sources":[{"url":"https://www.detik.com/jatim/berita/d-6889539/38-kabupaten-dan-kota-di-jawa-timur-diurutkan-dari-yang-terpadat","title":"detikJatim「38 Kabupaten dan Kota di Jawa Timur Diurutkan dari yang Terpadat」（同記事は Kota Malang の総人口を2,703,175人、人口密度を7,921人/km² としている。両者は整合しないため数値は採らず区分のみ採った）"}],"single_outlet":true,"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":9,"follow_up":"濃い","follow_up_note":"2016年に大学生の課題から始まり、2017年10月には対岸の集落とつなぐガラスの橋が開通した。2022年には来訪者が減って住民の店が閉じ、2023年10月にはガラスの橋に亀裂が入って一時閉鎖された。2025年にも観光地として紹介されている。","timeline":[{"year":2016,"event":"ムハマディヤ・マラン大学の学生8人のチームが、ごみの投棄が続く川べりの集落の暮らし方を変える取り組みとして家々の塗装を発案した","source_url":"https://www.detik.com/jatim/pilkada/d-7648516/diklaim-legacy-paslon-ini-sejarah-kampung-warna-warni-jodipan-kota-malang"},{"year":2017,"event":"10月9日、長さ20m・幅9.5m・高さ9.5mのガラスの橋が市長によって開通し、対岸のカンプン・トリディとつながった。塗料会社の社会貢献事業と市と大学の協働で建てられた","source_url":"https://www.detik.com/jatim/berita/d-7005795/nasib-jembatan-kaca-pertama-indonesia-di-jodipan-malang-yang-kini-retak"},{"year":2022,"event":"来訪者が減り、住民が開いていた売店の多くが閉じた。自治会長でもある運営組織の代表は、仕入れても買い手がいないため閉めたと説明している","source_url":"https://www.detik.com/jatim/wisata/d-5986200/sepi-wisatawan-ekonomi-warga-kampung-warna-warni-jodipan-malang-lumpuh"},{"year":2023,"event":"10月、開通からほぼ6年たったガラスの橋の北側に亀裂が見つかった","source_url":"https://www.detik.com/jatim/berita/d-7005795/nasib-jembatan-kaca-pertama-indonesia-di-jodipan-malang-yang-kini-retak"},{"year":2025,"event":"7月、かつて雑然としていた場所が観光の村になった例として紹介された","source_url":"https://travel.detik.com/domestic-destination/d-8005027/tempat-ini-dulu-kumuh-sekarang-jadi-desa-wisata-tercantik"}],"last_verified":"2026-08-17","image":{"url":"https://awsimages.detik.net.id/api/wm/2017/02/21/811768e8-41c7-4499-bd49-7c5b29c2aa52_169.jpg?wid=54&w=1200&v=1&t=jpeg","type":"photo","relevance_confirmed":true,"credit":"detik.com","source_url":"https://www.detik.com/jatim/pilkada/d-7648516/diklaim-legacy-paslon-ini-sejarah-kampung-warna-warni-jodipan-kota-malang"},"sections":{"何をしたか":"マラン市を流れるブランタス川のほとりの密集した集落で、住民の家を色とりどりに塗り分けて観光地にした。detikJatim によれば、始まりは**ムハマディヤ・マラン大学（UMM）の学生8人による授業の課題**である。コミュニケーション学科の学生がチーム GuysPro を作り、ごみが片づかず川に投げ込まれる習慣があった集落で、暮らし方を変える取り組みとして塗装を発案した。住民に説明して回って合意を得たのち、塗料会社の支援を受けて家々を塗った。2017年10月9日には、対岸の集落カンプン・トリディとをつなぐ**インドネシア初のガラスの橋**が市長によって開通している。長さ20m、幅9.5m、高さ9.5m。塗料会社の社会貢献事業として、市と大学が組んで建てられた。","誰が始めたか":"**大学生である。** これがこの事例の最も特徴的な点で、行政でも事業者でも住民組織でもなく、授業の課題から始まっている。detikJatim の2024年の記事は、発起人の1人が、当時この集落が雑然として見え、川にごみを捨てる習慣があったので、それを変えたかったと語ったと書いている。\n\nそのあとに市と塗料会社が加わった。ガラスの橋は塗料会社 PT Inti Daya Guna Aneka Warna（Indana）の社会貢献事業として、マラン市とムハマディヤ・マラン大学の協働で建てられている。市はさらに川の北側の集落をカンプン・トリディに作り替え、**この方式が市内の他の「テーマ集落」を生む起点になった**と同記事は書いている。\n\nなお2024年の記事は、この取り組みが市長選の候補者によって自らの実績として主張されたことを報じている。**始めた主体が誰かは、あとから争点になっている。**","いくらかかったか":"**確認できなかった。** 塗装費も橋の建設費も今回の出典には金額が出てこないため `funding_scale` は `unknown_fields` に挙げている。\n\n分かるのは費用の出どころの形である。塗装は塗料会社の支援、橋は同社の社会貢献事業。**住民側の収入は売店**で、2022年の記事によれば売店の多くは住民が開いたものだった。\n\n**入場料については、出典は逆のことを書いている。** detikJatim は、当時の行政が UMM に注意し、**住民が来訪者から入場券を取ることを禁じた**と書いている。","真似するなら最低何が必要か":"1. **塗料を出す相手。** この事例は塗料会社の支援が前提になっている。色を塗るだけとはいえ、集落全体となれば量がまとまる\n2. **住民の合意を先に取ること。** 記事は、学生が住民に説明して回ってから塗装が実現したという順序を明記している。**他人の家の外壁を塗る取り組みである以上、ここを飛ばせない**\n3. **来訪者が落とす金の受け皿。** 住民の売店という形が作られている。**入場券の徴収は行政が禁じたと出典にある**ため、受け皿は売店に限られる\n4. **構造物を作ったなら点検し続けること。** ガラスの橋は開通から6年で亀裂が入り、一時閉鎖された。**塗装と違い、橋は維持費と責任が生じる**\n5. **来訪者が減ったときの備え。** 下記のとおり、この集落の弱点はそこに出た","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2025年7月10日の detikTravel の記事で、かつて雑然としていた場所が観光の村になった例として紹介している。**集落としては続いている。**\n\nただし**途中に明確な落ち込みがある。** 2022年3月の記事は、来訪者が減って住民の売店の多くが閉じたと伝えている。自治会長でもある運営組織の代表は、仕入れても買い手がおらず閉めることになったと説明した。開いている店も、近所の住民がたばこや飲み物を買うのを頼りにしている状態だと書かれている。\n\n2023年10月には、開通からほぼ6年たったガラスの橋の北側に亀裂が見つかり、市の観光部局が安全のため一時閉鎖を決めた。\n\n**人口は出典の中で食い違っている。** detikJatim の一覧は、**25位に「Kota Malang」を挙げて847,182人**としている。一方、2位の Kabupaten Malang の項にも「Kota Malang の総人口は2,703,175人」という一文があり、**同じ記事の中で同じ市に2つの数字が当たっている**（2位は郡＝Kabupaten の順位であり、記事側の書き方が揃っていない）。順位一覧として明示されている847,182人を採り、この食い違いはここに書き残す。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"id-0002","name":"洪水と汚水が混ざる非公式集住地で、人工湿地と通路のかさ上げを住民と一緒に設計した","name_local":"Revitalising Informal Settlements and their Environments","name_variants":["Revitalizing Informal Settlements and Environments"],"country":"インドネシア","region":"南スラウェシ州","municipality":"マカッサル市（バトゥア／ウンティア／タロ／バロンボン／ボノレンガ／カルク・ボドア）","population_current":1700000,"population_scale":"25万超","purpose":"住民が決める","theme":"自然・緑地・水辺","start_year":2017,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"モナシュ大学（豪）が主導し、マカッサル市政府とハサヌディン大学が実施に加わる。資金はオーストラリア外務貿易省（DFAT）の KIAT を通じて出ている","funding_scale":"参照した7本のどこにも、総事業費・1地区あたりの費用・住民負担の額が書かれていない","component_types":"hybrid","components":["人工湿地で汚水を自然に濾す","スマート浄化槽を建物に入れた","かさ上げした通路を約3,000平方メートル敷いた","住民と一緒に設計する会を開いた","雨水タンクで生活用水を足した","6地区を先に完成させた"],"sources":[{"url":"https://watersensitivecities.org.au/content/rise-milestone-reached-in-makassar/","title":"RISE milestone reached in Makassar","outlet":"CRC for Water Sensitive Cities","published":"2019-11-06","language":"en","from_operator":true},{"url":"https://www.cogitatiopress.com/urbanplanning/article/view/4648","title":"Collaborating With Communities: Citizen Science Flood Monitoring in Urban Informal Settlements","outlet":"Urban Planning","published":"2021-12-16","language":"en","from_operator":true,"source_type":"academic"},{"url":"https://makassar.tribunnews.com/2022/09/01/program-rise-australia-indonesia-sulap-makassar-jadi-kota-zero-kumuh","title":"Program RISE Australia-Indonesia, Sulap Makassar Jadi Kota Zero Kumuh","outlet":"Tribun Timur","published":"2022-09-01","language":"id","from_operator":false},{"url":"https://makassar.tribunnews.com/2022/09/01/berikut-5-titik-pencanangan-rise-di-makassar","title":"Berikut 5 Titik Pencanangan Program RISE di Makassar","outlet":"Tribun Timur","published":"2022-09-01","language":"id","from_operator":false},{"url":"https://doi.org/10.1371/journal.pgph.0003430","title":"Who participates in ‘participatory design’ of WASH infrastructure: A mixed-methods process evaluation","outlet":"PLOS Global Public Health","published":"2025-06-13","language":"en","from_operator":false,"source_type":"academic"},{"url":"https://www.wri.org/insights/indonesia-community-led-design-improves-water-sanitation","title":"In Indonesia, Community-Led Design Improves Water and Sanitation","outlet":"World Resources Institute","published":"2026-04-08","language":"en","from_operator":false},{"url":"https://abatanews.com/dinilai-berhasil-di-makassar-program-rise-disiapkan-diperluas-ke-daerah-lain-di-sulsel/","title":"Dinilai Berhasil di Makassar, Program RISE Disiapkan Diperluas ke Daerah Lain di Sulsel","outlet":"Abata News","published":"2026-06-23","language":"id","from_operator":false}],"context_sources":[],"unknown_fields":["funding_scale"],"latest_source_year":2026,"elapsed_years":9,"follow_up":"濃い","follow_up_note":"2017年8月に始まり、2019年にバトゥア地区が最初に完成した。2019年の出典は2022年7月に終わる予定と書いていたが、2026年6月の時点では6地区が完成し、次の6地区の準備が進んでいると報じられている。","timeline":[{"year":2017,"event":"8月に開始した。2019年の時点では2022年7月に終わる予定と書かれていた","source_url":"https://watersensitivecities.org.au/content/rise-milestone-reached-in-makassar/"},{"year":2019,"event":"10月19日、バトゥア地区の改修が最初に完成し、式典が開かれた","source_url":"https://watersensitivecities.org.au/content/rise-milestone-reached-in-makassar/"},{"year":2022,"event":"9月1日、ウンティア町サロドンで緑のインフラの起工式が行われた。対象は市内5つの町（kelurahan）とされた","source_url":"https://makassar.tribunnews.com/2022/09/01/berikut-5-titik-pencanangan-rise-di-makassar"},{"year":2025,"event":"6月、誰が参加設計に参加したかを調べた過程評価が PLOS Global Public Health に掲載された","source_url":"https://doi.org/10.1371/journal.pgph.0003430"},{"year":2026,"event":"4月、WRI Ross Center Prize for Cities の最終候補に入った。約300都市からの選出と報じられている","source_url":"https://abatanews.com/dinilai-berhasil-di-makassar-program-rise-disiapkan-diperluas-ke-daerah-lain-di-sulsel/"},{"year":2026,"event":"6月、6地区が完成し、次の6地区の準備が進んでいると報じられた","source_url":"https://abatanews.com/dinilai-berhasil-di-makassar-program-rise-disiapkan-diperluas-ke-daerah-lain-di-sulsel/"}],"last_verified":"2026-08-19","image":{"url":"https://watersensitivecities.org.au/wp-content/uploads/2019/10/PHOTO-2019-10-20-19-43-45_1.jpg","type":"photo","relevance_confirmed":true,"credit":"CRC for Water Sensitive Cities","source_url":"https://watersensitivecities.org.au/content/rise-milestone-reached-in-makassar/"},"sections":{"何をしたか":"インドネシア・マカッサル市の非公式集住地（permukiman informal）で、**汚水と洪水の水が混ざる状態を、集落の屋外の水の道をつくり替えることで断とうとした**取り組み。豪モナシュ大学が主導し、マカッサル市政府とハサヌディン大学が加わっている。2017年8月に始まった（CRC for Water Sensitive Cities 2019年11月6日）。\n\n**入れたのは、人工湿地・生物濾過の庭・雨水の貯留、そして建物と屋外に置く「スマートな」新しい浄化槽にもとづく地区単位の衛生システムを組み合わせたものである**（同）。加えて排水の改修と、通路のかさ上げを行った。World Resources Institute（2026年4月8日）はこの組み方を分散化と書いている。\n\n**設計は住民と一緒に行う形をとっている。** 2022年9月1日の起工式では、改修は住民と共同で設計されると市長が説明している（Tribun Timur 2022年9月1日）。\n\nWorld Resources Institute（2026年4月8日）によれば、6地区で1,400人超が直接の対象になり、およそ6,000人が間接的な改善を受けている。","誰が始めたか":"**主導しているのは豪モナシュ大学である。** 事業は同大の持続可能開発研究所が率いる海外の研究チームによるもので、CRC for Water Sensitive Cities は自らを「知識のパートナー」として、技術設計・住民との共同設計・詳細設計・施工に関わったと書いている（2019年11月6日）。\n\n**資金はオーストラリア政府から出ている。** Tribun Timur（2022年9月1日）によれば、これはオーストラリア政府とインドネシア政府の間の助成事業で、オーストラリア外務貿易省（DFAT）の資金により、インフラのためのインドネシア・オーストラリア協力（KIAT）を通じて行われている。実施にはモナシュ大学、公共事業・国民住宅省（PUPR）、ハサヌディン大学が関わる。\n\n**現地の研究はハサヌディン大学が担う。** 同大のパートナーシップ担当ディレクター、アンサリヤディは、非公式集住地の水と衛生に「Water Sensitive City」の新しい手法を試す研究に大学が直接関わっていること、家庭からの排水を自然に濾してから環境へ戻すスマート浄化槽の技術がこの研究で導入されたことを述べている（Tribun Timur 2022年9月1日）。同氏によれば、この研究には6か国・18機関・11の学問分野の研究者が加わっている。\n\n**市の側の言葉も出典に残っている。** 起工式でマカッサル市長ダニー・ポマントは、非公式集住地に住む人の水と衛生へのアクセスと気候への耐性を高めることが目的だと述べ、300を超える世帯が対象になるとしている（Tribun Timur 2022年9月1日）。","いくらかかったか":"**総事業費は、参照した7本のどこにも書かれていない。** 1地区あたりの費用も、住民負担の有無も書かれていない。`unknown_fields` に `funding_scale` を申告した。\n\n**分かっているのは資金の出どころだけである。** オーストラリア外務貿易省（DFAT）の資金で、KIAT を通じて実施されている（Tribun Timur 2022年9月1日）。2026年6月の時点で完成した6地区は、オーストラリア政府の支援によるものとされる（Abata News 2026年6月23日）。\n\n**物の量は分かる。** World Resources Institute（2026年4月8日）によれば、数百のトイレが設置されて地区の衛生システムに接続され、かさ上げした通路はおよそ3,000平方メートルに達している。","真似するなら最低何が必要か":"第一に、**立ち退かせないことを前提に置く**こと。World Resources Institute（2026年4月8日）は、この事業の中心にある考えを、こうした何世代も続く集落を「除去や移転の対象となる問題」ではなく、インフラの革新が起きる場所とみなすことだと書いている。同記事は、社会関係・生業・日々の習慣を乱さずに地区を残しながらそれを行っているとも書いている。\n\n第二に、**汚れた水がどこを通って人に届くかを先に特定する**こと。2019年の式典で、海外の研究チームの代表として出席したトニー・ウォン教授は、この手法の中心は廃棄物の流れから生じる糞便汚染の経路への曝露を減らすことにあると述べている（CRC for Water Sensitive Cities 2019年11月6日）。**汚水処理と雨水排水を別々に直すのではなく、両者が混ざる地点を止める設計になっている。**\n\n第三に、**衛生設備を住民が集まる場所と兼用にする**こと。RISE 共同ディレクターでモナシュ大学教授のディエゴ・ラミレス・ロベリングは「地域の生活の場にもなるインフラを設計した」と述べている（World Resources Institute 2026年4月8日）。人工湿地は植栽のある広場を兼ね、かさ上げした通路は洪水対策と共同の場所を兼ねている。\n\n第四に、**分散型でつくる**こと。World Resources Institute（2026年4月8日）は、地区ごとの人工湿地、加圧式の下水、蓋のある共同浄化槽によって衛生システムを分散化したと書いている。マカッサル市長ダニー・ポマントは、この改修が都市の在来のインフラでは届きにくい地域の数百世帯に向けたものだと述べている（Tribun Timur 2022年9月1日）。\n\n第五に、**先に1地区つくって見せる**こと。バトゥア地区は手法を示すための実演地区として選ばれ、2019年10月19日に最初に完成した（CRC for Water Sensitive Cities 2019年11月6日）。**5つの町へ広げる起工式はその約3年後の2022年9月である。**\n\n第六に、**「住民と一緒に設計した」を後から測る**こと。2025年6月13日に PLOS Global Public Health に載った過程評価は、マカッサルで320件、スバで503件の調査をもとに、誰が参加し誰が満足したかを統計で調べている。**参加したと答えた人はマカッサルで89%だが、参加するかどうかを分ける要因として性別・年齢・婚姻状況が統計上有意に出た。** 意思決定への影響力に満足した人は66%である。**同じ論文は「一部の住民は RISE への不信と、地域の代表者によって活動から排除されたと感じたことを述べた」とも書いている。**","今どうなっているか":"**2026年8月時点で確認できたのは、2026年6月23日の記事までである。**\n\n**終わる予定だった時期を過ぎて続いている。** CRC for Water Sensitive Cities（2019年11月6日）は、この事業が2017年8月に始まり2022年7月に終わる予定だと書いていた。**Abata News（2026年6月23日）は、9年にわたる実施として書き、バトゥア・ボノレンガ・バロンボン・ウンティア・タロ・カルク・ボドアの6地区が完成し、次の6地区の準備が進んでいると伝えている。**\n\n**州への拡大が話し合われている。** 同記事によれば、2026年6月22日に南スラウェシ州副知事ファトマワティ・ルスディが、豪総領事トッド・ディアスとモナシュ大学のチームと、事業を州内の他の地域へ広げる計画を話し合った。\n\n**国際的な選定に入っている。** Abata News（2026年6月23日）によれば、マカッサルは WRI Ross Center Prize for Cities で世界の5本に入り、2026年4月にニューヨークで発表された。選考には世界のおよそ300都市が関わったとされる。**同じ賞について World Resources Institute（2026年4月8日）は、5件の最終候補の1つに選ばれたと書いている。順位のように書いているのは Abata News の側である。**\n\n**指摘への応答は、指摘した論文の中にある。** 2025年6月の過程評価は、参加と影響力に性別と社会的な不平等が見られたとしたうえで、水と衛生の事業は地域住民や地元組織との関わりの質を振り返るべきだと勧めている。**この論文の著者には RISE の関係者が名を連ねている。** 参照した7本の中に、これとは別に事業者側が反論した記述は無い。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"id-0003","name":"瓦の産地で瓦工場を芸術の場に変え、瓦を鳴らす祭りを住民の側から立てた","name_local":"Jatiwangi art Factory","name_variants":[],"country":"インドネシア","region":"西ジャワ州","municipality":"マジャレンカ県ジャティワンギ郡ジャティスラ村","population_scale":"不明","purpose":"誇りをつくる","theme":"文化・アート・祭り","start_year":2005,"end_year":null,"status_current":"継続中","actor_type":"NPO","lead_actor":"Jatiwangi art Factory（2005年9月27日設立の非営利団体）。設立に関わったのはアリエフ・ユディ・ラフマン氏とギンギ・シャリエフ・ハシム氏で、2008年からジャティスラ村役場と組んでいる","funding_scale":"参照した4本のどこにも金額が書かれていない。設立者は2024年2月に、政府の助成もあるがその前に住民の相互扶助（gotong royong）があったと述べている","component_types":"soft","components":["瓦工場を芸術の場に変えた","瓦を素材にした作品をつくる","3年ごとに瓦の祭りを開く","海外の作家を村に住まわせる","村役場と組んで調査を続ける","ラジオ放送と月例の議論を持つ"],"sources":[{"url":"https://koalisiseni.or.id/anggota/jatiwangi-art-factory/","title":"Jatiwangi Art Factory - Koalisi Seni","outlet":"Koalisi Seni","published":"2019-11-23","language":"id","from_operator":false},{"url":"https://radarmajalengka.disway.id/kabupaten-majalengka/read/622729/jatiwangi-art-factory-dari-genteng-tanah-liat-hingga-bisa-mendunia","title":"Jatiwangi Art Factory, dari Genteng Tanah Liat hingga Bisa Mendunia","outlet":"Radar Majalengka","published":"2022-07-20","language":"id","from_operator":false},{"url":"https://www.detik.com/pop/culture/d-7216797/18-tahun-jaga-jatiwangi-art-factory-ini-caranya","title":"18 Tahun Jaga Jatiwangi Art Factory, Ini Caranya","outlet":"detikcom","published":"2024-02-28","language":"id","from_operator":false},{"url":"https://www.liputan6.com/lifestyle/read/5537785/mengenal-jatiwangi-art-factory-komunitas-seni-tanah-liat-yang-gagas-pertunjukan-musik-rampak-genteng","title":"Mengenal Jatiwangi Art Factory, Komunitas Seni Tanah Liat yang Gagas Pertunjukan Musik Rampak Genteng","outlet":"Liputan6","published":"2024-07-17","language":"id","from_operator":false}],"context_sources":[],"unknown_fields":["population_scale","population_current","funding_scale"],"latest_source_year":2024,"elapsed_years":19,"follow_up":"濃い","follow_up_note":"2005年9月27日に瓦工場を芸術の場に変えて始まった。2012年に住民が瓦を打ち鳴らす催しを始め、2022年にはドイツの documenta fifteen に出た。2024年時点で18年続いていると報じられている。","timeline":[{"year":1905,"event":"JaF の発案者ギンギ・シャル・ハシム氏の語りとして、オランダ植民地政府が製糖工場の建設に必要な資材を賄うため住民に瓦と煉瓦のつくり方を学ぶよう命じ、産業化の仕組みもこのとき入ったと伝えられている","source_url":"https://radarmajalengka.disway.id/kabupaten-majalengka/read/622729/jatiwangi-art-factory-dari-genteng-tanah-liat-hingga-bisa-mendunia"},{"year":2005,"event":"9月27日に設立された。バンドンから戻った美術家夫妻が、瓦工場を芸術の場に変えた","source_url":"https://koalisiseni.or.id/anggota/jatiwangi-art-factory/"},{"year":2006,"event":"住み込み制作の催しが Jatiwangi International Performing Artist-in-Residence Festival として、郡内の3つの村で始まった","source_url":"https://koalisiseni.or.id/anggota/jatiwangi-art-factory/"},{"year":2008,"event":"ジャティスラ村役場と組み、現代美術を使った共同の調査を始めた","source_url":"https://koalisiseni.or.id/anggota/jatiwangi-art-factory/"},{"year":2012,"event":"住民が瓦を打ち鳴らす Rampak Genteng を始め、瓦を地域の呼び名として固めていった","source_url":"https://radarmajalengka.disway.id/kabupaten-majalengka/read/622729/jatiwangi-art-factory-dari-genteng-tanah-liat-hingga-bisa-mendunia"},{"year":2022,"event":"7月、ドイツ・カッセルの documenta fifteen に陶の作品「Oemar Was Here」を出した","source_url":"https://radarmajalengka.disway.id/kabupaten-majalengka/read/622729/jatiwangi-art-factory-dari-genteng-tanah-liat-hingga-bisa-mendunia"},{"year":2024,"event":"2月、18年目として報じられた。県が建物の3割をテラコッタにする条例を持つに至ったと設立者が述べている","source_url":"https://www.detik.com/pop/culture/d-7216797/18-tahun-jaga-jatiwangi-art-factory-ini-caranya"}],"last_verified":"2026-08-19","sections":{"何をしたか":"インドネシア・西ジャワ州マジャレンカ県ジャティワンギ郡ジャティスラ村で、**瓦工場の建物を芸術の場に変え、その土地が焼いてきた土（粘土）そのものを作品と祭りの素材にした**取り組み。Koalisi Seni（2019年11月23日）によれば、Jatiwangi art Factory（JaF）は**2005年9月27日に設立された非営利団体**で、祭り・上演・美術・音楽・映像・陶芸・展示・作家の住み込み制作・月例の議論・ラジオ放送・教育を通して、農村の暮らしを研究することを軸に置いている。\n\n**始まりは帰郷である。** detikcom（2024年2月28日）によれば、設立者のアリエフ・ユディ・ラフマン氏は2005年、同じくバンドン工科大学で美術を学んだ妻のロラニタ・テオ氏とともに郷里へ戻り、**瓦工場を芸術の場に変えた。**\n\n**素材が瓦であることには土地の由来がある。** JaF ディレクターのパンドゥ・ラハディアン氏は、ジャティワンギが1905年から粘土を瓦にしてきたため、住民と自分たちが**土を瓦にする以外の仕方で地域を語り合いやすくなっていると述べている**（Liputan6 2024年7月17日）。\n\n**3年ごとに祭りがある。** 瓦の祭りと、瓦工場で働く人の体づくりを競う催しである（detikcom 2024年2月28日）。","誰が始めたか":"**団体は住民の側から立ち上がっている。** detikcom（2024年2月28日）によれば、アリエフ・ユディ・ラフマン氏は、**村の人たちが最初から相互扶助（gotong royong）で助けてくれなければ、ここまで続かなかったと述べ、それが団体を強くしたとしている。** 同氏は「政府の助成もあるが、その前に相互扶助があった。それがいちばん進んだ運営の仕組みだ」という趣旨を述べている。\n\n**設立に関わったのは2人である。** Liputan6（2024年7月17日）は、JaF が2005年からアリエフ・ユディ氏とギンギ・シャリエフ・ハシム氏によって続いてきたと書いている。同記事によれば、アリエフ氏はバンドンに長く住み、そこで Galeri Barak などの場を仲間と立ち上げたのち、**それまで芸術というものが想像されたことのない土地へ帰って芸術を差し出すことを選んだ。**\n\n**もう1人はもとの村長である。** Radar Majalengka（2022年7月20日）は、ギンギ・シャル・ハシム氏を JaF の発案者であり、ジャティワンギ郡ジャティスラ村の元村長として紹介している。\n\n**村役場との関係が制度になっている。** Koalisi Seni（2019年11月23日）によれば、JaF は**2008年からジャティスラ村役場と組み、共同でつながり合う現代美術の関わり方を使って調査を行っている。**","いくらかかったか":"**金額は、参照した4本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**分かるのは資金の質だけである。** アリエフ・ユディ・ラフマン氏は2024年2月、政府の助成もあるが、その前に住民の相互扶助があったと述べている（detikcom 2024年2月28日）。**額でも比率でもなく、順序として語られている。**\n\n**土地の側の元手も出典に出ている。** Radar Majalengka（2022年7月20日）によれば、1905年、オランダ植民地政府は製糖工場をいくつも建てる計画に必要な資材を賄うため、住民に瓦と煉瓦のつくり方を学ぶよう命じた。産業化の仕組みもこのとき入ったとされる。**JaF が使っている技能と土は、この時期に置かれたものである。**","真似するなら最低何が必要か":"第一に、**その土地が既に手を動かしてきた素材を選ぶ**こと。JaF は粘土を選んだ。ディレクターのパンドゥ・ラハディアン氏は、1905年から粘土を瓦にしてきた土地であることが、住民と地域を別の仕方で語り合ううえで働いたと述べている（Liputan6 2024年7月17日）。**新しい素材を持ち込むのではなく、既にある産業の素材をそのまま使っている。**\n\n第二に、**場所を新しく建てない**こと。使ったのは既にある瓦工場の建物である（detikcom 2024年2月28日）。\n\n第三に、**相互扶助を先に置き、助成を後に置く**こと。設立者は、住民の相互扶助が先にあり、政府の助成はその後だという順序で説明している（同）。\n\n第四に、**役場と組む形を制度にする**こと。JaF は2008年から村役場と共同で調査を行っている（Koalisi Seni 2019年11月23日）。**団体と役場が別々に動くのではなく、調査という共同の作業を持っている。**\n\n第五に、**催しに周期を決める**こと。住み込み制作の催しは2006年に始まり、2010年と2012年に名前を変えながら続いている（同）。瓦の祭りと体づくりの催しは3年ごとである（detikcom 2024年2月28日）。**続くかどうかは、次がいつ来るかが決まっているかで変わる。**\n\n第六に、**働く人そのものを主役にする**こと。3年ごとの催しの一つは、瓦工場で働く人の体づくりを競うものである（同）。**作品を見せる催しと、働く人が出る催しの両方がある。**","今どうなっているか":"**2026年8月時点で確認できたのは、2024年7月17日の記事までである。**\n\n**18年目として報じられている。** detikcom（2024年2月28日）は、JaF がジャティスラ村にある集団かつ芸術の場として18年続いていると書いている。同記事によれば、**この取り組みは芸術を好む人と一般の住民が出会う地点になり、マジャレンカ県は自らを「テラコッタの都市（kota terakota）」と掲げるに至った。** 設立者は、**建物の3割をテラコッタにするという内容が条例（Perda）にまでなったと述べ、これが他の都市との違いだとしている。**\n\n**国の文化政策の中にも位置づけられている。** 同記事で設立者は、村の計画づくりの会議（出典の綴りは Musrembang）に呼ばれ、国の文化振興の場（PKN）にも招かれた結果、**文化振興の10地域の手本の一つになったと述べている。**\n\n**国外にも出ている。** Radar Majalengka（2022年7月20日）によれば、JaF は上演で注目を集めたのち、ドイツ・カッセルで5年ごとに開かれる documenta fifteen に美術作品を出した。陶による「Oemar Was Here」は、ジャティワンギの瓦を始めた人物とされるハジ・ウマル・マルーフ氏を世界に紹介するものだったとされる。\n\n**縮小や中断を伝える記述は、参照した4本の中には無い。** ただし4本のうち2本は2024年前半のもので、**それ以降の記録には到達していない。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"jp-0020","name":"港の再開発を束ねるために作られた市の会社が、解散を検討される側になった","name_local":"神戸ウォーターフロント開発機構","name_variants":["ウォーターフロント開発機構"],"country":"日本","region":"兵庫県","municipality":"神戸市中央区","population_current":null,"population_scale":"25万超","purpose":"人を呼ぶ","theme":"自然・緑地・水辺","start_year":null,"end_year":null,"status_current":"判定不能","actor_type":"行政","lead_actor":"神戸ウォーターフロント開発機構（神戸市の外郭団体）","component_types":"soft","components":["港の再開発を束ねる会社を作った","改修中の塔の事業者候補を発表した","塔の階ごとに担い手を割り振った"],"single_outlet":true,"sources":[{"url":"https://www.kobe-np.co.jp/news/kobe/202201/0014956183.shtml","title":"遊びに、文化に、食に充実 神戸の臨海部、ウオーターフロントエリアで進む再開発","outlet":"神戸新聞","published":"2022-01-01","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/kobe/202304/0016266159.shtml","title":"神戸ポートタワー、事業者候補の3社決まる フェリシモが展望施設でカフェやバー、クレ・ドゥ・レーブも","outlet":"神戸新聞","published":"2023-04-21","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/society/202606/0020507518.shtml","title":"「ウォーターフロント開発機構」神戸市まちづくり外郭団体 解散へ 経営、市の負担金に依存","outlet":"神戸新聞","published":"2026-06-23","language":"ja","from_operator":false}],"context_sources":[{"url":"https://www.kobe-np.co.jp/news/society/202606/0020510981.shtml","title":"神戸新聞「神戸市主導の街開きから30年超 ハーバーランド民間運営に 外郭団体の全株放出方針」（2026-06-24。同じ改革方針が別の団体についても報じられていることの裏取り。本文に当機構の名は無いため sources には入れない）"}],"unknown_fields":["population_current","start_year","elapsed_years","funding_scale"],"latest_source_year":2026,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"設立年は出典から確認できず、記録は2022年から2026年にわたる。2022年の記事は設立と担う役割を、2023年の記事はポートタワーの事業者候補3社の決定を、2026年の記事は市が解散を検討していることを報じている。","timeline":[{"year":2022,"event":"神戸新聞が、市が前年5月末にエリアのまちづくりを担う新会社として同機構を設立し、エリア全体のマネジメント、市場分析、投資の誘発、事業化の支援を進めるとしていると報じた","source_url":"https://www.kobe-np.co.jp/news/kobe/202201/0014956183.shtml"},{"year":2023,"event":"同機構が神戸ポートタワーの事業者候補3社が決まったと発表した。営業再開は当初の23年度中から24年春に延びていた","source_url":"https://www.kobe-np.co.jp/news/kobe/202304/0016266159.shtml"},{"year":2026,"event":"神戸新聞が、市が同機構の解散を検討していると報じた。市の負担金に依存した経営状況が課題で、市が2月に策定した外郭団体の改革方針で「重点的見直し対象団体」に挙がっていた","source_url":"https://www.kobe-np.co.jp/news/society/202606/0020507518.shtml"}],"last_verified":"2026-08-19","sections":{"何をしたか":"神戸市が、港の再開発を束ねるための会社を作った。神戸新聞の2022年1月の記事によれば、**市は前年の5月末に、エリアのまちづくりを担う新会社として「神戸ウォーターフロント開発機構」を設立し**、エリア全体のマネジメントを担うほか、市場分析や投資の誘発、事業化の支援などを進めるとした。同機構が具体的に担った仕事として出典に現れるのは、**改修中の神戸ポートタワーについて、施設内のカフェやバーなどを運営する事業者候補3社が決まったと発表したこと**である。**そして2026年6月、神戸新聞は市がこの機構の解散を検討していると報じた。**","誰が始めたか":"**市である。** 神戸新聞は、設立したのは市だと書いている。同機構は**市の外郭団体**として扱われている。\n\nこの会社は単独で現れたのではなく、**10年以上続く構想の途中に置かれている。** 同紙によれば、市が将来構想を描いた指針「港都神戸 グランドデザイン」を発表したのは2011年で、その4年後に第1弾として第1突堤に宿泊施設が整備された。2022年1月の時点では、第1突堤の付け根に通販大手の本社が移転し、自動車販売会社が本社ビルを開業し、劇場型アクアリウムの入る複合施設も開いていた。第2突堤では1万人収容のアリーナが24年度完成予定とされ、突堤間の水域約5ヘクタールの活用を検討する委員会も動き出していた。\n\n**同紙は、市長が次世代型路面電車（LRT）導入の必要性を主張しているとも書いている。** 会社が置かれたのは、こうした個別の事業が並行して進む場面である。","いくらかかったか":"**設立時の出資額も年間の予算も、今回の出典からは確認できなかった。** `funding_scale` は `unknown_fields` に挙げている。\n\n**ただし2026年の記事は、経営の性格を1点だけ示している。** 同紙は、機構をめぐって**市の負担金に依存した経営状況などが課題となっていた**と書いている。**この記事は会員限定で、無料で読める範囲は全文673文字のうち173文字である。金額を含む具体は有料部分にある可能性がある。**","真似するなら最低何が必要か":"**この事例から取り出せるのは、束ねる会社を作るときに何が問われるかである。**\n\n1. **会社自身の収入源を先に決めること。** 前節のとおり、2026年の記事が課題として挙げているのは市の負担金への依存である。**同機構が担うとされたのは、エリア全体のマネジメント、市場分析、投資の誘発、事業化の支援である**（2022年の記事）\n2. **事業者の顔ぶれを決める役を担わせること。** 2023年の記事によれば、同機構はポートタワーの事業者候補3社が決まったと発表した。地上約100メートルの屋上に新設される展望施設と5階分の展望フロアを通販大手が、3・4階を結婚式場運営会社が、2階を地場産業の商品開発を手がける会社が担うという内容である\n3. **工期の遅れを見込むこと。** 同記事は、ポートタワーが2021年に大規模改修に着手し、**工事の遅れなどの影響で当初は23年度中とされていた営業再開が24年春に延びた**と書いている\n4. **外部の点検を受ける前提で作ること。** 2026年の記事は、無料で読める範囲に**「外部監査で『市の契約違反』指摘」という小見出し**を置いている。**その中身は有料部分にあり、確認していない**\n\n**確認できない**のは、出資額、負担金の額、外部監査の指摘の中身、そして解散が決まったかどうかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年6月23日の神戸新聞である。**市が同機構の解散を検討していることが22日に分かった**と報じている。同紙によれば、機構は**市が2月に策定した外郭団体の改革方針で「重点的見直し対象団体」に挙がっていた。**\n\n**解散が決まったとは書かれていない。** 出典の書き方は「市が解散を検討している」であり、`status_current` は `判定不能` とした。\n\n**同じ月に、別の団体についても同じ方針が報じられている。** 神戸新聞は翌6月24日に、神戸ハーバーランド株式会社について市が民営化する方針を固めたと報じ、**同社も市が今年2月に策定した外郭団体の改革方針で「重点的見直し対象団体」に挙がっていた**と書いている。**2つの記事が、同じ改革方針を別々の団体について書いていることになる。**\n\n否定的な報道は、**本レコードの出典そのものである。** 当事者である機構および神戸市の反論は、今回取得できた無料部分には含まれていない。**有料部分に反論が載っている可能性は排除できない。**\n\n**出典はすべて神戸新聞であり、`single_outlet: true` を申告した。** 掲載年は2022年・2023年・2026年の3つに分かれている。兵庫県で robots.txt が Claude を名指ししていないことを実測できた媒体が同紙であり、他紙は当たっていない。**なお CiNii には同機構を扱った書誌が1件も無い。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"jp-0021","name":"不動産会社の経営者を中心に5人で空き家の相談窓口を作り、県内全域から年 p/shisei/wakayama/1001006/1055677/1055678/1063488/1066951.html","title":"和歌山市 住民基本台帳による人口・世帯数（令和8年2月1日現在 総人口349,208人・世帯数177,203）"}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2026,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"設立年は出典から確認できず、記録は2015年から2026年にわたる。2015年の記事は国の事業への採択と相談センターの開設を、2026年2月の資料は和歌山市が指定した支援法人としての位置づけを、2026年6月の記事は年間約150件の相談を扱っている。","timeline":[{"year":2015,"event":"ニュース和歌山が、同法人が5月に国土交通省の空き家管理等基盤強化推進事業の実施機関として和歌山県内で初めて選ばれ、「空き家相談センターわかやま」を8月下旬に設けると報じた","source_url":"https://www.nwn.jp/news/2015061302aki/"},{"year":2026,"event":"和歌山市の資料が、令和7年1月23日指定の空家等管理活用支援法人3者の1つに同法人を挙げ、令和7年度は空き家カンファレンスを全4回開催するとした","source_url":"https://www.kkr.mlit.go.jp/kensei/jutaku/ol9a8v0000035gqj-att/r7_2_5.pdf"}],"last_verified":"2026-08-19","sections":{"何をしたか":"和歌山市で、**空き家の持ち主が最初に持ち込む窓口を民間の側に作った。** ニュース和歌山の2015年の記事によれば、一般社団法人ミチル空間プロジェクトは、シェアハウスやリノベーションできる賃貸マンションなどの物件を紹介する**不動産会社の経営者である南順子が中心となって同年3月に立ち上げ**、メンバーは建築士や不動産オーナーら5人だった。同年5月に**国土交通省の空き家管理等基盤強化推進事業の実施機関として和歌山県内で初めて選ばれ**、同紙は「空き家相談センターわかやま」を8月下旬に設けると報じた。**目的は、県内の空き家を掘り起こし、管理と利活用を提案することでまちづくりにつなげることだとされている。**","誰が始めたか":"**行政ではなく、不動産の実務者である。** 前述のとおり中心にいたのは不動産会社の経営者で、集まったのは建築士や不動産オーナーら5人である。\n\n**ただし、動く仕組みは行政と地続きに作られている。** 同紙によれば、相談センターは**自治体と連携して月1、2回の無料相談会を開き**、所有者から悩みを聞いて内容によっては建物の簡易調査を実施し、状況に応じて司法書士ら専門家や荷物整理業者、解体業者へつなぐ形にすると書かれている。**いずれも開設前の記述であり、そのとおり運用されたかは今回の出典からは確認できない。**\n\n**人手はボランティアで賄う設計だった。** 同紙は、2015年6月18日に相談員を養成するための説明会を和歌山大学まちづくりプロジェクト室で開催すると伝え、南理事長の**「相談員はボランティアなので、空き家問題解消へ志のある方に協力してほしい」**という言葉を載せている。説明会では、メンバーで和歌山大学システム工学部の小川宏樹准教授が県内の空き家の現状を説明し、奈良県で同じ事業に選ばれた団体の代表理事も話すとされた。","いくらかかったか":"**運営費も、国の事業による支援額も、今回の出典からは確認できなかった。** `funding_scale` は `unknown_fields` に挙げている。\n\n出典から分かるのは組織の作り方のほうである。前節のとおり2015年の記事では相談員はボランティアとされ、専門的な処理は外部の士業や事業者へつなぐ形が示されている。**2026年の2本にはボランティアの語が無く、現在の体制は確認できない。****2015年の記事が示した設計では、組織の中に抱えるのは窓口と調査までである。**","真似するなら最低何が必要か":"出典から取り出せるのは4つである。\n\n1. **入口を1つにすること。** 相談の中身は賃貸・売買・荷物整理と幅がある。同法人はそれを1つの窓口で受け、**内容に応じて司法書士ら専門家や荷物整理業者、解体業者へつなぐ**形にした\n2. **解体以外の選択肢を先に見せること。** 南理事長は2015年の記事で、家主に対して解体以外の活用の方法も助言したいという考えを示している\n3. **調査を挟む設計にすること。** 同紙によれば、悩みを聞いたうえで内容によっては建物の簡易調査を実施するとされていた。**話を聞くだけで振り分ける形にはなっていない**（2015年の記事の記述）\n4. **公的な位置づけを取りに行くこと。** 和歌山市の2026年2月の資料によれば、同法人は**令和7年1月23日指定の空家等管理活用支援法人3者のうちの1つ**である（他は株式会社和みと公益社団法人全日本不動産協会）。同資料は空き家対策を啓発・活用・除却の3本柱に整理し、**啓発の側にある「空き家カンファレンス」の担い手として同法人を置いている**\n\n**解決の度合いは一部だけ分かる。** 和歌山市の資料は、空き家カンファレンスについて**相談件数の84%が解決又は解決に向けて前進**したと書いている。**確認できない**のは、運営費、空き家カンファレンス以外の相談の解決率、そして設立から今日までに扱った空き家の総数である。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年6月のLIVING和歌山である（**掲載日は meta と JSON-LD が2026-06-03、本文の表示は2026/6/4 で1日ずれている**）。同紙は、空き家相談センターわかやまが国土交通省の事業に採択され、**県内全域を対象に年間約150件もの相談を受けている**と書いている。\n\n**規模の背景も同紙が置いている。** 総務省の住宅・土地統計調査（2023年）によれば和歌山県の空き家数は約10万5000戸で、**空き家率は21.2%と、徳島県に次いで全国2位**である。\n\n**相談の中身について、当事者はこう説明している。** 南順子は同紙に、特に多いのが相続だとし、高齢化で親の死去や施設入所によって空き家が発生するケースが増えていること、相続人が多かったり所有者が不明だったりすると解体すら進めにくくなることを挙げている。**同じ談話の中で**、適切に管理されていない「管理不全空家等」は自治体から指導や勧告が入って固定資産税の負担が増える可能性があり、さらに悪化して「特定空家等」に指定されると50万円以下の過料が科されたり解体費用を求められたりすると述べている。**これはいずれも南の説明であって、同紙自身の記述ではない。**\n\n**行政の側の位置づけも出典に書かれている。** 和歌山市の2026年2月の資料は、令和7年度から通報システムの運用と管理不全空家等への指導を始めるとし、同法人を空家等管理活用支援法人の1つとして掲げている。**2015年に県内初の実施機関として報じられたものが、2026年の資料では市の空き家対策の中に置かれている。**\n\n否定的な報道は、今回探した範囲では見つからなかった。**和歌山県で robots.txt が Claude を名指ししていないことを実測できたのは LIVING和歌山・ニュース和歌山・和歌山経済新聞の3社で、他紙は当たっていない。** なお2025年の学会報告は、**第一著者の所属が同法人**であり、共著者の小川宏樹も2015年の記事で同法人の「メンバー」と書かれているため `from_operator: true` として申告し、本数には数えていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"jp-0022","name":"繊維問屋街のまちづくり構想を地区内外の人が作り、町内会・協議会・協同組合が会社をつくった","name_local":"錦二丁目","name_variants":["錦二丁目長者町","錦二丁目・長者町","錦2丁目"],"country":"日本","region":"愛知県","municipality":"名古屋市","population_current":2353515,"population_scale":"25万超","purpose":"住民が決める","theme":"交通・道路・駅","start_year":2011,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"錦二丁目エリアマネジメント株式会社（町内会・まちづくり協議会・地域の企業で構成する協同組合が主体となって設立）","c
