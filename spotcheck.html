8年8月1日現在）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":6,"follow_up":"濃い","follow_up_note":"2019年の第1回は11社、2023年の第2回は18社、2024年の第3回は東京ミッドタウン八重洲の企業を含む20チーム。2025年の第4回は3棟で予選会を開き、10チームが決勝に進んだ。","timeline":[{"year":2013,"event":"街区再編で2つの街区を統合した東京スクエアガーデンが竣工し、1階に東西に抜ける貫通通路が設けられた","source_url":"https://guidetokyo.info/join/report/repo85.html"},{"year":2019,"event":"第1回を6月5日に東京スクエアガーデン1階の貫通通路で開催。両ビルの入居企業11社が参加した","source_url":"https://guidetokyo.info/join/report/repo85.html"},{"year":2024,"event":"第3回を10月17日に開催。東京ミッドタウン八重洲の入居企業を含む全20チームが参加した","source_url":"https://www.kyobashi.tokyo/news/11489.html"},{"year":2025,"event":"第4回は3棟それぞれで予選会を行い、勝ち抜いた10チームが10月30日の決勝を戦った","source_url":"https://www.kyobashi.tokyo/news/11748.html"}],"last_verified":"2026-08-17","sections":{"何をしたか":"東京・中央区京橋のオフィス街で、東京スクエアガーデン（東京建物）と京橋エドグラン（日本土地建物）が共催する、入居企業対抗の綱引き大会。第1回は2019年6月5日、東京スクエアガーデン1階の貫通通路で行われ、両ビルの入居企業11社が参加した。この通路は、街区再編で2つの街区を統合してビルを建てたときに設けられたもので、2013年の竣工時からある。参加できるのは事前に応募した入居企業に限られ、観覧は無料。2023年の第2回は18社、2024年の第3回は東京ミッドタウン八重洲の入居企業を含む20チームに増えた。2025年の第4回は3棟それぞれで予選会を開き、勝ち抜いた10チームが決勝を戦っている。","誰が始めたか":"**開発した2棟の事業者による共催である。** 2019年6月19日の東京街人の記事は、第1回が「東京スクエアガーデン（東京建物株式会社）、京橋エドグラン（日本土地建物株式会社）共催」で行われたと書いている。同記事によれば、主催者挨拶に立った東京建物ビルマネジメント第一部の園部稔雄氏は、**「スポーツイベントを通じて企業同士の交流を深め、街の活性化につなげていきたい」**と述べている。\n\n**社名の表記は出典の年で異なる。** 2019年の東京街人が「日本土地建物株式会社」と書く一方、2024年以降の記事が載る Kyobashi TIMES は運営事務局を「中央日本土地建物グループ」と表示している（同サイトの著作権表示は Chuo-Nittochi Co.,Ltd.）。出典どおり両方を並べておく。\n\nなお、この2媒体はいずれも運営主体の側にある。東京街人の著作権表示は東京建物、Kyobashi TIMES の運営事務局は中央日本土地建物グループである。**運営主体でない出典は、参加企業であるエンワールド・ジャパンが2023年10月20日に出した1本のみ**で、独立した報道機関の記事は5本のうち1本も無い。`self_reported: true` を申告している。","いくらかかったか":"**確認できなかった。** 参照した5本のどこにも、運営費・賞品費・審判の費用・保険といった金額の記載がない。`unknown_fields` に `funding_scale` を挙げている。\n\n出典から読めるのは、負担の向きだけである。2024年9月27日の Kyobashi TIMES は、入場料は無料で、綱引きへの参加は事前に応募した京橋エドグラン・東京スクエアガーデン入居企業に限ると書いている。2019年の東京街人には、1位から3位までに贈られる賞品目録が発表されたとある。**誰がいくら出したかは、どの出典にも書かれていない。**","真似するなら最低何が必要か":"この事例で移せるのは、綱引きという競技ではなく、**会場・母集団・規則の三つをどこから調達したか**である。\n\n**第一に、会場は事業の副産物である。** 東京スクエアガーデン1階の貫通通路は、綱引きのために作られたものではない。街区再編で2つの街区を統合してビルを建てたために、1階に東西に抜ける通路が設けられた。竣工は2013年で、第1回はその6年後にあたる。**つまりこの大会は、開発時に確保された通路が後から見つけられて使われた、という順序で成立している。** 同種のことを仕掛けようとするなら、探すべきは新しい場所ではなく、**竣工時に確保済みで、いま定常的な用途が薄い通路・広場・ガレリア**である。2024年からは京橋エドグランの京橋中央ひろば（ガレリア）も予選会場に加わっている。\n\n**第二に、集客をテナントの名簿に置き換えている。** 参加は事前に応募した入居企業に限られる（2024年9月27日・Kyobashi TIMES）。一般公募ではない。オフィス街の路上イベントで最も重いのは人を集めることだが、ここではその工程が丸ごと**ビル管理者がすでに持っている入居企業との関係**に置き換わっている。開始時点で必要だったのは、11社が乗ることだけである。\n\n**第三に、規模は棟数で決まっている。** 2019年は2棟の共催で11社、2023年は18社、2024年は東京ミッドタウン八重洲の入居企業が加わって20チーム、2025年は3棟それぞれで予選会を開いて決勝に10チームが進んだ。**増えているのは1棟あたりの参加率ではなく、組んだ棟数である。** 別会社が開発した隣の街区のビルと組めるかどうかが、この形の上限を決めている。\n\n**第四に、競技の設計を外部の団体から借りている。** 2024年12月5日の Kyobashi TIMES によれば、第3回は公益社団法人日本綱引連盟の公式ルールに則って行われ、公式審判がルール説明と注意を行っている。1チーム8人、うち2名以上は女性という編成もこの回に記されている。**運営側が自前で規則・審判・安全の基準を作っていない。** 既存の競技団体を使えば、公平性と安全の説明責任をそのまま持ってこられる。\n\n**第五に、費用が出典から一切読めない。** これは事例の欠点ではなく、事業者発信を出典とする事例の性格である。何をやったかは詳しく書かれ、いくらかかったかは書かれない。**実務で見積もりが要る部分は、この種の出典からは取れない**と見ておくのが正しい。\n\n最後に、大会は18時前後から始まり、試合後に表彰式と懇親会が置かれている。2025年11月28日の Kyobashi TIMES は、その懇親会で名刺交換をする様子があり、企業同士の交流の場になったと書いている。**就業後の時間帯に置かれていること、競技のあとに交流の枠が用意されていることは、出典から読める設計である。**","今どうなっているか":"`status_current: 継続中`。**2026年8月時点で確認できた最新は、2025年10月30日に行われた第4回である。** 2025年11月28日の Kyobashi TIMES によれば、この回からルールが変わり、東京スクエアガーデン・東京ミッドタウン八重洲・京橋エドグランのそれぞれのビルで予選会が行われ、勝ち抜いた合計10チームが京橋中央ひろばで決勝トーナメント（「交流戦」）を戦った。優勝は Speedy 31（ルイ・ヴィトンジャパン株式会社）、2位は MAL（エム・エーライフマテリアルズ）、3位は紅忠フェニックス（伊藤忠丸紅鉄鋼株式会社）、4位は Team TBG（TBグローバルテクノロジーズ株式会社）だった。\n\n開始（2019年）から6年後の出典まで届いており、**§4 の必須要件は満たしている。** 開始から3年以上あとの出典は4本あり、うち2024年と2025年の記事は参加範囲が2棟から3棟へ広がったという変化を報じている。`follow_up: 濃い` と判定した。\n\n**ただし出典の性格には注意が要る。** 5本のうち4本は主催者側の媒体（東京建物の東京街人、中央日本土地建物グループの Kyobashi TIMES）であり、独立した報道機関の記事は1本も見つからなかった。運営主体でないのは参加企業エンワールド・ジャパンの2023年のブログ1本である。縮小・中止を伝える記述は、確認した範囲では見当たらなかったが、**それは「続いている」という主催者側の記述しか流通していない、ということでもある。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0002","name":"車を地下に落として出てきた幅13mの歩道を運営に回した","name_local":"新虎通り","country":"日本","region":"東京都","municipality":"港区（新橋〜虎ノ門）","population_current":270509,"population_scale":"25万超","purpose":"歩けるようにする","theme":"交通・道路・駅","start_year":2014,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"一般社団法人新虎通りエリアマネジメント（事務局：森ビル／都市再生機構／東京都道路整備保全公社）","component_types":"hybrid","components":["車の通行を地下トンネルに移した","車道の左右に幅13mの歩道を取った","歩道にオープンカフェを置いた","道路占用許可の特例を使った","都内初のほこみち区域に指定された"],"sources":[{"url":"https://www.nikkei.com/article/DGXMZO76335150Z20C14A8000000/","title":"「オヤジの街」にシャンゼリゼ通りは出現するか","outlet":"日本経済新聞","published":"2014-09-12","language":"ja","from_operator":false},{"url":"https://www.spt.metro.tokyo.lg.jp/tosei/hodohappyo/press/2023/03/16/03.html","title":"歩行者利便増進道路（ほこみち）制度を活用した取組を進めます！ 都内初、環状第2号線（新橋・虎ノ門間）で展開","outlet":"東京都建設局","published":"2023-03-16","language":"ja","from_operator":true},{"url":"https://project.nikkeibp.co.jp/atclppp/PPP/news/032202835/","title":"環状2号線地上部「新虎通り」、都内初の「ほこみち」指定","outlet":"日経BP 新・公民連携最前線","published":"2023-03-22","language":"ja","from_operator":false},{"url":"https://www.homes.co.jp/cont/press/buy/buy_01536/","title":"新虎通りで「新虎ストリートマルシェ」開催。「ほこみち」制度で新たなにぎわいが生まれる","outlet":"LIFULL HOME'S PRESS","published":"2023-07-07","language":"ja","from_operator":false}],"context_sources":[{"url":"https://www.city.minato.tokyo.jp/toukeichousa/kuse/toke/jinko/jinko/2026.html","title":"港区 2026年（令和8年）各月1日現在の人口・世帯数"}],"unknown_fields":["funding_scale"],"latest_source_year":2023,"elapsed_years":9,"follow_up":"濃い","follow_up_note":"2014年3月の開通後、2019年に国家戦略道路占用事業に認定され、2022年に社会実験を経て、2023年3月17日に都内で初めてほこみちの利便増進誘導区域に指定された。同年4月と6月にマルシェが開かれた。","timeline":[{"year":2014,"event":"3月に虎ノ門〜新橋間の約1.4kmが開通。6月の虎ノ門ヒルズ開業に合わせ歩道上にオープンカフェ2店舗が置かれた","source_url":"https://www.nikkei.com/article/DGXMZO76335150Z20C14A8000000/"},{"year":2019,"event":"4月17日に国家戦略特区の国家戦略道路占用事業に認定された","source_url":"https://project.nikkeibp.co.jp/atclppp/PPP/news/032202835/"},{"year":2022,"event":"ほこみち制度の活用に向けた社会実験として、キッチンカーの出店やストリートファニチャーの設置を行った","source_url":"https://project.nikkeibp.co.jp/atclppp/PPP/news/032202835/"},{"year":2023,"event":"3月17日に都内で初めて歩行者利便増進道路（ほこみち）の利便増進誘導区域に指定された","source_url":"https://www.spt.metro.tokyo.lg.jp/tosei/hodohappyo/press/2023/03/16/03.html"}],"last_verified":"2026-08-17","sections":{"何をしたか":"東京都港区の新橋と虎ノ門を結ぶ、延長約1.4kmの地上部道路。環状第2号線の自動車交通を地下の築地虎ノ門トンネルに通したため、地上に必要な車道は2車線で済み、その左右にそれぞれ**幅13mの歩道**が取れた（道路全体の幅は約40m）。2014年3月に開通し、同年6月11日の虎ノ門ヒルズ開業に合わせて、東京都の「東京シャンゼリゼプロジェクト」の第1号として歩道上にオープンカフェ2店舗が置かれた。以後、森ビル・都市再生機構・東京都道路整備保全公社が事務局を務める一般社団法人新虎通りエリアマネジメントが、道路占用許可の特例を使って歩道空間を運営している。2019年4月17日に国家戦略道路占用事業の認定を受け、2023年3月17日には都内で初めて歩行者利便増進道路（ほこみち）の利便増進誘導区域に指定された。","誰が始めたか":"**この事業の前史は半世紀ある。** 日本経済新聞2014年9月12日によれば、環状第2号線の整備は**1946年に都市計画決定**されたが、都心の商業地としての価値が高く、地元にとどまることを希望する地権者が多かったため用地買収や移転の交渉が難航し、**虎ノ門〜新橋間は半世紀近く凍結状態**となっていた。\n\n**先に動いたのは制度である。** 同記事によれば、転機は**1989年**で、道路の上下に建物の建設を認める「立体道路制度」が創設された。この制度を使って、地上に計画していた環状第2号線をトンネル化するよう**1998年に都市計画変更**を行ない、**道路の真上に虎ノ門ヒルズを建てて地権者などを受け入れられるようにしたことで合意形成が進んだ。**\n\n**次に路上を使う側の制度が緩んだ。** 同記事によれば、公共の空間である路上にテーブルや椅子を並べる行為は通常許されず、占用許可は「道路の敷地以外に余地がない」場合に限られていた。**2011年10月に都市再生特別措置法などが改正され**、広告塔・食事施設・購買施設・休憩所・レンタサイクル施設など街のにぎわいに必要な施設に限ってこの条件が緩和された。\n\n**都が制度を使いやすくしたのは2014年3月である。** 同記事によれば、東京都が同月に創設した「東京シャンゼリゼプロジェクト」は、都が管理する道路を対象に道路占用の特例をさらに使いやすくしたもので、**地元の町会や商店街振興組合などで構成するエリアマネジメント団体が都に申請し、路上に設置する施設の管理を担うことを条件に、占用許可の手続きをワンストップにした。** 従来は自治体や警察などとの個別の手続きが必要で、申請から実施までに長い時間を要していたという。同記事は、このプロジェクトが**「都内にパリのシャンゼリゼのような通りをつくりたい」と舛添要一都知事が表明したことで実現した**と書いている。\n\n**地元の団体は同じ2014年3月に立った。** LIFULL HOME'S PRESS 2023年7月7日によれば、新虎通りエリアマネジメントは**2014年3月に発足**し、清掃活動・オープンカフェの誘致・エリアビジョンの作成に取り組んできた。日本経済新聞は、沿道の地権者などが「新虎通りエリアマネジメント協議会」を設立して占用の申請手続きとオープンカフェの管理を手掛けると書いている。\n\n**区は先に別のルールを作っていた。** 同記事によれば、港区は**2012年3月**に地元の町会などと協議して「環状2号線周辺地区まちづくりガイドライン」（対象は約85ヘクタール・6エリア）を定め、さらに**東京都が2003年10月に施行した「東京のしゃれた街並みづくり推進条例」**を使って沿道の約8.4ヘクタールを対象区域に指定した。\n\n**行政の側があとから加わって形が変わっている。** LIFULL HOME'S PRESS によれば、2023年のマルシェの主催は**港区芝地区総合支所と一般社団法人新虎通りエリアマネジメントで組織する「新虎通りエリアプラットフォーム協議会」**である。**つまり順序は、都市計画（1946年）→ 立体道路制度（1989年）→ 都市計画変更（1998年）→ 法改正（2011年）→ 都の制度と地元団体（2014年3月）→ 区の支所が入った協議会（2023年）、である。**","いくらかかったか":"**事業費は確認できなかった。** 4本の出典のいずれにも、道路の整備費、歩道空間の運営費、エリアマネジメント団体の収支が書かれていない。**書けるのは、費用を現金ではなく別のもので払う仕組みになっている**という点である。\n\n- **沿道の建て替えは容積率で誘導している。** 日本経済新聞2014年9月12日によれば、しゃれ街条例にもとづく街並み再生方針は7つの「必須項目」（1階へのにぎわい施設の導入、新虎通りに面した自動車の出入り口の制限、地区内ネットワーク道路沿いの歩道状空地、壁面位置の制限、建物高さの最高限度80m、一定の風俗営業の制限、最低敷地面積250m²）と6つの「選択項目」を定め、**選択項目に多く取り組むほど容積率の割り増しを受けられる。** 最高限度は敷地の規模や接道条件によって750%から1000%の範囲である\n- **運営の側は、人手と管理責任が対価になっている。** 東京シャンゼリゼプロジェクトのワンストップ化は、**エリアマネジメント団体が申請と施設の管理を担うことを条件**にしている\n- **置かれた物は小さい。** 同記事によれば、2014年6月の2か所のオープンカフェはそれぞれテーブルと椅子を5台ほど並べた小規模なもので、同記事はこれを都市再生の起爆剤と位置づけている\n- **周辺では都有地の貸し付けという形が使われている。** 同記事によれば、2004年に廃校となった都立港工業高校の跡地（約5,400m²）について、東京都が2013年に都有地の貸し付けによる医療インフラの整備・運営を行なう事業者を公募し、学校法人慈恵大学が**50年間の定期借地権設定契約**を結んだ。**貸付料は年額約7,500万円である。** これは新虎通りそのものの費用ではないが、同じガイドラインの区域内で使われた資金の形である\n\n`funding_scale` は `unknown_fields` のままとした。**道路の整備費も歩道空間の運営費も出典に無い**ためである。","真似するなら最低何が必要か":"1. **車を落とす先があること。** 自動車の多くが地下の築地虎ノ門トンネルを走るため、地上に必要な車道は2車線で済み、**その結果として車道の左右にそれぞれ幅13mの歩道が取れた**（日本経済新聞2014年9月12日）。**歩道の広さは設計の目標ではなく、交通を地下に移した結果である**\n2. **その構造を可能にする制度。** 1989年に創設された立体道路制度と、1998年の都市計画変更。**道路の真上に建物を建てられるようにしたことが、地権者の合意形成の条件になっている**\n3. **路上に物を置ける法制度の積み重ね。** 2011年10月の都市再生特別措置法などの改正（にぎわい施設に限って占用の条件を緩和）→ 2014年3月の東京シャンゼリゼプロジェクト（都道でワンストップ化）→ 2020年に創設されたほこみち制度（LIFULL HOME'S PRESS 2023年7月7日）。**制度は1つでは足りていない**\n4. **申請と管理を引き受ける地元の団体。** 占用の特例は、団体が申請し、置いた物の管理を担うことを条件にしている。新虎通りでは2014年3月発足の一般社団法人がこれを担い、2023年時点では区の総合支所と組んだ協議会になっている\n5. **沿道の建て替えを揃えるルールを、通りを開ける前に用意すること。** 日本経済新聞によれば、新虎通りは敷地面積100m²未満の中小ビルが多く集まる地域を貫通しており、**それまでビルの裏口だった部分が通りに面している状態**で、沿道の建物の約6割が築30年以上だった。ルールがないまま個別に建て替えが進むと統一感のない景観になる恐れがあったため、区はしゃれ街条例を使っている\n6. **指定の前に社会実験を通すこと。** 日経BP 2023年3月22日によれば、ほこみち指定に向けて2022年に実証実験を行ない、キッチンカーの出店、ベンチなどストリートファニチャーの設置、路面を画布に見立てた花びらのアート「インフィオラータ」、読み聞かせやニュースポーツ体験の「道の楽校」を実施した\n\n**確認できないもの**は、道路の整備費と歩道空間の運営費、エリアマネジメント団体の収支・人員・会費の仕組み、オープンカフェの占用料と賃料、マルシェの費用と来場者数、容積率の割り増しを実際に受けた開発の件数、2023年秋以降のマルシェの開催状況である。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、2023年7月7日の LIFULL HOME'S PRESS の記事である。最新の出典が3年前であり、それ以降の状況は確認できていない。**\n\n**2023年に指定と運用が始まっている。** 東京都建設局の発表によれば、歩行者利便増進道路の指定日は令和4年10月28日、利便増進誘導区域の指定日（予定）は令和5年3月17日で、**占用者（予定）は一般社団法人新虎通りエリアマネジメント**である。日経BP 2023年3月22日は、3月17日に都内で初めて利便増進誘導区域に指定されたと報じている。\n\n**イベントは2023年に2回開かれた。** LIFULL HOME'S PRESS によれば、第1回の「新虎ストリートマルシェ」は4月27〜29日、第2回は6月1・2・4日（11時〜14時、4日のみ16時まで）に開かれた。移動販売車やキッチンカーが並び、コーヒー・オムライス・ハンバーガー・カレー・パスタ・タコライス・かき氷・クレープの店に加え、お香の販売ワゴンや、新虎通りの近くで創業した永谷園の無料サンプル配布車も出た。4日には親子で遊べる場、寄せ植えや文具のワークショップも置かれた。**同記事は、次回は秋ごろに3回目の開催を目指して準備中だと書いている**（2023年7月時点）。\n\n**制度は全国に広がっている。** 同記事によれば、**2023年3月31日時点でほこみちを指定した道路管理者（地方公共団体・地方整備局）は40、指定された路線は109か所**である。2022年11月11日には大阪市で「ほこみちインスパイアフォーラム」が開かれた。\n\n**当事者の見立ても記録しておく。** 同記事は、新虎通りエリアマネジメント事務局の海藤早希子氏が、**今後も近隣の人たちを中心に愛されるイベントにしていきたいと述べた**と伝えている。\n\n**出典の性格について明記しておく。**\n\n- **東京都建設局の1本は、指定を行なった道路管理者自身の発表であり、`from_operator: true` として扱った。** 同発表は本件を「『未来の東京』戦略」を推進する事業と位置づけており、**東京都はこの事業の当事者の側にある**（事務局には東京都道路整備保全公社が入っている）。占用者・主催はいずれも一般社団法人新虎通りエリアマネジメントであって建設局ではないが、**当事者の側の発信として数えないほうを選んだ。** これを除いた独立した一次報道は日経・日経BP・LIFULL HOME'S PRESS の3本である\n- **日本経済新聞の記事は末尾に有料会員の案内が置かれている。** 本文は取得できた範囲で通読しているが、**この媒体は購読制であり、ここに書いたのは取得できた本文に限られる。** 同記事は末尾に「ケンプラッツ2014年8月21日付記事を基に再構成」と記している\n- **日経BP の記事には出典の記述の不整合がある。** 同記事（2023年3月22日）は新虎通りを「**2023年12月に全面開通した**環状2号線のうち」の地上部道路と書いており、**掲載日より後の日付である。** 環状第2号線の全面開通の時期は、この出典からは確定できない\n- **日経・日経BP のドメインは Claude による取得を robots.txt で拒否している。** 本文は以前に取得したものを使っている（再取得はしていない）\n- LIFULL HOME'S PRESS の記事は住宅・建築ライター渡辺圭彦氏の署名記事で、**PR・Sponsored の表示は見当たらない**\n- **この事業についての否定的な報道は、今回探した範囲では見つからなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0003","name":"丘のスタジアムに福祉と農園を混ぜて365日使う場にした","name_local":"里山スタジアム","country":"日本","region":"愛媛県","municipality":"今治市","population_current":151672,"population_scale":"5万〜25万","purpose":"人を呼ぶ","theme":"学校・公共施設","start_year":2014,"end_year":null,"status_current":"継続中","actor_type":"民間（その他）","lead_actor":"株式会社今治.夢スポーツ","component_types":"hard","components":["丘にスタジアムを建てた","カフェと福祉事業所を併設した","ドッグランと農園とビオトープを置いた","雨水を浸透させる緑溝を回した","井戸水と雨水を散水に使った"],"sources":[{"url":"https://xtrend.nikkei.com/atcl/contents/casestudy/00012/01150/","title":"サッカーFC今治の新競技場 「成長する里山スタジアム」って何？","outlet":"日経クロストレンド","published":"2023-03-29","language":"ja","from_operator":false},{"url":"https://xtech.nikkei.com/atcl/nxt/column/18/02717/011500002/","title":"サッカー元日本代表監督の岡田武史氏が語る、グリーンインフラなスタジアム","outlet":"日経クロステック","published":"2024-01-19","language":"ja","from_operator":false},{"url":"https://www.potluck-yaesu.com/magazine/20240329/1956/","title":"サッカースタジアムを「共助のコミュニティ」に。岡田武史が描く地域創生のこれから","outlet":"POTLUCK YAESU","published":"2024-03-29","language":"ja","from_operator":false}],"context_sources":[{"url":"https://www.city.imabari.ehime.jp/simingamannaka/tokei/kokuseichosa/","title":"今治市 国勢調査集計結果（令和2年 151,672人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2024,"elapsed_years":10,"follow_up":"濃い","follow_up_note":"2014年に岡田武史がオーナーに就任し、2023年1月29日に里山スタジアムが開業した。2024年1月時点で、カフェ・福祉事業所・ドッグラン・農園・ビオトープを敷地内に配している。","timeline":[{"year":2014,"event":"岡田武史が FC今治 のオーナーに就任した","source_url":"https://www.potluck-yaesu.com/magazine/20240329/1956/"},{"year":2023,"event":"1月29日に里山スタジアムが開業し、同年度からFC今治の本拠地になった","source_url":"https://xtrend.nikkei.com/atcl/contents/casestudy/00012/01150/"},{"year":2024,"event":"敷地内にカフェと福祉事業所を併設した「里山サロン」、ドッグラン、農園、ビオトープが置かれている","source_url":"https://xtech.nikkei.com/atcl/nxt/column/18/02717/011500002/"}],"last_verified":"2026-08-17","sections":{"何をしたか":"愛媛県今治市の丘に建てられたサッカースタジアムと、その敷地を使ったまちづくり。運営するのは株式会社今治.夢スポーツで、2014年に岡田武史がFC今治のオーナーに就任している。スタジアムは2023年1月29日に開業し、同年度からFC今治の本拠地になった。**開発コンセプトは名前のとおり「里山」**で、日経クロストレンド2023年3月29日の記事は、自然と人が共生し、サポーターや地域の人々の心の豊かさにつながる場所にする、と伝えている。**岡田氏は、地域名を冠したプロサッカーチームは地元の人たちに愛されなければならず、人口減少で町がさびれては元も子もないとしたうえで、「365日、全国、全世界から人が集まり、生き生きと過ごせる『里山ビレッジ』をつくろうと考えた」と述べている**（日経クロステック2024年1月19日）。敷地には、カフェと福祉事業所を併設した「里山サロン」、ドッグラン、子どもや高齢者のデイサービス、農園、ビオトープが置かれている。雨水を地中にゆっくり浸透させる緑溝（バイオスウェル）をスタジアムの周囲に回し、植栽とピッチの散水には井戸水と雨水を使う仕組みを入れている。","誰が始めたか":"**民設民営である。** 土地は今治市が無償で貸し、建設費は運営会社の今治.夢スポーツが用意した。\n\nきっかけは競技の要件だった。日経クロストレンドによれば、それまでの本拠地は観客席5,000席で、J2が求める1万席、J1が求める1万5,000席の基準を満たしておらず、ナイター用の照明も不十分だった。**昇格するには勝つだけでは足りない**という事情から新スタジアムの構想が始まり、着工予定は感染症の流行で一度延期されている。\n\n設計・建設は梓設計、りんかい日産建設、高野ランドスケーププランニングが担い、サポーターや地域の人々とクラブを結ぶコミュニケーションのデザインには松山のデザインスタジオ NINO が加わった。建設を担ったのは今治.夢スポーツの子会社である今治.夢ビレッジである。\n\n**「里山」という言葉は後から出てきたものである。** 同記事によれば、企業理念（次世代のため、物の豊かさより心の豊かさを大切にする社会創りに貢献する）を掲げる同社が、外部識者の助言も入れて開発メンバーで議論を重ねた結果、心の豊かさにつながる言葉として「里山」が出てきたという。","いくらかかったか":"**総額およそ40億円。** その内訳を岡田武史氏が POTLUCK YAESU の取材で明かしている。\n\n- **エクイティ（出資）で15億7,000万円**を同氏が集めた\n- **愛媛銀行などの金融機関から20億円ほどを借り入れた**\n- **土地は今治市から無償で借りている**\n\n同氏は、あまり公金には頼らなかったと述べ、その理由を2つ挙げている。**まだ税金を注ぎ込む事業と認めてもらえなかった**こと、そして**自分たちで尖ったことをやりたかった**ことである。そのうえで自治体とは非常に良い関係でやっているとも述べている。\n\n`funding_scale` は `unknown_fields` のままとした。40億円という総額は出典にあるが、**年間の運営費や収支は確認できていない**ためである。","真似するなら最低何が必要か":"1. **自前で資金を集められること。** 出資15億7,000万円と借入20億円を自ら組んだうえで、土地だけ自治体から無償で借りている。**公金に頼らない代わりに、返済の責任は自分たちが負う**という形である\n2. **造り込まないこと。** 梓設計の永廣正邦氏は、ローコストでもにぎわいを生み、造り込まずに「余白」を生かすという新しい方法を実践しており、周囲に開かれていて誰もが気軽に立ち寄れるようにしたと述べている\n3. **試合以外の日に人が来る理由を敷地に置くこと。** カフェと福祉事業所を併設した「里山サロン」、複合福祉施設「きとなる」、ドッグラン、子どもや高齢者のデイサービス、農園、ビオトープ。**スタジアムの土手には畑がある**\n4. **食べ物を敷地内で回すこと。** 「里山ファーム」で米や野菜を育て、その食材を「里山サロン」で出す\n5. **理念だけでなく数字を追うこと。** 岡田氏は、理念を実現するためには儲けなくてはならず、単体で利益の出ない活動もやるが**全体で黒字にならなければ給与も払えない**と述べている\n6. **雨水をその場で処理する仕組み。** 外構の雨水を地中にゆっくり浸透させる緑溝（バイオスウェル）をスタジアムの周囲に回し、植栽とピッチの散水には井戸水と雨水を使う\n\n**確認できない**のは、年間の運営費と収支、借入の返済計画、福祉事業所やデイサービスの運営主体である。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2024年3月29日の POTLUCK YAESU の取材である。**スタジアムは単なるスポーツ施設ではなく、衣食住を保障し合う「共助のコミュニティ」を目指す**と岡田氏は語り、宿泊施設や美術館の建設も構想していると述べている。\n\n**開業時の数字は出典にある。** 開幕戦の2週間前、満員まで1,300人足りないという報告が出たため、社員1人あたり10枚の手売りを呼びかけたところ、チケットは4日前に完売し、当日は立見席も売って**収容5,316席のところに歴代最多の5,424人**が集まった。競技の成績としては、2023年のJ3リーグで4位だった。\n\n岡田氏は、変化を受け流していた人たちが地域が変わる様子を体感して**自分たちのまちに誇りを持ち始めた**とし、シビックプライドとスポーツチームは相性がよいと述べている。同氏は今治の人口を15万人とし、2023年版の「住みたい田舎ベストランキング」で該当部門の全世代1位になったことにも触れている。\n\n**出典の性格について明記しておく。** 日経クロストレンドと日経クロステックの記事は**途中から有料**であり、ここに書いたのは無料で読める範囲に限られる。POTLUCK YAESU の記事は**岡田氏本人へのインタビュー**であり、事業の説明は当事者の言葉にもとづく。**独立した第三者による検証や、否定的な報道は、今回探した範囲では見つからなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0004","name":"空き家率53%の温泉街を、宿と飲食店に変えながら町民で100年後を決めた","name_local":"温泉津","country":"日本","region":"島根県","municipality":"大田市温泉津町","population_scale":"不明","purpose":"商いを起こす","theme":"空き家・空き店舗・遊休不動産","start_year":2004,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"空き家活用を行なう民間企業と、温泉津100年会議の企画・運営（移住者の近江雅子・西田優花）","component_types":"hybrid","components":["空き家を宿と飲食店に変えた","分散型ホテルの形になった","町民113人で100年後を話した","合言葉「湧くで温泉津」を作った"],"self_reported":true,"spotcheck_note":"出典2本のうち、やまとごころ.jp の記事は `Sponsored` 表示があり、独立した一次報道に数えていない\n（パッチ13）。独立した一次情報は J-STAGE の学会報告1本のみである。\nまた `population_scale` は取得できず「不明」とした。パッチ13 の手順（e-Stat / 島根県統計調査課 /\n国勢調査機関 / 自治体公式）を順に試したが、大田市の公式ドメイン www.city.ohda.lg.jp は\nDNS で解決できず、島根県の該当PDFは404、e-Stat は数値が直接載らないデータセット一覧だった。\nここは人が確認すること。\n","sources":[{"url":"https://www.jstage.jst.go.jp/article/reportscpij/23/4/23_487/_article/-char/ja/","title":"大田市温泉津伝統的建造物群保存地区における近年の地域活性化の実態 — 空き家活用を行なう民間企業を中心として","outlet":"都市計画報告集 23巻4号（日本都市計画学会）","published":"2025-03-14","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://yamatogokoro.jp/report/59452/","title":"世界遺産の温泉地・温泉津で始まった、町民100人が描く100年後の未来。空き家再生がつなぐ暮らしと観光","outlet":"やまとごころ.jp","published":"2026-02-20","language":"ja","from_operator":false,"sponsored":true}],"unknown_fields":["population_scale","funding_scale"],"latest_source_year":2026,"elapsed_years":22,"follow_up":"濃い","follow_up_note":"2004年に国の重要伝統的建造物群保存地区に指定された。2023年に温泉津100人会議が初めて開かれ、2025年12月には113人が参加する温泉津100年会議が開かれた。民間企業による空き家活用の開始年は出典から確認できなかった。","timeline":[{"year":2004,"event":"国の重要伝統的建造物群保存地区に指定された。温泉街としては全国で唯一","source_url":"https://yamatogokoro.jp/report/59452/"},{"year":2023,"event":"「温泉津100人会議」が初めて開かれ、「湧くで温泉津」という合言葉が生まれた","source_url":"https://yamatogokoro.jp/report/59452/"},{"year":2025,"event":"12月、西楽寺で「温泉津100年会議」を開催。小学3年生から年配者まで113人が2日間参加した","source_url":"https://yamatogokoro.jp/report/59452/"}],"last_verified":"2026-08-17","sections":{"何をしたか":"島根県大田市の温泉津町は、湯治場と港町として栄えた集落で、江戸から昭和にかけての建物が並び、**2004年に国の重要伝統的建造物群保存地区に指定されている（温泉街としては全国で唯一）**。一方で空き家率は53%に達し、後継者不足から複数の老舗旅館や商店が廃業の危機にある。ここで進んでいるのが、民間企業による空き家の活用と、町民参加の話し合いの2つである。島根大学の桐岡真歩ほかによる2025年の学会報告は、**その抄録で、民間企業の取り組みを契機に「分散型ホテル」のような宿泊形態が形成されつつあり、地域資源を活用した観光スタイルの多様化が進んでいた**と述べている。話し合いの側では、観光庁の「歴史的資源を活用した観光まちづくり事業」を使い、2023年に「温泉津100人会議」、2025年12月には西楽寺で「温泉津100年会議」が開かれ、小学3年生から年配者まで113人が2日間参加した。","誰が始めたか":"**移住してきた人である。** ただしこの点を伝えているのは `sponsored` 表示のある記事なので、扱いには注意が要る（下記）。\n\nやまとごころ.jp によれば、話し合いの場を設計・運営したのは温泉津に移り住んだ2人である。**近江雅子**は2013年に夫と移住し、空き家の多さと、息子の保育園の同級生が数人しかいない現状に衝撃を受けて取り組みを始めた。1883年（明治16年）築の空き家を改修したゲストハウス「湯るり」を2017年に開き、その後「HISOM」、カフェとランドリーを組み合わせた複合施設「WATOWA」へ広げている。**西田優花**は観光庁や自治体のインバウンド・アウトバウンド事業に携わってきた人で、2022年に移住し、飲食店「本と喫茶のゲンショウシャ」やシェア文庫「本と舍」を立ち上げた。石見神楽の地元の舞子連中にも所属している。\n\n**2人はいずれも温泉津の外から来た人である。** 同記事は、それでも町の人々との対話を重ねて信頼関係を築いてきたと書き、会議の設計にあたっては「町民が主役」であることを何より重視したとしている。\n\n一方、島根大学の桐岡真歩らによる2025年の学会報告は、主体をもう少し広く見ている。**民間企業による空き家の宿泊施設・飲食店への転用**を起点として、外来者への支援と地域住民の理解を経て、まちづくりに携わる人々の関係が構築されたという整理である。","いくらかかったか":"**確認できなかった**（`funding_scale` は `unknown_fields`）。空き家の改修費も、話し合いの場の運営費も、金額としては出典に出てこない。\n\n分かるのは**財源の枠組み**である。やまとごころ.jp によれば、話し合いの場は観光庁の「歴史的資源を活用した観光まちづくり事業」（歴まち事業）を使って開かれている。宿泊施設や飲食店の側は民間企業の事業である。**公費は話し合いに、民間の金は建物に、という分かれ方をしている。**\n\nなお `population_scale` も `不明` のままである。大田市の人口を裏づける公的統計に到達できていないためで、**推測で区分を置いていない。**","真似するなら最低何が必要か":"**話し合いの場の作り方が、出典のなかで最も具体的に書かれている。** そこから取り出す。\n\n1. **最初に共通の感覚を作ること。** 会議の冒頭では町の風景を映したスライド動画を流した。運営側は、見慣れた風景を普段と違う角度から映すことで、議論に入る前に共通の感覚や感情を共有できるようにしたと説明している\n2. **6〜7人の卓に分けること。** 参加者113人を小さな単位に割っている\n3. **発言を否定しないという規則。** 参加者の心の安定を担保するためだと明記されている\n4. **各卓に地域の中心的な担い手を進行役として置くこと**\n5. **「遺したいこと」を先に問うこと。** 挙がったのは温泉津湾の夕焼け、市場の競り、わかめ干しといった自然と生活が結びついた風景と、知らない人や観光客にも挨拶する習慣だった。同記事はこれらを、風景や制度というより**「作法」「空気感」、暮らしのリズムとしての「時間感覚」に近い**ものだと整理している\n6. **建物を持つ主体が別にいること。** 空き家を宿や店に変えているのは民間企業で、話し合いの場とは別の資金で動いている\n\n**確認できない**のは、費用、参加した113人の内訳、そして会議で出た案がその後どう扱われるかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2026年2月20日のやまとごころ.jp の記事である。2025年12月、町の寺・西楽寺で「温泉津100年会議」が開かれ、**小学3年生から年配者まで113人が2日間**参加した。テーマは「100年後も湧き続ける温泉津であるために」。2023年には第1回の「温泉津100人会議」が開かれ、「湧くで温泉津」という合言葉が生まれている。\n\n観光についての意見の傾向も報じられている。**拡大よりも「生活とのバランス」を重視する意見が目立った**という。\n\n学術の側からは、2025年3月の学会報告が、民間企業の取り組みを契機に**「分散型ホテル」のような宿泊形態が形成されつつある**とし、地域資源を活用した観光スタイルの多様化が進んでいると述べた。同報告は同時に**提言**もしている——今後は民間企業、地元住民、移住者、行政という関係者のあいだで**共通の長期的な方針を策定することが重要である**、と。**裏を返せば、その共通の方針はまだ無いということである。**\n\n**出典の性格について明記しておく。** 2026年の記事には `Sponsored` 表示があり、独立した一次報道には数えていない（`sponsored: true`）。この記録で独立した出典は2025年の学会報告1本であり、そのため `self_reported: true` を申告している。**移住者2人の活動と会議の運営について書かれていることは、当事者側の説明にもとづく。**\n\n否定的な報道は、今回探した範囲では見つからなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0005","name":"壊滅した商店街を市が買い上げ、44棟の再開発ビルに建て替えるのに30年近くかけている","name_local":"新長田駅南地区","name_variants":["新長田"],"country":"日本","region":"兵庫県","municipality":"神戸市長田区","population_scale":"25万超","purpose":"住む人を増やす・戻す","theme":"商店街・市場","start_year":1995,"end_year":null,"status_current":"判定不能","actor_type":"行政","lead_actor":"神戸市","component_types":"hard","components":["市が用地をまとめて買い上げた","再開発ビル44棟を建てる計画にした","商業床を3層構造にして分譲した","買収が進まぬ1区画を対象から外した"],"funding_scale":"事業完了時点の収支見込みは赤字326億円。ほかに181億円分の商業床が未売却のまま賃貸されている（2020年の神戸市検証報告書）","sources":[{"url":"https://www.jstage.jst.go.jp/article/aija/68/564/68_KJ00004230657/_article/-char/ja/","title":"商業機能からみた新長田駅南地区・大規模復興再開発事業に関する研究","outlet":"日本建築学会計画系論文集","published":"2003-02-28","language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/aija/71/599/71_KJ00004390435/_article/-char/ja/","title":"震災復興再開発地区における事業実態と入居者の属性・意識 : 新長田駅南地区を事例として","outlet":"日本建築学会計画系論文集","published":"2006-01-30","language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.kobe-np.co.jp/news/sougou/202012/0013958930.shtml","title":"新長田再開発事業「商業にぎわいに課題」 神戸市が検証報告書","outlet":"神戸新聞","published":"2020-12-23","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/news/society/202410/0018219466.shtml","title":"阪神・淡路大震災30年、復興まちづくり全て完了へ 新長田、最後の再開発ビルが10月末で完成","outlet":"神戸新聞","published":"2024-10-12","language":"ja","from_operator":false},{"url":"https://www.kobe-np.co.jp/opinion/202503/0018737155.shtml","title":"＜社説＞復興事業のあと／地域再生を息長く支援したい","outlet":"神戸新聞","published":"2025-03-11","language":"ja","from_operator":false}],"context_sources":[{"url":"https://www.kobe-np.co.jp/news/society/202605/0020386483.shtml","title":"神戸新聞「25年国勢調査速報 兵庫の人口減少率、戦後2番目の高さに 神戸市は150万人割り込む」（神戸市が150万人を割り込んだことのみ確認。正確な数値は有料部分にあり取得していない）"}],"unknown_fields":["population_current","end_year","status_current"],"latest_source_year":2025,"elapsed_years":30,"follow_up":"濃い","follow_up_note":"1995年3月に都市計画決定され、2003年と2006年の論文が商業床の空きと入居者の実態を調べた。2020年12月の神戸市の検証報告書は収支見込みを赤字326億円とし、商業のにぎわいに課題が残るとした。2024年10月の記事は、最後の1棟の完成見通しが立ち、事業が10月末で完了すると伝えている。","timeline":[{"year":1995,"event":"1月17日の震災で壊滅的な被害を受け、3月に都市計画決定された。地震から2か月という短さだった","source_url":"https://www.kobe-np.co.jp/news/sougou/202012/0013958930.shtml"},{"year":2003,"event":"商業機能の面から事業を調べた論文が出た。著者らは「再開発の問題点」を主題の1つに挙げている","source_url":"https://www.jstage.jst.go.jp/article/aija/68/564/68_KJ00004230657/_article/-char/ja/"},{"year":2006,"event":"再開発地区の事業実態と入居者の属性・意識を調べた論文が出た。空き店舗と新住民が主題に挙がっている","source_url":"https://www.jstage.jst.go.jp/article/aija/71/599/71_KJ00004390435/_article/-char/ja/"},{"year":2020,"event":"神戸市の検証報告書が、商業床への入居が権利者の約半数にとどまり、収支見込みは赤字326億円になるとした。3月には買収の進まない1区画を事業対象から外している","source_url":"https://www.kobe-np.co.jp/news/sougou/202012/0013958930.shtml"},{"year":2024,"event":"最後の1棟である教育複合ビルの完成見通しが立ち、10月末で事業が完了すると報じられた。これにより行政主導の被災地の復興まちづくり事業がすべて終わることになったと同記事は書いている","source_url":"https://www.kobe-np.co.jp/news/society/202410/0018219466.shtml"},{"year":2025,"event":"神戸新聞が東日本大震災から14年の社説で、岩手・宮城の被災地の市街地整備を論じるなかで、30年前の神戸・新長田の復興再開発事業に一文だけ言及した","source_url":"https://www.kobe-np.co.jp/opinion/202503/0018737155.shtml"}],"last_verified":"2026-08-17","sections":{"何をしたか":"阪神・淡路大震災で壊滅した神戸市長田区の商店街一帯を、市が用地ごと買い上げて再開発ビルに建て替えた。神戸新聞によれば、新長田駅南地区は**1995年1月17日の震災から2か月後の同年3月に都市計画決定**されている。計画は再開発ビル計44棟。市が土地を買い上げ、商業床を分譲する形をとった。**同紙は2024年10月12日の記事で、この事業が10月末で完了すると伝えている。** 最後の1棟となっていた教育複合ビルの完成見通しが立ったためで、これをもって行政主導の被災地の復興まちづくり事業が、震災発生から30年近くをへて**すべて終わることになった**と書いている。**完了したことを確認した出典には到達できていない。** 区画整理は神戸・芦屋・西宮・尼崎・淡路の計20地区で行われ2011年に完了しており、再開発は6地区のうちここが最後だった。","誰が始めたか":"事業主体は神戸市である。震災から2か月という速さで都市計画が決定されたことは、この事業の性格をよく表している。**住民の側が構想を練って持ち込んだものではなく、行政が短期間で線を引いた事業**であり、その後30年にわたる論点はほぼすべてこの初期条件から派生している。\n\n2020年の検証も市が行っている。兵庫県立大大学院の教授を座長とする検証の場が4回開かれ、報告書がまとめられた。","いくらかかったか":"**事業完了時点の収支見込みは赤字326億円**（2020年12月・神戸市検証報告書）。加えて**181億円分の商業床が未売却のまま賃貸**されており、神戸新聞は赤字幅がさらに広がる可能性があると書いている。\n\n赤字の理由として報告書が挙げているのは2つである。ひとつは、再開発ビルの商業床に入居した権利者が**約半数にとどまった**こと。もうひとつは、商業施設を3層構造にしたために**地下1階と地上2階の処分が進まなかった**ことである。地価の大幅な下落も収益の悪化に働いた。\n\n久元喜造市長は、計画段階との乖離は大規模な震災復興事業では避けられないとし、地価の下落が続きデフレとの戦いだったと述べている（同）。","真似するなら最低何が必要か":"この事例から取り出せるのは、成功の手順ではなく**避けるべき条件**である。\n\n1. **時間の制約を疑うこと。** 震災から2か月で都市計画を決めた速さは、被災者の生活再建には要る。しかし商業床の需要見込みまで同じ速さで固めてよいかは別である\n2. **床を積み上げないこと。** 3層構造にした商業施設の地下1階と地上2階が売れ残った。**人が自然に歩く高さは限られる**という当たり前のことが、30年分の赤字として現れている\n3. **権利者が本当に戻るかを先に確かめること。** 入居したのは権利者の約半数だった。残り半分の床は最初から埋まる当てがないまま作られたことになる\n4. **地価上昇を前提にしないこと。** 床を売って費用を回収する設計は、地価が下がると成立しない\n5. **身の丈に合わせること。** 神戸新聞は2025年3月11日の社説で、東日本大震災の被災地の市街地整備を論じるなかで「30年前、神戸・新長田の復興再開発事業を思い起こす」と書き、求められるのは地域の身の丈に合ったまちづくりだろうと述べている。**この社説の主題は岩手・宮城の被災地であり、新長田への言及はこの一文にとどまる**\n\n**確認できない**のは、44棟それぞれの現在の入居状況と、商業床の最終的な処分結果である。","今どうなっているか":"**2026年8月時点で、この事業の完了を確認した出典には到達できていない。** 新長田の事業そのものを扱った最も新しい記録は2024年10月12日の神戸新聞の記事で、同記事は事業が10月末で**完了する**と、その時点での見通しとして伝えている。完了したかどうかを確かめられないため、`status_current` は `判定不能` とし、`end_year` とあわせて `unknown_fields` に申告した。2025年3月11日の同紙の社説はこれより新しいが、主題は東日本大震災から14年の岩手・宮城の被災地であり、新長田への言及は30年前の事業を引き合いに出す一文にとどまる。\n\n評価は一方向ではない。2020年の市の検証報告書は、被災者の早期の生活再建や災害に強いまちづくりという**事業目的はおおむね達成できた**としたうえで、**商店街としてのにぎわいには課題が残る**と書いている。久元市長は、夜間人口が震災前の約1.4倍に増えたことを挙げ、それを踏まえた新しいコミュニティーづくりを目指す方針を示した。**人は戻り、商いは戻りきらなかった**というのが、出典から読み取れる形である。\n\n学術の側では2003年と2006年に、商業床の空きと入居者の実態を調べた論文が日本建築学会から出ている。**問題は完成前から指摘されていた**ことになる。\n\nなお2024年10月12日の記事は途中から有料である。**有料部分は読んでおらず、ここに書いたのは無料で読める範囲に限られる。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0006","name":"駅前の町有地に、図書館と体育館と住宅を民間と組んで建てた","name_local":"オガール","name_variants":["オガールプロジェクト","オガールタウン"],"country":"日本","region":"岩手県","municipality":"紫波郡紫波町（紫波中央駅前）","population_current":33000,"population_scale":"5万人未満","purpose":"人を呼ぶ","theme":"学校・公共施設","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"紫波町と民間事業者による公民連携。2021年の論文は中心人物として岡崎正信氏に聞き取りをしている","component_types":"hard","components":["駅前の町有地に施設群を建てた","推進組織を先に立ち上げた","スポーツ施設を核に据えた","住宅地を同じ区域に組み込んだ"],"sources":[{"url":"https://www.jstage.jst.go.jp/article/jares/28/3/28_126/_article/-char/ja","title":"最新トレンド紹介「オガールタウンのエコハウス」","outlet":"日本不動産学会誌","published":"2014-12-25","language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/ckg/14/0/14_217/_article/-char/ja","title":"岩手県紫波町オガールプロジェクトの展開過程に関する基礎研究 ー〈スポーツ交流型まちづくり〉の視点からのアプローチー","outlet":"地域活性研究（地域活性学会）","published":2021,"language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.iwate-np.co.jp/article/2025/8/2/185560","title":"美酒美食でにぎわう紫波オガール祭り 焼きさばやクラフトビール、沖縄そばなど18店舗が出店 3日まで","outlet":"岩手日報","published":"2025-08-02","language":"ja","from_operator":false}],"context_sources":[{"url":"https://www.town.shiwa.iwate.jp/soshiki/4_1/2_3/772.html/","title":"紫波町「紫波町ってどんなところ？」（人口約3万3千人）"}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2025,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、記録は2014年から2025年にわたる。2014年には住宅地のエコハウスが専門誌で紹介され、2021年の論文は展開を始動期・形成期・展開期の3期に整理した。2025年8月にも駅前の広場で4日間の祭りが開かれている。","timeline":[{"year":2014,"event":"日本不動産学会誌が、オガールタウンのエコハウスを最新トレンドとして紹介した","source_url":"https://www.jstage.jst.go.jp/article/jares/28/3/28_126/_article/-char/ja"},{"year":2021,"event":"論文が、展開を推進組織を整えた始動期、スポーツ資源とサービス施設を整えた形成期、来訪者を集めるエリアへ発展した展開期の3期に区分した","source_url":"https://www.jstage.jst.go.jp/article/ckg/14/0/14_217/_article/-char/ja"},{"year":2025,"event":"8月、紫波中央駅前のオガール広場で4日間の祭りが開かれ、18店舗が出店した","source_url":"https://www.iwate-np.co.jp/article/2025/8/2/185560"}],"last_verified":"2026-08-17","sections":{"何をしたか":"岩手県紫波町の紫波中央駅前で、町有地に公共施設と民間施設と住宅をまとめて建てた。地域活性研究に載った2021年の論文は、この事業を〈スポーツ交流型まちづくり〉の事例として扱い、展開を3つの時期に区分している。**事業を支える「推進組織」を整えた始動期、「スポーツ資源」と「サービス施設」を整えた形成期、それらを基盤に長期的に「来訪者」を集めるエリアへ発展した展開期**である。同論文は、施設どうしのつながりを高め、スポーツを「する」ことへのニーズへの対応を第一に置きながら「見る」「支える」との相互浸透を図って、持続的に発展してきたと述べている。区域には住宅地も含まれ、2014年には日本不動産学会誌がそこに建つエコハウスを紹介している。","誰が始めたか":"紫波町と民間事業者の公民連携である。2021年の論文は、**中心人物として岡崎正信氏に聞き取りを行った**と明記しており、事業の推進が特定の担い手に結びついていたことが分かる。同論文が3期区分の最初に「推進組織を整えた始動期」を置いていることも、**建物より先に組織を作った**順序を示している。\n\n出典からは、町長・議会・住民の関与の度合いまでは確認できない。","いくらかかったか":"**確認できなかった。** 今回の3本の出典は、事業費にも施設ごとの投資額にも触れていない。`funding_scale` は `unknown_fields` に挙げている。","真似するなら最低何が必要か":"出典から読み取れるのは3つである。\n\n1. **建物より先に推進組織を作ること。** 2021年の論文が3期区分の最初に置いているのは施設ではなく「推進組織」である\n2. **核になる用途を1つ決めること。** 同論文は、スポーツを「する」ニーズへの対応を第一に据えたと書いている。あれもこれもではなく、優先順位が明示されている\n3. **同じ区域に住宅を含めること。** 2014年に専門誌が扱ったのは商業施設ではなく住宅地のエコハウスだった。**来訪者だけでなく住み手を同じ区域に置いている**\n\n**確認できない**のは、事業費、町有地の処分方法、民間事業者の選定手続き、そして開始年そのものである。真似する側が最も知りたい部分は、今回の出典の範囲では埋まらない。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2025年8月2日の岩手日報の記事である。紫波中央駅前のオガール広場で実行委員会主催の祭りが4日間開かれ、18店舗が出店したと伝えている。**施設群が日常的に使われ続けていることは確認できる。**\n\nただし記録の厚みには偏りがある。**2021年の論文以降、事業そのものを検証した出典は今回の探索範囲では見つからなかった。** 2025年の記事は催しの告知であり、事業の評価ではない。また同記事は途中から有料であり、**有料部分は読んでいない。**\n\n否定的な報道も、今回探した範囲では見つからなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0007","name":"建物の高さや色ではなく「美の原則」8つで開発と個別に交渉する条例を作った","name_local":"真鶴町まちづくり条例","name_variants":["美の基準","美の条例"],"country":"日本","region":"神奈川県","municipality":"足柄下郡真鶴町","population_current":6327,"population_scale":"5万人未満","purpose":"誇りをつくる","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"真鶴町","component_types":"soft","components":["抽象的な美の原則を8つ定めた","69の言葉を具体の基準にした","開発ごとに個別に協議した","協議の記録を調書として残した"],"sources":[{"url":"https://www.jstage.jst.go.jp/article/jappm/17/3/17_83/_article/-char/ja","title":"地方の計画 真鶴町まちづくり条例","outlet":"計画行政（日本計画行政学会）","published":"1994-09-15","language":"ja","from_operator":true,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/journalcpij/38.3/0/38.3_199/_article/-char/ja/","title":"個別協議方式による開発コントロールに実態と課題 真鶴町まちづくり条例の美のリクエスト方式を事例として","outlet":"都市計画論文集（日本都市計画学会）","published":"2003-10-25","language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://cir.nii.ac.jp/crid/1520572357918839424","title":"「美の条例」を揺るがすマンション計画--神奈川県真鶴町","outlet":"日経アーキテクチュア（CiNii Research の書誌ページ経由）","published":"2005-06-27","language":"ja","from_operator":false,"abstract_only":true},{"url":"https://www.jstage.jst.go.jp/article/jitrproceedings/39/0/39_264/_article/-char/ja","title":"「美の条例」政策と地域アイデンティティの強化：―真鶴町における日常生活の美の再発見―","outlet":"日本観光研究学会全国大会学術論文集","published":2024,"language":"ja","from_operator":false,"source_type":"academic"}],"context_sources":[{"url":"https://www.town.manazuru.kanagawa.jp/index.html","title":"真鶴町公式サイト（住民基本台帳による人口 6,327人・世帯数3,329）"}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2024,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、記録は1994年から2024年にわたる。2003年の論文は美のリクエスト53件を数え上げ、2005年には日経アーキテクチュアがマンション計画による揺らぎを景観法の特集で扱った。2024年の学会報告は地域アイデンティティの面から評価している。","timeline":[{"year":1994,"event":"真鶴町の都市計画課の担当者が、条例の内容を専門誌に書いた","source_url":"https://www.jstage.jst.go.jp/article/jappm/17/3/17_83/_article/-char/ja"},{"year":2003,"event":"東京大学の研究者が運用実態を分析し、美のリクエストが53件作られ、1件あたり平均約13のキーワードが使われた一方、7つのキーワードは一度も使われていないと報告した","source_url":"https://www.jstage.jst.go.jp/article/journalcpij/38.3/0/38.3_199/_article/-char/ja/"},{"year":2005,"event":"日経アーキテクチュアが「『美の条例』を揺るがすマンション計画」を、景観法をめぐる特集の中で扱った","source_url":"https://cir.nii.ac.jp/crid/1520572357918839424"},{"year":2024,"event":"学会報告が、この政策の地域景観の保全・生活環境の向上・地域アイデンティティの強化への寄与を論じた","source_url":"https://www.jstage.jst.go.jp/article/jitrproceedings/39/0/39_264/_article/-char/ja"}],"last_verified":"2026-08-17","sections":{"何をしたか":"神奈川県真鶴町が、開発を数値だけで縛らず、**抽象的な「美の原則」を掲げて開発ごとに個別に協議する条例**を作った。都市計画論文集に載った2003年の論文によれば、条例は用途・容積率・建物の高さ・植栽面積といった数値の基準（土地利用規制規準）を別に持ちながら、**数値では届かない「美」の実現のために「場所・格づけ・尺度・調和・材料・装飾と芸術・コミュニティ・眺め」の8つの美の原則**を定めている。この8原則には規則によって「美の基準」として**69のキーワード**が割り当てられ、開発の協議は「美の基準リクエスト・美の基準調書」という書式を通じて行われる。つまり**建物を建てたのではなく、建て方を決める手続きを作った**事例である。","誰が始めたか":"真鶴町である。1994年に専門誌『計画行政』へ条例の解説を書いたのは、**真鶴町都市計画課兼まちづくり係の職員**だった。**この出典は町の側が書いたものなので `from_operator: true` を申告している。**\n\n条例そのものの制定年は、今回の4本の出典のいずれにも4桁の西暦として書かれていなかった。**推測で埋めず `start_year` は空欄とし、`unknown_fields` に申告した。**","いくらかかったか":"**確認できなかった。** 条例の運用にかかる人件費や協議の費用は、今回の出典に金額として出てこない。\n\nただしこの事例の費用は建設費ではなく**手間**である。2003年の論文が数えた美のリクエストは53件で、1件あたり最大31・最小4、平均およそ13のキーワードが使われている。**開発1件ごとに13項目前後の協議を積み上げる運用**が、この条例の実際のコストにあたる。","真似するなら最低何が必要か":"1. **抽象的な原則と、それを翻訳する語彙の両方。** 8つの原則だけでは協議にならず、69のキーワードだけでは何のための基準か分からない。**2層になっていることがこの仕組みの要点である**\n2. **数値の基準を別に持つこと。** 用途・容積率・高さ・植栽面積は事前確定の数値で押さえ、数値で届かない部分だけを協議に回している。全部を協議にすると事業者が予見できない\n3. **協議を書式に落とすこと。** 「美の基準リクエスト・美の基準調書」という形が残るので、あとから運用実態を数えられる。**2003年の論文が53件を分析できたのは、この書式があったからである**\n4. **使われない基準が出ることを織り込むこと。** 69のうち7つは一度も使われていない。**基準を作れば使われる、とはならない**\n\n**確認できない**のは、協議に要する職員の体制と時間、事業者側の負担、そして協議が不調に終わった場合の扱いである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2024年12月の日本観光研究学会全国大会での報告である。東洋大学大学院の研究者が、この政策が地域景観の保全、生活環境の向上、地域アイデンティティの強化にどう寄与しているかを、住民の環境満足度・地域への愛着・連帯感の面から分析している。**30年前の条例が、いまも研究の対象として扱われている。**\n\n一方で**揺らいだ時期もある。** 日経アーキテクチュアは2005年6月27日号で「『美の条例』を揺るがすマンション計画」を扱った。掲載号の特集名は「紛争多発、守れ景観！——景観法で動き出すデザインや高さの規制」である。**なおこの出典は CiNii Research の書誌ページから確認したもので、本文は読んでいない**（`abstract_only: true`）。記事の中身がどう書かれていたかはここに書けない。**書誌から確実に言えるのは、条例が揺らいだと専門誌が見なす出来事が2005年にあった、ということだけである。**\n\n2003年の論文は、事前確定的な基準を持たずに個別の協議で最適解を求める方式について、**制度設計上の課題を明らかにすることを目的**としていた。この方式が手放しで評価されてきたわけではない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0008","name":"住民が自分たちで憲章を作り、それが2段階で法律の形になった","name_local":"妻籠宿","name_variants":["妻籠宿を守る住民憲章"],"country":"日本","region":"長野県","municipality":"木曽郡南木曽町","population_current":3545,"population_scale":"5万人未満","purpose":"誇りをつくる","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":1971,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"妻籠宿の住民（住民憲章の制定主体）と南木曽町（条例の制定主体）","component_types":"soft","components":["住民が自主規範として憲章を作った","町が3年後に保存条例にした","国の伝建制度の創設につながった","制定の過程を段階的に踏んだ"],"sources":[{"url":"https://cir.nii.ac.jp/crid/1571698602389331456","title":"旧中山道妻籠宿の民家について : 妻籠宿保存計画基本調査 : 建築史・建築意匠","outlet":"日本建築学会大会学術講演梗概集（CiNii Research の書誌ページ経由）","published":"1968-09-05","language":"ja","from_operator":false,"abstract_only":true},{"url":"https://www.jstage.jst.go.jp/article/journalcpij/51/3/51_328/_article/-char/ja","title":"妻籠宿における住民憲章制定(昭和46年)に至る過程に関する研究","outlet":"都市計画論文集（日本都市計画学会）","published":"2016-10-25","language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/aija/82/740/82_2637/_article/-char/ja","title":"集落・町並み保存地区における自主規範の法制化の過程に関する研究","outlet":"日本建築学会計画系論文集","published":2017,"language":"ja","from_operator":false,"source_type":"academic"}],"context_sources":[{"url":"https://www.town.nagiso.nagano.jp/","title":"南木曽町公式サイト（人口 3,545人・1,610世帯）"}],"unknown_fields":["funding_scale"],"latest_source_year":2017,"elapsed_years":46,"follow_up":"濃い","follow_up_note":"1971年に住民が憲章を作り、1973年に南木曽町が保存条例にした。この動きが1975年の伝統的建造物群保存地区の制度の創設につながり、1976年に妻籠宿は他6地区とともに指定された。2016年の論文は憲章が約半世紀運用されてきたとしている。","timeline":[{"year":1968,"event":"日本建築学会の大会で、妻籠宿保存計画の基礎調査として宿場の民家に関する報告が行われた","source_url":"https://cir.nii.ac.jp/crid/1571698602389331456"},{"year":1971,"event":"明治百年記念事業の完了後、住民が「妻籠宿を守る住民憲章」を制定した。歴史的建造物と周囲の自然環境、住民の生活を内外の脅威から守ることが目的で、当初は法的拘束力を持たなかった","source_url":"https://www.jstage.jst.go.jp/article/aija/82/740/82_2637/_article/-char/ja"},{"year":1973,"event":"南木曽町が妻籠宿の保存条例を可決した（第1の法制化）","source_url":"https://www.jstage.jst.go.jp/article/aija/82/740/82_2637/_article/-char/ja"},{"year":1975,"event":"この先行した動きが、伝統的建造物群保存地区の制度の創設につながった","source_url":"https://www.jstage.jst.go.jp/article/aija/82/740/82_2637/_article/-char/ja"},{"year":1976,"event":"妻籠宿が他の6地区とともに、伝建制度による文化財に指定された（第2の法制化）","source_url":"https://www.jstage.jst.go.jp/article/aija/82/740/82_2637/_article/-char/ja"},{"year":2016,"event":"論文が、約半世紀運用されてきた住民憲章の制定過程を分析し、広域で合意形成できた要因を整理した","source_url":"https://www.jstage.jst.go.jp/article/journalcpij/51/3/51_328/_article/-char/ja"}],"last_verified":"2026-08-17","sections":{"何をしたか":"長野県南木曽町の中山道の宿場・妻籠宿で、**住民が自分たちで規範を作り、それが行政の条例に、さらに国の制度に育った。** 日本建築学会計画系論文集の2017年の論文によれば、1971年、明治百年記念事業の完了を受けて、住民は「妻籠宿を守る住民憲章」を制定した。歴史的建造物と周囲の自然環境、そして住民の生活を、内と外の双方の脅威から守るためである。**この憲章は当初、法的な拘束力を持たなかった。** ところが1973年に南木曽町が妻籠宿の保存条例を可決し（第1の法制化）、この先行した動きが1975年の伝統的建造物群保存地区の制度の創設につながる。1976年、妻籠宿は他の6地区とともに伝建制度による文化財に指定された（第2の法制化）。**住民の自主規範が、5年で国の制度になった。**","誰が始めたか":"**住民である。** 憲章を作ったのは行政ではない。都市計画論文集の2016年の論文は、これを我が国「もっとも初期の住民憲章」と位置づけている。\n\n同論文が注目しているのは、**私有財産や自分の生活・生業のあり方を左右しうる規範が、なぜ広域で合意されえたのか**という点である。挙げられている要因は4つある。慎重かつ段階的なプロセス、外部主体の活用、集落保存の実施より前からの先見性ある対応、そして事業と計画の上での部落間のバランス調整と憲章制定の契機である。\n\n条例にしたのは南木曽町で、指定したのは国である。**3つの主体が5年のうちに順に関わった**のがこの事例の骨格である。","いくらかかったか":"**確認できなかった。** 憲章の制定にも条例の運用にも、今回の出典は金額を書いていない。\n\nただし**この事例の「費用」は金ではない**という読み方はできる。2016年の論文が繰り返し書いているのは合意形成のプロセスであり、支払われたのは主に住民の時間と、私有財産の処分の自由である。","真似するなら最低何が必要か":"2016年の論文が挙げている条件をそのまま並べると4つになる。\n\n1. **慎重かつ段階的なプロセス。** 一度に決めない\n2. **外部主体の活用。** 1968年には日本建築学会の大会で保存計画の基礎調査が報告されている。**憲章より3年早く、外部の専門家が入って調べている**\n3. **集落保存を実施する前からの先見性ある対応。** 事が起きてからでは遅い\n4. **部落間のバランス調整と、憲章を作る契機。** この事例では明治百年記念事業の完了が契機になった\n\n同論文はさらに、**自主規範が持続的に機能するには「明解さ」が重要であり、そのぶん盛り込める範囲には限界がある**と述べている。書ききれない部分は運用の仕組みで補うほかない、という指摘である。\n\n**確認できない**のは、憲章に反対した住民がいたかどうか、そして半世紀のあいだに憲章がどう改定されたかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は**2017年**の論文である。2016年の論文は、住民憲章が制定から「今日まで約半世紀、運用されている」と書いており、**開始から3年以上あとの出典に現在も運用されているという記述があるため `status_current` は `継続中` とした。**\n\nただし**最新の出典が9年前である**ことは明記しておく必要がある。2017年以降に妻籠宿で何が起きたかは、今回の探索範囲では確認できなかった。観光客数の推移も、住民の高齢化の影響も、憲章の改定の有無も分からない。**これは「変化がなかった」ことではなく、「確認できなかった」ことである。**\n\n否定的な報道も、今回探した範囲では見つからなかった。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0009","name":"栗の町の商業地を修景し、30年後に「らしさ」がどこにあるか測られた","name_local":"小布施町","name_variants":["長野県小布施町"],"country":"日本","region":"長野県","municipality":"上高井郡小布施町","population_current":11000,"population_scale":"5万人未満","purpose":"誇りをつくる","theme":"商店街・市場","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"小布施町と地元の民間企業（2012年の論文は「地元の民間企業や行政」が起点だとする）","component_types":"hybrid","components":["商業地の建物の外観を整えた","建物の設計を規制で揃えた","庭を来訪者に開く事業を組んだ","特産品を地域の名前で売った"],"sources":[{"url":"https://www.jstage.jst.go.jp/article/journalcpij/31/0/31_211/_article/-char/ja","title":"町並み景観形成における触媒効果に関する研究","outlet":"都市計画論文集（日本都市計画学会）","published":"1996-10-25","language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/aija/76/670/76_670_2353/_article/-char/ja","title":"長野県小布施町における拠点的景観整備事業を契機とした景観形成の変遷に関する研究","outlet":"日本建築学会計画系論文集","published":"2011-12-30","language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/jasmin/2012f/0/2012f_151/_article/-char/ja","title":"長野県小布施町の地域活性化手法の分析による地域活性化成功モデルの導出","outlet":"経営情報学会全国研究発表大会要旨集","published":2012,"language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/aija/90/834/90_1739/_article/-char/ja","title":"住民と関係人口による「地域らしい」景観の評価構造","outlet":"日本建築学会計画系論文集","published":"2025-08-01","language":"ja","from_operator":false,"source_type":"academic"}],"context_sources":[{"url":"https://www.town.obuse.nagano.jp/ijyu/docs/data.html","title":"小布施町「データで見るおぶせまち」（人口 約11,000人・約4,000世帯・面積19.12km²）"}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2025,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、研究の記録は1996年から2025年にわたる。1996年の論文は町並み整備を導く「触媒」を論じ、2011年には景観の変遷が、2012年には活性化の手法が整理された。2025年の論文は「小布施らしい」景観がどこにあるかを住民と関係人口に測っている。","timeline":[{"year":1996,"event":"論文が小布施・高山・喜多方を比べ、町並み整備を導く「触媒」と、それを働かせる「媒質」の役割を論じた。媒質は小布施と高山にはあり、喜多方にはなかったとした","source_url":"https://www.jstage.jst.go.jp/article/journalcpij/31/0/31_211/_article/-char/ja"},{"year":2011,"event":"論文が拠点的景観整備事業を起点とする景観の変遷を、建物の設計統制・建物用途の変化・オープンガーデン事業の実態から分析した","source_url":"https://www.jstage.jst.go.jp/article/aija/76/670/76_670_2353/_article/-char/ja"},{"year":2012,"event":"論文が、過疎課題を抱えていた町が地域資源の再確認から特産品の地域ブランド化・修景事業・文化事業へ広げた経過を整理した","source_url":"https://www.jstage.jst.go.jp/article/jasmin/2012f/0/2012f_151/_article/-char/ja"},{"year":2025,"event":"論文が、住民と関係人口の双方にとって「小布施らしい」景観は商業地域・規制に適合した建物・農的要素であり、新しい住宅地はそう見なされていないと報告した","source_url":"https://www.jstage.jst.go.jp/article/aija/90/834/90_1739/_article/-char/ja"}],"last_verified":"2026-08-17","sections":{"何をしたか":"長野県小布施町が、商業地の建物の外観を整える修景事業から始めて、町全体の見え方を作り替えた。経営情報学会の2012年の報告によれば、この町は1970年代には過疎の課題を抱えていた。そこから**地元の民間企業と行政が「地域資源の再確認」を起点にして**、特産品を地域の名前で売ること、街並みの修景、歴史資産を活かした文化事業へと取り組みを広げていった。日本建築学会の2011年の論文は、**拠点的景観整備事業**を起点として景観がどう変わっていったかを、建物の設計統制、建物用途の変化、そして**庭を来訪者に開くオープンガーデン事業**の3つから分析している。**修景は建物の外側だけでなく、私有の庭を開くところまで及んでいる。**","誰が始めたか":"2012年の報告は「地元の民間企業や行政」が起点だと書いており、**片方だけではない。** 同報告は推進の手法として、地域住民の巻き込み、外国人や知識人の活用、そして継続的な情報発信によって共感を呼ぶマーケティングの手法を確立したことを挙げている。\n\n**1996年の論文はこの点をもう少し踏み込んで論じている。** 小布施・高山・喜多方の3つの町を比べ、町並み整備を後続へと導く「触媒」がそれぞれの町にあったかを分析したうえで、**触媒が望ましい方向に働くには「媒質（medium ingredients）」が要る**とした。そしてその媒質は小布施と高山にはあったが、喜多方にはなかったと述べている。**同じ手法を持ち込んでも同じ結果にならない**ことが、30年前の時点で指摘されていたことになる。","いくらかかったか":"**確認できなかった。** 今回の出典は4本とも学術の論文・報告で、修景事業の事業費にも補助金にも触れていない。`funding_scale` は `unknown_fields` に挙げている。","真似するなら最低何が必要か":"1996年の論文の言い方を借りれば、必要なのは**触媒と媒質の両方**である。出典から具体化すると4つになる。\n\n1. **最初に手をつける拠点を決めること。** 2011年の論文が扱っているのは「拠点的」景観整備事業である。町全体を一度に整えたのではない\n2. **建物の設計を揃える規制。** 2025年の論文は、住民も関係人口も**「規制に適合した建物」の景観を「小布施らしい」と見なしている**ことを示した。規制が「らしさ」の実体になっている\n3. **私有地を開く仕組み。** オープンガーデン事業がなければ、修景は通り沿いの外観で止まる\n4. **売るものがあること。** 特産品の地域ブランド化が並行している。景観だけでは経済が回らない\n\n**確認できない**のは、事業費、規制に従わなかった建物の扱い、そして住民のうち何割がこの方針に賛同したかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2025年8月1日発行の日本建築学会計画系論文集の論文である。住民と関係人口の双方に対してSD法で「小布施らしい」景観を測った研究で、結果は次の3点である。\n\n- **両群に共通して「小布施らしい」**とされたのは、商業地域の景観、規制に適合した建物の景観、そして農的要素のある景観\n- **「小布施らしくない」**とされたのは、**新しい住宅地の景観**\n- 共有されていた要素は、建物の色と形、そして緑\n\n**修景が届いた範囲と、届いていない範囲が、30年後に住民の認識として測定された**ことになる。事業は続いているが、**新しく建つ住宅地までは「らしさ」が及んでいない**というのが、最新の出典から読み取れる状態である。\n\n否定的な報道は、今回探した範囲では見つからなかった。ただし今回の出典はすべて学術であり、**報道による検証は行っていない。** 小布施の地元紙である信濃毎日新聞は robots.txt が Claude の取得を拒否しているため、今回は当たれていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0010","name":"汚れた川を住民が掃除したことが、町並み保存に火をつけた","name_local":"佐原","name_variants":["香取市佐原","旧佐原市"],"country":"日本","region":"千葉県","municipality":"香取市佐原（小野川沿い）","population_current":66100,"population_scale":"5万〜25万","purpose":"誇りをつくる","theme":"自然・緑地・水辺","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"小野川の清掃を始めた地域住民と市民団体、および香取市（旧佐原市）","component_types":"hybrid","components":["住民が汚れた川を掃除した","町並み保存の運動に広がった","大祭の担い手と別々に動いた","川沿いに観光の店が増えた"],"sources":[{"url":"https://www.jstage.jst.go.jp/article/sogokanko/06/0/06_35/_article/-char/ja/","title":"香取市佐原重要伝統建造物群保存地区来訪者の観光行動の空間特性","outlet":"総合観光研究（総合観光学会）","published":2007,"language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/sociotechnica/6/0/6_0_93/_article/-char/ja","title":"旧佐原市地区におけるまちづくり型観光政策の形成プロセスとその成立要因に関する分析","outlet":"社会技術研究論文集","published":2009,"language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://www.jstage.jst.go.jp/article/aija/81/726/81_1839/_article/-char/ja/","title":"東日本大震災による佐原重要伝統的建造物群保存地区の伝統的建造物の屋根被害調査と分析","outlet":"日本建築学会計画系論文集","published":2016,"language":"ja","from_operator":false,"source_type":"academic"},{"url":"https://cir.nii.ac.jp/crid/1520291855054792832","title":"佐原の歴史的町並みを活かした観光まちづくり : 官民一体のまちづくり","outlet":"新都市（都市計画協会。CiNii Research の書誌ページ経由）","published":"2020-03","language":"ja","from_operator":false,"abstract_only":true},{"url":"https://www.jstage.jst.go.jp/article/jags/18/1/18_15/_article/-char/ja/","title":"千葉県香取市佐原における小野川の景観変化が歴史的町並みと住民意識に与える影響","outlet":"地理空間（地理空間学会）","published":"2025-06-20","language":"ja","from_operator":false,"source_type":"academic"}],"context_sources":[{"url":"https://www.city.katori.lg.jp/government/jinko_tokei/kokusei/kokuseityousasokuhou.html","title":"香取市「令和7年国勢調査結果『速報』について」（人口総数 66,100人・27,374世帯）"}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2025,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、研究の記録は2007年から2025年にわたる。2009年の論文が成立要因を分析し、2016年には震災による屋根被害が調査された。2025年の論文は、住民の意識が景観維持派と観光推進派に分かれたことを報告している。","timeline":[{"year":2007,"event":"論文が来訪者の行動を調べ、多くが東京圏東部からの日帰りで、大きな催しがある日は地区内を歩く範囲が広がる一方、そうでない日は他の観光地へ流れる傾向を示した","source_url":"https://www.jstage.jst.go.jp/article/sogokanko/06/0/06_35/_article/-char/ja/"},{"year":2009,"event":"論文が成立要因を3つに整理した。町並み保存の関係者と佐原の大祭の関係者が別々に動いた結果として生じた意図せざる相乗効果、市民団体が行政を巧みに使ったこと、行政の戦略的な過程の管理である","source_url":"https://www.jstage.jst.go.jp/article/sociotechnica/6/0/6_0_93/_article/-char/ja"},{"year":2016,"event":"論文が、2011年の震災による伝統的建造物の屋根被害を目視で調査し、小野川の上流が硬い地盤、下流が軟らかい地盤であることと被害の分布を結びつけた","source_url":"https://www.jstage.jst.go.jp/article/aija/81/726/81_1839/_article/-char/ja/"},{"year":2020,"event":"都市計画の専門誌が、佐原の歴史的町並みを活かした観光まちづくりを「官民一体のまちづくり」として特集に取り上げた","source_url":"https://cir.nii.ac.jp/crid/1520291855054792832"},{"year":2025,"event":"論文が、住民の意識が景観維持派と観光推進派に分かれた一方、どちらも「佐原らしさ」のある景観の存続にこだわっている点では共通していると報告した","source_url":"https://www.jstage.jst.go.jp/article/jags/18/1/18_15/_article/-char/ja/"}],"last_verified":"2026-08-17","sections":{"何をしたか":"千葉県香取市の佐原で、**汚れた川を住民が掃除したことが、町並み保存の運動に火をつけた。**\n\n地理空間学会の2025年の論文によれば、高度経済成長期に水質汚染が進んだ小野川は、**1990年代に地域住民が主体となった清掃活動によって再生した。** そしてこの活動をきっかけに住民は地域への関心を深め、**それが町並み保存運動を推進する原動力になった。** 川がよみがえると小野川は観光資源として注目されるようになり、川沿いの通りでは新規出店が増え、観光客を主な客とする店の比率が高くなっていった。\n\n**順序が逆でないことがこの事例の要点である。** 町並みを保存するために川を掃除したのではなく、川を掃除したことが町並み保存につながっている。","誰が始めたか":"住民である。ただし社会技術研究論文集の2009年の論文は、成立要因をもう少し複雑に描いている。挙げられているのは3つである。\n\n1. **「町並み保存関係者」と「佐原の大祭関係者」が、それぞれ独自に活動した結果として生じた意図せざる相乗効果**\n2. **市民団体による巧みな行政の活用**\n3. **行政の巧妙な戦略的な過程の管理**\n\nつまり**誰か1人の主体が全体を設計したのではない。** 別々に動いていた2つの集団の活動が、意図せずに噛み合った、というのが同論文の見立てである。","いくらかかったか":"**確認できなかった。** 清掃活動にも町並み保存にも、今回の出典は金額を書いていない。`funding_scale` は `unknown_fields` に挙げている。\n\n清掃活動が住民主体だったことを踏まえると、**初期の費用の多くは金ではなく住民の労力だったと読めるが、これは出典が明記していることではない。**","真似するなら最低何が必要か":"1. **最初に手をつける対象を、目的そのものからずらすこと。** ここでは町並みではなく川だった。**掃除は誰でも参加でき、成果が目に見える**\n2. **別々の集団が同時に動いていること。** 2009年の論文が第一に挙げたのは、町並み保存の側と祭りの側が**独自に**動いた結果の相乗効果である。1つの協議会に統合していたら生じなかった種類の効果である\n3. **市民団体の側に、行政を使う技量があること。** 同論文は「市民団体による巧みな行政の活用」と書いている。行政に任せるのでも対立するのでもない\n4. **行政の側に、過程を管理する戦略があること。** 上と対になっている\n5. **観光が来たあとの分裂を織り込むこと。** 下記のとおり、住民の意識はのちに分かれている\n\n**確認できない**のは、清掃活動が始まった年、参加した住民の数、そして費用である。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2025年6月20日発行の地理空間学会の論文である。**景観を活かした観光が進むにつれて、その是非をめぐって住民の意識は「景観維持派」と「観光推進派」に分かれた。**\n\nただし同論文は、そこで話を終えていない。**どちらの立場も、小野川沿いの商家町を原風景とする「佐原らしさ」のある景観が存続することにこだわっている点では共通している**とし、だからこそ今後もこの個性的な景観は残り続けるだろうと述べている。\n\n途中には災害もあった。2016年の日本建築学会の論文は、2011年の震災で保存地区の伝統的建造物の屋根が受けた被害を目視で調査し、**小野川の上流側が硬い地盤、下流側が軟らかい地盤であること**と被害の分布を結びつけている。町並み保存の対象は、地盤の上に建っている。\n\n来訪者の側の課題も早くから指摘されていた。2007年の論文は、来訪者の多くが東京圏東部からの日帰りであり、**大きな催しがある日は地区内を歩く範囲が広がるが、そうでない日は他の観光地へ流れる傾向**を示している。\n\n否定的な報道は、今回探した範囲では見つからなかった。**ただし今回の出典は5本とも学術と専門誌であり、報道による検証は行っていない。** 千葉県の地方紙には今回当たれていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0011","name":"りんご並木の両側に再開発ビルを建て、上を住宅、下を店舗と福祉にした","name_local":"飯田まちづくりカンパニー","name_variants":["株式会社飯田まちづくりカンパニー","㈱飯田まちづくりカンパニー"],"country":"日本","region":"長野県","municipality":"飯田市","population_current":92847,"population_scale":"5万〜25万","purpose":"住む人を増やす・戻す","theme":"商店街・市場","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"株式会社飯田まちづくりカンパニー（出資者は商業者・企業・市民有志・行政・金融機関・商工会議所）","component_types":"hybrid","components":["中心市街地に再開発ビルを3棟建てた","上層を住宅、下層を店舗と福祉にした","りんご並木沿いの空き店舗を仲介した","高齢者住宅とテナントビルを運営した","市民団体とNPOの立ち上げを支えた"],"sources":[{"url":"https://www.env.go.jp/council/27ondanka-mati/y270-09/mat02.pdf","title":"タウンマネージメント会社 ㈱飯田まちづくりカンパニーの取り組み（第9回地球温暖化対策とまちづくりに関する検討会 資料2・飯田市産業経済部市街地整備推進室 提出）","outlet":"環境省","published":"2006-12-27","language":"ja","from_operator":false},{"url":"https://machi.smrj.go.jp/machi/public/example/100903iida.html","title":"飯田市におけるエリアマネジメントへの取り組みとまちづくり会社の活動","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構）","published":"2010-09-03","language":"ja","from_operator":false},{"url":"https://machi.smrj.go.jp/machi/public/example/181010iida.html","title":"主体的に活動するまちづくりプレーヤーや組織を呼び込む環境作り（長野県飯田市）","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構）","published":"2018-10-10","language":"ja","from_operator":false},{"url":"https://cir.nii.ac.jp/crid/1522825130943139456","title":"まちづくり最前線--TMOは今(4)飯田市:(株)飯田まちづくりカンパニー 市民有志が主体となったTMOが市街地の再開発事業を実施","outlet":"SERI monthly","published":"2000-12","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1521980704957898368","title":"地方都市のサスティナブル・デベロップメント--飯田まちづくりカンパニー","outlet":"造景","published":2002,"language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520010380780795392","title":"TMOによる誘発的連鎖の基幹事業としての再開発--株式会社飯田まちづくりカンパニーの取り組み","outlet":"再開発研究","published":2004,"language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1521417755451480064","title":"紹介 (株)飯田まちづくりカンパニー--まちなか居住とにぎわいづくりを公・民連携の力で呼び戻す","outlet":"国土交通","published":"2006-08","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520573330173846656","title":"都市再生へのマネジメント--(株)飯田まちづくりカンパニーの取り組みを中心に","outlet":"区画整理","published":"2008-10","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520854804737958784","title":"「株式会社」で生まれるまちづくりのスピード--ハードをも手がける会社組織 飯田まちづくりカンパニー","outlet":"Venture link","published":"2009-10","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1050564288816021760","title":"飯田市中心部における再開発の社会特性","outlet":"東洋大学社会学部紀要","published":"2013-03","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1522825129757572864","title":"飯田まちづくりカンパニーによる空店舗活用 : 「並木横丁いこいこ」について","outlet":"新都市","published":"2018-03","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true}],"context_sources":[{"url":"https://www.city.iida.lg.jp/soshiki/5/setaisuu-jinkou.html","title":"飯田市の世帯数と人口（令和8年7月末現在 人口92,847人・世帯数40,558）"}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2018,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、記録は2000年から2018年にわたる。2006年の検討会資料は成果と課題を挙げ、2010年の事例紹介は3つの再開発事業と空き店舗の仲介を、2018年の聞き取りはまちづくり組織の呼び込みを扱っている。","timeline":[{"year":2006,"event":"飯田市が環境省の検討会に提出した資料が、3つの再開発事業と高齢者住宅・テナントビルの運営を並べ、成果として居住人口と交流人口の増加、課題として物販から健康・医療を中心としたサービス業への転換を挙げた","source_url":"https://www.env.go.jp/council/27ondanka-mati/y270-09/mat02.pdf"},{"year":2010,"event":"中小企業基盤整備機構の事例紹介が、橋南第一地区・橋南第二地区・堀端地区の3事業の中身と、りんご並木周辺の空き店舗を民間事業者に仲介する取り組みを整理した","source_url":"https://machi.smrj.go.jp/machi/public/example/100903iida.html"},{"year":2018,"event":"同機構の聞き取りが、まちづくりの担い手や市民団体を呼び込む過程を、同社の代表取締役専務への取材として紹介した","source_url":"https://machi.smrj.go.jp/machi/public/example/181010iida.html"}],"last_verified":"2026-08-19","sections":{"何をしたか":"長野県飯田市の中心市街地「丘の上」で、株式会社飯田まちづくりカンパニーが再開発事業を連ねた。飯田市が環境省の検討会に出した資料によれば、同社は特定会社で、基本計画提出日は平成11年6月25日、基本構想認定年月日は平成11年8月3日である。中小企業基盤整備機構の2010年の事例紹介によれば、橋南第一地区・橋南第二地区・堀端地区の3つの事業を連ねた。このうち橋南第一地区と堀端地区は、下層に店舗と福祉、上層に住宅を置く積み方になっている。同機構は、これをまちなかの居住人口を増やす事業の代表例として全国に紹介されたものだと書いている。**建てるだけでなく、りんご並木周辺の空き店舗を民間事業者に仲介する仕事も同社が担った。**","誰が始めたか":"出資者は**商業者、企業、市民有志、行政、金融機関、商工会議所**である（中小企業基盤整備機構・2010年）。片方だけではない。同機構は会社概要として設立を平成10年8月、資本金を2億1,200万円、専従社員を5名と記している。飯田市が環境省の検討会に出した資料（平成18年）では、職員数は専任4人・非常勤兼務2人と書かれており、**この2つの出典で人数が食い違う。掲載時点が違うため、どちらかが誤りとは書けない。**\n\n同資料は組織図も載せている。飯田市産業経済部の市街地整備推進室と商業観光課、飯田商工会議所の中心市街地活性化委員会、中心商店街連合会、NPO法人いいだ応援ネットイデアが、同社のTMO事務局と並んで置かれている。**会社の中に行政と商工会議所の窓口が組み込まれている形である。**\n\n2000年のSERI monthlyの記事は、この会社を「市民有志が主体となったTMO」として題名に掲げている。**設立の主体をどう見るかは、出典によって重心が違う。**","いくらかかったか":"**再開発事業の事業費は、今回の出典からは確認できなかった。** `funding_scale` は `unknown_fields` に挙げている。\n\n分かるのは会社の規模だけである。中小企業基盤整備機構は資本金を2億1,200万円と書いている。事業年度は、橋南第一地区が平成9年度から平成13年度、橋南第二地区が平成11年から平成18年度、堀端地区が平成16年から平成19年である（同機構・2010年）。**10年以上にわたって事業が重なっている**が、それぞれにいくらかかったかは書かれていない。","真似するなら最低何が必要か":"出典から取り出せるのは5つである。\n\n1. **一棟で終わらせず、通りの両側に続けること。** 中小企業基盤整備機構は、第一地区の再開発に続いて**通りを挟んで反対側**で第二の事業を進め、隣接するりんご並木の資源を生かしながらエリア全体を高める形にしたと書いている。同機構は、事業が単独で行われてエリアとしての再生に至らない地域が多いことを、この記述の前に置いている\n2. **建物の中を用途で積み分けること。** 橋南第一地区は1階がスーパーマーケットほか店舗、2・3階が福祉事務所・子供サロン・市民サロン・歯科医院、4〜10階が住居である。堀端地区は1階が専門店とオフィス、2階が健康・医療・福祉のサービス、3階がケア付き高齢者賃貸住宅、4・5階が権利者住宅と分譲住宅になっている\n3. **建てたあとに空き店舗を仲介する係を置くこと。** りんご並木ストリートマネジメントとして、同社が主体となり空き店舗等を民間事業者とマッチングしている。**再開発だけでは通りは埋まらない**という前提で仕事が組まれている\n4. **行政と商工会議所を組織図の中に入れること。** 前節の組織図がそれにあたる。同機構は、中心市街地の事業はまちづくり会社の資金力や組織力から見て単独では負いきれないリスクがあり、行政による事業計画上の位置づけと支援・連携が重要になると書いている\n5. **担い手を呼び込む係を別に立てること。** 2018年の聞き取りで挙げられている点は、事務局や運営補助という黒子役、人材・組織を呼び込む環境づくり、成功体験の蓄積、組織間の協働の4つである\n\n**確認できない**のは、事業費、権利者との合意形成にかかった年数、そして住宅がどれだけ埋まったかである。戸数として出典に書かれているのは橋南第二地区の都市型分譲住宅29戸だけで、他の棟の戸数も入居率も書かれていない。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2018年10月10日の中小企業基盤整備機構による聞き取りである。同機構は、飯田市ではまちづくりの担い手や市民団体を呼び込み、主体的に関わって成功体験を得た者が新たな取り組みや組織の立ち上げに向かう姿が見られると書いている。**聞き取りに答えているのは同社の代表取締役専務の三石秀樹氏であり、事業を進めた当事者の説明である。**\n\n会社の側が挙げた課題も残っている。飯田市が環境省の検討会に出した資料（平成18年）は、成果として居住人口と交流人口の増加、民間事業の誘発、面的な管理・運営のノウハウの蓄積を挙げる一方、**課題として「物販から健康・医療を中心としたサービス業へ」という方向転換と、点から線・面への拡大**を挙げている。**これは飯田市自身の記述であって、第三者の評価ではない。**\n\nまちの人口そのものは別に動いている。飯田市によれば、令和8年7月末現在の人口は92,847人、世帯数は40,558である。環境省の検討会資料が載せた飯田市の居住人口は平成17年で107,593人、中心市街地の居住人口は同じく平成17年で10,270人だった。**中心市街地の居住人口が現在どうなっているかは、今回の出典からは確認できなかった。**\n\n否定的な報道は、今回探した範囲では見つからなかった。ただし飯田市域の地方紙である信濃毎日新聞と南信州新聞は robots.txt が Claude の取得を拒否しているため、**報道による検証は行えていない。** 今回の出典は公文書・公的機関の事例紹介と、書誌のみを確認した学術記事である。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0012","name":"商店街の住民が建物の規範を自分たちで作り、35年以上、建て方に口を出し続けた","name_local":"川越一番街","name_variants":["川越市一番街","川越一番街商店街"],"country":"日本","region":"埼玉県","municipality":"川越市","population_current":353018,"population_scale":"25万超","purpose":"住民が決める","theme":"商店街・市場","start_year":1987,"end_year":null,"status_current":"継続中","actor_type":"住民組織","lead_actor":"川越町並み委員会（住民による自主的なまちづくりの協議機関）","component_types":"soft","components":["住民が「町づくり規範」を作った","建築行為に委員会が助言・提案した","伝統的建造物群保存地区に指定された","規範を約5年かけて改訂した","市が都市景観推進団体に指定した"],"sources":[{"url":"https://www.jstage.jst.go.jp/article/journalcpij/27/0/27_67/_article/-char/ja","title":"川越一番街における町づくりと町並み委員会","outlet":"都市計画論文集（日本都市計画学会）","published":"1992-10-25","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1573950398965179008","title":"住民主体のまちづくり〜川越における中心市街地活性化","outlet":"都市計画","published":"1999-09-06","language":"ja","from_operator":true,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1523951030347095296","title":"カラーグラビア まちづくり解体新書(9)埼玉県川越市 川越一番街--商業活性化で景観保全 住民主体のまちづくり","outlet":"ガバナンス","published":"2002-02","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1571980075284635008","title":"川越一番街 まち並み保存の課題","outlet":"土木学会誌","published":"2007-06-15","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1390282679191182080","title":"川越一番街における歴史的環境の変容に関する研究","outlet":"都市計画論文集（日本都市計画学会）","published":2009,"language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1521699231107740544","title":"きらきら地域人 埼玉県川越市 川越一番街商店街 信念のある商売と新たな挑戦がまちをつくり、人を呼ぶ","outlet":"観光とまちづくり","published":2016,"language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://www.city.kawagoe.saitama.jp/shisei/toshikei/1010554/1010635/1010636/1010640.html","title":"都市景観推進団体(川越町並み委員会）","outlet":"川越市","published":"2024-11-22","language":"ja","from_operator":false},{"url":"https://www.city.kawagoe.saitama.jp/shisei/toshikei/1010554/1010635/1010636/1016035.html","title":"川越町並み委員会が令和6年度ふるさとづくり大賞 団体表彰（総務大臣表彰）を受賞しました！","outlet":"川越市","published":"2025-01-20","language":"ja","from_operator":false},{"url":"https://www.jstage.jst.go.jp/article/journalcpij/60/1/60_20242408/_article/-char/ja/","title":"歴史的町並み保存地区における老舗商店による観光地化への対応実態に関する研究","outlet":"都市計画論文集（日本都市計画学会）","published":"2025-04-25","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true}],"context_sources":[{"url":"https://www.city.kawagoe.saitama.jp/shisei/tokei/1007912/1007913.html","title":"川越市 人口統計（最新）（令和8年8月1日現在 人口353,018人・世帯数173,525）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":38,"follow_up":"濃い","follow_up_note":"1987年の発足から、記録は2025年まで続く。1992年の論文は委員会の役割と限界を、2009年の論文は歴史的環境の変容を扱い、2025年の論文は観光地化に老舗商店がどう対応したかを類型に分けている。","timeline":[{"year":1992,"event":"論文が、委員会は保存に大きく寄与したが助言を受け入れない所有者もいたとし、開発者が出した計画を確認する現在の役割にとどめず範囲を広げる必要があると述べた","source_url":"https://www.jstage.jst.go.jp/article/journalcpij/27/0/27_67/_article/-char/ja"},{"year":2009,"event":"論文が「川越一番街における歴史的環境の変容」を主題に置いた","source_url":"https://cir.nii.ac.jp/crid/1390282679191182080"},{"year":2024,"event":"川越市が、平成27年3月25日に川越町並み委員会を都市景観条例に基づく都市景観推進団体に指定したことと、平成21年に4自治会および川越一番街商業協同組合から保存団体として承認されたことを掲載した","source_url":"https://www.city.kawagoe.saitama.jp/shisei/toshikei/1010554/1010635/1010636/1010640.html"},{"year":2025,"event":"論文が、観光開発に対する老舗商店の対応を3つの型に分け、観光客向けに転換しない型が経営上は観光客に依存しない形で残っていると報告した","source_url":"https://www.jstage.jst.go.jp/article/journalcpij/60/1/60_20242408/_article/-char/ja/"}],"last_verified":"2026-08-19","sections":{"何をしたか":"埼玉県川越市の一番街で、住民が自分たちの手で建物の建て方の規範を作り、それを運用し続けた。川越市によれば、川越町並み委員会は1987年に発足し、歴史的資産を活かしたまちづくりのルールとなる「町づくり規範」を1988年に策定した。以後この委員会は、**住民による自主的なまちづくりの協議機関として、建築行為等に対する助言・提案を行っている。** 委員会の活動区域は、川越市川越伝統的建造物群保存地区である。**規範を持っているのは行政ではなく住民の側の組織であり、その委員会が持つのは許可ではなく助言・提案である。** 伝建地区がいつ選定されたかは、今回の出典には書かれていない。","誰が始めたか":"川越市は、この委員会を**「住民による自主的なまちづくりの協議機関」**と書いている。市が設けた組織ではない。\n\nその位置づけは、後から制度の側に取り込まれていった。川越市によれば、平成21年に、伝統的建造物群保存地区内にある4自治会（元町1丁目、元町2丁目、幸町、仲町）**および川越一番街商業協同組合から**、伝建地区の町並み保存に取り組む保存団体として承認された。さらに平成27年3月25日、市は同委員会を都市景観条例に基づく**都市景観推進団体**に指定している。\n\n**自治会と商業協同組合の承認を経て、市の条例上の団体になった**という順序が、この2つの記述から読み取れる。**ただし川越市はいずれの記述でも主体を「住民による自主的な」とだけ書いており、商店街が起点だとは書いていない。**\n\n1999年の都市計画の記事も2002年のガバナンスの記事も、題名に「住民主体のまちづくり」を掲げている。**ただし前者は当事者による寄稿である**——著者の所属は川越一番街商業組合街並み委員会であり、`from_operator: true` として申告した。後者は発行者がぎょうせいであるが、**書誌に著者・責任表示が無く、誰が書いたかは確認できていない。**","いくらかかったか":"**費用は、今回の出典からは確認できなかった。** `funding_scale` は `unknown_fields` に挙げている。\n\n今回の出典は、委員会の活動を制度・受賞・研究の側から記述したもので、規範の運用費用にも、個々の建物の修景費用にも触れていない。","真似するなら最低何が必要か":"出典から取り出せるのは4つである。\n\n1. **ルールを住民の側が書くこと。** 川越市は「町づくり規範」を、**歴史的資産を活かしたまちづくりのルール**であり、住民による自主的な協議機関が策定したものだと書いている。委員会が持っているのは許可権限ではなく、**建築行為等に対する助言・提案**である\n2. **助言が通らない場合があることを前提に置くこと。** 1992年の論文は、委員会が保存に大きく寄与した一方で、**助言を受け入れなかった所有者もいた**と述べている。同論文は、開発者が提出した計画を確認するという当時の役割にとどめず、役割を広げる必要があると結んでいる。**この指摘は発足から5年の時点で出ている**\n3. **ルールを書き換える手続きを持つこと。** 川越市によれば、委員会は**約5年間の改訂作業の末、2023年に「町づくり規範」を改訂した**。35年以上前に作った規範をそのまま運用してきたのではない\n4. **行政の制度と接続する口を用意すること。** 保存団体としての承認、都市景観推進団体としての指定、そして伝統的建造物群保存地区という枠が、住民側の組織の外側に重なっている\n\n**確認できない**のは、費用、規範に従わなかった建物が実際にどれだけあったか、そして委員会の構成員がどう選ばれているかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2025年4月25日発行の都市計画論文集の論文である。川越一番街歴史地区を事例に、歴史的地区の保存と観光開発の過程を追い、**観光開発に対する老舗商店の対応を3つの型に分けている。**\n\n- 扱ってきた商品やサービスを大きく転換しなくても、観光客の来訪目的や消費行動に適合できる店\n- 観光客向けに商品やサービスを拡張しやすい店\n- **観光客との接点が少なく、観光客向けへの転換が難しい店**\n\n同論文は、3つ目の型について、**経営上は観光客に依存しないビジネスモデルで生き残りを図っている**とし、その背景には観光客向けの店舗に転換したくない店主の意向もあると述べている。**店の側の応じ方が分かれたことが、38年後に類型として記述されている。** 同論文の抄録は保存と観光開発を並べて記すにとどまり、**観光客が町並みの保存によって来たとは書いていない。**\n\n委員会そのものは続いている。川越市は2025年1月の掲載で、**発足から35年以上経った現在も積極的な活動を続けている**と書き、受賞歴として1999年のグッドデザイン賞、2013年のまちづくり功労者国土交通大臣表彰まちづくり功労賞、2017年の地方自治法施行70周年記念総務大臣表彰、2021年の田村明まちづくり賞を挙げている。同じ掲載で、令和6年度ふるさとづくり大賞の団体表彰（総務大臣表彰）を受賞したことが知らされている（**受賞の年月は出典に書かれていない**）。**ただしこれらはいずれも川越市自身または表彰する側の記述であり、第三者による検証ではない。**\n\n否定的な報道は、今回探した範囲では見つからなかった。批判的な指摘として確認できたのは、1992年の論文が挙げた「助言を受け入れない所有者がいる」という限界と、2007年の土木学会誌が題名に掲げた「まち並み保存の課題」である。**後者は書誌のみを確認しており、本文は読んでいない。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0013","name":"天井川が廃川になって残った高い河床を、削らずに公園にした","name_local":"草津川跡地","name_variants":["草津川跡地公園","旧草津川"],"country":"日本","region":"滋賀県","municipality":"草津市","population_current":141983,"population_scale":"5万〜25万","purpose":"空間をひらく","theme":"自然・緑地・水辺","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"草津市（公園・土木・建築）と草津まちづくり株式会社（公園内商業施設ココリバ）","component_types":"hard","components":["天井川の廃川敷を都市公園にした","堤防に囲まれた地形をそのまま残した","園内に商業施設3棟を誘致した","災害時の避難・物資供給拠点にした","設計から施工まで市民の意見を聞いた"],"sources":[{"url":"https://design-prize.sakura.ne.jp/archives/result/1237","title":"2019年優秀賞 草津川跡地公園（区間5）","outlet":"土木学会デザイン賞（土木学会景観・デザイン委員会）","published":"2019-11-21","language":"ja","from_operator":false},{"url":"https://cir.nii.ac.jp/crid/1570854176811660672","title":"草津川跡地利用における市民と行政の協働 : 公・共・私「対話」","outlet":"龍谷大学大学院法学研究","published":"2003-09","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520009407818023936","title":"土木のチカラ 天井川の面影残す都市公園 : 草津川跡地公園(滋賀県草津市)","outlet":"日経コンストラクション","published":"2017-10-23","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1523106605941239168","title":"市民、事業者、行政が一体となった持続的な公園づくり : 草津川跡地公園","outlet":"公園緑地研究所調査研究報告（日本公園緑地協会公園緑地研究所）","published":2017,"language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1521980704759969152","title":"まちと共に育まれる公園づくり : 草津川跡地公園","outlet":"造景","published":2019,"language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520020165315042432","title":"自治体政策最前線 : 地域からのイノベーション(第18回)滋賀県草津市 草津川跡地プロジェクト : 天井川の廃川跡地を活用しガーデンミュージアムを整備","outlet":"ガバナンス","published":"2024-09","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1521699230917306624","title":"草津川跡地公園からランドスケープ・デザインプロセスを考える","outlet":"公園緑地","published":"2017-09","language":"ja","from_operator":true,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520010380862927744","title":"クサツココリバ〈草津川跡地公園商業施設〉 : 設計 森下修/森下建築総研(デザイン設計監理) 地域計画建築研究所(全体調整)","outlet":"新建築","published":"2018-03","language":"ja","from_operator":true,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520580561492113408","title":"多様な主体が連携した公園づくり(草津川跡地公園)","outlet":"新都市","published":"2023-12","language":"ja","from_operator":true,"source_type":"academic","abstract_only":true}],"context_sources":[{"url":"https://www.city.kusatsu.shiga.jp/shisei/tokei/jinkosuii/suii.html","title":"草津市の人口・世帯数の推移（令和8年7月 人口141,983人・世帯数66,720）"}],"unknown_fields":["start_year","elapsed_years"],"latest_source_year":2024,"elapsed_years":null,"funding_scale":"公園整備事業の工事費等は約193,700万円／5件（土木学会デザイン賞2019の掲載による。区間5のみ）。公園内商業施設ココリバの事業者は草津まちづくり株式会社で、その事業費は書かれていない","follow_up":"濃い","follow_up_note":"開始年は出典から確認できず、記録は2003年から2024年にわたる。2003年の論文は跡地利用をめぐる市民と行政の対話を、2019年の土木学会デザイン賞は選考委員の講評を載せ、2024年のガバナンスは廃川跡地の活用として取り上げている。","timeline":[{"year":2003,"event":"論文が、草津川跡地の利用における市民と行政の協働を「公・共・私『対話』」として主題に置いた","source_url":"https://cir.nii.ac.jp/crid/1570854176811660672"},{"year":2017,"event":"調査研究報告が「市民、事業者、行政が一体となった持続的な公園づくり」を主題に置き、日経コンストラクションが「天井川の面影残す都市公園」として取り上げた","source_url":"https://cir.nii.ac.jp/crid/1523106605941239168"},{"year":2019,"event":"土木学会デザイン賞の優秀賞に選ばれ、選考委員が現地を訪れた記述とともに講評が掲載された","source_url":"https://design-prize.sakura.ne.jp/archives/result/1237"},{"year":2024,"event":"ガバナンスが「天井川の廃川跡地を活用しガーデンミュージアムを整備」として自治体政策の連載で取り上げた","source_url":"https://cir.nii.ac.jp/crid/1520020165315042432"}],"last_verified":"2026-08-19","sections":{"何をしたか":"滋賀県草津市で、廃川になった天井川の河床を、**高いまま公園にした。** 土木学会デザイン賞の掲載によれば、草津川は江戸中期以降に土砂の堆積で河床が上がった天井川で、洪水被害を受けてきたため中流域から琵琶湖にかけての約7kmを新設の河川に切り替える工事が行われ、平成14年に通水した。残った跡地について、**堤防を取り除いて広幅員道路にするのか、公園にするのか**が長年議論され、平成22年に委員会が設置、平成24年度に基本計画が策定されて、7kmを6区間に分け公園緑地として整備することが決まった。**削って平らにする選択肢があったうえで、堤防に囲まれた地形が残された。**","誰が始めたか":"土木学会デザイン賞の掲載は、事業者を**公園・土木・建築は草津市、公園内商業施設（ココリバ）は草津まちづくり株式会社**と記している。設計は公園・土木・建築がパシフィックコンサルタンツ、緑景、E-DESIGN、商業施設が地域計画建築研究所、森下建築総研、アズ、E-DESIGN である。\n\n同じ掲載の「主な関係者」には、意匠統括の忽那裕樹（E-DESIGN）、設計統括の小西弘朗（パシフィックコンサルタンツ）、建築担当の森下修（森下建築総研）、コミュニティデザイン担当の山崎亮（studio-L）、照明デザイン担当の長町志穂（LEM空間工房）に加えて、**事業の構想立案・事業推進として草津市長の橋川渉が挙げられている。**\n\n「主な関係組織」は3つで、役割が分かれている。草津市ガーデニングサークル「グラッシー」は**ワークショップへの参画と設計・施工における協働**の両方、くさねっこ（草津川跡地公園パートナーズ）は**ワークショップへの参画**、滋賀県立湖南農業高等学校は**設計、施工における協働**である。\n\n**跡地の使い方をめぐる議論は、公園ができるより前から研究の対象になっていた。** 2003年の龍谷大学大学院法学研究の記事は、題名に「草津川跡地利用における市民と行政の協働」と「公・共・私『対話』」を掲げている。**ただし書誌のみを確認しており、本文は読んでいない。**","いくらかかったか":"土木学会デザイン賞の掲載によれば、**公園整備事業の工事費等は約193,700万円／5件**である。これは区間5の額であり、7km全体の額ではない。\n\n公園内商業施設ココリバの事業者は草津まちづくり株式会社と記されているが、**その事業費は書かれていない。** 面積は約3.8ha、延長は約0.8kmである。","真似するなら最低何が必要か":"出典から取り出せるのは4つである。\n\n1. **地形を残すか削るかを、先に決着させること。** 前述のとおり、堤防を取り除いて広幅員道路にする案と公園にする案が長年議論された。**この決着が付かないと設計に入れない。** 講評は、周辺よりも一段高く両脇を堤防に囲われた地形そのものが、都会の喧騒から離れられる空間として働いていると述べている\n2. **公園に別の役割を先に持たせること。** 掲載によれば、災害時に機能する安心安全空間とすることが求められ、**発災時の避難や物資供給拠点として機能することが条件として与えられた。** 中央園路は緊急輸送路として設計されている\n3. **収益施設の事業者を分けること。** 公園・土木・建築の事業者は草津市だが、**公園内商業施設の事業者は草津まちづくり株式会社**である。同じ敷地の中で主体が分かれている\n4. **設計と施工の各段階で聞き取ること。** 掲載は、設計から施工の各段階において細やかな意見の聞き取りを行い計画に反映させたと書いている。関係組織として市民サークル・パートナーズ・農業高校が挙げられている\n\n**確認できない**のは、区間5以外の事業費、商業施設の賃料や収支、そして議論が長年続いた期間に何が争点だったかである。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2024年9月のガバナンスの連載記事で、**「天井川の廃川跡地を活用しガーデンミュージアムを整備」**として自治体政策の事例に取り上げられている。**ただし書誌のみを確認しており、本文は読んでいない。**\n\n本文まで読めた最も新しい評価は、2019年11月21日掲載の土木学会デザイン賞の講評である。選考委員の萱場は、9月上旬の日曜日に現地を訪れ、**散歩する人、座って話す子供たち、ボール遊びをする親子、楽器を演奏する学生がいたと書き、「賑やかさの中にダイバーシティを感じる」**と述べている。同委員は、質感の高い護岸や舗装、植栽、ストリートファニチャーといった個々の要素を挙げたうえで、**この地形そのものが大切な役割を果たしているように思う**と続けている。\n\n**これは選考委員が一日の訪問で書いた記述であり、日常の利用状況を継続して測ったものではない。** 来園者数や商業施設の営業状況を示す出典は、今回の範囲では確認できなかった。\n\n**講評はもう1人分あり、そちらは評価が分かれている。** 選考委員の八馬は、この公園には**既視感があるさまざまなデザイン言語が余白を埋めるように詰め込まれている**とし、分かりやすさはあるものの**「高い水準で整っているとは言いがたい」**と書いている。**同じ受賞作の講評の中に、デザインの完成度を認めない記述が併記されている。**\n\nただし同委員は続けて、時間帯によって属性の異なる市民が集い憩い遊んでおり、そのための仕掛けがデザインされ埋め込まれていることで賑わいが生まれていると述べ、市街地を分断していた天井川の廃川というインフラを「環境の器」として捉え、コミュニティデザインのプロセスを経て民主化したことに意義があるとしている。**デザインの水準への評価と、空間の使われ方への評価が、同じ委員の中で分けて書かれている。**\n\nこれ以外に否定的な報道は、今回探した範囲では見つからなかった。滋賀県の地方紙については取得の可否を確認しておらず、**報道による検証は行えていない。** 今回の出典は土木学会の賞の掲載1本と、書誌のみを確認した学術・業界誌8本である。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0014","name":"川と公園を稼げる場所にして、駐車場の売上をまちづくりの原資に回した","name_local":"紀州まちづくり舎","name_variants":["株式会社紀州まちづくり舎","㈱紀州まちづくり舎"],"country":"日本","region":"和歌山県","municipality":"和歌山市","population_current":349208,"population_scale":"25万超","purpose":"商いを起こす","theme":"自然・緑地・水辺","start_year":2014,"end_year":null,"status_current":"継続中","actor_type":"民間（その他）","lead_actor":"株式会社紀州まちづくり舎（代表取締役 吉川誠人）","component_types":"hybrid","components":["川沿いで社会実験のイベントを開いた","公園と地下駐車場を一括で受託した","駐車場の売上を市に納めて残す形にした","公園の倉庫をカフェと貸室にした","川沿いに毎日の夜市を出した"],"sources":[{"url":"https://www.living-web.net/%E6%B0%B4%E8%BE%BA%E3%82%92%E6%AD%A9%E3%81%93%E3%81%86-%E6%9C%AA%E6%9D%A5%E3%81%AB%E3%81%A4%E3%81%AA%E3%81%8C%E3%82%8B%E9%AD%85%E5%8A%9B%E3%82%92%E6%B1%82%E3%82%81%E3%81%A6/","title":"水辺を歩こう 未来につながる魅力を求めて","outlet":"LIVING和歌山","published":"2017-09-20","language":"ja","from_operator":false},{"url":"https://www.nwn.jp/news/200328_honmachi-park/","title":"本町公園リノベーション","outlet":"ニュース和歌山","published":"2020-03-28","language":"ja","from_operator":false},{"url":"https://www.city.wakayama.wakayama.jp/kurashi/douro_kouen_machi/1007741/1017946.html","title":"都市再生推進法人について（和歌山市の指定13団体の一覧）","outlet":"和歌山市","published":"2024-10-02","language":"ja","from_operator":false},{"url":"https://wakayama.keizai.biz/headline/2800/","title":"和歌山の「市堀川夜市」、4月以降も開催を継続 ナイトクルーズも","outlet":"和歌山経済新聞","published":"2025-04-25","language":"ja","from_operator":false}],"context_sources":[{"url":"https://www.city.wakayama.wakayama.jp/shisei/wakayama/1001006/1055677/1055678/1063488/1066951.html","title":"和歌山市 住民基本台帳による人口・世帯数（令和8年2月1日現在 総人口349,208人・世帯数177,203）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":11,"follow_up":"濃い","follow_up_note":"2014年設立から、記録は2025年まで続く。2017年の記事は市堀川の社会実験を、2020年の記事は本町公園と地下駐車場の指定管理と収入の仕組みを、2025年の記事は毎日開いてきた夜市を4月以降も継続すると報じている。","timeline":[{"year":2017,"event":"LIVING和歌山が、和歌山市から業務委託を受けた「わかやま水辺プロジェクト」が市堀川沿いで社会実験のイベント「ワカリバ」を9月30日から11月5日まで開くと報じた。同社は水辺総研とともにその中心にいるとされる。開催されたと書いた出典は今回の4本には無い","source_url":"https://www.living-web.net/%E6%B0%B4%E8%BE%BA%E3%82%92%E6%AD%A9%E3%81%93%E3%81%86-%E6%9C%AA%E6%9D%A5%E3%81%AB%E3%81%A4%E3%81%AA%E3%81%8C%E3%82%8B%E9%AD%85%E5%8A%9B%E3%82%92%E6%B1%82%E3%82%81%E3%81%A6/"},{"year":2020,"event":"同社を中心とする紀州まちづくりグループが本町公園と本町地下駐車場の指定管理者となり、駐車場の売上がグループに入る形に変わった","source_url":"https://www.nwn.jp/news/200328_honmachi-park/"},{"year":2024,"event":"和歌山市が、市内の都市再生推進法人を国内トップの13団体とし、同社の事業を公共空間・水辺空間の利活用とP-PFI事業および指定管理者制度の活用と記載した","source_url":"https://www.city.wakayama.wakayama.jp/kurashi/douro_kouen_machi/1007741/1017946.html"},{"year":2025,"event":"2024年10月1日から3月31日までの予定で毎日開いてきた「市堀川夜市」を、同社と和歌山市が協議して4月以降も試験的に続けることになった","source_url":"https://wakayama.keizai.biz/headline/2800/"}],"last_verified":"2026-08-19","sections":{"何をしたか":"和歌山市の中心市街地で、株式会社紀州まちづくり舎が**川と公園を使えるようにし、そこから出るお金をまちづくりに戻す形を組んだ。** ニュース和歌山によれば、同社は2014年設立で、ぶらくり丁の空き店舗をリノベーションして飲食店・ゲストハウス・ギャラリーを運営してきた。そこから公共空間へ広がり、市堀川沿いでは社会実験のイベントが計画され、本町公園では指定管理を引き受けた。**要点は場所ではなく金の流れの向きである。** 同社を中心とするグループは、本町地下駐車場について**市に基本納入金を払い、売上は自分たちに入る**という形に切り替えた。","誰が始めたか":"代表取締役は吉川誠人である（和歌山市・ニュース和歌山・和歌山経済新聞のいずれも同じ）。**ただし、単独ではない。**\n\nLIVING和歌山の2017年の記事によれば、市堀川の取り組みは**和歌山市から業務委託を受けた「わかやま水辺プロジェクト」**として始まり、同社と、水辺の空間活用をコンサルティングする「水辺総研」が中心となった。同プロジェクトはミズベ会議やワークショップを交えたシンポジウムを開き、そこで出た「きれいな川、自然豊かに」「憩いの場に」「マルシェでにぎわい」といった声からビジョンを作ったとされる。**発注したのは市である。**\n\n本町公園の側も同じで、ニュース和歌山によれば指定管理者になったのは同社単独ではなく、**駐車場管理を手掛ける大揚興業、空き家・古民家の活用や再生支援を行う和みほかでつくる「紀州まちづくりグループ」**である。\n\n和歌山市は令和6年10月2日更新のページで、市内の都市再生推進法人を**国内トップの13団体**とし、同社の事業を「公共空間や水辺空間の利活用を中心としたイベントの企画運営、P－PFI事業及び指定管理者制度の活用」と記している。**同社はその13のうちの1つである。**","いくらかかったか":"**事業費は、今回の出典からは確認できなかった。** `funding_scale` は `unknown_fields` に挙げている。\n\n代わりに分かるのは**お金の入り方が変わったこと**である。ニュース和歌山によれば、市が駐車場の管理を民間委託する際、これまでは**委託料を受託者に払い、売上は市に入る**形だった。本町地下駐車場では、紀州まちづくりグループが**市に基本納入金を支払い、売上は同グループに入る**。売上が一定額を超えると、その一部を市に払う仕組みである。\n\n金額として出典に書かれているのは、市堀川夜市のナイトクルーズの料金（中学生以上1,500円・子ども1,000円）だけである。","真似するなら最低何が必要か":"出典から取り出せるのは5つである。\n\n1. **社会実験を先に置くこと。** LIVING和歌山は、2017年のイベント「ワカリバ」を**社会実験**と位置づけ、河川や水辺空間を民間がどのように活用できるか、地域のにぎわい創出につながるかが検証されると書いている。**いきなり本設にしていない**\n2. **公園と駐車場を組にすること。** ニュース和歌山によれば、和歌山市は中心拠点再生地区にある本町公園と、休止していた本町地下駐車場を**合わせて**民間委託にした。**どちらが収益源かは出典に書かれていないが、**吉川氏は「公園の利用者を増やすことで駐車場収入を上げ、その利益をまたまちづくりに生かしていきたい」と述べている\n3. **売上が事業者側に入る契約にすること。** 前節の基本納入金の形がそれにあたる。**委託料を受け取る形のままでは、利用者を増やす動機が生まれない**\n4. **人を集める定期イベントを別に持っていること。** ニュース和歌山によれば、同社は5年前から毎月第2日曜にぶらくり丁商店街でマルシェ「ポポロハスマーケット」を開き、**平均約8000人、多い月は1万人**を集めている。吉川氏は、その開催日には周辺のコインパークが満車状態になると述べている\n5. **建物を用途で積み替えること。** ニュース和歌山は2020年の記事で、公園東端の倉庫だった建物をリノベーションし、1階にカフェ・バーを設けてペットと入れる部屋も確保する、2階は貸しスペース・貸しオフィス・コワーキングスペースとする、と**これからの計画として**書いている。同記事は末尾で、地下駐車場の再オープンを4月1日、カフェ・バーのオープンと公園リニューアルオープンイベントを26日に予定していると書いている。**いずれも記事の掲載日より後であり、記事の時点では開業前である。2階の用途とペットと入れる部屋が実現したかは、今回の出典からは確認できない**\n\n**確認できない**のは、事業費、基本納入金と売上の実額、そして駐車場収入が実際にどれだけまちづくりに回ったかである。**2020年の記事は始まりを報じたもので、金額の実績は書かれていない。**","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2025年4月25日の和歌山経済新聞である。市堀川沿いの京橋親水公園に飲食屋台が並ぶ「市堀川夜市」について、**2024年10月1日から3月31日までの予定で毎日開催してきたものを、同社と和歌山市が協議して4月以降も試験的に続ける**と報じている。伝統的な木舟「三反帆」を使ったナイトクルーズも運航している。\n\n吉川氏は同記事で、**「まずは『市堀川には夜、屋台が出る』という光景を、地域の日常に根付かせたい」**と述べ、続けて、春になり人通りが増えて立ち寄る人も増えていること、来訪者の半分くらいは県外の人で外国人観光客も毎週のように訪れていることを挙げている。**これは事業者本人の説明であり、来場者数の計測結果ではない。**\n\n**「試験的な開催を継続する」という書き方である点に注意がいる。** 出典は本設になったとは書いていない。当初の予定を延長した段階である。\n\n否定的な報道は、今回探した範囲では見つからなかった。**ただし和歌山県の地方紙のうち、今回robots を確認して取得できたのは LIVING和歌山・ニュース和歌山・和歌山経済新聞の3社で、他は当たっていない。** 学術については、CiNii に同社を扱った書誌が1件も無いことを確認している。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"jp-0015","name":"空きビルを宿にした一級建築士が、そのまま地下駐車場と公園の管理まで引き受けた","name_local":"ワカヤマヤモリ舎","name_variants":["株式会社ワカヤマヤモリ舎","㈱ワカヤマヤモリ舎"],"country":"日本","region":"和歌山県","municipality":"和歌山市","population_current":349208,"population_scale":"25万超","purpose":"商いを起こす","theme":"空き家・空き店舗・遊休不動産","start_year":2014,"end_year":null,"status_current":"継続中","actor_type":"民間（その他）","lead_actor":"株式会社ワカヤマヤモリ舎（代表取締役 宮原崇。一級建築士）","component_types":"hybrid","components":["空きビルの一部を宿に改修した","市民とワークショップで自ら改修した","同じビルに食堂とシェアオフィスを入れた","都市再生推進法人の指定を受けた","公園の地下駐車場の管理を引き受けた"],"sources":[{"url":"https://www.nwn.jp/news/16010904_renov/","title":"リノベーションで市街地再生","outlet":"ニュース和歌山","published":"2016-01-09","language":"ja","from_operator":false},{"url":"https://wakayama.keizai.biz/headline/541/","title":"和歌山にバー付きゲストハウス 若手有志と
