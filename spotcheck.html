lue":"名畑恵は、安心居住・元気経済・共生文化の3つの柱で成り立っていると述べている","source_url":"https://www.reallocal.jp/100331","published":"2022-08-19"}]}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":14,"follow_up":"濃い","follow_up_note":"2011年から2025年まで出典がある。2018年に会社化、2022年に再開発施設と拠点が開き、2024年には2021年から続く都市農業プログラムが報じられている。","timeline":[{"year":2011,"event":"旭硝子財団の助成研究成果報告が、名古屋市中区錦二丁目をケース・スタディに大都市インナーシティ再生の計画・デザイン手法を扱った","source_url":"https://cir.nii.ac.jp/crid/1522825130114289792"},{"year":2018,"event":"サカエ経済新聞が、町内会・まちづくり協議会・地域の企業で構成する協同組合が主体となって会社を立ち上げ、お披露目会が行われたと伝えた","source_url":"https://sakae.keizai.biz/headline/2773/"},{"year":2020,"event":"サカエ経済新聞が、地域・企業・行政・大学などが連携するエリアプラットフォーム「N2／LAB」が7月7日に立ち上がったと伝えた","source_url":"https://sakae.keizai.biz/headline/3069/"},{"year":2022,"event":"サカエ経済新聞が、6月11日に喫茶店「喫茶七番」がオープンしたと伝えた","source_url":"https://sakae.keizai.biz/headline/3414/"},{"year":2023,"event":"再開発コーディネーター協会の機関誌が、錦二丁目7番地区第一種市街地再開発事業を取り上げた","source_url":"https://cir.nii.ac.jp/crid/1520576656672782464"},{"year":2024,"event":"サカエ経済新聞が、都市農業プログラム「ゑびす菜園」の苗植えワークショップが6月1日に行われ、個人・グループ合わせて約10組が参加したと伝えた","source_url":"https://sakae.keizai.biz/headline/3696/"},{"year":2025,"event":"名古屋市の都市再生推進法人の一覧ページ（更新日2025年11月11日）に、錦二丁目エリアマネジメント株式会社が令和3年4月28日指定として載っている","source_url":"https://www.city.nagoya.jp/shisei/keikaku/1009818/1009928/1009940/1009944.html"}],"last_verified":"2026-08-20","sections":{"何をしたか":"名古屋市中区の錦二丁目——かつて日本三大繊維問屋街に数えられた長者町を含む地区——で、**地域や専門家など地区内外の人が集まってまちづくり構想を作り、その後、町内会・まちづくり協議会・地域の企業で構成する協同組合が主体となって、会社を立ち上げた。** サカエ経済新聞によれば、この地区は1990年代から2000年代にかけて空きビルや駐車場が増加し、衰退と空洞化が進んでいた。**2011年の構想には「再開発型による会所と路地の実現」が示されていた。** 2018年に会社が設立され、2022年に再開発施設「オリマチ錦」が完工して、その中に広場と喫茶店・貸しスペースが開いた。","誰が始めたか":"**始めたのは地元の組織であり、会社はその後からできている。**\n\nサカエ経済新聞（2018年）によれば、錦二丁目エリアマネジメントは**町内会、まちづくり協議会、地域の企業で構成する協同組合が主体になり立ち上げた**もので、設立は2018年3月である。社長に就任した名畑恵は、同紙によれば地域に関わり15年目にあたり、**NPO法人まちの縁側育くみ隊のスタッフとして2004年からまちに関する学習会の開催を重ね**、その成果の一つとして、地域や専門家など地区内外の人が集まり「これからの錦二丁目長者町地区まちづくり構想（2011-2030）」を2011年に発行した。**構想の名称は出典によって違う。** 同紙のこの記事は「地区」を含む名で書き、同紙の2022年の記事は「これからの錦二丁目長者町まちづくり構想」と書いている。\n\n**なぜ会社にしたのかは、記事に書かれている。** 同紙は地の文で、**街づくりの財源を生み出すことと地域の各組織の役割を再編していく必要性があるとして会社化を決断した**と書いている。そのうえで同紙は、名畑の発言として、志高い人たちで街づくりを進めてきたがボランタリーでできることには限界があり、活動のための財源を確保することは急務だと述べたこと、まちづくり協議会がこれまで同様まちの主体をつなぎ全体的なビジョンを描き、会社は機動力のある事業部隊としての役割を果たせればと述べたことを伝えている。\n\n**構想が何を掲げていたかは、2つの出典で書かれ方が違う。** サカエ経済新聞（2022年5月）は、地域コミュニティーの形成、公共空間マネジメント、土地と建物のマネジメント、低炭素まちづくりの4つを、エリアマネジメントの柱として挙げている。一方 real local 名古屋（2022年）は、名畑の発言として、構想が安心居住・元気経済・共生文化の三つの柱で成り立っていると伝えている。**同じ構想について並べ方が異なるため、`discrepancies` に並置した。**\n\n**再開発そのものの施行者は別である。** 名古屋市によれば、錦二丁目7番地区市街地再開発事業の施行者は**錦二丁目7番地区市街地再開発組合**であり、権利者数は13人、地区面積は約0.7ヘクタールである。サカエ経済新聞によれば、会社が担うのはこの施設の商業エリアのテナント企画（2022年5月）と店舗部分の管理（2021年4月）である。**会所と路地については、同紙の2021年4月の記事が、商業エリアに同社が運営に関わる会所や路地などを開設する予定だと書いているところまでで、その後の運営者を書いた出典を確認できなかった。**\n\n**学術の側からは、地区が事例として扱われてきた。** 旭硝子財団の助成研究成果報告（2011年）は「大都市インナーシティの再生に向けた建築・都市空間の計画・デザイン手法」を名古屋市中区錦二丁目のケース・スタディを通じて扱っており、木材工業（2012年）は「都市の木質化プロジェクト」の連載の中で名古屋市中区錦二丁目長者町における試みを取り上げている。再開発コーディネーター協会の機関誌（2023年）は、錦二丁目7番地区第一種市街地再開発事業そのものを取り上げている。**いずれも書誌ページしか読めていないため、内容には立ち入らない。**","いくらかかったか":"**事業費の額は、今回の出典のどれにも書かれていない。** 名古屋市の再開発事業のページは、地区面積・敷地面積・建ぺい率・容積率・構造階数・建築面積・延床面積・用途を載せているが、**事業費の欄を持っていない。** 会社の資本金・収支・出資の内訳も、今回の出典からは確認できなかった。\n\n**額が出ているのは、拠点まわりである。**\n\n1. **募集された床の賃料。** サカエ経済新聞（2021年4月）によれば、会社が募集した1・2階のテナントは1区画の面積が9.73坪、1階と2階に各2区画の計4区画で、**賃料は月額22万円からとされていた**\n2. **貸しスペースの利用料。** 同紙（2022年5月）によれば、スペース七番のレンタルキッチンはレンタル料が1時間4,400円、2つの会議室はいずれも1時間3,300円で、利用可能時間は9時から21時（土曜・日曜は18時まで）、最小1時間・最大8時間の利用とされていた\n3. **内装費と設備費の一部をクラウドファンディングで集めていること。** 同紙（2022年5月）は、開業前の時点で5月20日までクラウドファンディングを行っているとし、**集まった資金は内装費や設備費などに充てるという**と書いている。同紙は阿部充朗の言葉として、このまちを盛り上げる1000人の仲間を募ることを目標にしていると伝えている\n4. **喫茶店の売値。** 同紙（2022年6月）によれば、開業時の「大人のお子様ランチ」は1,500円、「プリンアラモード」は1,000円、コーヒーはSサイズのブレンドが400円と450円である\n\n**稼ぎ方についての説明は、会社化の時点で記事に残っている。** サカエ経済新聞（2018年）は地の文で、**財源の中心を、再開発施設の一部の店舗床を所有し運営することに置くとしている。** 同紙は続けて、名畑の発言として、公共空間を活用したマルシェ、エリアセキュリティー、エネルギー事業などを考えていると述べたことを伝えている。","真似するなら最低何が必要か":"出典から取り出せるのは6つである。\n\n1. **構想を先に作り、あとで参照できる形にしておくこと。** real local 名古屋（2022年）は名畑の発言として、**想定外の困難に遭遇したときの羅針盤が最初に作った構想であり、判断の拠り所になったと述べている**ことを伝えている。サカエ経済新聞（2018年）も地の文で、構想ができてからは**歩道拡幅の社会実験をはじめとするたくさんのアクションが起きた**と書いている\n2. **既にあった地域組織を残したまま、事業体を足すこと。** 前節のとおり、会社は町内会・まちづくり協議会・協同組合が主体となって作られており、同紙によれば名畑は、協議会がビジョンを描き、会社が事業部隊の役割を果たす分担を語っている。同紙はまた、名畑が、**このまちは町内会と繊維産業を中心とした協同組合が両輪で暮らしや営みを支えてきたとし、以前からある仕組みを続けていくためにも地域組織の手伝いができればと述べた**ことを伝えている\n3. **床を持つこと。** 前節のとおり、会社は商業エリアのテナント企画と店舗部分の管理を担い（サカエ経済新聞・2021年4月／2022年5月）、財源の中心も、2018年時点では店舗床を所有し運営することに置くとされていた（同・2018年）\n4. **地区の歴史から形を借りること。** サカエ経済新聞（2022年6月）は、運営を担当する木場友希乃の説明として、**江戸時代の名古屋の城下町で街区の中央の空間がコミュニティスペースの役割を果たしていたことになぞらえ、現代版の会所のようなオープンスペースとして喫茶店を開いた**ことを伝えている。同紙によれば、床の升目模様も城下町の「碁盤割」と呼ばれる町割をイメージしている\n5. **小さく続く仕掛けを別に持つこと。** サカエ経済新聞（2024年）によれば、都市農業プログラム「ゑびす菜園」は会社が企画して2021年から取り組むもので、参加するのは地区の住民と飲食店・商店のオーナーや従業員、その家族などである。バケツを鉢に使い、ビルの屋上やベランダ、住宅や飲食店の軒先といった「まちのスキマ」で作物を育てる方式で、同紙は2024年6月1日のワークショップに個人・グループ合わせて約10組が参加したと書いている。同紙（2021年）は、プログラム第1弾の収穫について、ワークショップ開催時は40〜50キロの収穫を想定していたが**最終的な収穫量は14キロ程度になった**と書いており、担当の阿部充朗の説明として、バケツが置かれた場所の日照量や日々の水やりの量・頻度の差が影響したと考えられると伝えている\n6. **地区の外の相手と組む場を、別に用意すること。** サカエ経済新聞（2020年）によれば、地区を舞台に新しい技術やアイデアを実証・実装するエリアプラットフォーム「N2／LAB」が7月7日に立ち上がり、**事務局は錦二丁目エリアマネジメントのほか NPO 法人など全4者**である。同紙は、名古屋市などの行政、地縁組織、NPO法人、企業や個人事業主、大学などが関わると書いている\n\n**確認できない**のは、事業費と会社の収支、再開発前後で地区の事業所や居住者がどう変わったかを示す数値、および会所と路地の利用実態を第三者が測った記録である。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、名古屋市のページである。** 名古屋市は、都市再生特別措置法第118条第1項の規定により**錦二丁目エリアマネジメント株式会社を令和3年4月28日に都市再生推進法人に指定した**と掲載しており、このページの更新日は2025年11月11日である。同市の再開発事業のページ（更新日2025年10月17日）は、錦二丁目7番地区市街地再開発事業の進捗を**平成25年3月の準備組合設立から、平成29年2月の都市計画決定、平成29年11月の組合設立認可・事業計画認可、平成31年3月の建築工事着手、令和4年3月の工事完了公告まで**の段階で示している。**いずれも和暦のまま写した。**\n\n**報道でいちばん新しいのは2024年である。** サカエ経済新聞（2024年6月6日）は、6月1日に常瑞寺でサツマイモの苗植えワークショップが行われ、個人・グループ合わせて約10組が参加したと伝えている。同紙は阿部充朗の発言として、**毎回参加する人たちもいれば今年初めて参加する人もいて、継続によって少しずつ取り組みが広がってきていると感じると述べた**ことを伝えている。同紙によれば、栽培・収穫したサツマイモは芋焼酎の原料となり、九州の蔵元での仕込みを経て芋焼酎になって戻ってくる。\n\n**拠点は2022年に開いている。** サカエ経済新聞（2022年6月11日）は、喫茶店「喫茶七番」が6月11日にオープンしたと伝えており、同店が位置するのは3月に竣工した商住複合施設「オリマチ錦」の商業エリアで、四方の路地からつながる小さな広場に店の入り口があると書いている。同紙によれば、広場に面する円形カウンターの天板には、以前にこの地区にあったビル内の施設の壁面に描かれていたフレスコ画が再利用されている。\n\n**示された時期は、出典ごとにずれている。指している節目も揃っていない。** 2018年の記事は2021年にオープン予定と書き、2020年の記事は2022年春完工予定と書き、2021年4月の記事は施設完成が2022年3月・店舗区画完成が2022年6月の予定と書き、名古屋市は令和4年3月の工事完了公告を記録している。**`discrepancies` に並置した。**\n\n**否定的な報道は、今回探した範囲では見つからなかった。** サカエ経済新聞は地区の空洞化と、それにともなって一時は治安も悪化したという会社担当者の説明を書いているが、これは事業の前の状態についての記述である。**中日新聞は robots.txt が claudebot を拒否しており（reference/media.json・2026-08-18 実測）、報道による検証はサカエ経済新聞と real local 名古屋の範囲にとどまる。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"jp-0023","name":"商店街が共同で会社をつくり、駐車券の差益を活性化の原資にあてる形にした","name_local":"新潟古町まちづくり","name_variants":["新潟古町まちづくり株式会社","新潟古町まちづくり会社"],"country":"日本","region":"新潟県","municipality":"新潟市","population_current":754152,"population_scale":"25万超","purpose":"お金を地域で回す","theme":"商店街・市場","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"新潟古町まちづくり株式会社（7つの商店街振興組合が出資）と新潟中心商店街協同組合の両輪体制","component_types":"soft","components":["商店街が共同出資で会社をつくった","無料駐車券を磁気カードで一元化した","差益を活動の原資にあてる形にした","商店街共通の免税カウンターを作った","まちの案内アプリを会費制で運営した","市の計画が空き店舗の窓口に指名した"],"sources":[{"url":"https://machi.smrj.go.jp/machi/public/example/180606niigata_furumachi.html","title":"新潟古町まちづくり株式会社が展開する三方良しのソーシャルビジネスとは（新潟市）［1/4］","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構内）","published":"2018-06-06","language":"ja","from_operator":false},{"url":"https://machi.smrj.go.jp/machi/public/example/180606niigata_furumachi01.html","title":"新潟古町まちづくり株式会社が展開する三方良しのソーシャルビジネスとは［2/4 無料駐車券事業について］","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構内）","published":"2018-06-06","language":"ja","from_operator":false},{"url":"https://machi.smrj.go.jp/machi/public/example/180606niigata_furumachi02.html","title":"新潟古町まちづくり株式会社が展開する三方良しのソーシャルビジネスとは［3/4 アプリケーション事業について］","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構内）","published":"2018-06-06","language":"ja","from_operator":false},{"url":"https://machi.smrj.go.jp/machi/public/example/180606niigata_furumachi03.html","title":"新潟古町まちづくり株式会社が展開する三方良しのソーシャルビジネスとは［4/4 インバウンド事業について］","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構内）","published":"2018-06-06","language":"ja","from_operator":false},{"url":"https://www.pref.niigata.lg.jp/sec/chiikishinko/1356780461098.html","title":"タウンマネジメントの取組事例を紹介します！","outlet":"新潟県","published":"2021-04-01","language":"ja","from_operator":false,"source_type":"official"},{"url":"https://www.city.niigata.lg.jp/business/shoko/shokoshien/shien/shogyo2023.files/keikaku.pdf","title":"新潟市古町地区 商店街活性化促進事業計画","outlet":"新潟市","published":"2022-03","language":"ja","from_operator":false,"source_type":"official"}],"context_sources":[{"url":"https://www.city.niigata.lg.jp/shisei/gaiyo/profile/00_01jinkou/suikeijinkou.html","title":"推計人口（新潟市）"}],"discrepancies":[{"field":"新潟中心商店街協同組合を立ち上げた主体","values":[{"value":"商店街や大型店の合意形成の場として新潟中心商店街協議会を設立し、その話し合いの中から法人化したとする","source_url":"https://machi.smrj.go.jp/machi/public/example/180606niigata_furumachi.html","published":"2018-06-06"},{"value":"立ち上げの中心にいたのは、地区の7つの商店街振興組合と、隣り合う大型商業施設だとする","source_url":"https://www.pref.niigata.lg.jp/sec/chiikishinko/1356780461098.html","published":"2021-04-01"}]}],"unknown_fields":["start_year","elapsed_years","funding_scale"],"latest_source_year":2022,"elapsed_years":null,"follow_up":"薄い","follow_up_note":"開始年は和暦でしか書かれておらず西暦に変換していないため null にした。出典は2018年6月から2022年3月にわたる。最も古い2018年の記事から3年以上あとにあたるのは2022年の新潟市の計画1本だけなので、薄いとした。","timeline":[{"year":2018,"event":"中心市街地活性化協議会支援センターの事例紹介が、無料駐車券・アプリ・インバウンドの3つの事業の仕組みを、同社事業部長への取材として紹介した","source_url":"https://machi.smrj.go.jp/machi/public/example/180606niigata_furumachi.html"},{"year":2021,"event":"新潟県が、県内でタウンマネジメントに取り組んでいる事例として新潟市・古町地区を挙げ、ビジョンと中長期事業計画の作り方を紹介した","source_url":"https://www.pref.niigata.lg.jp/sec/chiikishinko/1356780461098.html"},{"year":2022,"event":"新潟市が商店街活性化促進事業計画を作り、空き店舗のあっせんの窓口を新潟古町まちづくり株式会社が担うと書いた","source_url":"https://www.city.niigata.lg.jp/business/shoko/shokoshien/shien/shogyo2023.files/keikaku.pdf"}],"last_verified":"2026-08-20","sections":{"何をしたか":"新潟市の中心市街地・古町で、**地元の商店街の側が協同組合と株式会社という2つの器を作り、活性化の活動原資を自前の事業で稼ぐ形にした**（協同組合を立ち上げた主体は出典で書き方が割れる。`discrepancies` に並置した）。 中心市街地活性化協議会支援センター（中小企業基盤整備機構内）は、県庁などまちなかの機能が郊外へ移ったこと、新幹線と高速道路が通って東京への集中が進んだこと、リーマンショックのあとに百貨店が閉じたことなどが重なり、まちが衰えたと書いている。**平成24年6月に新潟中心商店街協同組合ができ、同年10月に7つの商店街振興組合が出資して新潟古町まちづくり株式会社が設立された。** 2018年の記事の時点で、会社は無料駐車券・案内アプリ・免税カウンターを運営している（新潟県は2021年の更新のページで、主な事業として駐車券とまちなかバス乗車券を挙げている）。**同センターは、このうち免税カウンターは収益事業ではないと書いている。**","誰が始めたか":"**始めたのは民間の側であり、行政が枠組みとして加わるのはあとである**（ただし資金面では、市の補助金とインバウンド促進事業の補助金が使われている。出典はその時期を書いていない）。\n\n同センターは、リーマンショックが新潟古町地域商店街に危機意識をもたらしたとし、**商店街と大型店が合意を作る場として新潟中心商店街協議会ができた**と書いている。同センターによれば、その協議会での話し合いから法人化が要ると判断され、**平成24年6月に新潟中心商店街協同組合が設立された。** 同センターは、協議会が商店街振興組合の単位で構成されていたのに対し、協同組合は個別店舗が任意で加入する形式だとし、**各商店街振興組合の理事長が協同組合の役員も務める形にすることで、商店街と個店への影響力を保っていると書いている。**\n\n**会社はその後に作られている。** 同センターによれば、会社は活動の原資を得るためのソーシャルビジネスを担う器であり、**出資したのは7つの商店街振興組合、設立は平成24年10月である。** 新潟県も、地区の課題をビジネスの手法で解くための組織として同社ができたとし、協同組合と2つで古町の活性化とにぎわいづくりを進めていると書いている。\n\n**協同組合（平成24年6月）を立ち上げた主体は、2つの出典で書き方が違う。** 同センターは協議会からの法人化として書き、新潟県は、7つの商店街振興組合に加えて隣の大型商業施設も中心にいたと書いている。**`discrepancies` に並置した。**\n\n**2018年の記事の中身は、当事者への取材にもとづく。** 同センターは、取材に応じた佐藤雅義について、会社の事業部長と協同組合のエリアマネージャーを兼ねる立場にあり、両方の実務を預かる人だと書いている。そのうえで、**佐藤からまちづくり会社の収益事業を中心に聞いたと明記している。**\n\n**行政の枠組みは平成29年度以降である。** 新潟市によれば、平成29年度に、会社・新潟商工会議所・同市の三者で「古町活性化まちづくり協議会」がつくられ、そこで古町地区活性化まちづくり調査報告書がまとめられた。同市は、会社が**都市再生推進法人の認定を受けたのも令和元年度だ**とも書いている。","いくらかかったか":"**会社の資本金・売上・事業費は、今回の出典のどれにも書かれていない。** 出典に額として出てくるのは、行政の補助制度の枠と、事業の値づけの構造だけである。\n\n**補助の枠は新潟市の計画にある。** 同市によれば、古町地区空き店舗活用事業は補助率2分の1・上限5,000千円（改装費4,000千円、賃借料1年分1,000千円）、古町地区魅力創造・発信事業は魅力創出事業が補助率3分の2で上限5,000千円×2件、魅力発信事業の広報業務が4,000千円である。**同市は、これらの予算は毎年度の議会の議決で決まるものであり、実施が保証されているわけではないと断っている。**\n\n**無料駐車券の収益は、額ではなく仕組みとして書かれている。** 同センターによれば、会社は駐車券の清算業務を引き受けることと引き換えに、通常の駐車場料金より安く駐車券を仕入れている。**仕入れのときの割引率より小さい割引率でサービス店に売り、その差が収益になる**という説明である。同センターは、磁気カード化にかかる機材などの初期投資には市の補助金を使ったとも書いている（額は記されていない）。\n\n**逆に、収益にしていない事業もある。** 同センターによれば、商店街免税一括カウンターの運営手数料は用度経費・ネット回線費・業務委託費で構成されている。**同センターは、まちづくり会社がこれを稼ぐための事業ではなく地域貢献の事業として運営しており、人手はボランティアだと書いている。**\n\n**アプリは会費を取っている。** 同センターは、会社がアプリを情報発信やフリー Wi-Fi と束ねた総合的なサービスとして扱い、**商店街と参加店から会費を取っている**とし、今後はこのアプリのシステムを外部へ販売して収益性を高めることを検討していると書いている。","真似するなら最低何が必要か":"出典から取り出せるのは5つである。\n\n1. **既にある組織を潰さずに、その上に足すこと。** 前節のとおり、協議会（合意の場）→協同組合（個別店舗が任意加入）→株式会社（収益事業）の順で作られ、**理事長の兼務によって商店街と個店への影響力が保たれている**（同センター）。新潟県も、協同組合と会社の両輪体制だと書いている\n2. **事務の負担を引き受けることを、値引きの根拠にすること。** 同センターによれば、以前は3つの商店街が、それぞれ自分の指定する駐車場で使える30分の無料券を紙で出していた。**使えるのは管理人のいる駐車場に限られ、駐車場の側は券を発行店ごとに仕分けして集計し請求する手間を負っていたという。** 会社がこれを一括で引き受けて磁気カードに替えたことで、駐車場は初期投資を抑えながら人件費などの運営コストを減らせるようになり、**その見返りとして会社は割引価格で券を仕入れられるようになった**\n3. **商業以外の店も加盟先に数えること。** 同センターは、まちづくり会社が運営に立つことで、**加盟先を商業店舗だけにとどめず銀行や医院も引き入れ、券を出す店を増やそうとしている**と書いている。同センターは別の箇所で、来街者・駐車場・サービス店の三者それぞれに得のある形を組んだ結果として、**提携する駐車場は60か所以上、券を出す無料駐車券サービス店は160店以上になった**としている。**券の発行基準は各個店の自由**とされている\n4. **大型店のカウンターに相乗りすること。** 同センターによれば、免税の一括カウンターは、買い物の場では税込みで支払い、**店から受け取った連絡票を新潟三越のカウンターに出すと税の分が返ってくる**という手順で、税務署への申請や仕組みづくりは会社が取りまとめた。同センターは、新潟三越の側にも、免税の手続きに来る外国人の客を自店に呼べるという利点があるとし、**会社が免税カウンターの一区画にパソコンを1台と新潟三越と同じシステムを用意し、三越の側は今の担当者のままで足りるという前提のもとで**、増える事務の負担は小さいと書いている\n5. **書いた計画を毎年見直すこと。** 新潟県によれば、協同組合内に置いた「まちなか再生委員会」でワークショップを重ねて古町ビジョンが作られた。**同県は、そこから起こす事業を2〜3年程度でやることと5年程度でやることに分けて中長期事業計画とし、毎年内容を見直すとしている**\n\n**確認できない**のは、会社の資本金・売上・利益とその推移、無料駐車券事業の取扱枚数、アプリの利用者数、そして事業開始前後で古町の通行量や売上がどう変わったかを示す数値である。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、新潟市が令和4年3月に作った商店街活性化促進事業計画である。**\n\n同市によれば、令和元年度に、新潟市古町七番町商店街振興組合と会社の2者が経済産業省の「商店街活性化・観光消費創出事業」に採択され、市の補助制度も併せて使い、**アーケードの改修に合わせて総合案内所（新潟古町まちみなと情報館）を整えた。**同市によれば、令和2年度には市の内部に部局をまたぐ古町再生のプロジェクト・チームが置かれ、「古町地区将来ビジョン」の方向性を踏まえて活性化の施策を関係者と話し合い、令和3年度から個別の事業に入ることとした。\n\n**同じ計画は、課題を2つ挙げている。** 同市は、**地区の商店街で空き店舗が増える傾向にある**と書いている（把握のもとは、商店街が作る補助制度利用希望の調査票だと注記されている）。同市は、店舗兼住宅であるものもあるため貸すことへの抵抗が働くこと、改装の費用が要ることなどを挙げ、**空き店舗を活かすことを考えていない所有者や、解消へ具体的に動いていない所有者がいると伝え聞いたとしたうえで**、借り手と貸し手を結びつけることが要だとしている。もう一つの課題は後継者不足で、同市は令和2年10月に新潟県が実施した商店街実態調査を引き、**「後継者不足」を挙げた商店街が51.7％で問題点の首位だった一方、後継者育成の対策を取っていないと答えたのは89.2％にのぼる**という数字を並べている。\n\n**市の計画は、会社に物件のあっせんの窓口を割り当てている。** 同市は、区域内の建築物・土地の権利取得のあっせんに関する事項として、**新潟古町まちづくり株式会社を窓口に置き、商店街や不動産業種団体から集めた空き店舗の物件情報を新規出店の希望者に渡す**と書いている。**これは講ずる施策として書かれたもので、実施済みとは書かれていない。** 新潟県は、更新日が2021年4月1日のページで、空き店舗を改修して出店者を呼ぶ仕組みも見据えているとし、**いずれ同社がリーシング機能を持つことも検討していると書いている。**\n\n**否定的な報道は、今回探した範囲では見つからなかった。** ただし今回の出典は同センター・新潟県・新潟市の3系統で、**いずれも事例紹介または行政計画であり、第三者による効果測定ではない。** 新潟日報は robots.txt が claudebot を拒否しており（reference/media.json・2026-08-18 実測）、報道による検証は行えていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"jp-0024","name":"官民12者が出資した会社が空き店舗に店を入れ、105店舗が出たが1店舗あたりの売上は目標に届かなかった","name_local":"大分まちなか倶楽部","name_variants":["株式会社大分まちなか倶楽部","株式会社 大分まちなか倶楽部"],"country":"日本","region":"大分県","municipality":"大分市","population_current":469139,"population_scale":"25万超","purpose":"商いを起こす","theme":"商店街・市場","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"株式会社大分まちなか倶楽部（大分市・大分商工会議所などが出資したまちづくり会社）","component_types":"soft","components":["空き店舗にテナントを誘致した","テナントミックス事業を進めた","広場の仮設店舗の運営を受託した","共同催事を担う委員会の事務局に入った","市の出店・催事補助の相談窓口になった"],"sources":[{"url":"https://cir.nii.ac.jp/crid/1570572702925495040","title":"7009 まちづくり会社による中心商店街の「テナントマネジメント」に関する研究 : 大分まちなか倶楽部の商業系エリアマネジメント活動に着目して(都市計画)","outlet":"日本建築学会関東支部研究報告集","published":"2013-03","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1573387452649764096","title":"7367 まちづくり会社による中心商店街の「テナントマネジメント」に関する研究 : その1 大分まちなか倶楽部によるテナントマネジメントの内容と出店店舗の配置","outlet":"都市計画（日本建築学会）","published":"2013-08-30","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://www.city.oita.oita.jp/o154/machizukuri/toshi/documents/20170728-4.pdf","title":"第2期 大分市中心市街地活性化基本計画","outlet":"大分市","published":"2017-07-28","language":"ja","from_operator":false,"source_type":"official"},{"url":"https://oita.keizai.biz/headline/1161/","title":"大分市で「まちなかバーゲン」 商店街と大型店が連携して初売り＆福袋販売","outlet":"大分経済新聞","published":"2018-12-28","language":"ja","from_operator":false},{"url":"https://oita.keizai.biz/headline/1871/","title":"大分市の「祝祭の広場」にテラス付き仮設店舗 先陣は「ラーメン日替わりリレー」","outlet":"大分経済新聞","published":"2021-10-21","language":"ja","from_operator":false},{"url":"https://www.city.oita.oita.jp/o170/toshisaiseisuisinhoujin.html","title":"都市再生推進法人について","outlet":"大分市","published":"2022-05-13","language":"ja","from_operator":false,"source_type":"official"},{"url":"https://www.city.oita.oita.jp/o154/shigotosangyo/shokogyo/1455607383200.html","title":"大分市中心市街地への出店・イベント活動をサポートします","outlet":"大分市","published":"2026-07-10","language":"ja","from_operator":false,"source_type":"official"}],"context_sources":[{"url":"https://www.city.oita.oita.jp/o001/shisejoho/annai/tokei-jinko.html","title":"大分市の統計（人口）"}],"funding_scale":"資本金10,500,000円（発行株式数525、一口20,000円）。出資者は大分市と大分商工会議所が各19.05％で発起人、大分合同新聞社14.29％、㈱トキハ9.53％、残る8者が各4.76％（第2期基本計画・平成29年7月28日変更）","unknown_fields":["start_year","elapsed_years"],"latest_source_year":2026,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"設立は平成19年で西暦の記載が出典に無いため start_year は null にした。出典は2013年から2026年にわたる。2017年の市の計画が新規出店105店舗と1店舗あたりの売上の未達を並べて書いており、2021年と2026年の出典では同社が広場の運営と補助の相談窓口に置かれている。","timeline":[{"year":2013,"event":"日本建築学会関東支部研究報告集と都市計画が、同社のテナントマネジメントを研究の対象に据えた","source_url":"https://cir.nii.ac.jp/crid/1570572702925495040"},{"year":2017,"event":"大分市の第2期中心市街地活性化基本計画が、テナントミックス事業による延べ105店舗の新規出店と、1店舗あたりの売上目標との乖離の両方を書いた","source_url":"https://www.city.oita.oita.jp/o154/machizukuri/toshi/documents/20170728-4.pdf"},{"year":2021,"event":"大分経済新聞が、大分市が広場に置く仮設店舗の運営を同社が委託を受けて行うと伝えた","source_url":"https://oita.keizai.biz/headline/1871/"},{"year":2022,"event":"大分市が、同社を令和4年5月12日に都市再生推進法人に指定したことを掲載した","source_url":"https://www.city.oita.oita.jp/o170/toshisaiseisuisinhoujin.html"},{"year":2026,"event":"大分市の中心市街地の出店・催事の補助制度のページが、同社を申請前の相談先として置いている","source_url":"https://www.city.oita.oita.jp/o154/shigotosangyo/shokogyo/1455607383200.html"}],"last_verified":"2026-08-20","sections":{"何をしたか":"大分市の中心市街地で、**市・商工会議所・新聞社・百貨店・銀行など12者が出資したまちづくり会社が、商店街の空き店舗にテナントを入れた。** 大分市の第2期中心市街地活性化基本計画によれば、平成24年6月時点で**延べ105店舗が新規出店した。** その一方で同計画は、**1店舗あたりの売上が当初の目標を大きく下回ったことも書いている。** 同計画は、竹町通商店街と中央町商店街が飲食店の割合をやや増やすという方針を打ち出したことが功を奏したとする一方、方針が明確でなかった府内町側では効果が出にくかったとしている。","誰が始めたか":"**会社は官民が一体で出資してできている。株主表が公になっているので、そのまま写す。**\n\n大分市の第2期中心市街地活性化基本計画によれば、株式会社大分まちなか倶楽部は**平成19年5月に設立された。** 同計画は、大分商工会議所とともに法定協議会を共同で設立する立場に立つための会社であり、官民が一体になった形だと書いている。 同計画に載る概要では、設立は**平成19年5月14日**、資本金は**10,500,000円**（発行株式数525、一口20,000円）である。**出典が和暦でしか書いていないため、`start_year` は西暦に変換せず null のままにした。**\n\n**株主は12者である。** 同計画の表によれば、大分市と大分商工会議所がそれぞれ100株・**19.05％**で発起人、大分合同新聞社が75株・**14.29％**、株式会社トキハが50株・**9.53％**、以下、デジタルバンク株式会社・株式会社大分銀行・株式会社豊和銀行・大分信用金庫・大分県信用組合・大分市中心部商店街振興組合・大分都心まちづくり委員会・株式会社JR大分シティが各25株・**4.76％**で、合計525株である。\n\n**この株主表は、本レコードの出典の読み方を決める。** 大分市は出資者なので、市の出典3本は出資者の書いたものである。**大分合同新聞社も出資者なので、同紙も独立した媒体として扱えない。** 独立した一次情報として数えたのは、学術1系統（著者が重なり主題名も同じ2本を合わせて1本）と大分経済新聞2本である。\n\n**テナントミックス事業が効いた時期については、同計画がこう書いている。** 中央町側の商店街は平成19年以前、昔からの物販店にまじって空き店舗が散見される状態で、歩行者の通行量も減る方向にあった。同計画は、第1期大分市中心市街地活性化基本計画が平成20年に認定されたのを契機として、**竹町通商店街と中央町商店街が、賑わいをつくるために飲食店の割合を若干増やすという商店街の方針を明確に打ち出し、それが功を奏した**としている。**方針を打ち出したのは商店街の側であり、会社が決めたとは書かれていない。**\n\n**学術の側からは、2013年に研究の対象になっている。** 日本建築学会関東支部研究報告集（2013年3月）と都市計画（2013年8月30日）は、いずれも「まちづくり会社による中心商店街の『テナントマネジメント』に関する研究」の題で同社を扱っている。**著者が重なり主題名も同じなので、独立した一次情報としては合わせて1本と数えた**（「その1」と付いているのは都市計画の側だけである）。 **書誌ページしか読めていないため、内容には立ち入らない。**\n\n**市が公的な位置づけを与えたのは、設立よりあとである。設立は平成19年、指定は令和4年にあたる。** 大分市は、**令和4年5月12日に株式会社大分まちなか倶楽部を都市再生推進法人に指定した**と掲載している。同市のページによれば、指定された法人が行うのは都市再生特別措置法の第119条が定める業務で、その一部だけでもよいとされている。同市のページによれば、審査の基準には、申請者かその母体となる組織が直近5年のうちにまちづくりの活動をした実績を持つこと、市内に事務所を置き、市内でまちづくりの活動をしていること、業務に必要な組織と人員を備え、経費を賄うだけの経済的な基礎があることなどが並ぶ。","いくらかかったか":"**会社の売上と収支は、今回の出典のどれにも書かれていない。** 分かるのは、資本金と株主構成、市の補助制度の枠、会社が運営を受託した仮設店舗の出店料、そして事業の目標と実績の乖離である。\n\n**資本金は10,500,000円である**（前節の株主表と同じ出典）。\n\n**市の補助制度の枠は、2026年のページにある。** 大分市の中心市街地商都復活支援事業のうち、まちなか出店支援事業は補助率2分の1で、補助限度額が商店街団体150万円・法人または個人100万円である。イベント開催事業は補助率3分の2で、令和8年度から商店街団体80万円・事業者60万円になった。広域連携イベント誘致事業は補助率3分の2・60万円で、**この2つは令和8年度から申請が1年度あたり1回に変わった。** 商店街基盤整備事業は補助率2分の1・1,000万円である。**同市はこの手続きの最初と途中に同社を置いており、出店場所・業種やイベントの内容の相談も、申請書の添付書類の内容確認も同社で行うとしている**（まちなか出店支援事業だけは、事業計画書をいったん大分商工会議所へ出して直す段が挟まる）。\n\n**仮設店舗の値づけは、2021年の記事にある。** 大分経済新聞（2021年10月21日）によれば、大分市が広場に置く仮設店舗は、**消費税と水道光熱費を含めて7日間2万5,000円**で貸し出すとされていた。1区画は約32平方メートルで、その内訳は建物が約12平方メートル、テラスが約20平方メートルとされている。\n\n**目標と実績の差は、市の計画が並べて書いている。** 同計画によれば、1店舗あたりの売り上げ目標は当初計画で**69.6百万円**と置かれていたが、売上の実績は**20百万円**だった。同計画は、**本事業での売上の積算が目標を大きく下回っている**とし、第2期では積算上の売り上げ目標を見直す必要があるとしている。**同計画は別の箇所で、この開きなどを理由に、小売業年間商品販売額の目標値を大きく下回っていると推察される、という書き方もしている。**","真似するなら最低何が必要か":"出典から取り出せるのは5つである。\n\n1. **商店街の側に業種の方針を出させること。** 前節のとおり、大分市の計画は、竹町通商店街と中央町商店街が飲食店の割合をやや増やすという方針を明確に打ち出したことが功を奏したと書いている。**逆に、活性化の方針が明確にされていなかった府内町側の商店街では、同社が進めるテナントミックスによる空き店舗対策の効果がなかなか発揮できていない**とも書いている。同計画は、方針が固まっていないところについては、商店街ごとの再生の方針を明確に示したうえで同社がテナントミックスの事業を進めることが必要だと考えている、と書いている\n2. **入れて終わりにしないこと。** 同計画によれば、平成24年6月現在で、補助を使わなかったものも含めて**延べ105店舗**が新規出店した。同計画は、店の配置を組み立てたことと経営のフォローアップが、新規事業者の継続的な運営を支えているとしている（主体は書かれていない）\n3. **落ちるほうの数字も並べておくこと。** 前節のとおり、1店舗あたりの売上目標69.6百万円に対し実績は20百万円だった。同計画は積算の見直しが要るとしている。**成果（105店舗）と未達（売上）が同じ文書に並んでいる**\n4. **大型店の撤退が数字を持っていくことを織り込むこと。** 同計画によれば、旧大分サティが撤退した際は周辺の歩行者通行量が58％減り（平成20年18,501人→平成21年7,798人）、平成22年10月に、1階に総合食料品スーパーを入れたセントポルタビルへ再生されて回復した（15,462人）。一方、平成23年1月の大分パルコの撤退では周辺の通行量が約62％減った。**同計画は、平成18年から平成23年で中心部全体が11％の減少、府内町側の商店街が14％の減少、中央町側の商店街が4％の減少だったとしたうえで、テナントを誘致する方針がはっきりしていて、テナントミックスが順調だった商店街では、落ち込みが小さかったと書いている**\n5. **稼ぎ口を、あとから足せる形にしておくこと。** 大分経済新聞（2018年12月28日）によれば、中心部にある商店街5つと大型商業施設2つが手を組む共同催事は、2015年に新しい駅ビルが開業したのを機に、夏と冬の年2回続いており、**この催事を主催しているのは大分都心まちづくり委員会で、その事務局を同社が務めている。** 同紙（2021年10月21日）によれば、同社は大分市が広場に置く仮設店舗の運営も委託されている\n\n**確認できない**のは、会社の売上と収支、テナントミックスで誘致した店の生存率、平成24年6月より後の新規出店数、そして平成24年より後の歩行者通行量の実績である（同計画に載る平成29年の値は、目標値と推計値であって実績ではない）。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、大分市の中心市街地商都復活支援事業のページ（更新日2026年7月10日）である。**\n\n同市は補助金の手続きの流れとして、**まず株式会社大分まちなか倶楽部で出店場所・業種やイベントの開催場所・内容を相談・確認し、次に申請者が事業計画書を作り、添付書類をそろえたうえで再び同社で書類の内容を確認し、そのあと市役所の商工労政課に提出する**と書いている。**2026年7月10日の更新時点で、申請の入口に同社が置かれている。**\n\n**公的な位置づけもある。** 大分市の都市再生推進法人のページ（更新日2022年5月13日）によれば、同市が指定した都市再生推進法人は指定番号1の株式会社大分まちなか倶楽部の1件で、指定日は令和4年5月12日である。\n\n**広場の仮設店舗については、開始前の記事までしか確認できていない。** 大分経済新聞（2021年10月21日）は、大分市が11月1日から広場で仮設店舗の運用を開始すると伝え、**同社が委託を受けて運営すると書いている。** 同紙によれば、これは民間の力を入れたときの効果と可能性を確かめるために行われるもので、当初の開始予定は7月1日だったが、新型コロナウイルスの影響で延ばされた。期間は3月31日までで、来年度以降の実施も視野に入れているとされていた。**その後どうなったかは今回の出典からは確認できない。**\n\n**否定的な記述は、市の計画そのものにある。** 前節のとおり、売上の積算が目標を大きく下回ったことと、方針の定まっていない商店街で効果が出にくかったことが書かれている。**同じ PDF は、もう一つの落ちる側の記述を載せている。** ただしそれは第2期基本計画の本文ではなく、その中に収載された大分市商工業振興計画の「７．商店街の現状と課題」の節である。同節の「（２）商店街の課題」は、出店の費用の一部を助成する仕組みを設けたものの、**助成先の一部が廃業していること**を課題として挙げている（時期は書かれていない）。**これを書いたのは同社に19.05％を出資している大分市であり、第三者による検証ではない。** 当事者である同社の側からの反論は、今回探した範囲では確認できなかった。**大分合同新聞社は、同計画の株主表によれば同社に14.29％を出資している。同紙の報道をもって独立した検証とすることはできない。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"jp-0025","name":"市が中心街に無料の複合施設を建て、8年で延べ800万人が訪れた","name_local":"八戸ポータルミュージアム","name_variants":["八戸ポータルミュージアムはっち","ポータルミュージアム「はっち」"],"country":"日本","region":"青森県","municipality":"八戸市","population_current":210609,"population_scale":"5万〜25万","purpose":"人を呼ぶ","theme":"学校・公共施設","start_year":2011,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"八戸市（商工労働まちづくり部 八戸ポータルミュージアム はっち）","component_types":"hybrid","components":["中心街に複合施設を建てた","駐車場を置かない設計にした","飲食とものづくりの挑戦の場を入れた","子育て交流の場を同居させた","中期の運営方針を作り継いできた"],"sources":[{"url":"https://cir.nii.ac.jp/crid/1521699230364732032","title":"青森県八戸市 八戸ポータルミュージアムはっち（特集 目指せ\"まちなか再生\"）","outlet":"地域創造","published":2011,"language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1524232504784209024","title":"八戸ポータルミュージアム「はっち」でまちを元気に（特集 シティプロモーション再考）","outlet":"地域開発（日本地域開発センター）","published":"2012-03","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1520290884401752064","title":"観光まちづくりの拠点 : 八戸ポータルミュージアム「はっち」を例に","outlet":"ノースアジア大学国際観光研究","published":"2013-03","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cir.nii.ac.jp/crid/1521417755037026944","title":"八戸ポータルミュージアムはっち","outlet":"第三文明","published":"2014-02","language":"ja","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://hachinohe.keizai.biz/headline/594/","title":"八戸ポータルミュージアム「はっち」来館者600万人突破 市内3歳児が600万人目","outlet":"八戸経済新聞","published":"2017-07-20","language":"ja","from_operator":false},{"url":"https://hachinohe.keizai.biz/headline/1183/","title":"八戸市の地域観光交流施設「はっち」が来館者800万人 開館から8年","outlet":"八戸経済新聞","published":"2019-10-17","language":"ja","from_operator":false},{"url":"https://machi.smrj.go.jp/machi/public/example/seminar_hachinohe_jirei_20211112.html","title":"市民が集う拠点整備とソフト展開でエリアの魅力更新中〜八戸市中心市街地活性化の取組み〜","outlet":"中心市街地活性化協議会支援センター（中小企業基盤整備機構内）","published":"2021-11-12","language":"ja","from_operator":true},{"url":"https://www.city.hachinohe.aomori.jp/soshikikarasagasu/hachinoheportalmuseum_hatchi/4571.html","title":"八戸ポータルミュージアムはっち 施設基本情報","outlet":"八戸市","published":"2024-04-20","language":"ja","from_operator":true,"source_type":"official"},{"url":"https://www.city.hachinohe.aomori.jp/gyoseijoho/koho_kocho/publiccomment/25114.html","title":"第4期八戸ポータルミュージアム中期運営方針（素案）に対するパブリックコメントの実施について","outlet":"八戸市","published":"2026-04-23","language":"ja","from_operator":true,"source_type":"official"}],"context_sources":[{"url":"https://www.city.hachinohe.aomori.jp/soshikikarasagasu/shiminka/tokeijoho/1/25628.html","title":"八戸市人口データ（令和8年度）"}],"unknown_fields":["funding_scale"],"latest_source_year":2026,"elapsed_years":15,"follow_up":"濃い","follow_up_note":"2011年の開館から2026年まで出典がある。2017年と2019年の八戸経済新聞が延べ来館者600万人と800万人の到達を伝え、2026年の八戸市のページは2030年に向けた第4期の中期運営方針の素案がパブリックコメントにかけられたことを載せている。","timeline":[{"year":2011,"event":"地域創造が「目指せ“まちなか再生”」の特集で八戸ポータルミュージアムはっちを取り上げた","source_url":"https://cir.nii.ac.jp/crid/1521699230364732032"},{"year":2013,"event":"ノースアジア大学国際観光研究が、観光まちづくりの拠点の例としてはっちを扱った","source_url":"https://cir.nii.ac.jp/crid/1520290884401752064"},{"year":2017,"event":"八戸経済新聞が、7月18日に延べ来館者が600万人を突破し記念セレモニーが行われたと伝えた","source_url":"https://hachinohe.keizai.biz/headline/594/"},{"year":2019,"event":"八戸経済新聞が、10月9日に延べ来館者数が800万人になったと伝えた","source_url":"https://hachinohe.keizai.biz/headline/1183/"},{"year":2026,"event":"八戸市が、はっちのまとめた第4期中期運営方針の素案についてパブリックコメントを実施し、7件（個人2名）の意見が寄せられたと掲載した","source_url":"https://www.city.hachinohe.aomori.jp/gyoseijoho/koho_kocho/publiccomment/25114.html"}],"last_verified":"2026-08-20","sections":{"何をしたか":"青森県八戸市が、中心街に鉄筋コンクリート5階建ての複合施設「八戸ポータルミュージアム はっち」を建て、2011年2月11日に開いた。**入場は無料である**（八戸市）。**当事者の講演によれば、施設に駐車場はあえて置かなかった。** 八戸経済新聞によれば、建物の中には飲食のテナントのほか、シアター、ギャラリー、ものづくりを振興するブースなどが入る。同紙は、地域にあるものを使って新しい価値を生むことを目指す施設だと書いている。**同紙は、延べ来館者が2017年7月18日に600万人、2019年10月9日に800万人に達したと伝えている。** 2019年の記事は、800万人という数字を、市民1人あたり35回来館した計算だと書いている。","誰が始めたか":"**八戸市が抱えている施設である。** 同市のページによれば、施設の問い合わせ先は同市の商工労働まちづくり部で、**館の名がそのまま部内の組織名になっている。** 指定管理者を置いているかどうかは、今回の出典からは確認できなかった。\n\n**建てるまでの経緯は、当事者の講演として記録されている。** 中心市街地活性化協議会支援センターの記事は、2021年11月に八戸市で開かれたセミナーで**株式会社まちづくり八戸の柳沢拓哉が行った講演をまとめたもの**である。**柳沢は後述のとおりはっちの開設準備室にいた人であり、以下は当事者の説明として読む必要がある。** なおこの記事に掲載日は無く、本文には、株式会社まちづくり八戸の宅配サービスについて令和4年1月時点で休止中だという注記があるので、書かれたのはセミナーより後である。\n\n同記事は、八戸市の中心市街地にはここに至るまで転換期がいくつかあったとしたうえで、2つを取り上げている。1つは平成14年の東北新幹線八戸開業で、開業前のテレビ取材でタクシーの運転手が八戸には見どころがないと話す映像が全国放送で流れ、**まちの関係者が受けた衝撃から、それまで弱かった観光を強化する取り組みが始まった**という。2つ目は、郊外に5万平米以上のショッピングセンターを誘致する計画をめぐる対立である。同記事によれば、そうした議論を踏まえ、**都市計画にもとづいて建物の規模を1万平米以下に抑える方針が決まった。** 柳沢は講演の中で、**大型のショッピングセンター計画を止めたところが起点だった**とし、そこから市が腹を決めてまちなかの立て直しに向かったのだと語ったとされる。\n\n**同記事によれば、施設の性格は途中で変わっている。** 当初は観光交流施設が想定されていたが、郊外のショッピングセンター計画が止まったことや、八戸市中心市街地活性化基本計画・八戸市都市計画マスタープランの基本理念などもあって、**方針が変わり、「中心街に人を呼び込んで賑わいのきっかけになるような」複合施設を開くことになった**という。同記事によれば、そこには市民が何度も足を運ぶ場にするという狙いも重ねられていた。柳沢自身は開設の準備室に加わり、早い段階からまちの人や実際に使うことになる市民と行き来を重ねて、信頼を積んできたとされる。\n\n**学術と雑誌の側からは、開館の年から取り上げられている。** 地域創造（2011年）は「目指せ“まちなか再生”」の特集で、ノースアジア大学国際観光研究（2013年3月）は観光まちづくりの拠点の例として、第三文明（2014年2月）はそれぞれ本館を扱っている。**いずれも書誌ページしか読めていないため、内容には立ち入らない。** 地域開発（2012年3月）にも「はっち」でまちを元気に、と題した記事があるが、**著者の所属が書誌ページに出ておらず、当事者かどうかを確かめられなかったので本数には数えていない。ただし地域創造とノースアジア大学の書誌ページにも所属は出ていない。数え方が揃っていないことは承知のうえで、慎重側に倒した。**","いくらかかったか":"**建設費・年間の運営費は、今回の出典のどれにも書かれていない。** 分かるのは利用者側の負担と、来館者1人あたりの規模感だけである。\n\n**入場料は無料である。** 八戸市の施設基本情報によれば、はっちの入場料は無料、開館時間は9時から21時、休館日は火曜日（祝日の場合その翌日）と年末年始である。**同じ建物の4階にある「こどもはっち」だけは有料で、一般（小学生以上）100円、障がい者50円**、開館時間は9時30分から16時30分である。\n\n**駐車場については、費用に触れた出典が無い。** 前節の記事によれば、**駐車場をあえて置かなかったのは、公共交通機関を使ってもらうことと、近隣の民間駐車場や百貨店、商店街とつながることをねらったものだとされる。** **これを書いているのは当事者の講演の記事1本だけで、ほかの出典に駐車場の記述は無い。**\n\n**来館者の規模は報道にある。** 八戸経済新聞（2019年10月17日）は、平成30年度に来館した人数を約87万4千人としており、これを八戸市民1人あたり平均4回程度の来館にあたる計算だと書いている。","真似するなら最低何が必要か":"出典から取り出せるのは5つである。\n\n1. **郊外の大型店を止める判断と、セットで考えること。** 前節のとおり、郊外に5万平米以上のショッピングセンターを誘致する計画は、建物を1万平米以下に抑える方針に落ち着いた。**当事者である柳沢は、そこが起点だったと講演で語ったとされる。** 施設を建てる話の前に、まちの容れ物の総量をどうするかの決着がある\n2. **駐車場を作らないこと。** 同記事によれば、これは公共交通機関の活用と、近隣の民間駐車場・百貨店・商店街との連携をねらったものである。**ただしこれを書いているのは当事者の講演の記事だけで、ほかの出典に駐車場の記述は無い**\n3. **1つの建物に用途を混ぜること。** 同記事が挙げるのは、飲食とものづくりのチャレンジショップ、アトリエ、ギャラリー、シアター、FMスタジオ、観光インフォメーション、子育て交流スペース、そしてアーティストの宿泊施設である。**同記事は、機能を1つの建物に集めれば、それまでまちへ足を運ばなかった層がこのエリアに来る入口になり、そこから商店街が元気になれば施設の側もさらに賑わう——という好循環をねらったものだと書いている**\n4. **入場を無料にし、子ども向けだけ有料にすること。** 前節のとおり、はっち本体は無料、こどもはっちは一般100円・障がい者50円である。**無料の建物の中に、有料の場所が同居している**\n5. **運営方針を作り直し続けること。** 八戸市によれば、2026年の時点で**2030年に向けた今後5年間の第4期中期運営方針の素案**がまとめられ、パブリックコメントにかけられた。**素案の段階であり、第4期の方針が定まったとは書かれていない。** 各期が何年ずつだったかも、今回の出典からは確認できない\n\n**確認できない**のは、建設費と年間の運営費、テナントや催しの収支、開館前後で中心街の歩行者通行量や商店街の売上がどう変わったかを示す数値、そして2019年より後の来館者数である。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、八戸市のパブリックコメントのページ（更新日2026年4月23日）である。**\n\n同市によれば、はっちが素案をまとめたのは、**2030年に向けた今後5年間を対象とする第4期の中期運営方針**である。令和8年1月19日から2月20日まで市民の意見を募集した。**寄せられた意見は7件（個人2名）である。** 同市は、意見の概要と市の考え方をまとめたファイルを同じページに置いている。\n\n**施設の基本の条件は、2024年の市のページで次のようになっている。** 同市の施設基本情報（更新日2024年4月20日）によれば、住所は八戸市三日町11-1、はっちの開館時間は9時から21時、休館日は火曜日、入場は無料である。\n\n**来館者の記録は2019年で止まっている（今回の出典の範囲では）。** 八戸経済新聞（2019年10月17日）によれば、延べ来館者数は10月9日に800万人となった。同紙は、2012（平成24）年3月に100万人、昨年（同紙は2019年10月17日付）の8月に700万人となり、そこから1年2か月で800万人になったと書いている。**800万人目の来館者は台湾出身で東京在住の人で、友人との二人旅の途中、初めての青森訪問の初日にたまたま入ったところだったという。**\n\n**震災の記録も同じ記事にある。** 同紙によれば、はっちは開館の1か月後にあたる3月11日に東日本大震災に遭い、**臨時の避難所としても使われた。**\n\n**受賞もある。** 八戸経済新聞（2017年7月20日）によれば、2016年に「平成28年度地域創造大賞（総務大臣賞）」を受けた。同紙は、5年間の取り組みが評価されたものだとしている。\n\n**否定的な報道は、今回探した範囲では見つからなかった。** ただし**本レコードの出典のうち、八戸市の2本は施設の設置者・運営者そのものの発信であり、まちかつの1本も当事者の講演を事例としてまとめたものである。** 第三者による効果測定は今回の出典に含まれていない。青森県の東奥日報は robots.txt が claudebot を拒否しており（reference/media.json・2026-08-20 実測）、報道による検証は八戸経済新聞の範囲にとどまる。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"nl-0001","name":"村が持つ風車の収益で村の設備をまかなう","name_local":"Dorpsmolen Reduzum","country":"オランダ","region":"フリースラント州","municipality":"Leeuwarden","population_current":130162,"population_scale":"5万〜25万","purpose":"お金を地域で回す","theme":"エネルギー・資源循環","start_year":1994,"end_year":null,"status_current":"継続中","actor_type":"住民組織","lead_actor":"Stichting Dorpsmolen Reduzum","funding_scale":"新しい風車の建設費 約100万ユーロ。うち住民からの出資 677,000ユーロ（2019年9月時点）","component_types":"hybrid","components":["村が風車を所有し収益を村に配る","一口5ユーロで住民が組合員になる","近隣3村にも出資と配当を広げた","建設費の約7割を住民出資でまかなった"],"single_outlet":true,"sources":[{"url":"https://www.omropfryslan.nl/nl/nieuws/907204/bijna-zeven-ton-opgehaald-in-dorpen-voor-financiering-windmolen-reduzum","title":"Bijna zeven ton opgehaald in dorpen voor financiering windmolen Reduzum","outlet":"Omrop Fryslân","published":"2019-09-16","language":"nl"},{"url":"https://www.omropfryslan.nl/nl/nieuws/1062354/doarpsmune-reduzum-heeft-500-leden-nodig-voor-nieuwe-windturbine","title":"Doarpsmûne Reduzum heeft 500 leden nodig voor nieuwe windturbine","outlet":"Omrop Fryslân","published":"2021-06-07","language":"nl"},{"url":"https://www.omropfryslan.nl/nl/nieuws/1167838/nieuwe-reduster-dorpsmolen-wordt-donderdag-eindelijk-opgebouwd","title":"Nieuwe Redúster dorpsmolen wordt donderdag eindelijk opgebouwd","outlet":"Omrop Fryslân","published":"2022-09-08","language":"nl"},{"url":"https://www.omropfryslan.nl/nl/nieuws/17307995/dorpsmolen-reduzum-staat-al-een-week-stil-het-zorgt-voor-problemen","title":"Dorpsmolen Reduzum staat al een week stil: \"Het zorgt voor problemen\"","outlet":"Omrop Fryslân","published":"2025-03-12","language":"nl"}],"context_sources":[{"url":"https://allecijfers.nl/gemeente/leeuwarden/","title":"gemeente Leeuwarden の人口"}],"unknown_fields":[],"latest_source_year":2025,"elapsed_years":31,"follow_up":"濃い","follow_up_note":"1994年の風車の建て替えに向けて2019年9月に近隣の村から677,000ユーロが集まり、2022年9月に新しい風車が組み上げられた。2025年3月には送電網の障害で約1週間止まり、運営側はこれが4回目だと述べている。","timeline":[{"year":1994,"event":"最初の村の風車が入った。軸の高さは36メートルだった","source_url":"https://www.omropfryslan.nl/nl/nieuws/1167838/nieuwe-reduster-dorpsmolen-wordt-donderdag-eindelijk-opgebouwd"},{"year":2019,"event":"9月、建て替えの資金として近隣の村から677,000ユーロが集まった","source_url":"https://www.omropfryslan.nl/nl/nieuws/907204/bijna-zeven-ton-opgehaald-in-dorpen-voor-financiering-windmolen-reduzum"},{"year":2021,"event":"6月、新しい風車を建てるには組合員が500人必要だと報じられた","source_url":"https://www.omropfryslan.nl/nl/nieuws/1062354/doarpsmune-reduzum-heeft-500-leden-nodig-voor-nieuwe-windturbine"},{"year":2022,"event":"9月、新しい風車が組み上げられた。軸の高さは46メートルになった","source_url":"https://www.omropfryslan.nl/nl/nieuws/1167838/nieuwe-reduster-dorpsmolen-wordt-donderdag-eindelijk-opgebouwd"},{"year":2025,"event":"3月、送電網の障害で約1週間停止した。運営側は4回目であり、事業者に窓口を置いてほしいと述べた","source_url":"https://www.omropfryslan.nl/nl/nieuws/17307995/dorpsmolen-reduzum-staat-al-een-week-stil-het-zorgt-voor-problemen"}],"last_verified":"2026-08-16","sections":{"何をしたか":"フリースラント州の村レーデュズム（Reduzum、フーネ自治体レーワルデン）は、1994年から村自身の風車を持っている。売電収入は村に戻され、村の設備や催しの費用に充てられてきた。風車が古くなった2010年代後半、村は建て替えのために近隣のフリンス、ツィエンセルブオレン、イダエルトを巻き込んだ組合をつくり、一口5ユーロで組合員を募った。2019年9月には住民から677,000ユーロが集まり、これは建設費約100万ユーロの約7割にあたる。新しい風車は2022年に組み上げられた。","誰が始めたか":"運営主体は Stichting Dorpsmolen Reduzum（レーデュズム村風車財団）で、会長はヘンク・フェリンハ（Henk Vellinga）。建て替えにあたっては財団が自治体レーワルデンの許可を取り、住民を一軒ずつ回って出資を募った。2021年の時点で、フェリンハの後を継いで説明にあたっていたザイルストラ（Zijlstra）は「7年かかっている」と述べており、許可と資金の調達に長い時間を要したことがわかる。組合員は当初レーデュズム・フリンス・ツィエンセルブオレン・イダエルトの4集落を対象としたが、最終的にはハロウ（Grou）、イルンスム（Jirnsum）、ワイトハールト（Wytgaard）など周辺からも加わった。","いくらかかったか":"新しい風車の建設費は「100万ユーロ近く」とされる（2019年9月）。このうち住民からの出資が677,000ユーロ集まった。財団は同時期に、5年前に同じ問い合わせをしたときは許可が下りず、集まった約束は400,000ユーロにとどまっていたと述べている。残りについては、財団はヨーロッパの補助金と銀行融資を得ようとしていると2019年に説明している。総事業費の最終確定額は、確認した出典には書かれていない。","真似するなら最低何が必要か":"この事例で真似できる単位は、風車そのものではなく**所有と分配の形**である。\n\n第一に、**出資の単位を極端に小さくしている**こと。組合員になるための拠出は一口5ユーロで、期限がない。これは資金調達の手段というより、村の誰もが締め出されない参加の入口として機能している。組合員には配当が割り当てられる。\n\n第二に、**一つの集落で完結させていない**こと。当初から近隣3集落を対象に組合員を募り、必要な人数（500人）を確保している。単独の村では人数が足りないことを前提に設計されている。\n\n第三に、**建設費の大半を外部資金に頼らず住民出資で埋めた**こと。約100万ユーロのうち677,000ユーロが住民から集まった。補助金と融資は残りを埋めるものとして位置づけられている。逆に言えば、住民から7割を集められない規模の設備は、この形では成立しない。\n\n第四に、**時間**。財団は許可の取得から資金調達まで7年かけている。県が単独の風車を長く認めなかったためで、制度側の条件が整うのを待つ期間を織り込む必要がある。\n\nなお、風車という設備そのものは建設を伴う（`component_types: hybrid`）。P3の規模でそのまま再現できるのは、収益を村に戻す仕組みと出資の単位の設計であって、設備の建設ではない。","今どうなっているか":"`status_current: 継続中`。2025年3月12日の報道時点で風車は稼働しており、収益は村に配られ続けている。同じ報道は「そのお金は村に行く。まもなく共用車（deelauto）も入る」と、収益の使途が今も更新されていることを伝えている。\n\n同時にこの報道は問題も伝えている。風車は当時1週間停止していた。送電会社リアンダー（Liander）が地域の障害の際に風車を系統から切り離したためで、運営側によればこれは4度目である。リアンダーは連絡が不十分だったことを謝罪している。停止のあいだ売電収入が止まるため、村の収入もその分減る。設備を村が所有していても、系統につながっている以上、収入は外部の事業者の判断に左右される。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"100万ユーロ","currency":"EUR","value":1000000,"jpy":185600000},{"raw":"677,000ユーロ","currency":"EUR","value":677000,"jpy":125651200},{"raw":"400,000ユーロ","currency":"EUR","value":400000,"jpy":74240000}],"sample":true},{"id":"nl-0006","name":"団地の暖房をガスから熱供給網に切り替える計画に、住民の反対が続いている","name_local は、幼いうちから企業家の考えを広め、ソフトスキルを強めることを通じて、教育の大事な要素だと述べている。記事は、事業が2018年から行われ、6つの版で2千人近い子どもが86の学級から参加し、115の企業と創造産業の担い手が関わり、166回の集まり・講座・企業訪問があったとしている","source_url":"https://www.dziennikwschodni.pl/lublin/przedsiebiorcze-dzieciaki-jutro-rusza-rekrutacja,n,1000356765.html"},{"year":2025,"event":"4月23日、ルブリンの第45幼稚園の組がこの事業の一環で市の山羊の館を訪ね、市の紋章と町そのものの歴史を遊びを通じて知ることができたと報じられた。記事は、およそ350人の子どもが参加し、12〜15の講座の組がそれぞれ5回の集まりからできていること、研修を受けた UMCS の教育学の学生が講座を進めること、ポーランド国立銀行が貯蓄と中央銀行の働きの回を受け持つことを書いている。子どもたちの成果は6月の締めくくりの会で、市の模型として示される予定だとしている","source_url":"https://www.dziennikwschodni.pl/lublin/przedsiebiorcze-dzieciaki-odwiedzily-lubelskiego-koziolka,n,1000360523.html"}],"editor_notes":"第1層は4本とも通った。**取得できた媒体は少ない**——ルブリンの媒体のうち kurierlubelski.pl は robots.txt が claudebot を拒否、umcs.pl は `*` を拒否、lublin.eu は robots.txt がタイムアウトで取れず、lublin24.pl と spottedlublin.pl はブラウザでもボット検証の壁で robots.txt に到達できなかった。robots が許可だったのは dziennikwschodni.pl・radio.lublin.pl・lublin112.pl・lsi-lublin.pl の4つで、実際に本文と掲載日が取れたのはこのうち3つである（lublin112.pl は該当記事が見つからず本文を測っていない）。 **lsi-lublin.pl の記事は末尾に「źródło：lublin.eu」と書いてあり、市の発表の再掲である。** 媒体名は独立して見えるが中身は運営主体の文章なので from_operator を true にした（lessons EE の型）。本数の数え方でも §3 により引き写しとして扱う。 **累計の数字が2つの出典で違うが、これは食い違いではない。** 2024年2月13日は「5つの版で」1600人超・71学級・84社・135回、2025年2月5日は「6つの版で」2千人近く・86学級・115社・166回であり、**数える範囲（版の数）が違う**（lessons BB）。discrepancies には並べていない。 **2023年12月11日の記事は事業そのものの記事ではない。** 欧州青年首都の年の企業との協働をまとめた記事の中で、Billennium の担当者の発言としてこの事業の名が出る。同じ記事にある9千人・400回の数字は**その年の取り組み全体のもの**であって、この事業の数字ではない。 **未来形と実現の区別（本文と funding_scale が寄りかかっているのは、2025年2月5日の zostaną zrealizowane（主語は Miasto Lublin）と przeznaczy、2025年4月23日の zostaną zrealizowane（主語は Wydział Zieleni i Gospodarki Komunalnej）と otrzyma、締めくくりの会の będą zaprezentowane、そして現在形の projektują である。**同じ zostaną zrealizowane が2本にあり、主語だけが違う**——これが funding_scale で出し手を書き分けている根拠である）**——2025年2月5日の記事の3万ズウォティは「przeznaczy」（充てる）、6月の締めくくりの会と市の模型は2025年4月23日の記事で「będą zaprezentowane」（示される）と書かれており、いずれも掲載日より後の予定である。本文と timeline では予定として書いた。 事業の総額はどの出典にも無い。**「無い」と書く前に4本のキャッシュを zł／budżet／koszt／mln／tys. で検索して確かめた**（lessons U）。 name_local は表記が割れる。見出しでは `Przedsiębiorcze Dzieciaki`、地の文では `Przedsiębiorcze dzieciaki` が使われるので name_variants に入れた。","last_verified":"2026-08-20","sections":{"何をしたか":"6〜10歳の子どもに向けた事業で、出典は2018年から行われていると書いている。進めているのはルブリン市とマリ・キュリー＝スクウォドフスカ大学（UMCS）教育心理学部である。市内の幼稚園と小学校が対象で、およそ350人が無料の講座に出る。講座は12〜15の組に分かれ、1つの組は5回の集まりからできている。進めるのは研修を受けた同学部の学生で、ビジネスマン山羊という登場人物が全回に付き添う。子どもは市内の企業や創造産業の担い手を訪ね、ポーランド国立銀行が貯蓄と中央銀行の働きの回を受け持つ。参加校は学校まわりの緑の空間の案を競う催しにも出られる。2025年2月の記事は、上位2案を市が実現し各案に3万ズウォティを充てると未来形で書き、同年4月の記事は、参加校が案を作っていると現在形で書いたうえで、勝つ2案（Dwie zwycięskie koncepcje）を市の緑地・公共事業局が実現し各案が3万ズウォティの助成を受けると未来形で書いている。どの案が選ばれたかを書いた出典も、実現したかどうかを書いた出典も無い。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"pt-0001","name":"片岩の集落27を1つの名前で束ね直した","name_local":"Aldeias do Xisto","country":"ポルトガル","region":"中部地方（ピニャル・インテリオル）","municipality":"Pinhal Interior（13〜21自治体にまたがる）","population_current":180000,"population_scale":"5万〜25万","purpose":"誇りをつくる","theme":"空き家・空き店舗・遊休不動産","start_year":null,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"ADXTUR - Agência para o Desenvolvimento Turístico das Aldeias do Xisto","funding_scale":"セルタン町の例で、19棟の民間建物の改修に6万ユーロ（所有者負担の7割を補助）。それ以前に教会前広場と市場周辺の工事で24.5万ユーロ（2005年時点）。事業全体の総額は確認できていない","component_types":"hybrid","components":["空き家の修復費を7割補助した","27の集落を1つの名前で束ねた","片岩の伝統的な建て方を残した"],"discrepancies":[{"field":"参加自治体の数","values":[{"value":20,"source_url":"https://observador.pt/2020/07/23/aldeias-do-xisto-assinalam-o-melhor-junho-de-sempre/","published":"2020-07-23"},{"value":21,"source_url":"https://www.noticiasaominuto.com/economia/1791588/aldeias-do-xisto-exploracao-do-destino-dark-sky-sera-potenciada","published":"2021-07-08"}]}],"spotcheck_note":"出典5本のうち4本は通信社 Lusa の配信を各紙が掲載したもの（Público も PÚBLICO/Lusa 名義）。\n掲載媒体は4社に分かれているが、取材した報道機関の数は見かけより少ない。ここは人が確認すること。\n","sources":[{"url":"https://www.publico.pt/2005/03/14/jornal/programa-aldeias-do-xisto-recupera-19-edificios-na-serta-11137","title":"Programa Aldeias do Xisto recupera 19 edifícios na Sertã","outlet":"PÚBLICO","published":"2005-03-14","language":"pt"},{"url":"https://www.dinheirovivo.pt/economia/turismo-mantem-tendencia-de-crescimento-no-centro-12680794.html","title":"Turismo mantém tendência de crescimento no Centro","outlet":"Dinheiro Vivo","published":"2017-12-17","language":"pt"},{"url":"https://www.noticiasaominuto.com/lifestyle/1114661/aldeias-do-xisto-na-plataforma-visit-portugal","title":"Aldeias do Xisto na plataforma Visit Portugal","outlet":"Notícias ao Minuto","published":"2018-11-08","language":"pt"},{"url":"https://observador.pt/2020/07/23/aldeias-do-xisto-assinalam-o-melhor-junho-de-sempre/","title":"Aldeias do Xisto assinalam o \"melhor junho de sempre\"","outlet":"Observador","published":"2020-07-23","language":"pt"},{"url":"https://www.noticiasaominuto.com/economia/1791588/aldeias-do-xisto-exploracao-do-destino-dark-sky-sera-potenciada","title":"Aldeias do Xisto: Exploração do destino Dark Sky será potenciada","outlet":"Notícias ao Minuto","published":"2021-07-08","language":"pt"}],"unknown_fields":["start_year","elapsed_years"],"latest_source_year":2021,"elapsed_years":null,"follow_up":"濃い","follow_up_note":"2005年3月にセルタン町で19棟の修復に7割の補助が付いた。2018年11月には国の観光公式サイトに載り、2019年8月には星空の暗さで国際認証を受けた。2020年7月には過去最良の6月と発表され、滞在が2〜3泊から5〜6泊に伸びたとされる。2021年時点で21自治体・100を超える民間事業者が参加している。","timeline":[{"year":2005,"event":"3月14日、セルタン町が19棟の修復を発表した。所有者は費用の7割の補助を受ける","source_url":"https://www.publico.pt/2005/03/14/jornal/programa-aldeias-do-xisto-recupera-19-edificios-na-serta-11137"},{"year":2017,"event":"12月、6月のペドロガン・グランデの火災から半年後に、10月の中部地域の宿泊が前年同月比20.4%増と報じられた","source_url":"https://www.dinheirovivo.pt/economia/turismo-mantem-tendencia-de-crescimento-no-centro-12680794.html"},{"year":2018,"event":"11月8日、国の観光公式プラットフォーム Visit Portugal に掲載された","source_url":"https://www.noticiasaominuto.com/lifestyle/1114661/aldeias-do-xisto-na-plataforma-visit-portugal"},{"year":2020,"event":"7月23日、過去最良の6月と発表された。滞在日数が2〜3泊から5〜6泊に伸びたとされる","source_url":"https://observador.pt/2020/07/23/aldeias-do-xisto-assinalam-o-melhor-junho-de-sempre/"},{"year":2021,"event":"7月8日時点で21自治体と100を超える民間事業者が参加。2019年8月に Starlight 財団の国際認証を受けた星空観光を伸ばす方針が示された","source_url":"https://www.noticiasaominuto.com/economia/1791588/aldeias-do-xisto-exploracao-do-destino-dark-sky-sera-potenciada"}],"last_verified":"2026-08-16","sections":{"何をしたか":"ポルトガル中部の山間地ピニャル・インテリオルに散らばる片岩（xisto）造りの集落を、1つのネットワークとして束ね直した事業。空き家の修復費を所有者に補助し（セルタン町の例で7割・19棟に6万ユーロ）、公共空間の整備と併せて集落の見た目と使い方を揃えていった。2005年時点では13自治体23集落が対象で、運営は「ピニャル・インテリオル領域統合行動」が担っていた。のちに専門の公社 ADXTUR が引き継ぎ、2021年時点では21自治体27集落と100を超える民間事業者が参加している。**個々の集落を売るのではなく、共通の名前を作って一括で売った**点が特徴である。","誰が始めたか":"**先に動いたのは自治体であり、観光の専門組織は後から来た。**\n\n2005年3月14日の PÚBLICO（Lusa 配信）が伝えているのは、カステロ・ブランコ県セルタン町の議会が「Aldeias do Xisto」の継続を前日に発表したという事実である。**補助を受け取るのは自治体ではなく、公募に応じた建物の所有者である。** 同町の副議長 José Ramos Moreira は、19人の所有者が改修工事の費用について7割の補助を受けると述べ、事業はとくに象徴的な建造物の修復に向けられ、劣化を防いで観光を呼び込むためだと説明している。\n\n**この時点で束ねる主体は観光組織ではなかった。** 同記事によれば、事業は中部地域の地域振興計画（Programa Operacional da Região Centro）の一部で、対象は**ピニャル・インテリオル地域13自治体の23集落**、運営は「ピニャル・インテリオル領域統合行動（Acção Integrada de Base Territorial do Pinhal Interior）」が担っていた。同記事は、その領域が21自治体・51万ヘクタール・人口18万人にわたると書いている。\n\n**あとから観光の専門公社が引き継いだ。** 2018年11月8日の Notícias ao Minuto（Lusa 配信）以降、出典が名指しする主体は ADXTUR（Agência para o Desenvolvimento Turístico das Aldeias do Xisto）である。Observador 2020年7月23日は、ADXTUR がフンダン町バロカに本部を置き、ネットワークを率いていると書いている。**つまり順序は、地域振興計画の枠 → 領域統合行動が運営 → 各自治体が公募して所有者に補助 → ADXTUR がネットワークとして運営、である。**\n\n**新しい取り組みでも同じ順序が繰り返されている。** 2021年7月8日の Notícias ao Minuto によれば、星空観光「Dark Sky」を始めたのはパンピリョーザ・ダ・セラ町で、副議長 Jorge Alves Custódio は、町が最初の一歩を踏み出して協力者を呼んだと述べている。技術面はアヴェイロ大学、観光面は ADXTUR、広域はコインブラ地域自治体間共同体、認証面は Dark Sky 協会が担う形になった。同氏によれば、10年ほど前にアヴェイロ大学が同町で観測条件を見つけ、機材を設置したところ、星空を求めて訪れる人が多いことが分かったという。","いくらかかったか":"**事業全体の総額は確認できなかった。** 出典から取れるのは、初期の1つの町の1年分の額と、災害時の資金枠の上限だけである。\n\n- **セルタン町の2005年の分は、19棟の民間建物の改修に6万ユーロ。** 所有者は費用の7割の補助を受ける（PÚBLICO 2005年3月14日）。**直す対象が私有の建物であるため、費用は所有者と補助の分担になっている**\n- **それ以前に、同町ペドロガン・ペケーノで公共空間の工事に24万5,000ユーロ。** 教会前広場（adro）と市営市場の周辺である（同記事）\n- **原資は地域振興計画である。** 同記事は事業が Programa Operacional da Região Centro に組み込まれていると書いている。**個々の自治体が単独で用意した予算ではない**\n- **災害時には別の線が引かれた。** 2017年12月17日の Dinheiro Vivo（Lusa 配信）によれば、6月と10月の火災のあと、被害を受けた企業向けに上限15万ユーロの流動性枠（最大75%が返済不要）が設けられ、河川浜・歩道・その他の観光施設の修復には上限40万ユーロの枠が置かれた（自治体の申請にもとづく）。特別条件の銀行融資枠も加えられ、復旧計画の作成は中部地域調整開発委員会（CCDRC）が支援した。国際的な販促キャンペーンには欧州緊急基金の資金が充てられた\n- **回収の側は直販に寄せている。** 2018年11月8日の Notícias ao Minuto によれば、ADXTUR は予約サイト「Bookinxisto」を国の観光公式プラットフォーム Visit Portugal に載せた。同社の Rui Simão は、これが仲介者を通さずネットワークの提携先に直接つながる販売経路であり、5言語で提供されると説明している\n\n`funding_scale` にはセルタン町の例と2005年時点の公共空間工事の額だけを入れ、事業全体の総額は確認できていないと明記した。","真似するなら最低何が必要か":"1. **共通の名前と、それを持つ主体。** 個々の集落を売るのではなく「Aldeias do Xisto」という1つの名前で束ね、その名前で予約まで受ける。名前を管理する主体（ADXTUR）が自治体の外側に置かれている\n2. **私有の建物に届く補助の仕組み。** セルタン町の例では、公募に応じた所有者が費用の7割を受け取る形になっている。**直すのは町の建物ではなく人の家である**という前提から設計されている\n3. **自治体をまたぐ枠組み。** 2005年時点で13自治体23集落、2020年以降は27集落と20〜21自治体、民間事業者100超（下の「今どうなっているか」参照）。**1つの町では成立しない規模で設計されている**\n4. **自前の予約・販売の経路。** Bookinxisto は5言語で、仲介を挟まない直販として説明されている。2020年には「Aldeias do Xisto の受付」と呼ぶ仮想の窓口を置き、予約が入るとその地域で行ける場所・歩ける道・混み具合・推奨時間を客に伝える形にした（Observador 2020年7月23日）\n5. **災害に当たったときの資金の線。** 2017年の火災では、上限15万ユーロ・最大75%返済不要の流動性枠と、上限40万ユーロの修復枠が用いられた。**山間の集落を束ねる事業は火災に当たる**\n6. **土地固有の条件を認証まで持っていく道筋。** Notícias ao Minuto 2021年7月8日によれば、この地域は年264日が晴天で全国平均を上回り、2019年8月に Starlight 財団が「Dark Sky Aldeias do Xisto」に国際認証を与えた。認証の取得には大学（技術）と協会（認証）の両方が加わっている\n\n**確認できないもの**は、事業全体の総額、**開始年そのもの**（下記）、27集落で最終的に何棟が直されたか、ADXTUR の設立年と設立の経緯、補助の原資に占める EU 資金の割合、Spab のような住民出資の器があるかどうかである。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、2021年7月8日の Notícias ao Minuto の記事である。最新の出典が5年前であり、それ以降の状況は確認できていない。**\n\n2021年7月時点で同記事が伝えているのは、ADXTUR が中部地域内陸の**27集落からなるネットワークを率い、21自治体と100を超える民間事業者が参加している**ことである。ただし**同記事はこの数字の出所を「このネットワークのサイト」と明記している**ので、取材で確かめた数ではない。同日22時、パンピリョーザ・ダ・セラ町ファジャン集落の教会前広場で、町・コインブラ地域自治体間共同体・ADXTUR・Dark Sky 協会の間で協定が署名された。\n\n**参加自治体の数は出典間で食い違っている。** Observador は2020年7月23日に**20自治体**と書き、Notícias ao Minuto は2021年7月8日に**21自治体**と書いている（`discrepancies` に並置した）。1年間で1つ増えたのか、数え方が違うのかは、この2本からは判断できない。\n\n2020年7月の Observador（Lusa 配信）によれば、ADXTUR の事務局長 Rui Simão は同年6月を過去最良の6月だとし、その要因として人口密度の低い安全な行き先であることと、提供が多様であることを挙げた。**予約の性格も変わったとされる。** 平均滞在は2〜3泊から5〜6泊に伸び、ホテルを除く宿泊施設の多くが部屋単位ではなく一棟貸しに移り、プールとバーベキュー設備のある物件に需要が集まった。同記事は、この時期の需要が主に国内市場で、スペインからの需要も出始めたと書いている。\n\n**開始年は確認できていない。** どの出典も、この事業がいつ始まったかを書いていない。2005年3月の PÚBLICO は「継続」を伝える記事であって開始を伝える記事ではないため、`start_year` は `null` のまま `unknown_fields` に申告し、`follow_up` は最古年（2005年）と最新年（2021年）の差で判定している。\n\n**出典の性格について明記しておく。** **5本のうち4本は通信社 Lusa の配信を各紙が掲載したものである**（PÚBLICO も PÚBLICO/Lusa 名義、Dinheiro Vivo は Dinheiro Vivo/Lusa、Notícias ao Minuto の2本は Lusa 名義、Observador は Agência Lusa 名義）。**掲載媒体は4社に分かれているが、取材した報道機関の数は見かけより少ない。** また Observador と Notícias ao Minuto は Claude による取得を robots.txt で拒否しているドメインで、本文は以前に取得したものを使っている（再取得はしていない）。**この事業についての否定的な報道は、今回探した範囲では見つからなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"6万ユーロ","currency":"EUR","value":60000,"jpy":11136000},{"raw":"24万5,000ユーロ","currency":"EUR","value":245000,"jpy":45472000},{"raw":"15万ユーロ","currency":"EUR","value":150000,"jpy":27840000},{"raw":"40万ユーロ","currency":"EUR","value":400000,"jpy":74240000}],"sample":true},{"id":"ro-0001","name":"若者が出した企画を市民のネット投票で選び、市が1件ずつ資金を出す仕組みを2015年から続けている","name_local":"Com’ON Cluj-Napoca","name_variants":["Com'ON Cluj-Napoca"],"country":"ルーマニア","region":"クルージュ県","municipality":"クルージュ＝ナポカ市","population_current":286598,"population_scale":"25万超","purpose":"住民が決める","theme":"デジタル・情報発信","start_year":2015,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"運営は Grupul PONT。Federația Tinerilor din Cluj と組んで行なう。資金はクルージュ＝ナポカ市役所と市議会が出す","component_types":"soft","components":["若者3人以上の組で企画を出す","市民がネット投票で選ぶ","1件あたりの上限額を決めて配る","立場の弱い組に別枠を設ける","選ばれた組が自分で実施する","企画づくりの相談役を置く"],"sources":[{"url":"https://www.clujlife.com/2018/1 ile-in-aplicare.html"},{"year":2018,"event":"11月12日、第3回の募集が始まったことが伝えられた。記事は、11月9日から12月15日まで受け付けること、最低50件が市役所と市議会の資金で実施されること、14歳から35歳の3人以上の組で応募すること、1件あたりの企画予算の上限が9,000レイで市の負担が最大4,500レイであること、立場の弱い若者の枠から最低5件が選ばれることを書いている","source_url":"https://www.clujlife.com/2018/11/12/incepe-inscrierea-de-proiecte-la-comon-cluj-napoca-19/"},{"year":2024,"event":"12月、Revista Transilvană de Ştiinţe Administrative に Adelina Maria Pop の論文が載った。抄録は、応募と実施を通じた参加が一定して推移したわけではないこと、企画の多くが参加と学びの活動であったこと、回の半数が市の中心部で行なわれ場所の大半が公共空間であったこと、2024年に初めて私的な空間を選ぶ傾向が見られたことを書いている（本文は取得しておらず、抄録の範囲で書いている）","source_url":"https://rtsa.ro/rtsa/index.php/rtsa/article/view/653"},{"year":2025,"event":"10月15日、この回では123件の応募のうち52件が資金を得ることが伝えられた。投票は9月25日から10月9日までネット上で行なわれ、4,326人が19,149票を投じた。応募は3つの枠に分けられ、立場の弱い組に3件、14歳から18歳の組に13件、それ以外に36件が割り当てられた","source_url":"https://cluj.com/articole/52-de-initiative-propuse-de-tineri-vor-prinde-viata-in-cadrul-comon-cluj-napoca-2025/"},{"year":2026,"event":"6月21日、この年の回が始まったことが伝えられた。記事は、応募が6月19日から7月15日まで、投票が7月28日から8月18日まで行なわれること、票を集めた上位50件が1件あたり最大5,000レイの支援を受ける予定であることを書いている（掲載は投票前で、結果を報じた出典は確認できていない）","source_url":"https://www.napocanews.ro/2026/06/comon-cluj-napoca-a-dat-startul-tinerii-clujeni-pot-primi-pana-la-5-000-de-lei-pentru-a-si-pune-ideile-in-aplicare.html"}],"last_verified":"2026-08-18","sections":{"何をしたか":"ルーマニアのクルージュ＝ナポカ市で、**若者が出した企画を市民のネット投票で選び、選ばれた企画に市が資金を出す仕組み**が2015年から回を重ねている。\n\n応募できるのは3人以上の若者の組で、選ばれた組は自分たちの手で企画を実施する。応募は立場や年齢で3つの枠に分けられ、枠ごとに採択数が決まっている。\n\n2018年11月に募集が始まった回では、1件あたりの企画予算の上限が9,000レイ、うち市の負担が最大4,500レイとされた。2025年の回では123件の応募から52件が選ばれ、4,326人が19,149票を投じている。運営は Grupul PONT が担い、資金は市役所と市議会が出す。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"tr-0002","name":"市が「困っている」と認めた世帯が水道・ガスの請求書をサイトに置き、払いたい人が選んで肩代わりする","name_local":"Askıda Fatura","name_variants":["askıda fatura","İBB Askıda Fatura","Askıda Fatura Platformu"],"country":"トルコ","region":"イスタンブール県","municipali sı devam ediyor","outlet":"BirGün","published":"2024-08-08","language":"tr","from_operator":false},{"url":"https://www.birgun.net/haber/imamoglu-cagri-yapti-askida-fatura-kampanyasina-binlerce-bagis-yapildi-610329","title":"İmamoğlu çağrı yaptı, 'Askıda Fatura' kampanyasına binlerce bağış yapıldı","outlet":"BirGün","published":"2025-03-26","language":"tr","from_operator":false},{"url":"https://t24.com.tr/haber/ekrem-imamoglu-nun-cezaevinden-askida-fatura-cagrisina-binlerce-kisiden-destek,1228486","title":"Ekrem İmamoğlu'nun cezaevinden \"Askıda Fatura\" çağrısına binlerce kişiden destek!","outlet":"T24","published":"2025-03-26","language":"tr","from_operator":false}],"context_sources":[],"unknown_fields":["population_current"],"latest_source_year":2025,"elapsed_years":5,"follow_up":"濃い","follow_up_note":"2021年9月には2020年5月の開始からの累計で払われた請求書が28万件・4,100万トルコリラと報じられ、2024年8月には開設以来およそ1億5,500万トルコリラの寄付が集まったと報じられた。2025年には İmamoğlu らに向けられた容疑の1つの対象にされたと書かれている。","timeline":[{"year":2020,"event":"5月4日、İBB 市長 Ekrem İmamoğlu が、感染症のために家にいるほかない人や職を失った人と支え合うため「askıda fatura」の仕組みを始めたと述べたと bianet が伝えた。İBB が出した文書の中で İmamoğlu は、İBB が困っていると認めた世帯が İBB のサイトに入って İSKİ と İGDAŞ の水道・ガスの請求書の情報を書き込むこと、払って善いことをしたい市民は水とガスで別々の価格帯から選んで払えることを述べている。İmamoğlu は、イスタンブールでは3か月のあいだ水道料金の支払いが先送りされたが、3か月後にその請求書は手元の請求書と一緒に払うことになる、ガスについては法律上先送りができなかった、とも述べている","source_url":"https://bianet.org/haber/ibb-askida-fatura-uygulamasi-baslatti-223791"},{"year":2020,"event":"5月6日、BirGün が、İmamoğlu の指示で動き出した「Askıda Fatura」の支払いの仕組みが開いたと伝えた。İmamoğlu は前日の説明で、24時間で困っている8,691世帯が申し込んだと述べていた、と書かれている。払うのに困っている人への支援を自治体が仲立ちする形だとされる","source_url":"https://www.birgun.net/haber/askida-fatura-uygulamasinin-odeme-sistemi-acildi-299819"},{"year":2020,"event":"5月7日、Sözcü が、İBB 報道担当の Murat Ongun が Twitter で出した数字として、払われた請求書は合わせて4万1,883件、払われた額は502万7,092トルコリラに上がったと伝えた。Ongun は Twitter で、支払いの仕組みに国外からの攻撃があったことも知らせたと書かれている。記事は、İBB がこの仕組みを5月4日に始めたとしている","source_url":"https://www.sozcu.com.tr/askida-fatura-uygulamasi-ile-41-bin-883-ailenin-faturasi-odendi-wp5798356"},{"year":2021,"event":"9月19日、BirGün が ANKA の記事として、2020年5月の開始からこの時点までに払われた請求書が28万件にあたる4,100万トルコリラに達したと伝えた。仕組みは「Aile Destek Paketi」「Anne-Bebek Destek Paketi」「Eğitim Destek Paketi」へと広がったとされる。事業を実施したのは İBB Bilgi İşlem Daire Başkanlığı で、米国の IDC の催しで6つ目の賞を受けたと書かれている。同局の Erol Özgüner は、感染症の前に社会福祉の支援を必要としていた世帯の数が6倍になって25万に達したと述べている","source_url":"https://www.birgun.net/haber/ibb-nin-askida-fatura-dayanismasinda-41-milyon-liraya-ulasildi-359219"},{"year":2024,"event":"8月8日、BirGün が ANKA の記事として、İBB が2020年につくったオンラインの寄付の場である Askıda Fatura が続いていると伝えた。開設からこの時点までにおよそ1億5,500万トルコリラの寄付が集まり、困っている人の水道とガスの請求書の支払いに充てられているとされる。2021年から開いている教育支援の枠には4万3千人の寄付者が1,400万トルコリラを超える寄付をし、大学生には一度かぎり750トルコリラが İstanbulkart に振り込まれて本人に SMS で知らされると書かれている。ほかに家族向け、0〜4歳の子を持つ母親向け、移動のための枠があるとされる","source_url":"https://www.birgun.net/haber/ibb-nin-egitim-icin-askida-fatura-uygulamasi-devam-ediyor-550661"},{"year":2025,"event":"3月26日、BirGün が、2020年に始まったこの事業が Ekrem İmamoğlu と関係者に向けられた容疑の1つの対象にされたと伝えた。İmamoğlu は自身の交流サイトで「Askıda Fatura da suçmuş」と述べ、余裕のある人は収入の少ない市民の請求書を払ってほしいと呼びかけたとされる。呼びかけのあと短い間に、数千の寄付する人から合わせて93万6,947トルコリラの請求書の支払いがあったと書かれている","source_url":"https://www.birgun.net/haber/imamoglu-cagri-yapti-askida-fatura-kampanyasina-binlerce-bagis-yapildi-610329"},{"year":2025,"event":"3月26日、T24 が、İmamoğlu が刑務所から行った呼びかけに数千人が応じ、合わせて93万6,947トルコリラの請求書が払われたと伝えた。記事は、時とともに「Aile Destek Paketi」「Anne-Bebek Destek Paketi」「Eğitim Destek Paketi」「Ulaşım Destek Paketi」「Yuvam Destek Paketi」「Emekliye Pazar Desteği」といった枠が足されたと書いている","source_url":"https://t24.com.tr/haber/ekrem-imamoglu-nun-cezaevinden-askida-fatura-cagrisina-binlerce-kisiden-destek,1228486"}],"editor_notes":"出典は4つの発行元（bianet・BirGün・Sözcü・T24）にまたがる。**同じ発表に由来するものが2組ある。** ①2025年3月26日の BirGün と T24 は、金額（93万6,947トルコリラ）も言い回しもほぼ同じで、共通の配布文にもとづくと見られる。§3 では1本に丸める必要がある。②2021年9月19日と2024年8月8日の BirGün は本文に「Kaynak／ANKA」または（ANKA）と明記があり、通信社の配信である。自前の取材と読めるのは bianet 2020年5月4日（İBB の文書での説明を引いたもの）と Sözcü 2020年5月7日（İBB 報道担当の投稿を引いたもの）だが、いずれも İBB 側の発信を受けた記事である。**独立した検証や批判的な記述は7本のどこにも無い。** 2025年の2本は İBB 寄りの評価語（dünyanın takdir ettiği／haksız suçlamalar）を地の文に置いているので、事実として採らず、容疑の対象にされたという事実だけを timeline に書いた。**Sözcü 2020年5月7日は記事の中で数え方が割れている**——見出しと小見出しは「4万1,883（および4万1,460）世帯の請求書が払われた」と世帯で数え、本文は「toplam ödenen fatura 41 bin 883」＝払われた請求書の件数と書いている。1本の中の割れなので discrepancies には並べず、timeline には本文の表記（請求書の件数）を採った。**name_local の一般性に注意**——askıda（吊るす）はトルコ語の慣習を指す普通名詞で、他の自治体や商店の同名の取り組みの記事が同じ文字列で当たりうる。第1層を通っても、İBB の事業かどうかを本文で確かめること。2021年の4,100万トルコリラは**払われた請求書の額**（BirGün 2021年9月19日の ödenen fatura miktarı）、2024年のおよそ1億5,500万トルコリラは**集まった寄付の額**（BirGün 2024年8月8日の bağışın toplandığı）で、**数えているものが違う**（時点も違う）。この2つが同じ系列の推移だとは、出典のどこにも書かれていない。したがって食い違いではない。stub のため「何をしたか」以外の4節は空のまま置いている。","last_verified":"2026-08-20","sections":{"何をしたか":"イスタンブール大都市自治体（İBB）が2020年5月に始めた、オンラインの寄付の場である。İBB が困っていると認めた世帯が、İBB の事業体である İSKİ と İGDAŞ の水道・ガスの請求書の情報をサイトに書き込み、払って善いことをしたい市民が置かれた請求書から選んで肩代わりする。開始の日に市長が示した説明では、水とガスで別々の価格帯から選べるとされていた。5月6日に支払いの仕組みが開いたと BirGün は伝えており、その前日の説明で市長は、24時間で困っている8,691世帯が申し込んだと述べていた。のちに家族向け、母子向け、教育、移動などの枠が足された。2021年9月には2020年5月の開始からの累計で払われた請求書が28万件・4,100万トルコリラと報じられ、2024年8月には開設以来およそ1億5,500万トルコリラの寄付が集まったと報じられている。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"ua-0001","name":"長く空いていた寮や幼稚園を直して、戦争で家を失った人の長期の住まいにした","name_local":"КО-ХАТИ","name_variants":["Ко-Хати","Ко-хати","CO-HATY"],"country":"ウクライナ","region":"イヴァーノ＝フランキーウシク州","municipality":"イヴァーノ＝フランキーウシク","population_current":257477,"population_scale":"25万超","purpose":"住む人を増やす・戻す","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2022,"end_year":null,"status_current":"継続中","actor_type":"NPO","lead_actor":"METALAB（イヴァーノ＝フランキーウシクの都市ラボ）と Urban Curators（キーウ）。のちに慈善基金「КО-ХАТИ」","component_types":"hard","components":["空いた建物を探して住戸に作り替える","自治体と組んで対象の建物を選ぶ","間取りを引き直し家具まで入れる","避難した人が修繕の担い手になる","入居は自治体が受け持つ"],"sources":[{"url":"https://report.if.ua/statti/ko-haty-aby-zhyty-yak-volontery-u-frankivsku-ta-kamyanci-peretvoryuyu
