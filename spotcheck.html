*弱みの側も出典にある。** El Colombiano（2022-12-13）は、賃貸が主たる収入源であるのに\n入居率が感染症の流行前の水準に戻っていないという運営側の説明を載せ、\n2019年は70社で2,200人の雇用だったのに対し2022年は55社で3,316人だったと比較している。\n","latest_source_year":2024,"elapsed_years":15,"follow_up":"濃い","follow_up_note":"2009年に設けられ、2022年には55社の進出と3,316人の雇用が報じられた。2023年には2009年からの累計で22,486人の雇用という数字が出て、2024年の15年目には市長が2,000社超の創業を挙げた。","timeline":[{"year":2009,"event":"メデジン市が Corporación Ruta N を設けた。企業・大学・行政をつなぐ位置づけで、科学・技術・イノベーションを担う","source_url":"https://www.elcolombiano.com/tecnologia/de-nada-sirve-el-proyecto-si-la-gente-no-entiende-la-tecnologia-los-desafios-de-ruta-n-en-sus-primeros-15-anos-MM25922871"},{"year":2022,"event":"12月、この年の誘致は55社・雇用3,316人だったと報じられた。運営側は、2019年は70社で2,200人だったので少ない社数でより多くの雇用が出ていると説明する一方、賃貸の入居率が流行前の水準に戻っていないことを課題に挙げた。地元の技術系企業804社の支援と、約140件の種銭の交付も行なった","source_url":"https://www.elcolombiano.com/negocios/ruta-n-atrajo-55-empresas-en-2022-y-propicio-la-creacion-de-3316-empleos-NO19609721"},{"year":2023,"event":"4月、2009年からの累計として、467社の技術系企業を通じて22,486人の雇用に寄与したという数字が報じられた","source_url":"https://www.semana.com/economia/emprendimiento/articulo/ruta-n-aporto-22486-empleos-en-startups-y-empresas-de-base-tecnologica-en-medellin/202318/"},{"year":2024,"event":"11月、15年目の催しで市長フェデリコ・グティエレスが、科学・技術・イノベーションへの市の投資が2014年の域内総生産比0.7%から2%超になったと述べ、2,000社超の創業と25,000人超の雇用、10億ドル超の外国投資を挙げた。拠点には300社超が入居している","source_url":"https://www.elcolombiano.com/tecnologia/de-nada-sirve-el-proyecto-si-la-gente-no-entiende-la-tecnologia-los-desafios-de-ruta-n-en-sus-primeros-15-anos-MM25922871"}],"last_verified":"2026-08-18","image":{"url":"https://www.semana.com/resizer/v2/RBICCUDMLNANFLHZAKUXSNCOG4.jpg?auth=73da01325f8278ed45d0679fa157bc6ea9085f45ec6ca6cf5e6ffe17ee35284d&smart=true&quality=75&width=1280&height=720","type":"photo","relevance_confirmed":true,"credit":"Semana","source_url":"https://www.semana.com/economia/emprendimiento/articulo/ruta-n-aporto-22486-empleos-en-startups-y-empresas-de-base-tecnologica-en-medellin/202318/"},"sections":{"何をしたか":"コロンビアのメデジンで、**市が技術系の企業と起業を集めるための法人と拠点をつくった。**\n\nエル・コロンビアーノの2024年の記事によれば、Corporación Ruta N が設けられたのは2009年で、企業・大学・行政をつなぐ位置づけを与えられた。市街地に建てた拠点には、2024年時点で300社を超える企業が入居している。\n\nやっていることは誘致だけではない。エル・コロンビアーノが2022年に伝えたところでは、地元の技術系企業804社の支援と、約140件の種銭の交付を同じ年に行なっている。**拠点の賃料が自前の主たる収入源になっている**点も、運営側の説明として記事に出てくる。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"co-0004","name":"斜面の集落と谷底の地下鉄をロープウェイでつなぎ、同じ運賃で乗り継げるようにした","name_local":"Metrocable","name_variants":["Metrocable de Medellín","Línea K"],"country":"コロンビア","region":"アンティオキア県","municipality":"メデジン","population_current":2634570,"population_scale":"25万超","purpose":"歩けるようにする","theme":"交通・道路・駅","start_year":2004,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"メデジン地下鉄（Metro de Medellín）とメデジン市役所。World Resources Institute（2019年4月4日）によれば、2000年にルイス・ペレス氏が市長に選ばれたあと、市が公共交通の当局である Metro de Medellín と資金の取り決めを結び、設計と建設にあたった","component_types":"hard","components":["谷底の駅と斜面の集落を索道で結ぶ","地下鉄と同じ運賃で乗り継げる","駅の周りの公共空間をつくり直す","建設の前に暮らし方を聞き取る","大がかりな点検で長く止める"],"sources":[{"url":"https://www.brookings.edu/articles/reducing-urban-violence-lessons-from-medellin-colombia/","title":"Reducing Urban Violence: Lessons from Medellín, Colombia","outlet":"Brookings Institution","published":"2011-02-14","language":"en","from_operator":false},{"url":"http://habitat.aq.upm.es/boletin/n54/ajdav.html","title":"Pobreza, participación y Metrocable. Estudio del caso de Medellín","outlet":"Boletín CF+S 54","published":2013,"language":"es","from_operator":false,"source_type":"academic"},{"url":"https://www.wri.org/insights/transformaciones-urbanas-en-medellin-el-metrocable-conecta-la-ciudad-de-diversas-maneras","title":"Transformaciones Urbanas: En Medellín el Metrocable conecta la ciudad de diversas maneras","outlet":"World Resources Institute","published":"2019-04-04","language":"es","from_operator":false},{"url":"https://www.elcolombiano.com/medellin/metro-medellin-accidente-metrocable-mantenimiento-sindicato-metro-OG24880916","title":"Sindicato del Metro de Medellín se queja de que el mantenimiento del sistema se está tercerizando","outlet":"El Colombiano","published":"2024-06-28","language":"es","from_operator":false},{"url":"https://journals.vilniustech.lt/index.php/JAU/article/view/17793","title":"Transforming Medellín: architecture and urban design as agents of social change","outlet":"Journal of Architecture and Urbanism","published":"2024-07-08","language":"en","from_operator":false,"source_type":"academic"},{"url":"https://www.elcolombiano.com/medellin/metrocable-linea-k-metro-de-medellin-cumple-20-anos-CA25166664","title":"Línea K cumple 20 años como el primer cable aéreo comercial del mundo","outlet":"El Colombiano","published":"2024-08-06","language":"es","from_operator":false},{"url":"https://www.elcolombiano.com/medellin/metrocable-medellin-dano-en-dos-lineas-BF27664467","title":"¿Qué pasa con el metrocable de Medellín, que en dos días han suspendido el servicio dos líneas?","outlet":"El Colombiano","published":"2025-06-10","language":"es","from_operator":false},{"url":"https://www.elcolombiano.com/medellin/metrocable-santo-domingo-mantenimiento-octubre-2025-GD30116167","title":"Atención: Recuerde que esta semana el Metrocable de Santo Domingo está en mantenimiento","outlet":"El Colombiano","published":"2025-10-20","language":"es","from_operator":false}],"context_sources":[{"url":"https://www.dane.gov.co/files/censo2018/proyecciones-de-poblacion/Municipal/DCD-area-proypoblacion-Mun-2020-2035-ActPostCOVID-19.xlsx","title":"DANE「Proyecciones de población municipal 2020-2035（感染症後の更新）」（メデジン市 2025年 2,634,570人）"}],"unknown_fields":[],"discrepancies":[{"field":"開業の日付","values":[{"value":"7月30日の式で正式に開いたが、営業の運行が始まったのは8月7日だと書いている","source_url":"https://www.elcolombiano.com/medellin/metrocable-linea-k-metro-de-medellin-cumple-20-anos-CA25166664","published":"2024-08-06"},{"value":"2004年に Metro de Medellín が Metrocable を開いたとだけ書いており、日付は書いていない","source_url":"https://www.wri.org/insights/transformaciones-urbanas-en-medellin-el-metrocable-conecta-la-ciudad-de-diversas-maneras","published":"2019-04-04"}]}],"latest_source_year":2025,"elapsed_years":21,"follow_up":"濃い","follow_up_note":"2004年8月7日に営業を始め、2024年8月に20年を迎えた。20年目の2024年6月26日にキャビンが落ちて1人が亡くなり、労働組合が保守の外注を問題にし、会社が反論している。2025年にも技術の不具合と大がかりな点検が報じられた。","timeline":[{"year":2004,"event":"7月30日の式で正式に開き、8月7日に営業の運行が始まったと、20年後の記事が書いている","source_url":"https://www.elcolombiano.com/medellin/metrocable-linea-k-metro-de-medellin-cumple-20-anos-CA25166664"},{"year":2004,"event":"最初の路線が開いたとき、4万人を超える住民と接して使い方を伝えたと WRI が書いている","source_url":"https://www.wri.org/insights/transformaciones-urbanas-en-medellin-el-metrocable-conecta-la-ciudad-de-diversas-maneras"},{"year":2011,"event":"2月、公共財の配り方は際立っているのに殺人と暴力がふたたび増えていると、現地を歩いた研究者が書いた","source_url":"https://www.brookings.edu/articles/reducing-urban-violence-lessons-from-medellin-colombia/"},{"year":2019,"event":"4月、Metrocable は3路線が動き2路線が建設中の状態だと WRI が書き、WRI Ross Prize for Cities の最終候補になったと伝えている","source_url":"https://www.wri.org/insights/transformaciones-urbanas-en-medellin-el-metrocable-conecta-la-ciudad-de-diversas-maneras"},{"year":2024,"event":"6月26日未明に K 線のキャビン2台がぶつかって1台が落ち、1人が亡くなり20人が負傷したと報じられた","source_url":"https://www.elcolombiano.com/medellin/metro-medellin-accidente-metrocable-mantenimiento-sindicato-metro-OG24880916"},{"year":2024,"event":"8月、20年で2億6,000万人を超える人が乗ったと会社が示したと報じられた","source_url":"https://www.elcolombiano.com/medellin/metrocable-linea-k-metro-de-medellin-cumple-20-anos-CA25166664"},{"year":2025,"event":"6月、J 線が約5時間、K 線が約30分止まり、組合の長が保守のやり方を問題にしていると報じられた","source_url":"https://www.elcolombiano.com/medellin/metrocable-medellin-dano-en-dos-lineas-BF27664467"},{"year":2025,"event":"10月、大がかりな予防の点検のため K 線の営業を止めていると報じられた","source_url":"https://www.elcolombiano.com/medellin/metrocable-santo-domingo-mantenimiento-octubre-2025-GD30116167"}],"last_verified":"2026-08-19","image":{"url":"https://files.wri.org/d8/s3fs-public/styles/1222x722/s3/wri-colombia-070_0.jpg?VersionId=hU6yXbPzb0OrEtzI70PGOw3fhA6FOOlm&h=10d202d3&itok=TSusXh5r","type":"photo","relevance_confirmed":true,"credit":"World Resources Institute","source_url":"https://www.wri.org/insights/transformaciones-urbanas-en-medellin-el-metrocable-conecta-la-ciudad-de-diversas-maneras"},"sections":{"何をしたか":"コロンビア・メデジンで、**谷底を走る地下鉄の駅と、斜面に広がる低所得の集落を、索道（ロープウェイ）で結んだ**取り組み。\n\nEl Colombiano（2024年8月6日）によれば、最初の路線である K 線は**93台のキャビンと2.07キロの延長**を持ち、**1・2区の1日2万5,000人を運ぶものとして構想された**。Santo Domingo 駅から、地下鉄 A 線の Acevedo 駅までを結ぶ。同記事によれば、**2024年にはその平均が1日4万5,000人になったと見積もられている。**\n\n**乗り換えの運賃を分けなかった。** 同記事は、2004年に K 線に入る料金が **1,800ペソで、地下鉄の全区間と同じだった**と書いている。World Resources Institute（2019年4月4日）は、**Metrocable が斜面の低所得地区と中心部・交通網をつなぐことで、2時間かかり切符が何枚も要った移動が、切符1枚・30分になった**と書いている。","誰が始めたか":"**市と、公共交通の当局が組んでいる。** World Resources Institute（2019年4月4日）によれば、1990年代に通された一連の憲法改正で、メデジン市が非正規の市街地を改善する事業を手がけられるようになった。**2000年にルイス・ペレス氏が市長に選ばれたあと、市は公共交通の当局である Metro de Medellín と資金の取り決めを結び、Metrocable の設計と建設にあたった。**\n\n**建設の前に、暮らし方を調べている。** 同記事によれば、Metro de Medellín の職員は集まりを開き、**最も貧しい地区での暮らし・移動・人づきあいの型についてデータを集めた。** これは、長く続いた暴力と行政の不在によって地域の結びつきが断たれていたことを理解し、乗り越えるためだったと同記事は書いている。\n\n**技術ではなく、政治と制度の側に説明を置く読み方がある。** Boletín CF+S（2013年）に載ったフリオ・ダビラ氏とディアナ・ダステ氏の論文は、**Metrocable の成りゆきは「その技術の新しさ・相対的な費用の低さ・既存の市街地をあまり壊さないこと・排出の少なさ」だけでは説明できず、それが行われた政治と制度の文脈に多くを負う**と述べている。同論文は、それを都市・社会・政治の根深い問題に一体で当たる事業であり、地域の側が望みを述べて近代化の努力に加わることができたものだと書いている。\n\n**周りの事業と一体で語られる。** Journal of Architecture and Urbanism（2024年7月8日）に載ったメニナート氏とマリニッチ氏の論文は、セルヒオ・ファハルド市長の政権（2003〜2007年）の中心にあったのが北東部の Proyecto Urbano Integral（PUI）であり、**Metrocable と、それに伴う公共空間がその PUI を強めたと述べている。** 同論文は、この資金が市営の公益企業 Empresas Públicas de Medellín（EPM）から出ており、**国際的な借入に頼らずに済んだ**と書いている。","いくらかかったか":"**開業時の額が1本に出ている。** El Colombiano（2024年8月6日）は、K 線の開業に**当時の額で683億5,000万ペソ**がかかり、**それを Metro de Medellín とメデジン市役所が出した**と書いている。\n\n**運賃は分けていない。** 同記事によれば、2004年に K 線に入る料金は1,800ペソで、地下鉄の全区間と同じだった。\n\n**節約の額は会社の示した数字である。** 同記事は、Metro によれば、この仕組みが利用者にとって**今の貨幣で1日あたり最大1万3,000ペソ**、**最大46分**の節約になっていると書いている。","真似するなら最低何が必要か":"第一に、**既存の大量輸送と運賃を分けない**こと。El Colombiano（2024年8月6日）によれば、開業時の料金は地下鉄の全区間と同じだった。World Resources Institute（2019年4月4日）は、切符が何枚も要った移動が1枚で済むようになったと書いている。\n\n第二に、**建てる前に、その地区の移動と人づきあいを調べる**こと。同記事によれば、Metro de Medellín の職員は集まりを開き、暮らし・移動・人づきあいの型のデータを集めた。\n\n第三に、**開業のときに使い方を伝える**こと。同記事によれば、K 線が開いた2004年に、**4万人を超える住民と接して**、住民が責任をもって使えるようにした。\n\n第四に、**駅の周りの公共空間に別途投資する**こと。同記事によれば、4つの駅の周りで新しい商いが開き、**市は4万平方メートルの公共空間を公園と憩いの場につくり変えた。**\n\n第五に、**索道が交通の一部になった以上、止まったときの代わりを決めておく**こと。El Colombiano（2025年10月20日）は、K 線を止めている間に A 線と乗り継げるバスの経路を3つ示している。\n\n第六に、**大がかりな点検で長く止まることを、はじめから見込んでおく**こと。同記事によれば、この点検には道路の通行止めも伴う。\n\n第七に、**保守を誰がやるかを決めておく**こと。**この事業では、そこが20年目に表に出た**（次節）。","今どうなっているか":"**2026年8月時点で確認できたのは、2025年10月20日の記事までである。**\n\n**20年目に、初めての死亡事故が起きた。** El Colombiano（2024年6月28日）は、**同年6月26日未明に K 線のキャビン2台がぶつかって1台が落ち、1人が亡くなり20人が負傷した**と報じている。同記事は、**2004年の運行開始以来、この規模の事故が Metrocable で起きたのは初めてだ**と書いている。\n\n**組合が保守の外注を問題にし、会社が反論している。** 同記事によれば、Metro の労働組合 Sintrametro は、以前は社内の訓練された人員でやっていた保守が外部の民間企業に渡っていると懸念を示した。組合の指導者の一人クラウディア・モントヤ氏は、**Metro の中核の保守を担う外注の企業は300社ほどだと述べている。** これに対し Metro は、組合の権利は尊重するとしたうえでこの主張に同意せず退けるとし、**保守にあたる職員の専門と技術の仕事を疑わせるものだ**と述べた。同記事によれば、Metro の総責任者トマス・エレハルデ氏は、事故の原因について、大学と国際的な専門家の助けを得て透明で客観的な調査を行うと述べている。\n\n**翌年も不具合が続いた。** El Colombiano（2025年6月10日）は、火曜の朝7時38分から8時08分まで K 線が止まり、理由は「技術上の異変」だったとみられると書いている。同記事によれば、その前日の月曜6月9日には J 線が技術上の不都合のため朝5時30分ごろから10時30分過ぎまで約5時間止まったと報じている。同記事によれば、組合の長であるモントヤ氏は、**前年6月26日の事故のあと、とくに J 線の保守を組合として問題にしてきた**と同紙に述べている。\n\n**大がかりな点検で長く止まっている。** El Colombiano（2025年10月20日）は、K 線が予防のための大きな点検のため**10月25日の土曜まで営業しないこと**、**10月26日の日曜から通常の運行に戻ること**を Metro が知らせたと報じている。**この記事は掲載日より後の日付を伝えるものであり、点検の終わりは予定として書かれている。** 同記事によれば、点検では索を引く主索に手を入れ、107番通りの一部を通行止めにする。\n\n**規模そのものは20年で増えている。** El Colombiano（2024年8月6日）によれば、Metro は20年で**2億6,000万人を超える人が乗った**とし、1日2万5,000人を運ぶものとして構想された線が2024年には1日4万5,000人と見積もられている。\n\n**成果の側だけを見ない読み方も、早い時期から出ている。** Brookings Institution（2011年2月14日）に載ったバンダ・フェルバブ＝ブラウン氏の記事は、2011年1月の現地調査にもとづくもので、**メデジンで公共財の行き渡り方と政策の転換は際立っているのに、殺人とそのほかの暴力がふたたび増えている**と書いている。同記事は、暴力が減った時期の理由として、パブロ・エスコバルの死と、麻薬取引の指導者による地区の掌握、2002年の軍の作戦、その後の停戦の宣言を挙げており、**Metrocable と図書館は、その治安が改善した時期に市長たちが進めた事業として位置づけられている。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"co-0005","name":"無償のケアを担う人が歩いて行ける範囲に、洗濯機と講座と一時預かりをまとめた","name_local":"Manzanas del Cuidado","name_variants":["Sistema Distrital de Cuidado","Care Blocks"],"country":"コロンビア","region":"ボゴタ首都区","municipality":"ボゴタ","population_current":7937898,"population_scale":"25万超","purpose":"誇りをつくる","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2020,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"ボゴタ市の女性局（Secretaría de la Mujer）を中心とする市の行政。Cerosetenta（2024年11月26日）によれば、女性局から約130人がこの仕組みに関わっている。Frontiers in Sustainable Cities（2025年7月7日）は、市の13の機関が関わると書いている","component_types":"hybrid","components":["既にある公共施設に機能を足す","洗濯機とプールと講座を置く","ケアを受ける側を同時に預かる","地区ごとに置く（複数の所も）","移動式の車も用意されている"],"sources":[{"url":"https://www.elespectador.com/bogota/bogota-estrena-su-quinta-manzana-del-cuidado/","title":"Bogotá estrena su quinta “Manzana del Cuidado”","outlet":"El Espectador","published":"2021-06-17","language":"es","from_operator":false},{"url":"https://www.elcolombiano.com/opinion/columnistas/las-manzanas-del-cuidado-PL22928711","title":"Las Manzanas del Cuidado","outlet":"El Colombiano","published":"2023-10-29","language":"es","from_operator":false},{"url":"https://voices.no/index.php/voices/article/view/4129","title":"Community Music Therapy with Adult Female Caregivers: “Manzanas del Cuidado” Locality of San Cristóbal, Community Development Center San Blas, Bogotá, Colombia","outlet":"Voices: A World Forum for Music Therapy","published":"2024-11-01","language":"en","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://cerosetenta.uniandes.edu.co/una-vuelta-a-la-manzana-en-que-esta-el-sistema-distrital-de-cuidado-en-bogota/","title":"Una vuelta a la Manzana: ¿En qué está el Sistema Distrital de Cuidado en Bogotá?","outlet":"Cerosetenta（070）","published":"2024-11-26","language":"es","from_operator":false},{"url":"https://www.frontiersin.org/articles/10.3389/frsc.2025.1556795/full","title":"Putting care on the map: gender mainstreaming, a policy approach to reduce inequalities in Latin American cities","outlet":"Frontiers in Sustainable Cities","published":"2025-07-07","language":"en","from_operator":false,"source_type":"academic"},{"url":"https://revistas.urosario.edu.co/index.php/territorios/article/view/15308","title":"Desafíos del cuidado en la ciudad: experiencias de las usuarias de las Manzanas del Cuidado en Bogotá","outlet":"Territorios 54","published":"2026-02-16","language":"es","from_operator":false,"source_type":"academic","abstract_only":true}],"context_sources":[{"url":"https://www.dane.gov.co/files/censo2018/proyecciones-de-poblacion/Municipal/DCD-area-proypoblacion-Mun-2020-2035-ActPostCOVID-19.xlsx","title":"DANE「Proyecciones de población municipal 2020-2035（感染症後の更新）」（ボゴタ 2025年 7,937,898人）"}],"unknown_fields":["funding_scale"],"discrepancies":[{"field":"45か所にする目標の年","values":[{"value":"国土整備計画では2035年までに45か所になるはずだと書いている","source_url":"https://cerosetenta.uniandes.edu.co/una-vuelta-a-la-manzana-en-que-esta-el-sistema-distrital-de-cuidado-en-bogota/","published":"2024-11-26"},{"value":"同じ計画が2023年までに25か所、2025年までに45か所に達する見通しだと書いている","source_url":"https://www.frontiersin.org/articles/10.3389/frsc.2025.1556795/full","published":"2025-07-07"}]},{"field":"始まりの年","values":[{"value":"表の中で、ボゴタの政令237号が地区ケア制度とケアの街区を定めたのは2020年としている","source_url":"https://www.frontiersin.org/articles/10.3389/frsc.2025.1556795/full","published":"2025-07-07"},{"value":"同じ論文の別の表は、ケアの街区の開始を2019年としている","source_url":"https://www.frontiersin.org/articles/10.3389/frsc.2025.1556795/full","published":"2025-07-07"}]}],"latest_source_year":2026,"elapsed_years":6,"follow_up":"濃い","follow_up_note":"2020年の政令で始まり、2021年6月に5か所目が開いた。2024年11月には24か所になり、同年8月に女性局が閉鎖の噂を否定する文書を出している。2026年の論文は、家庭の中のケアは依然として女性に偏ったままだと述べている。","timeline":[{"year":2020,"event":"ボゴタの政令237号が地区ケア制度とケアの街区を定めたと、2025年の論文の表が書いている","source_url":"https://www.frontiersin.org/articles/10.3389/frsc.2025.1556795/full"},{"year":2021,"event":"6月、ロス・マルティレス地区に5か所目が開いたと報じられた","source_url":"https://www.elespectador.com/bogota/bogota-estrena-su-quinta-manzana-del-cuidado/"},{"year":2023,"event":"10月、ボサ地区を訪ねた寄稿が、洗濯乾燥機7台は民間からの唯一の寄付だと書いた","source_url":"https://www.elcolombiano.com/opinion/columnistas/las-manzanas-del-cuidado-PL22928711"},{"year":2024,"event":"8月、女性局が「ケアの街区は扉を閉じない」という文書を出したと報じられた","source_url":"https://cerosetenta.uniandes.edu.co/una-vuelta-a-la-manzana-en-que-esta-el-sistema-distrital-de-cuidado-en-bogota/"},{"year":2024,"event":"11月、24か所あるとしたうえで、公式の評価が資源の不足・機関の連携の弱さ・一部の利用の壁を危険として挙げていると報じられた","source_url":"https://cerosetenta.uniandes.edu.co/una-vuelta-a-la-manzana-en-que-esta-el-sistema-distrital-de-cuidado-en-bogota/"},{"year":2025,"event":"7月、この仕組みは政治的な意思に依存しており継続は脆いと述べる論文が出た","source_url":"https://www.frontiersin.org/articles/10.3389/frsc.2025.1556795/full"},{"year":2026,"event":"2月、118件の聞き取りにもとづく論文が、家庭の中のケアは依然として女性に偏ったままだと述べた","source_url":"https://revistas.urosario.edu.co/index.php/territorios/article/view/15308"}],"last_verified":"2026-08-19","image":{"url":"https://cerosetenta.uniandes.edu.co/wp-content/uploads/2024/11/cuidado-portada.jpg","type":"photo","relevance_confirmed":true,"credit":"Cerosetenta（070）","source_url":"https://cerosetenta.uniandes.edu.co/una-vuelta-a-la-manzana-en-que-esta-el-sistema-distrital-de-cuidado-en-bogota/"},"sections":{"何をしたか":"コロンビアの首都ボゴタで、**家族の世話を無償で担っている人が歩いて行ける範囲に、洗濯機・プール・講座・一時預かりをまとめて置いた**取り組み。1か所を manzana（街区）と呼ぶ。\n\nCerosetenta（2024年11月26日）によれば、**ボゴタに住む女性の90%（およそ400万人）が何らかのケアの仕事をしており、そのうちおよそ150万人は自分の時間のすべてをその仕事に充てている。** 同記事によれば、コロンビアでは1日あたり男性が3時間6分、女性が7時間44分をケアの仕事に使っている（全国時間使用調査 ENUT）。\n\n**出典が挙げる目的は3つの R である。** Cerosetenta（2024年11月26日）は、女性たちが担うケアの仕事を**認め、分け合い、減らすこと**が地区ケア制度の目的だと書いている。Frontiers in Sustainable Cities（2025年7月7日）の表も、ケアの街区の第一の目的を**ケアの負担を減らすことと、世話をする人の権利**としている。**この記録の `purpose` は8種の中から「認める」に最も近いものを選んだ結果であり、出典の言葉そのものではない**（`pending.md` に積んだ）。\n\n**世話をする側と、される側を同時に受け入れる。** 同記事によれば、世話をしている人が講座を受けている間、その人が世話をしている相手は別の人が見る。El Colombiano（2023年10月29日）に載った寄稿によれば、ボサ地区の manzana には**洗濯乾燥機7台**と**12.5メートルのプール**がある。","誰が始めたか":"**市の行政である。** Frontiers in Sustainable Cities（2025年7月7日）の論文の表によれば、**ボゴタの政令237号が地区ケア制度とケアの街区を定めたのは2020年**である。**ただし同じ論文の別の表は、ケアの街区の開始を2019年としている。** `discrepancies` に並置した。Cerosetenta（2024年11月26日）は、この仕組みを担う省庁横断の委員会が2020年に作られたと書いている。\n\n**関わる機関は1つではない。** Frontiers（2025年7月7日）によれば、市の**13の機関**が関わっている。Cerosetenta（2024年11月26日）によれば、女性局から**約130人**がこの仕組みに関わっている。\n\n**感染症の広がった時期に設計された。** Frontiers（2025年7月7日）は、この事業が**感染症の流行の間に設計された**と書いている。","いくらかかったか":"**全体の額は、参照した6本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。**分かるのは、1か所あたりの額と、市全体の枠の額である。**\n\nEl Espectador（2021年6月17日）によれば、ロス・マルティレス地区役所は5か所目の manzana の事業に**15億900万ペソ**を投じる見込みだとされた。同記事によれば、**この種の場所は約800平方メートル**の広さを持つ。同記事は、この取り組みが安全・教育・雇用・芸術と文化の面でその地区に住む**およそ24,953人**に届くことを見込むとしたうえで、**別に、世話をする女性1,679人が相談と支援の役務を、5歳未満の子ども1,415人が保育と遊びの活動を使うこと**、**高齢者2,188人と障害のある人1,570人が対応を受けること**を見込むと書いている。**この4つは24,953人の内訳ではない**（合計は6,852人にしかならない）。\n\nCerosetenta（2024年11月26日）によれば、前の市政の開発計画では**25の分野別目標**がこの制度に関わり、**5.2兆ペソ**の予算が割り当てられていた。**現在の市政（2024〜2028年）の計画では、425ある目標のうちこの制度が名指しされているのは2つだけ**だと同記事は書いている。\n\n**民間からの寄付は限られている。** El Colombiano（2023年10月29日）に載った寄稿は、ボサ地区の洗濯乾燥機7台がボゴタでガスを配る会社からの贈り物であり、**民間部門がこれまでに行った唯一の寄付だ**と書いている。","真似するなら最低何が必要か":"第一に、**世話をしている人が歩いて行ける場所に置く**こと。この仕組みは「街区」という単位そのものが名前になっている。Cerosetenta（2024年11月26日）によれば、2024年11月時点で24か所がスバからウスメまで各地区にある。\n\n第二に、**世話をされる側を同時に預かる**こと。世話をする人が講座に出ている間、その人が世話をしている相手を別の人が見る（同）。**これが無いと、時間を返したことにならない。**\n\n第三に、**既にある公共施設を使う**こと。Frontiers in Sustainable Cities（2025年7月7日）の論文は、役務が**主として十分に使われていない既存の市の施設**で提供されていると書いている。El Colombiano（2023年10月29日）が訪ねたボサの manzana には広間とプールがあり、その広間に洗濯乾燥機が置かれている。\n\n第四に、**制度として法令に留める**こと。Cerosetenta（2024年11月26日）によれば、この制度は2020〜2030年の女性とジェンダー平等の公共政策に接続され、さらに**2023年の議決893号がこの制度を制度化し、後退させないことと前進させることの原則を与えている。**\n\n第五に、**運営を担う人の契約の切れ目を見込んでおく**こと。**この事業では、そこが利用の中断として表に出た**（次節）。\n\n第六に、**家庭の中の分担が変わったかを、別に測る**こと。**この事業では、そこが最も重い指摘になっている**（次節）。","今どうなっているか":"**2026年8月時点で確認できたのは、2026年2月16日に掲載された論文までである。**\n\n**1か所での実践の報告もある。** Voices: A World Forum for Music Therapy（2024年11月1日）に載った文章は、**サンクリストバル地区のサンブラス地域開発センターで、ケアの街区を使っている、世話をする大人の女性たちと行った共同体の音楽療法**を扱っている。**同文の冒頭は、これが正式な研究ではないと断っている。**\n\n**数は増えている。** Cerosetenta（2024年11月26日）によれば、2024年11月時点で24か所がある。同記事によれば、**2021年3月から2023年6月までに55万7,000件の対応**があったとされる（出所は女性局）。同記事が引く女性局の2024年8月11日の文書によれば、**39,810人が講座を修了ないし認定を受け、191,214人が866,800回の運動と健康の活動に参加し、4,383人が洗濯機を使い、それは1,279日分の時間を空けたことにあたる**とされる。\n\n**閉鎖の噂が出て、市が否定した。** 同記事によれば、女性局は2024年8月11日に**「ケアの街区は扉を閉じない」**という題の文書を出し、閉鎖の噂に対して制度は残ると述べた。\n\n**公式の評価が危険を挙げている。** 同記事によれば、女性局と計画局が独立した研究機関に委託した184ページの評価は、**資源の不足・機関の連携の弱さ・一部の役務への利用の壁**を運営上の危険として挙げている。同評価は、契約に関わる人たちの証言として**過重な負担・契約の時期の遅れ・気持ちのすり減り**を挙げ、**次の市政の政治的な意思がこの制度の資金を左右することが、率いる側の絶えざる懸念だ**とも書いている。\n\n**現場の不足も報じられている。** 同記事によれば、ある利用者は自分の manzana に**計算機室もテレビも映写機も無い**と述べ、職員の契約が変わったときに長く止まったと述べている。同記事はまた、ウスメの manzana でプールが使えなかった人がおり、**塩素を買う予算が無いためだと言われた**と書いている。同記事によれば、**制度の技術班の担当者は、移動式の「ケアのバス」2台が、運行の契約が切れた2024年4月30日から止まったままだと述べている。**\n\n**家庭の中の分担は変わっていないという指摘がある。** Territorios（2026年2月16日）の論文の抄録は、**洗濯場などがケアの負担を減らし分け合うことに寄与したとしつつ、家庭の中のケアは依然として強く女性に偏ったままであり、この制度の役務を使うこと自体が新たな務めとなって、世話をする人の時間を量の面では貧しくしている**と述べている。同抄録は、**経済的な自立と貧困からの脱出のためには就労に関わる取り組みを強め、調整する必要がある**とも述べている。この論文は118件の聞き取り、7つの集団面接、120時間の現地調査にもとづくとされる。**なおこの論文は、掲載ページの機械可読な日付が2026年2月16日、本文の表示が2026年7月31日で食い違っている。**本記録は前者を採った。\n\n**継続の脆さも指摘されている。** Frontiers in Sustainable Cities（2025年7月7日）の論文は、**ケアの街区の継続は、運営を保つ政治的な意思が続くかどうかに依存しており脆いと述べている。**\n\n**当事者の側の応答は、独立した媒体の中に引用として入っている。** Cerosetenta（2024年11月26日）によれば、制度の技術班の担当者は、最大の成果はケアを政治の議題に載せたことだとしたうえで、**住民の参加、障害のある人への配慮、文化の転換に力を入れる必要があることを認めている。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"cz-0001","name":"くじで選んだ50世帯に市営住宅を渡し、大学が対照群を置いて測った。連立が変わって打ち切られた","name_local":"Rapid Re-Housing","name_variants":["Rapid Re-housing","Rapid Rehousing","Rychlé zabydlení"],"country":"チェコ","region":"南モラヴィア州","municipality":"ブルノ市","population_scale":"25万超","purpose":"住む人を増やす・戻す","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2016,"end_year":2019,"status_current":"終了","actor_type":"混合","lead_actor":"ブルノ市。事業を持ち込んだのは前の連立にいた Žít Brno で、ピラート党の支持を受け、ANO・KDU-ČSL・緑の党・TOP 09 と組んでいた。世帯への社会福祉の仕事は IQ Roma Servis が担い、調査と評価はオストラヴァ大学が担った。1年後の評価にはマサリク大学も加わった","funding_scale":"財源はEUの補助である。**2本の出典は数える範囲が違う。** Radiožurnál は2018年6月に、事業の総額（celkové náklady）が970万コルナで、市が出したのは総額のおよそ1.6%だと書いている。ČT24 は2018年12月に、1年あたりの費用（roční náklady）が1,000万コルナで、うち950万はEUの補助、残る50万のうち15万をブルノ市が出し、残りをオストラヴァ大学や IQ Roma Servis といった協力団体が負担したと書いている（discrepancies に並置した）。2017年3月の時点では、ブルノの ODS の代表 Libor Šťástka が、納税者にほぼ1,000万コルナかかると述べて批判していた。ほかに民間の資金による支援の基金があり、契約の更新の際に9世帯へ1回かぎり4,000コルナほど、合わせて4万コルナ足らずを贈ったとオストラヴァ大学の Štěpán Ripka が述べている","component_types":"soft","components":["くじで50世帯を選ぶ","市営住宅を手当の額の家賃で貸す","社会福祉の担当者が付き添う","100世帯を対照群に置いて比べる","民間の基金が滞納を一度だけ埋める"],"sources":[{"url":"https://zpravy.aktualne.cz/regiony/jihomoravsky/brno-pred-rokem-schvalilo-experiment-s-byty-pro-chude-prefer/r~039519de0b1c11e79aec0025900fea04/","title":"Brněnský experiment s byty pro chudé: Preferujete neplatiče, neziskovky bobtnají, zlobí se opozice","outlet":"Aktuálně.cz","published":"2017-03-19","language":"cs","from_operator":false},{"url":"https://radiozurnal.rozhlas.cz/brnensky-projekt-pro-lidi-bez-domova-uspel-bydleni-si-po-roce-udrzelo-96-rodin-8105900","title":"Brněnský projekt pro lidi bez domova uspěl. Bydlení si po roce udrželo 96 % rodin","outlet":"Český rozhlas","published":"2018-06-27","language":"cs","from_operator":false},{"url":"https://wave.rozhlas.cz/housing-first-v-ohrozeni-bude-uspesny-brnensky-projekt-zrusen-z-ideologickych-7640130","title":"Housing First v ohrožení. Bude úspěšný brněnský projekt zrušen z ideologických důvodů?","outlet":"Český rozhlas","published":"2018-10-12","language":"cs","from_operator":false},{"url":"https://ct24.ceskatelevize.cz/regiony/jihomoravsky-kraj/2683802-vyzkumnici-po-roce-vyhodnotili-projekt-rapid-re-housing-vetsina","title":"Brno dalo padesáti rodinám bez domova bydlení. Po roce je většina z nich bez dluhů","outlet":"ČT24","published":"2018-12-18","language":"cs","from_operator":false},{"url":"https://denikreferendum.cz/clanek/28840-rapid-rehousing-brnu-usetril-penize-vetsina-zabydlenych-rodin-nema-dluhy","title":"Rapid Rehousing Brnu ušetřil peníze, většina zabydlených rodin nemá dluhy","outlet":"Deník Referendum","published":"2018-12-19","language":"cs","from_operator":false},{"url":"https://ct24.ceskatelevize.cz/clanek/regiony/brno-konci-se-zabydlovanim-lidi-v-nouzi-projekt-pomohl-padesati-rodinam-66980","title":"Brno končí se zabydlováním lidí v nouzi. Projekt pomohl padesáti rodinám","outlet":"ČT24","published":"2019-04-09","language":"cs","from_operator":false},{"url":"https://denikreferendum.cz/clanek/29401-rapid-rehousing-nepokracuje-brno-jej-chce-nahradit-dotacemi-z-ministerstva","title":"Rapid Re-Housing nepokračuje, Brno jej chce nahradit dotacemi z ministerstva","outlet":"Deník Referendum","published":"2019-04-10","language":"cs","from_operator":false},{"url":"https://plus.rozhlas.cz/housing-first-dotacni-program-na-bydleni-pro-chude-inspirovalo-brno-s-jeho-7961586","title":"Housing first. Dotační program na bydlení pro chudé inspirovalo Brno, to s jeho pokračováním váhá","outlet":"Český rozhlas","published":"2019-06-12","language":"cs","from_operator":false},{"url":"https://wave.rozhlas.cz/radnice-brna-stred-odmitla-pokracovani-projektu-housing-first-nejchudsi-lide-7962199","title":"Radnice Brna-střed odmítla pokračování projektu Housing First. Nejchudší lidé byty nedostanou","outlet":"Český rozhlas","published":"2019-06-13","language":"cs","from_operator":false}],"context_sources":[{"url":"https://data.brno.cz/pages/3b378e45b2384f1eb05d91ecd1112493","title":"data.Brno「Populace Brna a jeho městských částí」（ブルノ市の統計のポータル。2023年12月14日付。2021年の国勢調査で市は40万人の線に近づいたと書いている）"}],"discrepancies":[{"field":"事業費（出典によって数える範囲が違う。総額のはずの額が、1年あたりの額より小さい）","values":[{"value":"970万コルナ。出典の表記は celkové náklady（総額）。市が出したのは総額のおよそ1.6%","source_url":"https://radiozurnal.rozhlas.cz/brnensky-projekt-pro-lidi-bez-domova-uspel-bydleni-si-po-roce-udrzelo-96-rodin-8105900","published":"2018-06-27"},{"value":"1,000万コルナ。出典の表記は roční náklady（1年あたり）。950万はEUの補助、残る50万のうち15万をブルノ市が出した","source_url":"https://ct24.ceskatelevize.cz/regiony/jihomoravsky-kraj/2683802-vyzkumnici-po-roce-vyhodnotili-projekt-rapid-re-housing-vetsina","published":"2018-12-18"}]}],"unknown_fields":["population_current"],"latest_source_year":2019,"elapsed_years":3,"follow_up":"濃い","follow_up_note":"2018年12月、オストラヴァ大学とマサリク大学の調査として、48世帯が1年後に契約を更新し、市の支出が年およそ150万コルナ減ったと報じられた。2019年4月、市長は事業を続けないと述べ、副市長によれば契約が続いていたのは46世帯だった。","timeline":[{"year":2016,"event":"ブルノ市が2016年、くじで選ばれた住まいに困る50世帯に、家賃を下げた市営住宅を貸すと申し出た。事業が始まった時点で、ブルノには住まいに困っている世帯が400を超えていた。世帯の引っ越しは2017年6月まで続き、翌年の調査は最後の世帯が移ってから1年後に行われた","source_url":"https://ct24.ceskatelevize.cz/regiony/jihomoravsky-kraj/2683802-vyzkumnici-po-roce-vyhodnotili-projekt-rapid-re-housing-vetsina"},{"year":2017,"event":"3月19日、Aktuálně.cz が野党の側の言い分を載せた。ČSSD のブルノの代表 Oliver Pospíšil は「多くの世帯はかなり大きな滞納者だ」と述べ、ODS の Libor Šťástka は納税者にほぼ1,000万コルナかかると述べて「一部の非営利団体がふくらむ」と批判した。記事は、事業に100世帯の対照群が置かれ、失業や子どもの欠席が減ったかを専門家が評価すると書いている。当時の労働社会問題相 Michaela Marksová は「評価が気になっている。そこから他の都市への勧めが決まる」と述べている","source_url":"https://zpravy.aktualne.cz/regiony/jihomoravsky/brno-pred-rokem-schvalilo-experiment-s-byty-pro-chude-prefer/r~039519de0b1c11e79aec0025900fea04/"},{"year":2018,"event":"6月27日、50世帯のうち48世帯が1年後に契約を更新したと報じられた。オストラヴァ大学の Štěpán Ripka は、子どものけがが12%から2.4%に下がり、入院が大きく減り、63回にわたって抗生物質を使わずに済んだと述べている。最初の半年では家計の安定に大きな効き目は確かめられなかったとされる。当時の市長 Petr Vokřál は、子どものいる世帯のホームレス状態をこの街で終わらせるのが目標だと述べている","source_url":"https://radiozurnal.rozhlas.cz/brnensky-projekt-pro-lidi-bez-domova-uspel-bydleni-si-po-roce-udrzelo-96-rodin-8105900"},{"year":2018,"event":"12月18日、オストラヴァ大学とマサリク大学の新しい調査として、市の支出が年およそ150万コルナ減ったと報じられた。48世帯が契約を更新し、そのうち78%に滞納が無く、2世帯はお金の問題で完全に離れた。減ったのは主に子どもの施設での養護と一時保護の住まいの費用で、救急車の出動や入院も要らなくなったとされる。Ripka は、この形を続ければ10年で世帯のホームレス状態をゼロに近づけられると述べている。市議会選挙のあと連立が組み替わり、事業を続けるかは決まっていないと書かれている","source_url":"https://ct24.ceskatelevize.cz/regiony/jihomoravsky-kraj/2683802-vyzkumnici-po-roce-vyhodnotili-projekt-rapid-re-housing-vetsina"},{"year":2019,"event":"4月9日、市長 Markéta Vaňková（ODS）が、前の連立の事業を引き継がないと述べたと報じられた。市議会は最終報告を賛成41・反対4・棄権4で承認し、52人が半年ごとに世帯の様子を報告させることを決めた。副市長 Robert Kerndl（ODS）は、事業そのものは続かないが、省の新しい公募に市が応じる場合は条件を満たす世帯も住宅を申し込めると述べている。Kerndl によれば、この時点で契約が続いていたのは46世帯で、さらに6世帯が危うい状態にあり、滞納の総額はおよそ45万コルナ、条件を満たせず返された3戸の分がさらに25万コルナあった。事業を持ち込んだ Žít Brno の元副市長 Matěj Hollan は「市長も副市長も、事業は続くと私に約束していた」と述べている","source_url":"https://ct24.ceskatelevize.cz/clanek/regiony/brno-konci-se-zabydlovanim-lidi-v-nouzi-projekt-pomohl-padesati-rodinam-66980"},{"year":2019,"event":"4月10日、Deník Referendum が、市が Rapid Re-Housing を続けず、労働社会問題省の補助で置き換えようとしていると書いた","source_url":"https://denikreferendum.cz/clanek/29401-rapid-rehousing-nepokracuje-brno-jej-chce-nahradit-dotacemi-z-ministerstva"}],"editor_notes":"出典は4つの発行元にまたがる。Radiožurnál・Radio Wave・Český rozhlas Plus はいずれも Český rozhlas なので `outlet` を発行元で揃えた（別名にすると本数の数え方が狂う）。ČT24 の2本は見出し下の署名の行に ČTK（チェコ通信）を出典として挙げている（2018年12月18日は「Zdroj／ČT24・ČTK」、2019年4月9日は「Zdroj／ČTK」のみ）ので、同じ発表に由来する他媒体の記事があれば §3 により1本に丸める必要がある。**表記が3通りある**——ČT24 は2本で7回（2018年12月18日に4回、うち1回は写真説明。2019年4月9日に3回）、いずれも `Rapid Re-housing`（h が小文字）。Deník Referendum は2018年12月19日の見出しがハイフンの無い `Rapid Rehousing` で、2019年4月10日の見出しは `Rapid Re-Housing` とハイフンつき・H が大文字である（同じ媒体の中でも割れている）。Český rozhlas は写真説明でチェコ語の `Rychlé zabydlení` を併記している。Aktuálně.cz は本文では `Rapid Re-Housing` と大文字で書いている。いずれも同じ事業なので name_variants に入れた。**終了の時期について別の見方がある**——Deník Referendum（2019年4月10日）は、ピラート党の解釈では Rapid Re-Housing は2018年8月に形式上終わっていた、と書いている。end_year は市長と市議会が事業の終了を明言した2019年を採った。なお ČT24（2021年2月24日）と Český rozhlas（2019年8月29日・9月5日）にこの取り組みのその後に触れた記事があるが、**本文に事業名の文字列が無く第1層を通らない**ため sources に入れていない","last_verified":"2026-08-19","image":{"url":"https://cdn.xsd.cz/original/6844ea918d723ef8bc19e429ccc4f8e4.jpg","type":"photo","relevance_confirmed":true,"credit":"Aktuálně.cz","source_url":"https://zpravy.aktualne.cz/regiony/jihomoravsky/brno-pred-rokem-schvalilo-experiment-s-byty-pro-chude-prefer/r~039519de0b1c11e79aec0025900fea04/"},"sections":{"何をしたか":"ブルノ市が2016年、住まいに困っている400世帯あまりの中から**くじで50世帯を選び**、住宅手当の額まで家賃を下げた市営住宅を貸すと申し出た。引っ越しは2017年6月まで続いた。世帯には社会福祉の担当者が付き添った。あわせて100世帯を対照群に置き、オストラヴァ大学が結果を測った。\n\n2018年、50世帯のうち48世帯が1年後に契約を更新し、そのうち78%に滞納が無かったと報じられた。オストラヴァ大学の研究者は、子どものけがが12%から2.4%に下がり、入院が大きく減ったと述べている。市の支出は年およそ150万コルナ減ったという調査結果も出た。\n\n市議会選挙のあと連立が組み替わり、2019年4月、新しい市長は前の連立の事業を引き継がないと述べた。市長によれば事業は終わり、うまくやれた世帯は住宅に残れる。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"de-0001","name":"閉鎖した空港を更地のまま市民に開き続けている","name_local":"Tempelhofer Feld","country":"ドイツ","region":"ベルリン州","municipality":"Berlin","population_current":3700577,"population_scale":"25万超","purpose":"空間をひらく","theme":"自然・緑地・水辺","start_year":2010,"end_year":null,"status_current":"継続中","actor_type":"住民組織","lead_actor":"Initiative „100 Prozent Tempelhofer Feld\"","component_types":"soft","components":["空港跡地を更地のまま公園にした","住民投票で建設計画を否決した","市民発意の法律で建設を禁じた"],"discrepancies":[{"field":"計画されていた住宅戸数","values":[{"value":4700,"source_url":"https://taz.de/Volksentscheid-Tempelhofer-Feld/!5041417/","published":"2014-05-25"},{"value":5000,"source_url":"https://taz.de/10-Jahre-Volksentscheid-Tempelhofer-Feld/!6012290/","published":"2024-05-24"}]}],"sources":[{"url":"https://taz.de/Volksentscheid-Tempelhofer-Feld/!5041417/","title":"Volksentscheid Tempelhofer Feld: Senat vom Feld gejagt","outlet":"taz","published":"2014-05-25","language":"de"},{"url":"https://www.tagesspiegel.de/berlin/trotz-volksentscheid-bauen-auf-dem-tempelhofer-feld/23649592.html","title":"Trotz Volksentscheid: Bauen auf dem Tempelhofer Feld?","outlet":"Der Tagesspiegel","published":"2018-11-17","language":"de"},{"url":"https://www.tagesspiegel.de/berlin/initiative-will-neuen-volksentscheid-zum-tempelhofer-feld-5047498.html","title":"FDP plant 12.000 Wohnungen: Initiative will neuen Volksentscheid zum Tempelhofer Feld","outlet":"Der Tagesspiegel","published":"2019-12-29","language":"de"},{"url":"https://taz.de/Bebauung-des-Tempelhofer-Feldes/!5978415/","title":"Bebauung des Tempelhofer Feldes: Senat drängt auf Randbebauung","outlet":"taz","published":"2023-12-05","language":"de"},{"url":"https://taz.de/10-Jahre-Volksentscheid-Tempelhofer-Feld/!6012290/","title":"10 Jahre Volksentscheid Tempelhofer Feld: Simulierte Beteiligung","outlet":"taz","published":"2024-05-24","language":"de"},{"url":"https://www.nd-aktuell.de/artikel/1193066.volksentscheid-tempelhofer-feld-abstimmen-bis-das-ergebnis-stimmt.html","title":"Volksentscheid – Tempelhofer Feld: Abstimmen, bis das Ergebnis stimmt","outlet":"nd","published":"2025-08-04","language":"de"}],"context_sources":[{"url":"https://www.statistik-berlin-brandenburg.de/presse/2026/73-bevoelkerungsfortschreibung-2025-berlin/","title":"ベルリン・ブランデンブルク統計局「Berlins Bevölkerungszahl erreicht 3,7 Millionen」（2025年末 3,700,577人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":15,"follow_up":"濃い","follow_up_note":"2010年5月に公園として開かれ、2014年5月25日の住民投票で約65%が建設に反対して計画は否決された。その後も建設を求める動きは続き、2018年と2019年に縁辺部への建設案が出て、2023年12月には州政府が市民工房と設計競技を進める方針を示した。2025年8月には州首相が2026年にも住民に問い直したいと述べている。","timeline":[{"year":2010,"event":"5月、跡地が公園として市民に開かれた。市民発意の団体はこのときから全面的な自由空間の維持を求めていた","source_url":"https://taz.de/Volksentscheid-Tempelhofer-Feld/!5041417/"},{"year":2014,"event":"5月25日の住民投票で約65%が建設に反対し、計画は否決された","source_url":"https://taz.de/Volksentscheid-Tempelhofer-Feld/!5041417/"},{"year":2018,"event":"11月17日、州党大会で「社会的に配慮した縁辺部の建設」を求める発言が出た","source_url":"https://www.tagesspiegel.de/berlin/trotz-volksentscheid-bauen-auf-dem-tempelhofer-feld/23649592.html"},{"year":2019,"event":"12月29日、1万2,000戸の住宅案が出され、市民発意の側は新たな住民投票を求めて申請を送った","source_url":"https://www.tagesspiegel.de/berlin/initiative-will-neuen-volksentscheid-zum-tempelhofer-feld-5047498.html"},{"year":2023,"event":"12月5日、州政府が縁辺部への建設に向けて市民工房・対話手続き・アイデア競技を進める方針を示した","source_url":"https://taz.de/Bebauung-des-Tempelhofer-Feldes/!5978415/"},{"year":2025,"event":"8月4日、州首相が2014年の住民投票を新たな問いかけで覆したい、2026年にも問えるようにしたいと述べたと報じられた","source_url":"https://www.nd-aktuell.de/artikel/1193066.volksentscheid-tempelhofer-feld-abstimmen-bis-das-ergebnis-stimmt.html"}],"last_verified":"2026-08-16","image":{"url":"https://www.tagesspiegel.de/images/3214726/alternates/BASE_16_9_W1400/1662024536000/sonnenuntergang-im-park-tempelhofer-freiheit-aufgenommen-am-29-september-2015-foto-kitty-kleist-heinrich.jpeg","type":"photo","relevance_confirmed":true,"credit":"Der Tagesspiegel","source_url":"https://www.tagesspiegel.de/berlin/initiative-will-neuen-volksentscheid-zum-tempelhofer-feld-5047498.html"},"sections":{"何をしたか":"ベルリン中心部のテンペルホーフ空港は2008年に閉鎖され、385ヘクタールの跡地は2010年5月から公園として市民に開かれた。ベルリン州政府は縁辺部に住宅を建てる計画を進めたが、市民発意の「100 Prozent Tempelhofer Feld（100パーセント・テンペルホーフ野）」が反対運動を起こし、2014年5月25日の住民投票で計画は否決された。可決された市民発意の法律により、跡地は建物を建てずに自由空間として保たれることになった。**建てなかったこと自体が成果**という珍しい形の取り組みで、その後も建設を求める動きが繰り返し起き、そのたびに争点になり続けている。","誰が始めたか":"**先に計画を出したのは州政府である。** taz 2014年5月25日によれば、当時の建設担当上院議員 Michael Müller（SPD）のマスタープランは、**縁辺部に4,700戸の住宅と多数の事業用施設を建てる「Randbebauung（縁辺部の建設）」**であり、当時の市長 Klaus Wowereit が力を入れていた**中央・州立図書館（ZLB）**をこの場所に置く計画も含まれていた。taz 2024年5月24日によれば、**2017年に国際園芸博覧会、2020年に国際建築展**を跡地で開く構想も進んでいた。\n\n**それに対して市民発意が別の法律案を出した。** 同記事によれば、住民投票が行なわれたのは市民発意「100 Prozent Tempelhofer Feld」の働きによるものであり、**投票は州政府の法律案（縁辺部に建てる）と発意側の法律案（跡地を空けたままにする）を競わせる形**で行なわれた。taz 2014年5月25日によれば、**投票は欧州議会選挙と同日に実施された。**\n\n**結果は数字で確認できる。** 同記事は州選挙管理責任者 Petra Michaelis-Merzbach の発言として、開票が約8割の時点で発意側が65%を超え、**有権者約249万人の4分の1という定足数も、約30%の賛成で満たされたと伝えている。** 法律案の成立には最低622,785票が必要だった。taz 2024年5月24日は、**110万人を超える投票者のうち約75万人が発意側の保護案を支持し、約65%の多数だった**と書いている。\n\n**発意側の当事者は2人が出典に出てくる。** taz 2014年5月25日によれば、発意の理事 Michael Schneidewind は開票後、この結果はベルリンの都市開発が今後は違う形で機能しうるという強い合図を意味すると述べた。taz 2024年5月24日では広報担当の Anita Möller が、この場所の特別さは**すべての社会層が集まれること、そしてこれまで常に平和に行なわれてきたこと**にあるとし、都市の気候にとっても大きな意味を持つと述べている。\n\n**否決されたあと、建設を求める側が繰り返し戻ってきている。** 出典の並びはそのまま再挑戦の記録である。\n\n- **2018年11月** — Der Tagesspiegel（11月17日）によれば、SPD の州党大会が、マルツァーン＝ヘラースドルフ／テンペルホーフ＝シェーネベルク／フリードリヒスハイン＝クロイツベルクの各支部の共同提案を、議論のうえ明確な多数で可決し、**「社会的に受け入れられる縁辺部の建設」を支持した。** ただし同紙は、**「住民立法への敬意から」この会期中は縁辺部の建設について決定しない**という立場も併せて伝えている\n- **2019年12月** — Der Tagesspiegel（12月29日）によれば、FDP が家賃の上昇と住宅不足を背景に**縁辺部の建設についての新たな住民投票を計画**し、そのために必要な公式の費用見積りの申請を、幹事長 Sebastian Czaja が12月初めに内務担当上院議員 Andreas Geisel（SPD）に送った。同紙の見出しはこの計画を12,000戸としている\n- **2023年12月** — taz（12月5日）によれば、建設担当上院議員 Christian Gaebler（SPD）が跡地の将来の利用について提案を上院に提出し、住民投票からおよそ10年を経た「高まった利用の要求」を理由に「再評価」を行なうとした\n- **2025年8月** — nd（8月4日）によれば、市長 Kai Wegner（CDU）が B.Z. 紙に対し、**2026年にはベルリン市民にこの場所をどう望むか問えるようにしたいと述べた**","いくらかかったか":"**金額は確認できなかった。この事業では、費用を使ったのではなく計画が取り下げられている。** 4本の taz・Tagesspiegel・nd のいずれにも、跡地の維持管理費、市民発意の運動費用、計画の取り下げによる損失は書かれていない。**書けるのは、お金の話が出てくる場所がどこかである。**\n\n- **取り下げられた側に金額の記述はない。** taz 2014年5月25日は、Wowereit が**州政府の法律案が発意側に敗れた場合はこの場所での ZLB を白紙に戻すと予告していた**とし、投票結果によって図書館の計画も実現しない見通しになったと書いている。ただし**それまでに投じられた費用の額は書かれていない**\n- **費用の見積りが出てくるのは、次の住民投票を起こす側である。** Der Tagesspiegel 2019年12月29日によれば、FDP が申請したのは**新たな住民投票のための公式の費用見積り**である\n- **その後の手続きにも公費が使われているが、額は書かれていない。** nd 2025年8月4日によれば、上院は6月末に**本来は拘束力のない建築アイデア競技の結果を公表**し、抽選で選ばれた275人のベルリン市民が跡地の将来と競技の案を議論する「対話工房（Dialogwerkstatt）」を設けた。taz 2024年5月24日によれば、この過程では**まず無作為に選ばれた20,000人に招待が送られ、その回答から年齢・性別・学歴・移民の背景・居住地に配慮して最大275人が抽選された**\n- **住宅不足が費用の代わりに議論の軸になっている。** nd 2025年8月4日で Wegner は、市内の住宅が少なすぎるのでこの用地を使わなければならないと述べている。**同じ記事で野党側の反論も併記されている**（下記）\n\n`funding_scale` は `unknown_fields` のままとした。**385ヘクタールを維持する費用も、投票運動の費用も出典に無い**ためである。","真似するなら最低何が必要か":"1. **市民の側が法律案を出せる制度。** ここで起きたのは反対運動ではなく**立法である。** 発意「100 Prozent Tempelhofer Feld」が法律案を出し、それが州政府の法律案と競って可決された。taz 2023年12月5日はその法律を「テンペルホーフ野の保全に関する法律」と呼び、nd 2025年8月4日は「テンペルホーフ野法」と呼んでいる。**建設を行なうにはこの法律の変更が必要になる**\n2. **定足数を超える票数。** 必要だったのは最低622,785票で、有権者は約249万人。**賛成の割合だけでなく、有権者総数に対する割合（4分の1）が条件になっている**\n3. **投票日を大きな選挙に合わせること。** 2014年5月25日の住民投票は欧州議会選挙と同日に行なわれた\n4. **否決の後も続く体制。** 2018年（SPD 党大会）、2019年（FDP）、2023年（上院の提案）、2025年（市長の発言）と、建設を求める動きは繰り返し起きている。**一度勝てば終わる形になっていない**\n5. **「何を議論するか」の設定を見張ること。** taz 2023年12月5日によれば、Gaebler は提案が「慎重な縁辺部の建設」の**「するか否か」ではなく「どのように」を扱うもの**だと強調し、**市民工房の「参加型の過程」に参加できるのは建設に開かれた人だけ**だとした（それ以外は意味をなさないという同氏の見方である）。同氏は「慎重かどうかは解釈の問題だ」とも述べている\n6. **人が集まる理由を跡地に置いておくこと。** taz 2024年5月24日が挙げているのは、凧を揚げること、共同菜園で友人と過ごすこと、広がりの上に沈む陽を眺めることである\n\n**確認できないもの**は、385ヘクタールの維持管理費と担い手、市民発意の運動費用、取り下げられた計画に投じられていた費用、2026年に市長が述べた意見聴取が実際に行なわれるか、法律の変更に必要な多数が形成されるかである。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、2025年8月4日の nd の記事である。**\n\n**建設を求める側の現状。** 同記事によれば、市長 Kai Wegner（CDU）は B.Z. 紙に対し、**2026年にはベルリン市民にこの場所をどう望むか問えるようにしたいとし、その後は計画に非常に速く進まなければならないと述べた。** 同氏は、市内の住宅が少なすぎるのでこの用地を使わなければならないとし、**意見は変わりうるので改めて市民に問う必要があるとも述べている。** 黒赤（CDU・SPD）の連立は旧空港用地の建設を支持する側にある。\n\n**アイデア競技の結果は、求める側の思う向きには揃わなかった。** 同記事によれば、上院が6月末に公表した建築アイデア競技の**6つの入賞案のうち4案は建設を想定していない。** これらの案の作者は声明で、**自分たちの案が縁辺部の建設を押し通す口実に使われてはならないと述べた。** 建設を想定した2案は、いずれも敷地の南端と西端での建設を示している。\n\n**対話工房の参加者の側から批判が出ている。** 同記事によれば、最後の集まりの後、Architects 4 THF が起草した声明が出され、**出席者のおよそ半数が署名した。** その内容は、**対話過程への自分たちの関与が、市民参加を装うために悪用されることを危惧するというものである。**\n\n**野党側の見方も同じ記事に載っている。** 緑の党の州議会会派で都市開発を担当する Julian Schwarze は nd に対し、上院が住宅危機の解決のために繰り返しこの跡地を持ち出すことは**「注意をそらす動き」**だと述べ、シューマッハー街区、モルケンマルクト、上院が自ら引き取った建設計画など**他の場所が進んでいないことを覆い隠そうとしていると述べた。** 同氏は、対話工房が「小さなベルリン」と称揚されたのに、その多数が建設に反対の立場を示すとその意味が小さく扱われたとし、**結果が合うまで拘束力のない投票を繰り返そうとしているという印象が生じると述べている。** 同氏はまた、上院は拘束力のある意見聴取を始められず、SPD が前年に持ち出した「上からの住民投票」には憲法の変更が必要で、上院にその多数はないとも述べている。\n\n**2023年時点の手続きの設計は、2025年の実際と数が違う。** taz 2023年12月5日は、4月から**最大500人**の代表的に選ばれた市民が市民工房で跡地の利用を議論し、そこで2025年までに練られた案をもとにアイデア競技を行なうという上院の提案を伝えている。**実際に対話工房に加わったとされるのは275人である**（nd 2025年8月4日、taz 2024年5月24日）。\n\n**2023年にはもう1つ別の道が開かれている。** taz 2023年12月5日によれば、上院はその2週間前に**跡地での難民の収容についての例外規定**を進めており、**左派党はそこに建設への入口を見ている**と同記事は書いている。\n\n**発意側の反論も記録しておく。** taz 2024年5月24日で Anita Möller は、**上院の計画は口実であり、不誠実で、民主主義を危うくするものだと述べている。** 緑の党の会派代表 Werner Graf は2023年12月、跡地を空けたままにする住民投票が存在するという立場を述べた（taz 2023年12月5日）。**建設を求める側の言葉と求めない側の言葉は、いずれも同じ出典の中に併記されている。**\n\n**出典の性格について明記しておく。**\n\n- **Der Tagesspiegel の2本は有料記事であり、無料で読める導入部分しか読んでいない。** どちらも本文が購読者向けに閉じられている（`showPaywall` の表示がある）。ここに書いた2018年と2019年の内容は、その導入部分に書かれている範囲に限られる\n- **taz 3本と nd 1本は本文が取得できている。** ただし **taz・Tagesspiegel・nd-aktuell はいずれも Claude による取得を robots.txt で拒否しているドメイン**で、本文は以前に取得したものを使っている（再取得はしていない）\n- **この事業は政治的な争点そのものであり、出典はいずれも争点の一方に立つ発言を引用している。** Terroir の地の文はどちらの側にも立たず、誰がどこで何を述べたかを帰属つきで並べた"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"de-0002","name":"使われなくなった港の157haに都心をもう一つ足した","name_local":"HafenCity","country":"ドイツ","region":"ハンブルク","municipality":"ハンブルク（HafenCity 地区）","population_current":1869473,"population_scale":"25万超","purpose":"空間をひらく","theme":"空き家・空き店舗・遊休不動産","start_year":2001,"end_year":null,"status_current":"継続中","actor_type":"デベロッパー・鉄道事業者","lead_actor":"HafenCity Hamburg GmbH","component_types":"hard","components":["旧港湾地区157haを開発した","洪水対策を組み込んで建てた","地下鉄の新路線をつないだ","ローゼ公園などの公園を置いた"],"discrepancies":[{"field":"start_year","values":[{"value":1999,"source_url":"https://hafencityzeitung.com/wir-sind-noch-nicht-fertig/","published":"2026-04-29"},{"value":2001,"source_url":"https://www.haufe.de/immobilien/entwicklung-vermarktung/projekte-deals/hamburg-hafencity-gmbh-kuendigt-drei-neue-projekte-an_254_394656.html","published":"2021-04-08"}]}],"sources":[{"url":"https://www.haufe.de/immobilien/entwicklung-vermarktung/projekte-deals/hamburg-hafencity-gmbh-kuendigt-drei-neue-projekte-an_254_394656.html","title":"Hamburg：Die Hafencity wird 20 – und wächst weiter und höher","outlet":"Haufe Immobilien","published":"2021-04-08","language":"de","from_operator":false},{"url":"https://hamburg.t-online.de/region/hamburg/id_100402614/wohnen-in-hamburg-neues-hafencity-quartier-wird-ende-2024-eroeffnet.html","title":"Wohnen in Hamburg：Neues Hafencity-Quartier wird Ende 2024 eröffnet","outlet":"t-online Hamburg","published":"2024-05-08","language":"de","from_operator":false},{"url":"https://www.entwicklungsstadt.de/modellquartier-mit-makeln-die-hafencity-in-der-nachhaltigkeitsdebatte/","title":"Modellquartier mit Makeln：Die HafenCity in der Nachhaltigkeitsdebatte","outlet":"ENTWICKLUNGSSTADT","published":"2025-07-27","language":"de","from_operator":false},{"url":"https://hafencityzeitung.com/wir-sind-noch-nicht-fertig/","title":"»Wir sind noch nicht fertig!«","outlet":"HafenCity Zeitung","published":"2026-04-29","language":"de","from_operator":false}],"context_sources":[{"url":"https://metropolregion.hamburg.de/unsere-services/statistikportal/bevoelkerung-14856","title":"Metropolregion Hamburg 統計ポータル：Bevölkerungsstand und Bevölkerungsdichte am 31.12.2025"}],"unknown_fields":["funding_scale"],"latest_source_year":2026,"elapsed_years":25,"follow_up":"濃い","follow_up_note":"2010年にZukunftsrat Hamburgが緑地と交通の面で自らの目標を限られた範囲でしか満たしていないと指摘し、2025年も緑と社会的混合をめぐる議論が続く。2026年時点で8,000人超が住み約15,000人が働く。","timeline":[{"year":2001,"event":"4月9日、当時のハンブルク経済相トーマス・ミロウが古い船鐘を鳴らして着工を告げた","source_url":"https://www.haufe.de/immobilien/entwicklung-vermarktung/projekte-deals/hamburg-hafencity-gmbh-kuendigt-drei-neue-projekte-an_254_394656.html"},{"year":2010,"event":"Zukunftsrat Hamburg が、自ら掲げた環境・社会の持続可能性の基準を限られた範囲でしか満たしていないと分析した","source_url":"https://www.entwicklungsstadt.de/modellquartier-mit-makeln-die-hafencity-in-der-nachhaltigkeitsdebatte/"},{"year":2024,"event":"バーケンハーフェンの新街区ノイハーフンで上棟。年末までに206戸、うち半数近くが公的補助つき住宅","source_url":"https://hamburg.t-online.de/region/hamburg/id_100402614/wohnen-in-hamburg-neues-hafencity-quartier-wird-ende-2024-eroeffnet.html"},{"year":2026,"event":"8,000人超が居住し、約15,000人が働く。NetzwerkHafenCity e.V. が最初の鍬入れから25年の企画を始めた","source_url":"https://hafencityzeitung.com/wir-sind-noch-nicht-fertig/"}],"last_verified":"2026-08-17","image":{"url":"https://www.haufe.de/image/elbtower-und-elbphilharmonie-540602-3.jpg?width=650&digest=-WPILqNyKtx4UiDL3W5uIJyrAb0vpcsULT8cB80YNnU%3D","type":"photo","relevance_confirmed":true,"credit":"Haufe Immobilien","source_url":"https://www.haufe.de/immobilien/entwicklung-vermarktung/projekte-deals/hamburg-hafencity-gmbh-kuendigt-drei-neue-projekte-an_254_394656.html"},"sections":{"何をしたか":"ハンブルクの旧港湾・倉庫用地157ヘクタールに、住宅・オフィス・大学・文化施設を混ぜた新しい市街地をつくる事業。2001年4月9日、当時のハンブルク経済相トーマス・ミロウが古い船鐘を鳴らして着工を告げた。翌2002年に全長220mのキッベルシュテーク橋（旧市街とシュパイヒャーシュタットを結ぶ歩行者橋）の工事から始まり、2013年初めまでは一部が柵で市街と隔てられていた。事業は HafenCity Hamburg GmbH が進めている。洪水対策を組み込んだ建て方、地下鉄の延伸、ローゼ公園などの公園整備を伴う。**開始年は出典で割れており**、HafenCity Zeitung は2026年の記事で「象徴的な鍬入れで1999年に始まった」と書いている（`discrepancies` に並置）。2026年時点で8,000人超が暮らし、約15,000人が働いている。","誰が始めたか":"**先に動いたのは市の政治で、住民は後から現れた。** Haufe Immobilien 2021年4月8日によれば、2001年4月9日に当時のハンブルク経済相 Thomas Mirow（SPD）が古い船鐘で新市街地の建設開始を告げた。同記事は、市政府（Senat）の説明としてこれが以後ヨーロッパ最大の都市開発事業であるとし、**開発と販売を担うのは HafenCity Hamburg GmbH** だと書いている。同社の代表は Jürgen Bruns-Berentelg が18年務め、2021年11月に Andreas Kleinau が引き継いだ。\n\n**建物を建てるのは民間である。** Haufe によれば、木造高層の「Roots」（18階・65m）は事業者 Garbe が2020年11月から建て、Elbtower（245m・61階）の用地はオーストリアの投資会社 Signa が2018年に市から取得した。設計は英国の建築家 David Chipperfield である。**つまり、市が土地を用意して売り、民間が建てるという分担になっている。**\n\n**住民が組織として立つのは2009年である。** HafenCity Zeitung 2026年4月29日によれば、旧自由港には誰も住んでいなかったため最初の住民は開拓者であり、**その気風から2009年に近隣協会 Netzwerk HafenCity e. V. が生まれた。** 同記事は、これが HafenCity Hamburg GmbH の支援を受けて新しい近隣の声となるべく作られ、今日では地区で最大の近隣協会だと書いている。会長 Marianne Wellershoff は、街区は建物だけでできているのではなく、少なくとも同じくらいここに住む人によって形づくられると述べている。\n\n**順序をたどると、市（2001年）→ 開発会社 → 民間の事業者と投資家 → 住民組織（2009年）→ 批評する側（2010年以降）となる。** ENTWICKLUNGSSTADT 2025年7月27日によれば、**2010年に Zukunftsrat Hamburg が、この地区は生態的・社会的に持続可能な街区であるという自らの主張を限られた範囲でしか満たしていないと分析した。** 以後の議論はこの分析を参照して続いている。","いくらかかったか":"**事業費の総額は確認できなかった。** 4本の出典に総額も市の負担額も書かれていない。代わりに、**誰が何を負担する構造になっているか**は具体的に書かれている。\n\n- **市の側は土地を出し、売って回収する。** Haufe 2021年4月8日によれば、Elbbrücken の用地は2018年に Signa が市から取得した。**開発と販売を担うのは市の会社 HafenCity Hamburg GmbH である**\n- **建物の費用は民間が出す。** Roots は Garbe、Neuhavn 街区は Quantum Immobilien、we-house Baakenhafen は Archy Nova と Deep Green Development が事業者である\n- **公的補助つき住宅は州の制度から出る。** t-online 2024年5月8日によれば、Neuhavn 街区の206戸のうち27戸が第1の補助経路（世帯収入がハンブルク住宅促進法の限度を最大45%上回るまで）、3戸が緊急に住居を必要とする人向け、62戸が第2の補助経路（同65%まで）に割り当てられ、**さらに83戸が任意の家賃抑制つき**である。住宅担当上院議員 Karen Pein（SPD）は、上棟式でこの街区を模範となる事業だと述べている\n- **交通の投資は公共側である。** ENTWICKLUNGSSTADT 2025年7月27日によれば、地下鉄 U4 の延伸が実現したが、**同記事はその建設に要したエネルギーと資源の多さが批判されており、既存のバス路線の拡充のほうが生態的に妥当だったとする分析の結論を伝えている**\n- **住む側の負担は市内で最も高い水準にある。** Haufe は、仲介ポータル Immowelt の2020年の集計で HafenCity の平均家賃が1m²あたり16.30ユーロだったとし、Roots の分譲128戸の平均が1m²あたり約8,500ユーロだと書いている\n\n`funding_scale` は `unknown_fields` のままとした。**総額が出典に無く、市の支出と民間の投資の区別も付けられない**ためである。","真似するなら最低何が必要か":"1. **市が土地をまとめて持っていること。** 対象は157ヘクタールの旧港湾・倉庫用地で、旧自由港であるため**誰も住んでいなかった**（HafenCity Zeitung 2026年4月29日）。立ち退きの交渉がない代わりに、地区の性格をゼロから作る必要がある\n2. **20年以上動く器。** 開発と販売を担う会社（HafenCity Hamburg GmbH）が市の側に置かれ、その代表は18年在任している。**1期の任期では終わらない事業である**\n3. **最初につなぐ経路を作ること。** 2002年に全長220mのキッベルシュテーク橋（旧市街とシュパイヒャーシュタットを結ぶ歩行者橋）の工事から始まっている。**2013年初めまでは一部が柵で市街と隔てられていた**\n4. **補助つき住宅の割合を制度で決めること。** ENTWICKLUNGSSTADT 2025年7月27日は補助つき住宅の割合を約25%とし、t-online 2024年5月8日は Neuhavn 街区の206戸のうち半分近くが公的補助つきだと書いている。**割合を決めても社会的な混ざり方は自動的には付いてこない**（下記）\n5. **住民が声を出す組織を早く作ること。** 2009年に生まれた近隣協会は、Lohsepark の近隣祭り（来場約1,000人）、Oberhafen の都市農園（高床の花壇を協会が用意する）、大市場跡の瓦礫地を生物の生息地に変える事業、交通・都市開発・気候をめぐる催しを担う。**Versmannstraße の通過交通を減らす提案は協会から出て、区道の時速30km制限として実現した**と会長は述べている\n6. **緑と車について後から出る批判に答える用意。** 2010年の Zukunftsrat Hamburg の分析は、自然の緑地と排出の少ない交通計画の不足、高い地面の被覆率、自動車の存在の強さを挙げている。**この論点は2025年時点でも続いている**\n\n**確認できないもの**は、事業費の総額と市・民間の負担の区別、土地の売却で回収した額、完成の時期、45,000人分の職場という目標の達成度、補助つき住宅の入居者の収入分布、2010年の分析に対する市の反論の内容である。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、2026年4月29日の HafenCity Zeitung の記事である。**\n\n同記事によれば、**8,000人を超える人が住み、約15,000人が日々働いている。** 2026年に近隣協会 Netzwerk HafenCity e. V. が「最初の鍬入れから25年」の企画として、共同体・交通・自然・気候・健康・歴史・包摂をテーマにした催しの連続を始めた。木の散歩、昆虫の観察会などが予定されている。同協会の作業班は、**バーケンハーフェンの植民地時代の過去を可視化する取り組み**も進めている。\n\n**人の数は出典で追える。** Haufe 2021年4月8日時点で約5,000人が3,000戸を超える住宅に住み、15,000人が働いていた。完成時の目標は住宅15,000人分と職場45,000人分である。2024年5月8日には、バーケンハーフェンの Neuhavn 街区が上棟し、年末までに206戸ができる予定と報じられた（20,000m²超の敷地、最初の入居は2025年第1四半期の予定）。2026年4月時点の居住者は8,000人超である。\n\n**開始年は出典で割れており、片方の記事の中でも揃っていない。** HafenCity Zeitung は2026年の記事で「象徴的な鍬入れで1999年に始まった」と書き、**同じ記事の見出しでは2026年を「最初の鍬入れから25年」としている。** Haufe は2001年4月9日を起点としている（`discrepancies` に並置した）。同紙によれば、最初の鍬入れの2か月後に当時の SAP の建物の建設が始まり、これが HafenCity で最初の「本物の家」で、現在は Kühne Logistics University が入っている。\n\n**批判と、それに対する事業者側の応答が同じ記事に載っている。** ENTWICKLUNGSSTADT 2025年7月27日は、2010年の Zukunftsrat Hamburg の分析（自然の緑地と低排出の交通計画の不足、地面の被覆、自動車依存、車両密度がハンブルク平均を大きく上回ること）を引いたうえで、**社会構成についても、補助つき住宅が約25%あるにもかかわらず高価で排他的とみなされ、1人あたりの居住面積が市の平均を大きく上回ることが社会的な混ざりの少なさを示すと書いている。** 同記事は、高所得層のための切り離された地区だという感覚が「動物園効果（Zoo-Effekt）」として公の議論で繰り返し取り上げられるとも書いている。**同じ記事は事業者側の応答も載せている。** 2025年6月の Hamburg Sustainability Week で HafenCity Hamburg GmbH の代表者は、新しい事業が自然の冷却・地面の被覆の解除・生物多様性により強く向きを変えていると強調し、批判的な立場はその方向を歓迎しつつ拘束力のある基準を求めた、とされている。\n\n**行政への批判については反論を確認できなかった。** HafenCity Zeitung 2026年4月29日で近隣協会の会長は、ハンブルクはしばしば「City of No」として現れ、行政は事業を可能にするより止める側に立つと述べ、ニューヨークの「City of Yes」と対比している。**この発言に対する市または行政の反論は、今回の出典の範囲では見つからなかった。**\n\n**出典の性格について明記しておく。**\n\n- **HafenCity Zeitung はこの地区の専属媒体である。** 2026年の記事は近隣協会の会長の発言でほぼ構成されており、**独立した取材による検証としては扱えない**（`from_operator` は false のままとしたが、地区の内部から出ている媒体である）\n- **ENTWICKLUNGSSTADT の記事は PLUS 購読が必要な有料記事であり、記事末に出所として Spiegel Online・Deutsche Welle・Zukunftsrat Hamburg・Hamburg Sustainability Week 2025（hafencity.com）・digitalsustainable.world が列挙されている。** つまり**他媒体と報告書をまとめた二次記事**であり、STATE §3 の本数要件には数えられない性格のものである\n- **t-online は Claude による取得を robots.txt で拒否しているドメイン**で、本文は以前に取得したものを使っている（再取得はしていない）"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"16.30ユーロ","currency":"EUR","value":16.3,"jpy":3025},{"raw":"8,500ユーロ","currency":"EUR","value":8500,"jpy":1577600}],"sample":false},{"id":"de-0003","name":"全戸が3千ユーロずつ出して、村に電気と熱の網を敷いた","name_local":"Feldheim","country":"ドイツ","region":"ブランデンブルク州","municipality":"トロイエンブリーツェン（フェルトハイム地区）","population_current":137,"population_scale":"5万人未満","purpose":"お金を地域で回す","theme":"エネルギー・資源循環","start_year":2010,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"住民が出資した Feldheim Energie GmbH & Co. KG（Beirat が率い、住民のほぼ全員が持ち分を取得している）","funding_scale":"熱供給網の事業費は170万ユーロ。ほぼ全世帯が3,000ユーロずつ自己資本として出し、残りはブランデンブルク州とEUの補助でまかなった","component_types":"hard","components":["村が自前の熱供給網を敷いた","同じ工事で電線も引き直した","全戸が3千ユーロずつ出資した","出資者が供給会社の持ち分を持った"],"sources":[{"url":"https://www.t-online.de/klima/verkehr-energie/id_100037196/wie-ein-deutsches-dorf-sich-frei-von-putin-machte.html","title":"Wie ein deutsches Dorf sich frei von Putin machte","outlet":"t-online","published":"2022-08-12","language":"de","from_operator":false},{"url":"https://www.nd-aktuell.de/artikel/1192012.brandenburg-feldheim-deutschlands-erstes-energieautarkes-dorf.html","title":"Feldheim: Deutschlands erstes energieautarkes Dorf","outlet":"nd","published":"2025-06-29","language":"de","from_operator":false},{"url":"https://www.zdfheute.de/wirtschaft/energiewende-vollendet-feldheim-brandenburg-energieversorgung-autarkie-100.html","title":"Feldheim in Brandenburg ist energieautark: Kann das Dorf ein Vorbild für Deutschland sein?","outlet":"ZDFheute","published":"2026-01-25","language":"de","from_operator":false}],"unknown_fields":[],"latest_source_year":2026,"elapsed_years":16,"follow_up":"濃い","follow_up_note":"2010年に村が自前の電気と熱の網を持ち、ほぼ全世帯が3,000ユーロずつ出した。2022年8月時点で電気は1キロワット時12セントで、ドイツ全体の30セント超を大きく下回っていた。2026年1月時点で年3,000人を超える視察が訪れている。","timeline":[{"year":2010,"event":"村が自前の熱供給網を敷き、同じ工事で電線も引き直した。この年から村はエネルギー自給とされる","source_url":"https://www.nd-aktuell.de/artikel/1192012.brandenburg-feldheim-deutschlands-erstes-energieautarkes-dorf.html"},{"year":2022,"event":"8月、電気料金は1キロワット時12セントで、ドイツ全体の30セント超を大きく下回っていると報じられた。10年以上価格が安定しているとされる","source_url":"https://www.t-online.de/klima/verkehr-energie/id_100037196/wie-ein-deutsches-dorf-sich-frei-von-putin-machte.html"},{"year":2025,"event":"6月、137人の村に風車55基・バイオガス施設・太陽光発電所があると報じられた。熱供給網の170万ユーロのうち、ほぼ全世帯が3,000ユーロずつ出し、残りは州とEUの補助だった","source_url":"https://www.nd-aktuell.de/artikel/1192012.brandenburg-feldheim-deutschlands-erstes-energieautarkes-dorf.html"},{"year":2026,"event":"1月、年3,000人を超える視察が訪れており、日本・ケニア・韓国からも来ていると報じられた","source_url":"https://www.zdfheute.de/wirtschaft/energiewende-vollendet-feldheim-brandenburg-energieversorgung-autarkie-100.html"}],"last_verified":"2026-08-17","image":{"url":"https://www.nd-aktuell.de/img/jpeg/2400/307377","type":"photo","relevance_confirmed":true,"credit":"nd","source_url":"https://www.nd-aktuell.de/artikel/1192012.brandenburg-feldheim-deutschlands-erstes-energieautarkes-dorf.html"},"sections":{"何をしたか":"ブランデンブルク州の小さな集落フェルトハイムで、**村が自前の電気と熱の網を敷き、その費用を住民自身が出した**取り組み。バイオガス施設の排熱で村全体を暖めるという案から、**村は自前の熱供給網を敷き、同じ工事で電線も引き直した。2010年から村はエネルギー自給とされている**（nd 2025年6月29日）。\n\n**費用の出し方が中心にある。** 熱供給網の事業費は170万ユーロで、**ほぼ全世帯が3,000ユーロずつ自己資本として出し**、残りはブランデンブルク州とEUの補助でまかなわれた。当時は多くの家で暖房の更新時期が重なっていたという事情もある。出資した住民は、新しく作られたエネルギー供給会社の持ち分を得た（t-online 2022年8月12日）。\n\n**効いているのは価格である。** 2022年8月の時点で、フェルトハイムの電気料金は1キロワット時あたり12セントで、ドイツ全体の30セント超を大きく下回っていた。同記事は、130人ほどのこの集落ではエネルギーの費用が10年以上安定していると書いている。2025年6月の報道によれば、**137人の村に風車55基、バイオガス施設、太陽光発電所がある。**\n\n**外からの関心が続いている。** 2026年1月時点で、年3,000人を超える視察が訪れており、日本・ケニア・韓国からの来訪が挙げられている。","誰が始めたか":"**バイオガス施設の排熱の使い道を考えたことが起点になっている。** nd（2025年6月29日）は、農場でバイオガス施設を使うという話が、その排熱で集落全体を暖める計画に発展したと書いている。そこから村は自前の熱供給網を敷き、同じ工事で電線も引き直した。\n\n**主体は住民が出資した会社である。** ZDFheute によれば、**Feldheim Energie GmbH & Co. KG** は Beirat（諮問委員会）が率いる形で運営され、**住民のほぼ全員がこの会社の持ち分を取得している**。t-online（2022年8月12日）は、金の無い自治体では全員が同じ方向を向いたときにしか変革は成らない、という趣旨で、住民が自分の財布から出したことを事業の条件として書いている。\n\n**前提は全戸の同意だった。** nd によれば、これらの設備を建てるには**村全体の同意と協力が必要**であり、ほぼ全世帯が出資に加わった。当時は多くの家で暖房の更新時期が重なっていたという事情もある。","いくらかかったか":"**熱供給網の事業費は170万ユーロである。** そのうち**ほぼ全世帯が3,000ユーロずつを自己資本として出し、残りはブランデンブルク州とEUの補助**でまかなわれた（nd 2025年6月29日）。出資した住民は、新しくつくられたエネルギー供給会社の持ち分を得ている。\n\n**効果は電気料金として現れている。** t-online（2022年8月12日）によれば、**フェルトハイムの電気料金は1キロワット時あたり12セント**で、ドイツ全体の30セント超を大きく下回っていた。同記事は、この集落ではエネルギーの費用が10年以上安定していると書いている。nd は、市場価格が2021年まで30セント前後で推移し、ウクライナでの戦争とともに急騰したのに対し、フェルトハイムの価格はその一部にとどまったとする図を運営側が示したことを伝えている。\n\n**風力発電所やバイオガス施設そのものの建設費は、参照した3本のどこにも書かれていない。**","真似するなら最低何が必要か":"この事例で真似できる単位は、風車の数ではなく**網を自分で持つという判断**である。\n\n第一に、**配電網と熱供給網を自前で敷く**こと。発電設備を建てるだけなら電力は既存の系統に売って終わるが、フェルトハイムは**自前の熱供給網を敷き、同じ工事で電線も引き直した。** 料金を自分たちで決められるのはこのためである。\n\n第二に、**全戸の同意を前提に置く**こと。nd は、これらの設備の前提は村全体の同意と協力だったと書いている。**一部の反対が残ると、網を村中に通せない。**\n\n第三に、**出資の額を家計で払える水準にする**こと。1世帯3,000ユーロである。**設備の総額を戸数で割るのではなく、払える額を先に決めて、足りない分を補助で埋めている。**\n\n第四に、**更新の時期に合わせる**こと。当時は多くの家で暖房の更新が必要な時期に重なっていた。**どうせ替えるものを、村の網につなぐ形に替えている。**\n\n第五に、**視察を受け入れる体制を持つ**こと。2026年1月時点で年3,000人を超える視察が訪れている。受け皿になっているのは村の中心にある **Neue-Energien-Forum（NEF）** で、nd（2025年6月29日）はここに教育担当（Bildungsreferent）を置いていると書いている。ZDFheute は、ラシェマン夫妻とクナーペ氏、それに無償で関わる人たちが、政治家・報道・学校のクラスに、エネルギーの自立がどう成り立つかを説明していると書いている。","今どうなっているか":"2026年8月時点で確認できたのは、2026年1月25日の ZDFheute の記事までである。\n\n**2010年から続くエネルギー自給は維持されている。** ZDFheute は、130人ほどのこの集落が電気と熱を完全に自給しており、風車・バイオガス施設・木質チップのボイラーが村の需要をすべて賄っていると書いている。\n\n**規模は増えている。** 2025年6月の nd によれば、**137人の村に風車55基、バイオガス施設、太陽光発電所がある。**\n\n**外からの関心が続いている。** 2026年1月時点で**年3,000人を超える視察**が訪れており、日本・ケニア・韓国からの来訪が挙げられている。ZDFheute の見出しは、この村がドイツ全体の手本になりうるかを問う形になっている。\n\n**電気料金のその後は nd（2025年6月29日）が書いている。** 同記事によれば、フェルトハイムの価格は2021年に取り決めた価格拘束が切れたことで緩やかに上がり、その後また下がって、記事の時点では1キロワット時あたり11.3セントだった。12セントという数字は2022年8月時点のものである。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"170万ユーロ","currency":"EUR","value":1700000,"jpy":315520000},{"raw":"3,000ユーロ","currency":"EUR","value":3000,"jpy":556800}],"sample":false},{"id":"de-0004","name":"36万筆を集めて住民投票で勝ったが、4年たっても実行されていない","name_local":"Deutsche Wohnen & Co enteignen","name_variants":["DW Enteignen"],"country":"ドイツ","region":"ベルリン州","municipality":"ベルリン","population_current":3700577,"population_scale":"25万超","purpose":"住民が決める","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2021,"end_year":null,"status_current":"継続中","actor_type":"住民組織","lead_actor":"市民発意「Deutsche Wohnen & Co enteignen」","funding_scale":"確認できなかった。参照した4本のどこにも運動の費用や、社会化にかかる補償額の確定値が書かれていない","component_types":"soft","components":["36万筆の署名を集めた","住民投票を成立させた","州の専門委員会に適法性を確認させた","2度目の住民投票へ法案を自分で書いた"],"sources":[{"url":"https://www.tagesspiegel.de/berlin/zwischenerfolg-fur-deutsche-wohnen-co-enteignen-expertenkommission-halt-enteignungen-von-immobilienkonzernen-in-berlin-fur-moglich-8999791.html","title":"Zwischenerfolg für „Deutsche Wohnen & Co enteignen\": Expertenkommission hält Enteignung von Immobilienkonzernen in Berlin für möglich","outlet":"Der Tagesspiegel","published":"2022-12-08","language":"de","from_operator":false},{"url":"https://taz.de/Deutsche-Wohnen-Enteignen/!6003284/","title":"Deutsche Wohnen Enteignen: Kein Rahmen in Sicht","outlet":"taz","published":"2024-04-22","language":"de","from_operator":false},{"url":"https://www.nd-aktuell.de/artikel/1185536.referendum-enteignungsvolksentscheid-berlin-prozent-sind-nicht-genug.html","title":"Enteignungsvolksentscheid Berlin: 59,1 Prozent sind nicht genug","outlet":"nd","published":"2024-09-25","language":"de","from_operator":false},{"url":"https://taz.de/Gesetz-von-Deutsche-Wohnen-enteignen/!6112510/","title":"Gesetz von Deutsche Wohnen enteignen: Die Utopie lebt!","outlet":"taz","published":"2025-09-26","language":"de","from_operator":false}],"context_sources":[{"url":"https://www.statistik-berlin-brandenburg.de/presse/2026/73-bevoelkerungsfortschreibung-2025-berlin/","title":"ベルリン・ブランデンブルク統計局「Berlins Bevölkerungszahl erreicht 3,7 Millionen」（2025年末 3,700,577人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":4,"follow_up":"濃い","follow_up_note":"36万筆の署名を経て2021年9月26日の住民投票で59.1%が大手不動産会社の社会化に賛成した。2022年12月に州の専門委員会が適法と判断したが、2024年4月時点で実行の見通しは立たず、2025年9月時点でも社会化は行われていない。運動側は2度目の住民投票に向けて自ら法案を書き、2025年9月26日に公表した。","timeline":[{"year":2021,"event":"9月26日の住民投票で、59.1%が大手不動産会社の住宅の社会化に賛成した。36万筆の署名がこれに先立っていた","source_url":"https://www.nd-aktuell.de/artikel/1185536.referendum-enteignungsvolksentscheid-berlin-prozent-sind-nicht-genug.html"},{"year":2022,"event":"12月、州が設けた法律の専門委員会が、不動産会社の社会化は可能だとする中間の判断を示した","source_url":"https://www.tagesspiegel.de/berlin/zwischenerfolg-fur-deutsche-wohnen-co-enteignen-expertenkommission-halt-enteignungen-von-immobilienkonzernen-in-berlin-fur-moglich-8999791.html"},{"year":2024,"event":"4月、投票から2年半が経ち、専門委員会が適法と判断したにもかかわらず、州政府による具体的な実行の見通しは立っていないと報じられた","source_url":"https://taz.de/Deutsche-Wohnen-Enteignen/!6003284/"},{"year":2024,"event":"9月、投票から3年が経っても住宅会社は1社も社会化されていないと報じられた","source_url":"https://www.nd-aktuell.de/artikel/1185536.referendum-enteignungsvolksentscheid-berlin-prozent-sind-nicht-genug.html"},{"year":2025,"event":"9月26日、運動側が2度目の住民投票に向けて自ら書いた社会化法の案を記者会見で公表した。州の与党が作っている「枠組み法」は社会化を可能にするものではないと同記事は書いている","source_url":"https://taz.de/Gesetz-von-Deutsche-Wohnen-enteignen/!6112510/"}],"last_verified":"2026-08-17","image":{"url":"https://www.tagesspiegel.de/images/8439634/alternates/BASE_16_9_W1400/1658940772000/initiative-deutsche-wohnen-co-enteignen-beendet-unterschrift-7008.jpeg","type":"photo","relevance_confirmed":true,"credit":"Der Tagesspiegel","source_url":"https://www.tagesspiegel.de/berlin/zwischenerfolg-fur-deutsche-wohnen-co-enteignen-expertenkommission-halt-enteignungen-von-immobilienkonzernen-in-berlin-fur-moglich-8999791.html"},"sections":{"何をしたか":"ベルリンで、**大手不動産会社が持つ住宅を社会化する（vergesellschaften）ことを、住民投票で決めさせた**市民発意の取り組み。**36万筆の署名を集めたうえで、2021年9月26日の住民投票にかけ、59.1%の賛成で成立した**（nd 2024年9月25日）。ドイツ基本法にはこれを可能にする条文があるが、taz によれば**これまで一度も適用されたことがない。**\n\n**決めたあとが、この事例の中身である。** 2022年12月、州政府が設けた法律の専門委員会は、不動産会社の社会化はベルリンで可能だとする中間の判断を示した（Der Tagesspiegel 2022年12月8日）。委員会は元法相を長とする構成で、2023年に事業の適法性を確認している。\n\n**それでも実行されていない。** 2024年4月、taz は、投票から2年半が経ち専門委員会が適法と判断したにもかかわらず、**州政府による具体的な実行の見通しは立っていない**と報じた。2024年9月、nd は、投票から3年が経っても**住宅会社は1社も社会化されていない**と書いている。\n\n**2025年9月26日、運動側は2度目の住民投票に向けて自ら書いた社会化法の案を記者会見で公表した**（taz 2025年9月26日）。同記事は、キリスト教民主同盟と社会民主党が住民投票のあと「枠組み法」を作ってきたが、それは社会化を可能にするものではない、と書いている。**同記事の読者の投稿欄には、専門委員会が中心的な論点で全員一致ではなかったという批判も載っている。**","誰が始めたか":"**市民発意の団体「Deutsche Wohnen & Co enteignen」（略称 DW Enteignen）である。** 名前は、ベルリンで最大の住宅会社だったドイチェ・ヴォーネンを名指ししている。運動は借家人の側から出ており、taz と nd はこの団体の広報担当（Isabella Rogner、Camel Fuhg）を当事者として繰り返し引用している。\n\n**手続きは3段構えだった。** 署名を集め、住民投票にかけ、可決させる。**36万筆の署名を集めたうえで、2021年9月26日の住民投票で59.1%の賛成を得た**（taz 2025年9月26日）。\n\n**受け止める側はベルリン州政府である。** 州は投票後に法律の専門委員会を設け、2022年12月に社会化が可能だとする中間の判断を得た（Der Tagesspiegel 2022年12月8日）。委員会は元法相を長とする構成だったと taz は書いている。**ただし実行の主体である州政府（キリスト教民主同盟と社会民主党の連立）は、投票の結果をそのまま実行してはいない。**","いくらかかったか":"**運動の費用も、社会化にかかる補償額の確定値も、参照した4本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n金額が確定していないこと自体が、この事例の争点の一部である。**社会化を実際に行うには対象と補償を定める法律が要るが、その法律はまだ無い。** 2025年9月26日に運動側が公表した法案について、taz は、補償の総額は80億〜180億ユーロの幅に収まると運動側が見込んでいること、ただし台帳が無いため最終的にどの住宅が対象になるかは不明であることを書いている。","真似するなら最低何が必要か":"この事例で真似できる単位は、社会化という政策そのものではなく**「決まったあとに何が起きるか」の見取り図**である。\n\n第一に、**票を取るところまでを設計の終わりにしない**こと。36万筆と59.1%を得てなお、**4年間で1社も社会化されていない。** 投票の可決は手続きの中間点だった。\n\n第二に、**適法性の確認を別に取る**こと。州が設けた専門委員会が2022年12月に可能だと判断し、2023年に適法性を確認した。**この判断がなければ「そもそもできない」で終わっていた。** ただしそれでも実行には至っていない。\n\n第三に、**実行の主体が反対側にいる場合を想定する**こと。決めるのは住民投票だが、法律を作り執行するのは州政府である。**両者が一致しない構図では、可決は執行を強制しない。**\n\n第四に、**引き延ばしの形を見分ける**こと。taz 2025年9月26日は、州の与党が住民投票のあと「枠組み法」を作ってきたが、それは社会化を可能にするものではないと書いている。**枠組みだけ作って中身を入れない、という応じ方がありうる。**\n\n第五に、**次の一手を自分で用意しておく**こと。運動側は2度目の住民投票に向けて**自ら法案を書いている。** 相手の作業を待つのではなく、自分たちの案を持って次に進む形をとっている。","今どうなっているか":"2026年8月時点で確認できたのは、2025年9月26日の taz の記事までである。\n\n**投票から4年、住宅会社は1社も社会化されていない。** 2024年9月25日の nd は、2021年9月26日の住民投票が今日まで結果を伴っていないと書いている。2024年4月22日の taz は、専門委員会が適法と判断したにもかかわらず、州政府による具体的な実行の見通しは立っていないと報じた。**同記事によれば、運動側は州が作ろうとしている枠組み法を「単なる目くらまし（reine Nebelkerze）」と呼んでいる。**\n\n**枠組み法は成立していない。** taz 2025年9月26日は、州の与党（キリスト教民主同盟と社会民主党）が住民投票のあと「枠組み法」を作ってきたが、それは社会化を可能にするものではないと書いている。\n\n**運動は終わっていない。** 運動側は2度目の住民投票に向けて自分たちで法案を書いている。**同じ2025年の taz の記事には、専門委員会が中心的な論点で全員一致ではなく、必要性と比例性については活動側からのみ助言を受けたとする批判が、読者の投稿として載っている。**\n\n**州政府側の言い分としては、2024年9月の nd が、建設担当の州大臣が枠組み法の実施を先送りするつもりはないと述べていたこと、鑑定が出るまで関係者に準備を求めていたことを伝えている。同記事によれば、その後の進捗について同大臣の部局は問い合わせに応じていない。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"180億ユーロ","currency":"EUR","value":18000000000,"jpy":3340800000000}],"sample":false},{"id":"de-0005","name":"いつでも引っ越せる畑を空き地に作り、10年の攻防のすえ土地を確保した","name_local":"Prinzessinnengärten","name_variants":["Prinzessinnengarten"],"country":"ドイツ","region":"ベルリン州","municipality":"ベルリン（フリードリヒスハイン＝クロイツベルク区モーリッツ広場）","population_current":3700577,"population_scale":"25万超","purpose":"空間をひらく","theme":"農林水産・食","start_year":2009,"end_year":null,"status_current":"継続中","actor_type":"民間（その他）","lead_actor":"Marco Clausen と Robert Shaw ら（州有の空き地で事業を立ち上げた運営者）","component_types":"hybrid","components":["州有の空き地に畑を作った","いつでも動かせる形にした","用地の売却計画を止めさせた","別の敷地に2つ目の畑を開いた"],"sources":[{"url":"https://taz.de/Galgenfrist-fuer-Gartenprojekt/!5085747/","title":"Galgenfrist für Gartenprojekt: Grün ist die Hoffnung","outlet":"taz","published":"2012-08-23","language":"de","from_operator":false},{"url":"https://taz.de/!5460776","title":"Berliner Gemeinschaftsgärten: In der Existenz bedroht","outlet":"taz","published":"2017-11-16","language":"de","from_operator":false},{"url":"https://taz.de/Friedhoefe-oeffnen-sich-fuer-Gartenprojekte/!5569212/","title":"Friedhöfe öffnen sich für Gartenprojekte: Totenruhe und Bio-Tomaten","outlet":"taz","published":"2019-02-12","language":"de","from_operator":false},{"url":"https://taz.de/Prinzessinnengaerten-in-Kreuzberg/!5643928/","title":"Prinzessinnengärten in Kreuzberg: Endlich Kohl(e)","outlet":"taz","published":"2019-12-05","language":"de","from_operator":false}],"context_sources":[{"url":"https://www.statistik-berlin-brandenburg.de/presse/2026/73-bevoelkerungsfortschreibung-2025-berlin/","title":"ベルリン・ブランデンブルク統計局「Berlins Bevölkerungszahl erreicht 3,7 Millionen」（2025年末 3,700,577人）"}],"single_outlet":true,"unknown_fields":["funding_scale"],"latest_source_year":2019,"elapsed_years":10,"follow_up":"濃い","follow_up_note":"2009年に州有の空き地で始まり、2012年には残り1年の猶予しかない状態が報じられた。2013年に借地契約を勝ち取ったが2018年末で切れることが2017年に伝えられ、2019年12月に助成が通って土地が確保された。","timeline":[{"year":2009,"event":"州有の空き地に、いつでも引っ越せる形の畑として作られた","source_url":"https://taz.de/Prinzessinnengaerten-in-Kreuzberg/!5643928/"},{"year":2012,"event":"モーリッツ広場にあと1年だけ残れることになった。運営者も区も、将来の計画を立てるには短すぎると述べた","source_url":"https://taz.de/Galgenfrist-fuer-Gartenprojekt/!5085747/"},{"year":2013,"event":"借地契約を勝ち取った。ただしこの契約は2018年末で切れるものだった","source_url":"https://taz.de/!5460776"},{"year":2017,"event":"公有地の売却計画は止まったが、契約切れが迫っていると報じられた。区議会は40年の地上権を求める議決をしていたが、決定は州政府の段階にあった","source_url":"https://taz.de/!5460776"},{"year":2019,"event":"12月、助成が通って土地が確保されたと報じられた。同じ年、旧墓地を使った2つ目の畑がノイケルンで営まれていることも伝えられている","source_url":"https://taz.de/Prinzessinnengaerten-in-Kreuzberg/!5643928/"}],"last_verified":"2026-08-17","image":{"url":"https://taz.de/picture/2390707/1200/Gaerten.jpeg","type":"photo","relevance_confirmed":true,"credit":"taz","source_url":"https://taz.de/!5460776"},"sections":{"何をしたか":"ベルリンのクロイツベルク、モーリッツ広場にある州有の空き地に畑を作った。taz によれば、Marco Clausen と Robert Shaw らが2009年から「遊牧民のように」この空き地に事業を立ち上げた。**着想の中心は、いつでも引っ越せる畑を作ることだった。** 地面に固定せず動かせる形にしておけば、土地を失っても事業は終わらない——という設計である。同紙はこの畑がやがて都市農業の**showcase（Vorzeigeprojekt）**になったと書いている。\n\nだが実際に起きたのは、引っ越しの準備ではなく**土地をめぐる10年の攻防**だった。2012年には「あと1年」の猶予しかない状態になり、2013年に借地契約を勝ち取ったものの、それは2018年末で切れるものだった。2019年12月、助成が通って土地が確保された。","誰が始めたか":"taz は、州有の空き地に事業を立ち上げたのは Marco Clausen と Robert Shaw らだと書いている。2017年の記事では Clausen が Geschäftsführer（運営責任者）として発言している。**行政の事業ではなく、民間の側が公有地の使い方を提案して始めた形**である。\n\n出典からは、法人の形態、区や州との契約の詳細、参加する市民の数は確認できない。","いくらかかったか":"**確認できなかった。** 借地料も整備費も助成額も、今回の出典には金額として書かれていない。\n\n金額の代わりに分かるのは**費用の性格**である。この事業の最大のコストは土地であり、しかもそれは買うのではなく**借り続けるための交渉**として現れた。2013年の契約、2018年末の期限、区議会が求めた40年の地上権、そして2019年の助成。**10年のあいだ、費用の問題はほぼすべて「あと何年ここにいられるか」という形をとっている。**","真似するなら最低何が必要か":"1. **動かせる作りにすること。** 2012年の時点で猶予は1年しかなかった。**地面に固定していたら、そこで終わっていた**\n2. **公有地であること。** 民間地であれば売却で終わる。公有地だったからこそ、区議会の議決や州政府の判断という**政治の経路**が使えた\n3. **売却計画を止める力。** 2017年の記事は、公有地の売却計画が止められたことを事実として書いている。畑を作る力と、売却を止める力は別のものである\n4. **期限つきで始める覚悟。** 借地契約は2013年に取れたが2018年末で切れた。**「取れた」と「続く」は違う**\n5. **次の敷地を探しておくこと。** 2019年の記事は、旧墓地を使った2つ目の畑がノイケルンで営まれていることを伝えている\n\n**確認できない**のは、運営の収支、参加者の人数、そして2019年に確保された土地の契約期間である。","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2019年12月5日の taz の記事で、助成が通って土地が確保され、この自由空間は残ると伝えている。**攻防は、少なくともこの時点では畑の側が守り切った形になっている。**\n\n同じ2019年、taz は旧墓地を庭に開く動きを取り上げ、ノイケルンの旧墓地で Prinzessinnengärten が営まれていることを書いている。**モーリッツ広場だけの事業ではなくなっている。**\n\nただし**最新の出典が7年前である。** 2019年以降にこの畑がどうなったかは、今回の探索範囲では確認できなかった。2019年の記事の関連記事欄には、ノイケルンの共同菜園に区の環境担当が反対しているという別の記事の見出しも並んでおり、**争いが完全に終わったとは読めない。** ただしその記事自体は今回の出典に含めていないため、中身についてはここに書けない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"de-0006","name":"クラブの運営者が協同組合を作り、川沿いの市有地を落札して村を建てた","name_local":"Holzmarkt","name_variants":["Holzmarktgenossenschaft","Holzmarkt-Genossenschaft"],"country":"ドイツ","region":"ベルリン州","municipality":"ベルリン（フリードリヒスハイン＝クロイツベルク区・シュプレー川沿い）","population_current":3700577,"population_scale":"25万超","purpose":"空間をひらく","theme":"空き家・空き店舗・遊休不動産","start_year":2012,"end_year":null,"status_current":"継続中","actor_type":"民間（その他）","lead_actor":"Holzmarkt 協同組合（旧 Bar 25 とクラブ Kater Holzig の運営者ら）。用地の買い手はスイスの年金基金財団 Abendrot で、同組合に地上権で貸している","component_types":"hard","components":["市有地の入札を協同組合が取った","年金基金が買い組合に地上権で貸した","川沿いに村のような建物群を建てた","隣接地の高層計画に反対した"],"funding_scale":"用地の取得価格は、繰り返し報じられていた1,000万ユーロを上回った（2012年10月時点）","sources":[{"url":"https://taz.de/!5082698","title":"Bar-25-Macher kaufen Ufer-Grundstück: Berlin feiert weiter an der Spree","outlet":"taz","published":"2012-10-02","language":"de","from_operator":false},{"url":"https://taz.de/!5081564/","title":"Durchbruch am Holzmarkt: \"Das wird hier keine Idylle werden\"","outlet":"taz","published":"2012-10-17","language":"de","from_operator":false},{"url":"https://taz.de/Probleme-beim-Bauprojekt-Holzmarkt/!5499261/","title":"Probleme beim Bauprojekt Holzmarkt: Auf dem Holzweg","outlet":"taz","published":"2018-04-29","language":"de","from_operator":false},{"url":"https://taz.de/Spreeufer-fuer-alle/!5602246/","title":"Spreeufer für alle: „Die Baubürokratie ist entsetzlich“","outlet":"taz","published":"2019-06-24","language":"de","from_operator":false}],"context_sources":[{"url":"https://www.statistik-berlin-brandenburg.de/presse/2026/73-bevoelkerungsfortschreibung-2025-berlin/","title":"ベルリン・ブランデンブルク統計局「Berlins Bevölkerungszahl erreicht 3,7 Millionen」（2025年末 3,700,577人）"}],"single_outlet":true,"unknown_fields":[],"latest_source_year":2019,"elapsed_years":7,"follow_up":"濃い","follow_up_note":"2012年10月に協同組合が市有地の入札を取り、スイスの年金基金が買って地上権で貸す形になった。2018年には運営者が黒い旗を掲げて隣接地の高層計画に抗議し、2019年の取材では建築行政の遅さと住宅政策の優先順位の変化が語られている。","timeline":[{"year":2012,"event":"10月、旧 Bar 25 とクラブ Kater Holzig の運営者を含む協同組合が、市の清掃公社が持つシュプレー川沿いの用地の入札を取った。取得価格は繰り返し報じられていた1,000万ユーロを上回った。買ったのはスイスの年金基金財団で、組合に貸す形をとった","source_url":"https://taz.de/!5082698"},{"year":2012,"event":"同月、taz は「ここは牧歌的な場所にはならない」という組合側の言葉を見出しに、事業の始まりを報じた","source_url":"https://taz.de/!5081564/"},{"year":2018,"event":"4月、運営者2人が屋根に上がって黒い旗を掲げ、隣接地に建つかもしれない高層建築への抗議とした。taz は、実現しかけた構想が当初の熱狂から不信に変わって行き詰まった経過として書いている","source_url":"https://taz.de/Probleme-beim-Bauprojekt-Holzmarkt/!5499261/"},{"year":2019,"event":"6月、取材に応じた関係者が、市の建築行政の遅さと、近年の住宅政策の優先順位の変化を挙げた。2012年に区の建設担当は、この区域には住めず事業用途しか認められないと述べていたという","source_url":"https://taz.de/Spreeufer-fuer-alle/!5602246/"}],"last_verified":"2026-08-17","image":{"url":"https://taz.de/picture/191368/1200/bar25_01.jpg","type":"photo","relevance_confirmed":true,"credit":"taz","source_url":"https://taz.de/!5082698"},"sections":{"何をしたか":"ベルリンのシュプレー川沿い、ヤノヴィッツ橋のたもとにある市有地を、クラブの運営者たちが作った協同組合が落札し、そこに村のような建物群を建てた。taz によれば2012年10月、**旧 Bar 25 とクラブ Kater Holzig の運営者らを含む Holzmarkt 協同組合**が、州営のベルリン清掃公社（BSR）が持つ用地の入札を取った。取得価格は、繰り返し報じられていた1,000万ユーロを上回った。\n\n**所有と利用を分けたのがこの事業の骨格である。** 実際に買ったのはスイスの年金基金財団 Abendrot で、同財団が組合に**地上権（Erbbaurecht）で貸す**形をとった。組合は所有者にならず、使うことに専念する。同財団は資産を主に不動産に投じ、自らの説明では「健康・環境・公正にもとづく投資方針」をとっている。","誰が始めたか":"クラブの運営者たちである。2012年の記事では、組合員である建築家 Christian Schöningh が、大きな喜びと相当な責任感が入り混じっていて、仕事はこれからだと語っている。\n\n**行政は売り手であって、事業の主体ではない。** 2019年の取材によれば、2012年当時、フリードリヒスハイン＝クロイツベルク区の建設担当だった緑の党の Hans Panhoff は、この区域には住むことができず事業用途しか認められないと述べていたという。**用途の枠は最初から行政が決めていた。**","いくらかかったか":"**用地の取得価格は1,000万ユーロを上回った**（2012年10月・taz）。ただしこれを払ったのは組合ではなく、スイスの年金基金財団である。組合が負っているのは地上権の対価であり、その額は今回の出典には出てこない。\n\n**この分担そのものが、この事例の「いくらかかったか」の答えである。** 1,000万ユーロを超える土地を、クラブの運営者たちが自力で買うことはできなかった。買える主体と使いたい主体を分け、あいだを地上権でつないでいる。","真似するなら最低何が必要か":"1. **買える主体を別に立てること。** 使いたい人たちが土地を買えないとき、所有と利用を分ける。ここでは年金基金がその役を担った\n2. **地上権という道具。** 賃貸借ではなく地上権にすることで、長期に使う前提が作れる\n3. **入札に勝てる形にしておくこと。** 相手は州営企業の入札で、価格は1,000万ユーロを超えた。**思いだけでは取れない**\n4. **用途の枠を先に確かめること。** 2012年の時点で区は「住めない、事業用途のみ」としていた。これは制約であると同時に、のちに隣接地の住宅計画と衝突する原因にもなっている\n5. **隣に何が建つかを見ておくこと。** 下記のとおり、この事業の最大の危機は自分の敷地の中ではなく**隣の敷地**から来た","今どうなっているか":"2026年8月時点で確認できた最も新しい記録は、2019年6月24日の taz のインタビューである。**事業は続いているが、順調とは書かれていない。**\n\n2018年4月、運営者の Mario Husten と Juval Dieziger は屋根に上がって黒い旗を掲げ、「半旗」の文字を掲げた。隣接地に自分たちと無関係な高層建築が建つかもしれないこと、そうなれば新しい住民がクラブの騒音に苦情を言うこと、最終的にはこの「村」自体が消えかねないことへの抗議である。Dieziger は、自分たちは燃え尽きたと述べている。taz はこの回を、**実現する力を持っていた構想が、当初の熱狂が不信に変わることで平地の労苦に行き詰まった経過**として書いた。\n\n2019年の取材では、長らく市の意思決定者にもてはやされてきたこの場所が、いまや冷遇されていると問われ、応じた側は、市の建築行政が想像力に乏しく極めて遅いこと、そしてこの数年でベルリンの住宅政策の優先順位が大きく変わったことを挙げている。\n\n**最新の出典が7年前である。** 2019年以降にこの事業がどうなったか、隣接地に何が建ったかは、今回の探索範囲では確認できていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"1,000万ユーロ","currency":"EUR","value":10000000,"jpy":1856000000}],"sample":false},{"id":"de-0007","name":"花壇と芝生を野菜畑に変えて、誰でも摘んでよいことにした","name_local":"Essbare Stadt Andernach","name_variants":["Essbare Stadt: Andernach","Andernach: Die \"Essbare Stadt\""],"country":"ドイツ","region":"ラインラント＝プファルツ州（マイエン＝コブレンツ郡）","municipality":"アンダーナッハ市","population_current":30408,"population_scale":"5万人未満","purpose":"誇りをつくる","theme":"農林水産・食","start_year":2010,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"アンダーナッハ市。手入れは長期失業者の労働市場への統合を行なう非営利会社が、造園と農業の資格者の指導のもとで担う","component_types":"soft","components":["城壁沿いの1.6haを野菜畑にした","摘んでよいことを明示した","初年に100種超のトマトを植えた","手入れを就労統合の事業にした","他地区と歩行者区域にも広げた"],"sources":[{"url":"https://www.blick-aktuell.de/Berichte/Die-Essbare-Stadt-Andernachgilt-als-weltweites-Vorbild-390151.html","title":"Internationale Forscher blicken nach Andernach: Die Essbare Stadt Andernach gilt als weltweites Vorbild","outlet":"BLICK aktuell","published":"2019-05-13","language":"de","from_operator":false},{"url":"https://www.gabot.de/ansicht/andernach-die-essbare-stadt-411088.html","title":"Andernach: Die \"Essbare Stadt\"","outlet":"GABOT","published":"2021-07-07","language":"de","from_operator":false},{"url":"https://www.rhein-zeitung.de/region/aus-den-lokalredaktionen/andernach-und-mayen_artikel,-essbare-stadt-andernach-feiert-sein-einzigartiges-projekt-unter-dem-motto-andernach-schmeckt-_arid,2671121.html","title":"Essbare Stadt: Andernach feiert sein einzigartiges Projekt unter dem Motto „Andernach schmeckt“","outlet":"Rhein-Zeitung","published":"2024-07-08","language":"de","from_operator":false},{"url":"https://www.blick-aktuell.de/Andernach/Essbare-Stadthat-Vorreiterrolle-35080.html","title":"„Essbare Stadt“ hat Vorreiterrolle","outlet":"BLICK aktuell","published":"2013-09-06","language":"de","from_operator":false,"sponsored":true}],"context_sources":[{"url":"https://www.wegweiser-kommune.de/kommunen/andernach","title":"Wegweiser Kommune（ベルテルスマン財団。アンダーナッハ市 30,408人・実績値2006〜2023年）"}],"unknown_fields":["funding_scale"],"editor_notes":"2013-09-06 の BLICK aktuell の記事は、末尾に「Pressemitteilung des SPD-Stadtverbands Andernach」と\n明記された政党支部のプレスリリースの転載である。有料の記事広告ではないが、\n独立した取材ではないので STATE §4「PR記事・記事広告の扱い」に準じて `sponsored: true` を申告し、\n選抜基準の本数に数えていない。独立した一次報道は残る3本（3媒体・2019 / 2021 / 2024）で満たしている。\n受賞（2013年）の事実はこの1本にしか無いため、記述は帰属つきで扱うこと。\n","latest_source_year":2024,"elapsed_years":14,"follow_up":"濃い","follow_up_note":"2010年に城壁沿いの1.6ヘクタールで始まった。2019年にはEUの研究事業の先行都市に選ばれ、2021年時点で手入れは就労統合の非営利会社が担い、2024年には市が催しを開いた。","timeline":[{"year":2010,"event":"城壁沿いの1.6ヘクタール——それまで芝生と季節ごとの植え替え花壇だった場所——に野菜畑と壁づたいの果樹を植えた。初年は100種を超えるトマトを植え、以後は毎年ひとつの野菜を主役にした","source_url":"https://www.gabot.de/ansicht/andernach-die-essbare-stadt-411088.html"},{"year":2013,"event":"「Ausgezeichnete Orte im Land der Ideen」の受賞地に選ばれた。記事は政党支部のプレスリリースの転載で、市議会での応募の議決に反対の声があったことも書いている","source_url":"https://www.blick-aktuell.de/Andernach/Essbare-Stadthat-Vorreiterrolle-35080.html"},{"year":2019,"event":"5月、EUの研究事業 EdiCitNet の会合が市内で開かれ、10の参加都市・機関の代表が集まった。アンダーナッハはオスロ・ロッテルダム・ハバナとともに先行都市の位置づけを与えられた","source_url":"https://www.blick-aktuell.de/Berichte/Die-Essbare-Stadt-Andernachgilt-als-weltweites-Vorbild-390151.html"},{"year":2021,"event":"手入れの費用は市が6桁台の低い額を負担し、作業は長期失業者の労働市場への統合を行なう非営利会社が担っていると報じられた。市の担当者は、当初は市政の一部や他の自治体から冷笑と批判があったが、受け入れが進んで批判はやんだと述べている","source_url":"https://www.gabot.de/ansicht/andernach-die-essbare-stadt-411088.html"},{"year":2024,"event":"7月、「Andernach schmeckt」を掲げた催しが開かれ、中心市街地・城壁の堀・城の庭に出店が並んだ","source_url":"https://www.rhein-zeitung.de/region/aus-den-lokalredaktionen/andernach-und-mayen_artikel,-essbare-stadt-andernach-feiert-sein-einzigartiges-projekt-unter-dem-motto-andernach-schmeckt-_arid,2671121.html"}],"last_verified":"2026-08-18","image":{"url":"https://www.gabot.de/fileadmin/_processed_/4/a/csm_Andernach_792970f8d3.jpg","type":"photo","relevance_confirmed":true,"credit":"GABOT","source_url":"https://www.gabot.de/ansicht/andernach-die-essbare-stadt-411088.html"},"sections":{"何をしたか":"ラインラント＝プファルツ州のアンダーナッハで、**市が公共の緑地の植え方を変え、実ったものを誰でも摘んでよいことにした。**\n\nガボットの2021年の記事によれば、2010年に歴史的な城壁沿いの1.6ヘクタール——それまで芝生と季節ごとの植え替え花壇だった場所——を野菜畑と壁づたいの果樹に変えた。初年は100種を超えるトマトを植え、以後は豆や玉ねぎのように毎年ひとつの野菜を主役にした。のちに他の地区や歩行者区域にも、摘み取り用の果樹と、レタスやハーブの高床の畑が加わった。\n\n手入れの作業は、長期失業者の労働市場への統合を行なう非営利会社が、造園と農業の資格者の指導のもとで担っている。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":
