{"url":"https://nhandan.vn/lang-rau-tra-que-net-dep-xanh-giua-long-hoi-an-post855216.html","title":"Làng rau Trà Quế: Nét đẹp xanh giữa lòng Hội An","outlet":"Nhân Dân","published":"2024-11-23","language":"vi","from_operator":false},{"url":"https://baochinhphu.vn/lang-nong-nghiep-hut-khach-quoc-te-10225011411491589.htm","title":"Làng nông nghiệp 'hút' khách quốc tế","outlet":"Báo Chính phủ","published":"2025-01-27","language":"vi","from_operator":false},{"url":"https://thanhnien.vn/du-xuan-o-lang-rau-di-san-khach-tay-hao-hung-hoa-than-thanh-nong-dan-185250127155922847.htm","title":"Du xuân ở làng rau di sản, khách Tây hào hứng 'hóa thân' thành nông dân","outlet":"Thanh Niên","published":"2025-01-27","language":"vi","from_operator":false}],"context_sources":[{"url":"https://tuoitre.vn/chu-tich-tinh-quang-nam-tra-loi-ve-viec-to-chuc-hoi-an-thanh-3-phuong-1-xa-20250427091633966.htm","title":"Tuổi Trẻ（2025年4月27日）「ホイアンは人口およそ11万人・面積60km²」"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":5,"follow_up":"濃い","follow_up_note":"2020年に入場券の販売と投資がホイアン市の事業体に移り、2022年4月には野菜栽培が国の無形文化遺産に認定された。2024年11月には国連観光機関が世界最良の観光村に選び、同年の来訪は3万人を超えたと2025年1月に報じられている。","timeline":[{"year":2020,"event":"それまで民間企業が担っていた入場券の販売と投資が、ホイアン市の事業体に移された","source_url":"https://tuoitre.vn/lang-rau-co-gan-400-nam-o-hoi-an-thanh-lang-du-lich-tot-nhat-the-gioi-20241105110641204.htm"},{"year":2022,"event":"4月、文化・スポーツ・観光省が Trà Quế の野菜栽培を国の無形文化遺産（民間知識・伝統工芸）に認定した","source_url":"https://thanhnien.vn/lang-rau-tra-que-la-lang-du-lich-tot-nhat-the-gioi-185241115100532981.htm"},{"year":2024,"event":"8月、クアンナム省から世界最良の観光村への推薦が報じられた","source_url":"https://danviet.vn/quang-nam-lang-rau-300-tuoi-nam-ke-di-san-cua-viet-nam-de-xuat-la-lang-du-lich-tot-nhat-the-gioi-20240818140210432.htm"},{"year":2024,"event":"11月、国連観光機関が世界最良の観光村に選んだ","source_url":"https://tuoitre.vn/lang-rau-co-gan-400-nam-o-hoi-an-thanh-lang-du-lich-tot-nhat-the-gioi-20241105110641204.htm"},{"year":2025,"event":"1月、2024年の来訪が3万人を超えたと報じられた。202世帯・326人が18ヘクタールで栽培し、年間およそ1,000トンを出荷している","source_url":"https://baochinhphu.vn/lang-nong-nghiep-hut-khach-quoc-te-10225011411491589.htm"}],"last_verified":"2026-08-17","sections":{"何をしたか":"ホイアン旧市街に隣接する野菜の村トゥラクエ（Trà Quế）で、**野菜づくりそのものを観光客が体験する対象に切り替えた**取り組み。村は400年近く続くとされ、住民はコーコー川の水草や腐葉を肥料に使ってきた。**2020年より前、この村の観光は民間企業が組んでいたが、2020年から入場券の販売と投資がホイアン市の事業体に移された**（Tuổi Trẻ 2024年11月5日）。来訪者は畑で農家と一緒に鍬を入れ、苗を植え、水をやる。\n\n**2022年4月、文化・スポーツ・観光省が Trà Quế の野菜栽培を国の無形文化遺産に認定した**（民間知識・伝統工芸の区分）。**2024年11月、国連観光機関（UN Tourism）は60か国260件を超える応募の中から、この村を世界最良の観光村に選んでいる。** ベトナムからの選出はこの1件だけだった。\n\n2025年1月時点で、村では202世帯・326人が18ヘクタールで栽培を続け、年間およそ1,000トンの野菜を出荷している。**2024年の来訪は3万人を超えた**（Báo Chính phủ 2025年1月27日）。入場券の販売数は年2万〜3万枚とされる。住民には昔からの申し合わせがあり、栽培では化学肥料や生長促進剤を使わないことになっている。\n\nホイアン市の人口はおよそ11万人、面積は60平方キロメートルである。","誰が始めたか":"**始めたのは村ではなく、村を観光に組み込んだ側である。** Tuổi Trẻ（2024年11月5日）によれば、**2020年より前、この村の観光は民間企業が組んでいた。2020年から入場券の販売と投資がホイアン市の事業体（文化・スポーツ・放送センター）に移された。** 民間の事業から市の事業へ移した、という切り替えがこの取り組みの起点にあたる。\n\n**栽培する側は村の農家である。** 2025年1月時点で202世帯・326人が18ヘクタールで栽培を続けている。住民には昔からの申し合わせ（hương ước）があり、**利用者の安全を第一とし、化学肥料や生長促進剤を使わない**ことになっている（Báo Chính phủ 2025年1月27日）。\n\n**認定を与える側は国と国際機関である。** 2022年4月に文化・スポーツ・観光省が国の無形文化遺産に認定し、2024年11月に国連観光機関が世界最良の観光村に選んだ。","いくらかかったか":"**施設整備費・運営費・入場料収入の額は、参照した6本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**規模の手がかりになる数字はある。** Tuổi Trẻ（2024年11月5日）によれば、**入場券の販売数は年2万〜3万枚**である。2024年の来訪は3万人を超えた（Báo Chính phủ 2025年1月27日）。農業の側では、村は年間およそ1,000トンの野菜を出荷しており、その野菜はダナンやホイアンのホテル、大型スーパーにも入っている。","真似するなら最低何が必要か":"この事例で真似できる単位は、村の景観ではなく**売り方の主体を移したこと**である。\n\n第一に、**入場料を取る主体を決める**こと。2020年に入場券の販売と投資が民間企業から市の事業体に移った。**誰が券を売り、その金がどこへ行くかを先に決めている。**\n\n第二に、**畑を見せるのではなく、作業に入れる**こと。来訪者は鍬を入れ、苗を植え、水をやる。**眺める観光ではなく、農家と並んで手を動かす形になっている。**\n\n第三に、**栽培の約束を先に持っていること。** 化学肥料と生長促進剤を使わないという申し合わせは、観光のために作られたものではなく、以前からある住民同士の取り決めである。**見せられる状態が、売る前から成立していた。**\n\n第四に、**認定を段階で取る**こと。2022年に国の無形文化遺産、2024年に国際的な選定。**先に国内で認定を得てから、国際の選考に出ている。**\n\n第五に、**農業を続けたまま観光を乗せる**こと。202世帯・326人が18ヘクタールで栽培を続け、年1,000トンを出荷している。**観光が主で農業が背景になった村ではない。**","今どうなっているか":"2026年8月時点で確認できたのは、2025年1月27日の記事までである。\n\n**2024年11月の選定のあと、来訪は増えている。** 2025年1月27日の Báo Chính phủ は、**2024年の来訪が3万人を超えた**と伝えている。同時点で村では202世帯・326人が18ヘクタールで栽培を続け、年間およそ1,000トンの野菜を出荷している。\n\n**春先の様子も報じられている。** 2025年1月27日の Thanh Niên は、旧正月の時期に外国人の来訪者が農民の姿になって畑仕事を体験している様子を伝えている。\n\n**2025年より後の記録には到達していない。** 入場者数や農家の戸数がその後どう動いたか、`status_current: 継続中` としたのは2025年1月時点の記述にもとづく。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":true},{"id":"ar-0001","name":"経済破綻で職を失った人に空き地を貸し、農薬を使わない野菜を売る市まで用意した","name_local":"Programa de Agricultura Urbana","name_variants":["Programa de Agricultura Urbana de Rosario","Producción Sostenible de Alimentos para una Rosario Resiliente"],"country":"アルゼンチン","region":"サンタフェ州","municipality":"ロサリオ市","population_current":1030069,"population_scale":"25万超","purpose":"商いを起こす","theme":"農林水産・食","start_year":2002,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"ロサリオ市。技術の起点は農業技師アントニオ・ラトゥーカと NGO の CEPAR（Centro de Estudios de Producciones Agroecológicas de Rosario）で、国の ProHuerta（INTA）が加わった","funding_scale":"事業費は参照した6本のどこにも書かれていない。分かるのは2021年に受けた賞金25万ドルだけである","component_types":"hybrid","components":["空き地を耕す人に一時的に貸した","農薬を使わない作り方を教えた","売る市を街なかに常設した","共同の畑から区画制に変えた","市街の外周を条例で農地に留めた"],"sources":[{"url":"https://www.wri.org/insights/rosario-urban-farming-tackles-climate-change","title":"Rosario, Urban Farming Tackles Economic and Climate Crises","outlet":"World Resources Institute","published":"2021-06-21","language":"en","from_operator":false},{"url":"https://www.rosario3.com/informaciongeneral/Rosario-recibio-un-premio-internacional-por-sus-politicas-de-produccion-sustentable-de-alimentos-20210630-0007.html","title":"Rosario recibió un premio internacional por sus políticas de producción sustentable de alimentos","outlet":"Rosario3","published":"2021-06-30","language":"es","from_operator":false},{"url":"https://latinta.com.ar/2021/07/12/rosario-agricultura-urbana/","title":"Rosario: el programa de Agricultura Urbana que salió «campeón del mundo»","outlet":"La tinta","published":"2021-07-12","language":"es","from_operator":false},{"url":"https://www.infobae.com/america/soluciones/2022/11/16/el-programa-de-agricultura-urbana-de-rosario-produce-alimentos-agroecologicos-y-da-trabajo-a-360-personas/","title":"El Programa de Agricultura Urbana de Rosario produce alimentos agroecológicos y da trabajo a 360 personas","outlet":"Infobae","published":"2022-11-16","language":"es","from_operator":false},{"url":"https://historiaregional.org/ojs/index.php/historiaregional/article/view/991","title":"Nuevas territorialidades en la lucha por la soberanía alimentaria: El surgimiento del Programa de Agricultura Urbana (PAU) en Rosario, Argentina (1960-1990)","outlet":"Historia Regional","published":"2024-12-19","language":"es","from_operator":false,"source_type":"academic","abstract_only":true},{"url":"https://rosalux-ba.org/2026/07/17/la-agricultura-urbana-de-rosario-apuesta-al-futuro/","title":"La Agricultura Urbana de Rosario apuesta al futuro","outlet":"Fundación Rosa Luxemburgo","published":"2026-07-17","language":"es","from_operator":false}],"context_sources":[{"url":"https://datos.rosario.gob.ar/poblacion/datos-censales/censo-2022-0","title":"Rosario Datos「Censo 2022」（ロサリオ市の人口 1,030,069人）"}],"unknown_fields":["funding_scale"],"discrepancies":[{"field":"作付面積","values":[{"value":"市街地25ヘクタール＋緑地帯50ヘクタール","source_url":"https://www.rosario3.com/informaciongeneral/Rosario-recibio-un-premio-internacional-por-sus-politicas-de-produccion-sustentable-de-alimentos-20210630-0007.html","published":"2021-06-30"},{"value":"市内75ヘクタール","source_url":"https://www.wri.org/insights/rosario-urban-farming-tackles-climate-change","published":"2021-06-21"},{"value":"市街地30ヘクタール＋緑地帯120ヘクタール","source_url":"https://www.infobae.com/america/soluciones/2022/11/16/el-programa-de-agricultura-urbana-de-rosario-produce-alimentos-agroecologicos-y-da-trabajo-a-360-personas/","published":"2022-11-16"}]},{"field":"緑地帯（Cinturón Verde）の開始年","values":[{"value":"2015年（土地利用条例で周縁800ヘクタールを定めた）","source_url":"https://www.wri.org/insights/rosario-urban-farming-tackles-climate-change","published":"2021-06-21"},{"value":"2016年（PAU を補う周縁部の事業として始まった）","source_url":"https://www.infobae.com/america/soluciones/2022/11/16/el-programa-de-agricultura-urbana-de-rosario-produce-alimentos-agroecologicos-y-da-trabajo-a-360-personas/","published":"2022-11-16"}]},{"field":"参加する耕作者の数","values":[{"value":"250人超","source_url":"https://www.rosario3.com/informaciongeneral/Rosario-recibio-un-premio-internacional-por-sus-politicas-de-produccion-sustentable-de-alimentos-20210630-0007.html","published":"2021-06-30"},{"value":"300人近く（うちおよそ65%が女性）","source_url":"https://www.wri.org/insights/rosario-urban-farming-tackles-climate-change","published":"2021-06-21"},{"value":"360人","source_url":"https://www.infobae.com/america/soluciones/2022/11/16/el-programa-de-agricultura-urbana-de-rosario-produce-alimentos-agroecologicos-y-da-trabajo-a-360-personas/","published":"2022-11-16"}]}],"latest_source_year":2026,"elapsed_years":24,"follow_up":"濃い","follow_up_note":"1987年に NGO の共同菜園から始まり、2001年の経済破綻を受けて2002年に市の制度になった。2021年6月に WRI の大賞（25万ドル）を受け、2023年4月には河岸段丘の500平方メートルで若者向けの講座が始まっている。","timeline":[{"year":1987,"event":"NGO の CEPAR が市内の集落に共同の菜園をつくった。農業技師アントニオ・ラトゥーカが率いた","source_url":"https://latinta.com.ar/2021/07/12/rosario-agricultura-urbana/"},{"year":2001,"event":"経済が破綻し、市の労働力の4分の1が職を失い、人口の半分以上が貧困線を下回った","source_url":"https://www.wri.org/insights/rosario-urban-farming-tackles-climate-change"},{"year":2002,"event":"市が道具・資材・種と、農薬を使わない栽培の研修を地域の団体に出し始めた。9月には農薬を使わない最初の市が開いた","source_url":"https://www.wri.org/insights/rosario-urban-farming-tackles-climate-change"},{"year":2015,"event":"緑地帯の条例で、市の周縁800ヘクタールを農薬を使わない果樹・野菜の生産用に恒久的に定めた","source_url":"https://www.wri.org/insights/rosario-urban-farming-tackles-climate-change"},{"year":2021,"event":"6月、WRI Ross Center Prize for Cities 2020-2021 の大賞を受けた。54か国262件からの選出で、賞金は25万ドルである","source_url":"https://latinta.com.ar/2021/07/12/rosario-agricultura-urbana/"},{"year":2022,"event":"11月、20年を経て360人が働き、市街30ヘクタールと緑地帯120ヘクタールで生産していると報じられた","source_url":"https://www.infobae.com/america/soluciones/2022/11/16/el-programa-de-agricultura-urbana-de-rosario-produce-alimentos-agroecologicos-y-da-trabajo-a-360-personas/"},{"year":2024,"event":"制度の成立を1960〜1990年代の経緯からたどる論文が Historia Regional に載った","source_url":"https://historiaregional.org/ojs/index.php/historiaregional/article/view/991"},{"year":2026,"event":"7月、制度の歴史を記録する本の企画として、2023年4月にパラナ川の河岸段丘の500平方メートルで始まった若者向けの講座が伝えられた","source_url":"https://rosalux-ba.org/2026/07/17/la-agricultura-urbana-de-rosario-apuesta-al-futuro/"}],"last_verified":"2026-08-19","image":{"url":"https://rosalux-ba.org/wp-content/uploads/2026/07/foto-1-para-mandar.jpg","type":"photo","relevance_confirmed":true,"credit":"Fundación Rosa Luxemburgo","source_url":"https://rosalux-ba.org/2026/07/17/la-agricultura-urbana-de-rosario-apuesta-al-futuro/"},"sections":{"何をしたか":"アルゼンチン・ロサリオ市で、**使われていない公有地・私有地を、職を失った人に一時的に貸して野菜を作らせ、それを売る市まで市が用意した**取り組み。World Resources Institute（2021年6月21日）によれば、市の都市農業プログラム（Programa de Agricultura Urbana、略称 PAU）は**2002年に、地域の団体へ道具・資材・種と、農薬を使わない栽培（agroecología）の研修を出すところから始まった。**\n\n**始まりは経済の破綻である。** 2001年に国の経済が崩れ、ロサリオでは労働力の4分の1が職を失い、人口の半分以上が貧困線を下回った。食料の値上がりと不足を前に、スーパーマーケットから食料を持ち出す住民も出た（同）。\n\n**制度は畑だけで終わらなかった。** 市は常設と臨時の市（いち）を街なかに設け、耕す人が野菜や、漬物・ソース・シロップ・ジャム・化粧品といった手作りの品を売れるようにした（同）。\n\n**2021年6月、この制度は WRI Ross Center Prize for Cities 2020-2021 の大賞を受けた。** 54か国262件からの選出で、賞金は25万ドルである（La tinta 2021年7月12日）。","誰が始めたか":"**制度の前に、NGO の菜園があった。** La tinta（2021年7月12日）によれば、最初の一歩は1987年で、NGO の CEPAR（Centro de Estudios de Producciones Agroecológicas de Rosario）が市内の集落に共同の菜園をつくった。近隣の住民が共通の場所で顔を合わせ、農薬を使わずに自分たちの食べる分を作るという考えだった。\n\n**技術の起点は農業技師アントニオ・ラトゥーカである。** 同氏は La tinta に対し、これを外部の資材に頼らず誰でもできる技術であり、人の持っている知識を掬い上げるものだと考えたと述べている（同）。\n\n**耕す側の求めで方法が変わっている。** 最初の2年で共同菜園がうまくいったため多点展開を考えたところ、耕す人たちから**共同の一区画ではなく、区画に分けてほしいという求めが出た。** ラトゥーカ氏は「最初は共同で働くという私たちの考えが崩れることだったが、住民の言うことを受け入れた」と述べ、それが実際的な形になって市内の各所へ広がり、各人が自分の力を伸ばせるようになったと説明している（同）。\n\n**市の制度になったのは2000年代の初めである。** CEPAR の技術者が制度化のために市に近づき、同じ時期に市内で活動しようとしていた国の ProHuerta の技師たちと出会った（同）。Infobae（2022年11月16日）は、市の職員で農業技師のラウル・テリレ氏の言葉として、この制度がラトゥーカ氏ら研修担当者との構想から出発し、公共政策を立てられる地方政府・国の ProHuerta（INTA）・地元の NGO である CEPAR の連携になったことを伝えている。**同氏は、強みは個々の人よりもその連携の側にあったと述べている。**","いくらかかったか":"**事業費は、参照した6本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**分かるのは賞金だけである。** 2021年6月の WRI Ross Center Prize for Cities 2020-2021 の大賞として25万ドルを受けた（La tinta 2021年7月12日）。同じ選考でアーメダバード（インド）、ロンドン（英国）、モンテレイ（メキシコ）、ナイロビ（ケニア）の各事業と並んだ。\n\n**規模の数字は出典間で食い違っている。** 作付面積は、Rosario3（2021年6月30日）が市街地25ヘクタール＋緑地帯50ヘクタール、World Resources Institute（2021年6月21日）が市内75ヘクタール、Infobae（2022年11月16日）が市街地30ヘクタール＋緑地帯120ヘクタールと書いている。**掲載日が9日しか離れていない2本でも数え方が違う。** `discrepancies` に並置した。参加する耕作者の数も250人超・300人近く・360人と分かれている。\n\n**生産と流通の量は近い。** Rosario3（2021年6月30日）は年およそ2,500トンの野菜を農薬を使わずに作り、7か所の常設の場で売っていると書き、World Resources Institute（2021年6月21日）も年およそ2,500トンとしている。Infobae（2022年11月16日）は市内39か所の市と八百屋で売られていると書いている。","真似するなら最低何が必要か":"第一に、**土地を売らずに貸す**こと。World Resources Institute（2021年6月21日）によれば、耕す人はおよそ300人で、公有地・私有地を**一時的に保有する**形をとっている。所有を移さずに使わせる仕組みである。\n\n第二に、**共同の畑にこだわらない**こと。1987年の共同菜園は2年でうまくいったが、耕す人たちの求めで区画制に変わった。ラトゥーカ氏は、それによって各人が自分の力を伸ばし、進んだ人が他の人を助け、各自が作る野菜を選び、**別の日雇いの仕事と交互にこなすこともできるようになった**と述べている（La tinta 2021年7月12日）。\n\n第三に、**売る場所を制度の側で用意する**こと。市は常設と臨時の市を街なかに設けた（World Resources Institute 2021年6月21日）。Infobae（2022年11月16日）は、仲買を通さずに消費者へ届くことを制度の特徴として挙げている。\n\n第四に、**作り方を1つに決める**こと。この制度は農薬を使わない栽培（agroecología）で統一されている。Infobae（2022年11月16日）は、その方法が土壌の管理に立ち、化学的な資材に依らず、経済・社会・環境の持続性を同じ重さで扱うものだと書いている。\n\n第五に、**街の外周を条例で押さえる**こと。World Resources Institute（2021年6月21日）は、市が2015年に緑地帯の土地利用条例をつくり、**周縁の800ヘクタールを農薬を使わない果樹・野菜の生産用に恒久的に定めた**と書いている。同記事は、これが宅地開発と大豆栽培への転換から土地を守り、洪水の危険を下げ、気温を下げると書いている。**開始年は出典間で分かれており、Infobae（2022年11月16日）は緑地帯（Cinturón Verde）を2016年に PAU を補う事業として始まったものとしている。** `discrepancies` に並置した。同記事によれば、この事業はテリレ氏が担当し、菜園（小さい面積）から農園（より大きい面積）へ規模を上げるものである。\n\n第六に、**輸送距離を数える**こと。World Resources Institute（2021年6月21日）は、単一作物の栽培が広がった結果、市は400キロメートル以上離れた場所から食料を調達するようになったとし、ロサリオ国立大学と RUAF の研究として、市内で野菜を作ると持ち込む場合より温室効果ガスの排出が95%少ないという数字を伝えている。**市で商う二つの小さな食品事業を持つマリサ・フォガンテ氏は「500キロも600キロも運ばれてこない分、新鮮で手頃だ」という趣旨を述べている**（同）。","今どうなっているか":"**2026年8月時点で確認できたのは、2026年7月17日の記事までである。**\n\n**24年目も動いており、新しい取り組みが加わっている。** Fundación Rosa Luxemburgo（2026年7月17日）は、この制度の歴史を記録する本の企画として、パラナ川の河岸段丘にある古くからの非公式の集住地レプブリカ・デ・ラ・セスタ（República de la Sexta）の500平方メートルの土地で、**2023年4月に若者向けの講座が始まった**ことを伝えている。土地は飲食店サンダーランドの厨房から56段の階段でつながっている。\n\n**きっかけは店主からの電話だった。** 同記事によれば、2022年11月に店主クラウディオ・テデスキ氏がラトゥーカ氏に「ここの上でやってみないか」と持ちかけた。**同記事は、ラトゥーカ氏がこのとき屋上のことだと思ったが、テデスキ氏が指していたのは厨房から56段離れた500平方メートルの土地だったと書いている。** 同記事は、この制度そのものを1987年に始まった事業として書いている。なお同じページに載る連載の別記事の紹介文には、農薬を使わない最初の市が2002年9月に開かれ、以後も川岸で続いているとある。\n\n**研究の対象にもなっている。** Historia Regional に載った論文（構造化された掲載日は2024年12月19日）は、1960年代から1990年代にかけての食料主権をめぐる動きの中に PAU の成立を置いている。**抄録の範囲では、著者らはこの経験を、より持続的な枠組みを固めようとする事例の代表として扱い、その歴史的な展開を調べるとしている**（ロサリオ国立大学・CONICET のラウラ・シアルニエッロ氏とセシリア・イネス・ガリンベルティ氏）。**本文は読んでいないので、抄録に書かれている範囲を超えて書かない。**（この論文のページは掲載を10月27日と書き、収録号を2025年第1期としている。日付の表記が同じページの中で揃っていない。）\n\n**制度の広がり方は出典によって数え方が違う。** 2021年6月時点で Rosario3 は7つの菜園公園（parques huerta）と6つの共同菜園、緑地帯に17の農場があるとし、World Resources Institute は7つの菜園公園と、2,400世帯・40校が研修を受けて自分の菜園を始めたとしている。**縮小や撤退を伝える記述は、参照した6本の中には無い。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"25万ドル","currency":"USD","value":250000,"jpy":39780521}],"sample":false},{"id":"bd-0001","name":"増水すると浮き、水が引くと地面に降りる校舎を、竹と使い終えたドラム缶で建てた","name_local":"Arcadia Education Project","name_variants":["আর্কেডিয়া এডুকেশন প্রজেক্ট"],"country":"バングラデシュ","region":"ダッカ管区","municipality":"ケラニガンジ・南カナルチョル","population_scale":"不明","purpose":"誇りをつくる","theme":"学校・公共施設","start_year":2012,"end_year":null,"status_current":"判定不能","actor_type":"NPO","lead_actor":"Maleka Welfare Trust（設計は Saif Ul Haque Sthapati）","component_types":"hard","components":["増水すると浮く校舎を竹で組む","使い終えたドラム缶を浮きにする","敷地の土を盛らずに水を受け入れる","地元の果実を煮た液で竹に防水を施す","継ぎ手の多くを縄で結ぶ"],"single_outlet":false,"sources":[{"url":"https://www.metalocus.es/en/news/amphibious-modules-arcadia-education-project-saif-ul-haque","title":"Amphibious modules. Arcadia Education Project, by Saif Ul Haque | METALOCUS","outlet":"METALOCUS","published":"2019-05-24","language":"en","from_operator":false},{"url":"https://www.prothomalo.com/bangladesh/%E0%A6%86%E0%A6%97%E0%A6%BE-%E0%A6%96%E0%A6%BE%E0%A6%A8-%E0%A6%85%E0%A7%8D%E0%A6%AF%E0%A6%BE%E0%A6%93%E0%A7%9F%E0%A6%BE%E0%A6%B0%E0%A7%8D%E0%A6%A1-%E0%A6%AA%E0%A7%87%E0%A6%B2%E0%A7%87-%E2%80%98%E0%A6%86%E0%A6%B0%E0%A7%8D%E0%A6%95%E0%A7%87%E0%A6%A1%E0%A6%BF%E0%A7%9F%E0%A6%BE-%E0%A6%8F%E0%A6%A1%E0%A7%81%E0%A6%95%E0%A7%87%E0%A6%B6%E0%A6%A8","title":"আগা খান অ্যাওয়ার্ড পেল 'আর্কেডিয়া এডুকেশন প্রজেক্ট' | প্রথম আলো","outlet":"প্রথম আলো","published":"2019-08-29","language":"bn","from_operator":false},{"url":"https://www.thedailystar.net/city/bangladeshi-project-wins-aga-khan-award-for-architecture-2019-1792831","title":"Bangladeshi project wins Aga Khan Award | The Daily Star","outlet":"The Daily Star","published":"2019-08-29","language":"en","from_operator":false},{"url":"https://www.thedailystar.net/country/news/think-about-reasons-while-going-change-bangladeshi-award-winning-architect-1799854","title":"Think about reasons while going for change: Bangladeshi award-winning architect | The Daily Star","outlet":"The Daily Star","published":"2019-09-14","language":"en","from_operator":false},{"url":"https://www.architects.org/architecture-in-dialogue-the-digital-collection/arcadia-education-project","title":"Boston Society for Architecture | Arcadia Education Project","outlet":"Boston Society for Architecture","published":"2020-06-04","language":"en","from_operator":false}],"context_sources":[],"editor_notes":"**出典の由来。** 5本のうち、独立した由来は3つしかない。 出典[1]は後半が「Description of project by Saif Ul Haque Sthapati」と断った設計事務所自身の説明文である。 出典[2][3]はアガ・カーン建築賞の2019年の発表に由来し、出典[3]は「a press release from Aga Khan Development Network」と 明記している。**出典[5]の本文と、出典[4]の末尾「Project Journey」の節は、語句がそのまま同じで、 どちらも賞の主催者の配った資料である。**独立した取材は、出典[4]の前半——UNB が設計者に行った聞き取り——だけである。 本文では、この3つの由来を混ぜずに帰属させた。 **掲載日の取り方。** 出典[3][4]は掲載日が構造化された箇所に無く、本文で見出しの直後に 「29 August 2019 UPDATED 30 August 2019」の形で入っている。**関連記事欄の日付（取得した当日を含む）も本文に混ざる**ので、 自分の見出しに続くものを採った。出典[2]は JSON-LD が2019年8月29日、time[datetime] が2019年9月15日で、 本文が「আজ বৃহস্পতিবার」（今日木曜日）に発表されたと書いているため、8月29日を掲載日とし9月15日は更新日と判断した。 **賞金の単位。** 出典[2]は賞金を「১০ লাখ ডলার」（10ラカ・ドル）と書いている。 ラカは10万を指す単位なので、出典[3][4]の「$1 million」と同じ額である。本文では出典[3]の表記に合わせて100万ドルとした。 **start_year の弱さ。** 2012年という年の根拠は、出典[1]の記事末尾のデータ欄の「Dates 2012-2016」だけである。 **このラベルが設計の開始を指すのか工事の開始を指すのかを、出典は書き分けていない。** 他の4本はいずれも年を書いていない。この弱さを承知のうえで採った。 **status_current を判定不能とした理由。** 最新の出典が2020年6月4日で、そこから6年のあいだ、 この学校が今どうなっているかを書いた出典を見つけられなかった。 ベンガル語（আর্কেডিয়া）でも探したが、2019年の受賞の報道と、robots.txt が塞いでいる jagonews24.com の 特集記事しか出てこない。**継続しているとも縮小したとも書けないので、判定不能とした。** **人口。** 南カナルチョルは村であり、これより小さい単位の人口を出典から取れなかった。 推測で区分を選ばないため不明とした。 **purpose について。** 建てた公共施設が 誇りをつくる に落ちるのは、be-0005・co-0002・gr-0002・ke-0001・sn-0001 に続いて6件目である。 出典が事業の出発点として書いているのは「借りていた校舎の期限が切れ、予算の都合で開発に向かない土地しか買えなかったこと」で、 これは purpose 8種のどれにも当たらない。pending.md の2026-08-20 に、sn-0001 の項の続きとして bd-0001 の項を立てた。 **賞の主催者のページ（the.akdn）と archnet.org は使っていない。**前者は掲載日が取れず、 後者は robots.txt が HTTP 429 で取れないため取りに行っていない。","unknown_fields":["population_current","population_scale","status_current"],"latest_source_year":2020,"elapsed_years":8,"follow_up":"薄い","follow_up_note":"ボストン建築協会は2020年6月4日の頁で、この校舎が乾季には地面に載りモンスーンの期間は浮くこと、審査団の評が、海面の上がる時代に地元で手に入る材料で安く確かなものを建てられる例だとしていることを載せている。2020年より後に、この学校の現在を書いた出典は見つけられなかった。","timeline":[{"year":2016,"event":"事業の期間が終わったとされる。ただし出典は記事末尾のデータ欄に2012〜2016年と記すのみで、この年が竣工を指すのか事業の終わりを指すのかは書いていない","source_url":"https://www.metalocus.es/en/news/amphibious-modules-arcadia-education-project-saif-ul-haque"},{"year":2019,"event":"20件の最終候補から選ばれた6件の1つとして、アガ・カーン建築賞を受けたと報じられた","source_url":"https://www.prothomalo.com/bangladesh/%E0%A6%86%E0%A6%97%E0%A6%BE-%E0%A6%96%E0%A6%BE%E0%A6%A8-%E0%A6%85%E0%A7%8D%E0%A6%AF%E0%A6%BE%E0%A6%93%E0%A7%9F%E0%A6%BE%E0%A6%B0%E0%A7%8D%E0%A6%A1-%E0%A6%AA%E0%A7%87%E0%A6%B2%E0%A7%87-%E2%80%98%E0%A6%86%E0%A6%B0%E0%A7%8D%E0%A6%95%E0%A7%87%E0%A6%A1%E0%A6%BF%E0%A7%9F%E0%A6%BE-%E0%A6%8F%E0%A6%A1%E0%A7%81%E0%A6%95%E0%A7%87%E0%A6%B6%E0%A6%A8"},{"year":2020,"event":"ボストン建築協会が、受賞6件をめぐる展示の一つとしてこの校舎を紹介した","source_url":"https://www.architects.org/architecture-in-dialogue-the-digital-collection/arcadia-education-project"}],"discrepancies":[{"field":"敷地が水に浸かっている期間","values":[{"value":"1年のうち5か月近く","source_url":"https://www.metalocus.es/en/news/amphibious-modules-arcadia-education-project-saif-ul-haque","published":"2019-05-24"},{"value":"毎年5か月","source_url":"https://www.thedailystar.net/city/bangladeshi-project-wins-aga-khan-award-for-architecture-2019-1792831","published":"2019-08-29"},{"value":"毎年4か月（同じ面の中で「1年の3分の1」とも書いている。同じ長さの別の言い方）","source_url":"https://www.architects.org/architecture-in-dialogue-the-digital-collection/arcadia-education-project","published":"2020-06-04"}]}],"last_verified":"2026-08-20","image":{"url":"https://www.metalocus.es/sites/default/files/styles/mopis_fullslider_desktop/public/lead-images/metalocus_aga-khan-14_01_2p.jpg?itok=JGLndF0U","type":"photo","relevance_confirmed":true,"credit":"METALOCUS","source_url":"https://www.metalocus.es/en/news/amphibious-modules-arcadia-education-project-saif-ul-haque"},"sections":{"何をしたか":"ダッカ郊外ケラニガンジの南カナルチョルで、年に数か月水に浸かる川べりの敷地に、水が来れば浮き、水が引けば地面に降りる校舎を建てた。プロトム・アロは2019年8月29日に、この校舎がドラム缶と竹と縄でつくられていることを伝えている。METALOCUS が載せた設計事務所の説明によれば、土を盛って地面を上げる、あるいは高床にするという通常のやり方は敷地の地形に合わず、敷地につないだまま乾季も雨季も使える両生のモジュール式の構造が答えになった。ボストン建築協会は2020年6月4日の頁で、浮きに使い終えた30ガロンのドラム缶が竹の枠に収められていることを載せている。","誰が始めたか":"デイリー・スターは2019年9月14日に、設計者 Saif Ul Haque が、依頼主である Maleka Welfare Trust の会長 Razia Alam に謝意を述べ、実験的な構造をとる時間と自由を与えてくれたと語ったことを伝えている。METALOCUS が載せた設計事務所の説明は、依頼主を私設の社会福祉団体 Maleka Welfare Trust とし、同団体が、既にあった就学前教育の施設を移し、単身の女性のための寮・保育所・職業訓練所を加えるために土地を買ったとしている。**同誌の編集部が書いている前半では、この施設は寮ではなく避難所・保育所・職業訓練所とされている。**\n\nデイリー・スターの記事末尾の節とボストン建築協会の頁は、語句がそのまま同じ記述を載せている。それによれば、次のとおりである。Razia Alam は英国で40年教えたあとバングラデシュに戻り、恵まれない子どものための学校を自分の年金で始めた。借りていた校舎の期限が切れたため土地を探したが、予算の都合で開発に向かない土地しか選べなかった。学校を水の近くに置きたいと考えて川べりの土地を買ったところ、そこはモンスーンの時期に水に沈む土地だった。\n\nデイリー・スターは2019年9月14日に、設計者が UNB の聞き取りに、川から砂を採って地面をならすやり方には自分は乗り気でなかった、それは環境により多くの問題を持ち込むからだと語ったこと、影響をよく調べないまま環境と景観をまるごと変えることはできないと述べたことを伝えている。","いくらかかったか":"**建設費を書いた出典は1本も無い。** 5本のいずれも、工事の費用にも運営の費用にも触れていない。\n\n分かるのは規模と、学校そのものの成り立ちだけである。**年金の話は、この校舎の建設費ではなく、Razia Alam が以前から続けていた学校を始めたときのことである。**METALOCUS は記事末尾のデータ欄で面積を486平方メートルとしている。語句がそのまま同じ記述として、デイリー・スターとボストン建築協会は、借りていた校舎の期限が切れて土地を探したとき、買える範囲が予算で限られていたことを書いている。ボストン建築協会は、竹が近隣の村で買われ、川を流して敷地まで運ばれたとしている。","真似するなら最低何が必要か":"**水を追い出さずに受け入れる。** ボストン建築協会は2020年6月4日の頁で、生態系を壊して盛り土の台をつくることも、乾季に高くなりすぎる高床にすることも避け、敷地につないだうえで地面に載ることも水に浮くこともできる構造にしたと書いている。同頁によれば、建物の底の面は、砂・土・地元の煉瓦を詰めた土嚢の擁壁でならされ、その上に使い終えたタイヤを緩衝材として留めてある。\n\n**浮力は、手に入るもので出す。** 同頁によれば、校舎は3種類の竹でつくられ、竹の枠に収めた使い終えた30ガロンのドラム缶によって浮く。竹は軽さと持ちのよさで選ばれ、近隣の村で買われて川を流して運ばれた。METALOCUS が載せた設計事務所の説明も、竹を用途ごとに種類を変えて使ったこと、ドラム缶や古い車のタイヤなど、多くを使い回したものでまかなったことを挙げている。\n\n**水に強くするやり方は、その土地にすでにある。** ボストン建築協会によれば、下部の構造と係留の柱と屋根に使う竹は薬剤で処理され、それ以外の部材は地元のガブ（gaab）の実を煮てつくった液を塗って防水された。同頁はこれをバングラデシュの伝統的な方法としている。継ぎ手の多くは、錆びる針金ではなく縄で結ぶやり方をとっている。\n\n**電気を前提にしない。** 同頁によれば、教室の弓なりの竹の屋根は柱を要らなくしており、工事はいくつかの電池式のドリルを除いて手道具だけで行われた。","今どうなっているか":"プロトム・アロは2019年8月29日に、この校舎が、タタルスタンのカザンで発表された2019年のアガ・カーン建築賞の6件のうちの1つに選ばれたと報じている。同紙によれば、最終候補は20件で、うち2件がバングラデシュのものだった。同紙は、この賞が1977年に始まり3年ごとに贈られること、2016年にもバングラデシュの建築家2人が受けていることを併記している。デイリー・スターは2019年8月29日に、受賞した6件が100万ドルを分け合うと書いている。\n\nボストン建築協会は2020年6月4日の頁で、審査団の評として、海面が上がっていく時代に、地元で手に入る材料で安く確かなものを建てられることをこの学校が示していること、単純で小さいながら、浮力・川の流れに対する係留・廃棄物の扱いという難しい問題を解いていることを載せている。\n\n**2020年より後に、この学校が今どうなっているかを書いた出典は見つけられなかった。** そのため status_current は判定不能とした。ベンガル語でも探したが、出てくるのは2019年の受賞の報道と、robots.txt が我々を塞いでいる媒体の特集記事だけだった。**敷地が水に浸かっている期間も、5か月とする出典と4か月とする出典に割れており、1つに丸めていない。**ボストン建築協会の頁は同じ面の中で「1年の3分の1」とも「毎年4か月」とも書いているが、これは同じ長さの別の言い方である。なお5か月とする2本のうち、METALOCUS の記述は設計事務所自身の説明の中にある。デイリー・スターは賞金額と賞の創設年について主催者の配信に拠ると書いているが、この期間の記述には出どころを書いていない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"be-0002","name":"欧州文化首都の年に生まれた行進を、市内の団体と学校が作る形で2年に一度続けた","name_local":"Zinneke Parade","name_variants":["Zinnekeparade"],"country":"ベルギー","region":"ブリュッセル首都圏","municipality":"ブリュッセル","population_current":1255795,"population_scale":"25万超","purpose":"誇りをつくる","theme":"文化・アート・祭り","start_year":2000,"end_year":null,"status_current":"継続中","actor_type":"NPO","lead_actor":"vzw Zinneke と、市内の150を超える団体・学校・アーティスト・地区の組織","component_types":"soft","components":["2年に一度の行進をする","加わる集団が設営物と振付を作る","学校や地域の団体を巻き込む","弱い立場の人との創作を軸に置く"],"sources":[{"url":"https://www.bruzz.be/culture/events-festivals/zinneke-parade-trekt-na-vier-jaar-opnieuw-door-brussel-2022-04-19","title":"Zinneke Parade trekt na vier jaar opnieuw door Brussel","outlet":"BRUZZ","published":"2022-04-19","language":"nl","from_operator":false},{"url":"https://www.vrt.be/vrtnws/nl/2022/05/14/bekijk-kleurrijke-zinnekeparade-trekt-door-de-straten-van-een/","title":"Kleurrijke Zinneke Parade trekt door de straten van een zonovergoten Brussel en lokt 70.000 toeschouwers","outlet":"VRT NWS","published":"2022-05-14","language":"nl","from_operator":false},{"url":"https://www.vrt.be/vrtnws/nl/2025/10/06/toekomst-van-zinneke-parade-onzeker-door-onduidelijkheid-werking/","title":"Toekomst van Zinneke Parade in Brussel onzeker door onduidelijkheid werkingsmiddelen","outlet":"VRT NWS","published":"2025-10-06","language":"nl","from_operator":false},{"url":"https://www.bruzz.be/actua/samenleving/brussels-gewest-steunt-zinneke-parade-na-lange-periode-van-onzekerheid-2026-05-30","title":"Brussels Gewest steunt Zinneke Parade na lange periode van onzekerheid","outlet":"BRUZZ","published":"2026-05-30","language":"nl","from_operator":false},{"url":"https://www.vrt.be/vrtnws/nl/2026/05/30/brussel-zinneke-parade-editie-14/","title を覆う案を出したと、のちに報じられた","source_url":"https://www.vrt.be/vrtnws/nl/2026/08/06/ringparken-opening-eerste-linkeroever-antwerpen-oosterweel-leefb/"},{"year":2022,"event":"北側の2.8キロが覆われることになり、当初予定の1.6キロより1.2キロ長くなったと報じられた","source_url":"https://www.vrt.be/vrtnws/nl/2022/10/19/ringland-reageert-positief-op-overkapping-2-8-kilometer-noordeli/"},{"year":2023,"event":"市民運動が2037年までの全面の覆いを求め、南側については懸念が残ると報じられた","source_url":"https://www.vrt.be/vrtnws/nl/2023/10/10/ringland-wil-volledige-overkapping-tegen-2037/"},{"year":2025,"event":"3つ目の Ringpark の工事が始まり、川を地上に戻して2つの島を作ると報じられた","source_url":"https://www.vrt.be/vrtnws/nl/2025/09/29/ringpark-het-schijn-antwerpen-eerste-deel-oosterweel/"},{"year":2026,"event":"最初の Ringpark が左岸で正式に開かれたと報じられた","source_url":"https://www.vrt.be/vrtnws/nl/2026/08/06/ringparken-opening-eerste-linkeroever-antwerpen-oosterweel-leefb/"}],"last_verified":"2026-08-19","image":{"url":"https://images.vrt.be/vrtnws_share/2020/04/30/cad14123-8b05-11ea-aae0-02b7b76bf47f.jpg","type":"photo","relevance_confirmed":true,"credit":"VRT NWS","source_url":"https://www.vrt.be/vrtnws/nl/2023/10/10/ringland-wil-volledige-overkapping-tegen-2037/"},"sections":{"何をしたか":"アントワープの環状道路を覆って公園にすることを市民運動が求め、政府・市・港湾公社との協定の当事者になった。VRT は2026年8月9日に、2003年に地元の運動がボルヘルハウト付近の環状道路を覆う案を出し、2014年に Ringland が加わって環状道路全体を覆う案が出たこと、その後フランデレン政府・アントワープ市・港湾公社と3つの市民運動のあいだで Toekomstverbond という協定が生まれたことを伝えている。同紙は2022年10月19日に、北側の2.8キロが覆われることになり、当初予定の1.6キロより1.2キロ長くなったこと、その資金の手当てもついたことを報じている。","誰が始めたか":"","いくらかかったか":"","真似するなら最低何が必要か":"","今どうなっているか":""},"completeness":"stub","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"br-0002","name":"都心の高架道路を条例で公園にした","name_local":"Minhocão","name_variants":["Elevado Presidente João Goulart","Parque Municipal do Minhocão"],"country":"ブラジル","region":"サンパウロ州","municipality":"São Paulo","population_current":11451999,"population_scale":"25万超","purpose":"歩けるようにする","theme":"交通・道路・駅","start_year":2018,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"Prefeitura de São Paulo","component_types":"soft","components":["週末と祝日は車を通さない","平日も夜20時から閉じる","条例で市の公園として位置づけた"],"single_outlet":true,"sources":[{"url":"https://agenciabrasil.ebc.com.br/geral/noticia/2018-02/doria-sanciona-lei-que-institui-o-parque-muncipal-do-minhocao","title":"Doria autoriza criação do Parque Municipal do Minhocão","outlet":"Agência Brasil","published":"2018-02","language":"pt"},{"url":"https://agenciabrasil.ebc.com.br/geral/noticia/2019-02/prefeitura-quer-transformar-o-minhocao-em-parque-linear","title":"Prefeitura de SP quer transformar o Minhocão em Parque Linear","outlet":"Agência Brasil","published":"2019-02","language":"pt"},{"url":"https://agenciabrasil.ebc.com.br/geral/noticia/2021-12/minhocao-de-sao-paulo-faz-50-anos-e-ganha-galeria-de-arte-urbana","title":"Minhocão de São Paulo faz 50 anos e ganha galeria de arte urbana","outlet":"Agência Brasil","published":"2021-12","language":"pt"},{"url":"https://agenciabrasil.ebc.com.br/geral/noticia/2025-06/especialistas-debatem-impactos-da-desativacao-do-minhocao-em-sao-paulo","title":"Especialistas debatem impactos da desativação do Minhocão em São Paulo","outlet":"Agência Brasil","published":"2025-06","language":"pt"}],"context_sources":[{"url":"https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6%5B3550308%5D","title":"IBGE 2022年センサス（サンパウロ市 11,451,999人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2025,"elapsed_years":7,"follow_up":"濃い","follow_up_note":"2018年2月に公園化の条例が認可され、2019年2月には3,800万レアルで線形公園に変える構想が示されたが、予定されていた2020年12月の完成を伝える記録は確認できなかった。2024年の基本計画は2029年までの高架の廃止を定めており、2025年6月時点で撤去の費用と影響が議論されている。","timeline":[{"year":2018,"event":"2月8日、市が公園として位置づける条例を認可した。90日以内に運用時間を定めるとされた","source_url":"https://agenciabrasil.ebc.com.br/geral/noticia/2018-02/doria-sanciona-lei-que-institui-o-parque-muncipal-do-minhocao"},{"year":2019,"event":"2月24日、市が線形公園に変える構想を示した。費用は3,800万レアル、完成予定は2020年12月とされた","source_url":"https://agenciabrasil.ebc.com.br/geral/noticia/2019-02/prefeitura-quer-transformar-o-minhocao-em-parque-linear"},{"year":2021,"event":"12月11日、高架の50年に合わせて側面の壁が都市アートの展示に使われた。全長は3.6キロメートル","source_url":"https://agenciabrasil.ebc.com.br/geral/noticia/2021-12/minhocao-de-sao-paulo-faz-50-anos-e-ganha-galeria-de-arte-urbana"},{"year":2024,"event":"市の基本計画で、2029年までに高架を廃止することが定められた","source_url":"https://agenciabrasil.ebc.com.br/geral/noticia/2025-06/especialistas-debatem-impactos-da-desativacao-do-minhocao-em-sao-paulo"},{"year":2025,"event":"6月11日、廃止の影響を専門家が議論した。2020年の調査では全面撤去に1億3,000万レアルとされ、現在はその倍以上になるとされている","source_url":"https://agenciabrasil.ebc.com.br/geral/noticia/2025-06/especialistas-debatem-impactos-da-desativacao-do-minhocao-em-sao-paulo"}],"last_verified":"2026-08-16","image":{"url":"https://imagens.ebc.com.br/8xqukeJlQ-xnzcKuKTu28EpKoGE=/1600x800/https://agenciabrasil.ebc.com.br/sites/default/files/atoms/image/1107475-rvrsa_abr_01172012763820180208.jpg?itok=ZLlm4k1q","type":"photo","relevance_confirmed":true,"credit":"Agência Brasil","source_url":"https://agenciabrasil.ebc.com.br/geral/noticia/2025-06/especialistas-debatem-impactos-da-desativacao-do-minhocao-em-sao-paulo"},"sections":{"何をしたか":"サンパウロ都心を貫く高架道路ミニョカン（Minhocão、正式名 Elevado Presidente João Goulart）について、市は2018年2月、その下と上を市立公園（Parque Municipal do Minhocão）として位置づける条例を公布した。条例により同年3月から土曜・日曜・祝日は車を全面的に通さず、5月からは平日も20時以降を通行禁止とした。高架を壊すのではなく、**車が通る時間を削って人に明け渡す**という形をとっている。2019年には市が線形公園への転換構想を示し、2021年には高架の50年に合わせて壁面が都市アートの展示に使われた。","誰が始めたか":"**この事業には「開通」がなく、代わりに数十年の議論がある。** Agência Brasil 2025年6月11日は、ミニョカンが1971年に開通し、成長の速い都市で車の通行を助ける目的で東西のゾーンを結んで建設されたと書いている。同2019年2月24日の記事は、**高架の廃止は数十年にわたって議論されてきた**とし、周辺住民が騒音・大気・景観の影響のなかで暮らしている一方で、この道路が都心の交通の流れにおいて重要でもあると書いている。\n\n**条例では市議会が先に動き、市長が後から範囲を狭めた。** 2018年2月8日の記事によれば、公園を設ける法律16.833号は前日に市長 João Doria が裁可し、当日に市の官報に公布された。**同時に市長は、市議会議員が可決していた「7月と1月の学校の長期休暇中は終日閉鎖する」という項目に拒否権を行使している。** 市はその理由として、交通工学会社（CET）の調査で休暇中の車の流量の減少が30%にとどまり、渋滞を大きく減らすには足りないことを挙げた。**住民参加の管理協議会（conselho gestor）を置くという条文は残ったが、その性格と90日以内の選挙を定めた各項は拒否権で削られている。**\n\n**司法の側からも早い段階で当事者が現れた。** 2019年2月の記事によれば、サンパウロ州検察（MP-SP）が廃止による車の通行への影響を懸念して都市計画・許認可担当局長 Fernando Barrancos Chucre に説明を求め、同氏は翌週に検察へ出向いて調査を示すよう呼ばれた。\n\n**専門家・市民団体が正面に出てくるのは2025年である。** 同年6月11日、サンパウロ商業協会が開いた議論の場に、Insper の都市モビリティ部門の Sérgio Avelleda、元市計画局長で建築都市計画家の Fernando Chucre、歩行者移動の団体 Cidadeapé の元理事 Rafael Gândara Calabria が並んだ。**壁面のアートは行政の事業として説明されていない。** 2021年12月11日の記事は、沿線に元からあった建物の側面に42点の絵が描かれ、Kobra、@nosartivistas、Tek、Sapatintas といった作家の署名があると書いている。","いくらかかったか":"**公園化に投じた額は確認できなかった。** 4本の出典はいずれも金額を書いていない。**ただし費用の構造は、この事業の作り方そのものに現れている。**\n\n- **建設ではなく時間を削る形なので、初期の費用は条例と交通運用の側にある。** 2018年3月から土曜・日曜・祝日は全面的に車を通さず、5月から平日も20時〜7時を通行禁止にした。**壊す工事も新設する工事も伴っていない**\n- **手を入れた分は、既存の構造への付け足しである。** 2019年2月の記事によれば、第1期（8月まで）は歩行者が高架に上がるための階段とエレベーターを9か所に設け、側面の防護を立てるもので、第2期（下半期から）は庭・プランター・デッキを**プレファブのモジュール**で置くものだった。区間はプラサ・ローズベルトからラルゴ・ド・アロウシェまでの**900メートル**で、全体の17,500メートルは後年に回された\n- **比較の対象として、撤去の費用だけは数字が出ている。** 2025年6月の記事によれば、**2020年の調査で全面撤去に1億3,000万レアルかかるとされ、現在の価格では少なくともその倍になると見込まれている。** Chucre は200社に照会し、費用または環境影響と廃棄物の面から**すべての企業が実行不可能と答えた**と述べている（国外の企業にも照会したという）\n- **代替路を作る場合の費用は示されていない。** 2024年に承認された基本計画（Plano Diretor）が前提とする6.9kmの「Boulevard Marquês de São Vicente」は用地収用を伴うが、その額はこの記事に書かれていない\n\n`funding_scale` は `unknown_fields` のままとした。**出典に公園化の事業費が無い**ためである。","真似するなら最低何が必要か":"1. **車を通す時間を削る条例。** ここで作られたのは施設ではなく規則である。週末・祝日は全面、平日は20時から。**建設を伴わないため、条例が通った時点で公園になっている**\n2. **交通の代替を数字で説明できること。** 長期休暇中の全面閉鎖が拒否権で削られた理由は、CET の調査による「減少は30%にとどまる」という数字だった。検察からの説明要求もこの点である。**代替の説明が用意できない範囲は削られる**\n3. **区間を分けて始めること。** 全体17,500メートルのうち、他の公共空間（プラサ・ローズベルト、パルケ・アウグスタ、ラルゴ・ド・アロウシェ、プラサ・マレシャル・デオドロ）とつながる900メートルを最初に選んでいる\n4. **上に登る手段と落ちない備え。** 階段とエレベーターを9か所、側面の防護。**高架を歩かせるには、水平の面より縦の動線が要る**\n5. **運営の器を条例に書くこと。** 法律16.833号は住民の社会的統制を伴う管理協議会による民主的な運営を定めた。**ただしその性格と選挙の手続きは拒否権で削られており、器の実装は条文に残っていない**\n6. **壊す案との比較を持ち続けること。** 2025年の議論では、部分撤去を伴う公園化（Chucre）と、代替路を作らない完全廃止＋公園（Calabria）が並んでいる。Calabria は、代替路を作ると新設した側と元の側の両方で交通が悪化すると述べている\n\n**確認できないもの**は、公園化に投じた額、利用者数、管理協議会が実際に設置されたか、条例が2年以内に求めていた都市介入計画が出されたか、17,500メートル全体のうちどこまで整備されたか、2029年までの廃止が実行されるかである。","今どうなっているか":"**2026年8月時点で確認できた最も新しい記録は、2025年6月11日の Agência Brasil の記事である。**\n\n2025年6月時点の運用は、**平日は20時まで自動車の専用道路として動き、それ以降と週末・祝日は車を閉めて7時から22時まで公衆に開く**というものである。同記事は、この時間帯に散歩・ランニング・余暇の場として使われていると書いている。\n\n**廃止の期限が計画に入った。** 同記事によれば、**2024年に承認された基本計画は2029年までのミニョカンの廃止を定めており**、市はそれが6.9kmの「Boulevard Marquês de São Vicente」の建設によって可能になるとしている。この道は西ゾーンのマルケス・デ・サン・ヴィセンテ通りやセルジオ・トマス通りから東ゾーンのサリン・ファラー・マルフ通りまでを結ぶもので、用地収用を伴う。市長 Ricardo Nunes は、サンタ・セシリア地区にトンネルを作って現在の高架の交通を受ける案にも言及したとされる。\n\n**高架の下では別の工事が動いている。** 同記事は、駐車の枠を設けたのち、市が同月7日から**高架下に雨庭（jardins de chuva）**を作る工事を始めたと書いている。アマラル・グルジェル通りの再整備の第2期で、クーニャ・オルタ通りとジャグアリベ通りの間の4ブロックが対象、タクシーの待機枠・自転車の貸出地点・柱につる植物を伴う。\n\n**議論は2つに割れたまま続いている。** Avelleda は、構造物の空間をどうするかが市の大きな争点で、**構造をすべて使って交流の場にする側と、撤去する側の2つが長年固まっている**と述べている。Chucre は公園化の側に立ち、部分的な撤去と床版の一部の絞り込み、複数の開口部を一度にまとめて行なえば再生できると述べる。Calabria は代替路を作らない完全な廃止と公園を支持する。**撤去の側については、2020年の調査額（1億3,000万レアル）と200社が実行不可能と答えたという Chucre の説明が、同じ記事に併記されている。**\n\n**出典の性格について明記しておく。** **4本すべてが Agência Brasil の記事であり、単一媒体である**（`single_outlet: true`。掲載年は2018・2019・2021・2025の4か年に分かれている）。同社は連邦政府系の公共通信社であり、この事業の主体はサンパウロ市であるため運営主体そのものの発信ではないが、**縦の記述が1社の取材に依存していることは変わらない。** 2021年12月の記事は、市長がニューヨークのハイラインを訪れたことを伝えている（Terroir では `us-0001` として別に収録している）。**この事業についての否定的な報道は、2025年の記事に併記された撤去支持の論のほかには、今回探した範囲では見つからなかった。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"1億3,000万レアル","currency":"BRL","value":130000000,"jpy":4016780950}],"sample":false},{"id":"br-0003","name":"150年の鉄の市場を直しながら、売り手を仮設に移して続けさせた","name_local":"Mercado de São José","country":"ブラジル","region":"ペルナンブコ州","municipality":"レシフェ","population_current":1488920,"population_scale":"25万超","purpose":"誇りをつくる","theme":"商店街・市場","start_year":2018,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"レシフェ市（都市サービス公社 Csurb ／インフラ局 SEINFRA ／都市化公社 URB）","funding_scale":"2018年時点の工事費見積りは880万レアルで、財源は国のPAC歴史都市。2025年時点の投資額は2,000万レアル近くに達している","component_types":"hard","components":["鋳鉄の構造と建具を修復した","売り手を仮設の上屋に移した","移らない売り手に月3千レアルを払った","工事に合わせて発掘調査を入れた"],"single_outlet":true,"sources":[{"url":"https://www.diariodepernambuco.com.br/noticia/vidaurbana/2018/07/mercado-de-sao-jose-sera-requalificado-e-transformado-em-polo-de-atrac.html","title":"Mercado de São José será requalificado e transformado em polo de atração cultural","outlet":"Diario de Pernambuco","published":"2018-07-28","language":"pt","from_operator":false},{"url":"https://www.diariodepernambuco.com.br/noticia/vidaurbana/2024/01/comerciantes-de-artesanato-do-mercado-de-sao-jose-passam-a-trabalhar-e.html","title":"Comerciantes de artesanato do Mercado de São José passam a trabalhar em local provisório","outlet":"Diario de Pernambuco","published":"2024-01-04","language":"pt","from_operator":false},{"url":"https://www.diariodepernambuco.com.br/noticia/vidaurbana/2025/04/mercado-de-sao-jose-era-um-cemiterio-aponta-pesquisa-arqueologica.html","title":"Mercado de São José era um cemitério, aponta pesquisa arqueológica da UFRPE","outlet":"Diario de Pernambuco","published":"2025-04-14","language":"pt","from_operator":false},{"url":"https://www.diariodepernambuco.com.br/vida-urbana/2025/06/7792668-mercado-de-sao-jose-150-anos-de-ferro-memoria-e-resistencia-popular.html","title":"Mercado de São José: 150 anos de ferro, memória e resistência popular","outlet":"Diario de Pernambuco","published":"2025-06-23","language":"pt","from_operator":false},{"url":"https://www.diariodepernambuco.com.br/vida-urbana/2025/09/11696699-mercado-de-sao-jose-deve-ter-obra-finalizada-ate-2027-diz-prefeitura-do-recife.html","title":"Mercado de São José deve ter obra finalizada até 2027, diz Prefeitura do Recife","outlet":"Diario de Pernambuco","published":"2025-09-25","language":"pt","from_operator":false}],"context_sources":[{"url":"https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6%5B2611606%5D","title":"IBGE 2022年センサス（レシフェ市 1,488,920人）"}],"unknown_fields":[],"latest_source_year":2025,"elapsed_years":7,"follow_up":"濃い","follow_up_note":"2018年7月に880万レアルの再整備が発表され、2024年1月に工芸品売り場が第1期工事に入って約100人の売り手が仮設に移った。2024年10月に始まった発掘調査で30体以上の人骨が出て、敷地が墓地だったことが分かった。2025年9月、市長は全体の完成を2027年と述べている。","timeline":[{"year":2018,"event":"7月28日、143年で2度目の大規模改修となる再整備が発表された。工事費880万レアル、財源は国のPAC歴史都市。着工は翌年後半、工期は最低2年とされた","source_url":"https://www.diariodepernambuco.com.br/noticia/vidaurbana/2018/07/mercado-de-sao-jose-sera-requalificado-e-transformado-em-polo-de-atrac.html"},{"year":2024,"event":"1月8日から工芸品売り場が第1期工事に入り、約100人の売り手のうち46人が仮設の上屋に移り、54人は月3,000レアルの支給を選んだ","source_url":"https://www.diariodepernambuco.com.br/noticia/vidaurbana/2024/01/comerciantes-de-artesanato-do-mercado-de-sao-jose-passam-a-trabalhar-e.html"},{"year":2025,"event":"4月、2024年10月に始まった発掘調査で30体以上の人骨が見つかり、敷地がもともと墓地だったことが分かった","source_url":"https://www.diariodepernambuco.com.br/noticia/vidaurbana/2025/04/mercado-de-sao-jose-era-um-cemiterio-aponta-pesquisa-arqueologica.html"},{"year":2025,"event":"6月23日、開設150年を迎えた","source_url":"https://www.diariodepernambuco.com.br/vida-urbana/2025/06/7792668-mercado-de-sao-jose-150-anos-de-ferro-memoria-e-resistencia-popular.html"},{"year":2025,"event":"9月25日、市長は第1期を2026年に終え、全体の完成は2027年になると述べた。投資額は2,000万レアル近くに達している","source_url":"https://www.diariodepernambuco.com.br/vida-urbana/2025/09/11696699-mercado-de-sao-jose-deve-ter-obra-finalizada-ate-2027-diz-prefeitura-do-recife.html"}],"last_verified":"2026-08-17","image":{"url":"https://www.diariodepernambuco.com.br/_midias/jpg/2025/06/23/600x400/1_mercado_de_sao_jose-664814.jpeg","type":"photo","relevance_confirmed":true,"credit":"Diario de Pernambuco","source_url":"https://www.diariodepernambuco.com.br/vida-urbana/2025/06/7792668-mercado-de-sao-jose-150-anos-de-ferro-memoria-e-resistencia-popular.html"},"sections":{"何をしたか":"レシフェ中心部の公設市場サンジョゼ市場を、**売り手を働かせたまま段階的に直している**取り組み。市場は1875年9月に開設された鋳鉄造りで、パリのグルネル市場に着想を得た、ブラジルで最初のプレハブ鉄骨の公設市場とされる。技術面はフランス人技師 Louis Léger Vauthier が担った。1973年に国の記念物に指定されている。\n\n**2018年7月28日、レシフェ市は880万レアルの再整備を発表した。** 143年の歴史で2度目の大規模改修で、前回から24年が空いていた。財源は国のPAC歴史都市。鋳鉄の構造・建具・ステンドグラス・屋根を修復し、床を張り替え、中2階を設ける内容で、運営は市の都市サービス公社 Csurb が担う。市は、サンパウロ市営市場を例に挙げて、**文化・芸術・食の拠点にする**と説明している。\n\n**特徴は、売り手を止めずに動かした点にある。** 2024年1月8日から工芸品売り場が第1期工事に入り、近くの仮設の上屋（140区画以上）へ移った。影響を受けた約100人の許可業者のうち、**46人が仮設に移り、54人は工事のあいだ月3,000レアルの支給を選んだ**（Diario de Pernambuco 2024年1月4日）。\n\n**工事は予定どおりには進んでいない。** 2024年10月に始まったペルナンブコ連邦農村大学（UFRPE）の発掘調査で、敷地がもともと墓地だったことが分かり、30体以上の人骨が見つかった。市場は「墓地型の遺跡」として扱われている。2025年9月25日、ジョアン・カンポス市長は、第1期は2026年に終わり、**全体の完成は2027年**になると述べた。第1期の完了後は、いま営業している側の業者が仮設に移る番になる。","誰が始めたか":"**事業主体はレシフェ市である。** 市場の運営と管理は市の都市サービス公社 Csurb が担い、工事はインフラ局 SEINFRA と都市化公社 URB が進めている。市場は国の歴史遺産機関 IPHAN によって保護されており、**1973年に国の記念物に指定**されている。\n\n**目標として名指しされたのは、別の市場だった。** 2018年7月28日の Diario de Pernambuco によれば、市はこの市場を**文化・芸術・食の拠点にする**と説明し、その例として**サンパウロ市営市場**を挙げている。\n\n**建物そのものの出自も古い。** 1875年9月の開設で、技術面はフランス人技師 Louis Léger Vauthier が担った。歴史家 Artur Garcéa は2025年6月23日の同紙で、この市場が19世紀のレシフェの近代化におけるヨーロッパの影響の最大の例の一つであり、都市の衛生化と再編の計画の一部として構想されたと述べている。","いくらかかったか":"**2018年時点の見積りは880万レアルだった**（Diario de Pernambuco 2018年7月28日）。財源は国の「PAC 歴史都市」で、着工は翌年後半、工期は最低2年とされていた。\n\n**実際にはその倍以上になっている。** 2025年9月25日の同紙は、**投資額が2,000万レアル近くに達している**と書いている。\n\n**費用は工事だけではない。** 工事のあいだ、工芸品売り場の許可業者のうち**54人が月3,000レアルの支給を選んだ**（2024年1月4日）。46人は仮設の上屋に移っている。**売り手を止めない選択には、賃料相当の補償という形の費用がついている。**","真似するなら最低何が必要か":"この事例で真似できる単位は、鉄の市場の修復そのものではなく**売り手を止めない工事の組み方**である。\n\n第一に、**売り手に2つの選択肢を出す**こと。仮設の上屋に移るか、月3,000レアルの支給を受けるか。**約100人のうち46人と54人にきれいに割れた。** 移りたい人と休みたい人の両方がいる、という前提で設計されている。\n\n第二に、**仮設をすぐ近くに置く**こと。仮設の上屋は市場の別館のそばに置かれ、140区画以上を収容した。**客がついてこられる距離でなければ、営業の継続にならない。**\n\n第三に、**区画を半分ずつ動かす**こと。第1期は工芸品売り場で、これが終われば**いま営業している側の業者が仮設に移る番になる**（2025年9月25日）。市場全体を一度に閉めていない。\n\n第四に、**発掘調査の時間を工程に入れる**こと。2024年10月に始まった調査で、**敷地がもともと墓地だったことが分かり、30体以上の人骨が見つかった。** 市場は「墓地型の遺跡」として扱われている。**古い市街地の工事では、掘った先の事情で工程が動く。**\n\n第五に、**完成時期が動くことを前提に説明を続ける**こと。2018年の見積りは工期最低2年だった。2025年9月の時点で、第1期の完了は2026年、全体の完成は2027年とされている。**当初から7年以上ずれている。**","今どうなっているか":"2026年8月時点で確認できたのは、2025年9月25日の Diario de Pernambuco の記事までである。\n\n**工事は続いており、完成はまだ先である。** 2025年9月25日、ジョアン・カンポス市長は IPHAN との現場視察の場で、**第1期（工芸品売り場）は2026年に終わり、全体の完成は2027年**になると述べた。第1期の完了後は、いま営業している側の業者が仮設に移る番になる。\n\n**約100人の許可業者が影響を受けたままである。** 46人が仮設の上屋におり、54人は月3,000レアルの支給を受けている。\n\n**工程を動かしているのは考古学である。** 2024年10月に始まったペルナンブコ連邦農村大学（UFRPE）の調査で30体以上の人骨が見つかり、市場は墓地型の遺跡として扱われている。\n\n**2025年に節目が2つ重なった。** 6月23日に開設150年を迎え、同じ年に**市場の歴史と記憶がレシフェの無形文化遺産に指定された。** 建物を直しているあいだに、建物ではないものが遺産として登録された形になっている。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"880万レアル","currency":"BRL","value":8800000,"jpy":271905172},{"raw":"2,000万レアル","currency":"BRL","value":20000000,"jpy":617966300},{"raw":"3,000レアル","currency":"BRL","value":3000,"jpy":92695}],"sample":false},{"id":"br-0004","name":"住民組織が自分たちで数え、9年続けて数字を出し続けた","name_local":"Redes da Maré","country":"ブラジル","region":"リオデジャネイロ州","municipality":"リオデジャネイロ（マレ地区）","population_current":6211223,"population_scale":"25万超","purpose":"住民が決める","theme":"デジタル・情報発信","start_year":2013,"end_year":null,"status_current":"継続中","actor_type":"NPO","lead_actor":"Redes da Maré（創設者・理事 Eliana Sousa Silva）","funding_scale":"確認できなかった。参照した3本のどこにも、調査・刊行にかかる費用や財源の記載がない","component_types":"soft","components":["地区の全戸調査を自分たちで行った","警察活動の記録を毎年集計した","学校と保健所の閉鎖日数を数えた","結果を番号付きの年次報告で出した"],"single_outlet":true,"sources":[{"url":"https://agenciabrasil.ebc.com.br/educacao/noticia/2019-10/rj-pesquisa-aponta-que-mare-precisa-reforcar-educacao-para-jovens","title":"RJ: pesquisa aponta que Maré precisa reforçar educação para jovens","outlet":"Agência Brasil","published":"2019-10-08","language":"pt","from_operator":false},{"url":"https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2025-03/complexo-da-mare-teve-42-operacoes-policiais-e-20-mortos-em-2024","title":"Complexo da Maré teve 42 operações policiais e 20 mortos em 2024","outlet":"Agência Brasil","published":"2025-03-21","language":"pt","from_operator":false},{"url":"https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-03/operacoes-policiais-na-mare-deixaram-160-mortes-em-dez-anos","title":"Operações policiais na Maré deixaram 160 mortes em dez anos","outlet":"Agência Brasil","published":"2026-03-19","language":"pt","from_operator":false}],"context_sources":[{"url":"https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6%5B3304557%5D","title":"IBGE 2022年センサス（リオデジャネイロ市 6,211,223人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2026,"elapsed_years":13,"follow_up":"濃い","follow_up_note":"2013年に始めた全戸調査が2019年10月8日に「マレ国勢調査」として刊行された。治安についての年次報告は2026年3月に第9号を数え、2016年から2025年の10年で警察活動231回・死者160人を集計している。2025年の警察活動は16回・死者12人だった。","timeline":[{"year":2013,"event":"地区の全戸調査（マレ国勢調査）が始まった","source_url":"https://agenciabrasil.ebc.com.br/educacao/noticia/2019-10/rj-pesquisa-aponta-que-mare-precisa-reforcar-educacao-para-jovens"},{"year":2019,"event":"10月8日、マレ国勢調査が刊行された。15歳以上の非識字率6%はリオ市全体の2.8%の2倍以上で、複合地区の学校44校のうち中学後期は5校、高校は3校（うち2校は夜間のみ）だとされた","source_url":"https://agenciabrasil.ebc.com.br/educacao/noticia/2019-10/rj-pesquisa-aponta-que-mare-precisa-reforcar-educacao-para-jovens"},{"year":2025,"event":"3月21日、2024年の警察活動は42日・死者20人で、2021年の7回の6倍だと公表された。88%が学校の近くで行われ、授業の中止は37日、平均7,302人の児童生徒に及んだ","source_url":"https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2025-03/complexo-da-mare-teve-42-operacoes-policiais-e-20-mortos-em-2024"},{"year":2026,"event":"3月19日、年次報告の第9号で、2016年から2025年の警察活動231回・死者160人・権利侵害1,538件が公表された。学校の閉鎖は通算163日で、ほぼ1学年分にあたるとされた","source_url":"https://agenciabrasil.ebc.com.br/direitos-humanos/noticia/2026-03/operacoes-policiais-na-mare-deixaram-160-mortes-em-dez-anos"}],"last_verified":"2026-08-17","image":{"url":"https://imagens.ebc.com.br/On1caa76h0BzyFn39_2QfcSwee0=/1600x800/https://agenciabrasil.ebc.com.br/sites/default/files/thumbnails/image/909324-mare_ocupacao_7_0.jpg?itok=gnYRUDMf","type":"photo","relevance_confirmed":true,"credit":"Agência Brasil","source_url":"https://agenciabrasil.ebc.com.br/educacao/noticia/2019-10/rj-pesquisa-aponta-que-mare-precisa-reforcar-educacao-para-jovens"},"sections":{"何をしたか":"リオデジャネイロ北部の15のファヴェーラからなるマレ地区で、**住民組織が自分たちの地区の統計を自前でつくり、刊行し続けている**取り組み。建物を建てるのではなく、**数字を出すこと自体を仕掛けにしている。**\n\nひとつは全戸調査である。**2013年に始まった調査が、2019年10月8日に「マレ国勢調査（Censo Maré）」として刊行された。** Redes da Maré の調査・事業監視部門の責任者 Dalcio Marinho によれば、15歳以上の非識字率は6%で、リオ市全体の2.8%の2倍以上にあたる。複合地区には調査時点の約2倍にあたる44校があるが、中学後期（6〜9年）を置くのは5校、高校は3校で、うち2校は夜間のみだった。\n\nもうひとつは治安の記録である。「De Olho na Maré（マレを見張る）」という取り組みのもとで、**警察活動の回数・死者・権利侵害を毎年数え、番号を振った年次報告として出している。** 2026年3月19日に出た第9号は、**2016年から2025年の10年間で警察活動231回、死者160人、権利侵害1,538件**を集計している。2025年は警察活動16回・死者12人だった。\n\n**数え方が、生活の側から組み立てられている。** 2025年3月の公表では、2024年の警察活動42日のうち88%が学校の近くで行われ、授業の中止は37日、平均7,302人の児童生徒に及んだこと、約90%が保健施設の近くだったことが示された。第9号では、10年間の学校閉鎖が通算163日で**ほぼ1学年分にあたる**とされ、2025年だけで保健施設の14日の閉鎖により7,866件の受診・追跡ができなかったとされている。\n\n**この数字は係争の中にある。** Redes da Maré 創設者の Eliana Sousa Silva は、ファヴェーラでの警察活動を規律する最高裁の決定（ADPF 635、通称「ファヴェーラのADPF」）について、これは警察の活動を止めるためのものではなく、**警察がマレに入る手段が警察活動しかないことを問うている**のだと述べている。同じ報道は、**リオ州政府側がADPFは警察活動を妨げていないと主張している**ことも伝えている。","誰が始めたか":"**非政府組織 Redes da Maré である。** 創設者で理事の Eliana Sousa Silva が、複数の報道で当事者として発言している。組織はマレ地区の中から出ており、活動は地区の内側で行われる。\n\n**数える仕事は部門に分かれている。** 全戸調査は**調査・事業監視部門（Núcleo de Pesquisas e Monitoramento de Projetos）**が担い、2019年の刊行時は Dalcio Marinho が責任者だった。治安の記録は**「安全への権利と司法へのアクセス」部門**が担い、2026年時点の調整役は Tainá Alvarenga である。\n\n**「De Olho na Maré（マレを見張る）」という名前の取り組みが、治安の記録の枠組みになっている。** 数えるのは外部の研究機関ではなく、地区の組織そのものである。","いくらかかったか":"**調査・集計・刊行にかかる費用や財源は、参照した3本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**代わりに出てくるのは、数えられた側の損失である。** 2025年3月の公表では、2024年の警察活動により授業が37日中止され、平均7,302人の児童生徒に及んだ。2026年3月の第9号では、10年間の学校閉鎖が通算163日で**ほぼ1学年分**にあたるとされ、2025年だけで保健施設の14日の閉鎖により**7,866件の受診・追跡ができなかった**とされている。**この事例では、費用ではなく「失われた日数と人数」が金額に相当する指標になっている。**","真似するなら最低何が必要か":"この事例で真似できる単位は、地区の統計そのものではなく**数え方の設計**である。\n\n第一に、**自分たちで数える**こと。国勢調査や警察の統計を待つのではなく、地区の組織が全戸を回り、警察活動を毎年集計している。**外から数えられるのを待たない。**\n\n第二に、**生活の側の単位で数える**こと。警察活動の回数や死者数だけでなく、**学校の近くで行われた割合（88%）、授業の中止日数（37日）、影響を受けた児童生徒数（平均7,302人）、保健施設の閉鎖日数（14日）と受診できなかった件数（7,866件）**を数えている。**「何が起きたか」ではなく「誰の何日が失われたか」に翻訳している。**\n\n第三に、**番号を振って続ける**こと。治安の年次報告は2026年3月で第9号にあたる。**単発の調査ではなく、同じ形式で並べられる時系列になっている。** 2016年から2025年という10年の幅は、この積み重ねからしか出てこない。\n\n第四に、**時間の幅で言い直す**こと。10年間の学校閉鎖163日を「ほぼ1学年分」と表現している。**日数の合計を、失われた教育の単位に置き換えている。**\n\n第五に、**数字が誰と争うのかを分かっていること。** Redes da Maré は、この調査が最高裁の決定（ADPF 635）の必要性を裏づけると主張し、州政府側はその決定が警察活動を妨げていないと主張している。**数えることは中立の作業ではなく、係争の中に置かれる。**","今どうなっているか":"2026年8月時点で確認できたのは、2026年3月19日の Agência Brasil の記事までである。\n\n**記録は続いており、最新は第9号である。** 2026年3月19日、「De Olho na Maré」による『マレにおける安全への権利 2025』第9号が公表された。**2016年から2025年の10年間で、15のファヴァーラからなる複合地区で警察活動231回、死者160人、権利侵害1,538件**が集計されている。脅迫・拷問・不法監禁も含まれる。\n\n**直近の年は減っている。** 2025年の警察活動は16回・死者12人で、2024年の42日・20人より少ない。ただし2024年は2021年の7回の6倍という水準だった。\n\n**教育と保健への影響も同じ報告で数えられている。** 10年間の学校閉鎖は通算163日でほぼ1学年分にあたるとされ、2025年だけで保健施設の14日の閉鎖により7,866件の受診・追跡ができなかったとされる。\n\n**この数字をめぐる対立は続いている。** Redes da Maré 創設者の Eliana Sousa Silva は、最高裁の決定（ADPF 635）は警察の活動を止めるためのものではなく、警察がマレに入る手段が警察活動しかないことを問うているのだと述べている。**同じ報道は、リオ州政府側がその決定は警察活動を妨げていないと主張していることも伝えている。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"br-0005","name":"地区の中だけで使える通貨を作り、買い物を地区に戻した","name_local":"Banco Palmas","name_variants":["moeda social Palmas","Instituto Palmas"],"country":"ブラジル","region":"セアラ州","municipality":"フォルタレザ（コンジュント・パルメイラス地区）","population_current":2428708,"population_scale":"25万超","purpose":"お金を地域で回す","theme":"商店街・市場","start_year":1998,"end_year":null,"status_current":"継続中","actor_type":"住民組織","lead_actor":"コンジュント・パルメイラス住民協会（のちの Instituto Palmas。調整役 Joaquim de Melo Neto）","funding_scale":"1998年1月の設立時の資本は2,000レアル。事業全体の総額は確認できていない","component_types":"soft","components":["地区の中だけで使える紙の通貨を出した","住民協会が小口の融資を行った","地区の生産と消費を2年ごとに調べた","紙の通貨を携帯の決済に移した"],"sources":[{"url":"https://www.scielo.br/j/cebape/a/xkJX7X738ByCfDLXW8KFKjc/?format=html&lang=pt","title":"O paradoxo das Palmas: análise do (des)uso da moeda social no \"bairro da economia solidária\"","outlet":"Cadernos EBAPE.BR 15(1)","published":"2017-03-01","language":"pt","from_operator":false,"source_type":"academic"},{"url":"https://www.scielo.br/j/rbeur/a/ry9rxsg4Z8wnrXnGnWVMVtv/?format=html&lang=pt","title":"A moeda social e o fortalecimento do espaço diferencial nas periferias","outlet":"Revista Brasileira de Estudos Urbanos e Regionais 19(2)","published":"2017-04-27","language":"pt","from_operator":false,"source_type":"academic"},{"url":"https://www.scielo.br/j/ccrh/a/zVQwwSVg3DJ4nkWyBGwyvGK/?format=html&lang=pt","title":"ENTRE O DIÁLOGO E A RESISTÊNCIA: o movimento social de bairro no Conjunto Palmeiras, em Fortaleza (CE)","outlet":"Caderno CRH 32(87)","published":"2019-12-31","language":"pt","from_operator":false,"source_type":"academic"},{"url":"https://www.scielo.br/j/rac/a/n3TkXYtmk8kqRBXvrdxSp9c/?format=html&lang=pt","title":"Palmas para o E-Dinheiro! A Evolução Digital de uma Moeda Social Local","outlet":"Revista de Administração Contemporânea 24(5)","published":"2020-09-01","language":"pt","from_operator":false,"source_type":"academic"}],"context_sources":[{"url":"https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6%5B2304400%5D","title":"IBGE 2022年センサス（フォルタレザ市 2,428,708人）"}],"unknown_fields":["funding_scale"],"latest_source_year":2020,"elapsed_years":22,"follow_up":"濃い","follow_up_note":"1998年1月に資本2,000レアルで住民協会が銀行を始め、2000年代初めから紙の地域通貨を出した。1997年から2009年で地区内での買い物は20%から93%に反転したとされる。2017年の論文は、15年たって通貨の流通そのものは目立って減った一方、地区内での消費は高いままだという「逆説」を指摘している。","timeline":[{"year":1998,"event":"1月、住民協会が資本2,000レアルで Banco Palmas を始めた。地区の生産と消費で territorio を発展させるという考えで、当時の国内では例のない試みだった","source_url":"https://www.scielo.br/j/rac/a/n3TkXYtmk8kqRBXvrdxSp9c/?format=html&lang=pt"},{"year":2009,"event":"1997年からのあいだに、地区の家庭の買い物のうち地区内で行われる割合が20%から93%へ反転したとする調査結果が示された","source_url":"https://www.scielo.br/j/rac/a/n3TkXYtmk8kqRBXvrdxSp9c/?format=html&lang=pt"},{"year":2017,"event":"3月、15年を経て通貨 Palmas の流通は目立って減った一方、地区内での消費は高いままだという「逆説」を論じた論文が出た。銀行の2年ごとの調査では住民の93〜95%が地区内で消費している","source_url":"https://www.scielo.br/j/cebape/a/xkJX7X738ByCfDLXW8KFKjc/?format=html&lang=pt"},{"year":2019,"event":"12月、コンジュント・パルメイラスの地区社会運動を、対話と抵抗の両面から検討した論文が出た","source_url":"https://www.scielo.br/j/ccrh/a/zVQwwSVg3DJ4nkWyBGwyvGK/?format=html&lang=pt"},{"year":2020,"event":"9月、紙の地域通貨を携帯の決済「E-Dinheiro」に移した経緯が教育用の事例として論文になった","source_url":"https://www.scielo.br/j/rac/a/n3TkXYtmk8kqRBXvrdxSp9c/?format=html&lang=pt"}],"last_verified":"2026-08-17","sections":{"何をしたか":"ブラジル北東部フォルタレザの周縁地区コンジュント・パルメイラスで、**地区の中だけで使える通貨を出して、住民の買い物を地区の外に流れ出さないようにした**取り組み。**1998年1月、住民協会が資本2,000レアルで Banco Palmas を始めた。** 地区での生産と消費によって地域を発展させるという考えで、当時のブラジルでは例のない試みだったとされる（Revista de Administração Contemporânea 2020年9月）。のちに中央銀行との関係から Instituto Palmas と呼ばれるようになった。2000年代初めからは紙の地域通貨 Palmas を発行している。\n\n**効果は買い物の向きで測られている。** 同じ論文によれば、**1997年から2009年のあいだに、地区の家庭の買い物のうち地区内で行われる割合は20%から93%へ反転し**、他所での買い物は約7%に下がった。2011年には地区を回るお金がおよそ6,800万レアルになったとされる。\n\n**ただし、その後の検証は単純な成功とは書いていない。** 2017年3月の Cadernos EBAPE.BR の論文は、**15年を経て通貨 Palmas そのものの流通は目立って減った一方、地区内での消費は高いままである**という状態を「パルマスの逆説」と呼んで分析している。同論文によれば、銀行が2年ごとに行う生産と消費の調査では、住民の93〜95%が地区内で消費している。**通貨の使用は減ったが、通貨が目指した買い物の向きは残った、という形である。**\n\n**当事者はこれを失敗とは受け取っていない。** 同じ論文は、Banco Palmas の調整役 Joaquim de Melo Neto が、地域通貨の使用はそれ自体が目的ではないという見方を示していると伝えている。2020年9月の Revista de Administração Contemporânea は、紙の通貨を携帯の決済「E-Dinheiro」へ移した経緯を教育用の事例として扱っている。","誰が始めたか":"**始めたのは住民協会そのものである。** Revista de Administração Contemporânea（2020年9月）は、**1998年1月に住民協会の取り組みとして Banco Palmas が生まれた**と書いている。地区での生産と消費によって地域を発展させるという考えで、当時のブラジルでは例のない試みだった。のちに、中央銀行との関係から Instituto Palmas という名称が使われるようになった。\n\n**コンジュント・パルメイラスは、もともと住民運動の長い蓄積がある地区である。** Caderno CRH（2019年12月31日）は、この地区の社会運動を対話と抵抗の両面から検討している。銀行は、その運動の中から出てきた道具のひとつという位置づけになる。\n\n調整役の Joaquim de Melo Neto が、複数の論文で当事者の説明者として登場する。","いくらかかったか":"**設立時の資本は2,000レアルだった**（Revista de Administração Contemporânea 2020年9月）。この額で地区の銀行を始めている。\n\n**回っている金額のほうが桁が大きい。** 同論文によれば、**2011年には地区を回るお金がおよそ6,800万レアル**になったとされる。\n\n**事業全体の運営費や、通貨の発行にかかる費用は、参照した4本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。","真似するなら最低何が必要か":"この事例で真似できる単位は、通貨そのものではなく**測り方と、通貨の位置づけ**である。\n\n第一に、**買い物の向きを定期的に測る**こと。Banco Palmas は**2年ごとに地区の生産と消費を調べている。** 1997年に20%だった地区内での買い物の割合が2009年に93%になった、という数字はこの調査から出ている。**通貨の発行量ではなく、買い物がどこで行われたかを指標にしている。**\n\n第二に、**通貨を目的にしない**こと。2017年の論文が示したのは、15年たって通貨の流通は目立って減った一方、**地区内での消費は93〜95%の水準で維持されている**という状態である。調整役の Joaquim de Melo Neto は、地域通貨の使用はそれ自体が目的ではないという見方を示している。**通貨が使われなくなったことを、そのまま失敗と読まない設計になっている。**\n\n第三に、**小さく始める**こと。設立時の資本は2,000レアルである。\n\n第四に、**通貨だけを置かない**こと。この事例では住民協会による小口の融資と組み合わされている。**買う先を地区に留める仕組みと、買う力をつくる仕組みが対になっている。**\n\n第五に、**紙をやめる判断を用意しておく**こと。2020年の論文は、紙の地域通貨を携帯の決済「E-Dinheiro」へ移した経緯を扱っている。**形は変えられる前提で組む。**","今どうなっているか":"2026年8月時点で確認できたのは、2020年9月の Revista de Administração Contemporânea までである。**最新の出典が2020年で、その後の5年余りを書いた出典に到達していない。**\n\n分かっているのは次の形である。**通貨 Palmas そのものの流通は、2017年の時点で15年前と比べて目立って減っていた。** 一方で、銀行が2年ごとに行う調査では**住民の93〜95%が地区内で消費している。** 2020年の論文は、紙の通貨を携帯の決済「E-Dinheiro」へ移す動きを扱っており、**紙をやめる方向で形が変わっていることまでは確認できる。**\n\n**E-Dinheiro がその後どうなったか、Banco Palmas が現在も動いているかは、参照した4本からは判定できなかった。** `status_current: 継続中` としたのは、2020年の論文が現在進行形の事業として扱っているためであり、それ以降の稼働を示す出典は確認していない。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"2,000レアル","currency":"BRL","value":2000,"jpy":61797},{"raw":"6,800万レアル","currency":"BRL","value":68000000,"jpy":2101085420}],"sample":false},{"id":"br-0007","name":"手押し車で資源ごみを集めていた人たちに電動三輪車と予約制の回収路を渡した","name_local":"Re-ciclo","name_variants":["Re-Ciclo","projeto Re-ciclo"],"country":"ブラジル","region":"セアラ州","municipality":"フォルタレザ（2025年11月の再開時点で27地区）","population_current":2428708,"population_scale":"25万超","purpose":"お金を地域で回す","theme":"エネルギー・資源循環","start_year":2020,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"フォルタレザ市。設計は科学技術革新財団（Citinova）の革新研究室（LABIFOR）、2025年の再開時の実施は保全・公共サービス局（SCSP）。回収は市内の廃品回収者（catadores）の団体が担う","funding_scale":"2024年9月に WRI Ross Center Prize for Cities の大賞として25万ドルを受けた。2022年の開始時は iFood との協力協定で回収者におよそ37万レアルの収入を見込んだ。2025年11月の再開では月額最大1,500レアルの報奨と日額24レアルの手当が出ている","component_types":"hybrid","components":["電動三輪車で戸口から集める","予約はウェブとアプリで受ける","回収者の団体に材料を渡す","エコポイントで選別と洗浄をする","日額の食費と交通費を出す","回収量を記録して交渉に使う"],"sources":[{"url":"https://www.conceituado.com/noticias/educacao/com-expectativa-de-coletar-350-toneladas-de-residuos-re-ciclo-facilita-descarte-de-reciclaveis-em-fortaleza/","title":"Com expectativa de coletar 350 toneladas de resíduos, Re-ciclo facilita descarte de recicláveis em Fortaleza","outlet":"ConceituAdo","published":"2022-09-09","language":"pt","from_operator":false},{"url":"https://www.wri.org/insights/e-tricycles-power-recycling-revolution-in-fortaleza-brazil","title":"E-Bikes Power a Recycling Revolution in Fortaleza, Brazil","outlet":"World Resources Institute","published":"2024-09-12","language":"en","from_operator":false},{"url":"https://www.wri.org/news/release-re-ciclo-wins-grand-prize-2023-2024-wri-ross-center-prize-cities","title":"RELEASE: Re-Ciclo Wins Grand Prize in 2023-2024 WRI Ross Center Prize for Cities","outlet":"World Resources Institute","published":"2024-09-25","language":"en","from_operator":false},{"url":"https://portalterradaluz.com.br/noticias/sustentabilidade-prefeitura-de-fortaleza-vence-premio-wri-ross-center-for-cities-com-o-projeto-re-ciclo/","title":"Prefeitura de Fortaleza vence Prêmio WRI Ross Center for Cities com o projeto Re-ciclo","outlet":"Portal Terra da Luz","published":"2024-09-27","language":"pt","from_operator":false},{"url":"https://diariodonordeste.verdesmares.com.br/ceara/projeto-de-coleta-seletiva-por-aplicativo-feita-por-catadores-de-fortaleza-e-suspenso-1.3692438","title":"Projeto de coleta seletiva por aplicativo feita por catadores de Fortaleza é suspenso","outlet":"Diário do Nordeste","published":"2025-09-23","language":"pt","from_operator":false},{"url":"https://portalterradaluz.com.br/noticias/meio-ambiente-programa-re-ciclo-e-retomado-em-fortaleza-com-bonificacoes-e-atendimento-a-27-bairros/","title":"Meio Ambiente: Programa Re-ciclo é retomado em Fortaleza com bonificações e atendimento a 27 bairros","outlet":"Portal Terra da Luz","published":"2025-11-07","language":"pt","from_operator":false}],"context_sources":[{"url":"https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6%5B2304400%5D","title":"IBGE 2022年センサス（フォルタレザ市 2,428,708人）"}],"discrepancies":[{"field":"2022年9月以降に集めた資源ごみの量","values":[{"value":"980トン（うち稼働1年目は380トン）","source_url":"https://www.wri.org/insights/e-tricycles-power-recycling-revolution-in-fortaleza-brazil","published":"2024-09-12"},{"value":"656トン","source_url":"https://portalterradaluz.com.br/noticias/sustentabilidade-prefeitura-de-fortaleza-vence-premio-wri-ross-center-for-cities-com-o-projeto-re-ciclo/","published":"2024-09-27"}]}],"unknown_fields":[],"latest_source_year":2025,"elapsed_years":5,"follow_up":"濃い","follow_up_note":"2020年に回収者の研修と自転車の配布から始まり、2022年9月に5地区で本格運用に入った。2024年9月に WRI の大賞を受けたが、2025年に資金の交付が止まって約5か月動かず、2025年11月7日に27地区で再開している。","timeline":[{"year":2019,"event":"TUMI（Transformative Urban Mobility Initiative）の世界都市交通チャレンジでフォルタレザが受けた賞が、この事業の元になった","source_url":"https://diariodonordeste.verdesmares.com.br/ceara/projeto-de-coleta-seletiva-por-aplicativo-feita-por-catadores-de-fortaleza-e-suspenso-1.3692438"},{"year":2020,"event":"回収者の研修と最初の自転車の配布から始まった。CAF と GIZ の支援を受けている","source_url":"https://www.conceituado.com/noticias/educacao/com-expectativa-de-coletar-350-toneladas-de-residuos-re-ciclo-facilita-descarte-de-reciclaveis-em-fortaleza/"},{"year":2021,"event":"フォルタレザ科学技術革新財団（Citinova）が加わって拡大した","source_url":"https://diariodonordeste.verdesmares.com.br/ceara/projeto-de-coleta-seletiva-por-aplicativo-feita-por-catadores-de-fortaleza-e-suspenso-1.3692438"},{"year":2022,"event":"9月1日にムクリペで開始の催しが行われ、5地区・三輪車10台・12か月の試行に入った","source_url":"https://www.conceituado.com/noticias/educacao/com-expectativa-de-coletar-350-toneladas-de-residuos-re-ciclo-facilita-descarte-de-reciclaveis-em-fortaleza/"},{"year":2024,"event":"9月25日、ニューヨークで WRI Ross Center Prize for Cities 2023-2024 の大賞（25万ドル）を受けた","source_url":"https://www.wri.org/news/release-re-ciclo-wins-grand-prize-2023-2024-wri-ross-center-prize-cities"},{"year":2025,"event":"4月までで資金の交付が止まり、9月23日時点で約5か月動いていないと報じられた。市は契約更新の手続き中だと答えている","source_url":"https://diariodonordeste.verdesmares.com.br/ceara/projeto-de-coleta-seletiva-por-aplicativo-feita-por-catadores-de-fortaleza-e-suspenso-1.3692438"},{"year":2025,"event":"11月7日、27地区・回収者39人で再開した。月額最大1,500レアルの報奨が付いた","source_url":"https://portalterradaluz.com.br/noticias/meio-ambiente-programa-re-ciclo-e-retomado-em-fortaleza-com-bonificacoes-e-atendimento-a-27-bairros/"}],"last_verified":"2026-08-19","image":{"url":"https://files.wri.org/d8/s3fs-public/styles/1222x722/s3/2024-09/fortaleza-eco-point.jpg?VersionId=m441P0cDFzW6R4sAXxPVdShHa_E9Ah0t&h=a1e1a043&itok=6eGWk0jd","type":"photo","relevance_confirmed":true,"credit":"World Resources Institute","source_url":"https://www.wri.org/insights/e-tricycles-power-recycling-revolution-in-fortaleza-brazil"},"sections":{"何をしたか":"ブラジル・フォルタレザ市で、**手押し車で資源ごみを集めていた回収者（catadores）に電動三輪車を渡し、住民が予約した家を順に回る回収路をつくった**取り組み。集めた材料は回収者の団体に渡り、エコポイントと呼ばれる拠点で選別・洗浄されてから売られる（World Resources Institute 2024年9月12日）。\n\n**2020年に研修と最初の自転車の配布から始まった**（Diário do Nordeste 2025年9月23日）。2022年9月1日にムクリペで開始の催しが行われ、5地区・三輪車10台・12か月の試行に入った（ConceituAdo 2022年9月9日）。\n\nWorld Resources Institute（2024年9月12日）によれば、フォルタレザには市に正式に雇われていない回収者がおよそ8,000人おり、手押し車で最大240キログラムを18時間かけて運ぶ人もいて、平均の収入は月およそ300レアル（約53ドル）だった。2023年に処理施設まで届いた資源ごみは市全体の6%である。\n\n**2024年9月25日、この事業は WRI Ross Center Prize for Cities 2023-2024 の大賞（25万ドル）を受けた。**","誰が始めたか":"**始めたのは市の側である。** World Resources Institute（2024年9月12日）は、この事業を市政府の革新研究室（LABIFOR）が率いるものとし、新型コロナウイルスの流行下で、働けなくなった回収者を支える方法を市が探していた時期に本格的に始まったと書いている。LABIFOR はフォルタレザ科学技術革新財団（Citinova）の中にある。\n\n**元になったのは交通の賞である。** Portal Terra da Luz（2024年9月27日）と Diário do Nordeste（2025年9月23日）はどちらも、この事業がフォルタレザが2019年に TUMI（Transformative Urban Mobility Initiative）の世界都市交通チャレンジで受けた賞に由来し、ドイツの開発機関（GIZ）とラテンアメリカ開発銀行（CAF）の連携から生まれたと書いている。\n\n**設計の段階から回収者の団体が入っている。** Citinova 会長ルイス・アルベルト・サボイアは、回収者の団体が最初から制度の設計に加わっていたことがこの政策では決定的だったと述べており、市内16の回収者団体すべてと検討の場を持ったとされる（World Resources Institute 2024年9月12日）。\n\n**民間も入っている。** 2022年の本格運用は、市と iFood の協力協定にもとづき、スタートアップの SOLOS が運営を担う形で始まった（ConceituAdo 2022年9月9日）。実施の担当はその後変わり、2025年11月の再開は保全・公共サービス局（SCSP）が行っている（Portal Terra da Luz 2025年11月7日）。","いくらかかったか":"**事業費の総額は、参照した6本のどこにも書かれていない。** 分かるのは断片である。\n\n- **賞金**：2024年9月25日、実業家スティーブン・M・ロスから25万ドルの大賞が渡された（World Resources Institute 2024年9月25日）\n- **民間からの収入見込み**：2022年の開始時、iFood との連携によって回収者におよそ37万レアルの収入が生まれると見込まれていた（ConceituAdo 2022年9月9日）\n- **回収者に渡る額**：2025年11月の再開では、39人に月額最大1,500レアルの報奨と、日額24レアル（食費15レアル・交通費9レアル）の手当が出ている（Portal Terra da Luz 2025年11月7日）\n\n**集めた量は出典間で食い違っている。** 2022年9月以降の累計について、World Resources Institute（2024年9月12日）は980トン（うち稼働1年目に380トン）、Portal Terra da Luz（2024年9月27日）は656トンと書いている。**掲載日は15日しか離れていない。** `discrepancies` に並置した。","真似するなら最低何が必要か":"第一に、**すでにその仕事をしている人を置き換えない**こと。フォルタレザにはおよそ8,000人の回収者がいて、市の廃棄物処理の実質を担っていた（World Resources Institute 2024年9月12日）。**この事業は回収の担い手を新しく雇うのではなく、いまいる回収者に道具と回収路を渡している。**\n\n第二に、**設計の場に団体を先に入れる**こと。市内16の回収者団体すべてと検討の場を持ってから制度を組んでいる（同）。\n\n第三に、**運ぶ距離を短くする道具を選ぶ**こと。モウラ・ブラジル回収者協会の会長ラケル・シルバは、以前は1回の巡回で3〜4か所だったのが、同じ時間で10〜16か所まで回れるようになったと説明している（同）。**収入が増えた理由は単価ではなく、1回で回れる件数である。**\n\n第四に、**回収量を記録して、それを交渉に使えるようにする**こと。回収路ごとにデータを取り、回収者が自分の集めた量を把握して賃金の交渉に使える形にしている（同）。\n\n第五に、**予約の仕組みを用意する**こと。住民はウェブまたはアプリで日時を指定して家庭回収を予約し、回収者は住所の一覧を受けて巡回する（Diário do Nordeste 2025年9月23日）。回収路の外に住む人はエコポイントに直接持ち込む（World Resources Institute 2024年9月12日）。\n\n第六に、**契約が切れたときに何が止まるかを先に見ておく**こと。**この事業は2025年に約5か月止まっている。** 止まったのは三輪車の台数ではなく、車両の修理と日当に充てる資金だった（Diário do Nordeste 2025年9月23日）。**道具を渡す設計は、道具の維持費が切れた時点で止まる。**","今どうなっているか":"**2026年8月時点で確認できたのは、2025年11月7日の記事までである。**\n\n**受賞の翌年に止まっている。** Diário do Nordeste（2025年9月23日）は、この事業が約5か月動いていないと報じた。同紙によれば、セアラ州資源回収者ネットワークの調整役レイナ・マラは、三輪車12台が積み重ねられたままだと述べ、回収者の月収が1,200〜1,400レアルから240レアルに落ちたとしている。ロサリナ回収者協会に8年いるジョアン・パウロは、いまは月400〜600レアルで、材料の値段によって上下すると述べている。マラによれば、2025年2月に局との会合があり、維持費が無いので車両の使用をやめるよう助言されたという。\n\n**当事者の側の説明も同じ記事に載っている。** 保全・公共サービス局（SCSP）は文書で、この事業は契約更新の手続き中であり、三輪車の回収は行っていないと答えている。同局によれば46台は回収者と18の団体・組織のもとに残っており、52人の回収者が対象である。更新の間、選別回収のトラックを1台出して、集めた材料を団体に渡しているとしている。\n\n**2025年11月7日に再開した。** Portal Terra da Luz（2025年11月7日）によれば、SCSP がこの日に事業を再開し、39人の回収者が直接の対象となった。対象は27地区で、回収は月曜から金曜の9時から16時30分である。SCSP 局長アブレウ・マシャドは、この事業がごみを機会に変える新しい考え方を示すものだと述べている。\n\n**受賞時の説明と、その後に起きたことは食い違っている。** World Resources Institute の報道発表（2024年9月25日）は、この事業が「非公式の労働者を市の職員に変えた」と書いていた。**一方 Diário do Nordeste（2025年9月23日）が伝えたのは、資金の交付が2025年4月で切れた時点で回収者の収入が落ちたという事実である。** 参照した6本の中に、この2つの記述の関係を説明したものは無い。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"25万ドル","currency":"USD","value":250000,"jpy":39780521},{"raw":"37万レアル","currency":"BRL","value":370000,"jpy":11432377},{"raw":"1,500レアル","currency":"BRL","value":1500,"jpy":46347},{"raw":"24レアル","currency":"BRL","value":24,"jpy":742},{"raw":"15レアル","currency":"BRL","value":15,"jpy":463},{"raw":"9レアル","currency":"BRL","value":9,"jpy":278}],"sample":false},{"id":"br-0008","name":"施設を建てる代わりに、すでに地域でやっている文化の活動そのものに国が金を出した","name_local":"Programa Cultura Viva","name_variants":["Política Nacional de Cultura Viva","Pontos de Cultura"],"country":"ブラジル","region":"全国（ブラジル全土）","municipality":"全国の市町村（出典に出る例はサルバドール市とアラゴアス州パン・ジ・アスーカル市）","population_current":null,"population_scale":"不明","purpose":"住民が決める","theme":"文化・アート・祭り","start_year":2004,"end_year":null,"status_current":"継続中","actor_type":"混合","lead_actor":"文化省（MinC）と、各地の非営利団体・文化の集まり。Perfil Brasil（2026年3月31日）によれば、2004年から2010年まで文化省にいたセリオ・トゥリーノ氏が Cultura Viva の考え方をまとめた。Nonada（2024年7月10日）によれば、実際の担い手である ponto de cultura は非営利団体や文化の集まりが作った地域に根ざした場である","component_types":"soft","components":["すでにある活動に直接お金を出す","何に使うかを先に決めない","担い手が3年分の計画を出す","公募で選び全国に散らす","州と市に資金と事務を移す"],"sources":[{"url":"http://www.scielo.br/scielo.php?script=sci_arttext&pid=S0011-525820 brasildefato.com.br/2023/09/06/lei-aldir-blanc-2-tornara-a-cultura-viva-e-os-pontos-de-cultura-do-tamanho-do-brasil/"},{"year":2024,"event":"7月、サルバドールでの全国の集まりで20年が祝われ、全国の ponto de cultura は5,900だと報じられた","source_url":"https://www.nonada.com.br/2024/07/20-anos-de-cultura-viva-pontos-de-cultura-lancam-manifesto-com-desafios-e-propostas/"},{"year":2024,"event":"7月、全国委員会が、2023年の公募で選ばれた先への賞金がまだ配られていないとして支払いを求める文書を出した","source_url":"https://www.nonada.com.br/2024/07/20-anos-de-cultura-viva-pontos-de-cultura-lancam-manifesto-com-desafios-e-propostas/"},{"year":2026,"event":"3月、事業をまとめた人物の経歴を伝える記事が出て、届いた人数を900万人としている","source_url":"https://brasil.perfil.com/perfil-poder/celio-turino-a-jornada-do-historiador-que-transformou-o-fazer-cultural-em-politica-de-estado.phtml"}],"last_verified":"2026-08-19","image":{"url":"https://www.nonada.com.br/wp-content/uploads/2022/11/AL_Pao-de-Acucar-Arte-em-Movimento.jpg","type":"photo","relevance_confirmed":true,"credit":"Nonada Jornalismo","source_url":"https://www.nonada.com.br/2024/07/20-anos-de-cultura-viva-pontos-de-cultura-lancam-manifesto-com-desafios-e-propostas/"},"sections":{"何をしたか":"ブラジルで、**文化のための建物を各地に建てる代わりに、すでにその土地でやっている文化の活動そのものに国が直接お金を出す**ようにした仕組み。お金を受け取る側を ponto de cultura（文化の点）と呼ぶ。\n\nDados 56(2)（2013年6月）に載った論文によれば、**この事業には「何に対して出すか」があらかじめ決まっていない。** 担い手は公募に応じ、**自分で立てた3年分の事業計画**にもとづいて選ばれる。同論文によれば、事業は2004年に立ち上がり、**それまでの政策が届いていなかった周縁の文化・地域の担い手にお金が回るようにした点で新しかった。**\n\nNonada（2024年7月10日）によれば、ponto de cultura は**非営利団体や文化の集まりが作った、地域に根ざした場**であり、都市にも農村にもある。音楽・演劇・文学・民衆文化などを届け、**キロンボ（逃亡奴隷の共同体を起源とする集落）・農村・先住民の共同体にも置かれている**（同）。","誰が始めたか":"**国の文化行政である。** Perfil Brasil（2026年3月31日）によれば、歴史家のセリオ・トゥリーノ氏は2004年から2010年まで文化省にいて、当時の大臣ジルベルト・ジル氏のもとで Cultura Viva の考え方をまとめた。同記事は、トゥリーノ氏を Pontos de Cultura の**主な立案者の一人**としている。\n\n**役職の書かれ方は出典で食い違う。** Educação e Território（2021年4月22日）は、2000年代のはじめに「文化的市民権の長」だったとし、Perfil Brasil は「事務局長」としている。`discrepancies` に並置した。\n\n**大きな建物をやめて、活動そのものにお金を出すという入れ替えが要点である。** Perfil Brasil（2026年3月31日）は、この人物を**大きな物理的な事業を、共同体の創造性への直接の投資に取り替えた運営者**として紹介している。\n\n**担い手の側の見方も残っている。** Educação e Território（2021年4月22日）によれば、トゥリーノ氏は、公共政策をつくる人は「住民に何が無いか」という欠乏の考え方でいつも仕事をするが、**ponto de cultura はその逆で、現実を変える力を共同体そのものの中に探しに行くものだ**と述べている。**これは事業をまとめた本人の言葉である。**\n\n**外に広がっている。** Revista Observatório da Diversidade Cultural（2024年8月1日）に載った文化省のマルシア・ロレンベルグ氏の論文は、**その抄録で**、2024年に Cultura Viva の20年と、ブラジルの経験から生まれたイベロアメリカの協力事業 IberCultura Viva の10年が重なり、**同事業には現在12か国が集まっている**と書いている。**この論文の書き手は文化省の側であり、`from_operator: true` として扱った。**","いくらかかったか":"**金額は、参照した6本のどこにも書かれていない。** `unknown_fields` に `funding_scale` を申告した。\n\n**分かるのは配り方である。** Dados（2013年6月）の論文によれば、選抜は公募（edital）で行われ、選ばれた担い手が出す3年分の事業計画にもとづいて資金が渡る。同論文によれば、**2007年からは資金と事務の管理の一部が州と市町村に移された。**\n\n**払われないことがある。** Nonada（2024年7月10日）によれば、2024年7月の時点で、**文化省が2023年に行った Sérgio Mamberti 公募で選ばれた先への賞金がまだ配られていなかった。** 全国委員会はその支払いを求めている。","真似するなら最低何が必要か":"第一に、**「何に対して出すか」を先に決めない**こと。Dados（2013年6月）の論文によれば、この事業には資金の対象となる物があらかじめ定められていない。**建物や機材ではなく、担い手が自分で立てた計画にお金がつく。**\n\n第二に、**すでにある活動を探す**こと。Perfil Brasil（2026年3月31日）は、この事業を、大きな物理的な事業ではなく共同体の創造性への直接の投資に取り替えたものとして紹介している。\n\n第三に、**公募と事業計画という形を用意する**こと。同論文によれば、担い手は公募に応じ、3年分の事業計画を出して選ばれる。\n\n第四に、**受け取る側の事務と会計の態勢を先に用意する**こと。Dados（2013年6月）の論文は、選抜をめぐる問題に加えて執行の側の難しさがあるとしたうえで、**手続きの重さに加えて、多くの ponto de cultura に事務・会計の態勢が無く、担い手にあらかじめの研修も無かったことが、会計報告をめぐる一連の障害を生んだ**と書いている。\n\n第五に、**国だけで抱えず、州と市に渡す道を作っておく**こと。同論文によれば、この事業は2007年から資金と事務の一部を州と市町村に移すことで広がった。\n\n第六に、**担い手が自分たちで声を出す場を認めておく**こと。Nonada（2024年7月10日）によれば、20年の集まりの最後に、全国委員会（Comissão Nacional de Pontos de Cultura）が課題と提案をまとめた文書を出している。","今どうなっているか":"**2026年8月時点で確認できたのは、2026年3月31日の記事までである。**\n\n**数は出典によって違う。** Dados（2013年6月）の論文は年を追って3,000を超えるものが全国につくられたとし、Educação e Território（2021年4月22日）はトゥリーノ氏が1,100の市町村に3,500をつくったとし、Nonada（2024年7月10日）は20年を迎えた時点で5,900だとしている。**時点が違うので `discrepancies` に並置した。** Perfil Brasil（2026年3月31日）は、この網が届いた人数を900万人としている。\n\n**2023年に立て直しの式があった。** Brasil de Fato（2023年9月6日）の記事は、9月1日にレシフェで式が開かれ、文化大臣マルガレッチ・メネゼス氏、人権大臣シルビオ・アルメイダ氏、FUNAI 総裁ジョエニア・ワピチャナ氏、文化省の市民権・文化多様性担当のマルシア・ロレンベルグ氏らが出たと書いている。**ただしこの記事は「Artigo」の欄に載っており、末尾の紹介によれば書き手は文化省 SCDC の「Cultura Viva 国家政策」担当局長である。つまり事業を運営する側の発信であり、`from_operator: true` として扱った。**\n\n**20年の節目に、担い手の側から課題が出された。** Nonada（2024年7月10日）によれば、20年はサルバドールでの全国の集まりで祝われ、その最後に全国委員会が文書を出した。文書は、2023年の Sérgio Mamberti 公募の賞金の支払いを求めるとともに、**予算の締めつけ、デジタルの包摂に関する政策の不在、ブラジルの文化の多様性そのものの価値が認められていないこと**を課題として挙げている。同記事によれば、文書は Sérgio Mamberti・HIP-HOP・Pontões の各賞の支払いの遅れと、予算法における金額が更新されていないことも挙げている。\n\n**この指摘に対する国の側の直接の反論は、参照した6本の中には無い。** 参照した6本のうち2本は国の側の発信である。1本は2024年に文化省のマルシア・ロレンベルグ氏が20年の道のりをまとめた論文（Revista Observatório da Diversidade Cultural 2024年8月1日）で、**その抄録には**市民社会との共同の運営が事業の前提として書かれている。**取得できたのは掲載ページの抄録までで、本文は取れていない。**もう1本は前年の Brasil de Fato への寄稿（2023年9月6日）で、こちらは2024年7月の文書より前に書かれている。**どちらも、文書が挙げた支払いの遅れに答えたものではない。**\n\n**手続きの重さは、10年以上前から同じ形で指摘されている。** Dados（2013年6月）の論文が挙げた会計報告をめぐる障害と、2024年の文書が挙げた支払いの遅れは、**どちらもお金の手続きの側にある。**"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[],"sample":false},{"id":"ch-0001","name":"国境をまたぐ鉄道を通し、車で越えていた通勤を電車に移した","name_local":"Léman Express","country":"スイス","region":"ジュネーヴ州・ヴォー州（フランス側はアン県・オート＝サヴォワ県）","municipality":"ジュネーヴ（Grand Genève・越境圏）","population_current":null,"population_scale":"不明","purpose":"歩けるようにする","theme":"交通・道路・駅","start_year":2019,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"フランスとスイスの当局、運行は Lémanis","component_types":"hard","components":["国境をまたぐ新線を敷く","45の駅を1つの網につなぐ","越境の共通運賃を作る","運行間隔を詰めて本数を増やす","車の越境通勤を電車に移す"],"sources":[{"url":"https://www.lemanbleu.ch/fr/News/Une-premiere-annee-mouvementee-pour-le-Leman-Express.html","title":"Une première année mouvementée pour le Léman Express","outlet":"Léman Bleu","published":"2020-12-15","language":"fr","from_operator":false},{"url":"https://www.radiolac.ch/actualite/geneve/les-effets-du-leman-express-sur-la-mobilite-dans-le-grand-geneve/","title":"Les effets du Léman Express sur la mobilité dans le Grand Genève","outlet":"Radio Lac","published":"2022-06-28","language":"fr","from_operator":false},{"ur 0室を運営していたことを書いている。Espazium は2024年2月12日に、部屋がおよそ740室になり、そのうち6割ほどは公的な機関や民間の持ち主から借りた空いている住戸の中の共同住居、残る4割は協同組合が自分で建てた8棟の中にあると書いている。同記事によれば、部屋の家賃は自由市場より55％ほど低い。","誰が始めたか":"学生である。Basta! によれば、協同組合の正式な名はジュネーヴの大学・学生の不動産協同組合であり、当時の理事の一人は、ジュネーヴの空き住戸の率が0.2％であること、多くの学生が中心部から離れた場所や州の外に住まざるをえないことを説明している。同記事は、以前は空き家に住み着く形が多かったが、当局がそれを取り締まる方針に転じたと書いている。","いくらかかったか":"出典に事業費の記載が無い。Basta! は2010年10月4日に、入居する人が入るときに家賃1か月分にあたる社会持分を払うこと、家賃が平均で300スイスフランであることを書いている。","真似するなら最低何が必要か":"借りる形と持つ形を組み合わせられること。Basta! は2010年10月4日に、州から長期の借地で借りた土地の上に協同組合が持つ4棟によって150室の動かない土台があり、残りは空いた建物の安い賃借や貸してもらった住戸によって増減すると書いている。同記事は、一部の住戸が使用貸借の契約によるもので、取り壊しが決まった建物を持ち主が工事まで貸す形であり、持ち主はいつでも明け渡しを求められると書いている。","今どうなっているか":"Le Courrier は2025年5月26日に、協同組合が使える部屋が減ることを報じている。同記事は要約で160室、本文で130室と異なる数を書いており、写真の説明はアンリ・ボルディエ通りとコンコルド通りで65室を失うとしている。同紙は2026年4月14日に、協同組合が40年を迎える4月18日の3日前に、PAV（プレイユ＝アカシア＝ヴェルネ）の最初の街区でこれまでで最大の建物をレ・ヴェルネに開くと書いている。"},"completeness":"full","shelf":"main","recheck_year":null,"cost_jpy":[{"raw":"300スイスフラン","currency":"CHF","value":300,"jpy":59474}],"sample":false},{"id":"cl-0001","name":"5,000人以上の都市を対象から外した農村向け住宅補助をつくり、既存の家の改修まで入れた","name_local":"Programa de Habitabilidad Rural","name_variants":["Programa Habitabilidad Rural"],"country":"チリ","region":"全国（チリ全土）","municipality":"人口5,000人未満の農村・都市の集落（出典に出る例はビオビオ州とマウレ州サンラファエル）","population_current":null,"population_scale":"5万人未満","purpose":"住む人を増やす・戻す","theme":"住まいと暮らし（住宅・医療・福祉・子育て）","start_year":2015,"end_year":null,"status_current":"継続中","actor_type":"行政","lead_actor":"住宅都市計画省（MINVU）。地方では住宅都市計画公社（SERVIU）と農村管理事業体（Entidad de Gestión Rural）が実務を担う","funding_scale":"2024年予算法で2億9,000万ドルを計上したと報じられている。2020年の公募ではビオビオ州向けに43億ペソを充てると発表された","component_types":"hybrid","components":["人口5,000人以下の集落に限った","農村管理事業体が申請を代行する","既存住宅の改修と増築も対象にした","60歳以上は自己貯蓄を免除した","太陽光や太陽熱の設備に加点した","個人でも共同でも申請できる"],"sources":[{"url":"https://invi.uchilefau.cl/habitabilidad-rural/","title":"Mejoramiento de vivienda: La deuda con la habitabilidad rural.","outlet":"INVItro（チリ大学建築・都市計画学部 住宅研究所）","published":"2
